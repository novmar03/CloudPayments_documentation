name: Validate language versions
on:
  push:
    branches: [feature/manual-english-pages]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run check:html
      - run: npm run build
        env:
          DOCS_URL: https://novmar03.github.io
          DOCS_BASE_URL: /CloudPayments_documentation/
      - run: npm run build:html
      - run: npm test
      - run: npm run check:html
