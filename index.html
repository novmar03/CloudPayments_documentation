<script>
'use strict';
const data=JSON.parse(document.getElementById('document-data').textContent), groups=data.groups,pages=data.pages;
const main=document.getElementById('main'),sidebar=document.getElementById('sidebar'),menuButton=document.getElementById('menu-button');
let audience='all',lastRoute=null;
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const routeUrl=(id,anchor='')=>'#/'+id+(anchor?'@'+encodeURIComponent(anchor):'');
const visibleGroups=()=>groups.filter(g=>audience==='all'||g.audience===audience||g.audience==='both');
const symbols=['01','02','03','↔','</>','✓','Aa'];
function badge(g){return (g.audience!=='developer'?'<span class="badge">Для бизнеса</span>':'')+(g.audience!=='business'?'<span class="badge developer">Для разработчиков</span>':'')}
function closeMenu(){sidebar.classList.remove('open');menuButton.setAttribute('aria-expanded','false')}
function sidebarHtml(id){return '<a class="home-link '+(!id?'active':'')+'" href="#/">Об этом документе</a>'+groups.map(g=>'<details '+(g.items.some(p=>p.id===id)?'open':'')+'><summary>'+escapeHtml(g.title)+'</summary><div class="children">'+g.items.map(p=>'<a '+(id===p.id?'aria-current="page"':'')+' class="'+(id===p.id?'active':'')+'" href="'+routeUrl(p.id)+'">'+(p.id.includes('tech/methods/')?'Настройка: ':'')+escapeHtml(p.title)+'</a>').join('')+'</div></details>').join('')}
function overview(){const shown=visibleGroups();return '<div class="content-grid"><div><div class="eyebrow">ДОКУМЕНТАЦИЯ / ОБЗОР</div><h1>Об этом документе</h1><p class="lead">От выбора платежного решения до технического подключения.<br>Выберите, какие разделы вам нужны.</p><div class="filters" role="group" aria-label="Для кого документация">'+[['all','Все разделы'],['business','Для бизнеса'],['developer','Для разработчиков']].map(([v,label])=>'<button data-audience="'+v+'" aria-pressed="'+(v===audience)+'">'+(v!=='all'?'<span aria-hidden="true" class="marker '+v+'"></span>':'')+label+'</button>').join('')+'</div><div class="count" aria-live="polite">Разделов: '+shown.length+' · Страниц: '+shown.reduce((n,g)=>n+g.items.length,0)+'</div><div class="cards">'+shown.map(g=>'<section class="card '+g.audience+'" id="section-'+g.id+'"><div class="card-top"><span class="symbol">'+escapeHtml(symbols[groups.indexOf(g)])+'</span><span class="number">'+String(groups.indexOf(g)+1).padStart(2,'0')+'</span></div><h2>'+escapeHtml(g.title)+'</h2><p>'+escapeHtml(g.description)+'</p><div class="badges">'+badge(g)+'</div><ul>'+g.items.map(p=>'<li><a href="'+routeUrl(p.id)+'"><span>'+(p.id.includes('tech/methods/')?'Настройка: ':'')+escapeHtml(p.title)+'</span><span class="chevron">›</span></a></li>').join('')+'</ul></section>').join('')+'</div><div class="sources"><span>Источники</span><a target="_blank" rel="noopener noreferrer" href="https://developers.cloudpayments.ru/">Документация CloudPayments ↗</a><a target="_blank" rel="noopener noreferrer" href="https://cloudpayments.ru/help/payments">База знаний ↗</a></div></div><aside class="toc"><strong>На этой странице</strong>'+shown.map(g=>'<a href="'+routeUrl('','section-'+g.id)+'">'+escapeHtml(g.title)+'</a>').join('')+'</aside></div>'}
function article(p){const g=groups.find(g=>g.id===p.group),items=groups.flatMap(g=>g.items),index=items.findIndex(x=>x.id===p.id);return '<div class="content-grid"><article class="article"><div class="breadcrumb"><a href="#/">Об этом документе</a> / '+escapeHtml(g.title)+'</div><h1>'+escapeHtml(p.title)+'</h1><div class="badges">'+badge(g)+'</div>'+p.html+'<nav class="page-nav" aria-label="Соседние страницы">'+(index>0?'<a href="'+routeUrl(items[index-1].id)+'"><small>← Предыдущая страница</small>'+escapeHtml(items[index-1].title)+'</a>':'')+(index<items.length-1?'<a href="'+routeUrl(items[index+1].id)+'"><small>Следующая страница →</small>'+escapeHtml(items[index+1].title)+'</a>':'')+'</nav></article><aside class="toc"><strong>На этой странице</strong>'+p.toc.map(t=>'<a class="level-'+t.level+'" href="'+routeUrl(p.id,t.id)+'">'+escapeHtml(t.title)+'</a>').join('')+'</aside></div>'}
function render(){if(location.hash==='#main'){main.focus();return}const hash=location.hash.replace(/^#\/?/,''),at=hash.indexOf('@'),id=at<0?hash:hash.slice(0,at);let anchor='';try{anchor=at<0?'':decodeURIComponent(hash.slice(at+1))}catch{}const changed=id!==lastRoute;if(changed){sidebar.innerHTML=sidebarHtml(id);main.innerHTML=id?(pages[id]?article(pages[id]):'<h1>Страница не найдена</h1><a href="#/">Вернуться к оглавлению</a>'):overview();document.title=(pages[id]?.title||'Об этом документе')+' · CloudPayments';lastRoute=id;closeMenu()}if(anchor){requestAnimationFrame(()=>document.getElementById(anchor)?.scrollIntoView({block:'start'}))}else if(changed){window.scrollTo(0,0);main.focus({preventScroll:true})}}
main.addEventListener('click',e=>{const button=e.target.closest('[data-audience]');if(button){audience=button.dataset.audience;main.innerHTML=overview();main.querySelector('[data-audience="'+audience+'"]').focus();if(location.hash.includes('@'))history.replaceState(null,'','#/')}});
menuButton.addEventListener('click',()=>{const open=sidebar.classList.toggle('open');menuButton.setAttribute('aria-expanded',String(open))});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu()});window.addEventListener('hashchange',render);render();
</script></body></html>
