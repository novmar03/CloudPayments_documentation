Id,\n        userInfo: userInfo,\n        recurrent: recurrent\n    },\n    function (options) { // success\n        //действие при успешной оплате\n    },\n    function (reason, options) { // fail\n        //действие при неуспешной оплате\n    });\n};\n\n$(&#39;#checkout-sample-4&#39;).click(paySample4);\n\u003c/code>\u003c/pre>\u003c/div>\u003cp>В примере используется библиотека jquery.\u003c/p>\u003ch2 id=\"platezhi-po-podpiske\">\u003cstrong>Платежи по подписке\u003c/strong>\u003c/h2>\u003cp>Если вам нужно брать с ваших покупателей плату на регулярной основе, по расписанию, сценарий может быть следующим:\u003c/p>\u003cul>\u003cli>\u003cp>На вашем сайте необходима авторизация пользователей с доступом в личный кабинет.\u003c/p>\u003c/li>\u003cli>\u003cp>Перед созданием плана подписки, проинформируйте пользователя о тарифном плане, периодичности платежей и предложите указать карточные данные.\u003c/p>\u003c/li>\u003c/ul>\u003cp>\u003cbr>\u003c/p>\u003cfigure style=\"text-align:center\">\u003cimg data-image-id=\"54e7fc40-e786-4946-8e91-34efefbd8de7\" src=\"https://developers.cloudpayments.ru/images/recurrent-0b6616c5.png\" alt=\"recurrent\" style=\"width:100%;max-width:100%;height:auto\">\u003c/figure>\u003cul>\u003cli>\u003cp>В соответствии с вашим бизнес-процессом сделайте авторизацию на 1 рубль для проверки карты или оплату на сумму первого периода подписки.\u003c/p>\u003c/li>\u003cli>\u003cp>Получите токен карты через любой метод оплаты по API или \u003ca href=\"https://developers.cloudpayments.ru/#pay\" target=\"_blank\" rel=\"noopener noreferrer\">Pay-уведомление\u003c/a> и \u003ca href=\"https://developers.cloudpayments.ru/#sozdanie-podpiski-na-rekurrentnye-platezhi\" target=\"_blank\" rel=\"noopener noreferrer\">создайте план рекуррентных платежей\u003c/a>.\u003c/p>\u003c/li>\u003c/ul>\u003cp>Обязательным условием получения токена является передача идентификатора пользователя в параметре AccountId.\u003c/p>\u003cul>\u003cli>\u003cp>Подпишитесь на \u003ca href=\"https://developers.cloudpayments.ru/#fail\" target=\"_blank\" rel=\"noopener noreferrer\">Fail-\u003c/a> и \u003ca href=\"https://developers.cloudpayments.ru/#reccurent\" target=\"_blank\" rel=\"noopener noreferrer\">Recurrent\u003c/a>-уведомления. После получения уведомления о неуспешном платеже проинформируйте пользователя, что ему необходимо проверить карту. При окончании срока подписки или отмене завершите предоставление услуг.\u003c/p>\u003c/li>\u003cli>\u003cp>Сделайте раздел с историей платежей, которая включает в себя как минимум дату и сумму оплаты.\u003c/p>\u003c/li>\u003c/ul>\u003ch2 id=\"platezhi-v-odin-klik\">\u003cstrong>Платежи в один клик\u003c/strong>\u003c/h2>\u003cp>Если вам нужно сохранять данные карт на стороне платежного шлюза для последующей оплаты в один клик без ввода карточных данных и без 3-D Secure, сценарий может быть следующим:\u003c/p>\u003cul>\u003cli>\u003cp>На вашем сайте необходима авторизация пользователей с доступом в личный кабинет.\u003c/p>\u003c/li>\u003cli>\u003cp>При первой оплате предложите пользователю привязать карту, чтобы не вводить реквизиты при каждом платеже.\u003c/p>\u003c/li>\u003c/ul>\u003cfigure style=\"text-align:center\">\u003cimg data-image-id=\"45a250c5-ae28-4e29-a586-498dee17a93f\" src=\"https://developers.cloudpayments.ru/images/1cl-1-0149b3ed.png\" alt=\"1cl-1\" style=\"width:100%;max-width:100%;height:auto\">\u003c/figure>\u003cp>Если пользователь согласится, сохраните после оплаты в его профиле маску карты (тип и последние 4 цифры), а также токен. Параметры карты и токен система возвращает в \u003ca href=\"https://developers.cloudpayments.ru/#pay\" target=\"_blank\" rel=\"noopener noreferrer\">Pay\u003c/a>-уведомлении и через API.\u003c/p>\u003cp>\u003cbr>\u003c/p>\u003cp>Обязательным условием получения токена является передача идентификатора пользователя в параметре AccountId.\u003c/p>\u003cp>\u003cbr>\u003c/p>\u003cul>\u003cli>\u003cp>При последующих оплатах предлагайте пользователю оплатить с ранее привязанной карты.\u003c/p>\u003c/li>\u003c/ul>\u003cp>\u003cbr>\u003c/p>\u003cfigure style=\"text-align:center\">\u003cimg data-image-id=\"b0d212ad-40ad-4cac-9a22-8d6148da7c52\" src=\"https://developers.cloudpayments.ru/images/1cl-2-2ee547e2.png\" alt=\"1cl-2\" style=\"width:100%;max-width:100%;height:auto\">\u003c/figure>\u003cp>Если пользователь выбирает ранее использованную карту — вызывайте \u003ca href=\"https://developers.cloudpayments.ru/#oplata-po-tokenu-rekarring\" target=\"_blank\" rel=\"noopener noreferrer\">метод оплаты по токену\u003c/a> через API.\u003c/p>\u003cul>\u003cli>\u003cp>Предоставьте пользователю возможность управлять своими картами.\u003c/p>\u003c/li>\u003c/ul>\u003cp>\u003cbr>\u003c/p>\u003cfigure style=\"text-align:center\">\u003cimg data-image-id=\"0a06d763-8371-4c71-a6c1-a8905b2db89d\" src=\"https://developers.cloudpayments.ru/images/1cl-3-be99bab5.png\" alt=\"1cl-3\" style=\"width:100%;max-width:100%;height:auto\">\u003c/figure>\u003cp>Если пользователь не желает более платить с привязанной карты, удалите маску и токен из его профиля.\u003c/p>\u003cul>\u003cli>\u003cp>Сделайте раздел с историей платежей, которая включает в себя как минимум дату и сумму оплаты.\u003c/p>\u003c/li>\u003c/ul>\u003cp>\u003cbr>\u003c/p>\u003c/div>","toc":[{"id":"platezhnaya-forma","title":"Платежная форма","level":2},{"id":"registratsiya-platezhey","title":"Регистрация платежей","level":2},{"id":"proverka-i-registratsiya-platezhey","title":"Проверка и регистрация платежей","level":2},{"id":"avtoplatezhi-dlya-internet-provayderov","title":"Автоплатежи для интернет-провайдеров","level":2},{"id":"avtoplatezhi-dlya-blagotvoritelnyh-fondov","title":"Автоплатежи для благотворительных фондов","level":2},{"id":"platezhi-po-podpiske","title":"Платежи по подписке","level":2},{"id":"platezhi-v-odin-klik","title":"Платежи в один клик","level":2}]},"pci-dss":{"id":"pci-dss","title":"PCI DSS","type":"page","audience":"both","group":"root-pci-dss","html":"\u003cdiv class=\"imported-api\">\u003cp>PCI DSS — стандарт информационной безопасности, принятый в индустрии платежных карт Visa и Mastercard. Соблюдать требования стандарта обязаны все компании, которые принимают карты к оплате. Некоторым компаниям необходимо подтверждать свое соответствие.\u003c/p>\u003ch2 id=\"sootvetstvie-trebovaniyam\">\u003cstrong>Соответствие требованиям\u003c/strong>\u003c/h2>\u003cp>Основное требование стандарта — максимально ограничить доступ к данным платежных карт. Оптимальное решение — вообще не иметь к ним доступа, а вместо этого использовать сертифицированных провайдеров для приема платежей. На практике это означает, что нельзя ни запрашивать, ни передавать номера карт. Если при звонке клиент говорит, что не проходит платеж, и начинает диктовать номер, нужно его прервать и объяснить, почему вы не можете получать данные карты. Если присылает по почте или скайпу — удалять сообщение и сообщать, что передавать данные карты небезопасно.\u003c/p>\u003cp>К охраняемым данным относятся полный номер карты и код CVV2/CVC2 (последние 3 цифры на обратной стороне). Имя владельца, срок действия и маскированный номер карты (первые 6 и последние 4 цифры) в защите по требованиям стандарта не нуждаются, поэтому их можно использовать в разумных пределах.\u003c/p>\u003ch2 id=\"sootvetstvie-pci-dss-vmeste-s-cloudpayments\">\u003cstrong>Соответствие PCI DSS вместе с CloudPayments\u003c/strong>\u003c/h2>\u003cp>CloudPayments — сертифицированный сервис-провайдер с максимальным уровнем соответствия PCI DSS, предоставляющим право хранить данные платежных карт и обрабатывать более 6 миллионов платежей ежегодно. Подтверждение соответствия проходит каждый год в рамках сертификационного аудита.\u003c/p>\u003cp>Все платежные инструменты CloudPayments спроектированы таким образом, что при их использовании вы автоматически соответствуете требованиям по безопасности. Дополнительных мер предпринимать не нужно.\u003c/p>\u003cp>Исключением является прием платежей по технологии \u003ca href=\"https://developers.cloudpayments.ru/#skript-checkout\" target=\"_blank\" rel=\"noopener noreferrer\">Checkout\u003c/a>. Для использования необходимо подтверждать соответствие: заполнить лист самооценки и ежеквартально проверять сайт на уязвимости специальным сканером.\u003c/p>\u003ch2 id=\"tehnologiya-checkout\">\u003cstrong>Технология Checkout\u003c/strong>\u003c/h2>\u003cp>\u003ca href=\"https://developers.cloudpayments.ru/#skript-checkout\" target=\"_blank\" rel=\"noopener noreferrer\">Checkout\u003c/a> — уникальная технология токенизации карт для приема платежей на вашем сайте, в форме без встроенных iframe элементов, что дает максимальный контроль и конверсию прохождения платежей. Данные платежных карт шифруются в браузере покупателя, поэтому ваш сайт не принимает участие в обработке и хранении номеров, что значительно сокращает область применения требований PCI DSS. Тем не менее, сайт влияет на безопасность карточных данных и для его защиты необходимо выполнять сканирование не менее одного раза в квартал для поиска вирусов и уязвимостей. Сканирование должно проводиться аккредитованным вендором (ASV) из списка, представленного на сайте совета PCI.\u003c/p>\u003ch2 id=\"asv-skanirovanie\">\u003cstrong>ASV-сканирование\u003c/strong>\u003c/h2>\u003cp>ASV-сканирование — автоматизированная проверка вашего сайта на наличие уязвимостей. Сканер проверяет наличие вирусов, известных уязвимостей, таких как XSS, SQL Injections и так далее, после чего составляет детальный отчет с инструкцией по устранению проблем, если они были обнаружены.\u003c/p>\u003cp>Использование сканера необходимо для приема платежей по технологии \u003ca href=\"https://developers.cloudpayments.ru/#skript-checkout\" target=\"_blank\" rel=\"noopener noreferrer\">Checkout\u003c/a>, для остальных инструментов — виджет, мобильный SDK, рекарринг и рекуррент — его использование не требуется.\u003c/p>\u003cp>Выбор вендора для сканирования остается на ваше усмотрение, но он должен быть из \u003ca href=\"https://www.pcisecuritystandards.org/assessors_and_solutions/approved_scanning_vendors\" target=\"_blank\" rel=\"noopener noreferrer\">списка на сайте совета PCI\u003c/a>.\u003c/p>\u003c/div>","toc":[{"id":"sootvetstvie-trebovaniyam","title":"Соответствие требованиям","level":2},{"id":"sootvetstvie-pci-dss-vmeste-s-cloudpayments","title":"Соответствие PCI DSS вместе с CloudPayments","level":2},{"id":"tehnologiya-checkout","title":"Технология Checkout","level":2},{"id":"asv-skanirovanie","title":"ASV-сканирование","level":2}]},"online-kassa":{"id":"online-kassa","title":"Онлайн-касса для интернет-расчетов","type":"page","audience":"both","group":"root-online-kassa","html":"\u003cdiv class=\"imported-api\">\u003ch2 id=\"54-fz\">\u003cstrong>54-ФЗ\u003c/strong>\u003c/h2>\u003cp>Закон 54-ФЗ &quot;О применении контрольно-кассовой техники&quot; с изменениями от 03.07.2016 предписывает интернет-сервисам при осуществлении расчетов с использованием электронного средства платежа (в т.ч. банковской картой) использовать контрольно-кассовую технику (ККТ) и отправлять покупателю электронный чек в момент расчета.\u003c/p>\u003ch2 id=\"osnovnye-polozheniya-zakona\">\u003cstrong>Основные положения закона\u003c/strong>\u003c/h2>\u003cul>\u003cli>\u003cp>Необходимо использовать кассу нового образца с установленным фискальным накопителем (ФН).\u003c/p>\u003c/li>\u003cli>\u003cp>Необходимо заключить договор с \u003ca href=\"https://developers.cloudpayments.ru/#operatory-fiskalnyh-dannyh\" target=\"_blank\" rel=\"noopener noreferrer\">оператором фискальных данных\u003c/a> (ОФД) для передачи данных с ККТ в режиме онлайн в ФНС.\u003c/p>\u003c/li>\u003cli>\u003cp>Необходимо указывать в чеке все товарные позиции: наименование, цена, количество, сумма, ставка НДС.\u003c/p>\u003c/li>\u003cli>\u003cp>Необходимо подключить кассу к интернету.\u003c/p>\u003c/li>\u003cli>\u003cp>Необходимо выдавать чек покупателю непосредственно в момент расчета: для интернет-платежей с использованием банковской карты отправлять чек на e-mail или телефон.\u003c/p>\u003c/li>\u003cli>\u003cp>Необходимо менять ФН в двух случаях:\u003cbr>\u003c/p>\u003cul>\u003cli>\u003cp>по истечении его срока действия;\u003c/p>\u003c/li>\u003cli>\u003cp>при заполнении памяти до истечения срока действия;\u003cbr>и хранить его в течение 5-ти лет.\u003c/p>\u003c/li>\u003c/ul>\u003c/li>\u003cli>\u003cp>Нет необходимости заключать договор с ЦТО на обслуживание.\u003c/p>\u003c/li>\u003cli>\u003cp>Нет необходимости предъявлять кассу инспектору ФНС, все регистрационные действия можно выполнить дистанционно в личном кабинете налогоплательщика на сайте ФНС.\u003c/p>\u003c/li>\u003c/ul>\u003ch2 id=\"onlayn-fiskalizatsiya\">\u003cstrong>Онлайн-фискализация\u003c/strong>\u003c/h2>\u003cp>Компания CloudPayments предлагает своим партнерам облачное решение &quot;под ключ&quot; для онлайн-фискализации интернет-платежей, и в рамках соблюдения закона 54-ФЗ для любого бизнеса вы получите:\u003c/p>\u003cul>\u003cli>\u003cp>выделенную онлайн-кассу, зарегистрированную в ФНС на вашу компанию;\u003c/p>\u003c/li>\u003cli>\u003cp>фискальный накопитель;\u003c/p>\u003c/li>\u003cli>\u003cp>подключение к оператору фискальных данных;\u003c/p>\u003c/li>\u003cli>\u003cp>автоматическое формирование чеков прихода и возврата в момент проведения расчета;\u003c/p>\u003c/li>\u003cli>\u003cp>полный отчет по операциям в личном кабинете.\u003c/p>\u003c/li>\u003c/ul>\u003cp>Касса будет находиться в дата-центре 24/7, с подключением к интернету и питанию, работать круглосуточно и без перебоев. Наши сотрудники будут следить за ее техническим состоянием и своевременно менять фискальные накопители, а специальное программное обеспечение — корректировать ошибки, открывать и закрывать смену по расписанию, в &quot;облаке&quot; ставить чеки в очередь при большой нагрузке и гарантированно отправлять покупателям.\u003c/p>\u003cp>\u003cbr>\u003c/p>\u003cfigure style=\"text-align:center\">\u003cimg data-image-id=\"a2f317f0-63fa-4cc4-91a7-978b7ee88b32\" src=\"https://developers.cloudpayments.ru/images/cloud-scheme-7a60ffb1.png\" alt=\"cloud-scheme\" style=\"width:100%;max-width:100%;height:auto\">\u003c/figure>\u003ch2 id=\"onlayn-kassa\">\u003cstrong>Онлайн-касса\u003c/strong>\u003c/h2>\u003cp>Мы используем кассы MicroPay-ФАС и MicroPay-ФС с подключением к любому \u003ca href=\"https://developers.cloudpayments.ru/#operatory-fiskalnyh-dannyh\" target=\"_blank\" rel=\"noopener noreferrer\">оператору фискальных данных\u003c/a>.\u003c/p>\u003cp>\u003cbr>\u003c/p>\u003cfigure style=\"text-align:center\">\u003cimg data-image-id=\"3fc2d3b8-d54f-4fd6-9cea-9610c9014ea4\" src=\"https://developers.cloudpayments.ru/images/cash_registers-7f581163.png\" alt=\"cash_registers\" style=\"width:100%;max-width:100%;height:auto\">\u003c/figure>\u003ch3 id=\"stoimost\">\u003cstrong>Стоимость\u003c/strong>\u003c/h3>\u003cp>Стоимость услуг по онлайн-фискализации и сопровождению можно узнать на сайте сервиса \u003ca href=\"https://cloudkassir.ru/\" target=\"_blank\" rel=\"noopener noreferrer\">CloudKassir\u003c/a> и/или уточнить у менеджера.\u003c/p>\u003ch2 id=\"poryadok-podklyucheniya\">\u003cstrong>Порядок подключения\u003c/strong>\u003c/h2>\u003cp>Для подключения услуги онлайн-фискализации необходимо:\u003c/p>\u003cul>\u003cli>\u003cp>подключиться к сервису онлайн фискализации CloudKassir;\u003c/p>\u003c/li>\u003cli>\u003cp>получить квалифицированную электронную подпись для работы с сайтом ФНС;\u003c/p>\u003c/li>\u003cli>\u003cp>зарегистрироваться в личном кабинете налоговой службы: — для юридических лиц — для индивидуальных предпринимателей;\u003c/p>\u003c/li>\u003cli>\u003cp>заключить договор на онлайн-фискализацию с CloudKassir.\u003c/p>\u003c/li>\u003c/ul>\u003cp>После подписания договора и оплаты счета вам будут предоставлены номер ККТ и ФН для регистрации в ФНС.\u003c/p>\u003ch2 id=\"format-peredachi-dannyh-dlya-onlayn-cheka\">\u003cstrong>Формат передачи данных для онлайн-чека\u003c/strong>\u003c/h2>\u003cp>В данном разделе описаны параметры объекта \u003cstrong>receipt\u003c/strong>, который передается в рамках вызова виджета или платежного конструктора и отвечает за формирование чека.\u003c/p>\u003cp>Описание параметров для формирования объекта \u003cstrong>СustomerReceipt\u003c/strong> в рамках вызова API CloudKassir смотрите в документации сервиса \u003ca href=\"https://developers.cloudkassir.ru/#customerreceipt\" target=\"_blank\" rel=\"noopener noreferrer\">CloudKassir\u003c/a>.\u003c/p>\u003cp>Данные для чека в рамках вызова виджета или платежного конструктора необходимо передавать в формате json по примеру ниже:\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>text\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-1\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-1\" class=\"language-text\">var receipt = {\n        Items: [ \n            {\n                label: &quot;Пластырь&quot;, // - обязательное поле\n                price: 500, // цена одного товара - обязательное поле\n                quantity: 1, // количество товара - обязательное поле\n                amount: 500, // Сумма товара (price x quantity) - обязательное поле\n                vat: 20, // Ставка НДС - обязательное поле,\n            },\n            {\n                label: &quot;Доставка&quot;, //, обязательное поле\n                price: 500, // цена одного товара, обязательное поле\n                quantity: 1, // количество товара, обязательное поле\n                amount: 500, // сумма товара (price x quantity), обязательное поле\n                vat : 20, // ставка НДС, обязательное поле\n            }\n        ],\n        amounts : {\n            electronic: 1000 // Сумма оплаты электронными деньгами\n        }\n    };\n\n    const intentParams = {\n      publicTerminalId: &quot;test_api_00000000000000000000002&quot;, // идентификатор терминала\n      description: &quot;Basket of oranges&quot;, // описание списания\n      paymentSchema: &#39;Single&#39;, // схема\n      currency: &quot;RUB&quot;, // валюта\n      amount: 1000, // сумма\n      receipt: receipt\n    }\n\nwidget.start(intentParams).then(function(widgetResult) {\n    console.log(&#39;result&#39;, widgetResult);\n}).catch(function(error) {\n    console.log(&#39;error&#39;, error);\n});\n\u003c/code>\u003c/pre>\u003c/div>\u003cp>\u003cstrong>Пример использования \u003c/strong>\u003cstrong>\u003ca href=\"https://developers.cloudpayments.ru/#spisok-tovarov\" target=\"_blank\" rel=\"noopener noreferrer\">списка товаров\u003c/a>\u003c/strong>:\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>text\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-2\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-2\" class=\"language-text\">var receipt = {\n        Items: [ \n            {\n                id: &quot;some_id_1&quot;, // id для поиска товара в списке товаров\n                // label: &quot;Пластырь&quot;, // - не передаём, так как берём из списка товаров\n                // price: 500, // не передаём, так как берём из списка товаров\n                // quantity: 1, // не передаём, так как берём из списка товаров\n                amount: 500, // Сумма товара (items.price x items.count) - обязательное поле\n                vat: 20, // Ставка НДС - обязательное поле,\n            },\n            {\n                id: &quot;some_id_2&quot;, // id для поиска товара в списке товаров\n                // label: &quot;Доставка&quot;, //, не передаём, так как берём из списка товаров\n                // price: 500, // не передаём, так как берём из списка товаров\n                // quantity: 1, // не передаём, так как берём из списка товаров\n                amount: 500, // сумма товара (items.price x items.count) - обязательное поле\n                vat : 20, // ставка НДС, обязательное поле\n            }\n        ],\n        amounts : {\n            electronic: 1000 // Сумма оплаты электронными деньгами\n        }\n    };\n\nvar items = [\n              {\n                id: &quot;some_id_1&quot;,\n                count: 1.0,\n                name: &quot;Пластырь&quot;,\n                price: 500,\n              },\n              {\n                id: &quot;some_id_2&quot;,\n                count: 1.0,\n                name: &quot;Доставка&quot;,\n                price: 500,\n              },\n            ],\n\n    const intentParams = {\n      publicTerminalId: &quot;test_api_00000000000000000000002&quot;, // идентификатор терминала\n      description: &quot;Basket of oranges&quot;, // описание списания\n      paymentSchema: &#39;Single&#39;, // схема\n      currency: &quot;RUB&quot;, // валюта\n      amount: 1000, // сумма\n      receipt: receipt,\n      items: items\n    }\n\nwidget.start(intentParams).then(function(widgetResult) {\n    console.log(&#39;result&#39;, widgetResult);\n}).catch(function(error) {\n    console.log(&#39;error&#39;, error);\n});\n\u003c/code>\u003c/pre>\u003c/div>\u003ch2 id=\"usloviya-uspeshnogo-sozdaniya-cheka\">\u003cstrong>Условия успешного создания чека\u003c/strong>\u003c/h2>\u003cul>\u003cli>\u003cp>В чеке есть хотя бы одна позиция;\u003c/p>\u003c/li>\u003cli>\u003cp>Во всех позициях указано наименование;\u003c/p>\u003c/li>\u003cli>\u003cp>Цена и сумма позиции не отрицательная;\u003c/p>\u003c/li>\u003cli>\u003cp>Общая сумма всех позиций больше нуля;\u003c/p>\u003c/li>\u003cli>\u003cp>Входная строка наименования товара длиной не более 128 символов, более длинные строки будут обрезаны;\u003c/p>\u003c/li>\u003cli>\u003cp>Указанная система налогообложения должна совпадать с одним из вариантов, зарегистрированных в ККТ;\u003c/p>\u003c/li>\u003cli>\u003cp>Числовые значения переданы с точностью не более двух знаков после точки;\u003c/p>\u003c/li>\u003cli>\u003cp>Передан ИНН, если он требуется в документации.\u003c/p>\u003c/li>\u003c/ul>\u003cp>Данные для онлайн-чека можно передавать в \u003ca href=\"https://developers.cloudpayments.ru/#parametry\" target=\"_blank\" rel=\"noopener noreferrer\">параметры виджета\u003c/a>, при \u003ca href=\"https://developers.cloudpayments.ru/#oplata-po-kriptogramme\" target=\"_blank\" rel=\"noopener noreferrer\">оплате по криптограмме\u003c/a> или \u003ca href=\"https://developers.cloudpayments.ru/#oplata-po-tokenu-rekarring\" target=\"_blank\" rel=\"noopener noreferrer\">токену\u003c/a>, при \u003ca href=\"https://developers.cloudpayments.ru/#podtverzhdenie-oplaty\" target=\"_blank\" rel=\"noopener noreferrer\">подтверждении оплаты\u003c/a>, при \u003ca href=\"https://developers.cloudpayments.ru/#vozvrat-deneg\" target=\"_blank\" rel=\"noopener noreferrer\">проведении возврата\u003c/a>, а также через специальный \u003ca href=\"https://developers.cloudkassir.ru/#api-kassy\" target=\"_blank\" rel=\"noopener noreferrer\">API кассы\u003c/a>.\u003c/p>\u003ch2 id=\"otpravka-pokupatelyu-onlayn-cheka\">\u003cstrong>Отправка покупателю онлайн-чека\u003c/strong>\u003c/h2>\u003cp>На выбор покупателя кассовый чек необходимо отправить в письме на e-mail адрес или в СМС, Viber, WhatsApp, Telegram сообщении на номер телефона. Чек может быть отправлен системой CloudPayments автоматически, при условии передачи e-mail адреса или номера телефона покупателя, или же вы самостоятельно можете отправлять чек — все необходимые реквизиты система передает в уведомлении \u003ca href=\"https://developers.cloudkassir.ru/#receipt\" target=\"_blank\" rel=\"noopener noreferrer\">Receipt\u003c/a>.\u003c/p>\u003ch2 id=\"moment-otpravki-cheka\">\u003cstrong>Момент отправки чека\u003c/strong>\u003c/h2>\u003cp>Чек должен быть отправлен покупателю в момент расчета. Для \u003ca href=\"https://developers.cloudpayments.ru/#shemy-provedeniya-platezha\" target=\"_blank\" rel=\"noopener noreferrer\">одностадийных платежей\u003c/a> чек формируется сразу же после прохождения оплаты, для \u003ca href=\"https://developers.cloudpayments.ru/#shemy-provedeniya-platezha\" target=\"_blank\" rel=\"noopener noreferrer\">двухстадийных\u003c/a> — при подтверждении операции.\u003c/p>\u003cp>Формирование и отправка чека происходит после обновления статуса транзакции на “Завершена“ и выполняются процессы асинхронно. Для чего может потребоваться некоторое время.\u003c/p>\u003ch2 id=\"testirovanie-onlayn-cheka\">\u003cstrong>Тестирование онлайн-чека\u003c/strong>\u003c/h2>\u003cp>При работе в тестовом режиме кассовые чеки будут формироваться в демонстрационной ККТ с отладочным фискальным накопителем. Вы можете передать \u003ca href=\"https://developers.cloudpayments.ru/#format-peredachi-dannyh-dlya-onlayn-cheka\" target=\"_blank\" rel=\"noopener noreferrer\">данные для онлайн-чека\u003c/a> при оплате в тестовом режиме и проверить работу онлайн-кассы.\u003c/p>\u003c/div>","toc":[{"id":"54-fz","title":"54-ФЗ","level":2},{"id":"osnovnye-polozheniya-zakona","title":"Основные положения закона","level":2},{"id":"onlayn-fiskalizatsiya","title":"Онлайн-фискализация","level":2},{"id":"onlayn-kassa","title":"Онлайн-касса","level":2},{"id":"stoimost","title":"Стоимость","level":3},{"id":"poryadok-podklyucheniya","title":"Порядок подключения","level":2},{"id":"format-peredachi-dannyh-dlya-onlayn-cheka","title":"Формат передачи данных для онлайн-чека","level":2},{"id":"usloviya-uspeshnogo-sozdaniya-cheka","title":"Условия успешного создания чека","level":2},{"id":"otpravka-pokupatelyu-onlayn-cheka","title":"Отправка покупателю онлайн-чека","level":2},{"id":"moment-otpravki-cheka","title":"Момент отправки чека","level":2},{"id":"testirovanie-onlayn-cheka","title":"Тестирование онлайн-чека","level":2}]},"testirovaniye":{"id":"testirovaniye","title":"Тестирование","type":"page","audience":"both","group":"root-testirovaniye","html":"\u003cdiv class=\"imported-api\">\u003cp>Сразу после создания нового сайта в ЛК он находится в тестовом режиме работы — это значит, что платежи и прочие операции будут проходить в режиме эмуляции.\u003c/p>\u003cp>Для тестирования можно использовать карты:\u003c/p>\u003cdiv class=\"api-table-scroll\" tabindex=\"0\" aria-label=\"Таблица\">\u003ctable>\u003ctr>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Тип\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Номер карты\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Результат оплаты\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Результат оплаты по токену\u003c/p>\u003c/th>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Карта Visa с 3-D Secure\u003c/p>\u003c/td>\ p>Значение memberId отсутствует в ОПКЦ СБП\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Невозможно провести оплату\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>6017\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>IncorrectMCCategory\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Выполнение операций в данной категории ТСП запрещено\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Невозможно провести оплату\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>6021\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Receiver Account Error\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>У получателя нет расчетного счета в этом банке\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Невозможно провести выплату\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>6022\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Receiver Name Error\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>У получателя нет расчетного счета в этом банке. ФИО некорректное\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Невозможно провести выплату\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>6025\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>CrossTerminalTokenRestriction\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Запрет кросстерминальных оплат\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Невозможно провести оплату\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cp>Для регулярных платежей необходимо установить ограничения на отправку повторных запросов, в случае если были получены коды ошибок из группы «Безусловно негативные». Таким образом, последующие регулярные платежи проходить не будут, необходимо повторно провести установочную операцию.\u003cbr>\u003cbr>Безусловно негативные\u003cbr>5057 Transaction Not Permitted\u003cbr>5003 Invalid Merchant\u003cbr>5017 Customer Cancellation\u003cbr>5033 Expired Card Pickup\u003cbr>5034 Suspected Fraud\u003cbr>5001 Refer To Card Issuer\u003cbr>5012 Invalid Transaction\u003cbr>\u003cbr>При 2-ух попытках из группы «Условно негативные» и «Временно негативные» будет происходить блокировка проведения оплаты в течение 24-х часов (суток). Таким образом, данное правило необходимо учесть на своей стороне для кодов ошибок ниже.\u003cbr>\u003cbr>Условно негативные\u003cbr>5005 Do Not Honor\u003cbr>5055 Invalid PIN\u003cbr>5063 Security Violation\u003cbr>5014 Invalid Card Number\u003cbr>5030 Format Error\u003cbr>5013 Amount Error\u003cbr>5054 Expired Card\u003cbr>\u003cbr>Временно негативные\u003cbr>5065 Exceed Withdrawal Frequency\u003cbr>5096 System Error\u003cbr>5051 Insufficient Funds\u003c/p>\u003ch2 id=\"kody-obrabotki-otvetov-na-check-uvedomlenie\">\u003cstrong>Коды обработки ответов на check уведомление\u003c/strong>\u003c/h2>\u003cp>Ниже предоставлены код регистрации ответов вашего сервиса на \u003ca href=\"https://developers.cloudpayments.ru/#check\" target=\"_blank\" rel=\"noopener noreferrer\">check\u003c/a>-уведомление\u003c/p>\u003cp>Код отображается в детализации транзакции, а также в системном журнале в ЛК.\u003c/p>\u003cdiv class=\"api-table-scroll\" tabindex=\"0\" aria-label=\"Таблица\">\u003ctable>\u003ctr>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Код\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Название\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Причина\u003c/p>\u003c/th>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>3001\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>InvalidInvoiceId\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обработчик уведомления вернул \u003ccode>{&quot;code&quot;:10}\u003c/code>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>30
