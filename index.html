обов оплаты","items":[{"id":"tech/widget","title":"Виджет"},{"id":"tech/blocks","title":"Платежные блоки"},{"id":"tech/checkout","title":"Скрипт check-out"},{"id":"tech/orders","title":"Одноразовые ссылки"},{"id":"tech/links","title":"Многоразовые ссылки"},{"id":"tech/charity","title":"Благотворительность"},{"id":"tech/infoshop","title":"Инфошоп"},{"id":"tech/sdk","title":"Мобильные SDK"},{"id":"tech/api","title":"API"},{"id":"tech/notifications","title":"Уведомления"},{"id":"tech/methods/tpay","title":"T-Pay"},{"id":"tech/methods/sbp","title":"СБП"},{"id":"tech/methods/digital","title":"Цифровой рубль"},{"id":"tech/methods/sberpay","title":"СберПэй"},{"id":"tech/methods/mirpay","title":"МирПэй"},{"id":"tech/methods/dolyami","title":"Долями"}]},{"id":"security","title":"Информационная безопасность","audience":"developer","description":"Требования PCI DSS и защита карточных данных","items":[{"id":"security","title":"Информационная безопасность"}]},{"id":"reference","title":"Тестирование, справочники и глоссарий","audience":"developer","description":"Проверка интеграции и справочные материалы","items":[{"id":"reference/testing","title":"Тестирование"},{"id":"reference/directory","title":"Справочник"},{"id":"reference/glossary","title":"Глоссарий"},{"id":"reference/ecosystem","title":"Экосистема CloudPayments"}]}],"pages":{"start/connect":{"id":"start/connect","title":"Процесс подключения","group":"start","html":"\u003cdiv class=\"imported-api\">\u003ch2 id=\"интернет-эквайринг-cloudpayments\">\u003cstrong>Интернет-эквайринг CloudPayments\u003c/strong>\u003c/h2>\u003cp>Это сервис для приема онлайн-платежей банковскими картами, с помощью альтернативных Pay-методов без ввода данных карты, а также в рассрочку и Долями. CloudPayments позволяет безопасно принимать оплату на сайте, в приложении или в социальных сетях через ссылки.\u003c/p>\u003ch4 id=\"section-3ef06271-9466-495f-9d16-a5eaf4e86838\">\u003cstrong>Зачем подключать CloudPayments\u003c/strong>\u003c/h4>\u003cp>Чтобы упростить процесс оплаты для клиентов, увеличить количество завершенных покупок и расширить выбор методов оплаты.\u003c/p>\u003ch4 id=\"section-b0f63321-271d-4c9a-83d3-7d9657b2b970\">\u003cstrong>Кому подходит\u003c/strong>\u003c/h4>\u003cp>Любому онлайн-бизнесу\u003c/p>\u003ch2 id=\"этапы-подключения\">\u003cstrong>Этапы подключения\u003c/strong>\u003c/h2>\u003cfigure style=\"text-align:center\">\u003cimg src=\"static/img/editor/054c2830a11a515738b863819ba36934d2b56e994f259a55ddd7f2d12c8a6890.png\" alt=\"Этапы подключения интернет-эквайринга CloudPayments: регистрация личного кабинета, заполнение и проверка анкеты, верификационный платеж, перевод сайта в боевой режим и проверка работы.\" style=\"width:100%;max-width:100%;height:auto\">\u003c/figure>\u003ch2 id=\"контакт-поддержки\">\u003cbr>\u003cstrong>Контакт поддержки\u003c/strong>\u003c/h2>\u003cp>\u003cstrong>По вопросам сопровождения и развития бизнеса:\u003c/strong>\u003c/p>\u003cp>Телефон: \u003ca href=\"tel:74953747860\">+7(495)374-78-60\u003c/a>\u003c/p>\u003cp>Отдел продаж: \u003ca href=\"mailto:sales@cp.ru\">sales@cp.ru\u003c/a>\u003c/p>\u003cdiv style=\"text-align:center;margin:24px 0\">\u003ca href=\"https://cloudpayments.ru/form/residents\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;background:#326dff;color:#fff;text-decoration:none;border-radius:12px;padding:12px 20px;max-width:100%;width:240px;min-height:56px;font-size:18px;font-weight:600\">Подключить\u003c/a>\u003c/div>\u003cp>\u003cbr>\u003c/p>\u003c/div>","toc":[{"id":"интернет-эквайринг-cloudpayments","title":"Интернет-эквайринг CloudPayments","level":2},{"id":"section-3ef06271-9466-495f-9d16-a5eaf4e86838","title":"Зачем подключать CloudPayments","level":4},{"id":"section-b0f63321-271d-4c9a-83d3-7d9657b2b970","title":"Кому подходит","level":4},{"id":"этапы-подключения","title":"Этапы подключения","level":2},{"id":"контакт-поддержки","title":"Контакт поддержки","level":2}]},"start/account":{"id":"start/account","title":"Личный кабинет мерчанта","group":"start","html":"\u003cdiv class=\"imported-api\">\u003ch2 id=\"что-такое-личный-кабинет\">Что такое личный кабинет\u003c/h2>\u003cp>Личный кабинет CloudPayments — это многофункциональный инструмент для работы с транзакциями, чеками, статистикой и документами. Доступ в Личный кабинет выдается при подключении к CloudPayments и/или CloudKassir.\u003c/p>\u003cfigure style=\"text-align:center\">\u003cimg src=\"static/img/editor/72cf4034f26281b4c1efa11d37782c1c06fada0f98fffd1ce1dfd0ba2f902b51.png\" alt=\"652362ec-3ece-405d-92a5-5a4ff864dd8a.png\" style=\"width:67%;max-width:100%;height:auto\">\u003c/figure>\u003cdiv style=\"text-align:center;margin:24px 0\">\u003ca href=\"https://merchant.cloudpayments.ru/\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;background:#326dff;color:#fff;text-decoration:none;border-radius:12px;padding:12px 20px;max-width:100%;width:240px;min-height:56px;font-size:18px;font-weight:600\">ЛИЧНЫЙ КАБИНЕТ\u003c/a>\u003c/div>\u003ch2 id=\"section-92858179-e1ac-4b16-9013-912ce1db74f7\">\u003cstrong>Что можно делать в Личном кабинете\u003c/strong>\u003c/h2>\u003cul>\u003cli>\u003cp>Формировать отчеты\u003c/p>\u003c/li>\u003cli>\u003cp>Анализировать статистику по оборотам и транзакциям\u003c/p>\u003c/li>\u003cli>\u003cp>Отслеживать транзакции и делать возвраты\u003c/p>\u003c/li>\u003cli>\u003cp>Формировать платежные ссылки, подключать новые сайты и настраивать виджеты для оплаты\u003c/p>\u003c/li>\u003cli>\u003cp>Следить за актуальными новостями CloudPayments\u003c/p>\u003c/li>\u003cli>\u003cp>И многое другое\u003c/p>\u003c/li>\u003c/ul>\u003cp>\u003cbr>\u003c/p>\u003cp>\u003cbr>\u003c/p>\u003ch2 id=\"section-e2e98d35-9d27-40ca-b29c-d2c9c9c95278\">\u003cstrong>Как начать работу в Личном кабинете\u003c/strong>\u003c/h2>\u003col start=\"1\">\u003cli>\u003cp>Авторизуйтесь по ссылке — вы получаете ее при подключении CloudPayments и/или CloudKassir\u003c/p>\u003c/li>\u003cli>\u003cp>Добавьте сайты, на которых вы планируете принимать онлайн-платежи\u003c/p>\u003c/li>\u003cli>\u003cp>Добавьте сотрудников и назначьте им роль для совместной работы, \u003ca href=\"https://static.cloudpayments.ru/docs/kak_sozdat_akkaunt_dlya_sotrudnika.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">инструкция →\u003c/a>\u003c/p>\u003c/li>\u003c/ol>\u003ch2 id=\"section-7ccbb848-c34a-4211-a8a2-a4f977ef7426\">\u003cstrong>Как Личный кабинет помогает вашему бизнесу\u003c/strong>\u003c/h2>\u003cp>В Личном кабинете CloudPayments есть инструменты, которые помогут вам найти точки роста, о них рассказали ниже.\u003c/p>\u003ch3 id=\"section-50bac298-053c-42e0-9ec1-39630e646138\">\u003cstrong>Увеличение продаж\u003c/strong>\u003c/h3>\u003cp>\u003cstrong>Расширенная аналитика:\u003c/strong>\u003cbr>В разделе Статистика можно сегментировать плательщиков по множеству фильтров, например: по городам, методам оплаты, платежным системам. Это помогает улучшать стратегию продаж, влиять на увеличение выручки и других бизнес-показателей.\u003c/p>\u003cp>\u003cstrong>Расшифровка ошибок:\u003c/strong>\u003cbr>В разделе Транзакции вы можете видеть, какие оплаты прошли, а какие нет. Неуспешные транзакции обозначены красным цветом, рядом с ними указана подробная информация о причинах — почему оплата не прошла. На карте клиента не хватило средств или данные карты были введены с ошибкой — передайте информацию в отдел продаж, и менеджеры «дожмут» оплату до успеха.\u003c/p>\u003ch3 id=\"section-5975e931-8be0-4946-b43e-708428237284\">\u003cstrong>Увеличение конверсии\u003c/strong>\u003c/h3>\u003cp>Чем больше способов оплаты для клиента, тем выше конверсия. Вы можете включить дополнительные методы оплат в разделе Сайты. Так вы снизите количество «брошенных корзин» и незавершенных заказов, а количество импульсных покупок наоборот увеличится.\u003c/p>\u003ch3 id=\"section-0075b696-cc36-42f8-927b-3437d8ea52af\">\u003cstrong>Снижение нагрузки на команду\u003c/strong>\u003c/h3>\u003cp>Вы можете добавить свою команду в Личный кабинет CloudPayments и управлять доступами сотрудников к разделам. Это помогает автоматизировать процессы и ускорить обмен информацией.\u003c/p>\u003cp>\u003cbr>\u003c/p>\u003ch2 id=\"section-0a0b726b-f318-4ca1-8657-c6f9534eefd6\">\u003cstrong>Роли и управление пользователями\u003c/strong>\u003c/h2>\u003cp>Как защитить доступ к Личному кабинету с помощью двухфакторной аутентификации (2FA), добавлять пользователей, настраивать роли и управлять доступами команды в Личном кабинете CloudPayments.\u003c/p>\u003ch2 id=\"section-2232e862-376f-4b66-b29b-2e139b526458\">\u003cstrong>Зачем нужны роли\u003c/strong>\u003c/h2>\u003cp>Роли помогают разграничить доступ между сотрудниками и настроить работу с кабинетом под задачи команды: бухгалтеру — отчеты и чеки, менеджеру — операции и статистику, техническому специалисту — сайты и интеграции.\u003c/p>\u003cp>Роли позволяют:\u003c/p>\u003cul>\u003cli>\u003cp>Ограничить доступ к финансовым и техническим данным\u003c/p>\u003c/li>\u003cli>\u003cp>Разделить ответственность между сотрудниками\u003c/p>\u003c/li>\u003cli>\u003cp>Снизить риск ошибок при работе в Личном кабинете\u003c/p>\u003c/li>\u003c/ul>\u003cp>В таблице ниже показано, какие разделы Личного кабинета доступны пользователям в зависимости от их роли. Это поможет понять, кому и какие права можно выдать при работе с CloudPayments.\u003c/p>\u003ch2 id=\"section-d180ea8d-af4c-4221-84e6-bcf03301f26a\">\u003cstrong>Доступ по ролям\u003c/strong>\u003c/h2>\u003cfigure style=\"text-align:center\">\u003cimg src=\"static/img/editor/148a8d9ffdd6ad13611ad54a7ecc8f7f591b04a251863221ca6e47c982da2d04.png\" alt=\"Снимок экрана — 2026-09-14 в 12.54.51.png\" style=\"width:100%;max-width:100%;height:auto\">\u003c/figure>\u003ch2 id=\"section-37c0e701-88a0-4700-8247-658f5f1cf441\">\u003cstrong>Двухфакторная аутентификация (2FA) — что это и зачем она нужна\u003c/strong>\u003c/h2>\u003cp>Двухфакторная аутентификация — это дополнительная защита аккаунта: после ввода пароля нужно подтвердить вход кодом из СМС.\u003cbr>\u003cbr>Сейчас такой способ защиты стал необходимостью — логин и пароль больше не гарантирует безопасность. Это критично, особенно когда аккаунт открывает доступ к управлению платежами и клиентской информацией — поэтому мы добавили второй уровень защиты ваших данных (2FA).\u003cbr>\u003cbr>\u003cstrong>Если вы и ваши сотрудники работаете в одном аккаунте, рекомендуем создать отдельные аккаунты для каждого.\u003c/strong> Это просто и займет минуту.\u003cbr>\u003cbr>Если этого не сделать, войти в аккаунт сможет только один человек, чей номер привязан к аккаунту.\u003c/p>\u003ch2 id=\"section-bbfec4cd-a983-4fde-8d27-21d7e48c66ad\">\u003cstrong>Как выдать доступ и добавить пользователя в Личном кабинете\u003c/strong>\u003c/h2>\u003cfigure style=\"text-align:center\">\u003cimg src=\"static/img/editor/f21ac363056cd66451b58f79c5bf70eae581d4c70e355cac6b96f81ace7dd27a.png\" alt=\"Снимок экрана — 2026-09-14 в 13.21.46.png\" style=\"width:100%;max-width:100%;height:auto\">\u003c/figure>\u003cp>\u003cu>\u003ca href=\"https://merchant.cloudpayments.ru/\" target=\"_blank\" rel=\"noopener noreferrer\">Личный кабинет →\u003c/a>\u003c/u> Пользователи → Добавить пользователя\u003c/p>\u003col start=\"1\">\u003cli>\u003cp>Заполните ФИО\u003c/p>\u003c/li>\u003cli>\u003cp>Выберите роль\u003c/p>\u003c/li>\u003cli>\u003cp>Определите доступ к сайтам\u003c/p>\u003c/li>\u003cli>\u003cp>Укажите e-mail — это обязательно! На указанный e-mail придет ссылка для авторизации сотрудника\u003c/p>\u003c/li>\u003c/ol>\u003cp>Подробная инструкция \u003cu>\u003ca href=\"https://static.cloudpayments.ru/docs/kak_sozdat_akkaunt_dlya_sotrudnika.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">по ссылке →\u003c/a>\u003c/u>\u003c/p>\u003ch2 id=\"мобильное-приложение\">Мобильное приложение\u003c/h2>\u003cfigure style=\"text-align:center\">\u003cimg src=\"static/img/editor/96d7112def3601f4826a867c780401e69a017c666237c703b436e74704db5a5f.png\" alt=\"Снимок экрана — 2026-09-14 в 15.35.04.png\" style=\"width:100%;max-width:100%;height:auto\">\u003c/figure>\u003cp>\u003cstrong>CloudPayments теперь в вашем телефоне\u003c/strong>\u003c/p>\u003cp>Мы запустили мобильное приложение для \u003cstrong>iOS и Android\u003c/strong>. Следите за бизнесом и управляйте ключевыми операциями из любой точки — даже когда компьютера нет рядом.\u003c/p>\u003cp>В приложении можно:\u003c/p>\u003cul>\u003cli>\u003cp>контролировать платежи, возвраты и заказы;\u003c/p>\u003c/li>\u003cli>\u003cp>просматривать данные по транзакциям;\u003c/p>\u003c/li>\u003cli>\u003cp>получать важные уведомления;\u003c/p>\u003c/li>\u003cli>\u003cp>быстро связываться с поддержкой.\u003c/p>\u003c/li>\u003c/ul>\u003cp>\u003cstrong>Все главное по бизнесу — всегда под рукой.\u003c/strong>\u003c/p>\u003cp>\u003cbr>\u003c/p>\u003cp style=\"text-align:center\">\u003cbr>\u003c/p>\u003c/div>","toc":[{"id":"что-такое-личный-кабинет","title":"Что такое личный кабинет","level":2},{"id":"section-92858179-e1ac-4b16-9013-912ce1db74f7","title":"Что можно делать в Личном кабинете","level":2},{"id":"section-e2e98d35-9d27-40ca-b29c-d2c9c9c95278","title":"Как начать работу в Личном кабинете","level":2},{"id":"section-7ccbb848-c34a-4211-a8a2-a4f977ef7426","title":"Как Личный кабинет помогает вашему бизнесу","level":2},{"id":"section-50bac298-053c-42e0-9ec1-39630e646138","title":"Увеличение продаж","level":3},{"id":"section-5975e931-8be0-4946-b43e-708428237284","title":"Увеличение конверсии","level":3},{"id":"section-0075b696-cc36-42f8-927b-3437d8ea52af","title":"Снижение нагрузки на команду","level":3},{"id":"section-0a0b726b-f318-4ca1-8657-c6f9534eefd6","title":"Роли и управление пользователями","level":2},{"id":"section-2232e862-376f-4b66-b29b-2e139b526458","title":"Зачем нужны роли","level":2},{"id":"section-d180ea8d-af4c-4221-84e6-bcf03301f26a","title":"Доступ по ролям","level":2},{"id":"section-37c0e701-88a0-4700-8247-658f5f1cf441","title":"Двухфакторная аутентификация (2FA) — что это и зачем она нужна","level":2},{"id":"section-bbfec4cd-a983-4fde-8d27-21d7e48c66ad","title":"Как выдать доступ и добавить пользователя в Личном кабинете","level":2},{"id":"мобильное-приложение","title":"Мобильное приложение","level":2}]},"solutions/compare":{"id":"solutions/compare","title":"Сравнение платежных интерфейсов","group":"solutions","html":"\u003cdiv class=\"imported-api\">\u003cp>\u003cbr>\u003c/p>\u003cfigure style=\"text-align:center\">\u003cimg src=\"static/img/editor/ee0dc971133905da245a203ee933414fd7103ece1f969391d506fe979c35987b.png\" alt=\"Снимок экрана — 2026-09-11 в 09.39.10.png\" style=\"width:94%;max-width:100%;height:auto\">\u003c/figure>\u003cdiv class=\"api-table-scroll\" tabindex=\"0\" aria-label=\"Таблица\">\u003ctable style=\"table-layout:fixed;width:1932px;min-width:0\">\u003ccolgroup>\u003ccol style=\"width:201px\">\u003ccol style=\"width:354px\">\u003ccol style=\"width:327px\">\u003ccol style=\"width:227px\">\u003ccol style=\"width:314px\">\u003ccol style=\"width:279px\">\u003ccol style=\"width:230px\">\u003c/colgroup>\u003ctr>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">\u003cbr>\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">Визуал \u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">\u003cstrong>Как работает\u003c/strong>\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">\u003cstrong>Для кого\u003c/strong>\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">\u003cstrong>Назначение\u003c/strong>\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">\u003cstrong>Вид\u003c/strong>\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">\u003cstrong>Встраиваемость  \u003c/strong>\u003c/p>\u003c/th>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">\u003cstrong>Виджет \u003c/strong>\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cfigure style=\"text-align:center\">\u003cimg src=\"static/img/editor/fd00be9784fceac139dd936f87626363cbb6b67c6a11b8384c52f62e6881b80d.png\" alt=\"Снимок экрана — 2026-09-11 в 10.49.50.png\" style=\"width:100%;max-width:100%;height:auto\">\u003c/figure>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">Встраивается на сайт и позволяет оплачивать товары на сайте\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">Для тех, у кого есть собственный сайт\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">Стандартный метод оплаты, который используется на сайтах\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">\u003cstrong>Форма на сайте\u003c/strong>\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">Iframe\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">\u003cstrong>Платежные блоки\u003c/strong>\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cfigure style=\"text-align:center\">\u003cimg src=\"static/img/editor/34fe86325c64eb981a898fc1e852e0acaf11da99171c859f5740e984a1ffddb6.png\" alt=\"Снимок экрана — 2026-09-11 в 10.32.39.png\" style=\"width:100%;max-width:100%;height:auto\">\u003c/figure>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">Встраивается в сайт и позволяет оплачивать товары на сайте\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">Для тех, у кого есть собственный сайт\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">Мерчантам, которым хочется кастомизировать форму оплаты, а так же тем, кто не хочет поднимать отдельную визуальную форму\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">\u003cstrong>Форма на сайте\u003c/strong>\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">Встроенная\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">\u003cstrong>Заказы\u003c/strong>\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cfigure style=\"text-align:center\">\u003cimg src=\"static/img/editor/89b773cad0a3dff755001f0f1a2de47589cb8914995b2f1df333fadcbc8287c1.png\" alt=\"Снимок экрана — 2026-09-11 в 10.50.07.png\" style=\"width:100%;max-width:100%;height:auto\">\u003c/figure>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">Создается отдельная ссылка, в которой указывается номер заказа.\u003c/p>\u003cp style=\"text-align:center\">Ссылка одноразовая\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">Для тех, кто персонально работает с клиентами\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">Используется для оплаты конкретных конечных заказов, когда у клиента нет возможности оплатить через виджет\u003c/p>\u003cp style=\"text-align:center\">Часто как способ оплаты при контакте менеджера с клиентом на звонке\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">Ссылка\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\"> Нет\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">\u003cstrong>Заказы, созданные на основе шаблонов\u003c/strong>\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003cbr>\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003cbr>\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">Для тех, кто персонально работает с клиентами и при этом есть стандартный набор товаров\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003cbr>\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">Ссылка\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">Нет\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">\u003cstrong>Платежные ссылки \u003c/strong>\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cfigure style=\"text-align:center\">\u003cimg src=\"static/img/editor/db41b5a9a53d38906b148e3da91547f9080173af61533194f14623008579784f.png\" alt=\"Снимок экрана — 2026-09-11 в 10.50.37.png\" style=\"width:100%;max-width:100%;height:auto\">\u003c/figure>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">Создается отдельная ссылка для оплаты.\u003c/p>\u003cp style=\"text-align:center\">Ссылка многоразовая\u003c/p>\u003cp style=\"text-align:left\">Имеет несколько видов:\u003c/p>\u003cul>\u003cli>\u003cp style=\"text-align:left\">Для бизнеса\u003c/p>\u003cul>\u003cli>\u003cp style=\"text-align:left\">с редактированием суммы\u003c/p>\u003c/li>\u003cli>\u003cp style=\"text-align:left\">без редактирования суммы\u003c/p>\u003c/li>\u003c/ul>\u003c/li>\u003cli>\u003cp style=\"text-align:left\">Для благотворительности \u003c/p>\u003c/li>\u003c/ul>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">Для тех, кому нужно предоставлять ссылки с конкретными наборами для клиентов\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">Используется для быстрой оплаты без необходимости наличия сайта\u003c/p>\u003cp style=\"text-align:center\">Может быть переиспользована многократно\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">Ссылка\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">Нет\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">\u003cstrong>Инфошоп\u003c/strong>\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cfigure style=\"text-align:center\">\u003cimg src=\"static/img/editor/97d67d3e76d3e032842b0ba5e6a5418707819e7081ebad5760033488fd3aec0d.png\" alt=\"Снимок экрана — 2026-09-11 в 10.33.58.png\" style=\"width:100%;max-width:100%;height:auto\">\u003c/figure>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">Создается отдельная ссылка для оплаты\u003c/p>\u003cp style=\"text-align:center\">Ссылка многоразовая\u003c/p>\u003cp style=\"text-align:center\">Позволяет выбрать один из товаров\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">Для тех, кому нужно давать клиенту выбор товара в момент оформления\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">Может быть переиспользована многократно\u003c/p>\u003cp style=\"text-align:center\">Используется для выбора товара и оплаты\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">Ссылка\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">Нет\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">\u003cstrong>WebSDK\u003c/strong>\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">\u003cbr>\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">Встраивается на вебе и позволяет оплачивать\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">Для тех, кому нужны персонализированные формы оплаты по любому из методов, при этом интеграция происходит на уровне фронта\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">Мерчантам, у которых есть свой UI\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">\u003cstrong>Форма на сайте\u003c/strong>\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">Любая\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">\u003cstrong>MobSDK\u003c/strong>\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cfigure style=\"text-align:center\">\u003cimg src=\"static/img/editor/9e05d8ddb0968c4f7d8e350e92673c155e88c420c08d614a12d486b4f1c77f07.png\" alt=\"Снимок экрана — 2026-09-11 в 10.33.39.png\" style=\"width:100%;max-width:100%;height:auto\">\u003c/figure>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">Встраивается в мобильное приложение и позволяет подгружать формы оплаты\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">Для тех, у кого есть мобильное приложение\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">Мерчантам с приложением\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">\u003cstrong>Форма в приложении\u003c/strong>\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">iframe\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">\u003cstrong>Оплата по криптограмме через API\u003c/strong>\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">\u003cbr>\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">Позволяет оплачивать через наше API при использовании формы мерчанта\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">Для тех, кому нужна персонализированная форма оплаты только по карте\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">Мерчантам, у которых есть свой UI\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">\u003cstrong>Форма на сайте\u003c/strong>\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">Любая\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cp>\u003cbr>\u003c/p>\u003c/div>","toc":[]},"solutions/widget":{"id":"solutions/widget","title":"Виджет","group":"solutions","html":"\u003cdiv class=\"imported-api\">\u003cp>Подходит для приема платежей на сайте без сложной интеграции.\u003c/p>\u003ch3 id=\"section-c4e52da7-edf3-4e26-b1d3-40f42f2660c8\">\u003cstrong>Описание функционала\u003c/strong>\u003c/h3>\u003cfigure style=\"text-align:center\">\u003cimg src=\"static/img/editor/143fcc0541354575510a90a8b9830910b4a757e62d624601bfd5aa2bfe2e8330.png\" alt=\"widgetdark.png\" style=\"width:100%;max-width:100%;height:auto\">\u003c/figure>\u003cp>Всплывающая форма, с помощью которой ваши клиенты могут оплачивать покупки онлайн удобным для себя способом.\u003c/p>\u003cul>\u003cli>\u003cp>Адаптация под все виды устройств: десктоп, планшет, мобильные устройства\u003c/p>\u003c/li>\u003cli>\u003cp>Безредиректный — в момент оплаты не уводит клиента с сайта, а открывается во всплывающем окне iframe\u003c/p>\u003c/li>\u003cli>\u003cp>Поддержка всех способов оплаты: российской банковской картой и иностранной, СБП, T-Pay, SberPay, Mir Pay, Долями, в рассрочку\u003c/p>\u003c/li>\u003cli>\u003cp>Форма автоматически определяет платежную систему и банк-эмитент карты, а также показывает их логотипы\u003c/p>\u003c/li>\u003cli>\u003cp>Поддержка подписок (рекуррентных платежей)\u003c/p>\u003c/li>\u003cli>\u003cp>Интеграция для работы с чеками\u003c/p>\u003c/li>\u003cli>\u003cp>Гибкая настройка интеграции\u003c/p>\u003c/li>\u003cli>\u003cp>Светлая и темная тема интерфейса\u003c/p>\u003c/li>\u003cli>\u003cp>Возможность скрыть определенные методы оплаты\u003c/p>\u003c/li>\u003c/ul>\u003ch3 id=\"section-9785814b-0940-46e1-a225-7825aedf699f\">\u003cstrong>Безопасность\u003c/strong>\u003c/h3>\u003cp>Все платежи проходят безопасно — каждая оплата защищена по стандарту PCI DSS на стороне CloudPayments.\u003c/p>\u003cp>\u003cbr>\u003c/p>\u003cdiv style=\"text-align:center;margin:24px 0\">\u003ca href=\"https://widget.cloudpayments.ru/app/demo\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;background:#326dff;color:#fff;text-decoration:none;border-radius:12px;padding:12px 20px;max-width:100%;width:250px;min-height:56px;font-size:18px;font-weight:600\">Демо-конструктор \u003c/a>\u003c/div>\u003cp>\u003cbr>\u003c/p>\u003c/div>","toc":[{"id":"section-c4e52da7-edf3-4e26-b1d3-40f42f2660c8","title":"Описание функционала","level":3},{"id":"section-9785814b-0940-46e1-a225-7825aedf699f","title":"Безопасность","level":3}]},"solutions/blocks":{"id":"solutions/blocks","title":"Платежные блоки","group":"solutions","html":"\u003cdiv class=\"imported-api\">\u003cp>Подходит для приема платежей на сайте с возможностью кастомизировать форму оплаты без сложной интеграции и прохождения \u003cu>\u003ca href=\"https://developers.cloudpayments.ru/\" target=\"_blank\" rel=\"noopener noreferrer\">ASV-сканирования\u003c/a>\u003c/u>.\u003c/p>\u003cfigure style=\"text-align:center\">\u003cimg src=\"static/img/editor/32132f8446710c64c173d70fd4b26c93807cb3b2c450b8d39991a8071b5e1fe5.png\" alt=\"Снимок экрана — 2026-09-11 в 17.12.20.png\" style=\"width:100%;max-width:100%;height:auto\">\u003c/figure>\u003ch3 id=\"section-d54eedb7-8b1f-439b-8388-4d48ba71516a\">\u003cstrong>Описание функционала\u003c/strong>\u003c/h3>\u003cp>Из блоков конструктора можно собрать собственную платежную форму с гибкой настройкой цвета, текстового наполнения и способов оплаты. Форма встраивается в сайт и выглядит его частью — клиент остается на странице магазина.\u003c/p>\u003cul>\u003cli>\u003cp>Легко интегрировать на сайт без привлечения ИТ-специалистов\u003c/p>\u003c/li>\u003cli>\u003cp>Поддержка всех способов оплаты: российской банковской картой и иностранной, СБП, T-Pay, SberPay, Mir Pay, Долями, в рассрочку\u003c/p>\u003c/li>\u003cli>\u003cp>Возможности кастомизации: изменение надписей, размера шрифта, цвета кнопок, фона и текста, скругления углов формы\u003c/p>\u003c/li>\u003cli>\u003cp>Адаптация под все виды устройств: десктоп, планшет, мобильные устройства\u003c/p>\u003c/li>\u003cli>\u003cp>Форма автоматически определяет платежную систему и банк-эмитент карты, а также показывает их логотипы\u003c/p>\u003c/li>\u003c/ul>\u003ch3 id=\"section-fb586524-831b-42d1-a671-bbe09ca1ea95\">\u003cstrong>Безопасность\u003c/strong>\u003c/h3>\u003cp>Платежные данные клиента шифруются в браузере, каждая оплата защищена по стандарту PCI DSS на стороне CloudPayments — не требуется проводить \u003cu>\u003ca href=\"https://developers.cloudpayments.ru/\" target=\"_blank\" rel=\"noopener noreferrer\">ASV-сканирование\u003c/a>\u003c/u>\u003c/p>\u003c/div>","toc":[{"id":"section-d54eedb7-8b1f-439b-8388-4d48ba71516a","title":"Описание функционала","level":3},{"id":"section-fb586524-831b-42d1-a671-bbe09ca1ea95","title":"Безопасность","level":3}]},"solutions/checkout":{"id":"solutions/checkout","title":"Скрипт check-out","group":"solutions","html":"","toc":[]},"solutions/orders":{"id":"solutions/orders","title":"Одноразовые ссылки","group":"solutions","html":"\u003cdiv class=\"imported-api\">\u003cp>Подходят для приема платежей без сайта. При переходе по ссылке клиенту открывается форма для оплаты.\u003c/p>\u003cfigure style=\"text-align:center\">\u003cimg src=\"static/img/editor/ac81898eb4925fb98c2faaf90a7b429a2f868150d202a6d940cd6678c9bc4bbc.png\" alt=\"Снимок экрана — 2026-09-14 в 16.07.42.png\" style=\"width:100%;max-width:100%;height:auto\">\u003c/figure>\u003ch3 id=\"section-ce583f70-19a4-4e17-a988-0e674180cc40\">\u003cstrong>Описание функционала\u003c/strong>\u003c/h3>\u003cp>Заказы — это прием платежей по одноразовым платежным ссылкам, они предназначены для конкретного клиента (заказа)\u003c/p>\u003cul>\u003cli>\u003cp>Автоматическая отправка ссылки на заказ клиенту по СМС и e-mail\u003c/p>\u003c/li>\u003cli>\u003cp>Использование шаблона, который нужно настроить всего один раз — после этого все формы заполняются автоматически, останется только ввести данные нового плательщика\u003c/p>\u003c/li>\u003cli>\u003cp>Поддержка подписок (рекуррентных платежей)\u003c/p>\u003c/li>\u003cli>\u003cp>Интеграция для работы с чеками\u003c/p>\u003c/li>\u003cli>\u003cp>Ограниченное время действия ссылки на оплату\u003c/p>\u003c/li>\u003cli>\u003cp>Приоритизация и скрытие платежных методов\u003c/p>\u003c/li>\u003cli>\u003cp>Возможность формировать заказы автоматически — через API\u003c/p>\u003c/li>\u003cli>\u003cp>Возможность получать информацию по заказам через API\u003c/p>\u003c/li>\u003c/ul>\u003cp>\u003cbr>\u003c/p>\u003c/div>","toc":[{"id":"section-ce583f70-19a4-4e17-a988-0e674180cc40","title":"Описание функционала","level":3}]},"solutions/links":{"id":"solutions/links","title":"Многоразовые ссылки","group":"solutions","html":"","toc":[]},"solutions/charity":{"id":"solutions/charity","title":"Благотворительность","group":"solutions","html":"","toc":[]},"solutions/infoshop":{"id":"solutions/infoshop","title":"Инфошоп","group":"solutions","html":"","toc":[]},"solutions/sdk":{"id":"solutions/sdk","title":"Мобильные SDK","group":"solutions","html":"","toc":[]},"solutions/api":{"id":"solutions/api","title":"API","group":"solutions","html":"","toc":[]},"methods/card":{"id":"methods/card","title":"Банковская карта","group":"methods","html":"\u003cdiv class=\"imported-api\">\u003cp>Банковские карты — один из самых популярных способов онлайн-оплаты. Покупатели могут оплачивать заказы на вашем сайте, в приложении или в социальных сетях картами Мир, Visa, Mastercard, выпущенными в России \u003cu>\u003ca href=\"https://cloudpayments.ru/help/payments/payment-methods#foreigncards\" target=\"_blank\" rel=\"noopener noreferrer\">и других странах\u003c/a>\u003c/u>.\u003c/p>\u003cfigure style=\"text-align:center\">\u003cimg src=\"static/img/editor/19a35218db0c271ece218bb1d6464017ee0bf122ed1361bf30cd273054fba846.png\" alt=\"Снимок экрана — 2026-09-14 в 10.28.28.png\" style=\"width:100%;max-width:100%;height:auto\">\u003c/figure>\u003ch3 id=\"section-72de9a44-3891-451c-b918-af990fae33a8\">\u003cstrong>Как включить оплату банковскими картами\u003c/strong>\u003c/h3>\u003cp>Платежный метод \u003cstrong>подключается по умолчанию\u003c/strong> после того, как вы:\u003c/p>\u003col start=\"1\">\u003cli>\u003cp>Создали (добавили) сайт в Личный кабинет CloudPayments\u003c/p>\u003c/li>\u003cli>\u003cp>Перевели сайт в боевой режим с помощью менеджера — то есть начали принимать реальные платежи\u003c/p>\u003c/li>\u003c/ol>\u003cp>До перевода в боевой режим доступен тестовый режим: можно настроить интеграцию, протестировать оплату и убедиться, что все работает корректно.\u003c/p>\u003ch2 id=\"section-3c7578e0-dea6-4d4f-b61a-64fa8864093c\">\u003cstrong>Варианты интеграции\u003c/strong>\u003c/h2>\u003cp>Оплата банковскими картами поддерживается во всех вариантах интеграции CloudPayments:\u003c/p>\u003cul>\u003cli>\u003cp>Виджет на сайте\u003c/p>\u003c/li>\u003cli>\u003cp>Платежные ссылки и заказы\u003c/p>\u003c/li>\u003cli>\u003cp>Интеграция по API\u003c/p>\u003c/li>\u003cli>\u003cp>Мобильное приложение через SDK для Android или iOS\u003c/p>\u003c/li>\u003cli>\u003cp>Платежные блоки\u003c/p>\u003c/li>\u003cli>\u003cp>CloudИнфошоп\u003c/p>\u003c/li>\u003c/ul>\u003cp>Платежная форма отображает способ оплаты «Банковская карта» по умолчанию — никаких дополнительных настроек не требуется.\u003c/p>\u003c/div>","toc":[{"id":"section-72de9a44-3891-451c-b918-af990fae33a8","title":"Как включить оплату банковскими картами","level":3},{"id":"section-3c7578e0-dea6-4d4f-b61a-64fa8864093c","title":"Варианты интеграции","level":2}]},"methods/tpay":{"id":"methods/tpay","title":"T-Pay","group":"methods","html":"\u003cdiv class=\"imported-api\">\u003cp>Оплата в один клик без ввода данных карты через приложение Т‑Банка.\u003c/p>\u003ch3 id=\"section-d71aa001-4f80-4ef2-a12d-3a718e51ab24\">\u003cstrong>Как подключить T-Pay в платежной форме\u003c/strong>\u003c/h3>\u003cp>При подключении к CloudPayments настройка T-Pay производится по умолчанию — дополнительные действия не требуются.\u003c/p>\u003ch3 id=\"section-e0dcb9f5-d6b8-4e6c-aab2-e1e8511fd29e\">\u003cstrong>Как включить T-Pay в платежной форме\u003c/strong>\u003c/h3>\u003cp>\u003cu>\u003ca href=\"https://merchant.cloudpayments.ru/\" target=\"_blank\" rel=\"noopener noreferrer\">В Личном кабинете CloudPayments →\u003c/a>\u003c/u> раздел Сайты\u003c/p>\u003ch3 id=\"section-df64500f-69b0-4429-90d3-db3e6062e33d\">\u003cstrong>Варианты интеграции платежной формы\u003c/strong>\u003c/h3>\u003cul>\u003cli>\u003cp>Виджет\u003c/p>\u003c/li>\u003cli>\u003cp>Платежные ссылки и заказы\u003c/p>\u003c/li>\u003cli>\u003cp>По API\u003c/p>\u003c/li>\u003cli>\u003cp>В мобильном приложении через мобильный SDK для Android или iOS\u003c/p>\u003c/li>\u003cli>\u003cp>Платежные блоки\u003c/p>\u003c/li>\u003cli>\u003cp>CloudИнфошоп\u003c/p>\u003c/li>\u003c/ul>\u003cp>\u003cbr>\u003c/p>\u003c/div>","toc":[{"id":"section-d71aa001-4f80-4ef2-a12d-3a718e51ab24","title":"Как подключить T-Pay в платежной форме","level":3},{"id":"section-e0dcb9f5-d6b8-4e6c-aab2-e1e8511fd29e","title":"Как включить T-Pay в платежной форме","level":3},{"id":"section-df64500f-69b0-4429-90d3-db3e6062e33d","title":"Варианты интеграции платежной формы","level":3}]},"methods/sberpay":{"id":"methods/sberpay","title":"СберПэй","group":"methods","html":"\u003cdiv class=\"imported-api\">\u003cp>Оплата в один клик без ввода данных карты через приложение СберБанка.\u003c/p>\u003ch3 id=\"section-3fabb72b-3b1c-413a-8325-f58522a77f48\">\u003cstrong>Как подключить SberPay в платежной форме\u003c/strong>\u003c/h3>\u003cp>При подключении к CloudPayments настройка SberPay производится по запросу в поддержку — для настройки оправьте в чат ИНН своей организации.\u003c/p>\u003ch3 id=\"section-46389b21-5b96-4531-8e56-ac2ac46e71da\">\u003cstrong>Как включить SberPay в платежной форме\u003c/strong>\u003c/h3>\u003cp>\u003cu>\u003ca href=\"https://merchant.cloudpayments.ru/\" target=\"_blank\" rel=\"noopener noreferrer\">В Личном кабинете CloudPayments →\u003c/a>\u003c/u> раздел Сайты\u003c/p>\u003ch3 id=\"section-62b43913-4fdb-429f-8ff1-45e10e351a91\">\u003cstrong>Варианты интеграции платежной формы\u003c/strong>\u003c/h3>\u003cul>\u003cli>\u003cp>Виджет\u003c/p>\u003c/li>\u003cli>\u003cp>Платежные ссылки и заказы\u003c/p>\u003c/li>\u003cli>\u003cp>По API\u003c/p>\u003c/li>\u003cli>\u003cp>В мобильном приложении через мобильный SDK для Android или iOS\u003c/p>\u003c/li>\u003cli>\u003cp>Платежные блоки\u003c/p>\u003c/li>\u003cli>\u003cp>CloudИнфошоп\u003c/p>\u003c/li>\u003c/ul>\u003cp>\u003cbr>\u003c/p>\u003c/div>","toc":[{"id":"section-3fabb72b-3b1c-413a-8325-f58522a77f48","title":"Как подключить SberPay в платежной форме","level":3},{"id":"section-46389b21-5b96-4531-8e56-ac2ac46e71da","title":"Как включить SberPay в платежной форме","level":3},{"id":"section-62b43913-4fdb-429f-8ff1-45e10e351a91","title":"Варианты интеграции платежной формы","level":3}]},"methods/mirpay":{"id":"methods/mirpay","title":"МирПэй","group":"methods","html":"\u003cdiv class=\"imported-api\">\u003cp>Оплата в один клик без ввода данных карты через приложение Mir.\u003c/p>\u003ch3 id=\"section-d1bd9fcf-6209-4cbb-a7ae-be256d84201d\">\u003cstrong>Как подключить Mir Pay в платежной форме\u003c/strong>\u003c/h3>\u003cp>При подключении к CloudPayments настройка Mir Pay производится по умолчанию — дополнительные действия не требуются.\u003c/p>\u003ch3 id=\"section-91048f1a-b1b7-4bd4-bc9f-dbf3f2c69e74\">\u003cstrong>Как включить Mir Pay в платежной форме\u003c/strong>\u003c/h3>\u003cp>\u003cu>\u003ca href=\"https://merchant.cloudpayments.ru/\" target=\"_blank\" rel=\"noopener noreferrer\">В Личном кабинете CloudPayments →\u003c/a>\u003c/u> раздел Сайты\u003c/p>\u003ch3 id=\"section-892c02a0-4a92-4195-8cda-d65eb9d07bbd\">\u003cstrong>Варианты интеграции платежной формы\u003c/strong>\u003c/h3>\u003cul>\u003cli>\u003cp>Виджет\u003c/p>\u003c/li>\u003cli>\u003cp>Платежные ссылки и заказы\u003c/p>\u003c/li>\u003cli>\u003cp>В мобильном приложении через мобильный SDK для Android или iOS\u003c/p>\u003c/li>\u003cli>\u003cp>Платежные блоки\u003c/p>\u003c/li>\u003cli>\u003cp>CloudИнфошоп\u003c/p>\u003c/li>\u003c/ul>\u003cp>\u003cbr>\u003c/p>\u003c/div>","toc":[{"id":"section-d1bd9fcf-6209-4cbb-a7ae-be256d84201d","title":"Как подключить Mir Pay в платежной форме","level":3},{"id":"section-91048f1a-b1b7-4bd4-bc9f-dbf3f2c69e74","title":"Как включить Mir Pay в платежной форме","level":3},{"id":"section-892c02a0-4a92-4195-8cda-d65eb9d07bbd","title":"Варианты интеграции платежной формы","level":3}]},"methods/sbp":{"id":"methods/sbp","title":"СБП","group":"methods","html":"\u003cdiv class=\"imported-api\">\u003cp>Оплата в один клик без ввода данных карты. Покупатель выбирает банк и подтверждает оплату в мобильном приложении банка. В десктопной версии оплата производится по QR-коду с подтверждением в мобильном банке.\u003c/p>\u003cp style=\"text-align:center\">\u003cstrong>ФОТО\u003c/strong>\u003c/p>\u003ch3 id=\"section-ce455053-3d8c-4506-b5e1-9a45ae93375b\">\u003cstrong>Как подключить СБП в платежной форме\u003c/strong>\u003c/h3>\u003cp>При подключении к CloudPayments настройка СБП производится по запросу \u003cu>\u003ca href=\"https://t.me/cloudassistant_bot\" target=\"_blank\" rel=\"noopener noreferrer\">в tg-боте\u003c/a>\u003c/u> — для настройки оправьте в чат ИНН своей организации.\u003c/p>\u003ch3 id=\"section-a66b94ef-377d-4ef4-8b17-295c5ed0e8dc\">\u003cstrong>Как включить СБП в платежной форме\u003c/strong>\u003c/h3>\u003cp>\u003cu>\u003ca href=\"https://merchant.cloudpayments.ru/\" target=\"_blank\" rel=\"noopener noreferrer\">В Личном кабинете CloudPayments →\u003c/a>\u003c/u> раздел Сайты\u003c/p>\u003ch3 id=\"section-a3775574-2852-47e8-8228-754d4d880e76\">\u003cstrong>Варианты интеграции платежной формы\u003c/strong>\u003c/h3>\u003cul>\u003cli>\u003cp>Виджет\u003c/p>\u003c/li>\u003cli>\u003cp>Платежные ссылки и заказы\u003c/p>\u003c/li>\u003cli>\u003cp>По API\u003c/p>\u003c/li>\u003cli>\u003cp>В мобильном приложении через мобильный SDK для Android или iOS\u003c/p>\u003c/li>\u003cli>\u003cp>Платежные блоки\u003c/p>\u003c/li>\u003cli>\u003cp>CloudИнфошоп\u003c/p>\u003c/li>\u003c/ul>\u003cp>\u003cbr>\u003c/p>\u003c/div>","toc":[{"id":"section-ce455053-3d8c-4506-b5e1-9a45ae93375b","title":"Как подключить СБП в платежной форме","level":3},{"id":"section-a66b94ef-377d-4ef4-8b17-295c5ed0e8dc","title":"Как включить СБП в платежной форме","level":3},{"id":"section-a3775574-2852-47e8-8228-754d4d880e76","title":"Варианты интеграции платежной формы","level":3}]},"methods/dolyami":{"id":"methods/dolyami","title":"Долями","group":"methods","html":"\u003cdiv class=\"imported-api\">\u003cp>Сервис для оплаты частями в четыре платежа без процентов и переплат.\u003c/p>\u003ch3 id=\"section-5a2475c0-8453-41cf-a2c9-d46b4ed9647a\">\u003cstrong>Как подключить Долями в платежной форме\u003c/strong>\u003c/h3>\u003cp>При подключении к CloudPayments настройка Долями производится по запросу \u003cu>\u003ca href=\"https://t.me/cloudassistant_bot\" target=\"_blank\" rel=\"noopener noreferrer\">в tg-боте\u003c/a>\u003c/u> — для настройки оправьте в чат ИНН своей организации.\u003c/p>\u003ch3 id=\"section-36057da1-562d-4802-8826-c06aa9f6282a\">\u003cstrong>Как включить Долями в платежной форме\u003c/strong>\u003c/h3>\u003cp>\u003cu>\u003ca href=\"https://merchant.cloudpayments.ru/\" target=\"_blank\" rel=\"noopener noreferrer\">В Личном кабинете CloudPayments →\u003c/a>\u003c/u> раздел Сайты\u003c/p>\u003ch3 id=\"section-863da87c-c555-4301-b530-1d810cd091d5\">\u003cstrong>Варианты интеграции платежной формы\u003c/strong>\u003c/h3>\u003cul>\u003cli>\u003cp>Виджет\u003c/p>\u003c/li>\u003cli>\u003cp>Платежные ссылки и заказы\u003c/p>\u003c/li>\u003cli>\u003cp>По API\u003c/p>\u003c/li>\u003cli>\u003cp>Платежные блоки\u003c/p>\u003c/li>\u003cli>\u003cp>CloudИнфошоп\u003c/p>\u003c/li>\u003c/ul>\u003cp>\u003cbr>\u003c/p>\u003c/div>","toc":[{"id":"section-5a2475c0-8453-41cf-a2c9-d46b4ed9647a","title":"Как подключить Долями в платежной форме","level":3},{"id":"section-36057da1-562d-4802-8826-c06aa9f6282a","title":"Как включить Долями в платежной форме","level":3},{"id":"section-863da87c-c555-4301-b530-1d810cd091d5","title":"Варианты интеграции платежной формы","level":3}]},"methods/installments":{"id":"methods/installments","title":"Рассрочка","group":"methods","html":"\u003cdiv class=\"imported-api\">\u003cp>Это возможность получать оплату за товары или услуги частями, при этом бизнес сразу получает всю сумму покупки, а клиент выплачивает ее поэтапно.\u003c/p>\u003ch3 id=\"section-853c166d-0c18-4fc3-9d12-9fc7cd2d06f6\">\u003cstrong>Как подключить рассрочку в платежной форме\u003c/strong>\u003c/h3>\u003cp>При подключении к CloudPayments настройка рассрочки производится по запросу \u003cu>\u003ca href=\"https://t.me/cloudassistant_bot\" target=\"_blank\" rel=\"noopener noreferrer\">в tg-боте\u003c/a>\u003c/u> — для настройки оправьте в чат ИНН своей организации.\u003c/p>\u003ch3 id=\"section-de3a8561-9e13-446e-84b1-f5efc943a9db\">\u003cstrong>Как включить рассрочку в платежной форме\u003c/strong>\u003c/h3>\u003cp>\u003cu>\u003ca href=\"https://merchant.cloudpayments.ru/\" target=\"_blank\" rel=\"noopener noreferrer\">В Личном кабинете CloudPayments →\u003c/a>\u003c/u> раздел Сайты\u003c/p>\u003ch3 id=\"section-ddccac6d-0d9b-4082-9a6e-906c630f4d98\">\u003cstrong>Варианты интеграции платежной формы\u003c/strong>\u003c/h3>\u003cul>\u003cli>\u003cp>Виджет\u003c/p>\u003c/li>\u003cli>\u003cp>Платежные ссылки и заказы\u003c/p>\u003c/li>\u003cli>\u003cp>Отдельной кнопкой через WebSDK\u003c/p>\u003c/li>\u003cli>\u003cp>Платежные блоки\u003c/p>\u003c/li>\u003cli>\u003cp>CloudИнфошоп\u003c/p>\u003c/li>\u003c/ul>\u003cp>\u003cbr>\u003c/p>\u003c/div>","toc":[{"id":"section-853c166d-0c18-4fc3-9d12-9fc7cd2d06f6","title":"Как подключить рассрочку в платежной форме","level":3},{"id":"section-de3a8561-9e13-446e-84b1-f5efc943a9db","title":"Как включить рассрочку в платежной форме","level":3},{"id":"section-ddccac6d-0d9b-4082-9a6e-906c630f4d98","title":"Варианты интеграции платежной формы","level":3}]},"methods/foreign":{"id":"methods/foreign","title":"Иностранные карты","group":"methods","html":"\u003cdiv class=\"imported-api\">\u003cp>Прием оплат с зарубежных банковских карт в иностранной валюте\u003c/p>\u003ch3 id=\"section-17b9473f-d5b8-49c1-b87d-b002f86c6e8e\">\u003cstrong>Как подключить прием иностранных карт в платежной форме\u003c/strong>\u003c/h3>\u003cp>При подключении к CloudPayments настройка приема иностранных карт производится по запросу \u003cu>\u003ca href=\"https://t.me/cloudassistant_bot\" target=\"_blank\" rel=\"noopener noreferrer\">в tg-боте\u003c/a>\u003c/u> — для настройки оправьте в чат ИНН своей организации.\u003c/p>\u003ch3 id=\"section-16f54d0e-b73c-47ce-a033-44d1ce3eb821\">\u003cstrong>Как включить прием иностранных карт в платежной форме\u003c/strong>\u003c/h3>\u003cp>После подключения способ оплаты активируется автоматически\u003c/p>\u003ch3 id=\"section-1699ba11-3122-491f-9882-c19b38184cc3\">\u003cstrong>Варианты интеграции платежной формы\u003c/strong>\u003c/h3>\u003cul>\u003cli>\u003cp>Виджет\u003c/p>\u003c/li>\u003cli>\u003cp>Платежные ссылки и заказы\u003c/p>\u003c/li>\u003cli>\u003cp>По API\u003c/p>\u003c/li>\u003cli>\u003cp>В мобильном приложении через мобильный SDK для Android или iOS\u003c/p>\u003c/li>\u003cli>\u003cp>Платежные блоки\u003c/p>\u003c/li>\u003cli>\u003cp>CloudИнфошоп\u003c/p>\u003c/li>\u003c/ul>\u003cp>\u003cbr>\u003c/p>\u003c/div>","toc":[{"id":"section-17b9473f-d5b8-49c1-b87d-b002f86c6e8e","title":"Как подключить прием иностранных карт в платежной форме","level":3},{"id":"section-16f54d0e-b73c-47ce-a033-44d1ce3eb821","title":"Как включить прием иностранных карт в платежной форме","level":3},{"id":"section-1699ba11-3122-491f-9882-c19b38184cc3","title":"Варианты интеграции платежной формы","level":3}]},"methods/digital":{"id":"methods/digital","title":"Цифровой рубль","group":"methods","html":"","toc":[]},"scenarios/recurrent":{"id":"scenarios/recurrent","title":"Рекурренты","group":"scenarios","html":"\u003ch2 id=\"как-подключить\">Как подключить\u003c/h2>","toc":[{"level":2,"title":"Как подключить","id":"как-подключить"}]},"scenarios/recurring":{"id":"scenarios/recurring","title":"Рекарринг","group":"scenarios","html":"","toc":[]},"scenarios/escrow":{"id":"scenarios/escrow","title":"Безопасная сделка","group":"scenarios","html":"","toc":[]},"scenarios/customization":{"id":"scenarios/customization","title":"Кастомизация платежных интерфейсов","group":"scenarios","html":"","toc":[]},"tech/widget":{"id":"tech/widget","title":"Виджет","group":"tech","html":"\u003ch2 id=\"начало-работы-с-виджетом\">Начало работы с виджетом\u003c/h2>\u003ch2 id=\"демо-конструктор\">Демо-конструктор\u003c/h2>\u003ch2 id=\"полный-скрипт-и-параметры\">Полный скрипт и параметры\u003c/h2>\u003ch2 id=\"рекуррентные-платежи\">Рекуррентные платежи\u003c/h2>\u003ch2 id=\"параметры-кастомизации\">Параметры кастомизации\u003c/h2>\u003ch2 id=\"данные-о-плательщике\">Данные о плательщике\u003c/h2>\u003ch2 id=\"список-товаров\">Список товаров\u003c/h2>\u003ch2 id=\"параметры-чека\">Параметры чека\u003c/h2>\u003ch2 id=\"настройка-безопасной-сделки\">Настройка безопасной сделки\u003c/h2>\u003ch2 id=\"события-коллбэки\">События (коллбэки)\u003c/h2>","toc":[{"level":2,"title":"Начало работы с виджетом","id":"начало-работы-с-виджетом"},{"level":2,"title":"Демо-конструктор","id":"демо-конструктор"},{"level":2,"title":"Полный скрипт и параметры","id":"полный-скрипт-и-параметры"},{"level":2,"title":"Рекуррентные платежи","id":"рекуррентные-платежи"},{"level":2,"title":"Параметры кастомизации","id":"параметры-кастомизации"},{"level":2,"title":"Данные о плательщике","id":"данные-о-плательщике"},{"level":2,"title":"Список товаров","id":"список-товаров"},{"level":2,"title":"Параметры чека","id":"параметры-чека"},{"level":2,"title":"Настройка безопасной сделки","id":"настройка-безопасной-сделки"},{"level":2,"title":"События (коллбэки)","id":"события-коллбэки"}]},"tech/blocks":{"id":"tech/blocks","title":"Платежные блоки","group":"tech","html":"\u003ch2 id=\"начало-работы-с-платежными-блоками\">Начало работы с платежными блоками\u003c/h2>\u003ch2 id=\"демо-конструктор\">Демо-конструктор\u003c/h2>\u003ch2 id=\"полный-скрипт\">Полный скрипт\u003c/h2>\u003ch2 id=\"параметры-инициализации\">Параметры инициализации\u003c/h2>\u003ch2 id=\"параметры-кастомизации\">Параметры кастомизации\u003c/h2>\u003ch2 id=\"обновление-платежного-блока\">Обновление платежного блока\u003c/h2>\u003ch2 id=\"события-и-виды-коллбэков\">События и виды коллбэков\u003c/h2>\u003ch2 id=\"отписка\">Отписка\u003c/h2>\u003ch2 id=\"демонтаж-из-dom\">Демонтаж из DOM\u003c/h2>","toc":[{"level":2,"title":"Начало работы с платежными блоками","id":"начало-работы-с-платежными-блоками"},{"level":2,"title":"Демо-конструктор","id":"демо-конструктор"},{"level":2,"title":"Полный скрипт","id":"полный-скрипт"},{"level":2,"title":"Параметры инициализации","id":"параметры-инициализации"},{"level":2,"title":"Параметры кастомизации","id":"параметры-кастомизации"},{"level":2,"title":"Обновление платежного блока","id":"обновление-платежного-блока"},{"level":2,"title":"События и виды коллбэков","id":"события-и-виды-коллбэков"},{"level":2,"title":"Отписка","id":"отписка"},{"level":2,"title":"Демонтаж из DOM","id":"демонтаж-из-dom"}]},"tech/checkout":{"id":"tech/checkout","title":"Скрипт check-out","group":"tech","html":"\u003ch2 id=\"демо-checkout\">Демо-checkout\u003c/h2>\u003ch2 id=\"требования\">Требования\u003c/h2>\u003ch2 id=\"как-установить\">Как установить\u003c/h2>\u003ch2 id=\"методы\">Методы\u003c/h2>","toc":[{"level":2,"title":"Демо-checkout","id":"демо-checkout"},{"level":2,"title":"Требования","id":"требования"},{"level":2,"title":"Как установить","id":"как-установить"},{"level":2,"title":"Методы","id":"методы"}]},"tech/orders":{"id":"tech/orders","title":"Одноразовые ссылки","group":"tech","html":"\u003ch2 id=\"начало-работы-с-заказами\">Начало работы с заказами\u003c/h2>\u003ch2 id=\"демо-конструктор\">Демо-конструктор\u003c/h2>\u003ch2 id=\"создание-заказов-с-помощью-api\">Создание заказов с помощью API\u003c/h2>\u003cdiv class=\"imported-api\">\u003cp>Метод формирования ссылки на оплату и последующей отправки уведомления на e-mail адрес плательщика.  \u003c/p>\n\u003cp>\u003cstrong>Адрес метода:\u003c/strong>\u003cbr>\nhttps://api.cloudpayments.ru/orders/create  \u003c/p>\n\u003cp>\u003cstrong>Параметры запроса:\u003c/strong> \u003c/p>\n\u003cdiv class=\"api-table-scroll\" tabindex=\"0\" aria-label=\"Таблица параметров\">\u003ctable>\u003cthead>\n\u003ctr>\n\u003cth>Параметр\u003c/th>\n\u003cth>Формат\u003c/th>\n\u003cth>Применение\u003c/th>\n\u003cth>Описание\u003c/th>\n\u003c/tr>\n\u003c/thead>\u003ctbody>\n\u003ctr>\n\u003ctd>Amount\u003c/td>\n\u003ctd>Number\u003c/td>\n\u003ctd>Обязательный\u003c/td>\n\u003ctd>Cумма платежа в валюте, разделитель точка. Количество не нулевых знаков после точки – 2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Currency\u003c/td>\n\u003ctd>String\u003c/td>\n\u003ctd>Необязательный\u003c/td>\n\u003ctd>Валюта RUB/USD/EUR/GBP (\u003ca href=\"https://developers.cloudpayments.ru/#spisok-valyut\" target=\"_blank\" rel=\"noopener noreferrer\">см. справочник\u003c/a>). Если параметр не передан, то по умолчанию принимает значение RUB\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Description\u003c/td>\n\u003ctd>String\u003c/td>\n\u003ctd>Обязательный\u003c/td>\n\u003ctd>Назначение платежа в свободной форме\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Email\u003c/td>\n\u003ctd>String\u003c/td>\n\u003ctd>Необязательный\u003c/td>\n\u003ctd>E-mail плательщика\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>RequireConfirmation\u003c/td>\n\u003ctd>Bool\u003c/td>\n\u003ctd>Необязательный\u003c/td>\n\u003ctd>Есть значение true — платеж будет выполнен по двухстадийной схеме\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>SendEmail\u003c/td>\n\u003ctd>Bool\u003c/td>\n\u003ctd>Необязательный\u003c/td>\n\u003ctd>Если значение true — плательщик получит письмо со ссылкой на оплату\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>InvoiceId\u003c/td>\n\u003ctd>String\u003c/td>\n\u003ctd>Необязательный\u003c/td>\n\u003ctd>Номер заказа в вашей системе\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>AccountId\u003c/td>\n\u003ctd>String\u003c/td>\n\u003ctd>Необязательный\u003c/td>\n\u003ctd>Идентификатор пользователя в вашей системе\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>OfferUri\u003c/td>\n\u003ctd>String\u003c/td>\n\u003ctd>Необязательный\u003c/td>\n\u003ctd>Ссылка на оферту, которая будет показываться на странице заказа\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Phone\u003c/td>\n\u003ctd>String\u003c/td>\n\u003ctd>Необязательный\u003c/td>\n\u003ctd>Номер телефона плательщика в произвольном формате\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>SendSms\u003c/td>\n\u003ctd>Bool\u003c/td>\n\u003ctd>Необязательный\u003c/td>\n\u003ctd>Если значение true — плательщик получит СМС со ссылкой на оплату\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>SendViber\u003c/td>\n\u003ctd>Bool\u003c/td>\n\u003ctd>Необязательный\u003c/td>\n\u003ctd>Если значение true — плательщик получит сообщение в Viber со ссылкой на оплату\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>CultureName\u003c/td>\n\u003ctd>String\u003c/td>\n\u003ctd>Необязательный\u003c/td>\n\u003ctd>Язык уведомлений. Возможные значения: \"ru-RU\", \"en-US\". (\u003ca href=\"#/tech/api@локализация\">см. справочник\u003c/a>)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>SubscriptionBehavior\u003c/td>\n\u003ctd>String\u003c/td>\n\u003ctd>Необязательный\u003c/td>\n\u003ctd>Для создания платежа с подпиской. Возможные значения: CreateWeekly, CreateMonthly\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>SuccessRedirectUrl\u003c/td>\n\u003ctd>String\u003c/td>\n\u003ctd>Необязательный\u003c/td>\n\u003ctd>Адрес страницы для редиректа при успешной оплате\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>FailRedirectUrl\u003c/td>\n\u003ctd>String\u003c/td>\n\u003ctd>Необязательный\u003c/td>\n\u003ctd>Адрес страницы для редиректа при неуспешной оплате\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>JsonData\u003c/td>\n\u003ctd>Json\u003c/td>\n\u003ctd>Необязательный\u003c/td>\n\u003ctd>Любые другие данные, которые будут связаны с транзакцией, в том числе инструкции для формирования \u003ca href=\"https://developers.cloudpayments.ru/#format-peredachi-dannyh-dlya-onlayn-cheka\" target=\"_blank\" rel=\"noopener noreferrer\">онлайн-чека\u003c/a> должны обёртываться в объект \u003ccode>cloudpayments\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003caside class=\"notice api-callout\" role=\"note\">В ответ на корректно сформированный запрос система возвращает параметры запроса и ссылку на оплату.\u003c/aside>\n\u003cp>\u003cstrong>Пример запроса:\u003c/strong>\u003c/p>\n\u003cdiv class=\"highlight\">\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>JSON\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"api-code-sozdanie-scheta-dlya-otpravki-po-pochte-1\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\">\u003c/rect>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 использования","id":"условия-использования"},{"level":2,"title":"SDK для Android","id":"sdk-для-android"},{"level":3,"title":"Начало работы","id":"начало-работы-1"},{"level":3,"title":"Условия использования","id":"условия-использования-1"}]},"tech/api":{"id":"tech/api","title":"API","group":"tech","html":"\u003cdiv class=\"imported-api\">\u003cp>\u003cstrong>API\u003c/strong> — программный интерфейс системы для взаимодействия с системами ТСП.\u003c/p>\u003cp>Интерфейс работает по адресу \u003ca href=\"https://api.cloudpayments.ru/\" target=\"_blank\" rel=\"noopener noreferrer\">api.cloudpayments.ru\u003c/a> и поддерживает функции для выполнения платежа, отмены оплаты, возврата денег, завершения платежей, выполненных по двухстадийной схеме, создания и отмены подписок на рекуррентные платежи, а также отправки счетов по почте.\u003c/p>\u003ch2 id=\"принцип-работы\">Принцип работы\u003cspan data-doc-anchor=\"\" class=\"doc-anchor\" id=\"123\">\u003c/span>\u003c/h2>\u003cul>\u003cli>\u003cp>Параметры передаются методом POST в теле запроса в формате «ключ=значение» либо в JSON.\u003c/p>\u003c/li>\u003cli>\u003cp>API может принимать не больше 150 000 полей в одном запросе. Тайм-аут на получение ответа от API — 5 минут.\u003c/p>\u003c/li>\u003cli>\u003cp>Во всех запросах к API если передать число с дробной частью в целочисленное поле, то ошибки не будет, зато произойдёт математическое округление.\u003c/p>\u003c/li>\u003cli>\u003cp>API ограничивает максимальное количество одновременных запросов для тестовых терминалов до 5, для боевых до 30. Если количество обрабатываемых в данный момент запросов к сайту больше ограничения - API будет возвращать ответ с HTTP кодом 429 (Too many Requests) до момента пока не будет завершена обработка хотя бы одного запроса. При необходимости пересмотра ограничений - обратитесь к персональному менеджеру.\u003c/p>\u003c/li>\u003c/ul>\u003cp>Выбор формата передачи параметров определяется на стороне клиента и управляется через заголовок запроса \u003ca href=\"https://www.w3.org/Protocols/rfc2616/rfc2616-sec14.html#sec14.17\" target=\"_blank\" rel=\"noopener noreferrer\">Content-Type\u003c/a>.\u003c/p>\u003cul>\u003cli>\u003cp>Для параметров \u003cstrong>«ключ=значение»\u003c/strong> Content-Type: \u003cem>application/x-www-form-urlencoded\u003c/em>;\u003cbr>\u003c/p>\u003c/li>\u003cli>\u003cp>Для параметров \u003cstrong>JSON Content-Type\u003c/strong>: \u003cem>application/json\u003c/em>;\u003c/p>\u003c/li>\u003c/ul>\u003cp>Ответ система выдает в JSON-формате, \u003ca href=\"#123\">который\u003c/a> как минимум включает в себя два параметра: \u003cstrong>Success\u003c/strong> и \u003cstrong>Message\u003c/strong>:\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>json\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-1\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-1\" class=\"language-json\">{ &quot;Success&quot;: false, &quot;Message&quot;: &quot;Invalid Amount value&quot; }\u003c/code>\u003c/pre>\u003c/div>\u003ch2 id=\"аутентификация-запросов\">Аутентификация запросов\u003c/h2>\u003cp>Для аутентификации запроса используется \u003ca href=\"https://en.wikipedia.org/wiki/Basic_access_authentication\" target=\"_blank\" rel=\"noopener noreferrer\">HTTP Basic Auth\u003c/a> — отправка логина и пароля в заголовке HTTP-запроса. В качестве логина используется \u003cstrong>Public ID\u003c/strong>, в качестве пароля — \u003cstrong>API Secret\u003c/strong>. Оба этих значения можно получить в личном кабинете.\u003c/p>\u003caside class=\"api-callout warning\" role=\"note\">\u003cstrong class=\"callout-label\">Внимание\u003c/strong>\u003cp>Если в запросе не передан заголовок с данными аутентификации или переданы неверные данные, система вернет HTTP-статус 401 – Unauthorized.\u003c/p>\u003c/aside>\u003caside class=\"api-callout \" role=\"note\">\u003cstrong class=\"callout-label\">Информация\u003c/strong>\u003cp>API secret используется для обеспечения безопасности. Он должен храниться в защищенном месте.\u003c/p>\u003c/aside>\u003ch2 id=\"идемпотентность-api\">Идемпотентность API\u003c/h2>\u003cp>\u003cstrong>Идемпотентность\u003c/strong> — свойство API при повторном запросе выдавать тот же результат, что на первичный запрос без повторной обработки. Это значит, что вы можете отправить несколько запросов к системе с одинаковым идентификатором, при этом обработан будет только один успешный запрос, а все ответы будут идентичными. Таким образом реализуется защита от сетевых ошибок, которые приводят к созданию дублированных записей и действий.\u003cbr>Для включения идемпотентности необходимо в запросе к API передавать заголовок с ключом \u003cstrong>X-Request-ID\u003c/strong>, содержащий уникальный идентификатор. Формирование идентификатора запроса остается на вашей стороне — это может быть guid, комбинация из номера заказа, даты и суммы или любое другое значение на ваше усмотрение.\u003cbr>Каждый новый запрос, который необходимо обработать, должен включать новое значение \u003cstrong>X-Request-ID\u003c/strong>. Обработанный результат хранится в системе в течение 1 часа.\u003c/p>\u003ch2 id=\"тестовый-метод\">Тестовый метод\u003c/h2>\u003cp>Для проверки взаимодействия с API можно вызвать тестовый метод.\u003c/p>\u003cp>\u003cstrong>Адрес метода:\u003c/strong>\u003cbr>https://api.cloudpayments.ru/test\u003c/p>\u003cp>\u003cstrong>Параметры запроса:\u003c/strong>\u003cbr>Отсутствуют.\u003c/p>\u003cp>\u003cstrong>Пример ответа:\u003c/strong>\u003cbr>В ответ метод возвращает статус запроса.\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>json\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-2\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-2\" class=\"language-json\">{&quot;Success&quot;:true,&quot;Message&quot;:&quot;bd6353c3-0ed6-4a65-946f-083664bf8dbd&quot;}\u003c/code>\u003c/pre>\u003c/div>\u003cp>\u003cbr>\u003c/p>\u003ch2 id=\"бизнес-сценарии-оплаты-технические-аспекты\">Бизнес-сценарии оплаты (технические аспекты)\u003c/h2>\u003ch3 id=\"оплата-по-криптограмме\">Оплата по криптограмме\u003c/h3>\u003caside class=\"api-callout \" role=\"note\">\u003cstrong class=\"callout-label\">Информация\u003c/strong>\u003cp>По требованию НСПК, для ТСП, предоставляющих телекоммуникационные услуги (MCC 4814 Telecommunication Services), обязательна передача номера телефона плательщика. При отсутствии номера телефона в запросе, банки-эквайеры будут отклонять проводимые операции. \u003cbr>\u003cbr>Номер телефона необходимо передавать в объекте Payer в параметре Phone. \u003cbr>Формат передачи: только цифры, без разделителей “( )“, “-“ . \u003cbr>Пример передачи: “+71234567890“\u003c/p>\u003c/aside>\u003cp>Метод для оплаты по криптограмме платежных данных результат алгоритма шифрования. Для формирования криптограммы воспользуйтесь скриптом \u003ca href=\"https://developers.cloudpayments.ru/#skript-checkout\" target=\"_blank\" rel=\"noopener noreferrer\">Checkout\u003c/a>.\u003c/p>\u003cp>\u003cstrong>Адреса метода\u003c/strong>:\u003cbr>https://api.cloudpayments.ru/payments/cards/charge — для \u003ca href=\"https://developers.cloudpayments.ru/#shemy-provedeniya-platezha\" target=\"_blank\" rel=\"noopener noreferrer\">одностадийного платежа\u003c/a>\u003cbr>https://api.cloudpayments.ru/payments/cards/auth — для \u003ca href=\"https://developers.cloudpayments.ru/#shemy-provedeniya-platezha\" target=\"_blank\" rel=\"noopener noreferrer\">двухстадийного\u003c/a>\u003c/p>\u003cp>\u003cstrong>Параметры запроса:\u003c/strong>\u003c/p>\u003cdiv class=\"api-table-scroll\" tabindex=\"0\" aria-label=\"Таблица\">\u003ctable>\u003ctr>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Параметр\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Формат\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Применение\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Описание\u003c/p>\u003c/th>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Amount\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Number\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Cумма платежа в валюте, разделитель точка. Количество не нулевых знаков после точки – 2\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Currency\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Валюта: RUB/USD/EUR/GBP (\u003ca href=\"https://developers.cloudpayments.ru/#spisok-valyut\" target=\"_blank\" rel=\"noopener noreferrer\">см. справочник\u003c/a>). Если параметр не передан, то по умолчанию принимает значение RUB\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>IpAddress\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>IP-адрес плательщика\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>CardCryptogramPacket\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003ca href=\"https://developers.cloudpayments.ru/#skript-checkout\" target=\"_blank\" rel=\"noopener noreferrer\">Криптограмма платежных данных\u003c/a>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Name\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Имя держателя карты латиницей\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>PaymentUrl\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Адрес сайта, с которого совершается вызов скрипта checkout\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>InvoiceId\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Номер счета или заказа\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Description\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Описание оплаты в свободной форме\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>CultureName\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Язык уведомлений. Возможные значения: &quot;ru-RU&quot;, &quot;en-US&quot;. (\u003ca href=\"#/tech/api@локализация\">см. справочник\u003c/a>)\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>AccountId\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный идентификатор пользователя для создания подписки и получения токена\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Email\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>E-mail плательщика, на который будет отправлена квитанция об оплате\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Payer\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Object\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Доп. поле, куда передается информация о плательщике. Используйте следующие параметры: \u003ccode>FirstName\u003c/code>, \u003ccode>LastName\u003c/code>, \u003ccode>MiddleName\u003c/code>, \u003ccode>Birth\u003c/code>, \u003ccode>Street\u003c/code>, \u003ccode>Address\u003c/code>, \u003ccode>City\u003c/code>, \u003ccode>Country\u003c/code>, \u003ccode>Phone\u003c/code>, \u003ccode>Postcode\u003c/code>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>JsonData\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Json\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Любые другие данные, которые будут связаны с транзакцией, в том числе инструкции для \u003ca href=\"https://developers.cloudpayments.ru/#rekurrentnye-platezhi-podpiska\" target=\"_blank\" rel=\"noopener noreferrer\">создания подписки\u003c/a> или формирования \u003ca href=\"https://developers.cloudpayments.ru/#format-peredachi-dannyh-dlya-onlayn-cheka\" target=\"_blank\" rel=\"noopener noreferrer\">онлайн-чека\u003c/a> должны обёртываться в объект \u003ccode>cloudpayments\u003c/code>. Мы зарезервировали названия следующих параметров и отображаем их содержимое в реестре операций, выгружаемом в Личном Кабинете: \u003ccode>name\u003c/code>, \u003ccode>firstName\u003c/code>, \u003ccode>middleName\u003c/code>, \u003ccode>lastName\u003c/code>, \u003ccode>nick\u003c/code>, \u003ccode>phone\u003c/code>, \u003ccode>address\u003c/code>, \u003ccode>comment\u003c/code>, \u003ccode>birthDate\u003c/code>.\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>SaveCard\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>bool\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Признак сохранения карточного токена для проведения оплаты по сохранённой карте (см. \u003ca href=\"#/tech/api@рекарринг\">Оплата по токену (рекарринг)\u003c/a>). \u003cbr>Возможные значения: \u003ccode>true\u003c/code> - после успешной оплаты будет возвращён карточный токен, \u003ccode>false\u003c/code> - токен не будет возвращаться (по-умолчанию) \u003cbr>Параметр SaveCard обрабатывается только при включении настройки &quot;Сохранение токена карты&quot; в Личном Кабинете. При включении настройки &quot;Сохранять принудительно&quot;, параметр SaveCard будет игнорироваться.\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003caside class=\"api-callout \" role=\"note\">\u003cstrong class=\"callout-label\">Информация\u003c/strong>\u003cp>Параметр amount не принимает сумму транзакции меньше 0.01.\u003c/p>\u003c/aside>\u003cp>\u003cem>В ответ сервер возвращает JSON с тремя составляющими\u003c/em>:\u003c/p>\u003cul>\u003cli>\u003cp>\u003cstrong>поле success\u003c/strong> — результат запроса;\u003cbr>\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>поле message\u003c/strong> — описание ошибки;\u003cbr>\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>объект model\u003c/strong> — расширенная информация.\u003c/p>\u003c/li>\u003c/ul>\u003cp>\u003cem>Возможные варианты ответа\u003c/em>:\u003c/p>\u003cul>\u003cli>\u003cp>Некорректно сформирован запрос:\u003cbr>\u003cstrong>success\u003c/strong> — false\u003cbr>\u003cstrong>message\u003c/strong> — описание ошибки\u003cbr>\u003c/p>\u003c/li>\u003cli>\u003cp>Требуется 3-D Secure аутентификация:\u003cbr>\u003cstrong>success\u003c/strong> — false\u003cbr>\u003cstrong>model\u003c/strong> — информация для проведения аутентификации\u003cbr>\u003c/p>\u003c/li>\u003cli>\u003cp>Транзакция отклонена:\u003cbr>\u003cstrong>success\u003c/strong> — false\u003cbr>\u003cstrong>model\u003c/strong> — информация о транзакции и код ошибки\u003cbr>\u003c/p>\u003c/li>\u003cli>\u003cp>Транзакция принята:\u003cbr>\u003cstrong>success\u003c/strong> — true\u003cbr>\u003cstrong>model\u003c/strong> — информация о транзакции\u003cbr>\u003c/p>\u003c/li>\u003c/ul>\u003caside class=\"api-callout \" role=\"note\">\u003cstrong class=\"callout-label\">Информация\u003c/strong>\u003cp>Результат запроса (поле Success) не отражает статус транзакции, а лишь свидетельствует об успешности/неуспешности запроса API. Статус транзакции отражен в дополнительном поле Status, также его можно узнать в результате получения \u003ca href=\"https://developers.cloudpayments.ru/#uvedomleniya\" target=\"_blank\" rel=\"noopener noreferrer\">уведомлений\u003c/a>. Интерпретацию статусов транзакции смотрите в \u003ca href=\"https://developers.cloudpayments.ru/#statusy-operatsiy\" target=\"_blank\" rel=\"noopener noreferrer\">справочнике\u003c/a>.\u003c/p>\u003c/aside>\u003cp>\u003cstrong>Пример запроса на оплату по криптограмме:\u003c/strong>\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>json\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-3\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-3\" class=\"language-json\">{\n    &quot;Amount&quot;:10,\n    &quot;Currency&quot;:&quot;RUB&quot;,\n    &quot;InvoiceId&quot;:&quot;1234567&quot;,\n    &quot;IpAddress&quot;: &quot;123.123.123.123&quot;,\n    &quot;Description&quot;:&quot;Оплата товаров в example.com&quot;,\n
