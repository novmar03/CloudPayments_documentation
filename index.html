code>schema\u003c/code> в поле \u003ccode>MemberId\u003c/code> надо передать только цифровое значение из поля \u003ccode>schema\u003c/code>\u003cbr>Например, для \u003ccode>schema:bank100000000111\u003c/code> передать \u003ccode>MemberId:100000000111\u003c/code>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Amount\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Number\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Cумма платежа в валюте, разделитель точка. Количество не нулевых знаков после точки – 2\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Currency\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Валюта: RUB\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>AccountId\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Идентификатор пользователя\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Email\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>E-mail плательщика, на который будет отправлена квитанция об оплате\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>CultureName\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Язык уведомлений. Возможные значения: &quot;ru-RU&quot;, &quot;en-US&quot;. (\u003ca href=\"https://developers.cloudpayments.ru/#lokalizatsiya\" target=\"_blank\" rel=\"noopener noreferrer\">см. справочник\u003c/a>)\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>InvoiceId\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Номер заказа в вашей системе\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Description\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Описание оплаты в свободной форме\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Payer\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Object\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Доп. поле, куда передается информация о плательщике. Используйте следующие параметры: \u003ccode>FirstName\u003c/code>, \u003ccode>LastName\u003c/code>, \u003ccode>MiddleName\u003c/code>, \u003ccode>Birth\u003c/code>, \u003ccode>Street\u003c/code>, \u003ccode>Address\u003c/code>, \u003ccode>City\u003c/code>, \u003ccode>Country\u003c/code>, \u003ccode>Phone\u003c/code>, \u003ccode>Postcode\u003c/code>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Receiver\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Object\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Доп. поле, куда передается информация о получателе\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Receiver.Phone oudpayments.ru/payments/find\u003c/p>\u003cp>\u003cstrong>Адрес нового метода:\u003c/strong>\u003cbr>https://api.cloudpayments.ru/v2/payments/find\u003c/p>\u003cp>\u003cstrong>Параметры запроса:\u003c/strong>\u003c/p>\u003cdiv class=\"api-table-scroll\" tabindex=\"0\" aria-label=\"Таблица\">\u003ctable>\u003ctr>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Параметр\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Формат\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Применение\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Описание\u003c/p>\u003c/th>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>InvoiceId\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Номер заказа\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cp>Если платеж по указанному номеру заказа был найден, система отобразит либо информацию об \u003ca href=\"https://developers.cloudpayments.ru/#sample-approved\" target=\"_blank\" rel=\"noopener noreferrer\">успешной транзакции\u003c/a>, либо — \u003ca href=\"https://developers.cloudpayments.ru/#sample-declined\" target=\"_blank\" rel=\"noopener noreferrer\">об отклоненной\u003c/a>. Если будет найдено несколько платежей с указанным номером заказа, то система вернет информацию только о последней операции. Отличие нового метода в том, что он ищет по всем платежам, включая возвраты и выплаты на карту.\u003c/p>\u003cp>\u003cstrong>Пример запроса:\u003c/strong>\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>text\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-27\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-wi pan=\"1\">\u003cp>Назначение платежа в свободной форме\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Email\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>E-mail плательщика\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Amount\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Number\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Cумма платежа в валюте, разделитель точка. Количество не нулевых знаков после точки – 2\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Currency\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Валюта: RUB/USD/EUR/GBP (см. \u003ca href=\"https://developers.cloudpayments.ru/#spisok-valyut\" target=\"_blank\" rel=\"noopener noreferrer\">справочник\u003c/a>)\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>RequireConfirmation\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Bool\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Если значение true — платежи будут выполняться по двухстадийной схеме\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>StartDate\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>DateTime\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Дата и время первого платежа по плану во временной зоне UTC. Значение должно быть в будущем\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Interval\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Интервал. Возможные значения: Day, Week, Month\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Period\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Int\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Период. В комбинации с интервалом, 1 Month значит раз в месяц, а 2 Week — раз в две недели. Должен быть больше 0\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>MaxPeriods\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Int\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Максимальное количество платежей в подписке. Если указан, должен быть больше 0\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>CustomerReceipt\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>json\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Для изменения состава \u003ca href=\"https://developers.cloudpayments.ru/#format-peredachi-dannyh-dlya-onlayn-cheka\" target=\"_blank\" rel=\"noopener noreferrer\">онлайн-чека\u003c/a>\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cp>В ответ на корректно сформированный запрос система возвращает сообщение об успешно выполненной операции и идентификатор подписки.\u003c/p>\u003cp>\u003cstrong>Пример запроса:\u003c/strong>\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>text\u003c/span>\u003cbutton type=\" tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Amount\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Number\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Для изменения суммы платежа в валюте, разделитель точка. Количество не нулевых знаков после точки – 2.\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Currency\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Для изменения валюты: RUB/USD/EUR/GBP (\u003ca href=\"https://developers.cloudpayments.ru/#spisok-valyut\" target=\"_blank\" rel=\"noopener noreferrer\">см. справочник\u003c/a>)\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>RequireConfirmation\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Bool\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Для изменения схемы проведения платежей\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>StartDate\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>DateTime\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Для изменения даты и времени первого или следующего платежа во временной зоне UTC\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Interval\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Для изменения интервала. Возможные значения: Day, Week, Month\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Period\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Int\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Для изменения периода. В комбинации с интервалом, 1 Month значит раз в месяц, а 2 Week — раз в две недели\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>MaxPeriods\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Int\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Для изменения максимального количества платежей в подписке\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>CustomerReceipt\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>json\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Для изменения состава \u003ca href=\"https://developers.cloudpayments.ru/#format-peredachi-dannyh-dlya-onlayn-cheka\" target=\"_blank\" rel=\"noopener noreferrer\">онлайн-чека\u003c/a>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>CultureName\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Язык уведомлений. Возможные значения: &quot;ru-RU&quot;, &quot;en-US&quot;. (\u003ca href=\"https://developers.cloudpayments.ru/#lokalizatsiya\" target=\"_blank\" rel=\"noopener noreferrer\">см. справочник\u003c/a>)\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cp>В случае завершения подписки или её отмены Плательщиком или Партнёром, при изменении любого атрибута подписки через API, подписка вновь активируется! В случае, если у подписки был задан MaxPeriods, то у в ение\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Описание\u003c/p>\u003c/th>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Type\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Тип уведомления: Pay/Fail и т.д., кроме Check-уведомления (см. \u003ca href=\"https://developers.cloudpayments.ru/#tipy-operatsiy\" target=\"_blank\" rel=\"noopener noreferrer\">справочник\u003c/a>)\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>IsEnabled\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Bool\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Если значение true — то уведомление включено. Значение по умолчанию — false\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Address\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный, если \u003ccode>IsEnabled=false\u003c/code>, в противном случае обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Адрес для отправки уведомлений (для HTTPS-схемы необходим валидный SSL-сертификат)\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>HttpMethod\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>HTTP-метод для отправки уведомлений. Возможные значения: GET, POST. Значение по умолчанию — GET\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Encoding\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd c  colspan=\"1\" rowspan=\"1\">\u003cp>Русский\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>MSK\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>ru-RU\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Английский\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>CET\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>en-US\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Латышский\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>CET\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>lv\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Азербайджанский\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>AZT\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>az\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Русский\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>ALMT\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>kk\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Украинский\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>EET\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>uk\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Польский\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>CET\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>pl\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Вьетнамский\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>ICT\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>vi\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Турецкий\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>TRT\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>tr\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003ch2 id=\"dlinnaya-zapis\">\u003cstrong>Длинная запись\u003c/strong>\u003c/h2>\u003cp>Длинная запись для авиа (\u003cstrong>airline addendum\u003c/strong>) — расширенная информация о маршрутной квитанции, которая передается вместе с транзакцией на обработку в платежную систему. Использование длинной записи позволяет сократить риски мошеннических операций и снизить стоимость обработки платежа.\u003c/p>\u003cp>Длинная запись состоит из информации о маршрутной квитанции, информации о сегментах, то есть перелетах и информации о пассажирах.\u003c/p>\u003cp>Информация о маршрутной квитанции включает в себя:\u003c/p>\u003cdiv class=\"api-table-scroll\" tabindex=\"0\" aria-label=\"Таблица\">\u003ctable>\u003ctr>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Параметр\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Формат\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Применение\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Описание\u003c/p>\u003c/th>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>BookingRef\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный, если не указан номер билета\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Номер брони\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>TicketNumber\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный, если не указан номер брони\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Номер билета\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cp>Под сегментом понимается один авиаперелет: взлет и посадка. Необходимо указать все сегменты маршрута с перечнем следующих параметров:\u003c/p>\u003cdiv class=\"api-table-scroll\" tabindex=\"0\" aria-label=\"Таблица\">\u003ctable>\u003ctr>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Параметр\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Формат\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Применение\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Описание\u003c/p>\u003c/th>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>FlightNumber\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Номер рейса\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>DepartureDateTime\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>DateTime\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Дата и время отправления\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>ArrivalDateTime\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>DateTime\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Дата и время прибытия\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>OriginatingCountry\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Страна вылета на русском или английском языке\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>OriginatingCity\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Город вылета на русском или английском языке\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>OriginatingAirportCode\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String(3)\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Код аэропорта вылета — 3 буквы по классификации IATA\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>DestinationCountry\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Страна прилета на русском или английском языке\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>DestinationCity\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Город прилета на русском или английском языке\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>DestinationAirportCode\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String(3)\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Код аэропорта прилета — 3 буквы по классификации IATA\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cp>Для передачи информации о пассажирах, необходимо по каждому указать имя и фамилию латиницей:\u003c/p>\u003cdiv class=\"api-table-scroll\" tabindex=\"0\" aria-label=\"Таблица\">\u003ctable>\u003ctr>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Параметр\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Формат\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Применение\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Описание\u003c/p>\u003c/th>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>FirstName\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Имя пассажира\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>LastName\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Фамилия пассажира\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cp>Длинную запись можно передать в систему в параметре \u003cstrong>AirlineAddendum\u003c/strong> при вызове метода оплаты через \u003ca href=\"https://developers.cloudpayments.ru/#api\" target=\"_blank\" rel=\"noopener noreferrer\">API\u003c/a> или в ответе на \u003ca href=\"https://developers.cloudpayments.ru/#check\" target=\"_blank\" rel=\"noopener noreferrer\">запрос проверки платежа\u003c/a>.\u003c/p>\u003cp>\u003cstrong>Пример формирования длинной записи:\u003c/strong>\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>text\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-54\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-54\" class=\"language-text\">{\n   &quot;TicketNumber&quot;:&quot;390 5241025377&quot;,\n   &quot;BookingRef&quot;:null,\n   &quot;Legs&quot;:[\n      {\n         &quot;FlightNumber&quot;:&quot;A3 971&quot;,\n         &quot;DepartureDateTime&quot;:&quot;2014-05-26T05:15:00&quot;,\n         &quot;ArrivalDateTime&quot;:&quot;2014-05-26T07:30:00&quot;,\n         &quot;OriginatingCountry&quot;:&quot;Россия&quot;,\n         &quot;OriginatingCity&quot;:&quot;Москва&quot;,\n         &quot;OriginatingAirportCode&quot;:&quot;DME&quot;,\n         &quot;DestinationCountry&quot;:&quot;Греция&quot;,\n         &quot;DestinationCity&quot;:&quot;Афины&quot;,\n         &quot;DestinationAirportCode&quot;:&quot;ATH&quot;\n      },\n      {\n         &quot;FlightNumber&quot;:&quot;A3 204&quot;,\n         &quot;DepartureDateTime&quot;:&quot;2014-05-26T09:45:00&quot;,\n         &quot;ArrivalDateTime&quot;:&quot;2014-05-26T10:50:00&quot;,\n         &quot;OriginatingCountry&quot;:&quot;Греция&quot;,\n         &quot;OriginatingCity&quot;:&quot;Афины&quot;,\n         &quot;OriginatingAirportCode&quot;:&quot;ATH&quot;,\n         &quot;DestinationCountry&quot;:&quot;Греция&quot;,\n         &quot;DestinationCity&quot;:&quot;Родос&quot;,\n         &quot;DestinationAirportCode&quot;:&quot;RHO&quot;\n      },\n      {\n         &quot;FlightNumber&quot;:&quot;A3 980&quot;,\n         &quot;DepartureDateTime&quot;:&quot;2014-06-06T09:00:00&quot;,\n         &quot;ArrivalDateTime&quot;:&quot;2014-06-06T13:45:00&quot;,\n         &quot;OriginatingCountry&quot;:&quot;Греция&quot;,\n         &quot;OriginatingCity&quot;:&quot;Родос&quot;,\n         &quot;OriginatingAirportCode&quot;:&quot;RHO&quot;,\n         &quot;DestinationCountry&quot;:&quot;Россия&quot;,\n         &quot;DestinationCity&quot;:&quot;Москва&quot;,\n         &quot;DestinationAirportCode&quot;:&quot;DME&quot;\n      }\n   ],\n   &quot;Passengers&quot;:[\n      {\n         &quot;FirstName&quot;:&quot;KONSTANTIN&quot;,\n         &quot;LastName&quot;:&quot;IVANOV&quot;\n      },\n      {\n         &quot;FirstName&quot;:&quot;JULIA&quot;,\n         &quot;LastName&quot;:&quot;IVANOVA&quot;\n      }\n   ]\n}\n\u003c/code>\u003c/pre>\u003c/div>\u003cp>\u003cbr>\u003c/p>\u003c/div>","toc":[{"id":"printsip-raboty","title":"Принцип работы","level":2},{"id":"autentifikatsiya-zaprosov","title":"Аутентификация запросов","level":2},{"id":"idempotentnost-api","title":"Идемпотентность API","level":2},{"id":"testovyy-metod","title":"Тестовый метод","level":2},{"id":"oplata-po-kriptogramme","title":"Оплата по криптограмме","level":2},{"id":"obrabotka-3-d-secure","title":"Обработка 3-D Secure","level":2},{"id":"primer-formy","title":"Пример формы:","level":3},{"id":"oplata-po-tokenu-rekarring","title":"Оплата по токену (рекарринг)","level":2},{"id":"vozmozhnye-varianty","title":"Возможные варианты","level":3},{"id":"podtverzhdenie-oplaty","title":"Подтверждение оплаты","level":2},{"id":"otmena-oplaty","title":"Отмена оплаты","level":2},{"id":"vozvrat-deneg","title":"Возврат денег","level":2},{"id":"vyplata-po-kriptogramme","title":"Выплата по криптограмме","level":2},{"id":"vyplata-po-tokenu","title":"Выплата по токену","level":2},{"id":"vyplata-po-sbp","title":"Выплата по СБП","level":2},{"id":"prosmotr-tranzaktsii","title":"Просмотр транзакции","level":2},{"id":"proverka-statusa-platezha","title":"Проверка статуса платежа","level":2},{"id":"vygruzka-spiska-tranzaktsiy","title":"Выгрузка списка транзакций","level":2},{"id":"vygruzka-spiska-tranzaktsiy-za-proizvolnyy-period","title":"Выгрузка списка транзакций за произвольный период","level":2},{"id":"vygruzka-spiska-pretenziy-za-proizvolnyy-period","title":"Выгрузка списка претензий за произвольный период","level":2},{"id":"vygruzka-tokenov","title":"Выгрузка токенов","level":2},{"id":"sozdanie-podpiski-na-rekurrentnye-platezhi","title":"Создание подписки на рекуррентные платежи","level":2},{"id":"zapros-informatsii-o-podpiske","title":"Запрос информации о подписке","level":2},{"id":"poisk-podpisok","title":"Поиск подписок","level":2},{"id":"izmenenie-podpiski-na-rekurrentnye-platezhi","title":"Изменение подписки на рекуррентные платежи","level":2},{"id":"otmena-podpiski-na-rekurrentnye-platezhi","title":"Отмена подписки на рекуррентные платежи","level":2},{"id":"sozdanie-scheta-dlya-otpravki-po-pochte","title":"Создание счета для отправки по почте","level":2},{"id":"otmena-sozdannogo-scheta","title":"Отмена созданного счета","level":2},{"id":"prosmotr-nastroek-uvedomleniy","title":"Просмотр настроек уведомлений","level":2},{"id":"izmenenie-nastroek-uvedomleniy","title":"Изменение настроек уведомлений","level":2},{"id":"lokalizatsiya","title":"Локализация","level":2},{"id":"dlinnaya-zapis","title":"Длинная запись","level":2}]},"uvedomleniya":{"id":"uvedomleniya","title":"Уведомления","type":"page","audience":"both","group":"root-uvedomleniya","html":"\u003cdiv class=\"imported-api\">\u003cp>Уведомление — HTTP-запрос от системы к вашему сайту. Подобные запросы также называют \u003cstrong>callback\u003c/strong> или \u003cstrong>webhook\u003c/strong>. В системе предусмотрено несколько видов уведомлений: для проверки возможности выполнить оплату, для информирования об успешных и неуспешных платежах, для оповещения об изменении подписок на рекуррентные платежи, а также для информирования о выданных кассовых чеках.\u003c/p>\u003cp>Включение и отключение уведомлений, а также настройка адресов и форматов уведомлений выполняется в ЛК.\u003c/p>\u003cp>Если вы используете уведомления для проверки и изменения статусов заказов в вашей системе, мы рекомендуем сверять сумму, номер заказа и идентификатор аккаунта плательщика.\u003c/p>\u003cp>Для уведомлений (Pay, Fail, Recurrent, Cancel, Confirm, Refund) действует следующие правило: если система не сможет соединиться с сервером ТСП или получит некорректный ответ, либо ответ с кодом, отличным от нуля, то будет совершено 100 попыток доставить сообщение с интервалом между повторами в минутах: 1, 2, 5, 10, 30. Тайм-аут ожидания ответа - 30 секунд. Менее чем в 1% случаев задержка доставки может достигать 2 минуты. В остальных случаях — меньше 1 секунды.\u003c/p>\u003ch2 id=\"check\">\u003cstrong>Check\u003c/strong>\u003c/h2>\u003cp>Выполняется после того, как держатель заполнил платежную форму и нажал кнопку «Оплатить».\u003c/p>\u003cp>Служит для контроля прохождения платежа: система отправляет запрос на адрес сайта ТСП с информацией об оплате, а сайт должен подтвердить или отклонить возможность принять платеж.\u003c/p>\u003cp>Параметры передаются в теле запроса, список представлен в следующей таблице:\u003c/p>\u003cdiv class=\"api-table-scroll\" tabindex=\"0\" aria-label=\"Таблица\">\u003ctable>\u003ctr>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Параметр\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Формат\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Применение\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Описание\u003c/p>\u003c/th>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>TransactionId\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Long\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Номер транзакции в системе\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Amount\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Number, точка в качестве разделителя, две цифры после точки\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Сумма оплаты из параметров платежа\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Currency\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Валюта: RUB/USD/EUR/GBP из параметров платежа (см. \u003ca href=\"https://developers.cloudpayments.ru/#spisok-valyut\" target=\"_blank\" rel=\"noopener noreferrer\">справочник\u003c/a>)\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>PaymentAmount\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Сумма списания\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>PaymentCurrency\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Валюта списания\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>DateTime\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>yyyy-MM-dd HH:mm:ss\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Дата/время создания платежа во временной зоне UTC\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>CardId\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Уникальный идентификатор карты в системе CloudPayments\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>CardFirstSix\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String(6)\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Первые 6 цифр номера карты\u003c/p>\u003c/td>\u003c/tr>\u00 ne\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-1\" class=\"language-text\">{&quot;code&quot;:0}\n\u003c/code>\u003c/pre>\u003c/div>\u003cp>Код определяет результат выполнения проверки возможности выполнить платеж и может принимать следующие значения:\u003c/p>\u003cdiv class=\"api-table-scroll\" tabindex=\"0\" aria-label=\"Таблица\">\u003ctable>\u003ctr>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Код\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Значение\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Результат\u003c/p>\u003c/th>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>0\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Платеж может быть проведен\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Система выполнит авторизацию платежа\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>10\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Неверный номер заказа\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Платеж будет отклонен\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>11\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Некорректный AccountId\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Платеж будет отклонен\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>12\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Неверная сумма\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Платеж будет отклонен\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>13\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Платеж не может быт ом 1 Month значит раз в месяц, а 2 Week — раз в две недели\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Status\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003ca href=\"https://developers.cloudpayments.ru/#statusy-podpisok-rekurrent\" target=\"_blank\" rel=\"noopener noreferrer\">Статусы подписок\u003c/a>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>SuccessfulTransactionsNumber\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Int\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Количество успешных платежей\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>FailedTransactionsNumber\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Int\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Количество неуспешных платежей (обнуляется после каждого успешного)\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>MaxPeriods\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Int\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Максимальное количество платежей в подписке\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>LastTransactionDate\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>yyyy-MM-dd HH:mm:ss\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Дата и время последнего успешного платежа во временной зоне UTC\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>NextTransactionDate\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>yyyy-MM-dd HH:mm:ss\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Дата и время следующего платежа во временной зоне UTC\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cp>В ответ на запрос система ожидает получить ответ в JSON-формате с обязательным параметром code:\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>text\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-6\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-6\" class=\"language-text\">{&quot;code&quot;:0}\n\u003c/code>\u003c/pre>\u003c/div>\u003cp>Код определяет результат обработки сервером ТСП уведомления об изменении подписки и может принимать единственное значение:\u003c/p>\u003cdiv class=\"api-table-scroll\" tabindex=\"0\" aria-label=\"Таблица\">\u003ctable>\u003ctr>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Код\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Значение\u003c/p>\u003c/th>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>0\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Изменения зарегистрированы\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003ch2 id=\"cancel\">\u003cstrong>Cancel\u003c/strong>\u003c/h2>\u003cp>Выполняется в случае, если платеж был отменен по вашей инициативе через \u003ca href=\"https://developers.cloudpayments.ru/#api\" target=\"_blank\" rel=\"noopener noreferrer\">API\u003c/a> или личный кабинет.\u003c/p>\u003cp>Параметры передаются в теле запроса, список представлен в следующей таблице:\u003c/p>\u003cdiv class=\"api-table-scroll\" tabindex=\"0\" aria-label=\"Таблица\">\u003ctable>\u003ctr>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Параметр\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Формат\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Применение\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Описание\u003c/p>\u003c/th>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>TransactionId\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Long\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Номер отмененной транзакции в системе\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Amount\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Number, точка в качестве разделителя, две цифры после точки\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Сумма отмененной транзакции в валюте платежа\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>DateTime\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>yyyy-MM-dd HH:mm:ss\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Дата/время отмены по временной зоне UTC\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>InvoiceId\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Номер заказа отмененной операции\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>AccountId\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Идентификатор пользователя отмененной операции\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Email\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>E-mail адрес плательщика\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Data\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Json\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Произвольный набор параметров, переданных в транзакцию\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Rrn\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Уникальный номер банковской транзакции, который назначается обслуживающим банком\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cp>В ответ на запрос система ожидает получить ответ в JSON-формате с обязательным параметром code:\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>text\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-7\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-7\" class=\"language-text\">{&quot;code&quot;:0}\n\u003c/code>\u003c/pre>\u003c/div>\u003cp>Код определяет результат обработки сервером ТСП уведомления и может принимать единственное значение:\u003c/p>\u003cdiv class=\"api-table-scroll\" tabindex=\"0\" aria-label=\"Таблица\">\u003ctable>\u003ctr>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Код\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Значение\u003c/p>\u003c/th>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>0\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Возврат зарегистрирован\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003ch2 id=\"proverka-uvedomleniy\">\u003cstrong>Проверка уведомлений\u003c/strong>\u003c/h2>\u003cp>Все виды уведомлений — \u003ca href=\"https://developers.cloudpayments.ru/#check\" target=\"_blank\" rel=\"noopener noreferrer\">check\u003c/a>, \u003ca href=\"https://developers.cloudpayments.ru/#pay\" target=\"_blank\" rel=\"noopener noreferrer\">pay\u003c/a>, \u003ca href=\"https://developers.cloudpayments.ru/#fail\" target=\"_blank\" rel=\"noopener noreferrer\">fail\u003c/a>, \u003ca href=\"https://developers.cloudpayments.ru/#confirm\" target=\"_blank\" rel=\"noopener noreferrer\">confirm\u003c/a>, \u003ca href=\"https://developers.cloudpayments.ru/#cancel\" target=\"_blank\" rel=\"noopener noreferrer\">cancel\u003c/a>, \u003ca href=\"https://developers.cloudpayments.ru/#refund\" target=\"_blank\" rel=\"noopener noreferrer\">refund\u003c/a> и \u003ca href=\"https://developers.cloudpayments.ru/#recurrent\" target=\"_blank\" rel=\"noopener noreferrer\">recurrent\u003c/a> содержат 2 HTTP-заголовка \u003cstrong>X-Content-HMAC\u003c/strong> и \u003cstrong>Content-HMAC\u003c/strong>, в которых находится проверочное значение запроса, вычисленное с помощью алгоритма \u003ca href=\"https://ru.wikipedia.org/wiki/HMAC\" target=\"_blank\" rel=\"noopener noreferrer\">HMAC\u003c/a>. Отличие между ними только в том, что первый генерируется из URL decoded (или не encoded) параметров, а второй генерируется из URL encoded параметров, что может вызывать проблемы. Если вам необходимо проверять подлинность и целостность уведомлений, вы можете вычислить проверочное значение на своей стороне и сравнить с тем, что пришло в запросе. Совпадение подтверждает, что уведомление было отправлено от нас и пришло к вам в оригинальном виде.\u003c/p>\u003cp>При реализации проверки сообщения, обратите внимание на следующие моменты:\u003c/p>\u003cul>\u003cli>\u003cp>Для уведомлений, отправленных методом \u003cstrong>POST\u003c/strong>, сообщением является тело запроса. Для \u003cstrong>GET\u003c/strong> — строка параметров;\u003c/p>\u003c/li>\u003cli>\u003cp>При вычислении HMAC следует использовать кодировку \u003cstrong>UTF8\u003c/strong>;\u003c/p>\u003c/li>\u003cli>\u003cp>Хэш вычисляется функцией \u003cstrong>SHA256\u003c/strong>;\u003c/p>\u003c/li>\u003cli>\u003cp>В качестве ключа используется API Secret, который можно получить в личном кабинете;\u003c/p>\u003c/li>\u003cli>\u003cp>Вычисленное значение передается в кодировке \u003cstrong>base64\u003c/strong>.\u003c/p>\u003c/li>\u003c/ul>\u003cp>\u003ca href=\"https://www.jokecamp.com/blog/examples-of-creating-base64-hashes-using-hmac-sha256-in-different-languages/\" target=\"_blank\" rel=\"noopener noreferrer\">Примеры вычисления HMAC\u003c/a> на разных языках программирования.\u003c/p>\u003cp>Адреса, с которых система отправляет уведомления — \u003cstrong>185.98.81.0/28\u003c/strong>, \u003cstrong>87.251.91.160/27\u003c/strong>, \u003cstrong>46.46.175.96/27\u003c/strong>, \u003cstrong>46.46.168.160/27\u003c/strong>, \u003cstrong>162.55.174.97/32\u003c/strong> и \u003cstrong>91.216.178.243/32\u003c/strong>.\u003c/p>\u003cp>В связи с мировыми трендами и выявленными уязвимостями вынуждены отказаться от поддержки протокола SSL3. Поддержка закончилась 8 июня 2020 г.\u003c/p>\u003cp>Для вас это означает, что:\u003c/p>\u003cul>\u003cli>\u003cp>Если вы не используете Pay/Check/Fail/Confirm/Refund/Recurrent/Cancel уведомления, то делать ничего не нужно;\u003c/p>\u003c/li>\u003cli>\u003cp>Если вы используете хотя бы одно из этих уведомлений, то нужно проверить какие протоколы шифрования https поддерживает ваш сервер. Если ваш сервер поддерживает только SSL3, то нужно обновить его минимум до TLS 1.1. Ещё лучше будет если обновить до TLS 1.3. В крайнем случае вы можете перевести уведомления на http-протокол.\u003c/p>\u003c/li>\u003c/ul>\u003cp>Более подробно \u003ca href=\"https://www.ssl.com/ru/%D1%80%D1%83%D0%BA%D0%BE%D0%B2%D0%BE%D0%B4%D1%81%D1%82%D0%B2%D0%BE/%D0%BE%D1%82%D0%BA%D0%BB%D1%8E%D1%87%D0%B8%D1%82%D1%8C-tls-1-0-%D0%B8-1-1-apache-nginx/\" target=\"_blank\" rel=\"noopener noreferrer\">как отказаться от SSL3\u003c/a>. После 8 июня https-уведомления на сервера, поддерживающие только SSL3, могут не доставляться.\u003c/p>\u003c/div>","toc":[{"id":"check","title":"Check","level":2},{"id":"pay","title":"Pay","level":2},{"id":"fail","title":"Fail","level":2},{"id":"confirm","title":"Confirm","level":2},{"id":"refund","title":"Refund","level":2},{"id":"recurrent","title":"Recurrent","level":2},{"id":"cancel","title":"Cancel","level":2},{"id":"proverka-uvedomleniy","title":"Проверка уведомлений","level":2}]},"t-pay":{"id":"t-pay","title":"T-Pay","type":"page","audience":"both","group":"root-t-pay","html":"\u003cdiv class=\"imported-api\">\u003cp>\u003cbr>\u003c/p>\u003cfigure style=\"text-align:center\">\u003cimg data-image-id=\"1a6ceb1f-fa74-49e5-98bf-b389dd406122\" src=\"https://developers.cloudpayments.ru/images/tinkoffpay_cloud-21de4ea9.png\" alt=\"tinkoffpay_cloud\" style=\"width:100%;max-width:100%;height:auto\">\u003c/figure>\u003cp>CloudPayments предлагает метод оплаты в один клик T-Pay. Покупатель может выбрать любой счет для списания в приложении «Т-Банк», а также копить кэшбэк Т-Банк для последующих покупок.\u003c/p>\u003cp>Оплаты по T-Pay можно принимать через SDK. Доступна реализация как через платёжную форму CloudPayments, так и отдельной кнопкой.\u003c/p>\u003cp>Подробнее см. в разделе документации:\u003c/p>\u003cul>\u003cli>\u003cp>SDK для \u003ca href=\"https://developers.cloudpayments.ru/#sdk-dlya-ios\" target=\"_blank\" rel=\"noopener noreferrer\">iOS\u003c/a>\u003c/p>\u003c/li>\u003cli>\u003cp>SDK для \u003ca href=\"https://developers.cloudpayments.ru/#sdk-dlya-android\" target=\"_blank\" rel=\"noopener noreferrer\">Android\u003c/a>\u003c/p>\u003c/li>\u003c/ul>\u003ch2 id=\"poluchenie-ssylki-dlya-oplaty\">\u003cstrong>Получение ссылки для оплаты\u003c/strong>\u003c/h2>\u003ch3 id=\"opisanie\">\u003cstrong>Описание\u003c/strong>\u003c/h3>\u003cp>Метод для получения платёжной ссылки для перенаправления клиента в мобильное приложение банка. В ответе вернётся параметр QrUrl с URL-адресом для перенаправления клиента.\u003c/p>\u003cp>Для проведения платежа, клиента надо перенаправить на полученный URL-адрес.\u003c/p>\u003ch3 id=\"adres-metoda\">\u003cstrong>Адрес метода\u003c/strong>\u003c/h3>\u003cp>\u003ca href=\"https://api.cloudpayments.ru/payments/qr/tinkoffpay/link\" target=\"_blank\" rel=\"noopener noreferrer\">https://api.cloudpayments.ru/payments/qr/tinkoffpay/link\u003c/a>\u003c/p>\u003ch3 id=\"parametry-zaprosa\">\u003cstrong>Параметры запроса\u003c/strong>\u003c/h3>\u003cdiv class=\"api-table-scroll\" tabindex=\"0\" aria-label=\"Таблица\">\u003ctable>\u003ctr>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Параметр\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Формат\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Применение\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Описание\u003c/p>\u003c/th>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>publicId\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Идентификатор сайта, который находится в ЛК\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Amount\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>decimal\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Cумма платежа в валюте, разделитель точка. Количество не нулевых знаков после точки – 2\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Currency\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Валюта: RUB (см. \u003ca href=\"https://developers.cloudpayments.ru/#spisok-valyut\" target=\"_blank\" rel=\"noopener noreferrer\">справочник\u003c/a>)\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Scheme\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>enum string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Схема проведения платежа (см. \u003ca href=\"https://developers.cloudpayments.ru/#vidy-operatsiy\" target=\"_blank\" rel=\"noopener noreferrer\">Виды операций\u003c/a>).\u003cbr>Возможные значения: \u003ccode>0\u003c/code> - одностадийная оплата \u003ccode>1\u003c/code> - двухстадийная оплата\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Browser\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Название браузера клиента на основании userAgent браузера.\u003cbr>Пример значения: \u003ccode>Chrome\u003c/code>, \u003ccode>Firefox\u003c/code>, \u003ccode>MIUI Browser\u003c/code>, \u003ccode>Opera\u003c/code>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Os\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Операционная система устройства плательщика.\u003cbr>Пример значения: \u003ccode>Android\u003c/code>, \u003ccode>iOS\u003c/code>, \u003ccode>Windows\u003c/code>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Webview\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>bool\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Признак открытия браузера в режиме webview.\u003cbr>Возможные значения: \u003ccode>true\u003c/code> - для оплат через webview \u003ccode>false\u003c/code> - для оплат без webview\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Device\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>enum string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Признак устройства плательщика.\u003cbr>Возможные значения:\u003cbr>\u003ccode>MobileApp\u003c/code> - вызов оплаты из мобильного приложения\u003cbr>\u003ccode>DesktopWeb\u003c/code> - вызов оплаты из браузера с десктопа\u003cbr>\u003ccode>Mobile\u003c/code> - вызов из браузера с мобильного устройства\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>SuccessRedirectUrl\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Url для перенаправления клиента после успешной оплаты.\u003cbr>После проведения платежа, клиент будет перенаправлен на указанный адрес из мобильного приложения Банка.\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>FailRedirectUrl\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Url для перенаправления клиента после неуспешной оплаты.\u003cbr>После проведения платежа, клиент будет перенаправлен на указанный адрес из мобильного приложения Банка.\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>IpAddress\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>IP-адрес плательщика\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>AccountId\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Идентификатор пользователя\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Email\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>E-mail плательщика\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>InvoiceId\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Номер счёта или заказа\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Description\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Назначение платежа в свободной форме\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>JsonData\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>json\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Любые другие данные, которые будут связаны с транзакцией, в том числе \u003ca href=\"https://developers.cloudpayments.ru/#rekurrentnye-platezhi-podpiska\" target=\"_blank\" rel=\"noopener noreferrer\">инструкции\u003c/a> для создания подписки или формирования \u003ca href=\"https://developers.cloudpayments.ru/#format-peredachi-dannyh-dlya-onlayn-cheka\" target=\"_blank\" rel=\"noopener noreferrer\">онлайн-чека\u003c/a> должны обёртываться в объект \u003ccode>cloudpayments\u003c/code>. Мы зарезервировали названия следующих параметров и отображаем их содержимое в реестре операций, выгружаемом в Личном Кабинете: \u003ccode>name\u003c/code>, \u003ccode>firstName\u003c/code>, \u003ccode>middleName\u003c/code>, \u003ccode>lastName\u003c/code>, \u003ccode>nick\u003c/code>, \u003ccode>phone\u003c/code>, \u003ccode>address\u003c/code>, \u003ccode>comment\u003c/code>, \u003ccode>birthDate\u003c/code>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>TtlMinutes\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>int\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Время в течение которого будет доступна оплата по QR-коду / ссылке на оплату.\u003cbr>Если параметр не передан, оплату можно будет совершить в течение 24 часов.\u003cbr>\u003cstrong>Важно:\u003c/strong>\u003cbr>- Значение 0 считается \u003cstrong>некорректным\u003c/strong> и может привести к ошибке обработки запроса.\u003cbr>- Если временное ограничение не требуется, параметр следует \u003cstrong>не передавать\u003c/strong> или явно указать как \u003ccode>null\u003c/code>.\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>SaveCard\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>bool\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Признак сохранения карточного токена для проведения оплаты по сохранённой карте (см. \u003ca href=\"https://developers.cloudpayments.ru/#oplata-po-tokenu-rekarring\" target=\"_blank\" rel=\"noopener noreferrer\">Оплата по токену (рекарринг)\u003c/a>).\u003cbr>Возможные значения: \u003ccode>true\u003c/code> - после успешной оплаты будет возвращён карточный токен, \u003ccode>false\u003c/code> - токен не будет возвращаться (по-умолчанию)\u003cbr>Параметр SaveCard обрабатывается только при включении настройки &quot;Сохранение токена карты&quot; в Личном Кабинете. При включении настройки &quot;Сохранять принудительно&quot;, параметр SaveCard будет игнорироваться.\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cp>В ответ сервер возвращает JSON с тремя составляющими:\u003c/p>\u003cul>\u003cli>\u003cp>поле \u003cstrong>success\u003c/strong> — результат запроса;\u003c/p>\u003c/li>\u003cli>\u003cp>поле \u003cstrong>message\u003c/strong> — описание ошибки;\u003c/p>\u003c/li>\u003cli>\u003cp>объект \u003cstrong>model\u003c/strong> — расширенная информация.\u003c/p>\u003c/li>\u003c/ul>\u003cp>Возможные варианты ответа:\u003c/p>\u003col start=\"1\">\u003cli>\u003cp>Некорректно сформирован запрос:\u003c/p>\u003cul>\u003cli>\u003cp>\u003cstrong>success\u003c/strong> — false\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>message\u003c/strong> — описание ошибки\u003c/p>\u003c/li>\u003c/ul>\u003c/li>\u003cli>\u003cp>Транзакция отклонена:\u003c/p>\u003cul>\u003cli>\u003cp>\u003cstrong>success\u003c/strong> — false\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>model\u003c/strong> — информация о транзакции и код ошибки\u003c/p>\u003c/li>\u003c/ul>\u003c/li>\u003cli>\u003cp>Транзакция принята:\u003c/p>\u003cul>\u003cli>\u003cp>\u003cstrong>success\u003c/strong> — true\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>model\u003c/strong> — информация о транзакции\u003c/p>\u003c/li>\u003c/ul>\u003c/li>\u003c/ol>\u003cp>Результат запроса (поле Success) не отражает статус транзакции, а лишь свидетельствует об успешности/неуспешности запроса API. Статус транзакции отражен в дополнительном поле Status, также его можно узнать в результате получения \u003ca href=\"https://developers.cloudpayments.ru/#uvedomleniya\" target=\"_blank\" rel=\"noopener noreferrer\">уведомлений\u003c/a>. Интерпретацию статусов транзакции смотрите в \u003ca href=\"https://developers.cloudpayments.ru/#statusy-operatsiy\" target=\"_blank\" rel=\"noopener noreferrer\">справочнике\u003c/a>.\u003c/p>\u003ch3 id=\"primer-zaprosa\">\u003cstrong>Пример запроса\u003c/strong>\u003c/h3>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>text\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-1\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-1\" class=\"language-text\">{\n    &quot;Amount&quot; : &quot;10&quot;,\n    &quot;AccountId&quot;: &quot;someId&quot;,\n    &quot;InvoiceId&quot;: 12345,\n    &quot;Browser&quot; : &quot;Chrome&quot;,\n    &quot;Currency&quot; : &quot;RUB&quot;,\n    &quot;Device&quot; : &quot;Mobile&quot;,\n    &quot;Description&quot; : &quot;Оплата по T-Pay&quot;,\n    &quot;Email&quot; : &quot;email@email.com&quot;,\n    &quot;IpAddress&quot;: &quot;123.123.123.123&quot;,\n    &quot;Os&quot; : &quot;Android&quot;,\n    &quot;Scheme&quot; : 1,\n    &quot;TtlMinutes&quot; : 30,\n    &quot;SuccessRedirectUrl&quot; : &quot;https://cp.ru&quot;,\n    &quot;FailRedirectUrl&quot; : &quot;https://cp.ru&quot;,\n    &quot;Webview&quot; : false\n}\n\n\u003c/code>\u003c/pre>\u003c/div>\u003ch3 id=\"primer-otveta\">\u003cstrong>Пример ответа\u003c/strong>\u003c/h3>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>text\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-2\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-2\" class=\"language-text\">{\n    &quot;Model&quot;: {\n        &quot;QrUrl&quot;: &quot;{URL-адрес}&quot;,         // будет содержать url-адрес для редиректа\n        &quot;QrImage&quot;: null,                \n        &quot;TransactionId&quot;: 11122233344,   // id транзакции CloudPayments\n        &quot;MerchantOrderId&quot;: &quot;12345&quot;,     // переданный InvoiceId\n        &quot;ProviderQrId&quot;: &quot;&quot;,\n        &quot;Amount&quot;: 10,\n        &quot;Message&quot;: &quot;Created&quot;,     \n        &quot;IsTest&quot;: false\n    },\n    &quot;Success&quot;: true,\n    &quot;Message&quot;: null\n}\n\u003c/code>\u003c/pre>\u003c/div>\u003ch2 id=\"poluchenie-qr-koda-dlya-oplaty\">\u003cstrong>Получение QR-кода для оплаты\u003c/strong>\u003c/h2>\u003ch3 id=\"opisanie-2\">\u003cstrong>Описание\u003c/strong>\u003c/h3>\u003cp>Метод для получения QR-кода для отображения клиенту в браузере. В ответе вернётся параметр \u003ccode>QrImage\u003c/code> с QR-кодом в формате imageSVG для отображения клиенту. Значение строки закодировано в base64.\u003c/p>\u003cp>Адрес метода \u003ca href=\"https://api.cloudpayments.ru/payments/qr/tinkoffpay/image\" target=\"_blank\" rel=\"noopener noreferrer\">https://api.cloudpayments.ru/payments/qr/tinkoffpay/image\u003c/a>\u003c/p>\u003ch3 id=\"parametry-zaprosa-2\">\u003cstrong>Параметры запроса\u003c/strong>\u003c/h3>\u003cp>\u003ca href=\"https://developers.cloudpayments.ru/#poluchenie-ssylki-dlya-oplaty\" target=\"_blank\" rel=\"noopener noreferrer\">см. T-Pay. Получение ссылки для оплаты\u003c/a>\u003c/p>\u003ch3 id=\"primer-zaprosa-2\">\u003cstrong>Пример запроса\u003c/strong>\u003c/h3>\u003cp>\u003ca href=\"https://developers.cloudpayments.ru/#poluchenie-ssylki-dlya-oplaty\" target=\"_blank\" rel=\"noopener noreferrer\">см. T-Pay. Получение ссылки для оплаты\u003c/a>\u003c/p>\u003ch3 id=\"primer-otveta-2\">\u003cstrong>Пример ответа\u003c/strong>\u003c/h3>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>text\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-3\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-3\" class=\"language-text\">{\n    &quot;Model&quot;: {\n        &quot;QrUrl&quot;: null,         \n        &quot;QrImage&quot;: {string},            // будет содержать svg в base64\n        &quot;TransactionId&quot;: 11122233344,   // id транзакции CloudPayments\n        &quot;MerchantOrderId&quot;: &quot;12345&quot;,     // переданный InvoiceId\n        &quot;ProviderQrId&quot;: &quot;&quot;,\n        &quot;Amount&quot;: 10,\n        &quot;Message&quot;: &quot;Created&quot;,     \n        &quot;IsTest&quot;: false\n    },\n    &quot;Success&quot;: true,\n    &quot;Message&quot;: null\n}\n\u003c/code>\u003c/pre>\u003c/div>\u003cp>\u003cbr>\u003c/p>\u003c/div>","toc":[{"id":"poluchenie-ssylki-dlya-oplaty","title":"Получение ссылки для оплаты","level":2},{"id":"opisanie","title":"Описание","level":3},{"id":"adres-metoda","title":"Адрес метода","level":3},{"id":"parametry-zaprosa","title":"Параметры запроса","level":3},{"id":"primer-zaprosa","title":"Пример запроса","level":3},{"id":"primer-otveta","title":"Пример ответа","level":3},{"id":"poluchenie-qr-koda-dlya-oplaty","title":"Получение QR-кода для оплаты","level":2},{"id":"opisanie-2","title":"Описание","level":3},{"id":"parametry-zaprosa-2","title":"Параметры запроса","level":3},{"id":"primer-zaprosa-2","title":"Пример запроса","level":3},{"id":"primer-otveta-2","title":"Пример ответа","level":3}]},"sbp":{"id":"sbp","title":"СБП","type":"page","audience":"both","group":"root-sbp","html":"\u003cdiv class=\"imported-api\">\u003cfigure style=\"text-align:center\">\u003cimg data-image-id=\"19a3adc9-bb15-465d-bc41-574425ea8f87\" src=\"https://developers.cloudpayments.ru/images/sbp_cloud-6fef883b.png\" alt=\"sbp_cloud\" style=\"width:100%;max-width:100%;height:auto\">\u003c/figure>\u003cp>CloudPayments предлагает метод оплаты в один клик через СБП. Покупатель может выбрать любой банк для списания через Систему Быстрых Платежей.\u003c/p>\u003ch2 id=\"sbp-poluchenie-ssylki-dlya-oplaty\">\u003cstrong>Получение ссылки для оплаты\u003c/strong>\u003c/h2>\u003ch3 id=\"opisanie\">\u003cstrong>Описание\u003c/strong>\u003c/h3>\u003cp>Метод для получения платёжной ссылки для перенаправления клиента в мобильное приложение банка. В ответе вернётся параметр \u003ccode>QrUrl\u003c/code> с URL-адресом для перенаправления клиента.\u003c/p>\u003cp>Для проведения платежа, клиента надо перенаправить на полученный URL-адрес.\u003c/p>\u003ch3 id=\"adres-metoda\">\u003cstrong>Адрес метода\u003c/strong>\u003c/h3>\u003cp>https://api.cloudpayments.ru/payments/qr/sbp/link\u003c/p>\u003ch3 id=\"sbp-parametry-zaprosa\">\u003cstrong>Параметры запроса\u003c/strong>\u003c/h3>\u003cdiv class=\"api-table-scroll\" tabindex=\"0\" aria-label=\"Таблица\">\u003ctable>\u003ctr>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Параметр\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Формат\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Применение\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Описание\u003c/p>\u003c/th>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>PublicId\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Идентификатор сайта, который находится в ЛК\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Amount\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Decimal\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Cумма платежа в рублях, разделитель точка. Количество не нулевых знаков после точки – 2\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Currency\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Валюта: RUB (см. \u003ca href=\"https://developers.cloudpayments.ru/#spisok-valyut\" target=\"_blank\" rel=\"noopener noreferrer\">справочник\u003c/a>)\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Description\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Назначение платежа в свободной форме\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>AccountId\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Идентификатор пользователя, используется для создания подписки и получения токена\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Email\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>E-mail плательщика, на который будет отправлена квитанция об оплате\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>JsonData\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Json\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Любые другие данные, которые будут связаны с транзакцией, в том числе \u003ca href=\"https://developers.cloudpayments.ru/#rekurrentnye-platezhi-podpiska\" target=\"_blank\" rel=\"noopener noreferrer\">инструкции\u003c/a> для создания подписки или формирования \u003ca href=\"https://developers.cloudpayments.ru/#format-peredachi-dannyh-dlya-onlayn-cheka\" target=\"_blank\" rel=\"noopener noreferrer\">онлайн-чека\u003c/a> должны обёртываться в объект \u003ccode>cloudpayments\u003c/code>. Мы зарезервировали названия следующих параметров и отображаем их содержимое в реестре операций, выгружаемом в Личном Кабинете: \u003ccode>name\u003c/code>, \u003ccode>firstName\u003c/code>, \u003ccode>middleName\u003c/code>, \u003ccode>lastName\u003c/code>, \u003ccode>nick\u003c/code>, \u003ccode>phone\u003c/code>, \u003ccode>address\u003c/code>, \u003ccode>comment\u003c/code>, \u003ccode>birthDate\u003c/code>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>InvoiceId\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Идентификатор/номер счета.\u003cbr>\u003cbr>Приходит в Check-уведомлении и может использоваться для сверки номера заказа\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Scheme\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Enum String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Схема проведения платежа (см. \u003ca href=\"https://developers.cloudpayments.ru/#vidy-operatsiy\" target=\"_blank\" rel=\"noopener noreferrer\">Виды операций\u003c/a>).\u003cbr>Возможные значения: \u003ccode>charge\u003c/code> - одностадийная оплата\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>SuccessRedirectUrl\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Url для перенаправления клиента после успешной оплаты. После проведения платежа, клиент будет перенаправлен на указанный адрес из мобильного приложения Банка.\u003cbr>Значение должно содержать не более 1024 символов, быть в кодировке ASCII и соответствовать формату спецификации RFC-3986.\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>IpAddress\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>IP-адрес плательщика\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Os\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c
