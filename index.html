udience":"both","description":"","root":true,"items":[{"id":"platezhniy-widget","title":"Платежный виджет","type":"page","audience":"both"}]},{"id":"root-platezhniy-konstructor","title":"Платежный конструктор","audience":"both","description":"","root":true,"items":[{"id":"platezhniy-konstructor","title":"Платежный конструктор","type":"page","audience":"both"}]},{"id":"root-script-checkout","title":"Скрипт checkout","audience":"both","description":"","root":true,"items":[{"id":"script-checkout","title":"Скрипт checkout","type":"page","audience":"both"}]},{"id":"root-recurrentniye-platezhi","title":"Рекуррентные платежи","audience":"both","description":"","root":true,"items":[{"id":"recurrentniye-platezhi","title":"Рекуррентные платежи","type":"page","audience":"both"}]},{"id":"root-bezopasnaya-sdelka","title":"Безопасная сделка","audience":"both","description":"","root":true,"items":[{"id":"bezopasnaya-sdelka","title":"Безопасная сделка","type":"page","audience":"both"}]},{"id":"root-SDK-dlya-iOS","title":"SDK для iOS","audience":"both","description":"","root":true,"items":[{"id":"SDK-dlya-iOS","title":"SDK для iOS","type":"page","audience":"both"}]},{"id":"root-SDK-dlya-Android","title":"SDK для Android","audience":"both","description":"","root":true,"items":[{"id":"SDK-dlya-Android","title":"SDK для Android","type":"page","audience":"both"}]},{"id":"root-api","title":"API","audience":"both","description":"","root":true,"items":[{"id":"api","title":"API","type":"page","audience":"both"}]},{"id":"root-uvedomleniya","title":"Уведомления","audience":"both","description":"","root":true,"items":[{"id":"uvedomleniya","title":"Уведомления","type":"page","audience":"both"}]},{"id":"root-t-pay","title":"T-Pay","audience":"both","description":"","root":true,"items":[{"id":"t-pay","title":"T-Pay","type":"page","audience":"both"}]},{"id":"root-sbp","title":"СБП","audience":"both","description":"","root":true,"items":[{"id":"sbp","title":"СБП","type":"page","audience":"both"}]},{"id":"root-digital-ruble","title":"Цифровой рубль","audience":"both","description":"","root":true,"items":[{"id":"digital-ruble","title":"Цифровой рубль","type":"page","audience":"both"}]},{"id":"root-sberpay","title":"SberPay","audience":"both","description":"","root":true,"items":[{"id":"sberpay","title":"SberPay","type":"page","audience":"both"}]},{"id":"root-mirpay","title":"MIR Pay","audience":"both","description":"","root":true,"items":[{"id":"mirpay","title":"MIR Pay","type":"page","audience":"both"}]},{"id":"root-dolyami","title":"Долями","audience":"both","description":"","root":true,"items":[{"id":"dolyami","title":"Долями","type":"page","audience":"both"}]},{"id":"root-scenarii-integracii","title":"Сценарии интеграции","audience":"both","description":"","root":true,"items":[{"id":"scenarii-integracii","title":"Сценарии интеграции","type":"page","audience":"both"}]},{"id":"root-pci-dss","title":"PCI DSS","audience":"both","description":"","root":true,"items":[{"id":"pci-dss","title":"PCI DSS","type":"page","audience":"both"}]},{"id":"root-online-kassa","title":"Онлайн-касса для интернет-расчетов","audience":"both","description":"","root":true,"items":[{"id":"online-kassa","title":"Онлайн-касса для интернет-расчетов","type":"page","audience":"both"}]},{"id":"root-testirovaniye","title":"Тестирование","audience":"both","description":"","root":true,"items":[{"id":"testirovaniye","title":"Тестирование","type":"page","audience":"both"}]},{"id":"root-spravochniki","title":"Справочники","audience":"both","description":"","root":true,"items":[{"id":"spravochniki","title":"Справочники","type":"page","audience":"both"}]}],"pages":{"termini-i-opredeleniya":{"id":"termini-i-opredeleniya","title":"Термины и определения","type":"page","audience":"both","group":"category/1b3e52fd-aa98-4fcf-b2fe-1661467d792f","html":"\u003cdiv class=\"imported-api\">\u003ch2 id=\"terminy-i-opredeleniya\">\u003cstrong>Термины и определения\u003c/strong>\u003c/h2>\u003cul>\u003cli>\u003cp>\u003cstrong>Система\u003c/strong> — платежный шлюз CloudPayments.\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>ТСП\u003c/strong> — торгово-сервисное предприятие, работающее с системой.\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>API\u003c/strong> — программный интерфейс для взаимодействия с системой, расположенный по адресу \u003ca href=\"https://api.cloudpayments.ru/\" target=\"_blank\" rel=\"noopener noreferrer\">https://api.cloudpayments.ru\u003c/a>\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>ЛК\u003c/strong> — личный кабинет ТСП в системе, расположенный по адресу \u003ca href=\"https://merchant.cloudpayments.ru/\" target=\"_blank\" rel=\"noopener noreferrer\">https://merchant.cloudpayments.ru\u003c/a>\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>Карта\u003c/strong> — банковская карта платежных систем Visa, MasterCard или МИР.\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>Эквайер\u003c/strong> — расчетный банк.\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>Эмитент\u003c/strong> — банк, выпустивший карту.\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>Держатель\u003c/strong> — физическое лицо, которому эмитент выдал карту в пользование.\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>Виджет\u003c/strong> — платежная форма, предоставленная системой для ввода реквизитов карты держателем и последующей авторизации.\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>3-D Secure\u003c/strong> — протокол проверки держателя эмитентом.\u003c/p>\u003c/li>\u003c/ul>\u003ch2 id=\"vidy-operatsiy\">\u003cstrong>Виды операций\u003c/strong>\u003c/h2>\u003cp>Система предполагает два вида операций: оплата и возврат.\u003c/p>\u003cul>\u003cli>\u003cp>При оплате деньги перечисляются со счета держателя в пользу ТСП. В случае возврата — наоборот.\u003c/p>\u003c/li>\u003cli>\u003cp>Возврат выполняет ТСП, если покупатель хочет вернуть товар.\u003c/p>\u003c/li>\u003cli>\u003cp>Возврат всегда связан с операцией оплаты, сумма средств с которой будет возвращена держателю. Возвращать можно как всю сумму оплаты, так и ее часть. Деньги обычно возвращаются на карту держателя в тот же день, но иногда, в зависимости от банка-эмитента, могут идти до 3-х дней.\u003c/p>\u003c/li>\u003cli>\u003cp>Операцию оплаты, в отличие от возврата, можно отменить.\u003c/p>\u003c/li>\u003cli>\u003cp>Отмену оплаты выполняет ТСП в случае, если платеж был совершен с ошибкой: неверная сумма, технический сбой и т.д. Есть ограничение — отменить операцию можно только в случае использования двухстадийной схемы оплаты. Деньги при этом будут разблокированы на карте держателя практически мгновенно.\u003c/p>\u003c/li>\u003c/ul>\u003ch2 id=\"shemy-provedeniya-platezha\">\u003cstrong>Схемы проведения платежа\u003c/strong>\u003c/h2>\u003cp>Существует два варианта проведения операции оплаты: одностадийная и двухстадийная, их также называют \u003cstrong>single message system\u003c/strong> (SMS) и \u003cstrong>dual message system\u003c/strong> (DMS).\u003c/p>\u003cp>\u003cstrong>Одностадийная\u003c/strong> оплата выполняется одной командой, по результатам которой проходит авторизация и последующее списание средств в пользу ТСП.\u003c/p>\u003cp>\u003cstrong>Двухстадийная\u003c/strong> оплата использует две команды: отдельно на авторизацию и списание. После успешной авторизации сумма операции будет блокирована на счету держателя, то есть он не сможет ей воспользоваться. Далее у ТСП есть до 7 дней, в зависимости от типа карты, для подтверждения операции, после чего произойдет списание денег. Если операцию не подтвердить в течение этого времени — она будет автоматически отменена. Подтверждать можно как всю сумму авторизации, так и ее часть.\u003cbr>Как правило, двухстадийная схема используется для получения депозита с плательщика, например, в прокатных компаниях или отелях.\u003c/p>\u003cp>В зависимости от настройки, система может автоматически выполнять подтверждение двухстадийных платежей через указанное количество дней.\u003c/p>\u003ch2 id=\"sposoby-oplaty\">\u003cstrong>Способы оплаты\u003c/strong>\u003c/h2>\u003cp>Оплату можно проводить следующими способами:\u003c/p>\u003cul>\u003cli>\u003cp>Через платежную форму — \u003ca href=\"https://developers.cloudpayments.ru/#platezhnyy-vidzhet\" target=\"_blank\" rel=\"noopener noreferrer\">виджет\u003c/a>. На вашем сайте прописывается скрипт, который открывает защищенную платежную форму - iframe для ввода карточных данных.\u003c/p>\u003c/li>\u003cli>\u003cp>Через \u003ca href=\"https://developers.cloudpayments.ru/#api\" target=\"_blank\" rel=\"noopener noreferrer\">API\u003c/a> по криптограмме карты. На вашем сайте прописывается скрипт \u003ca href=\"https://developers.cloudpayments.ru/#skript-checkout\" target=\"_blank\" rel=\"noopener noreferrer\">checkout\u003c/a>, который собирает карточные данные из любой формы на сайте, шифрует и создает криптограмму для безопасной передачи через межсерверное взаимодействие.\u003c/p>\u003c/li>\u003cli>\u003cp>Через SDK для мобильных приложений. Интегрируйте мобильный SDK в ваше приложение для \u003ca href=\"https://developers.cloudpayments.ru/#sdk-dlya-ios\" target=\"_blank\" rel=\"noopener noreferrer\">iOS\u003c/a> или \u003ca href=\"https://developers.cloudpayments.ru/#sdk-dlya-android\" target=\"_blank\" rel=\"noopener noreferrer\">Android\u003c/a> и принимайте карты к оплате с телефона или планшета ваших покупателей.\u003c/p>\u003c/li>\u003cli>\u003cp>Через \u003ca href=\"https://developers.cloudpayments.ru/#api\" target=\"_blank\" rel=\"noopener noreferrer\">API\u003c/a> по токену карты - рекарринг. После первой оплаты через виджет или криптограмму система присваивает карточным данным идентификатор — токен, который можно безопасно хранить и использовать для безакцептных платежей - pay per click. Токен возвращается в \u003ca href=\"https://developers.cloudpayments.ru/#pay\" target=\"_blank\" rel=\"noopener noreferrer\">Pay\u003c/a>-уведомлении и в ответе системы на запрос по API.\u003c/p>\u003c/li>\u003cli>\u003cp>С помощью настроенного плана периодических платежей (рекуррент).\u003cbr>После первой оплаты или авторизации на 1 рубль для проверки карты система присваивает карточным данным токен, который далее используется для \u003ca href=\"https://developers.cloudpayments.ru/#sozdanie-podpiski-na-rekurrentnye-platezhi\" target=\"_blank\" rel=\"noopener noreferrer\">создания плана подписки\u003c/a> на рекуррентные платежи. Оплата производится системой автоматически, без подтверждения плательщика, в соответствии с настроенным периодом, который может быть один раз в день (один раз в несколько дней), один раз в неделю (один раз в несколько недель) или один раз в месяц (один раз в несколько месяцев). Если очередная попытка оплаты не удалась, система отправляет уведомление и повторяет попытку через сутки. После трех неудачных попыток подряд система отменяет подписку.\u003cbr>При создании плана можно указать максимальное количество периодов, например, 12 месяцев при ежемесячной оплате, после чего подписка будет автоматически завершена.\u003c/p>\u003c/li>\u003cli>\u003cp>Кастомизируемые формы приема платежей.\u003cbr>Платежные формы позволяют фондам и другим организациям принимать пожертвования на свой счет с помощью настраиваемой, кастомизируемой платежной формы, которая может быть представлена в виде ссылки \u003cem>\u003ca href=\"http://c.cloudpayments.ru/payments/\" target=\"_blank\" rel=\"noopener noreferrer\">c.cloudpayments.ru/payments/\u003c/a>\u003c/em> и в виде QR-кода, который можно разместить, как в онлайн-трансляции, так и в офлайн-материалах (листовки, буклеты и т.д.). Форма значительно упрощает прием пожертвований. В новом разделе личного кабинета «Платежные формы» можно создавать и кастомизировать до 5 платежных форм. Ссылку и QR-код для отправки плательщикам можно получить после сохранения формы.\u003c/p>\u003c/li>\u003c/ul>\u003ch2 id=\"3-d-secure\">\u003cstrong>3-D Secure\u003c/strong>\u003c/h2>\u003cp>3-D Secure — общее название программ Verified By Visa и Mastercard Secure Code от платежных систем Visa и MasterCard. Суть программы - в проверке подлинности держателя защита от несанкционированного использования карты эмитентом перед оплатой. На практике это выглядит так: держатель указывает реквизиты карты, далее открывается сайт эмитента, где держателю предлагается ввести пароль или секретный код. Как правило, код отправляется в СМС-сообщении. Если код указан правильно, оплата будет проведена. Если нет — отклонена.\u003cbr>\u003c/p>\u003cfigure style=\"text-align:center\">\u003cimg data-image-id=\"e7366d02-0659-449e-bbb6-4d3c6610ff9b\" src=\"https://developers.cloudpayments.ru/images/3ds-demo-9120e58c.png\" alt=\"3ds-demo\" style=\"width:100%;max-width:100%;height:auto\">\u003c/figure>\u003cp>3-D Secure в процессе оплаты появляется не на всех картах, а только тех, банки-эмитенты которых поддерживают данную технологию. Проведение оплаты без 3-D Secure является менее безопасным вариантом.\u003c/p>\u003c/div>","toc":[{"id":"terminy-i-opredeleniya","title":"Термины и определения","level":2},{"id":"vidy-operatsiy","title":"Виды операций","level":2},{"id":"shemy-provedeniya-platezha","title":"Схемы проведения платежа","level":2},{"id":"sposoby-oplaty","title":"Способы оплаты","level":2},{"id":"3-d-secure","title":"3-D Secure","level":2}]},"vidi-operaciy":{"id":"vidi-operaciy","title":"Виды операций","type":"page","audience":"both","hidden":true,"group":"category/1b3e52fd-aa98-4fcf-b2fe-1661467d792f","html":"","toc":[]},"shemi-provedeniya-platezha":{"id":"shemi-provedeniya-platezha","title":"Схемы проведения платежа","type":"page","audience":"both","hidden":true,"group":"category/1b3e52fd-aa98-4fcf-b2fe-1661467d792f","html":"","toc":[]},"sposobi-oplati":{"id":"sposobi-oplati","title":"3D Secure","type":"page","audience":"both","hidden":true,"group":"category/1b3e52fd-aa98-4fcf-b2fe-1661467d792f","html":"","toc":[]},"3d-secure":{"id":"3d-secure","title":"3D Secure","type":"page","audience":"both","hidden":true,"group":"category/1b3e52fd-aa98-4fcf-b2fe-1661467d792f","html":"","toc":[]},"obzhaya-informatsiya":{"id":"obzhaya-informatsiya","title":"Общая информация","type":"page","audience":"both","group":"root-obzhaya-informatsiya","html":"\u003cdiv class=\"imported-api\">\u003ch2 id=\"terminy-i-opredeleniya\">\u003cstrong>Термины и определения\u003c/strong>\u003c/h2>\u003cul>\u003cli>\u003cp>\u003cstrong>Система\u003c/strong> — платежный шлюз CloudPayments.\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>ТСП\u003c/strong> — торгово-сервисное предприятие, работающее с системой.\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>API\u003c/strong> — программный интерфейс для взаимодействия с системой, расположенный по адресу https://api.cloudpayments.ru\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>ЛК\u003c/strong> — личный кабинет ТСП в системе, расположенный по адресу \u003ca href=\"https://merchant.cloudpayments.ru/\" target=\"_blank\" rel=\"noopener noreferrer\">https://merchant.cloudpayments.ru\u003c/a>\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>Карта\u003c/strong> — банковская карта платежных систем Visa, MasterCard или МИР.\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>Эквайер\u003c/strong> — расчетный банк.\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>Эмитент\u003c/strong> — банк, выпустивший карту.\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>Держатель\u003c/strong> — физическое лицо, которому эмитент выдал карту в пользование.\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>Виджет\u003c/strong> — платежная форма, предоставленная системой для ввода реквизитов карты держателем и последующей авторизации.\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>3-D Secure\u003c/strong> — протокол проверки держателя эмитентом.\u003c/p>\u003c/li>\u003c/ul>\u003ch2 id=\"vidy-operatsiy\">\u003cstrong>Виды операций\u003c/strong>\u003c/h2>\u003cp>Система предполагает два вида операций: оплата и возврат.\u003c/p>\u003cul>\u003cli>\u003cp>При оплате деньги перечисляются со счета держателя в пользу ТСП. В случае возврата — наоборот.\u003c/p>\u003c/li>\u003cli>\u003cp>Возврат выполняет ТСП, если покупатель хочет вернуть товар.\u003c/p>\u003c/li>\u003cli>\u003cp>Возврат всегда связан с операцией оплаты, сумма средств с которой будет возвращена держателю. Возвращать можно как всю сумму оплаты, так и ее часть. Деньги обычно возвращаются на карту держателя в тот же день, но иногда, в зависимости от банка-эмитента, могут идти до 3-х дней.\u003c/p>\u003c/li>\u003cli>\u003cp>Операцию оплаты, в отличие от возврата, можно отменить.\u003c/p>\u003c/li>\u003cli>\u003cp>Отмену оплаты выполняет ТСП в случае, если платеж был совершен с ошибкой: неверная сумма, технический сбой и т.д. Есть ограничение — отменить операцию можно только в случае использования двухстадийной схемы оплаты. Деньги при этом будут разблокированы на карте держателя практически мгновенно.\u003c/p>\u003c/li>\u003c/ul>\u003ch2 id=\"shemy-provedeniya-platezha\">\u003cstrong>Схемы проведения платежа\u003c/strong>\u003c/h2>\u003cp>Существует два варианта проведения операции оплаты: одностадийная и двухстадийная, их также называют \u003cstrong>single message system\u003c/strong> (SMS) и \u003cstrong>dual message system\u003c/strong> (DMS).\u003c/p>\u003cp>\u003cstrong>Одностадийная\u003c/strong> оплата выполняется одной командой, по результатам которой проходит авторизация и последующее списание средств в пользу ТСП.\u003c/p>\u003cp>\u003cstrong>Двухстадийная\u003c/strong> оплата использует две команды: отдельно на авторизацию и списание. После успешной авторизации сумма операции будет блокирована на счету держателя, то есть он не сможет ей воспользоваться. Далее у ТСП есть до 7 дней, в зависимости от типа карты, для подтверждения операции, после чего произойдет списание денег. Если операцию не подтвердить в течение этого времени — она будет автоматически отменена. Подтверждать можно как всю сумму авторизации, так и ее часть.\u003cbr>Как правило, двухстадийная схема используется для получения депозита с плательщика, например, в прокатных компаниях или отелях.\u003c/p>\u003cp>В зависимости от настройки, система может автоматически выполнять подтверждение двухстадийных платежей через указанное количество дней.\u003c/p>\u003ch2 id=\"sposoby-oplaty\">\u003cstrong>Способы оплаты\u003c/strong>\u003c/h2>\u003cp>Оплату можно проводить следующими способами:\u003c/p>\u003cul>\u003cli>\u003cp>Через платежную форму — \u003ca href=\"/platezhniy-widget/\">виджет\u003c/a>. На вашем сайте прописывается скрипт, который открывает защищенную платежную форму - iframe для ввода карточных данных.\u003c/p>\u003c/li>\u003cli>\u003cp>Через \u003ca href=\"/api/\">API\u003c/a> по криптограмме карты. На вашем сайте прописывается скрипт \u003ca href=\"/script-checkout/\">checkout\u003c/a>, который собирает карточные данные из любой формы на сайте, шифрует и создает криптограмму для безопасной передачи через межсерверное взаимодействие.\u003c/p>\u003c/li>\u003cli>\u003cp>Через SDK для мобильных приложений. Интегрируйте мобильный SDK в ваше приложение для \u003ca href=\"/SDK-dlya-iOS/\">iOS\u003c/a> или \u003ca href=\"/SDK-dlya-Android/\">Android\u003c/a> и принимайте карты к оплате с телефона или планшета ваших покупателей.\u003c/p>\u003c/li>\u003cli>\u003cp>Через \u003ca href=\"/api/\">API\u003c/a> по токену карты - рекарринг. После первой оплаты через виджет или криптограмму система присваивает карточным данным идентификатор — токен, который можно безопасно хранить и использовать для безакцептных платежей - pay per click. Токен возвращается в \u003ca href=\"/uvedomleniya/#pay\">Pay\u003c/a>-уведомлении и в ответе системы на запрос по API.\u003c/p>\u003c/li>\u003cli>\u003cp>С помощью настроенного плана периодических платежей (рекуррент).\u003cbr>После первой оплаты или авторизации на 1 рубль для проверки карты система присваивает карточным данным токен, который далее используется для \u003ca href=\"/api/#sozdanie-podpiski-na-rekurrentnye-platezhi\">создания плана подписки\u003c/a> на рекуррентные платежи. Оплата производится системой автоматически, без подтверждения плательщика, в соответствии с настроенным периодом, который может быть один раз в день (один раз в несколько дней), один раз в неделю (один раз в несколько недель) или один раз в месяц (один раз в несколько месяцев). Если очередная попытка оплаты не удалась, система отправляет уведомление и повторяет попытку через сутки. После трех неудачных попыток подряд система отменяет подписку.\u003cbr>При создании плана можно указать максимальное количество периодов, например, 12 месяцев при ежемесячной оплате, после чего подписка будет автоматически завершена.\u003c/p>\u003c/li>\u003cli>\u003cp>Кастомизируемые формы приема платежей.\u003cbr>Платежные формы позволяют фондам и другим организациям принимать пожертвования на свой счет с помощью настраиваемой, кастомизируемой платежной формы, которая может быть представлена в виде ссылки \u003cem>c.cloudpayments.ru/payments/\u003c/em> и в виде QR-кода, который можно разместить, как в онлайн-трансляции, так и в офлайн-материалах (листовки, буклеты и т.д.). Форма значительно упрощает прием пожертвований. В новом разделе личного кабинета «Платежные формы» можно создавать и кастомизировать до 5 платежных форм. Ссылку и QR-код для отправки плательщикам можно получить после сохранения формы.\u003c/p>\u003c/li>\u003c/ul>\u003ch2 id=\"3-d-secure\">\u003cstrong>3-D Secure\u003c/strong>\u003c/h2>\u003cp>3-D Secure — общее название программ Verified By Visa и Mastercard Secure Code от платежных систем Visa и MasterCard. Суть программы - в проверке подлинности держателя защита от несанкционированного использования карты эмитентом перед оплатой. На практике это выглядит так: держатель указывает реквизиты карты, далее открывается сайт эмитента, где держателю предлагается ввести пароль или секретный код. Как правило, код отправляется в СМС-сообщении. Если код указан правильно, оплата будет проведена. Если нет — отклонена.\u003cbr>\u003c/p>\u003cfigure style=\"text-align:center\">\u003cimg data-image-id=\"34040b03-34d4-4cfa-b13c-eee09ada95dc\" src=\"https://developers.cloudpayments.ru/images/3ds-demo-9120e58c.png\" alt=\"3ds-demo\" style=\"width:74%;max-width:100%;height:auto\">\u003c/figure>\u003cp>3-D Secure в процессе оплаты появляется не на всех картах, а только тех, банки-эмитенты которых поддерживают данную технологию. Проведение оплаты без 3-D Secure является менее безопасным вариантом.\u003c/p>\u003c/div>","toc":[{"id":"terminy-i-opredeleniya","title":"Термины и определения","level":2},{"id":"vidy-operatsiy","title":"Виды операций","level":2},{"id":"shemy-provedeniya-platezha","title":"Схемы проведения платежа","level":2},{"id":"sposoby-oplaty","title":"Способы оплаты","level":2},{"id":"3-d-secure","title":"3-D Secure","level":2}]},"platezhniy-widget":{"id":"platezhniy-widget","title":"Платежный виджет","type":"page","audience":"both","group":"root-platezhniy-widget","html":"\u003cdiv class=\"imported-api\">\u003cp>Платежный виджет — всплывающая форма для ввода реквизитов карты и e-mail адреса плательщика. Виджет автоматически определяет тип платежной системы: Visa, MasterCard, Maestro или &quot;МИР&quot;, а также банк-эмитент карты и показывает соответствующие логотипы. Форма оптимизирована для использования в любых браузерах и мобильных устройствах. Внутри виджета открывается iframe, который гарантирует безопасность передачи карточных данных и не требует от ТСП сертификации для использования.\u003c/p>\u003cp>Подробная \u003ca href=\"https://widget.cloudpayments.ru/docs/widget.html\" target=\"_blank\" rel=\"noopener noreferrer\">документация\u003c/a> для разработчиков.\u003c/p>\u003cp>Демо \u003ca href=\"https://widget.cloudpayments.ru/app/demo\" target=\"_blank\" rel=\"noopener noreferrer\">платежного конструктора\u003c/a>.\u003c/p>\u003caside class=\"api-callout warning\" role=\"note\">\u003cstrong class=\"callout-label\">Внимание\u003c/strong>\u003cp>Контроль суммы при оплате необходимо осуществлять самостоятельно. Для проверки суммы можно использовать уведомления: \u003ca href=\"/uvedomleniya/#check\">Check\u003c/a> - для проверки суммы до оплаты, \u003ca href=\"/uvedomleniya/#pay\">Pay\u003c/a> - для проверки суммы после оплаты\u003c/p>\u003c/aside>\u003ch2 id=\"demo-widget\">\u003cstrong>Демо виджета\u003c/strong>\u003c/h2>\u003cp>Демонстрация работы виджета представлена в нашем \u003ca href=\"https://show.cloudpayments.ru/widget/\" target=\"_blank\" rel=\"noopener noreferrer\">демо-магазине\u003c/a>.\u003cbr>Для тестирования можно использовать как \u003ca href=\"/testirovaniye/\">тестовые карточные данные\u003c/a>, так и реальные. Списания денежных средств не произойдет.\u003c/p>\u003csection class=\"editor-carousel\" data-editor-carousel data-carousel-id=\"c7cc4c37-a2ff-4a18-89c3-5f2e0bae3c7c\" role=\"region\" aria-label=\"Карусель изображений\" aria-roledescription=\"карусель\" tabindex=\"0\">\u003cdiv class=\"editor-carousel-slides\">\u003cfigure data-carousel-slide role=\"group\" aria-label=\"1 / 2\">\u003cdiv class=\"editor-carousel-frame\">\u003cimg data-image-id=\"b58f8dfa-68b5-4646-9e67-fe1c5ddbd35d\" src=\"static/img/editor/81a43a37574b9b24a47dc59ba80c8399c51aaa46451641cfc698ccc107fac387.png\" alt=\"темная тема.png\" draggable=\"false\">\u003c/div>\u003cfigcaption>\u003c/figcaption>\u003c/figure>\u003cfigure data-carousel-slide hidden role=\"group\" aria-label=\"2 / 2\">\u003cdiv class=\"editor-carousel-frame\">\u003cimg data-image-id=\"781ea36c-02ae-4139-8053-6ebef13e3eda\" src=\"static/img/editor/143fcc0541354575510a90a8b9830910b4a757e62d624601bfd5aa2bfe2e8330.png\" alt=\"Macbookmodern-08567aca.png\" draggable=\"false\">\u003c/div>\u003cfigcaption>\u003c/figcaption>\u003c/figure>\u003c/div>\u003cdiv class=\"editor-carousel-controls\">\u003cbutton type=\"button\" data-carousel-step=\"-1\" aria-label=\"Предыдущее изображение\">←\u003c/button>\u003cspan data-carousel-counter role=\"status\" aria-live=\"polite\" aria-atomic=\"true\">1 / 2\u003c/span>\u003cbutton type=\"button\" data-carousel-step=\"1\" aria-label=\"Следующее изображение\">→\u003c/button>\u003c/div>\u003c/section>\u003ch2 id=\"mobilnyy-vidzhet\">\u003cstrong>Мобильный виджет\u003c/strong>\u003c/h2>\u003cp>Скрипт автоматически определяет устройство пользователя и запускает наиболее подходящий вариант виджета: обычный либо оптимизированный для мобильных устройств. Для удобства покупателей мобильная версия виджета занимает весь экран и предлагает провести оплату либо картой, либо одним из альтернативных методов оплаты.\u003c/p>\u003cp>\u003cbr>\u003c/p>\u003cfigure style=\"text-align:center\">\u003cimg data-image-id=\"5bd399c3-2d5f-485b-bbe9-f43a78fe46ad\" src=\"https://developers.cloudpayments.ru/images/mobile-widget-ios-f01ce97c.png\" alt=\"mobile-widget\" style=\"width:100%;max-width:100%;height:auto\">\u003c/figure>\u003ch2 id=\"ustanovka-vidzheta\">\u003cstrong>Установка виджета\u003c/strong>\u003c/h2>\u003cp>Для установки виджета необходимо прописать на сайте скрипт в раздел \u003cstrong>head\u003c/strong>:\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>javascript\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-1\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-1\" class=\"language-javascript\">&lt;script src=&quot;https://widget.cloudpayments.ru/bundles/cloudpayments.js&quot;&gt;&lt;/script&gt;\n\u003c/code>\u003c/pre>\u003c/div>\u003caside class=\"api-callout warning\" role=\"note\">\u003cstrong class=\"callout-label\">Внимание\u003c/strong>\u003cp>Используйте cloudpayments.js, чтобы оставаться совместимым с PCI, гарантируя, что платежные реквизиты отправляются напрямую в CloudPayments, не затрагивая ваш сервер. Всегда загружайте cloudpayments.js с \u003ca href=\"https://widget.cloudpayments.ru/\" target=\"_blank\" rel=\"noopener noreferrer\">https://widget.cloudpayments.ru\u003c/a>, чтобы соответствовать требованиям. Не включайте скрипт в пакет и не размещайте его самостоятельно.\u003c/p>\u003c/aside>\u003cp>Для появления платежной формы необходимо зарегистрировать функцию для вызова метода \u003cstrong>start\u003c/strong>:\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>javascript\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-2\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-2\" class=\"language-javascript\">public start(intentParams: CreateIntentCommand): Promise&lt;WidgetResult&gt;\n\u003c/code>\u003c/pre>\u003c/div>\u003cp>И прописать вызов функции на событие, например, нажатие кнопки «Оплатить»:\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>javascript\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-3\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-3\" class=\"language-javascript\">$(&#39;#checkout&#39;).click(start);\u003c/code>\u003c/pre>\u003c/div>\u003caside class=\"api-callout \" role=\"note\">\u003cstrong class=\"callout-label\">Информация\u003c/strong>\u003cp>В примере используется библиотека jquery.\u003c/p>\u003c/aside>\u003cp>Демонстрация работы виджета представлена в нашем \u003ca href=\"https://show.cloudpayments.ru/\" target=\"_blank\" rel=\"noopener noreferrer\">демо-магазине\u003c/a>.\u003c/p>\u003cp>Пример реализации запуска виджета без библиотеки jquery:\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>javascript\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-4\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-4\" class=\"language-javascript\">document.querySelector(&#39;#checkout&#39;).onclick = start\n\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>json\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-5\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-5\" class=\"language-json\">\nconst btn = document.getElementById(&quot;payButton&quot;)\n\nconst widget = new cp.CloudPayments();\n\nconst launchWidget = () =&gt; {\n  const intentParams = {\n    publicTerminalId: &quot;test_api_00000000000000000000002&quot;, // идентификатор терминала\n    description: &quot;Basket of oranges&quot;, // описание списания\n    paymentSchema: &#39;Dual&#39;, // схема\n    currency: &quot;RUB&quot;, // валюта\n    culture: &quot;ru-RU&quot;,\n    amount: 1001, // сумма\n    skin: &quot;modern&quot;, //дизайн виджета (необязательно)\n    autoClose: 3, //время в секундах до авто-закрытия виджета (необязательный)\n    cryptogramMode: false, // признак режима работы виджета. Если указано true - вместо проведения оплаты будет сформирована криптограмма карточных данных\n    externalId: &quot;your_system_payment_identifier&quot;, // идентификатор платежа в вашей системе\n    restrictedPaymentMethods: [ // список отключенных для данной оплаты методов\n        &#39;Sbp&#39;\n    ],\n    userInfo: {\n        accountId: &quot;your_system_user_id&quot;,\n        firstName: &quot;Test&quot;,\n        lastName: &quot;Test&quot;,\n        middleName: &quot;Test&quot;,\n        fullName: &quot;Test Test Test&quot;,\n        birth: &quot;2000-30-03&quot;,\n        address: &quot;д. 7&quot;,\n        street: &quot;ул. Тестовая&quot;,\n        city: &quot;г. Москва&quot;,\n        country: &quot;Россия&quot;,\n        phone: &quot;+71234567890&quot;,\n        postCode: &quot;119518&quot;,\n        email: &quot;user@email.com&quot;,\n        customField: {\n          name: &quot;your_field_name&quot;,\n          value: &quot;your_field_value&quot;\n        }\n    },\n    payerServiceFee: 50, // комиссия, оплачиваемая пользователем\n    recurrent: {\n        period: 1, // частота списания\n        interval: &#39;Day&#39;, // интервал списания\n        amount: 500, // сумма\n        startDate: &quot;2030-04-15T00:00:00.0000000Z&quot;, // дата начала\n        maxPeriods: 50, // количество списаний после которых рекуррент будет остановлен\n        receipt: { // чек для рекуррента\n            items: [ //товарные позиции\n                {\n                    label: &#39;Наименование товара 3&#39;, //наименование товара\n                    price: 300.00, //цена\n                    quantity: 3.00, //количество\n                    amount: 900.00, //сумма\n                    vat: 20, //ставка НДС\n
