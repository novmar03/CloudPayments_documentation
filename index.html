Сингапур\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>ULAT\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>(UTC+08:00) Улан-Батор\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>YAKT\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>(UTC+09:00) Якутск (RTZ 8)\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>VLAT\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>(UTC+10:00) Владивосток, Магадан (RTZ 9)\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>SAKT\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>(UTC+11:00) Чокурдах (RTZ 10)\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>ANAT\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>(UTC+12:00) Анадырь, Петропавловск-Камчатский (RTZ 11)\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003ch2 id=\"tipy-uvedomleniy\">\u003cstrong>Типы уведомлений\u003c/strong>\u003c/h2>\u003cp>В таблице ниже представлены типы уведомлений.\u003c/p>\u003cdiv class=\"api-table-scroll\" tabindex=\"0\" aria-label=\"Таблица\">\u003ctable>\u003ctr>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Код\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Название\u003c/p>\u003c/th>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Check\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003ca href=\"https://developers.cloudpayments.ru/#check\" target=\"_blank\" rel=\"noopener noreferrer\">Check\u003c/a>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Pay\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003ca href=\"https://developers.cloudpayments.ru/#pay\" target=\"_blank\" rel=\"noopener noreferrer\">Pay\u003c/a>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Fail\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003ca href=\"https://developers.cloudpayments.ru/#fail\" target=\"_blank\" rel=\"noopener noreferrer\">Fail\u003c/a>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Confirm\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003ca href=\"https://developers.cloudpayments.ru/#confirm\" target=\"_blank\" rel=\"noopener noreferrer\">Confirm\u003c/a>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Refund\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003ca href=\"https://developers.cloudpayments.ru/#refund\" target=\"_blank\" rel=\"noopener noreferrer\">Refund\u003c/a>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Recurrent\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003ca href=\"https://developers.cloudpayments.ru/#recurrent\" target=\"_blank\" rel=\"noopener noreferrer\">Recurrent\u003c/a>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Cancel\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003ca href=\"https://developers.cloudpayments.ru/#cancel\" target=\"_blank\" rel=\"noopener noreferrer\">Cancel\u003c/a>\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cp>\u003cbr>\u003c/p>\u003c/div>","toc":[{"id":"cultures","title":"Языки","level":2},{"id":"kody-oshibok","title":"Коды ошибок","level":2},{"id":"kody-obrabotki-otvetov-na-check-uvedomlenie","title":"Коды обработки ответов на check уведомление","level":2},{"id":"tipy-operatsiy","title":"Типы операций","level":2},{"id":"statusy-operatsiy","title":"Статусы операций","level":2},{"id":"statusy-podpisok-rekurrent","title":"Статусы подписок (рекуррент)","level":2},{"id":"spisok-valyut","title":"Список валют","level":2},{"id":"operatory-fiskalnyh-dannyh","title":"Операторы фискальных данных","level":2},{"id":"kody-vremennyh-zon","title":"Коды временных зон","level":2},{"id":"tipy-uvedomleniy","title":"Типы уведомлений","level":2}]}},"translations":{"en":{"pages":{"obzhaya-informatsiya":{"id":"obzhaya-informatsiya","title":"General information","type":"page","audience":"both","group":"root-obzhaya-informatsiya","html":"\u003cdiv class=\"imported-api\">\u003ch2 id=\"section-76c0e796-2c6b-42b4-afcc-f547165d49d7\">\u003cstrong> Terms and definitions\u003c/strong>\u003c/h2>\u003cul>\u003cli>\u003cp>\u003cstrong>System -\u003c/strong> the CloudPayments payment gateway.\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>Merchant -\u003c/strong> a business that uses the system.\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>API -\u003c/strong> a software interface for interacting with a system through \u003ca href=\"https://api.cloudpayments.ru/\" target=\"_blank\" rel=\"noopener noreferrer\">https://api.cloudpayments.ru\u003c/a>.\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>Dashboard - \u003c/strong>the merchant space in the system, available at \u003ca href=\"https://merchant.cloudpayments.ru/\" target=\"_blank\" rel=\"noopener noreferrer\">https://merchant.cloudpayments.ru\u003c/a>.\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>Card - \u003c/strong>a bank card issued by the Visa, Mastercard, or Mir payment system.\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>Acquirer - \u003c/strong>the settlement bank.\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>Issuer - \u003c/strong>the bank that issued the card.\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>Holder -\u003c/strong> a person to whom the issuer has issued a card for use.\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>Widget - \u003c/strong>a payment form provided by the system for the cardholder to enter card details and complete authorization.\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>3D Secure - \u003c/strong>a protocol for verifying the cardholder&#39;s identity with the issuer.\u003c/p>\u003c/li>\u003c/ul>\u003ch2 id=\"section-32359a8c-cc4e-4388-b489-ff0e03b36b70\">\u003cstrong> Operation types\u003c/strong>\u003c/h2>\u003cp>The system involves two types of transactions: payment and refund.\u003c/p>\u003cul>\u003cli>\u003cp>When the payment is made, the funds are transferred from the holder&#39;s account to the merchant. For a refund, the funds are transferred the other way around.\u003c/p>\u003c/li>\u003cli>\u003cp>The merchant issues a refund if the customer wants to return the product.\u003c/p>\u003c/li>\u003cli>\u003cp>The refund is always linked to a payment transaction, the amount of which is returned to the cardholder. Both the full payment and part of it can be refunded. The funds are usually returned to the cardholder&#39;s card on the same day, but sometimes, depending on the issuing bank, this can take up to 3 days.\u003c/p>\u003c/li>\u003cli>\u003cp>Unlike a refund, a payment transaction can be canceled.\u003c/p>\u003c/li>\u003cli>\u003cp>The merchant cancels a payment if it was made by mistake, for example, due to an incorrect amount or technical failure. There is one limitation: the transaction can only be canceled when using a two-stage payment scheme. At the same time, the funds will be released on the cardholder’s card almost instantly.\u003c/p>\u003c/li>\u003c/ul>\u003ch2 id=\"section-7a6f31d7-a4a6-4062-a1c0-2c8150cc0461\">\u003cstrong>Payment processing methods\u003c/strong>\u003c/h2>\u003cp>There are two ways to process payments: single-stage and two-stage, also known as the \u003cstrong>single message system\u003c/strong> (SMS) and \u003cstrong>dual message system\u003c/strong> (DMS), respectively.\u003c/p>\u003cp>\u003cstrong>Single-stage payment\u003c/strong> is processed with a single command, which authorizes and subsequently debits the funds to the merchant.\u003c/p>\u003cp>\u003cstrong>Two-stage payment\u003c/strong> uses two separate commands: one for authorization and one for charging the funds. After successful authorization, the transaction amount is held on the cardholder&#39;s account, so they cannot use the funds. Next, the merchant has up to 7 days, depending on the card type, to confirm the transaction, after which the funds are debited. If the operation is not confirmed within this period, it will be canceled automatically. You can confirm either full authorization amount or part of it.\u003c/p>\u003cp>As a rule, a two-stage method is used to collect a deposit from the payer, for example, by rental companies or hotels.\u003c/p>\u003cp>Depending on the configuration, the system can automatically confirm two-stage payments after the specified number of days.\u003c/p>\u003ch2 id=\"section-ca5e1142-9ec5-40be-90b6-d10eaadfe966\">\u003cstrong>Payment methods\u003c/strong>\u003c/h2>\u003cp>Payment can be made in the following ways:\u003c/p>\u003cul>\u003cli>\u003cp>Through the payment form, the widget. You add a script to your website that opens a secure payment form, an iframe for entering card details.\u003c/p>\u003c/li>\u003cli>\u003cp>Via the API using a card cryptogram. A checkout script is integrated into your website to collect card details from any form, encrypt and generate a cryptogram for secure server-to-server transmission.\u003c/p>\u003c/li>\u003cli>\u003cp>Via the SDK for mobile apps. The mobile SDK is integrated into your iOS or Android app to accept card payments directly from your customers&#39; smartphones or tablets.\u003c/p>\u003c/li>\u003cli>\u003cp>Via the API using a card token: recurring payments. Following the first payment via the widget or by cryptogram, the system assigns a token to the card details. The token can be safely stored and used for merchant-initiated payments (one-click payments). The token is returned in the Pay notification and in the API response\u003c/p>\u003c/li>\u003cli>\u003cp>Via a configured recurring payment plan. Following the first payment or a one-ruble authorization for card verification, a token is assigned to the card details. This token is then used to create a subscription plan for recurring payments. Payments are processed automatically by the system without the payer&#39;s confirmation. These payments follow a configured schedule, which can be set to once a day (or every few days), once a week (or every few weeks) or once a month (or every few months). If a scheduled payment attempt fails, a notification is sent, and the attempt is retried within a day. After three consecutive failed attempts, the subscription is automatically canceled. When creating a plan, a maximum number of billing cycles can be specified (for example, 12 months for a monthly subscription), after which the subscription will automatically terminate.\u003c/p>\u003c/li>\u003cli>\u003cp>Customizable payment acceptance forms. Payment forms allow foundations and other organizations to accept donations directly to their accounts using a configurable, customizable payment form. This form can be shared as a link \u003ca href=\"http://c.cloudpayments.ru/payments/\" target=\"_blank\" rel=\"noopener noreferrer\">c.cloudpayments.ru/payments/ \u003c/a>or as a QR code, which can be placed in both online broadcasts and offline marketing materials (flyers, brochures, etc.).  The form makes it much easier to accept donations. In the new &quot;Payment forms&quot; section of the dashboard, you can create and customize up to 5 payment forms. The link and QR code for sending to payers become available once the form is saved.\u003c/p>\u003c/li>\u003c/ul>\u003ch2 id=\"section-af686054-e43f-4983-ae38-1f60d8fd6769\">\u003cstrong>3D Secure\u003c/strong>\u003c/h2>\u003cp>3D Secure is the collective name for the security programs developed by Visa and Mastercard. The purpose of the program is to verify the identity of the cardholder, allowing the issuer to protect against unauthorized card use prior to payment. In practice, it works as follows: the cardholder enters their card details and is then redirected to the issuer&#39;s website to enter a password or verification code. Typically, the code is sent via SMS. If the code is entered correctly, the payment is processed. Otherwise, it is declined.\u003c/p>\u003cfigure style=\"text-align:center\">\u003cimg data-image-id=\"a03d7e0b-f8e8-44c0-b7ea-863e7c46756f\" src=\"static/img/editor/b25c22be355a1fd9131300e6b51f82b71da4998aa4d5b46a5f7a23750f3204ae.png\" alt=\"Изображение ChatGPT 25 сент. 2026 г., 19_46_28.png\" style=\"width:66%;max-width:100%;height:auto\">\u003c/figure>\u003cp>3D Secure is not triggered for all cards during checkout, but only for those whose issuing banks support the technology. Processing payments without 3D Secure is a less secure option.\u003c/p>\u003c/div>","toc":[{"id":"section-76c0e796-2c6b-42b4-afcc-f547165d49d7","title":" Terms and definitions","level":2},{"id":"section-32359a8c-cc4e-4388-b489-ff0e03b36b70","title":" Operation types","level":2},{"id":"section-7a6f31d7-a4a6-4062-a1c0-2c8150cc0461","title":"Payment processing methods","level":2},{"id":"section-ca5e1142-9ec5-40be-90b6-d10eaadfe966","title":"Payment methods","level":2},{"id":"section-af686054-e43f-4983-ae38-1f60d8fd6769","title":"3D Secure","level":2}]},"platezhniy-widget":{"id":"platezhniy-widget","title":"Payment widget","type":"page","audience":"both","group":"root-platezhniy-widget","html":"\u003cdiv class=\"imported-api\">\u003cp>Payment widget is a pop-up form used to enter the payer&#39;s card details and email address. The widget automatically determines the type of payment network: Visa, Mastercard, Maestro, or Mir, as well as the issuing bank, and displays the corresponding logos. The form is optimized for all browsers and mobile devices. Inside the widget, an \u003ccode>iframe\u003c/code> opens that ensures the secure transmission of card details and does not require compliance certification from the merchant. _Widget\u003c/p>\u003cp>Detailed developer documentation: \u003ca href=\"https://widget.cloudpayments.ru/docs/widget.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://widget.cloudpayments.ru/docs/widget.html\u003c/a>\u003c/p>\u003cp>Demo of the payment form builder: \u003ca href=\"https://widget.cloudpayments.ru/app/demo\" target=\"_blank\" rel=\"noopener noreferrer\">https://widget.cloudpayments.ru/app/demo\u003c/a>\u003c/p>\u003ch2 id=\"section-ff8466f0-12f9-4dd4-951f-858e6fb3b0bc\">\u003cstrong>Demo widget\u003c/strong>\u003c/h2>\u003cp>A demonstration of how the Widget works is available in our \u003ca href=\"https://show.cloudpayments.ru/widget/\" target=\"_blank\" rel=\"noopener noreferrer\">demo store\u003c/a>:\u003c/p>\u003cp>You can use both test card details and real ones for testing. No funds will be debited. \u003c/p>\u003cfigure style=\"text-align:center\">\u003cimg data-image-id=\"1a4da9dd-b6e1-4413-9eef-ccf73cd1babd\" src=\"static/img/editor/1d0db7f003f1d9edfb60f20ca970b0663cfdbbd7c2a19d6f8384602ad0900f90.png\" alt=\"Снимок экрана — 2026-09-25 в 21.02.16.png\" style=\"width:79%;max-width:100%;height:auto\">\u003c/figure>\u003cp>\u003cbr>\u003c/p>\u003ch2 id=\"section-30790ef7-4e0b-4f90-b2f6-d026b3207b67\">\u003cstrong>Widget installation\u003c/strong>\u003c/h2>\u003cp>To install the widget, add the script to the \u003cstrong>head\u003c/strong> section of your website:\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>javascript\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-1\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-1\" class=\"language-javascript\">&lt;script src=&quot;https://widget.cloudpayments.ru/bundles/cloudpayments.js&quot;&gt;&lt;/script&gt;\u003c/code>\u003c/pre>\u003c/div>\u003cp>\u003cstrong>Warning:\u003c/strong> Use \u003ccode>cloudpayments.js\u003c/code> to maintain PCI compliance by ensuring that payment details are sent directly to CloudPayments without affecting your server. Always load \u003ccode>cloudpayments.js\u003c/code> from \u003ca href=\"https://widget.cloudpayments.ru/\" target=\"_blank\" rel=\"noopener noreferrer\">https://widget.cloudpayments.ru\u003c/a> to remain compliant. Do not bundle the script or host it yourself. _Widget\u003c/p>\u003cp>To display the payment form, register a function to call the \u003cstrong>pay\u003c/strong> method by passing either the \u003ccode>auth\u003c/code> or the \u003ccode>charge\u003c/code> parameter to it:\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>json\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-2\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-2\" class=\"language-json\">this.pay = function () {\n var widget = new cp.CloudPayments();\n    widget.pay(&#39;auth&#39;, // or &#39;charge&#39;\n        { //options\n            publicId: &#39;test_api_00000000000000000000002&#39;, // ID from the dashboard\n            description: &#39;Payment for goods at example.com&#39;, // Payment description\n            amount: 100, // Amount\n            currency: &#39;RUB&#39;, // Currency\n            accountId: &#39;user@example.com&#39;, // Payer ID (optional)\n            invoiceId: &#39;1234567&#39;, // Order number (optional)\n            email: &#39;user@example.com&#39;, // Payer email (optional)\n            skin: &quot;mini&quot;, // Widget design (optional)\n            autoClose: 3, // Time in seconds before widget auto-close (optional)\n            data: {\n                myProp: &#39;myProp value&#39;\n            },\n            configuration: {\n                common: {\n                    successRedirectUrl: &quot;https://{your website}/success&quot;, // Redirection URL\n                    failRedirectUrl: &quot;https://{your website}/fail&quot;        // If paid via T-Pay\n                }\n            },\n            payer: {\n                firstName: &#39;Test&#39;,\n                lastName: &#39;Testov&#39;,\n                middleName: &#39;Testovich&#39;,\n                birth: &#39;1955-02-24&#39;,\n                address: &#39;test drive test home&#39;,\n                street: &#39;Lenina&#39;,\n                city: &#39;MO&#39;,\n                country: &#39;RU&#39;,\n                phone: &#39;+71234567890&#39;,\n                postcode: &#39;345&#39;\n            }\n        },\n        {\n            onSuccess: function (options) { // Success\n                // Triggered on payment success\n            },\n            onFail: function (reason, options) { // Fail\n                // Triggered on payment failure\n            },\n            onComplete: function (paymentResult, options) {\n                // Triggered as soon as the widget receives a response\n                // with transaction result from api.cloudpayments\n                // For example, calling your analytics\n            }\n        }\n    )\n};\u003c/code>\u003c/pre>\u003c/div>\u003cp>Then, call the function in response to an event, such as clicking the Pay button:\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>javascript\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-3\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-3\" class=\"language-javascript\">$(&#39;#checkout&#39;).click(pay);\u003c/code>\u003c/pre>\u003c/div>\u003cp>\u003cstrong>Notice:\u003c/strong> The example uses the jQuery library.\u003c/p>\u003cp>A demonstration of how the widget works is available in our demo store:\u003cbr>\u003ca href=\"https://show.cloudpayments.ru/\" target=\"_blank\" rel=\"noopener noreferrer\">https://show.cloudpayments.ru\u003c/a>\u003c/p>\u003cp>Example of running the widget without jQuery:\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>javascript\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-4\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-4\" class=\"language-javascript\">document.querySelector(&#39;#checkout&#39;).onclick = pay\u003c/code>\u003c/pre>\u003c/div>\u003cp>Embedded JSFiddle:\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>json\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-5\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-5\" class=\"language-json\">&lt;script async src=&quot;//jsfiddle.net/tretyakovsky/xvec6jpb/35/embed/js,html/dark/&quot;&gt;&lt;/script&gt;\u003c/code>\u003c/pre>\u003c/div>\u003cp>You can use both test card details and real ones for testing. No funds will be debited. _Widget\u003c/p>\u003ch2 id=\"section-da03242d-3f33-492b-9a10-14f5d6d1168f\">Parameters\u003c/h2>\u003cp>\u003cstrong>Notice:\u003c/strong> According to the NSPK requirements, merchant platforms providing telecommunication services (MCC 4814 Telecommunication Services), must provide the payer&#39;s phone number. If the phone number is missing from the request, acquiring banks will decline the transactions.\u003c/p>\u003cp>The phone number must be passed in the \u003ccode>Phone\u003c/code> parameter within the \u003ccode>Payer\u003c/code> object.\u003c/p>\u003cp>Format: digits only, without delimiters such as hyphens or parentheses.\u003c/p>\u003cp>Example: \u003ccode>+71234567890\u003c/code> _Widget\u003c/p>\u003cp>Calling the pay function with either the \u003ccode>auth\u003c/code> or the \u003ccode>charge\u003c/code> argument determines the payment processing method:\u003c/p>\u003cul>\u003cli>\u003cp>\u003cstrong>charge\u003c/strong> for single-stage payments\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>auth\u003c/strong> for two-stage payments\u003c/p>\u003c/li>\u003c/ul>\u003cdiv class=\"api-table-scroll\" tabindex=\"0\" aria-label=\"Таблица\">\u003ctable style=\"table-layout:fixed;width:778px;min-width:0\">\u003ccolgroup>\u003ccol style=\"width:323px\">\u003ccol style=\"width:118px\">\u003ccol style=\"width:157px\">\u003ccol style=\"width:180px\">\u003c/colgroup>\u003ctr>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Parameter\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Format\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Required\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Description\u003c/p>\u003c/th>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>publicId\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Yes\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Website ID, can be found in the dashboard\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>amount\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>float\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Yes\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Payment amount\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>currency\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Yes\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Currency: RUB/USD/EUR/GBP\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>accountId\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Required for subscription creation\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>User ID\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>description\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>No\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Free-form description of the payment purpose\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>invoiceId\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>No\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Order or invoice number\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>email\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>No\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>User&#39;s email\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>requireEmail\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>bool\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>No\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Requirement to display the user email address field in the widget\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>data\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>JSON\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>No\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Any other data associated with the transaction, including instructions for creating a subscription or generating an online receipt, must be wrapped in the \u003ccode>cloudpayments\u003c/code> object. Reserved parameter names: \u003ccode>name\u003c/code>, \u003ccode>firstName\u003c/code>, \u003ccode>middleName\u003c/code>, \u003ccode>lastName\u003c/code>, \u003ccode>nick\u003c/code>, \u003ccode>phone\u003c/code>, \u003ccode>address\u003c/code>, \u003ccode>comment\u003c/code>, \u003ccode>birthDate\u003c/code>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>skin\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>No\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Widget design selection. Possible options: \u003ccode>classic\u003c/code>, \u003ccode>modern\u003c/code>, \u003ccode>mini\u003c/code>. Default is \u003ccode>classic\u003c/code>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>retryPayment\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>bool\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>No\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Displays the &quot;Retry payment&quot; button upon a failed transaction. Default is \u003ccode>true\u003c/code>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>autoClose\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>number\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>No\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Automatically closes the widget after successful payment following a specified number of seconds, from 3 to 10\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>payer\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>object\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>No\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Additional field used to pass payer information: \u003ccode>firstName\u003c/code>, \u003ccode>lastName\u003c/code>, \u003ccode>middleName\u003c/code>, \u003ccode>birth\u003c/code>, \u003ccode>street\u003c/code>, \u003ccode>address\u003c/code>, \u003ccode>city\u003c/code>, \u003ccode>country\u003c/code>, \u003ccode>phone\u003c/code>, \u003ccode>postcode\u003c/code>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>configuration.common.successRedirectUrl\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>No\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Redirect URL after a successful non-card payment. For SBP, the value must not exceed 1024 characters, use ASCII encoding, and comply with RFC-3986\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>configuration.common.failRedirectUrl\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>No\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Redirect URL after a failed T-Pay payment\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>disableEmail\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>bool\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>No\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Allows hiding the email address field. To hide it, omit \u003ccode>requireEmail\u003c/code> or set it to \u003ccode>false\u003c/code>\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cp>You can configure the form&#39;s behavior for successful or failed payments using the following parameters:\u003c/p>\u003cdiv class=\"api-table-scroll\" tabindex=\"0\" aria-label=\"Таблица\">\u003ctable>\u003ctr>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Parameter\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Format\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Required\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Description\u003c/p>\u003c/th>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>onSuccess\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Function or String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>No\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Specify either a function or a website URL. If a function is specified, it will be called after the payment is successfully completed and the user closes the widget. If a URL is specified, the user will be redirected to that page\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>onFail\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Function or String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>No\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Specify either a function or a website URL. If a function is specified, it will be called after a failed payment. If a URL is specified, the user will be redirected to that page\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>onComplete\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Function\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>No\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Specify a function to be triggered as soon as the widget receives the transaction result response. Redirects are not allowed in this method\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003ch2 id=\"section-3531dd87-f813-460d-b855-59ecd5d87704\">Widget language settings\u003c/h2>\u003cp>By default, the widget is displayed in Russian. To display the widget in another language, pass the \u003ccode>language\u003c/code> parameter in the widget initialization settings.\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>javascript\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-6\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-6\" class=\"language-javascript\">var widget = new cp.CloudPayments({language: &quot;en-US&quot;});\u003c/code>\u003c/pre>\u003c/div>\u003cp>List of supported languages:\u003c/p>\u003cdiv class=\"api-table-scroll\" tabindex=\"0\" aria-label=\"Таблица\">\u003ctable>\u003ctr>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Language\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Timezone\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Code\u003c/p>\u003c/th>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Russian\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>MSK\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>ru-RU\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>English\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>CET\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>en-US\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Kazakh\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>ALMT\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>kk-KZ\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003ch2 id=\"section-5a4c0c2f-1687-4a62-87f2-b5d2ee614072\">Recurring payments (subscriptions)\u003c/h2>\u003cp>After the payment is successfully completed, the widget can automatically create a subscription for recurring payments. To do this, add several initialization parameters:\u003c/p>\u003cdiv class=\"api-table-scroll\" tabindex=\"0\" aria-label=\"Таблица\">\u003ctable>\u003ctr>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Parameter\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Format\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Required\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Description\u003c/p>\u003c/th>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Interval\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Yes\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Interval. Possible values: Day, Week, Month\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Period\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>int\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Yes\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Period. Combined with interval, 1 Month is once a month, and 2 Week is once every two weeks. Must be greater than 0\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>MaxPeriods\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>int\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>No\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Maximum number of payments in subscription. By default, no restrictions. If you specify a number, make sure it is greater than 0\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Amount\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>number\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>No\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Recurring payment amount. By default, this matches the initial payment amount. If specifying a custom amount, ensure it is greater than 0\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>StartDate\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>DateTime\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>No\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Date and time of the first recurring payment. By default, the next payment will occur after the specified interval and period. If specifying a custom date, ensure it is set in the future\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>CustomerReceipt\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>No\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Data for online receipts generation in recurring payments\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cp>The parameters for launching recurring payments must be added to the \u003ccode>data.CloudPayments.recurrent\u003c/code> object, as shown in the example below:\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>json\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-7\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-7\" class=\"language-json\">this.pay = function () {\n    var widget = new cp.CloudPayments();\n    var receipt = {\n        Items: [// Receipt items\n            {\n                label: &#39;Product name 3&#39;, // Product name\n                price: 300.00, // Cost\n                quantity: 3.00, // Quantity\n                amount: 900.00, // Amount\n                vat: 20, // VAT rate\n                method: 0, // Tag 1214: payment method flag\n                object: 0, // Tag 1212: payment subject flag\n            }\n        ],\n        taxationSystem: 0,\n        email: &#39;user@example.com&#39;,\n        phone: &#39;+71234567890&#39;,\n        isBso: false,\n        amounts: {\n            electronic: 900.00,\n            advancePayment: 0.00,\n            credit: 0.00,\n            provision: 0.00\n        }\n    };\n\n    var data = {};\n    data.CloudPayments = {\n        CustomerReceipt: receipt,\n        recurrent: {\n            interval: &#39;Month&#39;,\n            period: 1,\n            customerReceipt: receipt\n        }\n    };\n\n    widget.charge({\n        publicId: &#39;test_api_00000000000000000000001&#39;,\n        description: &#39;Monthly subscription for access to example.com&#39;,\n        amount: 1000,\n        currency: &#39;RUB&#39;,\n        invoiceId: &#39;1234567&#39;,\n        accountId: &#39;user@example.com&#39;,\n        data: data\n    },\n    function (options) {\n        // Triggered on payment success\n    },\n    function (reason, options) {\n        // Triggered on payment failure\n    });\n};\u003c/code>\u003c/pre>\u003c/div>\u003cp>Please note that you can create a subscription by specifying the \u003ccode>accountId\u003c/code> parameter, which can be an email address, a phone number, or any other payer ID.\u003c/p>\u003cp>For more examples of creating recurring payments from the widget, see the Integration scenarios.\u003c/p>\u003cp>To cancel recurring payments, use the merchant dashboard, the API, or provide the customer with a link to the system&#39;s website:\u003c/p>\u003cp>\u003ca href=\"https://my.cloudpayments.ru/\" target=\"_blank\" rel=\"noopener noreferrer\">https://my.cloudpayments.ru/\u003c/a>\u003c/p>\u003cp>There they can find and cancel their subscriptions independently. _Widget\u003c/p>\u003ch2 id=\"section-cf567e9f-9150-4691-8f7a-b67bbb4e0651\">Mobile widget\u003c/h2>\u003cp>The script automatically identifies the user&#39;s device and launches the most appropriate widget: desktop or mobile. For the convenience of customers, the mobile version of the widget opens in full screen, allowing them to pay either by card or via one of the alternative payment methods.\u003c/p>\u003c/div>","toc":[{"id":"section-ff8466f0-12f9-4dd4-951f-858e6fb3b0bc","title":"Demo widget","level":2},{"id":"section-30790ef7-4e0b-4f90-b2f6-d026b3207b67","title":"Widget installation","level":2},{"id":"section-da03242d-3f33-492b-9a10-14f5d6d1168f","title":"Parameters","level":2},{"id":"section-3531dd87-f813-460d-b855-59ecd5d87704","title":"Widget language settings","level":2},{"id":"section-5a4c0c2f-1687-4a62-87f2-b5d2ee614072","title":"Recurring payments (subscriptions)","level":2},{"id":"section-cf567e9f-9150-4691-8f7a-b67bbb4e0651","title":"Mobile widget","level":2}]},"platezhniy-konstructor":{"id":"platezhniy-konstructor","title":"Payment form builder","type":"page","audience":"both","group":"root-platezhniy-konstructor","html":"\u003cdiv class=\"imported-api\">\u003cp>PaymentBlocks is a block builder for creating custom payment forms. You can make your own form design.\u003c/p>\u003cp>The form is optimized for use in any browser and on any mobile device. Inside the block, an \u003ccode>iframe\u003c/code> opens that ensures the secure transmission of card details and does not require compliance certification from the merchant.\u003c/p>\u003cp>The form supports all payment methods available in CloudPayments. _Payment Blocks\u003c/p>\u003cp>\u003cstrong>Warning:\u003c/strong> The payment amount must be verified independently. To verify the amount, you can use the following notifications: \u003cstrong>Check\u003c/strong> to verify the amount before payment, and \u003cstrong>Pay\u003c/strong> to verify the amount after payment.\u003c/p>\u003cfigure style=\"text-align:center\">\u003cimg data-image-id=\"6f63b5d1-a0a7-4e4e-b0e8-61d4f6e0e67c\" src=\"https://developers.cloudpayments.ru/images/payment-blocks-5f56bd91.png\" alt=\"payment-blocks\" style=\"width:100%;max-width:100%;height:auto\">\u003c/figure>\u003ch2 id=\"section-89e431e7-3010-45d2-b553-ed9d6dbf2352\">\u003cstrong>Builder demo\u003c/strong>\u003c/h2>\u003cp>A demonstration of how the Builder works is available via this link: \u003ca href=\"https://widget.cloudpayments.ru/app/demo\" target=\"_blank\" rel=\"noopener noreferrer\">https://widget.cloudpayments.ru/app/demo\u003c/a>\u003c/p>\u003cp>You can use either test card data or real card data for testing. No funds will be debited.\u003c/p>\u003ch2 id=\"section-56c83d60-5c8f-49c2-bb42-cbf32e45acb8\">\u003cstrong>Differences from the widget\u003c/strong>\u003c/h2>\u003cdiv class=\"api-table-scroll\" tabindex=\"0\" aria-label=\"Таблица\">\u003ctable style=\"table-layout:fixed;width:723px;min-width:0\">\u003ccolgroup>\u003ccol style=\"width:232px\">\u003ccol style=\"width:311px\">\u003ccol style=\"width:180px\">\u003c/colgroup>\u003ctr>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Key differences\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Widget\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Payment form builder\u003c/p>\u003c/th>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Display method\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Pop-up window\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Embedded on the page. Can be placed directly on the order page\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Customization\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>2 modes: \u003ccode>modern\u003c/code> (dark theme), \u003ccode>classic\u003c/code> (light theme)\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Full customization support\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Can be closed by the customer\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Yes\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>No\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Displays payment amount and purpose\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Yes\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>No\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Can update payment data\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>No\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>You can adjust the payment to reflect changes in the cart\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Supports forced unmount\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>No\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Yes, via \u003ccode>blocksApp.unmount()\u003c/code>\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003ch2 id=\"section-e254e08a-912e-46fa-adf2-4a904b4f468b\">\u003cstrong>Install the payment form builder\u003c/strong>\u003c/h2>\u003cp>To install the builder, add the script to the \u003ccode>head\u003c/code> section of your website:\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>javascript\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-1\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-1\" class=\"language-javascript\">&lt;script src=&quot;https://widget.cloudpayments.ru/bundles/paymentblocks.js&quot;&gt;&lt;/script&gt;\u003c/code>\u003c/pre>\u003c/div>\u003cp>Next, create a DOM element to mount the builder to:\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>javascript\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-2\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-2\" class=\"language-javascript\">&lt;div id=&quot;element&quot;&gt;&lt;/div&gt;\u003c/code>\u003c/pre>\u003c/div>\u003cp>Then declare the payment form builder. The parameters are described in more detail below:\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>javascript\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-3\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-3\" class=\"language-javascript\">var blocksApp = new cp.PaymentBlocks(\n    initializationParams, // Initialization parameters. Required for the builder to work\n    customizationParams // Customization parameters. Optional\n);\u003c/code>\u003c/pre>\u003c/div>\u003cp>And mount it to the DOM element you created:\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>javascript\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-4\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-4\" class=\"language-javascript\">blocksApp.mount(document.getElementById(&quot;element&quot;));\u003c/code>\u003c/pre>\u003c/div>\u003ch2 id=\"section-a918a013-2f31-4ab4-a3bc-8a15c395573d\">\u003cstrong>Remove the builder from DOM\u003c/strong>\u003c/h2>\u003cp>You can remove the payment form builder from the DOM element at any time:\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>javascript\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-5\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-5\" class=\"language-javascript\">blocksApp.unmount();\u003c/code>\u003c/pre>\u003c/div>\u003ch2 id=\"section-c9f8d37d-986a-4c06-bbab-204335bfe710\">\u003cstrong>Events (callbacks)\u003c/strong>\u003c/h2>\u003cp>It&#39;s possible to receive event notifications and handle them, which requires adding handlers for the corresponding events.\u003c/p>\u003cp>To do this, you need to add the following block, or part of it, after mounting:\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>javascript\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-6\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-6\" class=\"language-javascript\">blocksApp.on(&quot;destroy&quot;, () =&gt; { // Subscribe to the payment error event\n     console.log(&quot;destroy&quot;);\n});\n\nblocksApp.on(&quot;success&quot;, (result) =&gt; { // Subscribe to the successful payment result event\n     console.log(&quot;success&quot;, result);\n});\n\nblocksApp.on(&quot;fail&quot;, (result) =&gt; { // Subscribe to the builder destruction event\n     console.log(&quot;fail&quot;, result);\n});\u003c/code>\u003c/pre>\u003c/div>\u003ch2 id=\"section-cfa1de56-7540-4a8e-a67b-73e2b07baf71\">\u003cstrong>Callback types\u003c/strong>\u003c/h2>\u003cdiv class=\"api-table-scroll\" tabindex=\"0\" aria-label=\"Таблица\">\u003ctable style=\"table-layout:fixed;width:681px;min-width:0\">\u003ccolgroup>\u003ccol style=\"width:121px\">\u003ccol style=\"width:200px\">\u003ccol style=\"width:180px\">\u003ccol style=\"width:180px\">\u003c/colgroup>\u003ctr>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Callback\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Trigger conditions\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Callback initialization code\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Result examples\u003c/p>\u003c/th>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>destroy\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Destroying the payment block through \u003ccode>unmount()\u003c/code>\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003ccode>blocksApp.on(&quot;destroy&quot;, () =&gt; { console.log(&quot;destroy&quot;); });\u003c/code>\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Not applicable\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>success\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Successful payment\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003ccode>blocksApp.on(&quot;success&quot;, (result) =&gt; { console.log(&quot;success&quot;, result); });\u003c/code>\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003ccode>{ &quot;type&quot;: &quot;payment&quot;, &quot;data&quot;: { &quot;transactionId&quot;: 4581868029 }, &quot;status&quot;: &quot;success&quot; }\u003c/code>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>fail\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Failed payment\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003ccode>blocksApp.on(&quot;fail&quot;, (result) =&gt; { console.log(&quot;fail&quot;, result); });\u003c/code>\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003ccode>{ &quot;type&quot;: &quot;payment&quot;, &quot;data&quot;: { &quot;transactionId&quot;: 4581867878, &quot;ReasonCode&quot;: 5206 }, &quot;message&quot;: 3D Secure authentication failed&quot;, &quot;status&quot;: &quot;fail&quot;}\u003c/code>\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003ch2 id=\"section-fe3bba83-a1a6-483d-854b-4b255971ff91\">\u003cstrong>Unsubscribe\u003c/strong>\u003c/h2>\u003cp>You can also unsubscribe from events:\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>javascript\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-7\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-7\" class=\"language-javascript\">// Unsubscribe from successful payment result events\nblocksApp.off(&quot;success&quot;);\n\n// Unsubscribe from payment error events\nblocksApp.off(&quot;fail&quot;);\n\n// Unsubscribe from builder destruction events\nblocksApp.off(&quot;destroy&quot;);\u003c/code>\u003c/pre>\u003c/div>\u003ch2 id=\"section-c1cbdb92-6c78-4284-880a-24d025731c3b\">\u003cstrong>PaymentBlocks call example\u003c/strong>\u003c/h2>\u003cp>Example of calling the \u003ccode>PaymentBlocks\u003c/code> function with all parameters:\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>javascript\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-8\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-8\" class=\"language-javascript\">var blocksApp = new cp.PaymentBlocks(\n{  // initializationParams: Initialization parameters. Required for the builder to work\n   &quot;publicTerminalId&quot;:&quot;test_api_00000000000000000000002&quot;,\n   &quot;paymentSchema&quot;:&quot;Dual&quot;,\n   &quot;description&quot;:&quot;Test payment&quot;,\n   &quot;amount&quot;:100.53,\n ers are the same as for the widget. They are \u003cstrong>required\u003c/strong> for the builder to work.\u003c/p>\u003ch2 id=\"section-a9860ec7-07be-418e-9482-d80d8646ea4f\">\u003cstrong>Customize the payment form builder\u003c/strong>\u003c/h2>\u003cp>Customization is performed by passing the following set of parameters. You need to pass this object as the second argument to the builder&#39;s initialization function.\u003c/p>\u003cp>These parameters are \u003cstrong>optional\u003c/strong>.\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>javascript\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-9\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-9\" class=\"language-javascript\">{\n   &quot;components&quot;:{\n      &quot;paymentButton&quot;:{\n         &quot;text&quot;:&quot;Custom button name&quot;,\n         &quot;fontSize&quot;:&quot;40px&quot;\n      },\n      &quot;paymentForm&quot;:{\n         &quot;labelFontSize&quot;:&quot;5px&quot;,\n         &quot;activeLabelFontSize&quot;:&quot;50px&quot;,\n         &quot;fontSize&quot;:&quot;90px&quot;\n      }\n   },\n   &quot;appearance&quot;:{\n      &quot;colors&quot;:{\n         &quot;primaryButtonColor&quot;:&quot;#1dfa05&quo inputBackground\u003c/code>\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Field background color\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>No\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>4\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003ccode>..inputColor\u003c/code>\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Label text color\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>No\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>4\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003ccode>..inputBorderColor\u003c/code>\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Input field border color\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>No\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>4\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003ccode>..errorColor\u003c/code>\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Input error color\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>No\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>4\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003ccode>..skeletonBackground\u003c/code>\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Skeleton color\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>No\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>4\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003ccode>..titleColor\u003c/code>\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Heading color\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>No\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>4\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003ccode>..textColor\u003c/code>\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Text color\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>No\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>3\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003ccode>.borders\u003c/code>\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>object\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Form borders\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>No\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>4\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003ccode>..radius\u003c/code>\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Form corner radius\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>No\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003ch2 id=\"section-603d0b13-3d82-47aa-9837-deaf0fb980f7\">\u003cstrong>Update the payment form builder\u003c/strong>\u003c/h2>\u003cp>You can update all or part of the builder&#39;s parameters.\u003c/p>\u003cp>To do this, call the \u003ccode>update\u003c/code> method, passing the same parameters, or a subset of them, that were used to initialize the payment form builder.\u003c/p>\u003cp>Only the parameters you pass are updated. There are no required parameters for updating; all parameters are optional.\u003c/p>\u003cp>You can view the list of parameters in the \u003cstrong>Parameters\u003c/strong> section.\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>javascript\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-10\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-10\" class=\"language-javascript\">blocksApp.update(initializationParams);\u003c/code>\u003c/pre>\u003c/div>\u003cp>\u003cbr>\u003c/p>\u003c/div>","toc":[{"id":"section-89e431e7-3010-45d2-b553-ed9d6dbf2352","title":"Builder demo","level":2},{"id":"section-56c83d60-5c8f-49c2-bb42-cbf32e45acb8","title":"Differences from the widget","level":2},{"id":"section-e254e08a-912e-46fa-adf2-4a904b4f468b","title":"Install the payment form builder","level":2},{"id":"section-a918a013-2f31-4ab4-a3bc-8a15c395573d","title":"Remove the builder from DOM","level":2},{"id":"section-c9f8d37d-986a-4c06-bbab-204335bfe710","title":"Events (callbacks)","level":2},{"id":"section-cfa1de56-7540-4a8e-a67b-73e2b07baf71","title":"Callback types","level":2},{"id":"section-fe3bba83-a1a6-483d-854b-4b255971ff91","title":"Unsubscribe","level":2},{"id":"section-c1cbdb92-6c78-4284-880a-24d025731c3b","title":"PaymentBlocks call example","level":2},{"id":"section-67fb6eab-7ea6-411d-a3d1-c7b2d7633434","title":"Initialization parameters","level":2},{"id":"section-a9860ec7-07be-418e-9482-d80d8646ea4f","title":"Customize the payment form builder","level":2},{"id":"section-0e0803c0-ab33-48f9-9160-4687d9981c5e","title":"Customization parameters","level":2},{"id":"section-603d0b13-3d82-47aa-9837-deaf0fb980f7","title":"Update the payment form builder","level":2}]},"script-checkout":{"id":"script-checkout","title":"Checkout script","type":"page","audience":"both","group":"root-script-checkout","html":"\u003cdiv class=\"imported-api\">\u003cp>Checkout is a script embedded into your website that collects card details from a specified form and uses them to generate a cryptogram for payment processing via our API.\u003c/p>\u003cp>The cryptogram is generated using the RSA algorithm with a 2048-bit key length and meets the standard for card data protection. If the requirements described below are followed, card details will not be accessible to you, but your server still impacts their security. \u003c/p>\u003ch2 id=\"section-bbe2cdd8-d4a8-42b7-925c-1629b4116654\">\u003cstrong>Demo checkout\u003c/strong>\u003c/h2>\u003cp>A demonstration of the Checkout script is available in our demo store: \u003ca href=\"https://show.cloudpayments.ru/checkout/\" target=\"_blank\" rel=\"noopener noreferrer\">https://show.cloudpayments.ru/checkout/\u003c/a>\u003c/p>\u003cp>You can use both test card details and real ones for testing. No funds will be debited.\u003c/p>\u003cp>\u003cbr>\u003c/p>\u003ch2 id=\"section-e6dea309-af39-4e43-ae92-eaee552bc90f\">\u003cstrong>Requirements\u003c/strong>\u003c/h2>\u003ch3 id=\"section-a55f2427-4fda-4224-8941-e36a3854656a\">\u003cstrong>Form requirements\u003c/strong>\u003c/h3>\u003cul>\u003cli>\u003cp>Must operate over an HTTPS connection with a valid SSL certificate.\u003c/p>\u003c/li>\u003cli>\u003cp>Form fields must not contain the \u003ccode>name\u003c/code> attribute, this prevents card details from reaching the server when the form is sent.\u003c/p>\u003c/li>\u003cli>\u003cp>The field for entering the card number must support entry of 16 to 19 digits.\u003c/p>\u003c/li>\u003c/ul>\u003ch3 id=\"section-0080a13d-f748-4698-9625-a26d9180ce3d\">\u003cstrong>Cryptogram requirements\u003c/strong>\u003c/h3>\u003cul>\u003cli>\u003cp>Must be generated exclusively by the original checkout script loaded from the system&#39;s official addresses.\u003c/p>\u003c/li>\u003cli>\u003cp>The cryptogram must not be stored after the payment is made or reused for subsequent transactions.\u003c/p>\u003c/li>\u003c/ul>\u003ch3 id=\"section-b065ec9a-01bf-418e-bb6c-9c80b15cdb76\">\u003cstrong>PCI DSS security requirements\u003c/strong>\u003c/h3>\u003cp>From the PCI DSS perspective, this type of connection is classified as &quot;E-commerce merchants who outsource all payment processing to PCI DSS validated third parties, and who have a website(s) that doesn’t directly receive cardholder data but that can impact the security of the payment transaction. No electronic storage, processing, or transmission of any cardholder data on the merchant’s systems or premises,&quot;, meaning that while payment data processing is handled by a third party, your website still impacts the security of card details.\u003c/p>\u003cp>To comply with the standard&#39;s requirements, complete the SAQ-EP self-assessment questionnaire and undergo ASV testing on quarterly basis.\u003c/p>\u003cp>For more information on PCI compliance, see the PCI DSS section.  \u003c/p>\u003ch2 id=\"section-366a9332-313c-4eaa-b7e0-042bdb18270a\">\u003cstrong>Installation\u003c/strong>\u003c/h2>\u003cp>To generate a cryptogram, embed the \u003cstrong>checkout\u003c/strong> script into the payment form page:\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>javascript\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-1\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-1\" class=\"language-javascript\">&lt;script src=&quot;https://checkout.cloudpayments.ru/checkout.js&quot;&gt;&lt;/script&gt;\u003c/code>\u003c/pre>\u003c/div>\u003cp>\u003cstrong>Warning:\u003c/strong> Use \u003ccode>checkout.js\u003c/code> to maintain PCI compliance by ensuring that payment details are sent directly to CloudPayments without affecting your server. Always load \u003ccode>checkout.js\u003c/code> from \u003ca href=\"https://widget.cloudpayments.ru/\" target=\"_blank\" rel=\"noopener noreferrer\">https://widget.cloudpayments.ru\u003c/a> to remain compliant. Do not bundle the script or host it yourself.\u003c/p>\u003cp>Choose the card data transmission method that best suits your needs:\u003c/p>\u003cul>\u003cli>\u003cp>Direct transmission to the script\u003c/p>\u003c/li>\u003cli>\u003cp>Input form\u003c/p>\u003c/li>\u003c/ul>\u003cp>Next, the generated cryptogram of a card must be sent to your server to trigger the payment method via API.  \u003c/p>\u003ch3 id=\"section-b912e49e-a0d4-4b34-9c4b-52d4340657ea\">\u003cstrong>The option of direct transmission to the script\u003c/strong>\u003c/h3>\u003col start=\"1\">\u003cli>\u003cp>Initialize the checkout script:\u003c/p>\u003c/li>\u003c/ol>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>javascript\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-2\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-2\" class=\"language-javascript\">const checkout = new cp.Checkout({\n    publicId: &#39;test_api_000000000000000002&#39;,\n});\u003c/code>\u003c/pre>\u003c/div>\u003col start=\"2\">\u003cli>\u003cp>Call the cryptogram generation method by passing the card details into it:\u003c/p>\u003c/li>\u003c/ol>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>javascript\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-3\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-3\" class=\"language-javascript\">const fieldValues = {\n    cvv: &#39;911&#39;,\n    cardNumber: &#39;4242 4242 4242 4242&#39;,\n    expDateMonth: &#39;12&#39;,\n    expDateYear: &#39;24&#39;,\n}\n\ncheckout.createPaymentCryptogram(fieldValues)\n    .then((cryptogram) =&gt; {\n        console.log(cryptogram);\n    }).catch((errors) =&gt; {\n        console.log(errors)\n    });\u003c/code>\u003c/pre>\u003c/div>\u003ch3 id=\"section-9cb5396e-8aee-41fa-b4a9-1521fa67ad15\">\u003cstrong>The option with the input form\u003c/strong>\u003c/h3>\u003col start=\"1\">\u003cli>\u003cp>Create a card details input form:\u003c/p>\u003c/li>\u003c/ol>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>javascript\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-4\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-4\" class=\"language-javascript\">&lt;form id=&quot;paymentFormSample&quot; autocomplete=&quot;off&quot;&gt;\n    &lt;input type=&quot;text&quot; data-cp=&quot;cardNumber&quot;&gt;\n    &lt;input type=&quot;text&quot; data-cp=&quot;expDateMonth&quot;&gt;\n
