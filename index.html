\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>(UTC+03:00) Минск\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>AZT\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>(UTC+04:00) Баку\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>AMT\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>(UTC+04:00) Ереван\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>SAMT\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>(UTC+04:00) Ижевск, Самара (RTZ 3)\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>GET\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>(UTC+04:00) Тбилиси\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>TJT\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>(UTC+05:00) Ашхабад, Ташкент\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>YEKT\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>(UTC+05:00) Екатеринбург (RTZ 4)\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>ALMT\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>(UTC+06:00) Астана, Алматы\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>NOVT\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>(UTC+06:00) Новосибирск (RTZ 5)\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>KRAT\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>(UTC+07:00) Красноярск (RTZ 6)\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>HKT\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>(UTC+08:00) Гонконг, Пекин, Урумчи, Чунцин\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>IRKT\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>(UTC+08:00) Иркутск (RTZ 7)\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>SGT\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>(UTC+08:00) Куала-Лумпур, Сингапур\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>ULAT\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>(UTC+08:00) Улан-Батор\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>YAKT\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>(UTC+09:00) Якутск (RTZ 8)\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>VLAT\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>(UTC+10:00) Владивосток, Магадан (RTZ 9)\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>SAKT\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>(UTC+11:00) Чокурдах (RTZ 10)\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>ANAT\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>(UTC+12:00) Анадырь, Петропавловск-Камчатский (RTZ 11)\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003ch2 id=\"tipy-uvedomleniy\">\u003cstrong>Типы уведомлений\u003c/strong>\u003c/h2>\u003cp>В таблице ниже представлены типы уведомлений.\u003c/p>\u003cdiv class=\"api-table-scroll\" tabindex=\"0\" aria-label=\"Таблица\">\u003ctable>\u003ctr>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Код\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Название\u003c/p>\u003c/th>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Check\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003ca href=\"https://developers.cloudpayments.ru/#check\" target=\"_blank\" rel=\"noopener noreferrer\">Check\u003c/a>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Pay\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003ca href=\"https://developers.cloudpayments.ru/#pay\" target=\"_blank\" rel=\"noopener noreferrer\">Pay\u003c/a>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Fail\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003ca href=\"https://developers.cloudpayments.ru/#fail\" target=\"_blank\" rel=\"noopener noreferrer\">Fail\u003c/a>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Confirm\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003ca href=\"https://developers.cloudpayments.ru/#confirm\" target=\"_blank\" rel=\"noopener noreferrer\">Confirm\u003c/a>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Refund\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003ca href=\"https://developers.cloudpayments.ru/#refund\" target=\"_blank\" rel=\"noopener noreferrer\">Refund\u003c/a>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Recurrent\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003ca href=\"https://developers.cloudpayments.ru/#recurrent\" target=\"_blank\" rel=\"noopener noreferrer\">Recurrent\u003c/a>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Cancel\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003ca href=\"https://developers.cloudpayments.ru/#cancel\" target=\"_blank\" rel=\"noopener noreferrer\">Cancel\u003c/a>\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cp>\u003cbr>\u003c/p>\u003c/div>","toc":[{"id":"cultures","title":"Языки","level":2},{"id":"kody-oshibok","title":"Коды ошибок","level":2},{"id":"kody-obrabotki-otvetov-na-check-uvedomlenie","title":"Коды обработки ответов на check уведомление","level":2},{"id":"tipy-operatsiy","title":"Типы операций","level":2},{"id":"statusy-operatsiy","title":"Статусы операций","level":2},{"id":"statusy-podpisok-rekurrent","title":"Статусы подписок (рекуррент)","level":2},{"id":"spisok-valyut","title":"Список валют","level":2},{"id":"operatory-fiskalnyh-dannyh","title":"Операторы фискальных данных","level":2},{"id":"kody-vremennyh-zon","title":"Коды временных зон","level":2},{"id":"tipy-uvedomleniy","title":"Типы уведомлений","level":2}],"type":"page","audience":"developer"},"reference/glossary":{"id":"reference/glossary","title":"Глоссарий","group":"reference","html":"\u003cdiv class=\"imported-api\">\u003ch2 id=\"terminy-i-opredeleniya\">\u003cstrong>Термины и определения\u003c/strong>\u003c/h2>\u003cul>\u003cli>\u003cp>\u003cstrong>Виджет\u003c/strong> — платежная форма, предоставленная системой для ввода реквизитов карты держателем и последующей авторизации.\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>Выплата\u003c/strong> - получение вознаграждения физического лица, оказавшего услугу/продавцу товара.\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>Держатель\u003c/strong> — физическое лицо, которому эмитент выдал карту в пользование.\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>Карта\u003c/strong> — банковская карта платежных систем Visa, MasterCard или МИР.\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>ЛК\u003c/strong> — личный кабинет ТСП в системе, расположенный по адресу \u003ca href=\"https://merchant.cloudpayments.ru/\" target=\"_blank\" rel=\"noopener noreferrer\">https://merchant.cloudpayments.ru\u003c/a>\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>Оплата\u003c/strong> - приобретение товара/услуги у физического лица.\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>Плательщик\u003c/strong> - физическое лицо, которое отправляет денежные средства.\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>Площадка\u003c/strong> - посредник, который выступает гарантом безопасности сделки, принимает решение о выполнении сторонами своих обязательств. В спорных случаях выступает Арбитром в спорах и несет финансовую ответственность.\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>Получатель\u003c/strong> - физическое лицо, которое получает денежные средства.\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>Сделка\u003c/strong> - процесс приобретения товара/услуги одним физическим лицом у другого.\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>Система\u003c/strong> — платежный шлюз CloudPayments.\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>ТСП\u003c/strong> — торгово-сервисное предприятие, работающее с системой.\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>Эквайер\u003c/strong> — расчетный банк.\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>Эмитент\u003c/strong> — банк, выпустивший карту.\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>AccumulationId\u003c/strong> - уникальный идентификатор сделки, присваиваемый во время первой операции.\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>API\u003c/strong> — программный интерфейс для взаимодействия с системой, расположенный по адресу \u003ca href=\"https://api.cloudpayments.ru/\" target=\"_blank\" rel=\"noopener noreferrer\">https://api.cloudpayments.ru\u003c/a>\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>Checkout\u003c/strong> - скрипт, который прописывается на сайте, собирает из указанной формы карточные данные и составляет из них криптограмму для оплаты через API.\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>TransactionId\u003c/strong> - уникальный идентификатор транзакции.\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>Widget\u003c/strong> - всплывающая форма для ввода реквизитов карты и e-mail адреса плательщика.\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>3-D Secure\u003c/strong> — протокол проверки держателя эмитентом.\u003c/p>\u003c/li>\u003c/ul>\u003cp>\u003cbr>\u003c/p>\u003cp>\u003cbr>\u003c/p>\u003c/div>","toc":[{"id":"terminy-i-opredeleniya","title":"Термины и определения","level":2}],"type":"page","audience":"developer"},"reference/ecosystem":{"id":"reference/ecosystem","title":"Экосистема CloudPayments","group":"additional","html":"\u003cdiv class=\"imported-api\">\u003ch2 id=\"что-такое-cloudpayments\">\u003cstrong>Что такое CloudPayments\u003c/strong>\u003c/h2>\u003cp>С интернет-эквайрингом CloudPayments вы можете легко получать платежи онлайн как на сайте, так и в приложении. CloudPayments позволит вашим клиентам оплатить покупки банковской картой и методами быстрой оплаты: СБП, T‑Pay, Mir Pay, по ссылке или QR-коду. Подключите интернет-эквайринг с готовыми модулями для CMS и мобильных SDK. Также партнерам СloudPayments доступна облачная онлайн-касса и способ фискализации без кассы Cloud-чеки.\u003c/p>\u003ch2 id=\"экосистема-cloud\">\u003cstrong>Экосистема Cloud\u003c/strong>\u003c/h2>\u003cfigure style=\"text-align:center\">\u003cimg src=\"static/img/editor/173f35d3ba6307f9699f3290fdf0b7c9a88267cf40903eda8d7de5b27b4bb9f8.png\" alt=\"ChatGPT Image 14 сент. 2026 г., 20_27_19.png\" style=\"width:100%;max-width:100%;height:auto\">\u003c/figure>\u003ch2 id=\"section-aa230662-870b-41bc-a678-7de4084f6934\">\u003cstrong>Облачная онлайн-касса CloudKassir\u003c/strong>\u003c/h2>\u003cp>Облачная онлайн-касса CloudKassir — это облачное решение, которое работает без покупки оборудования. Все на нашей стороне: кассы находятся в дата-центре, а чеки формируются автоматически, отправляются покупателю, оператору фискальных данных (ОФД) и в налоговую. Решение соответствует требованиям 54-ФЗ и подходит для работы в онлайне: на сайтах, в мобильных приложениях, социальных сетях, по платежным ссылкам и при оплате по реквизитам. А также для такси, курьеров, разъездной и развозной продажи.\u003c/p>\u003ch3 id=\"section-f111ea4f-6453-408a-8f04-3ef04cc20545\">\u003cstrong>Зачем подключать CloudKassir\u003c/strong>\u003c/h3>\u003cp>Чтобы работать легально и соблюдать 54-ФЗ — онлайн-касса нужна почти всем ИП и компаниям, которые принимают оплату от физлиц.\u003c/p>\u003ch3 id=\"section-b7d6b11c-83b9-4563-88c5-5cdad9479bf9\">\u003cstrong>Что позволяет CloudKassir\u003c/strong>\u003c/h3>\u003cul>\u003cli>\u003cp>Фискализировать онлайн-платежи по 54-ФЗ — автоматически или вручную\u003c/p>\u003c/li>\u003cli>\u003cp>Работать без физической кассы — все в облаке, без оборудования\u003c/p>\u003c/li>\u003cli>\u003cp>Интегрироваться с сайтом, CRM, CMS — или работать через Личный кабинет\u003c/p>\u003c/li>\u003cli>\u003cp>Управлять чеками удобно: формирование, просмотр, экспорт — все в одном ЛК\u003c/p>\u003c/li>\u003cli>\u003cp>Принимать оплату по ссылке, реквизитам или прямо на сайте — и сразу отправлять чек\u003c/p>\u003c/li>\u003cli>\u003cp>Удобно работать с маркировкой Честного знака — информация о маркировке передается автоматически\u003c/p>\u003c/li>\u003c/ul>\u003ch3 id=\"section-f3c23cf7-ed4b-45e4-a2b0-b8fd906b2b2a\">\u003cstrong>Кому подходит онлайн-касса CloudKassir\u003c/strong>\u003c/h3>\u003cul>\u003cli>\u003cp>Любому онлайн-бизнесу с интернет-эквайрингом — подходит для юрлиц и ИП на любой системе налогообложения\u003c/p>\u003c/li>\u003cli>\u003cp>Компаниям, принимающим оплату по реквизитам (без ИЭ)\u003c/p>\u003c/li>\u003cli>\u003cp>Курьерам, такси и другим предпринимателям — для выдачи чеков за оплату наличными\u003c/p>\u003c/li>\u003cli>\u003cp>Онлайн-бизнесу, который торгует маркированными товарами\u003c/p>\u003c/li>\u003c/ul>\u003ch3 id=\"section-03c1ce7f-b7d8-4879-8f36-733e1f8c2dbd\">\u003cstrong>Как подключить CloudKassir\u003c/strong>\u003c/h3>\u003cp>1. Заполните \u003cu>\u003ca href=\"https://cloudkassir.ru/application?utm_source=site_main\" target=\"_blank\" rel=\"noopener noreferrer\">электронную анкету →\u003c/a>\u003c/u>\u003c/p>\u003cp>2. После заполнения анкеты и оплаты счета вам будут предоставлены номер ККТ и ФН для регистрации в ФНС\u003c/p>\u003cp>\u003cbr>\u003c/p>\u003cdiv style=\"text-align:center;margin:24px 0\">\u003ca href=\"https://cloudpayments.ru/form/online-kassa\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;background:#326dff;color:#fff;text-decoration:none;border-radius:12px;padding:12px 20px;max-width:100%;width:240px;min-height:56px;font-size:18px;font-weight:600\">Подключить кассы\u003c/a>\u003c/div>\u003cp>\u003cbr>\u003c/p>\u003ch2 id=\"section-353d3d65-48ba-49c9-848c-67333610d6c9\">\u003cstrong>Что такое Cloud-чеки\u003c/strong>\u003c/h2>\u003cp>Cloud-чеки (облачные онлайн-чеки) — это сервис фискализации от CloudKassir для клиентов с интернет-эквайрингом CloudPayments. C Cloud-чеками вы сможете формировать чеки без собственной кассы и без ее аренды. Подходит для бизнеса, которому неудобно или невозможно зарегистрировать кассу на себя: например, если владелец находится за границей или нет квалифицированной электронной подписи (КЭП).\u003c/p>\u003cfigure style=\"text-align:center\">\u003cimg src=\"https://cloudpayments.ru/upload/editor/be4/4nmaxzxn7jra2pg2nj8eszt4treiz6a5.png\" alt=\"\" style=\"width:100%;max-width:100%;height:auto\">\u003c/figure>\u003cp style=\"text-align:center\">Cloud-чеки для фискализации без покупки и аренды кассы\u003c/p>\u003ch3 id=\"section-fb0df81b-a4aa-4d0b-b069-72f7ce7f2f36\">\u003cstrong>Как работают Cloud-чеки\u003c/strong>\u003c/h3>\u003cp>Мы берем фискализацию на себя: чеки пробиваются через кассы CloudKassir, зарегистрированные на нашу организацию — ООО «Клаудкассир». В чеке будет указан ваш товар и ваша компания в качестве поставщика, но отправителем будет выступать CloudKassir.\u003c/p>\u003col start=\"1\">\u003cli>\u003cp>Клиент оплачивает покупку через CloudPayments\u003c/p>\u003c/li>\u003cli>\u003cp>Сервис Cloud-чеки формирует фискальный чек на стороне CloudKassir\u003c/p>\u003c/li>\u003cli>\u003cp>Чек отправляется клиенту, в ОФД и в налоговую\u003c/p>\u003c/li>\u003c/ol>\u003ch3 id=\"section-77437649-756c-4166-89fc-ca7ed055cc18\">\u003cstrong>Как подключить Cloud-чеки\u003c/strong>\u003c/h3>\u003col start=\"1\">\u003cli>\u003cp>Подключите интернет-эквайринг CloudPayments, если он еще не подключен — оставьте заявку \u003ca href=\"https://cloudpayments.ru/form/residents\" target=\"_blank\" rel=\"noopener noreferrer\">по ссылке →\u003c/a>\u003c/p>\u003c/li>\u003cli>\u003cp>Оставьте заявку \u003ca href=\"https://cloudpayments.ru/form/cloud-cheki\" target=\"_blank\" rel=\"noopener noreferrer\">на подключение Cloud-чеков →\u003c/a>\u003c/p>\u003c/li>\u003cli>\u003cp>После подтверждения настройте интеграцию с сайтом (или CRM)\u003c/p>\u003c/li>\u003cli>\u003cp>При необходимости — протестируйте формирование чеков с поддержкой\u003c/p>\u003c/li>\u003c/ol>\u003ch3 id=\"section-ef070d33-e341-4706-99e4-60de90b67d84\">\u003cstrong>Зачем подключать Cloud-чеки\u003c/strong>\u003c/h3>\u003cp>Чтобы быстро запустить фискализацию без оформления кассы и регистрации в ФНС. Особенно актуально, если вы:\u003c/p>\u003cul>\u003cli>\u003cp>Не можете пройти регистрацию кассы в налоговой\u003c/p>\u003c/li>\u003cli>\u003cp>Хотите упростить документооборот\u003c/p>\u003c/li>\u003cli>\u003cp>Планируете протестировать бизнес-модель без лишних затрат\u003c/p>\u003c/li>\u003c/ul>\u003ch3 id=\"section-ed781584-a25b-4bbf-ba20-7d31ec483d06\">\u003cstrong>Кому подойдут Cloud-чеки\u003c/strong>\u003c/h3>\u003cul>\u003cli>\u003cp>Онлайн-магазинам и сервисам, принимающим оплату через CloudPayments\u003c/p>\u003c/li>\u003cli>\u003cp>Бизнесам, у которых нет возможности оформить КЭП или поставить кассу на учет\u003c/p>\u003c/li>\u003cli>\u003cp>ИП и юрлицам, которые хотят обойтись без ОФД и оборудования\u003c/p>\u003c/li>\u003cli>\u003cp>Мерчантам CloudPayments, которым нужна фискализация возвратов или платежей по ссылке\u003c/p>\u003c/li>\u003c/ul>\u003cp>Обратите внимание: \u003cstrong>Cloud-чеки работают только с интернет-эквайрингом CloudPayments.\u003c/strong> Если вы используете другой эквайринг или принимаете оплату напрямую на расчетный счет — Cloud-чеки не подойдут.\u003c/p>\u003ch3 id=\"section-54729cbe-4942-4db5-9321-0dbf47672ada\">\u003cstrong>Возможности Cloud-чеков\u003c/strong>\u003c/h3>\u003cul>\u003cli>\u003cp>Формирование чеков по всем транзакциям через CloudPayments\u003c/p>\u003c/li>\u003cli>\u003cp>Формирование чеков при возврате платежей\u003c/p>\u003c/li>\u003cli>\u003cp>Фискализация заказов, выставленных через платежные ссылки\u003c/p>\u003c/li>\u003c/ul>\u003ch3 id=\"section-6fb2a131-ac4c-4b4e-8f9f-5bbb5ffdd8bd\">\u003cstrong>Что недоступно в Cloud-чеках\u003c/strong>\u003c/h3>\u003cul>\u003cli>\u003cp>Нет доступа к кассе и личному кабинету ОФД\u003c/p>\u003c/li>\u003cli>\u003cp>Не получится сформировать чеки вручную, если деньги пришли через другой платежный сервис (не через CloudPayments)\u003c/p>\u003c/li>\u003cli>\u003cp>Нельзя фискализировать поступления на расчетный счет\u003c/p>\u003c/li>\u003cli>\u003cp>Не подходит для маркированных товаров\u003c/p>\u003c/li>\u003cli>\u003cp>Чек коррекции можно оформить только через поддержку, и только по операциям CloudPayments\u003c/p>\u003c/li>\u003c/ul>\u003ch3 id=\"section-ac2fe680-0fbf-402f-b39d-6f151f92a2c5\">\u003cstrong>Интеграция для работы с Cloud-чеками\u003c/strong>\u003c/h3>\u003cp>Для работы Cloud-чеков нужна интеграция с вашей CMS или CRM — как и в случае с облачной кассой CloudKassir. Интеграция позволяет передавать фискальные данные в нужном формате.\u003c/p>\u003col start=\"1\">\u003cli>\u003cp>Если вы работаете через API — используйте API CloudPayments, API CloudKassir не подойдет.\u003c/p>\u003c/li>\u003cli>\u003cp>Если вы используете CMS (например, Tilda) — достаточно включить соответствующий тумблер и выбрать систему налогообложения.\u003c/p>\u003c/li>\u003c/ol>\u003cp>\u003cbr>\u003c/p>\u003cdiv style=\"text-align:center;margin:24px 0\">\u003ca href=\"https://cloudpayments.ru/form/cloud-cheki\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;background:#326dff;color:#fff;text-decoration:none;border-radius:12px;padding:12px 20px;max-width:100%;width:240px;min-height:56px;font-size:18px;font-weight:600\">Подключить чеки\u003c/a>\u003c/div>\u003ch2 id=\"section-880a05fd-9e8b-43ab-b340-213c76b71dc7\">\u003cstrong>CloudTips\u003c/strong>\u003c/h2>\u003ch3 id=\"section-44880eea-fb37-4791-baa6-4145cd8bf243\">\u003cstrong>Что такое CloudTips\u003c/strong>\u003c/h3>\u003cp>CloudTips — это сервис для удобного приема онлайн-чаевых, а также донатов и пожертвований. Подходит для заведений (кафе, салоны, отели) и их сотрудников, а также для тех, кто работает на себя.\u003c/p>\u003cp>Оплата происходит по QR-коду или ссылке, а сумма чаевых зачисляется на банковскую карту, привязанную к аккаунту сотрудника, или распределяется между командой. Данные карты вводятся один раз, дальнейшие переводы проходят автоматически.\u003c/p>\u003cfigure style=\"text-align:center\">\u003cimg src=\"https://cloudpayments.ru/upload/editor/d5e/x2n49eb5n517id2zr2c8gkr8i3jzyxc9.png\" alt=\"\" style=\"width:100%;max-width:100%;height:auto\">\u003c/figure>\u003cp style=\"text-align:center\">Сервис онлайн-чаевых CloudTips\u003c/p>\u003ch3 id=\"section-e2d714d8-45b6-4013-89f0-7154f287102c\">\u003cstrong>Зачем подключать CloudTips\u003c/strong>\u003c/h3>\u003cp>Чтобы повысить мотивацию сотрудников, уровень сервиса, увеличить количество чаевых и их средний чек.\u003c/p>\u003ch3 id=\"section-9711822f-ad23-4832-a4d8-117f23033931\">\u003cstrong>Кому подходит CloudTips\u003c/strong>\u003c/h3>\u003cp>Ресторанам, кафе, отелям, доставкам и их сотрудникам, а также специалистам, которые работают на себя. Подходит для приема чаевых в кафе, ресторанах, салонах красоты, аптеках, гостиницах и других офлайн-точках с персоналом.\u003c/p>\u003ch3 id=\"section-0db1ea5c-51d4-4b02-bbbb-fe4115ef91ed\">\u003cstrong>Как подключить CloudTips\u003c/strong>\u003c/h3>\u003ch4 id=\"section-41c64b1c-5481-46ae-9987-5abeff9f328f\">\u003cstrong>Для заведений\u003c/strong>\u003c/h4>\u003col start=\"1\">\u003cli>\u003cp>Оставьте \u003ca href=\"https://cloudtips.ru/business\" target=\"_blank\" rel=\"noopener noreferrer\">заявку на подключение →\u003c/a> и получите доступ в Личный кабинет управляющего\u003c/p>\u003c/li>\u003cli>\u003cp>Создайте заведение и добавьте сотрудников\u003c/p>\u003c/li>\u003c/ol>\u003ch4 id=\"section-bcd00088-c808-42cd-b359-143d8af174e1\">\u003cstrong>Для сотрудников и специалистов, работающих на себя\u003c/strong>\u003c/h4>\u003col start=\"1\">\u003cli>\u003cp>Зарегистрируйтесь в CloudTips \u003ca href=\"https://lk.cloudtips.ru/sign-up\" target=\"_blank\" rel=\"noopener noreferrer\">по ссылке →\u003c/a>\u003c/p>\u003c/li>\u003cli>\u003cp>Заполните информацию о себе, привяжите карту и создайте форму для приема чаевых\u003c/p>\u003c/li>\u003cli>\u003cp>Затем скопируйте ссылку или сохраните QR-код — его можно распечатать и разместить на видном месте\u003c/p>\u003c/li>\u003cli>\u003cp>При переходе по ссылке или сканировании QR-кода клиент попадет на вашу форму оплаты чаевых\u003c/p>\u003c/li>\u003c/ol>\u003cp>Сразу после оплаты средства поступят в копилку CloudTips или на вашу карту — зависит от настроек в Личном кабинете.\u003c/p>\u003ch3 id=\"section-af201e77-4baa-4a3f-854e-1315186dbb30\">\u003cstrong>Личный кабинет управляющего\u003c/strong>\u003c/h3>\u003cp>Чтобы получить доступ в Личный кабинет управляющего, нужно \u003cu>\u003ca href=\"https://cloudtips.ru/business\" target=\"_blank\" rel=\"noopener noreferrer\">оставить заявку\u003c/a>\u003c/u> — в течение часа мы предоставим данные для входа.\u003c/p>\u003cfigure style=\"text-align:center\">\u003cimg src=\"https://cloudpayments.ru/upload/editor/a4a/7gcymm24pifn2or5ppv99wyobn8xyv4n.png\" alt=\"\" style=\"width:100%;max-width:100%;height:auto\">\u003c/figure>\u003cp style=\"text-align:center\">Личный кабинет CloudTips для управляющего\u003c/p>\u003ch4 id=\"section-1ce3d192-8d87-43e6-8f15-d5de613e5269\">\u003cstrong>Возможности ЛК:\u003c/strong>\u003c/h4>\u003cul>\u003cli>\u003cp>Подробная статистика по всем сотрудникам\u003c/p>\u003c/li>\u003cli>\u003cp>Отзывы и оценки от клиентов\u003c/p>\u003c/li>\u003cli>\u003cp>Создание и редактирование заведений\u003c/p>\u003c/li>\u003cli>\u003cp>Регистрация и удаление сотрудников\u003c/p>\u003c/li>\u003cli>\u003cp>Кастомизация общей страницы заведения\u003c/p>\u003c/li>\u003cli>\u003cp>Кастомизация персональных страниц сотрудников\u003c/p>\u003c/li>\u003cli>\u003cp>Конструктор полиграфии с QR-кодами\u003c/p>\u003c/li>\u003cli>\u003cp>Добавление рейтинга заведения\u003c/p>\u003c/li>\u003c/ul>\u003ch3 id=\"section-9bfa0f7c-ee45-4d9c-a689-28206fc742c5\">\u003cstrong>Личный кабинет сотрудника (в браузере или мобильном приложении)\u003c/strong>\u003c/h3>\u003cp>Доступ в Личный кабинет сотрудника выдает управляющий. Вам нужно авторизоваться, принять приглашение и добавить банковскую карту для вывода чаевых.\u003c/p>\u003cfigure style=\"text-align:center\">\u003cimg src=\"https://cloudpayments.ru/upload/editor/9dd/1e4kj9i3rvh919z4anpt8uaj88ivxuly.png\" alt=\"\" style=\"width:100%;max-width:100%;height:auto\">\u003c/figure>\u003cp style=\"text-align:center\">Личный кабинет CloudTips для сотрудника\u003c/p>\u003ch4 id=\"section-a6952697-7067-4f3b-8ac4-8882cb2e2e37\">\u003cstrong>Что есть в ЛК сотрудника:\u003c/strong>\u003c/h4>\u003cul>\u003cli>\u003cp>Статистика по собственным транзакциям\u003c/p>\u003c/li>\u003cli>\u003cp>Комментарии и оценки от клиентов\u003c/p>\u003c/li>\u003cli>\u003cp>Создание дополнительной ссылки на чаевые\u003c/p>\u003c/li>\u003cli>\u003cp>Настройка страницы оплаты (сумма, фото, текст, имя)\u003c/p>\u003c/li>\u003c/ul>\u003ch3 id=\"section-b13c7421-5532-4ac8-98f7-9a016e09c5b4\">\u003cstrong>Как происходит оплата чаевых\u003c/strong>\u003c/h3>\u003cp>Посетители заведения могут быстро и просто оставить чаевые, поставить оценку и написать отзыв. Как выглядит алгоритм оплаты чаевых:\u003c/p>\u003col start=\"1\">\u003cli>\u003cp>Клиент сканирует QR-код на пречеке, визитке, стойке или переходит по ссылке\u003c/p>\u003c/li>\u003cli>\u003cp>Выбирает сотрудника и сумму\u003c/p>\u003c/li>\u003cli>\u003cp>Вводит данные карты для оплаты или оплачивает с помощью T-Pay или СБП\u003c/p>\u003c/li>\u003cli>\u003cp>Средства поступают в копилку в личном кабинете CloudTips или сразу на привязанную банковскую карту\u003c/p>\u003c/li>\u003c/ol>\u003cfigure style=\"text-align:center\">\u003cimg src=\"https://cloudpayments.ru/upload/editor/cd8/idqxm5049v892c4jkcdgrkjy1vhm0ows.png\" alt=\"\" style=\"width:100%;max-width:100%;height:auto\">\u003c/figure>\u003cp>\u003cbr>\u003c/p>\u003cdiv style=\"text-align:center;margin:24px 0\">\u003ca href=\"https://cloudtips.ru/\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;background:#326dff;color:#fff;text-decoration:none;border-radius:12px;padding:12px 20px;max-width:100%;width:300px;min-height:56px;font-size:18px;font-weight:600\">Подключить CloudTips\u003c/a>\u003c/div>\u003cp>\u003cbr>\u003c/p>\u003ch2 id=\"section-c550c4bb-75f0-4f6e-84ee-80248fb89958\">\u003cstrong>CloudTips для приема донатов\u003c/strong>\u003c/h2>\u003cp>Сервис CloudTips подходит не только для приема чаевых — его можно использовать и для сбора донатов. Это удобный способ принимать пожертвования от подписчиков, зрителей, слушателей и других пользователей — без кассы, договоров и бюрократии. Работает через ссылку или QR-код, деньги приходят напрямую на карту. Все это — в одном сервисе, без лишних действий.\u003c/p>\u003cfigure style=\"text-align:center\">\u003cimg src=\"https://cloudpayments.ru/upload/editor/7d7/jclk7huidlm3y5l8bdav6z441hpu7306.png\" alt=\"\" style=\"width:100%;max-width:100%;height:auto\">\u003c/figure>\u003cp style=\"text-align:center\">CloudTips для приема донатов\u003c/p>\u003ch3 id=\"section-1fb87d86-ef6b-475b-9634-41a4461f0b96\">\u003cstrong>Зачем подключать CloudTips\u003c/strong>\u003c/h3>\u003cp>Чтобы принимать пожертвования от пользователей — через ссылку, QR-код или стриминговый виджет.\u003c/p>\u003ch3 id=\"section-2495d1ac-4e0a-4719-88fc-6e3b5329ea9c\">\u003cstrong>Как подключить CloudTips для приема донатов\u003c/strong>\u003c/h3>\u003col start=\"1\">\u003cli>\u003cp>Зарегистрируйтесь в CloudTips \u003ca href=\"https://lk.cloudtips.ru/sign-up\" target=\"_blank\" rel=\"noopener noreferrer\">по ссылке →\u003c/a>\u003c/p>\u003c/li>\u003cli>\u003cp>Заполните информацию о себе и привяжите карту\u003c/p>\u003c/li>\u003cli>\u003cp>Создайте страницу для донатов — вы можете настроить фото, имя, текст, описание, суммы для перевода\u003c/p>\u003c/li>\u003cli>\u003cp>Скопируйте ссылку или QR-код — ее можно вставить в соцсети, чат-боты или разместить на сайте\u003c/p>\u003c/li>\u003c/ol>\u003ch3 id=\"section-58fc663f-7def-4964-8121-72d688cdb5a9\">\u003cstrong>Кому подходит CloudTips\u003c/strong>\u003c/h3>\u003cul>\u003cli>\u003cp>Стримерам\u003c/p>\u003c/li>\u003cli>\u003cp>Блогерам\u003c/p>\u003c/li>\u003cli>\u003cp>Музыкантам и артистам\u003c/p>\u003c/li>\u003cli>\u003cp>Владельцам каналов в Telegram\u003c/p>\u003c/li>\u003cli>\u003cp>Онлайн-проектам без юрлица (любым онлайн-проектам)\u003c/p>\u003c/li>\u003c/ul>\u003ch3 id=\"section-0469d493-aa96-40db-a90f-5df6cbf5a8f9\">\u003cstrong>Как принимать донаты\u003c/strong>\u003c/h3>\u003cp>Через CloudTips можно настроить специальные виджеты для стримов и приема донатов. Все работает через OBS Studio и отображается прямо во время эфира. Также можно принимать донаты через размещение ссылки или QR-кода на любом носителе и площадке.\u003c/p>\u003cfigure style=\"text-align:center\">\u003cimg src=\"https://cloudpayments.ru/upload/editor/e2c/es4esju3vjl2eewk70jvbv18u8vbs4d2.png\" alt=\"\" style=\"width:100%;max-width:100%;height:auto\">\u003c/figure>\u003cp style=\"text-align:center\">Как принимать донаты через CloudTips\u003c/p>\u003ch3 id=\"section-fe72b482-44e9-45f2-9399-77fe2d95d9b3\">\u003cstrong>Как настроить прием донатов стримерам\u003c/strong>\u003c/h3>\u003cp>В\u003cu>\u003ca href=\"https://lk.cloudtips.ru/sign-in\" target=\"_blank\" rel=\"noopener noreferrer\"> Личном кабинете →\u003c/a>\u003c/u> в разделе Стриминг настройте виджеты:\u003c/p>\u003cul>\u003cli>\u003cp>Донат-страницу\u003c/p>\u003c/li>\u003cli>\u003cp>Прогресс-бар\u003c/p>\u003c/li>\u003cli>\u003cp>Оповещения\u003c/p>\u003c/li>\u003c/ul>\u003cp>Добавьте ссылки в OBS Studio — и ваши зрители или слушатели увидят все в реальном времени.\u003c/p>\u003cfigure style=\"text-align:center\">\u003cimg src=\"https://cloudpayments.ru/upload/editor/654/zxhp4o3gy1hgtd6500i47uqs27vqhhdt.png\" alt=\"\" style=\"width:100%;max-width:100%;height:auto\">\u003c/figure>\u003cp style=\"text-align:center\">Настройка приема донатов для стримеров в Личном кабинете CloudTips\u003c/p>\u003ch3 id=\"section-755921d1-9a2f-4493-8543-da630f4852fc\">\u003cstrong>Как настроить прием донатов блогерам\u003c/strong>\u003c/h3>\u003cul>\u003cli>\u003cp>YouTube, RUTUBE, VK — разместите ссылку в описании канала, сообщества или под видео\u003c/p>\u003c/li>\u003cli>\u003cp>Telegram – добавьте ссылку в посте или закрепленном сообщении\u003c/p>\u003c/li>\u003c/ul>\u003cfigure style=\"text-align:center\">\u003cimg src=\"https://cloudpayments.ru/upload/editor/dda/5ozyeiwm0qv0k1pugqpd1n9ih5523njb.png\" alt=\"\" style=\"width:100%;max-width:100%;height:auto\">\u003c/figure>\u003cp style=\"text-align:center\">Как блогеры могут принимать донаты через CloudTips\u003c/p>\u003ch3 id=\"section-6e2577bc-5db9-4fa5-931d-a0518318e31c\">\u003cstrong>Какие функции есть в CloudTips для приема донатов\u003c/strong>\u003c/h3>\u003cp>\u003cstrong>1. Ссылка для донатов\u003c/strong>\u003c/p>\u003cul>\u003cli>\u003cp>Создайте кастомную страницу с вашей аватаркой, текстом\u003c/p>\u003c/li>\u003cli>\u003cp>Донат вам смогут отправить по ссылке или через QR-код\u003c/p>\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2. Виджет сбора средств (прогресс-бар)\u003c/strong>\u003c/p>\u003cul>\u003cli>\u003cp>Показывает цель сбора, общую сумму и прогресс. Работает прямо в эфире\u003c/p>\u003c/li>\u003c/ul>\u003cp>\u003cstrong>3. Виджет уведомлений\u003c/strong>\u003c/p>\u003cul>\u003cli>\u003cp>Отображает сумму доната, комментарий, имя отправителя\u003c/p>\u003c/li>\u003cli>\u003cp>Можно настроить озвучку (TTS), звук уведомления, картинку — все это будет видно и слышно зрителям стрима\u003c/p>\u003c/li>\u003c/ul>\u003ch3 id=\"section-eb16d283-13a7-4a24-9996-7a336686f74e\">\u003cstrong>Как работает CloudTips для приема донатов\u003c/strong>\u003c/h3>\u003cp>После настройки в Личном кабинете вы получите ссылки на виджеты. Их нужно вставить в OBS Studio. Все будет отображаться автоматически — от прогресса сбора до оповещений о новых донатах.\u003c/p>\u003ch3 id=\"section-f3f24f69-4088-4e83-8854-f3a94e7a7048\">\u003cstrong>Как приходят деньги\u003c/strong>\u003c/h3>\u003col start=\"1\">\u003cli>\u003cp>Пользователь переходит по ссылке или сканирует QR-код\u003c/p>\u003c/li>\u003cli>\u003cp>Вводит сумму и оплачивает донат (картой, СБП или через T-Pay)\u003c/p>\u003c/li>\u003cli>\u003cp>Средства зачисляются в копилку CloudTips или сразу на вашу карту — в зависимости от настроек\u003c/p>\u003c/li>\u003c/ol>\u003cp>\u003cbr>\u003c/p>\u003cdiv style=\"text-align:center;margin:24px 0\">\u003ca href=\"https://cloudtips.ru/donations#zeropopup\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;background:#326dff;color:#fff;text-decoration:none;border-radius:12px;padding:12px 20px;max-width:100%;width:240px;min-height:56px;font-size:18px;font-weight:600\">Подключить донаты\u003c/a>\u003c/div>\u003cp>\u003cbr>\u003c/p>\u003ch2 id=\"section-3a87281e-9d9b-4ef3-a956-af555f14b535\">\u003cstrong>CloudSoft\u003c/strong>\u003c/h2>\u003cp>\u003cstrong>Программное обеспечение для приема онлайн-платежей по всему миру\u003c/strong>\u003c/p>\u003cul>\u003cli>\u003cp>Транзакции со всего мира в едином дашборде\u003c/p>\u003c/li>\u003cli>\u003cp>Гибкая тарификация\u003c/p>\u003c/li>\u003cli>\u003cp>Уникальная маршрутизация\u003c/p>\u003c/li>\u003c/ul>\u003cp>\u003cbr>\u003c/p>\u003cdiv style=\"text-align:center;margin:24px 0\">\u003ca href=\"https://soft.cloudpayments.ru/#form\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;background:#326dff;color:#fff;text-decoration:none;border-radius:12px;padding:12px 20px;max-width:100%;width:300px;min-height:56px;font-size:18px;font-weight:600\">Подключить CloudSoft\u003c/a>\u003c/div>\u003cp>\u003cbr>\u003c/p>\u003c/div>","toc":[{"id":"что-такое-cloudpayments","title":"Что такое CloudPayments","level":2},{"id":"экосистема-cloud","title":"Экосистема Cloud","level":2},{"id":"section-aa230662-870b-41bc-a678-7de4084f6934","title":"Облачная онлайн-касса CloudKassir","level":2},{"id":"section-f111ea4f-6453-408a-8f04-3ef04cc20545","title":"Зачем подключать CloudKassir","level":3},{"id":"section-b7d6b11c-83b9-4563-88c5-5cdad9479bf9","title":"Что позволяет CloudKassir","level":3},{"id":"section-f3c23cf7-ed4b-45e4-a2b0-b8fd906b2b2a","title":"Кому подходит онлайн-касса CloudKassir","level":3},{"id":"section-03c1ce7f-b7d8-4879-8f36-733e1f8c2dbd","title":"Как подключить CloudKassir","level":3},{"id":"section-353d3d65-48ba-49c9-848c-67333610d6c9","title":"Что такое Cloud-чеки","level":2},{"id":"section-fb0df81b-a4aa-4d0b-b069-72f7ce7f2f36","title":"Как работают Cloud-чеки","level":3},{"id":"section-77437649-756c-4166-89fc-ca7ed055cc18","title":"Как подключить Cloud-чеки","level":3},{"id":"section-ef070d33-e341-4706-99e4-60de90b67d84","title":"Зачем подключать Cloud-чеки","level":3},{"id":"section-ed781584-a25b-4bbf-ba20-7d31ec483d06","title":"Кому подойдут Cloud-чеки","level":3},{"id":"section-54729cbe-4942-4db5-9321-0dbf47672ada","title":"Возможности Cloud-чеков","level":3},{"id":"section-6fb2a131-ac4c-4b4e-8f9f-5bbb5ffdd8bd","title":"Что недоступно в Cloud-чеках","level":3},{"id":"section-ac2fe680-0fbf-402f-b39d-6f151f92a2c5","title":"Интеграция для работы с Cloud-чеками","level":3},{"id":"section-880a05fd-9e8b-43ab-b340-213c76b71dc7","title":"CloudTips","level":2},{"id":"section-44880eea-fb37-4791-baa6-4145cd8bf243","title":"Что такое CloudTips","level":3},{" cept payments via bank cards, alternative Pay methods without requiring card details, as well as installment payments and \u003cstrong>Dolyami\u003c/strong>. It allows you to securely accept payments on your website, in your mobile app, or through payment links shared on social media.\u003c/p>\u003ch4 id=\"section-947b6e82-9b9e-4b3a-82ec-a9ce2ea1b8d9\">\u003cstrong>Why Connect CloudPayments\u003c/strong>\u003c/h4>\u003cp>To simplify the checkout process for customers, increase the number of completed purchases, and offer a wider range of payment methods.\u003c/p>\u003ch4 id=\"section-a197f059-78e1-4f95-9d51-0d7d869bc067\">\u003cstrong>Who Is It For\u003c/strong>\u003c/h4>\u003cp>Any online business.\u003c/p>\u003ch2 id=\"section-a466ebf1-7d6c-497f-a2b4-a4b459d2fe2c\">\u003cstrong>Connection Steps\u003c/strong>\u003c/h2>\u003cfigure style=\"text-align:center\">\u003cimg src=\"static/img/editor/3e8564b0968a224f86d73a7a3e359371d9cc46648ba6c5e6ebd94ebaf8fa44a1.png\" alt=\"ChatGPT Image 14 сент. 2026 г., 22_11_57.png\" style=\"width:100%;max-width:100%;height:auto\">\u003c/figure>\u003ch2 id=\"контакт-поддержки\">\u003cbr>\u003cstrong>Support Contact\u003c/strong>\u003c/h2>\u003cp>\u003cstrong>For business support and partnership inquiries:\u003c/strong>\u003c/p>\u003cp>\u003cstrong>Phone:\u003c/strong> +7 (495) 374-78-60\u003cbr>\u003cstrong>Sales Department:\u003c/strong> \u003ca href=\"mailto:sales@cp.ru\">sales@cp.ru\u003c/a>\u003c/p>\u003cdiv style=\"text-align:center;margin:24px 0\">\u003ca href=\"https://cloudpayments.ru/form/residents\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;background:#326dff;color:#fff;text-decoration:none;border-radius:12px;padding:12px 20px;max-width:100%;width:240px;min-height:56px;font-size:18px;font-weight:600\">Connect\u003c/a>\u003c/div>\u003cp>\u003cbr>\u003c/p>\u003c/div>","toc":[{"id":"section-9c834cbe-c0ff-492b-b4ee-3adfa04cad5b","title":"CloudPayments Online Acquiring","level":2},{"id":"section-947b6e82-9b9e-4b3a-82ec-a9ce2ea1b8d9","title":"Why Connect CloudPayments","level":4},{"id":"section-a197f059-78e1-4f95-9d51-0d7d869bc067","title":"Who Is It For","level":4},{"id":"section-a466ebf1-7d6c-497f-a2b4-a4b459d2fe2c","title":"Connection Steps","level":2},{"id":"контакт-поддержки","title":"Support Contact","level":2}]},"start/account":{"id":"start/account","title":"Merchant Account","group":"start","html":"\u003cdiv class=\"imported-api\">\u003ch2 id=\"что-такое-личный-кабинет\">\u003cstrong>What Is the Merchant Account\u003c/strong>\u003c/h2>\u003cp>The \u003cstrong>Merchant Account\u003c/strong> is a comprehensive tool for managing transactions, receipts, analytics, and documents. Access to the Merchant Account is provided when you connect \u003cstrong>CloudPayments\u003c/strong> and/or \u003cstrong>CloudKassir\u003c/strong>.\u003c/p>\u003cfigure style=\"text-align:center\">\u003cimg src=\"static/img/editor/b52b83f4031e4c8f7505a617fb70ef633bd0c313033752d6f885165ced54a4e8.png\" alt=\"ChatGPT Image 14 сент. 2026 г., 22_20_29.png\" style=\"width:76%;max-width:100%;height:auto\">\u003c/figure>\u003cdiv style=\"text-align:center;margin:24px 0\">\u003ca href=\"https://merchant.cloudpayments.ru/\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;background:#326dff;color:#fff;text-decoration:none;border-radius:12px;padding:12px 20px;max-width:100%;width:240px;min-height:56px;font-size:18px;font-weight:600\">Merchant Account\u003c/a>\u003c/div>\u003ch2 id=\"section-92858179-e1ac-4b16-9013-912ce1db74f7\">\u003cstrong>What You Can Do in the Merchant Account\u003c/strong>\u003c/h2>\u003cul>\u003cli>\u003cp>Generate reports\u003c/p>\u003c/li>\u003cli>\u003cp>Analyze sales and transaction statistics\u003c/p>\u003c/li>\u003cli>\u003cp>Monitor transactions and process refunds\u003c/p>\u003c/li>\u003cli>\u003cp>Create payment links, add new websites, and configure payment widgets\u003c/p>\u003c/li>\u003cli>\u003cp>Stay up to date with the latest CloudPayments news\u003c/p>\u003c/li>\u003cli>\u003cp>And much more\u003c/p>\u003c/li>\u003c/ul>\u003ch2 id=\"section-972b7fba-9ba8-4321-8532-7ac444db64d8\">\u003cstrong>Getting Started with the Merchant Account\u003c/strong>\u003c/h2>\u003col start=\"1\">\u003cli>\u003cp>Sign in using the link you receive when you connect \u003cstrong>CloudPayments\u003c/strong> and/or \u003cstrong>CloudKassir\u003c/strong>.\u003c/p>\u003c/li>\u003cli>\u003cp>Add the websites where you plan to accept online payments.\u003c/p>\u003c/li>\u003cli>\u003cp>Add team members and assign them roles for collaboration. \u003c/p>\u003c/li>\u003c/ol>\u003ch2 id=\"section-ec2a3891-061d-4e35-b7b1-1ee5a9aeb2f8\">\u003cstrong>How the Merchant Account Helps Your Business\u003c/strong>\u003c/h2>\u003cp>The CloudPayments Merchant Account includes tools that help you identify growth opportunities and improve business performance.\u003c/p>\u003ch3 id=\"section-ebb9eb48-8549-4699-9fad-4b1c77509a36\">\u003cstrong>Increase Sales\u003c/strong>\u003c/h3>\u003ch4 id=\"section-7f014834-db96-400d-95c4-af2147b42cf2\">\u003cstrong>Advanced Analytics\u003c/strong>\u003c/h4>\u003cp>In the \u003cstrong>Statistics\u003c/strong> section, you can segment customers using a wide range of filters, such as city, payment method, or payment system. These insights help you optimize your sales strategy, increase revenue, and improve other key business metrics.\u003c/p>\u003ch4 id=\"section-cacb2673-daad-4729-bb2b-2daa2afa0ba1\">\u003cstrong>Detailed Error Information\u003c/strong>\u003c/h4>\u003cp>In the \u003cstrong>Transactions\u003c/strong> section, you can see which payments were successful and which failed. Failed transactions are highlighted in red and include detailed error descriptions explaining why the payment was declined.\u003c/p>\u003cp>For example, if the customer had insufficient funds or entered incorrect card details, you can share this information with your sales team so they can follow up with the customer and help complete the payment.\u003c/p>\u003ch3 id=\"section-56b62032-182a-4c7d-abc8-fa7f073f56ea\">\u003cstrong>Increase Conversion\u003c/strong>\u003c/h3>\u003cp>The more payment options you offer, the higher your conversion rate.\u003c/p>\u003cp>In the \u003cstrong>Websites\u003c/strong> section, you can enable additional payment methods to reduce cart abandonment and incomplete orders while increasing impulse purchases.\u003c/p>\u003ch3 id=\"section-ad5df9df-3dc5-4e24-8f8c-a05686c64ec2\">\u003cstrong>Reduce Your Team&#39;s Workload\u003c/strong>\u003c/h3>\u003cp>You can add your team members to the CloudPayments Merchant Account and manage their access to different sections.\u003c/p>\u003cp>This helps automate workflows, improve collaboration, and speed up information sharing.\u003c/p>\u003cp>\u003cstrong>Roles and User Management\u003c/strong>\u003c/p>\u003cp>Learn how to secure your Merchant Account with two-factor authentication (2FA), add users, assign roles, and manage team permissions in the CloudPayments Merchant Account.\u003c/p>\u003ch2 id=\"section-bf084977-da29-4475-b792-c612a584f996\">\u003cstrong>Why Roles Matter\u003c/strong>\u003c/h2>\u003cp>Roles allow you to control access for different team members and tailor the Merchant Account to their responsibilities.\u003c/p>\u003cp>For example:\u003c/p>\u003cul>\u003cli>\u003cp>\u003cstrong>Accountants\u003c/strong> can access reports and receipts.\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>Managers\u003c/strong> can view transactions and analytics.\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>Technical specialists\u003c/strong> can manage websites and integrations.\u003c/p>\u003c/li>\u003c/ul>\u003cp>Using roles allows you to:\u003c/p>\u003cul>\u003cli>\u003cp>Restrict access to financial and technical information\u003c/p>\u003c/li>\u003cli>\u003cp>Separate responsibilities across your team\u003c/p>\u003c/li>\u003cli>\u003cp>Reduce the risk of errors when working in the Merchant Account\u003c/p>\u003c/li>\u003c/ul>\u003cp>The table below shows which sections of the Merchant Account are available to users based on their assigned role. This helps you determine the appropriate level of access for each team member when using CloudPayments.\u003c/p>\u003ch2 id=\"section-d180ea8d-af4c-4221-84e6-bcf03301f26a\">\u003cstrong>Role-Based Access\u003c/strong>\u003c/h2>\u003cfigure style=\"text-align:center\">\u003cimg src=\"static/img/editor/91bc5c6d4f655193cfd20eb66ad92446820c83e8c39dfcf376fd4832cbcca892.png\" alt=\"ChatGPT Image 14 сент. 2026 г., 22_26_13.png\" style=\"width:100%;max-width:100%;height:auto\">\u003c/figure>\u003ch2 id=\"section-37c0e701-88a0-4700-8247-658f5f1cf441\">\u003cstrong>Two-Factor Authentication (2FA): What It Is and Why You Need It\u003c/strong>\u003c/h2>\u003cp>Two-factor authentication (2FA) provides an additional layer of security for your account. After entering your password, you&#39;ll be asked to verify your identity using a one-time code sent via SMS.\u003c/p>\u003cp>Today, a username and password alone are no longer enough to keep your account secure. This is especially important when your account provides access to payment management and customer data. That&#39;s why we&#39;ve added a second layer of protection to help keep your information safe.\u003c/p>\u003cblockquote>\u003cp>\u003cstrong>If you and your colleagues use the same Merchant Account, we recommend creating a separate user account for each team member.\u003c/strong> It&#39;s quick and only takes a minute.\u003c/p>\u003c/blockquote>\u003cp>Otherwise, only the person whose phone number is linked to the account will be able to sign in.\u003c/p>\u003ch2 id=\"section-233a3c42-e9a2-4d04-86fb-2d514afe3465\">\u003cstrong>How to Grant Access and Add a User in the Merchant Account\u003c/strong>\u003c/h2>\u003cfigure style=\"text-align:center\">\u003cimg src=\"static/img/editor/94ab182083ba80f5553a0b3265390c4398447b39f4e535e0e0b52c66644762b0.png\" alt=\"ChatGPT Image 14 сент. 2026 г., 22_29_19.png\" style=\"width:100%;max-width:100%;height:auto\">\u003c/figure>\u003cp>\u003ca href=\"https://merchant.cloudpayments.ru/\" target=\"_blank\" rel=\"noopener noreferrer\">Merchant Account \u003c/a>→ Users → Add User\u003c/p>\u003col start=\"1\">\u003cli>\u003cp>Enter the user&#39;s full name. \u003c/p>\u003c/li>\u003cli>\u003cp>Select a role.\u003c/p>\u003c/li>\u003cli>\u003cp>Configure website access.\u003c/p>\u003c/li>\u003cli>\u003cp>Enter the user&#39;s email address (required). An invitation email with a sign-in link will be sent to this address.\u003c/p>\u003c/li>\u003c/ol>\u003cp>For detailed instructions, see the \u003cu>\u003ca href=\"https://static.cloudpayments.ru/docs/kak_sozdat_akkaunt_dlya_sotrudnika.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">User Account Creation Guide\u003c/a>\u003c/u>\u003c/p>\u003ch2 id=\"мобильное-приложение\">Mobile App\u003c/h2>\u003cfigure style=\"text-align:center\">\u003cimg src=\"static/img/editor/3bd6cfa3aff51e5f8181eb186f066e987e34f24dc9ee88ebaaef4fe39c7d281f.png\" alt=\"ChatGPT Image 14 сент. 2026 г., 22_34_17.png\" style=\"width:100%;max-width:100%;height:auto\">\u003c/figure>\u003ch3 id=\"section-28f32607-4c8e-4b37-94ce-df62133e4b4d\">\u003cstrong>CloudPayments Is Now on Your Phone\u003c/strong>\u003c/h3>\u003cp>We&#39;ve launched the \u003cstrong>CloudPayments mobile app\u003c/strong> for \u003cstrong>iOS and Android\u003c/strong>. Stay connected to your business and manage key operations from anywhere—even when you&#39;re away from your computer.\u003c/p>\u003cp>With the app, you can:\u003c/p>\u003cul>\u003cli>\u003cp>Monitor payments, refunds, and orders\u003c/p>\u003c/li>\u003cli>\u003cp>View transaction details\u003c/p>\u003c/li>\u003cli>\u003cp>Receive important notifications\u003c/p>\u003c/li>\u003cli>\u003cp>Contact support quickly\u003c/p>\u003c/li>\u003c/ul>\u003cp>\u003cstrong>Everything you need to manage your business—right at your fingertips.\u003c/strong>\u003c/p>\u003cp>\u003cbr>\u003c/p>\u003cp style=\"text-align:center\">\u003cbr>\u003c/p>\u003c/div>","toc":[{"id":"что-такое-личный-кабинет","title":"What Is the Merchant Account","level":2},{"id":"section-92858179-e1ac-4b16-9013-912ce1db74f7","title":"What You Can Do in the Merchant Account","level":2},{"id":"section-972b7fba-9ba8-4321-8532-7ac444db64d8","title":"Getting Started with the Merchant Account","level":2},{"id":"section-ec2a3891-061d-4e35-b7b1-1ee5a9aeb2f8","title":"How the Merchant Account Helps Your Business","level":2},{"id":"section-ebb9eb48-8549-4699-9fad-4b1c77509a36","title":"Increase Sales","level":3},{"id":"section-7f014834-db96-400d-95c4-af2147b42cf2","title":"Advanced Analytics","level":4},{"id":"section-cacb2673-daad-4729-bb2b-2daa2afa0ba1","title":"Detailed Error Information","level":4},{"id":"section-56b62032-182a-4c7d-abc8-fa7f073f56ea","title":"Increase Conversion","level":3},{"id":"section-ad5df9df-3dc5-4e24-8f8c-a05686c64ec2","title":"Reduce Your Team's Workload","level":3},{"id":"section-bf084977-da29-4475-b792-c612a584f996","title":"Why Roles Matter","level":2},{"id":"section-d180ea8d-af4c-4221-84e6-bcf03301f26a","title":"Role-Based Access","level":2},{"id":"section-37c0e701-88a0-4700-8247-658f5f1cf441","title":"Two-Factor Authentication (2FA): What It Is and Why You Need It","level":2},{"id":"section-233a3c42-e9a2-4d04-86fb-2d514afe3465","title":"How to Grant Access and Add a User in the Merchant Account","level":2},{"id":"мобильное-приложение","title":"Mobile App","level":2},{"id":"section-28f32607-4c8e-4b37-94ce-df62133e4b4d","title":"CloudPayments Is Now on Your Phone","level":3}]},"tech/methods":{"id":"tech/methods","title":"Payment method setup","group":"tech","html":"\u003cp>Choose a payment method to open its setup instructions.\u003c/p>\u003cul>\u003cli>\u003ca href=\"#/tech/methods/tpay\">T-Pay\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#/tech/methods/sbp\">Faster Payments System\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#/tech/methods/digital\">Digital ruble\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#/tech/methods/sberpay\">SberPay\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#/tech/methods/mirpay\">Mir Pay\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#/tech/methods/dolyami\">Dolyami\u003c/a>\u003c/li>\u003c/ul>","toc":[]}}}}}</script>
<script>
'use strict';
async function copyCodeText(text) {
  if (typeof navigator !== 'undefined' && navigator.clipboard?.writeText) {
    try {await navigator.clipboard.writeText(text);return;} catch {}
  }
  const previous = document.activeElement;
  const field = document.createElement('textarea');
  field.value = text;
  field.setAttribute('readonly', '');
  field.style.cssText = 'position:fixed;left:-9999px;top:0';
  document.body.appendChild(field);
  field.select();
  const copied = document.execCommand('copy');
  field.remove();
  previous?.focus({preventScroll: true});
  if (!copied) throw new Error('Clipboard unavailable');
}

const copyFeedbackTimers = new WeakMap();

async function handleCodeCopy(event) {
  const button = event.target.closest('[data-copy-code]');
  if (!button) return;
  const code = document.getElementById(button.dataset.copyCode);
  if (!code) return;
  clearTimeout(copyFeedbackTimers.get(button));
  const feedback = (state, label) => {
    button.dataset.copyState = state;
    button.setAttribute('aria-label', label);
    button.setAttribute('title', label);
    button.querySelector('[data-copy-status]').textContent = state === 'ready' ? '' : label;
  };
  try {
    await copyCodeText(code.textContent);
    feedback('copied', 'Код скопирован');
  } catch {
    feedback('error', 'Не удалось скопировать. Выделите код для копирования.');
  }
  copyFeedbackTimers.set(button, setTimeout(() => {
    feedback('ready', 'Копировать код');
    copyFeedbackTimers.delete(button);
  }, 2000));
}

if (typeof module !== 'undefined') module.exports = {copyCodeText, handleCodeCopy};

/* Shared by the standalone HTML and the Docusaurus search bar. */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.CPDocumentationSearch = factory();
})(typeof globalThis !== 'undefined' ? globalThis : this, function () {
  'use strict';
  const normalize = value => String(value || '').toLocaleLowerCase('ru').replace(/ё/g, 'е');
  const escape = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const tokens = query => [...new Set(normalize(query).trim().split(/\s+/).filter(Boolean))];

  function buildIndex(data, textOf) {
    const index = [];
    const groupNames = Object.fromEntries((data.groups || []).map(g => [g.id, g.title]));
    for (const [pageId, page] of Object.entries(data.pages || {})) {
      const html = page.html || '';
      const headings = [...html.matchAll(/<h[1-6]\b([^>]*)>([\s\S]*?)<\/h[1-6]>/gi)];
      const add = (heading, anchor, body) => {
        const text = textOf(body).replace(/\s+/g, ' ').trim();
        index.push({pageId, pageTitle:page.title, heading, anchor, text, group:groupNames[page.group] || '',
          searchTitle:normalize(page.title), searchHeading:normalize(heading), searchText:normalize(text)});
      };
      add('', '', html.slice(0, headings[0]?.index ?? html.length));
      headings.forEach((h, i) => {
        const attr = h[1].match(/\bid\s*=\s*(?:"([^"]*)"|'([^']*)')/i);
        const anchor = attr ? textOf(attr[1] || attr[2]) : '';
        add(textOf(h[2]), anchor, html.slice(h.index + h[0].length, headings[i+1]?.index ?? html.length));
      });
    }
    return index;
  }

  function find(index, query) {
    const terms = tokens(query);
    if (!terms.length) return [];
    const phrase = normalize(query.trim());
    return index.map((entry, order) => {
      const combined = entry.searchTitle + ' ' + entry.searchHeading + ' ' + entry.searchText;
      if (!terms.every(term => combined.includes(term))) return null;
      let score = entry.searchTitle === phrase ? 150 : 0;
      score += entry.searchHeading === phrase ? 130 : 0;
      for (const term of terms) score += (entry.searchTitle.includes(term) ? 25 : 0) + (entry.searchHeading.includes(term) ? 40 : 0) + (entry.searchText.includes(term) ? 8 : 0);
      // A page-title-only match is represented once instead of at every heading.
      if (entry.heading && terms.every(term => entry.searchTitle.includes(term)) && !terms.some(term => entry.searchHeading.includes(term) || entry.searchText.includes(term))) return null;
      return {...entry, score, order};
    }).filter(Boolean).sort((a,b) => b.score - a.score || a.order - b.order);
  }

  function highlight(text, query) {
    const folded = normalize(text), terms = tokens(query), ranges = [];
    for (const term of terms) {
      let at = folded.indexOf(term);
      while (at >= 0) { ranges.push([at, at + term.length]); at = folded.indexOf(term, at + term.length); }
    }
    ranges.sort((a,b) => a[0]-b[0]);
    const merged = [];
    for (const range of ranges) {
      const last = merged[merged.length-1];
      if (last && range[0] <= last[1]) last[1] = Math.max(last[1], range[1]);
      else merged.push(range.slice());
    }
    let cursor = 0, result = '';
    for (const [start,end] of merged) { result += escape(text.slice(cursor,start)) + '<mark>' + escape(text.slice(start,end)) + '</mark>'; cursor=end; }
    return result + escape(text.slice(cursor));
  }

  function excerpt(entry, query) {
    const positions = tokens(query).map(t => entry.searchText.indexOf(t)).filter(p => p >= 0);
    let start = Math.max(0, (positions.length ? Math.min(...positions) : 0) - 65);
    if (start) { const space=entry.text.indexOf(' ',start); if (space >= start && space < start+25) start=space+1; }
    const end = Math.min(entry.text.length, start+210);
    return (start ? '…' : '') + highlight(entry.text.slice(start,end),query) + (end<entry.text.length ? '…' : '');
  }

  function mount(root, {getData, routeUrl, onNavigate = () => {}, locale = 'ru'}) {

  var data=document.getElementById('document-data');if(!data)return;
  var pages;try{pages=JSON.parse(data.textContent).pages;}catch(e){return;}
  document.querySelectorAll('a[href^="/"]').forEach(function(a){
   var href=a.getAttribute('href');if(href.startsWith('//'))return;
   var parts=href.split('#'),route=parts[0].replace(/^\/+|\/+$/g,''),id=route.replace(/^en\//,'');
   if(!pages[id])return;
   a.setAttribute('href','#/'+route+(parts[1]?'@'+parts.slice(1).join('#'):''));
  });
 }
 update();new MutationObserver(update).observe(document.body,{childList:true,subtree:true});
})();
</script>
<script id="editor-carousel-runtime">/** Install independent, manually controlled carousels in a document or rendered fragment.
 * @param {Document | HTMLElement | null} root
 */
function installCarouselRuntime(root = document) {
  if (!root) return () => {};
  const doc = root.ownerDocument || root;
  const style = doc.createElement('style');
  style.textContent = `
    [data-editor-carousel]{display:block;border:1px solid #dce3ee;border-radius:12px;padding:16px;margin:24px 0;max-width:100%;box-sizing:border-box}
    [data-editor-carousel] [data-carousel-slide]{margin:0}
    [data-editor-carousel] [data-carousel-slide][hidden]{display:none!important}
    [data-editor-carousel] .editor-carousel-frame{height:clamp(220px,45vw,480px);width:100%;background:#f5f7fb;touch-action:pan-y;overflow:hidden}
    [data-editor-carousel] .editor-carousel-frame img{display:block;width:100%!important;height:100%!important;max-width:100%;max-height:100%;margin:0;object-fit:contain;object-position:center;user-select:none}
    [data-editor-carousel] figcaption{min-height:1.5em;margin:10px 0;white-space:pre-wrap;overflow-wrap:anywhere;color:#65758b;text-align:center;font-size:14px}
    [data-editor-carousel] .editor-carousel-controls{display:flex;gap:16px;align-items:center;justify-content:center}
    [data-editor-carousel] button{min-width:44px;min-height:44px;border:1px solid #ccd6e4;border-radius:8px;background:white;color:#183b6c;cursor:pointer;font-size:20px}
    [data-editor-carousel] button:disabled{opacity:.4;cursor:default}
    [data-editor-carousel] button:focus-visible,[data-editor-carousel]:focus-visible{outline:2px solid #326dff;outline-offset:3px}
  `;
  doc.head.append(style);
  const attached = new Map();
  function scan() {
    for (const [element, cleanup] of attached) if (!root.contains(element)) { cleanup(); attached.delete(element); }
    root.querySelectorAll('[data-editor-carousel]').forEach(element => {
      if (attached.has(element)) return;
      const slides = Array.from(element.querySelectorAll('[data-carousel-slide]'));
      if (!slides.length) return;
      const counter = element.querySelector('[data-carousel-counter]');
      let index = 0, touch = null;
      const show = value => {
        index = ((value % slides.length) + slides.length) % slides.length;
        slides.forEach((slide, i) => { slide.hidden = i !== index; });
        if (counter) counter.textContent = (index + 1) + ' / ' + slides.length;
      };
      const click = event => {
        const button = event.target.closest('[data-carousel-step]');
        if (!button || button.closest('[data-editor-carousel]') !== element || button.disabled) return;
        show(index + Number(button.getAttribute('data-carousel-step')));
      };
      const keydown = event => {
        if (event.target.closest('input,textarea,select,button,[contenteditable=true]')) return;
        if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') { event.preventDefault(); show(index + (event.key === 'ArrowRight' ? 1 : -1)); }
      };
      const start = event => { touch = event.touches.length === 1 ? {x:event.touches[0].clientX,y:event.touches[0].clientY} : null; };
      const end = event => {
        if (!touch || !event.changedTouches.length) return;
        const dx = event.changedTouches[0].clientX - touch.x, dy = event.changedTouches[0].clientY - touch.y; touch = null;
        if (Math.abs(dx) >= 40 && Math.abs(dx) > Math.abs(dy) * 1.2) show(index + (dx < 0 ? 1 : -1));
      };
      const cancel = () => { touch = null; };
      element.addEventListener('click', click);
      element.addEventListener('keydown', keydown);
      element.addEventListener('touchstart', start, {passive:true});
      element.addEventListener('touchend', end, {passive:true});
      element.addEventListener('touchcancel', cancel);
      show(0);
      attached.set(element, () => {
        element.removeEventListener('click', click); element.removeEventListener('keydown', keydown);
        element.removeEventListener('touchstart', start); element.removeEventListener('touchend', end); element.removeEventListener('touchcancel', cancel);
      });
    });
  }
  const observer = new MutationObserver(scan);
  observer.observe(root, {childList:true,subtree:true}); scan();
  return () => { observer.disconnect(); for (const cleanup of attached.values()) cleanup(); attached.clear(); style.remove(); };
}

installCarouselRuntime(document);</script>
