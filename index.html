>","toc":[{"id":"demo-konstruktora","title":"Демо платежных блоков","level":2},{"id":"otlichiya-ot-vidzheta","title":"Отличия от виджета","level":2},{"id":"ustanovka-platezhnogo-konstruktora","title":"Установка платежного конструктора","level":2},{"id":"demontazh-iz-dom","title":"Демонтаж из DOM","level":2},{"id":"sobytiya-kollbeki","title":"События (коллбэки)","level":2},{"id":"vidy-kollbekov","title":"Виды коллбэков","level":2},{"id":"otpiska","title":"Отписка","level":2},{"id":"primer-vyzova-paymentblocks","title":"Пример вызова PaymentBlocks","level":2},{"id":"parametry-initsializatsii","title":"Параметры инициализации","level":2},{"id":"obnovlenie-platezhnogo-konstruktora","title":"Обновление платежного конструктора","level":2},{"id":"kastomizatsiya-platezhnogo-konstruktora","title":"Кастомизация платежного конструктора","level":2},{"id":"parametry-kastomizatsii","title":"Параметры кастомизации","level":2}],"type":"page","audience":"developer"},"tech/checkout":{"id":"tech/checkout","title":"Скрипт check-out","group":"tech","html":"\u003cdiv class=\"imported-api\">\u003ch2 id=\"демо-checkout\">\u003cstrong>Демо-checkout\u003c/strong>\u003c/h2>\u003cp>Демонстрация работы скрипта \u003ca href=\"https://developers.cloudpayments.ru/#skript-checkout\" target=\"_blank\" rel=\"noopener noreferrer\">Checkout\u003c/a> представлена в нашем \u003ca href=\"https://show.cloudpayments.ru/checkout/\" target=\"_blank\" rel=\"noopener noreferrer\">демо-магазине\u003c/a>.\u003cbr>Для тестирования можно использовать как \u003ca href=\"https://developers.cloudpayments.ru/#testirovanie\" target=\"_blank\" rel=\"noopener noreferrer\">тестовые карточные данные\u003c/a>, так и реальные. Списания денежных средств не произойдет.\u003c/p>\u003ch3 id=\"trebovaniya-k-forme\">\u003cstrong>Требования к форме:\u003c/strong>\u003c/h3>\u003cul>\u003cli>\u003cp>Должна работать по HTTPS-соединению с валидным SSL-сертификатом.\u003c/p>\u003c/li>\u003cli>\u003cp>На полях не должно быть атрибута &quot;name&quot; — это предотвращает попадание карточных данных на сервер при отправке формы.\u003c/p>\u003c/li>\u003cli>\u003cp>Поле для ввода номера карты должно поддерживать ввод от 16 до 19 цифр.\u003c/p>\u003c/li>\u003c/ul>\u003ch3 id=\"trebovaniya-k-kriptogramme\">\u003cstrong>Требования к криптограмме:\u003c/strong>\u003c/h3>\u003cul>\u003cli>\u003cp>Должна формироваться только оригинальным скриптом checkout, загруженным с адресов системы.\u003c/p>\u003c/li>\u003cli>\u003cp>Криптограмму нельзя хранить после оплаты и использовать повторно.\u003c/p>\u003c/li>\u003c/ul>\u003ch3 id=\"trebovaniya-k-bezopasnosti-po-pci-dss\">\u003cstrong>Требования к безопасности по PCI DSS:\u003c/strong>\u003c/h3>\u003cp>С точки зрения PCI DSS, подобный способ подключения классифицируется как &quot;E-commerce merchants who outsource all payment processing to PCI DSS validated third parties, and who have a website(s) that doesn’t directly receive cardholder data but that can impact the security of the payment transaction. No electronic storage, processing, or transmission of any cardholder data on the merchant’s systems or premises.&quot;, то есть обработка платежных данных выполняется третьей стороной, но сайт влияет на безопасность карточных данных.\u003c/p>\u003cp>Для соблюдения требований стандарта, необходимо заполнять лист самооценки \u003ca href=\"https://www.pcisecuritystandards.org/documents/SAQ_A-EP_v3.docx\" target=\"_blank\" rel=\"noopener noreferrer\">SAQ-EP\u003c/a> и ежеквартально проходить ASV-тестирование.\u003c/p>\u003cp>Подробнее про соответствие требованиям PCI читайте в разделе \u003ca href=\"https://developers.cloudpayments.ru/#pci-dss\" target=\"_blank\" rel=\"noopener noreferrer\">PCI DSS\u003c/a>.\u003c/p>\u003ch2 id=\"ustanovka\">\u003cstrong>Установка\u003c/strong>\u003c/h2>\u003cp>Для создания криптограммы необходимо прописать на странице с платежной формой скрипт \u003cstrong>checkout\u003c/strong>:\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>javascript\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-1\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-1\" class=\"language-javascript\">&lt;script src=&quot;https://checkout.cloudpayments.ru/checkout.js&quot;&gt;&lt;/script&gt;\n\u003c/code>\u003c/pre>\u003c/div>\u003caside class=\"api-callout warning\" role=\"note\">\u003cstrong class=\"callout-label\">Внимание\u003c/strong>\u003cp>Используйте checkout.js, чтобы оставаться совместимым с PCI, гарантируя, что платежные реквизиты отправляются напрямую в CloudPayments, не затрагивая ваш сервер. Всегда загружайте checkout.js с \u003ca href=\"https://checkout.cloudpayments.ru/\" target=\"_blank\" rel=\"noopener noreferrer\">https://checkout.cloudpayments.ru\u003c/a>, чтобы соответствовать требованиям. Не включайте скрипт в пакет и не размещайте его самостоятельно.\u003c/p>\u003c/aside>\u003cp>Выбрать удобный для вас вариант передачи карточных данных:\u003c/p>\u003cul>\u003cli>\u003cp>Передача в скрипт\u003c/p>\u003c/li>\u003cli>\u003cp>Форма для ввода\u003c/p>\u003c/li>\u003c/ul>\u003cp>Далее созданную криптограмму карты необходимо отправить на сервер и вызывать метод оплаты через \u003ca href=\"https://developers.cloudpayments.ru/#api\" target=\"_blank\" rel=\"noopener noreferrer\">API\u003c/a>.\u003c/p>\u003ch3 id=\"variant-s-peredachey-kartochnyh-dannyh-napryamuyu-v-skript\">\u003cstrong>Вариант с передачей карточных данных напрямую в скрипт\u003c/strong>\u003c/h3>\u003cp>1) Инициализировать скрипт checkout\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>javascript\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-2\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-2\" class=\"language-javascript\">const checkout = new cp.Checkout({\n    publicId: &#39;test_api_000000000000000002&#39;,\n});\n\u003c/code>\u003c/pre>\u003c/div>\u003cp>2) Вызвать метод генерации криптограммы, передав в него карточные данные\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>javascript\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-3\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-3\" class=\"language-javascript\">const fieldValues = {\n    cvv: &#39;911&#39;,\n    cardNumber: &#39;4242 4242 4242 4242&#39;,\n    expDateMonth: &#39;12&#39;,\n    expDateYear: &#39;24&#39;,\n}\n\ncheckout.createPaymentCryptogram(fieldValues)\n    .then((cryptogram) =&gt; {\n        console.log(cryptogram);\n    }).catch((errors) =&gt; {\n        console.log(errors)\n    });\n\u003c/code>\u003c/pre>\u003c/div>\u003ch3 id=\"variant-s-ispolzovaniem-formy\">\u003cstrong>Вариант с использованием формы:\u003c/strong>\u003c/h3>\u003cp>1) Создать форму для ввода карточных данных:\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>javascript\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-4\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-4\" class=\"language-javascript\">&lt;form id=&quot;paymentFormSample&quot; autocomplete=&quot;off&quot;&gt;\n    &lt;input type=&quot;text&quot; data-cp=&quot;cardNumber&quot;&gt;\n    &lt;input type=&quot;text&quot; data-cp=&quot;expDateMonth&quot;&gt;\n    &lt;input type=&quot;text&quot; data-cp=&quot;expDateYear&quot;&gt;\n    &lt;input type=&quot;text&quot; data-cp=&quot;cvv&quot;&gt;\n    &lt;input type=&quot;text&quot; data-cp=&quot;name&quot;&gt;\n    &lt;button type=&quot;submit&quot;&gt;Оплатить 100 р.&lt;/button&gt;\n&lt;/form&gt;\n\u003c/code>\u003c/pre>\u003c/div>\u003cp>Поля ввода карточных данных должны быть помечены атрибутами:\u003c/p>\u003cul>\u003cli>\u003cp>\u003cstrong>data-cp=&quot;cardNumber&quot;\u003c/strong> — поле с номером карты;\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>data-cp=&quot;expDateMonth&quot;\u003c/strong> — поле с месяцем срока действия;\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>data-cp=&quot;expDateYear&quot;\u003c/strong> — поле с годом срока действия;\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>data-cp=&quot;cvv&quot;\u003c/strong> — поле с кодом CVV;\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>data-cp=&quot;name&quot;\u003c/strong> — поле с именем и фамилией держателя карты.\u003c/p>\u003c/li>\u003c/ul>\u003cp>2) Инициализировать скрипт checkout\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>javascript\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-5\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-5\" class=\"language-javascript\">const checkout = new cp.Checkout({\n    publicId: &#39;test_api_000000000000000002&#39;,\n    container: document.getElementById(&quot;paymentFormSample&quot;)\n});\n\u003c/code>\u003c/pre>\u003c/div>\u003cp>3) Вызвать метод генерации криптограммы\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>javascript\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-6\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-6\" class=\"language-javascript\">checkout.createPaymentCryptogram()\n    .then((cryptogram) =&gt; {\n        console.log(cryptogram); // криптограмма\n    }).catch((errors) =&gt; {\n        console.log(errors)\n    });\n\u003c/code>\u003c/pre>\u003c/div>\u003ch3 id=\"pri-razrabotke-sobstvennoy-formy-ili-peredachi-dannyh-v-skript-obratite-vnimanie-na-sleduyuschie-momenty\">\u003cstrong>При разработке собственной формы или передачи данных в скрипт обратите внимание на следующие моменты:\u003c/strong>\u003c/h3>\u003cul>\u003cli>\u003cp>длина номера карты составляет от 16 (15 для карт AMEX) до 19 цифр. Подробнее \u003ca href=\"https://en.wikipedia.org/wiki/Payment_card_number\" target=\"_blank\" rel=\"noopener noreferrer\">тут\u003c/a>;\u003c/p>\u003c/li>\u003cli>\u003cp>скрипт checkout не работает в устаревших, небезопасных браузерах, которые не поддерживают протоколы шифрования TLS версии 1.1 или выше. Например, в Internet Explorer 7;\u003c/p>\u003c/li>\u003cli>\u003cp>окно 3DS можно показывать как в новом окне, так и во фрейме поверх страницы. Размер окна должен быть не менее 500х500 пикселей.\u003c/p>\u003c/li>\u003c/ul>\u003ch2 id=\"metody\">\u003cstrong>Методы\u003c/strong>\u003c/h2>\u003ch3 id=\"asinhronnyy-metod-dlya-generatsii-kriptogrammy\">\u003cstrong>Асинхронный метод для генерации криптограммы.\u003c/strong>\u003c/h3>\u003cp>В данном методе при ошибке валидации карточных данных - вместо локализованного сообщения будет выдан код ошибки пример см. ниже.\u003c/p>\u003cp>\u003ccode>async createPaymentCryptogram(fieldValues: CardData): Promise&lt;string&gt;\u003c/code>\u003c/p>\u003cp>Метод возвращает Promise содержащий криптограмму. В случае если переданы некорректные данные Promise будет отклонен с ошибкой содержащей объект со \u003ca href=\"https://developers.cloudpayments.ru/#\" target=\"_blank\" rel=\"noopener noreferrer\">списком ошибок\u003c/a>.\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>javascript\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-7\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-7\" class=\"language-javascript\">const checkout = new cp.Checkout({\n    publicId: &#39;test_api_000000000000000002&#39;\n});\n\nconst fieldValues = {\n    cvv: &#39;911&#39;,\n    cardNumber: &#39;4242 4242 4242 4242&#39;,\n    expDateMonth: &#39;12&#39;,\n    expDateYear: &#39;24&#39;,\n}\n\ncheckout.createPaymentCryptogram(fieldValues)\n    .then((cryptogram) =&gt; {\n        console.log(cryptogram);\n    });\n\u003c/code>\u003c/pre>\u003c/div>\u003ch3 id=\"opisanie-ob-ekta-carddata\">\u003cstrong>Описание объекта CardData:\u003c/strong>\u003c/h3>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>javascript\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-8\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-8\" class=\"language-javascript\">export interface CardData {\n    cvv?:  string; // CVV/CVC код\n    cardNumber?: string; // Номер карты, наличие пробелов не имеет значения\n    expDateMonth?: string; // Срок действия карты - месяц\n    expDateYear?: string; // Срок дейcтвия карты - год\n    expDateMonthYear?: string; // Срок действия карты, все символы за исключением цифр игнорируются, \n    //Если длина строки 2,3 или 5 символов то первая цифра воспринимается как месяц, оставшиеся как год. \n    //Если длина строки 4 или 6 символов то первые два трактуются как месяц, а оставшиеся как год.\n}\n\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"api-table-scroll\" tabindex=\"0\" aria-label=\"Таблица\">\u003ctable style=\"table-layout:fixed;width:1095px;min-width:0\">\u003ccolgroup>\u003ccol style=\"width:268px\">\u003ccol style=\"width:293px\">\u003ccol style=\"width:210px\">\u003ccol style=\"width:324px\">\u003c/colgroup>\u003ctr>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Параметр\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Описание\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Тип\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный *\u003c/p>\u003c/th>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>cvv\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>CVV/CVC код\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Нет *\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>cardNumber\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Номер карты, наличие пробелов не имеет значения\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Не обязательный, если поле привязано в форме\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>expDateMonth\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Срок действия карты - месяц\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Не обязательный, если поле привязано в форме или передано поле \u003ccode>expDateMonthYear\u003c/code>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>expDateYear\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Срок дейcтвия карты - год\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Не обязательный, если поле привязано в форме или переданы поля \u003ccode>expDateMonth\u003c/code> и \u003ccode>expDateYear\u003c/code>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>expDateMonthYear\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Срок действия карты, все символы за исключением цифр игнорируются. Если длина строки 2, 3 или 5 символов то первая цифра воспринимается как месяц, оставшиеся как год. Если длина строки 4 или 6 символов то первые два трактуются как месяц, а оставшиеся как год.\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Не обязательный, если поле привязано в форме или переданы поля \u003ccode>expDateMonth\u003c/code> и \u003ccode>expDateYear\u003c/code>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>name\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Имя владельца карты\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Нет\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003caside class=\"api-callout warning\" role=\"note\">\u003cstrong class=\"callout-label\">Внимание\u003c/strong>\u003cp>Сам объект CardData обязательным не является, вы можете не передавать его если используете привязку к HTML-форме.\u003c/p>\u003c/aside>\u003ch3 id=\"obrabotka-oshibok-validatsii-kartochnyh-dannyh\">\u003cstrong>Обработка ошибок валидации карточных данных:\u003c/strong>\u003c/h3>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>json\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-9\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-9\" class=\"language-json\">const fieldValues = {\n    cvv: &#39;91&#39;, // Невалидный CVV\n    cardNumber: &#39;4242 4242 4242 424&#39;, // Невалидный номер карты\n    expDateMonth: &#39;12&#39;,\n    expDateYear: &#39;24&#39;,\n}\n\ncheckout.createPaymentCryptogram(fieldValues)\n    .then((cryptogram) =&gt; {\n        console.log(cryptogram);\n    })\n        .catch((errors) =&gt; {\n                console.log(errors);\n             /* Выведет\n                {\n            cardNumber: &quot;CardNumber_Invalid&quot;,\n            cvv: &quot;Cvv_Invalid&quot;\n                }\n                */\n});\n\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"api-table-scroll\" tabindex=\"0\" aria-label=\"Таблица\">\u003ctable style=\"table-layout:fixed;width:879px;min-width:0\">\u003ccolgroup>\u003ccol style=\"width:381px\">\u003ccol style=\"width:498px\">\u003c/colgroup>\u003ctr>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Код ошибки\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Описание\u003c/p>\u003c/th>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>CardNumber_Empty\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Пустой номер карты\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>CardNumber_Invalid\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Некорректный номер карты\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Cvv_Empty\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Пустой CVV\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Cvv_Invalid\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Некорректный CVV\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>ExpDateMonthYear_Empty\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Пустой год и месяц\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>ExpDateMonthYear_Invalid\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Некорректный год и месяц\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>ExpDateMonth_Empty\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Пустой месяц\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>ExpDateMonth_Invalid\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Некорректный месяц\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>ExpDateYear_Empty\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Пустой год\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>ExpDateYear_Invalid\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Некорректный год\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Name_Empty\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Пустое имя *\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Name_Invalid\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Некорректное имя *\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Name_TooLong\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Слишком длинное имя *\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Name_TooShort\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Слишком короткое имя *\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003caside class=\"api-callout \" role=\"note\">\u003cstrong class=\"callout-label\">Информация\u003c/strong>\u003cp>* Поле name не является обязательным и валидируется только если указано в форме или передано в объекте CardData.\u003c/p>\u003c/aside>\u003ch3 id=\"metod-dlya-generatsii-kriptogrammy\">\u003cstrong>Метод для генерации криптограммы\u003c/strong>\u003c/h3>\u003cp>Метод возвращает криптограмму в случае успешной генерации и объект со списком ошибок в случае наличия ошибок в карточных данных - в отличие от метода createPaymentCryptogram, объект со списком ошибок содержит не коды ошибок, а локализованные на русский язык описания ошибок.\u003c/p>\u003cp>\u003ccode>createCryptogramPacket(fieldValues: CardData):string|object\u003c/code> - устаревший.\u003c/p>\u003cp>Метод может принимать на вход объект с карточными данными и может использоваться в устаревшей схеме с привязкой к HTML-форме. В случае если используется и привязка формы и этот же параметр найден в объекте CardData при попытке сформировать криптограмму будет выброшена ошибка.\u003c/p>\u003cp>Cкрипт для создания криптограммы:\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>text\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-10\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-10\" class=\"language-text\">this.createCryptogram = function () {\n    var result = checkout.createCryptogramPacket();\n\n    if (result.success) {\n        // сформирована криптограмма\n        alert(result.packet);\n    }\n    else {\n        // найдены ошибки в введённых данных, объект `result.messages` формата: \n        // { name: &quot;В имени держателя карты слишком много символов&quot;, cardNumber: &quot;Неправильный номер карты&quot; }\n        // где `name`, `cardNumber` соответствуют значениям атрибутов `&lt;input ... data-cp=&quot;cardNumber&quot;&gt;`\n       for (var msgName in result.messages) {\n           alert(result.messages[msgName]);\n       }\n    }\n};\n\n$(function () {\n    /* Создание checkout */\n    checkout = new cp.Checkout(\n    // public id из личного кабинета\n    &quot;test_api_00000000000000000000001&quot;,\n    // тег, содержащий поля данных карты\n    document.getElementById(&quot;paymentFormSample&quot;));\n});\n\u003c/code>\u003c/pre>\u003c/div>\u003cp>\u003cbr>\u003c/p>\u003c/div>","toc":[{"id":"демо-checkout","title":"Демо-checkout","level":2},{"id":"trebovaniya-k-forme","title":"Требования к форме:","level":3},{"id":"trebovaniya-k-kriptogramme","title":"Требования к криптограмме:","level":3},{"id":"trebovaniya-k-bezopasnosti-po-pci-dss","title":"Требования к безопасности по PCI DSS:","level":3},{"id":"ustanovka","title":"Установка","level":2},{"id":"variant-s-peredachey-kartochnyh-dannyh-napryamuyu-v-skript","title":"Вариант с передачей карточных данных напрямую в скрипт","level":3},{"id":"variant-s-ispolzovaniem-formy","title":"Вариант с использованием формы:","level":3},{"id":"pri-razrabotke-sobstvennoy-formy-ili-peredachi-dannyh-v-skript-obratite-vnimanie-na-sleduyuschie-momenty","title":"При разработке собственной формы или передачи данных в скрипт обратите внимание на следующие моменты:","level":3},{"id":"metody","title":"Методы","level":2},{"id":"asinhronnyy-metod-dlya-generatsii-kriptogrammy","title":"Асинхронный метод для генерации криптограммы.","level":3},{"id":"opisanie-ob-ekta-carddata","title":"Описание объекта CardData:","level":3},{"id":"obrabotka-oshibok-validatsii-kartochnyh-dannyh","title":"Обработка ошибок валидации карточных данных:","level":3},{"id":"metod-dlya-generatsii-kriptogrammy","title":"Метод для генерации криптограммы","level":3}],"type":"page","audience":"developer"},"tech/orders":{"id":"tech/orders","title":"Одноразовые ссылки","group":"tech","html":"\u003cdiv class=\"imported-api\">\u003cfigure style=\"text-align:center\">\u003cimg src=\"static/img/editor/57fc197368c53d51b2ae532135f194cea8dd9c4ec4aac6a6a862103efebd3549.png\" alt=\"Снимок экрана — 2026-09-14 в 18.26.13.png\" style=\"width:28%;max-width:100%;height:auto\">\u003c/figure>\u003ch2 id=\"начало-работы-с-заказами\">\u003cstrong>Начало работы с заказами\u003c/strong>\u003c/h2>\u003cp>Создание заказов осуществляется из личного кабинета \u003c/p>\u003cfigure style=\"text-align:center\">\u003cimg src=\"static/img/editor/ea84ddea84bc0c796f46a7604a3ae40d0fa6241a8577e0fe7a7b47d227be28c3.png\" alt=\"Снимок экрана — 2026-09-14 в 18.20.42.png\" style=\"width:100%;max-width:100%;height:auto\">\u003c/figure>\u003ch2 id=\"section-1d6c0668-858f-4278-bd06-7b5881ec3c6a\">\u003cstrong>Шаблоны заказов\u003c/strong>\u003c/h2>\u003cp>Чтобы не заполнять данные каждый раз, используйте шаблоны.\u003c/p>\u003cp>Как создать: Личный кабинет → Заказы → Шаблоны заказов → Создать шаблон\u003c/p>\u003cp>В шаблоне заполняются те же поля, что и при создании заказа. При использовании останется добавить только данные для чека.\u003c/p>\u003cfigure style=\"text-align:center\">\u003cimg src=\"static/img/editor/f54e8261e777cd8dcf862fb58b1a896b969a3ef3eeb70e61c523271dc58c808c.png\" alt=\"Снимок экрана — 2026-09-14 в 18.20.58.png\" style=\"width:100%;max-width:100%;height:auto\">\u003c/figure>\u003ch2 id=\"создание-заказов-с-помощью-api\">Создание заказов с помощью API\u003c/h2>\u003cp>Метод формирования ссылки на оплату и последующей отправки уведомления на e-mail адрес плательщика.\u003c/p>\u003cp>\u003cstrong>Адрес метода:\u003c/strong>\u003cbr>https://api.cloudpayments.ru/orders/create\u003c/p>\u003cp>\u003cstrong>Параметры запроса:\u003c/strong>\u003c/p>\u003cdiv class=\"api-table-scroll\" tabindex=\"0\" aria-label=\"Таблица\">\u003ctable>\u003ctr>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Параметр\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Формат\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Применение\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Описание\u003c/p>\u003c/th>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Amount\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Number\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Cумма платежа в валюте, разделитель точка. Количество не нулевых знаков после точки – 2\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Currency\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Валюта RUB/USD/EUR/GBP (\u003ca href=\"https://developers.cloudpayments.ru/#spisok-valyut\" target=\"_blank\" rel=\"noopener noreferrer\">см. справочник\u003c/a>). Если параметр не передан, то по умолчанию принимает значение RUB\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Description\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Назначение платежа в свободной форме\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Email\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>E-mail плательщика\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>RequireConfirmation\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Bool\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Есть значение true — платеж будет выполнен по двухстадийной схеме\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>SendEmail\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Bool\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Если значение true — плательщик получит письмо со ссылкой на оплату\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>InvoiceId\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Номер заказа в вашей системе\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>AccountId\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Идентификатор пользователя в вашей системе\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>OfferUri\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Ссылка на оферту, которая будет показываться на странице заказа\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Phone\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Номер телефона плательщика в произвольном формате\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>SendSms\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Bool\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Если значение true — плательщик получит СМС со ссылкой на оплату\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>SendViber\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Bool\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Если значение true — плательщик получит сообщение в Viber со ссылкой на оплату\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>CultureName\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Язык уведомлений. Возможные значения: &quot;ru-RU&quot;, &quot;en-US&quot;. (\u003ca href=\"#/tech/api@локализация\">см. справочник\u003c/a>)\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>SubscriptionBehavior\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Для создания платежа с подпиской. Возможные значения: CreateWeekly, CreateMonthly\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>SuccessRedirectUrl\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Адрес страницы для редиректа при успешной оплате\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>FailRedirectUrl\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Адрес страницы для редиректа при неуспешной оплате\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>JsonData\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Json\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Любые другие данные, которые будут связаны с транзакцией, в том числе инструкции для формирования \u003ca href=\"https://developers.cloudpayments.ru/#format-peredachi-dannyh-dlya-onlayn-cheka\" target=\"_blank\" rel=\"noopener noreferrer\">онлайн-чека\u003c/a> должны обёртываться в объект \u003ccode>cloudpayments\u003c/code>\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003caside class=\"api-callout \" role=\"note\">\u003cstrong class=\"callout-label\">Информация\u003c/strong>\u003cp>В ответ на корректно сформированный запрос система возвращает параметры запроса и ссылку на оплату.\u003c/p>\u003c/aside>\u003cp>\u003cstrong>Пример запроса:\u003c/strong>\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>json\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-1\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-1\" class=\"language-json\">{\n    &quot;Amount&quot;:10.0,\n    &quot;Currency&quot;:&quot;RUB&quot;,\n    &quot;Description&quot;:&quot;Оплата на сайте example.com&quot;,\n    &quot;Email&quot;:&quot;client@test.local&quot;,\n    &quot;RequireConfirmation&quot;:true,\n    &quot;SendEmail&quot;:false}\u003c/code>\u003c/pre>\u003c/div>\u003cp>\u003cstrong>Пример ответа:\u003c/strong>\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>json\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-2\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-2\" class=\"language-json\">{\n    &quot;Model&quot;: {\n        &quot;Id&quot;: &quot;gASGZVgUN21hcpPF&quot;,\n        &quot;Number&quot;: 2130,\n        &quot;Amount&quot;: 10.0,\n        &quot;Currency&quot;: &quot;RUB&quot;,\n        &quot;CurrencyCode&quot;: 0,\n        &quot;Email&quot;: &quot;client@test.local&quot;,\n        &quot;Phone&quot;: &quot;+71234567890&quot;,\n        &quot;Description&quot;: &quot;Оплата на сайте example.com&quot;,\n        &quot;RequireConfirmation&quot;: true,\n        &quot;Url&quot;: &quot;https://orders.cloudpayments.ru/d/gASGZVgUN21hcpPF&quot;,\n        &quot;CultureName&quot;: &quot;ru-RU&quot;,\n        &quot;CreatedDate&quot;: &quot;/Date(1635835930555)/&quot;,\n        &quot;CreatedDateIso&quot;: &quot;2021-11-02T09:52:10&quot;,\n        &quot;PaymentDate&quot;: null,\n        &quot;PaymentDateIso&quot;: null,\n        &quot;StatusCode&quot;: 0,\n        &quot;Status&quot;: &quot;Created&quot;,\n        &quot;InternalId&quot;: 12272915\n    },\n    &quot;Success&quot;: true,\n    &quot;Message&quot;: null}\u003c/code>\u003c/pre>\u003c/div>\u003caside class=\"api-callout \" role=\"note\">\u003cstrong class=\"callout-label\">Информация\u003c/strong>\u003cp>Сообщение на телефон плательщика может быть отправлено только одним выбранным способом: СМС\u003c/p>\u003c/aside>\u003ch2 id=\"отмена-созданного-заказа\">Отмена созданного заказа\u003c/h2>\u003cp>Метод отмены созданного счета:\u003c/p>\u003cp>\u003cstrong>Адрес метода:\u003c/strong>\u003cbr>https://api.cloudpayments.ru/orders/cancel\u003c/p>\u003cp>\u003cstrong>Параметры запроса:\u003c/strong>\u003c/p>\u003cdiv class=\"api-table-scroll\" tabindex=\"0\" aria-label=\"Таблица\">\u003ctable>\u003ctr>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Параметр\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Формат\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Применение\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Описание\u003c/p>\u003c/th>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Id\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Идентификатор счета\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cp>В ответ на корректно сформированный запрос система возвращает сообщение об успешно выполненной операции.\u003c/p>\u003cp>\u003cstrong>Пример запроса:\u003c/strong>\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>json\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-3\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-3\" class=\"language-json\">{&quot;Id&quot;:&quot;f2K8LV6reGE9WBFn&quot;}\u003c/code>\u003c/pre>\u003c/div>\u003cp>\u003cstrong>Пример ответа:\u003c/strong>\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>json\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-4\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-4\" class=\"language-json\">{\n    &quot;Success&quot;: true,\n    &quot;Message&quot;: null}\u003c/code>\u003c/pre>\u003c/div>\u003cp>\u003cbr>\u003c/p>\u003c/div>","toc":[{"id":"начало-работы-с-заказами","title":"Начало работы с заказами","level":2},{"id":"section-1d6c0668-858f-4278-bd06-7b5881ec3c6a","title":"Шаблоны заказов","level":2},{"id":"создание-заказов-с-помощью-api","title":"Создание заказов с помощью API","level":2},{"id":"отмена-созданного-заказа","title":"Отмена созданного заказа","level":2}],"type":"page","audience":"developer"},"tech/links":{"id":"tech/links","title":"Многоразовые ссылки","group":"tech","html":"\u003ch2 id=\"начало-работы-с-платежными-ссылками\">Начало работы с платежными ссылками\u003c/h2>\u003ch2 id=\"демо-конструктор\">Демо-конструктор\u003c/h2>\u003ch2 id=\"кастомизация\">Кастомизация\u003c/h2>\u003ch2 id=\"возможности-платежных-ссылок\">Возможности платежных ссылок\u003c/h2>","toc":[{"level":2,"title":"Начало работы с платежными ссылками","id":"начало-работы-с-платежными-ссылками"},{"level":2,"title":"Демо-конструктор","id":"демо-конструктор"},{"level":2,"title":"Кастомизация","id":"кастомизация"},{"level":2,"title":"Возможности платежных ссылок","id":"возможности-платежных-ссылок"}],"type":"page","audience":"developer"},"tech/charity":{"id":"tech/charity","title":"Благотворительность","group":"tech","html":"\u003ch2 id=\"начало-работы-с-благотворительными-ссылками\">Начало работы с благотворительными ссылками\u003c/h2>\u003ch2 id=\"кастомизация\">Кастомизация\u003c/h2>\u003ch2 id=\"возможности-платежных-ссылок-для-благотворительности\">Возможности платежных ссылок для благотворительности\u003c/h2>","toc":[{"level":2,"title":"Начало работы с благотворительными ссылками","id":"начало-работы-с-благотворительными-ссылками"},{"level":2,"title":"Кастомизация","id":"кастомизация"},{"level":2,"title":"Возможности платежных ссылок для благотворительности","id":"возможности-платежных-ссылок-для-благотворительности"}],"type":"page","audience":"developer"},"tech/infoshop":{"id":"tech/infoshop","title":"Инфошоп","group":"tech","html":"\u003ch2 id=\"начало-работы-с-инфошопом\">Начало работы с Инфошопом\u003c/h2>\u003ch2 id=\"возможности-инфошопа\">Возможности Инфошопа\u003c/h2>","toc":[{"level":2,"title":"Начало работы с Инфошопом","id":"начало-работы-с-инфошопом"},{"level":2,"title":"Возможности Инфошопа","id":"возможности-инфошопа"}],"type":"page","audience":"developer"},"tech/sdk":{"id":"tech/sdk","title":"Мобильные SDK","group":"tech","html":"\u003cdiv class=\"imported-api\">\u003ch2 id=\"sdk-для-ios\">SDK для iOS\u003c/h2>\u003cp>SDK позволяет интегрировать прием платежей в мобильные приложение для платформы iOS.\u003cbr>Основная версия находится на \u003ca href=\"https://gitpub.cloudpayments.ru/integrations/sdk/cloudpayments-ios\" target=\"_blank\" rel=\"noopener noreferrer\">GitHub\u003c/a>.\u003c/p>\u003cp>Из приложения вы узнаете как получить карточные данные, сформировать криптограмму, провести \u003ca href=\"https://developers.cloudpayments.ru/#3-d-secure\" target=\"_blank\" rel=\"noopener noreferrer\">3-D Secure авторизацию\u003c/a> и выполнить платеж на iPhone или iPad.\u003c/p>\u003cp>\u003cstrong>Условия использования\u003c/strong>:\u003c/p>\u003cul>\u003cli>\u003cp>Если вам необходимо будет пересылать данные через ваш сервер, то для него не потребуется сертификация PCI DSS, так как карточные данные на него приходят в зашифрованном виде, а ключи для расшифровки есть только в платежном шлюзе CloudPayments, в приложении и библиотеке их также нет;\u003c/p>\u003c/li>\u003cli>\u003cp>Данные карты можно вводить с клавиатуры или сканировать камерой например, через \u003ca href=\"http://card.io/\" target=\"_blank\" rel=\"noopener noreferrer\">card.io\u003c/a>. Полный номер карты и CVV нельзя сохранять или записывать в лог;\u003c/p>\u003c/li>\u003cli>\u003cp>Мобильный SDK нельзя использовать для мобильных терминалов (mPos). Единственное применение — в приложениях, которые будут установлены на телефонах и планшетах ваших покупателей;\u003c/p>\u003c/li>\u003cli>\u003cp>По правилам \u003ca href=\"https://developer.apple.com/app-store/review/guidelines/#purchasing-currencies\" target=\"_blank\" rel=\"noopener noreferrer\">AppStore\u003c/a> разработчик мобильного приложения имеет право принимать платежи с использованием сторонних платежных систем только для продажи нецифровых товаров или цифровых товаров, которые можно использовать вне приложения.\u003c/p>\u003c/li>\u003c/ul>\u003ch2 id=\"sdk-для-android\">SDK для Android\u003c/h2>\u003cp>SDK позволяет интегрировать прием платежей в мобильные приложение для платформы Android.\u003cbr>Основная версия находится на \u003ca href=\"https://gitpub.cloudpayments.ru/integrations/sdk/cloudpayments-android\" target=\"_blank\" rel=\"noopener noreferrer\">Github\u003c/a>.\u003c/p>\u003cp>Из приложения вы узнаете, как получить карточные данные, сформировать криптограмму, провести \u003ca href=\"https://developers.cloudpayments.ru/#3-d-secure\" target=\"_blank\" rel=\"noopener noreferrer\">3-D Secure авторизацию\u003c/a> и выполнить платеж на Android.\u003c/p>\u003cp>\u003cstrong>Условия использования\u003c/strong>:\u003c/p>\u003cul>\u003cli>\u003cp>Если вам необходимо будет пересылать данные через ваш сервер, то для него не потребуется сертификация PCI DSS, так как карточные данные на него приходят в зашифрованном виде, а ключи для расшифровки есть только в платежном шлюзе CloudPayments, в приложении и библиотеке их также нет;\u003c/p>\u003c/li>\u003cli>\u003cp>Данные карты можно вводить с клавиатуры или сканировать камерой например, через \u003ca href=\"http://card.io/\" target=\"_blank\" rel=\"noopener noreferrer\">card.io\u003c/a>. Полный номер карты и CVV нельзя сохранять или записывать в лог;\u003c/p>\u003c/li>\u003cli>\u003cp>Мобильный SDK нельзя использовать для мобильных терминалов (mPos). Единственное применение — в приложениях, которые будут установлены на телефонах и планшетах ваших покупателей;\u003c/p>\u003c/li>\u003cli>\u003cp>По правилам \u003ca href=\"https://play.google.com/about/monetization-ads/\" target=\"_blank\" rel=\"noopener noreferrer\">Google Play\u003c/a> разработчик мобильного приложения имеет право принимать платежи с использованием сторонних платежных систем только для продажи нецифровых товаров или цифровых товаров, которые можно использовать вне приложения.\u003c/p>\u003c/li>\u003c/ul>\u003cp>\u003cbr>\u003c/p>\u003c/div>","toc":[{"id":"sdk-для-ios","title":"SDK для iOS","level":2},{"id":"sdk-для-android","title":"SDK для Android","level":2}],"type":"page","audience":"developer"},"tech/api":{"id":"tech/api","title":"API","group":"tech","html":"\u003cdiv class=\"imported-api\">\u003cp>\u003cstrong>API\u003c/strong> — программный интерфейс системы для взаимодействия с системами ТСП.\u003c/p>\u003cp>Интерфейс работает по адресу \u003ca href=\"https://api.cloudpayments.ru/\" target=\"_blank\" rel=\"noopener noreferrer\">api.cloudpayments.ru\u003c/a> и поддерживает функции для выполнения платежа, отмены оплаты, возврата денег, завершения платежей, выполненных по двухстадийной схеме, создания и отмены подписок на рекуррентные платежи, а также отправки счетов по почте.\u003c/p>\u003ch2 id=\"принцип-работы\">Принцип работы\u003cspan data-doc-anchor=\"\" class=\"doc-anchor\" id=\"123\">\u003c/span>\u003c/h2>\u003cul>\u003cli>\u003cp>Параметры передаются методом POST в теле запроса в формате «ключ=значение» либо в JSON.\u003c/p>\u003c/li>\u003cli>\u003cp>API может принимать не больше 150 000 полей в одном запросе. Тайм-аут на получение ответа от API — 5 минут.\u003c/p>\u003c/li>\u003cli>\u003cp>Во всех запросах к API если передать число с дробной частью в целочисленное поле, то ошибки не будет, зато произойдёт математическое округление.\u003c/p>\u003c/li>\u003cli>\u003cp>API ограничивает максимальное количество одновременных запросов для тестовых терминалов до 5, для боевых до 30. Если количество обрабатываемых в данный момент запросов к сайту больше ограничения - API будет возвращать ответ с HTTP кодом 429 (Too many Requests) до момента пока не будет завершена обработка хотя бы одного запроса. При необходимости пересмотра ограничений - обратитесь к персональному менеджеру.\u003c/p>\u003c/li>\u003c/ul>\u003cp>Выбор формата передачи параметров определяется на стороне клиента и управляется через заголовок запроса \u003ca href=\"https://www.w3.org/Protocols/rfc2616/rfc2616-sec14.html#sec14.17\" target=\"_blank\" rel=\"noopener noreferrer\">Content-Type\u003c/a>.\u003c/p>\u003cul>\u003cli>\u003cp>Для параметров \u003cstrong>«ключ=значение»\u003c/strong> Content-Type: \u003cem>application/x-www-form-urlencoded\u003c/em>;\u003cbr>\u003c/p>\u003c/li>\u003cli>\u003cp>Для параметров \u003cstrong>JSON Content-Type\u003c/strong>: \u003cem>application/json\u003c/em>;\u003c/p>\u003c/li>\u003c/ul>\u003cp>Ответ система выдает в JSON-формате, \u003ca href=\"#123\">который\u003c/a> как минимум включает в себя два параметра: \u003cstrong>Success\u003c/strong> и \u003cstrong>Message\u003c/strong>:\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>json\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-1\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-1\" class=\"language-json\">{ &quot;Success&quot;: false, &quot;Message&quot;: &quot;Invalid Amount value&quot; }\u003c/code>\u003c/pre>\u003c/div>\u003ch2 id=\"аутентификация-запросов\">Аутентификация запросов\u003c/h2>\u003cp>Для аутентификации запроса используется \u003ca href=\"https://en.wikipedia.org/wiki/Basic_access_authentication\" target=\"_blank\" rel=\"noopener noreferrer\">HTTP Basic Auth\u003c/a> — отправка логина и пароля в заголовке HTTP-запроса. В качестве логина используется \u003cstrong>Public ID\u003c/strong>, в качестве пароля — \u003cstrong>API Secret\u003c/strong>. Оба этих значения можно получить в личном кабинете.\u003c/p>\u003caside class=\"api-callout warning\" role=\"note\">\u003cstrong class=\"callout-label\">Внимание\u003c/strong>\u003cp>Если в запросе не передан заголовок с данными аутентификации или переданы неверные данные, система вернет HTTP-статус 401 – Unauthorized.\u003c/p>\u003c/aside>\u003caside class=\"api-callout \" role=\"note\">\u003cstrong class=\"callout-label\">Информация\u003c/strong>\u003cp>API secret используется для обеспечения безопасности. Он должен храниться в защищенном месте.\u003c/p>\u003c/aside>\u003ch2 id=\"идемпотентность-api\">Идемпотентность API\u003c/h2>\u003cp>\u003cstrong>Идемпотентность\u003c/strong> — свойство API при повторном запросе выдавать тот же результат, что на первичный запрос без повторной обработки. Это значит, что вы можете отправить несколько запросов к системе с одинаковым идентификатором, при этом обработан будет только один успешный запрос, а все ответы будут идентичными. Таким образом реализуется защита от сетевых ошибок, которые приводят к созданию дублированных записей и действий.\u003cbr>Для включения идемпотентности необходимо в запросе к API передавать заголовок с ключом \u003cstrong>X-Request-ID\u003c/strong>, содержащий уникальный идентификатор. Формирование идентификатора запроса остается на вашей стороне — это может быть guid, комбинация из номера заказа, даты и суммы или любое другое значение на ваше усмотрение.\u003cbr>Каждый новый запрос, который необходимо обработать, должен включать новое значение \u003cstrong>X-Request-ID\u003c/strong>. Обработанный результат хранится в системе в течение 1 часа.\u003c/p>\u003ch2 id=\"тестовый-метод\">Тестовый метод\u003c/h2>\u003cp>Для проверки взаимодействия с API можно вызвать тестовый метод.\u003c/p>\u003cp>\u003cstrong>Адрес метода:\u003c/strong>\u003cbr>https://api.cloudpayments.ru/test\u003c/p>\u003cp>\u003cstrong>Параметры запроса:\u003c/strong>\u003cbr>Отсутствуют.\u003c/p>\u003cp>\u003cstrong>Пример ответа:\u003c/strong>\u003cbr>В ответ метод возвращает статус запроса.\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>json\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-2\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-2\" class=\"language-json\">{&quot;Success&quot;:true,&quot;Message&quot;:&quot;bd6353c3-0ed6-4a65-946f-083664bf8dbd&quot;}\u003c/code>\u003c/pre>\u003c/div>\u003cp>\u003cbr>\u003c/p>\u003ch2 id=\"бизнес-сценарии-оплаты-технические-аспекты\">Бизнес-сценарии оплаты (технические аспекты)\u003c/h2>\u003ch3 id=\"оплата-по-криптограмме\">Оплата по криптограмме\u003c/h3>\u003caside class=\"api-callout \" role=\"note\">\u003cstrong class=\"callout-label\">Информация\u003c/strong>\u003cp>По требованию НСПК, для ТСП, предоставляющих телекоммуникационные услуги (MCC 4814 Telecommunication Services), обязательна передача номера телефона плательщика. При отсутствии номера телефона в запросе, банки-эквайеры будут отклонять проводимые операции. \u003cbr>\u003cbr>Номер телефона необходимо передавать в объекте Payer в параметре Phone. \u003cbr>Формат передачи: только цифры, без разделителей “( )“, “-“ . \u003cbr>Пример передачи: “+71234567890“\u003c/p>\u003c/aside>\u003cp>Метод для оплаты по криптограмме платежных данных результат алгоритма шифрования. Для формирования криптограммы воспользуйтесь скриптом \u003ca href=\"https://developers.cloudpayments.ru/#skript-checkout\" target=\"_blank\" rel=\"noopener noreferrer\">Checkout\u003c/a>.\u003c/p>\u003cp>\u003cstrong>Адреса метода\u003c/strong>:\u003cbr>https://api.cloudpayments.ru/payments/cards/charge — для \u003ca href=\"https://developers.cloudpayments.ru/#shemy-provedeniya-platezha\" target=\"_blank\" rel=\"noopener noreferrer\">одностадийного платежа\u003c/a>\u003cbr>https://api.cloudpayments.ru/payments/cards/auth — для \u003ca href=\"https://developers.cloudpayments.ru/#shemy-provedeniya-platezha\" target=\"_blank\" rel=\"noopener noreferrer\">двухстадийного\u003c/a>\u003c/p>\u003cp>\u003cstrong>Параметры запроса:\u003c/strong>\u003c/p>\u003cdiv class=\"api-table-scroll\" tabindex=\"0\" aria-label=\"Таблица\">\u003ctable>\u003ctr>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Параметр\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Формат\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Применение\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Описание\u003c/p>\u003c/th>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Amount\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Number\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Cумма платежа в валюте, разделитель точка. Количество не нулевых знаков после точки – 2\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Currency\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Валюта: RUB/USD/EUR/GBP (\u003ca href=\"https://developers.cloudpayments.ru/#spisok-valyut\" target=\"_blank\" rel=\"noopener noreferrer\">см. справочник\u003c/a>). Если параметр не передан, то по умолчанию принимает значение RUB\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>IpAddress\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>IP-адрес плательщика\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>CardCryptogramPacket\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003ca href=\"https://developers.cloudpayments.ru/#skript-checkout\" target=\"_blank\" rel=\"noopener noreferrer\">Криптограмма платежных данных\u003c/a>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Name\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Имя держателя карты латиницей\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>PaymentUrl\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Адрес сайта, с которого совершается вызов скрипта checkout\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>InvoiceId\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Номер счета или заказа\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Description\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Описание оплаты в свободной форме\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>CultureName\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Язык уведомлений. Возможные значения: &quot;ru-RU&quot;, &quot;en-US&quot;. (\u003ca href=\"#/tech/api@локализация\">см. справочник\u003c/a>)\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>AccountId\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный идентификатор пользователя для создания подписки и получения токена\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Email\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>E-mail плательщика, на который будет отправлена квитанция об оплате\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Payer\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Object\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Доп. поле, куда передается информация о плательщике. Используйте следующие параметры: \u003ccode>FirstName\u003c/code>, \u003ccode>LastName\u003c/code>, \u003ccode>MiddleName\u003c/code>, \u003ccode>Birth\u003c/code>, \u003ccode>Street\u003c/code>, \u003ccode>Address\u003c/code>, \u003ccode>City\u003c/code>, \u003ccode>Country\u003c/code>, \u003ccode>Phone\u003c/code>, \u003ccode>Postcode\u003c/code>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>JsonData\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Json\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Любые другие данные, которые будут связаны с транзакцией, в том числе инструкции для \u003ca href=\"https://developers.cloudpayments.ru/#rekurrentnye-platezhi-podpiska\" target=\"_blank\" rel=\"noopener noreferrer\">создания подписки\u003c/a> или формирования \u003ca href=\"https://developers.cloudpayments.ru/#format-peredachi-dannyh-dlya-onlayn-cheka\" target=\"_blank\" rel=\"noopener noreferrer\">онлайн-чека\u003c/a> должны обёртываться в объект \u003ccode>cloudpayments\u003c/code>. Мы зарезервировали названия следующих параметров и отображаем их содержимое в реестре операций, выгружаемом в Личном Кабинете: \u003ccode>name\u003c/code>, \u003ccode>firstName\u003c/code>, \u003ccode>middleName\u003c/code>, \u003ccode>lastName\u003c/code>, \u003ccode>nick\u003c/code>, \u003ccode>phone\u003c/code>, \u003ccode>address\u003c/code>, \u003ccode>comment\u003c/code>, \u003ccode>birthDate\u003c/code>.\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>SaveCard\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>bool\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Признак сохранения карточного токена для проведения оплаты по сохранённой карте (см. \u003ca href=\"#/tech/api@рекарринг\">Оплата по токену (рекарринг)\u003c/a>). \u003cbr>Возможные значения: \u003ccode>true\u003c/code> - после успешной оплаты будет возвращён карточный токен, \u003ccode>false\u003c/code> - токен не будет возвращаться (по-умолчанию) \u003cbr>Параметр SaveCard обрабатывается только при включении настройки &quot;Сохранение токена карты&quot; в Личном Кабинете. При включении настройки &quot;Сохранять принудительно&quot;, параметр SaveCard будет игнорироваться.\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003caside class=\"api-callout \" role=\"note\">\u003cstrong class=\"callout-label\">Информация\u003c/strong>\u003cp>Параметр amount не принимает сумму транзакции меньше 0.01.\u003c/p>\u003c/aside>\u003cp>\u003cem>В ответ сервер возвращает JSON с тремя составляющими\u003c/em>:\u003c/p>\u003cul>\u003cli>\u003cp>\u003cstrong>поле success\u003c/strong> — результат запроса;\u003cbr>\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>поле message\u003c/strong> — описание ошибки;\u003cbr>\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>объект model\u003c/strong> — расширенная информация.\u003c/p>\u003c/li>\u003c/ul>\u003cp>\u003cem>Возможные варианты ответа\u003c/em>:\u003c/p>\u003cul>\u003cli>\u003cp>Некорректно сформирован запрос:\u003cbr>\u003cstrong>success\u003c/strong> — false\u003cbr>\u003cstrong>message\u003c/strong> — описание ошибки\u003cbr>\u003c/p>\u003c/li>\u003cli>\u003cp>Требуется 3-D Secure аутентификация:\u003cbr>\u003cstrong>success\u003c/strong> — false\u003cbr>\u003cstrong>model\u003c/strong> — информация для проведения аутентификации\u003cbr>\u003c/p>\u003c/li>\u003cli>\u003cp>Транзакция отклонена:\u003cbr>\u003cstrong>success\u003c/strong> — false\u003cbr>\u003cstrong>model\u003c/strong> — информация о транзакции и код ошибки\u003cbr>\u003c/p>\u003c/li>\u003cli>\u003cp>Транзакция принята:\u003cbr>\u003cstrong>success\u003c/strong> — true\u003cbr>\u003cstrong>model\u003c/strong> — информация о транзакции\u003cbr>\u003c/p>\u003c/li>\u003c/ul>\u003caside class=\"api-callout \" role=\"note\">\u003cstrong class=\"callout-label\">Информация\u003c/strong>\u003cp>Результат запроса (поле Success) не отражает статус транзакции, а лишь свидетельствует об успешности/неуспешности запроса API. Статус транзакции отражен в дополнительном поле Status, также его можно узнать в результате получения \u003ca href=\"https://developers.cloudpayments.ru/#uvedomleniya\" target=\"_blank\" rel=\"noopener noreferrer\">уведомлений\u003c/a>. Интерпретацию статусов транзакции смотрите в \u003ca href=\"https://developers.cloudpayments.ru/#statusy-operatsiy\" target=\"_blank\" rel=\"noopener noreferrer\">справочнике\u003c/a>.\u003c/p>\u003c/aside>\u003cp>\u003cstrong>Пример запроса на оплату по криптограмме:\u003c/strong>\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>json\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-3\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-3\" class=\"language-json\">{\n    &quot;Amount&quot;:10,\n    &quot;Currency&quot;:&quot;RUB&quot;,\n    &quot;InvoiceId&quot;:&quot;1234567&quot;,\n    &quot;IpAddress&quot;: &quot;123.123.123.123&quot;,\n    &quot;Description&quot;:&quot;Оплата товаров в example.com&quot;,\n    &quot;AccountId&quot;:&quot;user_x&quot;,\n    &quot;Name&quot;:&quot;CARDHOLDER NAME&quot;, // CardCryptogramPacket Обязательный параметр\n    &quot;CardCryptogramPacket&quot;:&quot;01492500008719030128SMfLeYdKp5dSQVIiO5l6ZCJiPdel4uDjdFTTz1UnXY+3QaZcNOW8lmXg0H670MclS4lI+qLkujKF4pR5Ri+T/E04Ufq3t5ntMUVLuZ998DLm+OVHV7FxIGR7snckpg47A73v7/y88Q5dxxvVZtDVi0qCcJAiZrgKLyLCqypnMfhjsgCEPF6d4OMzkgNQiynZvKysI2q+xc9cL0+CMmQTUPytnxX52k9qLNZ55cnE8kuLvqSK+
