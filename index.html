business"},{"id":"methods/installments","title":"Рассрочка","type":"page","audience":"business"},{"id":"methods/foreign","title":"Иностранные карты","type":"page","audience":"business"},{"id":"methods/digital","title":"Цифровой рубль","type":"page","audience":"business"}],"root":false},{"id":"scenarios","title":"Бизнес-сценарии оплаты","audience":"both","description":"Подписки, повторные платежи и безопасная сделка","items":[{"id":"scenarios/recurrent","title":"Рекурренты","type":"page","audience":"both"},{"id":"scenarios/recurring","title":"Рекарринг","type":"page","audience":"both"},{"id":"scenarios/escrow","title":"Безопасная сделка","type":"page","audience":"both"},{"id":"scenarios/customization","title":"Кастомизация платежных интерфейсов","type":"page","audience":"both"}],"root":false},{"id":"tech","title":"Технические аспекты подключения","audience":"developer","description":"Интерфейсы, API, уведомления и настройка способов оплаты","items":[{"id":"tech/widget","title":"Виджет","type":"page","audience":"developer"},{"id":"tech/blocks","title":"Платежные блоки","type":"page","audience":"developer"},{"id":"tech/checkout","title":"Скрипт check-out","type":"page","audience":"developer"},{"id":"tech/orders","title":"Одноразовые ссылки","type":"page","audience":"developer"},{"id":"tech/links","title":"Многоразовые ссылки","type":"page","audience":"developer"},{"id":"tech/charity","title":"Благотворительность","type":"page","audience":"developer"},{"id":"tech/infoshop","title":"Инфошоп","type":"page","audience":"developer"},{"id":"tech/sdk","title":"Мобильные SDK","type":"page","audience":"developer"},{"id":"tech/api","title":"API","type":"page","audience":"developer"},{"id":"tech/notifications","title":"Уведомления","type":"page","audience":"developer"},{"id":"tech/methods","title":"Настройка методов оплаты","type":"page","audience":"developer"},{"id":"tech/methods/tpay","title":"T-Pay","type":"page","audience":"developer","parentId":"tech/methods"},{"id":"tech/methods/sbp","title":"СБП","type":"page","audience":"developer","parentId":"tech/methods"},{"id":"tech/methods/digital","title":"Цифровой рубль","type":"page","audience":"developer","parentId":"tech/methods"},{"id":"tech/methods/sberpay","title":"СберПэй","type":"page","audience":"developer","parentId":"tech/methods"},{"id":"tech/methods/mirpay","title":"МирПэй","type":"page","audience":"developer","parentId":"tech/methods"},{"id":"tech/methods/dolyami","title":"Долями","type":"page","audience":"developer","parentId":"tech/methods"}],"root":false},{"id":"security","title":"Информационная безопасность","audience":"developer","description":"Требования PCI DSS и защита карточных данных","items":[{"id":"security","title":"Информационная безопасность","type":"page","audience":"developer"}],"root":false},{"id":"reference","title":"Тестирование, справочники и глоссарий","audience":"developer","description":"Проверка интеграции и справочные материалы","items":[{"id":"reference/testing","title":"Тестирование","type":"page","audience":"developer"},{"id":"reference/directory","title":"Справочник","type":"page","audience":"developer"},{"id":"reference/glossary","title":"Глоссарий","type":"page","audience":"developer"}],"root":false},{"id":"additional","title":"Дополнительно","audience":"both","description":"Подробнее об экосистеме CloudPayments","items":[{"id":"reference/ecosystem","title":"Экосистема CloudPayments","type":"page","audience":"both"}],"links":[{"id":"reference/ecosystem","title":"CloudKassir","anchor":"section-aa230662-870b-41bc-a678-7de4084f6934"},{"id":"reference/ecosystem","title":"CloudTips","anchor":"section-880a05fd-9e8b-43ab-b340-213c76b71dc7"},{"id":"reference/ecosystem","title":"CloudSoft","anchor":"section-3a87281e-9d9b-4ef3-a956-af555f14b535"}],"root":false},{"id":"category/1c9cdbe5-69ae-46b3-a612-49491edac1ef","title":"Тестовый раздел","audience":"both","description":"","root":false,"items":[{"id":"test_page","title":"Тестовая страница","type":"page","audience":"developer"}]}],"pages":{"start/connect":{"id":"start/connect","title":"Процесс подключения","group":"start","html":"\u003cdiv class=\"imported-api\">\u003ch2 id=\"интернет-эквайринг-cloudpayments\">\u003cstrong>Интернет-эквайринг CloudPayments\u003c/strong>\u003c/h2>\u003cp>Это сервис для приема онлайн-платежей банковскими картами, с помощью альтернативных Pay-методов без ввода данных карты, а также в рассрочку и Долями. CloudPayments позволяет безопасно принимать оплату на сайте, в приложении или в социальных сетях через ссылки.\u003c/p>\u003ch4 id=\"section-3ef06271-9466-495f-9d16-a5eaf4e86838\">\u003cstrong>Зачем подключать CloudPayments\u003c/strong>\u003c/h4>\u003cp>Чтобы упростить процесс оплаты для клиентов, увеличить количество завершенных покупок и расширить выбор методов оплаты.\u003c/p>\u003ch4 id=\"section-b0f63321-271d-4c9a-83d3-7d9657b2b970\">\u003cstrong>Кому подходит\u003c/strong>\u003c/h4>\u003cp>Любому онлайн-бизнесу\u003c/p>\u003ch2 id=\"этапы-подключения\">\u003cstrong>Этапы подключения\u003c/strong>\u003c/h2>\u003cfigure style=\"text-align:center\">\u003cimg src=\"static/img/editor/054c2830a11a515738b863819ba36934d2b56e994f259a55ddd7f2d12c8a6890.png\" alt=\"Этапы подключения интернет-эквайринга CloudPayments: регистрация личного кабинета, заполнение и проверка анкеты, верификационный платеж, перевод сайта в боевой режим и проверка работы.\" style=\"width:100%;max-width:100%;height:auto\">\u003c/figure>\u003ch2 id=\"контакт-поддержки\">\u003cbr>\u003cstrong>Контакт поддержки\u003c/strong>\u003c/h2>\u003cp>\u003cstrong>По вопросам сопровождения и развития бизнеса:\u003c/strong>\u003c/p>\u003cp>Телефон: \u003ca href=\"tel:74953747860\">+7(495)374-78-60\u003c/a>\u003c/p>\u003cp>Отдел продаж: \u003ca href=\"mailto:sales@cp.ru\">sales@cp.ru\u003c/a>\u003c/p>\u003cdiv style=\"text-align:center;margin:24px 0\">\u003ca href=\"https://cloudpayments.ru/form/residents\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;background:#326dff;color:#fff;text-decoration:none;border-radius:12px;padding:12px 20px;max-width:100%;width:240px;min-height:56px;font-size:18px;font-weight:600\">Подключить\u003c/a>\u003c/div>\u003cp>\u003cbr>\u003c/p>\u003c/div>","toc":[{"id":"интернет-эквайринг-cloudpayments","title":"Интернет-эквайринг CloudPayments","level":2},{"id":"section-3ef06271-9466-495f-9d16-a5eaf4e86838","title":"Зачем подключать CloudPayments","level":4},{"id":"section-b0f63321-271d-4c9a-83d3-7d9657b2b970","title":"Кому подходит","level":4},{"id":"этапы-подключения","title":"Этапы подключения","level":2},{"id":"контакт-поддержки","title":"Контакт поддержки","level":2}],"type":"page","audience":"business"},"start/account":{"id":"start/account","title":"Регистрация личного кабинета","group":"start","html":"\u003cdiv class=\"imported-api\">\u003ch2 id=\"что-такое-личный-кабинет\">Что такое личный кабинет\u003c/h2>\u003cp>Личный кабинет CloudPayments — это многофункциональный инструмент для работы с транзакциями, чеками, статистикой и документами. Доступ в Личный кабинет выдается при подключении к CloudPayments и/или CloudKassir.\u003c/p>\u003cfigure style=\"text-align:center\">\u003cimg src=\"static/img/editor/72cf4034f26281b4c1efa11d37782c1c06fada0f98fffd1ce1dfd0ba2f902b51.png\" alt=\"652362ec-3ece-405d-92a5-5a4ff864dd8a.png\" style=\"width:67%;max-width:100%;height:auto\">\u003c/figure>\u003cdiv style=\"text-align:center;margin:24px 0\">\u003ca href=\"https://merchant.cloudpayments.ru/\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;background:#326dff;color:#fff;text-decoration:none;border-radius:12px;padding:12px 20px;max-width:100%;width:240px;min-height:56px;font-size:18px;font-weight:600\">ЛИЧНЫЙ КАБИНЕТ\u003c/a>\u003c/div>\u003ch2 id=\"section-92858179-e1ac-4b16-9013-912ce1db74f7\">\u003cstrong>Что можно делать в Личном кабинете\u003c/strong>\u003c/h2>\u003cul>\u003cli>\u003cp>Формировать отчеты\u003c/p>\u003c/li>\u003cli>\u003cp>Анализировать статистику по оборотам и транзакциям\u003c/p>\u003c/li>\u003cli>\u003cp>Отслеживать транзакции и делать возвраты\u003c/p>\u003c/li>\u003cli>\u003cp>Формировать платежные ссылки, подключать новые сайты и настраивать виджеты для оплаты\u003c/p>\u003c/li>\u003cli>\u003cp>Следить за актуальными новостями CloudPayments\u003c/p>\u003c/li>\u003cli>\u003cp>И многое другое\u003c/p>\u003c/li>\u003c/ul>\u003cp>\u003cbr>\u003c/p>\u003cp>\u003cbr>\u003c/p>\u003ch2 id=\"section-e2e98d35-9d27-40ca-b29c-d2c9c9c95278\">\u003cstrong>Как начать работу в Личном кабинете\u003c/strong>\u003c/h2>\u003col start=\"1\">\u003cli>\u003cp>Авторизуйтесь по ссылке — вы получаете ее при подключении CloudPayments и/или CloudKassir\u003c/p>\u003c/li>\u003cli>\u003cp>Добавьте сайты, на которых вы планируете принимать онлайн-платежи\u003c/p>\u003c/li>\u003cli>\u003cp>Добавьте сотрудников и назначьте им роль для совместной работы, \u003ca href=\"https://static.cloudpayments.ru/docs/kak_sozdat_akkaunt_dlya_sotrudnika.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">инструкция →\u003c/a>\u003c/p>\u003c/li>\u003c/ol>\u003ch2 id=\"section-7ccbb848-c34a-4211-a8a2-a4f977ef7426\">\u003cstrong>Как Личный кабинет помогает вашему бизнесу\u003c/strong>\u003c/h2>\u003cp>В Личном кабинете CloudPayments есть инструменты, которые помогут вам найти точки роста, о них рассказали ниже.\u003c/p>\u003ch3 id=\"section-50bac298-053c-42e0-9ec1-39630e646138\">\u003cstrong>Увеличение продаж\u003c/strong>\u003c/h3>\u003cp>\u003cstrong>Расширенная аналитика:\u003c/strong>\u003cbr>В разделе \u003ca href=\"/tech/methods/sbp/#spisok-uchastnikov-sbp\">Статистика\u003c/a> можно сегментировать плательщиков по множеству фильтров, например: по городам, методам оплаты, платежным системам. Это помогает улучшать стратегию продаж, влиять на увеличение выручки и других бизнес-показателей.\u003c/p>\u003cp>\u003cstrong>Расшифровка ошибок:\u003c/strong>\u003cbr>В разделе Транзакции вы можете видеть, какие оплаты прошли, а какие нет. Неуспешные транзакции обозначены красным цветом, рядом с ними указана подробная информация о причинах — почему оплата не прошла. На карте клиента не хватило средств или данные карты были введены с ошибкой — передайте информацию в отдел продаж, и менеджеры «дожмут» оплату до успеха.\u003c/p>\u003ch3 id=\"section-5975e931-8be0-4946-b43e-708428237284\">\u003cstrong>Увеличение конверсии\u003c/strong>\u003c/h3>\u003cp>Чем больше способов оплаты для клиента, тем выше конверсия. Вы можете включить дополнительные методы оплат в разделе Сайты. Так вы снизите количество «брошенных корзин» и незавершенных заказов, а количество импульсных покупок наоборот увеличится.\u003c/p>\u003ch3 id=\"section-0075b696-cc36-42f8-927b-3437d8ea52af\">\u003cstrong>Снижение нагрузки на команду\u003c/strong>\u003c/h3>\u003cp>Вы можете добавить свою команду в Личный кабинет CloudPayments и управлять доступами сотрудников к разделам. Это помогает автоматизировать процессы и ускорить обмен информацией.\u003c/p>\u003cp>\u003cbr>\u003c/p>\u003ch2 id=\"section-0a0b726b-f318-4ca1-8657-c6f9534eefd6\">\u003cstrong>Роли и управление пользователями\u003c/strong>\u003c/h2>\u003cp>Как защитить доступ к Личному кабинету с помощью двухфакторной аутентификации (2FA), добавлять пользователей, настраивать роли и управлять доступами команды в Личном кабинете CloudPayments.\u003c/p>\u003ch2 id=\"section-2232e862-376f-4b66-b29b-2e139b526458\">\u003cstrong>Зачем нужны роли\u003c/strong>\u003c/h2>\u003cp>Роли помогают разграничить доступ между сотрудниками и настроить работу с кабинетом под задачи команды: бухгалтеру — отчеты и чеки, менеджеру — операции и статистику, техническому специалисту — сайты и интеграции.\u003c/p>\u003cp>Роли позволяют:\u003c/p>\u003cul>\u003cli>\u003cp>Ограничить доступ к финансовым и техническим данным\u003c/p>\u003c/li>\u003cli>\u003cp>Разделить ответственность между сотрудниками\u003c/p>\u003c/li>\u003cli>\u003cp>Снизить риск ошибок при работе в Личном кабинете\u003c/p>\u003c/li>\u003c/ul>\u003cp>В таблице ниже показано, какие разделы Личного кабинета доступны пользователям в зависимости от их роли. Это поможет понять, кому и какие права можно выдать при работе с CloudPayments.\u003c/p>\u003ch2 id=\"section-d180ea8d-af4c-4221-84e6-bcf03301f26a\">\u003cstrong>Доступ по ролям\u003c/strong>\u003c/h2>\u003cfigure style=\"text-align:center\">\u003cimg src=\"static/img/editor/148a8d9ffdd6ad13611ad54a7ecc8f7f591b04a251863221ca6e47c982da2d04.png\" alt=\"Снимок экрана — 2026-09-14 в 12.54.51.png\" style=\"width:100%;max-width:100%;height:auto\">\u003c/figure>\u003ch2 id=\"section-37c0e701-88a0-4700-8247-658f5f1cf441\">\u003cstrong>Двухфакторная аутентификация (2FA) — что это и зачем она нужна\u003c/strong>\u003c/h2>\u003cp>Двухфакторная аутентификация — это дополнительная защита аккаунта: после ввода пароля нужно подтвердить вход кодом из СМС.\u003cbr>\u003cbr>Сейчас такой способ защиты стал необходимостью — логин и пароль больше не гарантирует безопасность. Это критично, особенно когда аккаунт открывает доступ к управлению платежами и клиентской информацией — поэтому мы добавили второй уровень защиты ваших данных (2FA).\u003cbr>\u003cbr>\u003cstrong>Если вы и ваши сотрудники работаете в одном аккаунте, рекомендуем создать отдельные аккаунты для каждого.\u003c/strong> Это просто и займет минуту.\u003cbr>\u003cbr>Если этого не сделать, войти в аккаунт сможет только один человек, чей номер привязан к аккаунту.\u003c/p>\u003ch2 id=\"section-bbfec4cd-a983-4fde-8d27-21d7e48c66ad\">\u003cstrong>Как выдать доступ и добавить пользователя в Личном кабинете\u003c/strong>\u003c/h2>\u003cfigure style=\"text-align:center\">\u003cimg src=\"static/img/editor/f21ac363056cd66451b58f79c5bf70eae581d4c70e355cac6b96f81ace7dd27a.png\" alt=\"Снимок экрана — 2026-09-14 в 13.21.46.png\" style=\"width:100%;max-width:100%;height:auto\">\u003c/figure>\u003cp>\u003cu>\u003ca href=\"https://merchant.cloudpayments.ru/\" target=\"_blank\" rel=\"noopener noreferrer\">Личный кабинет →\u003c/a>\u003c/u> Пользователи → Добавить пользователя\u003c/p>\u003col start=\"1\">\u003cli>\u003cp>Заполните ФИО\u003c/p>\u003c/li>\u003cli>\u003cp>Выберите роль\u003c/p>\u003c/li>\u003cli>\u003cp>Определите доступ к сайтам\u003c/p>\u003c/li>\u003cli>\u003cp>Укажите e-mail — это обязательно! На указанный e-mail придет ссылка для авторизации сотрудника\u003c/p>\u003c/li>\u003c/ol>\u003cp>Подробная инструкция \u003cu>\u003ca href=\"https://static.cloudpayments.ru/docs/kak_sozdat_akkaunt_dlya_sotrudnika.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">по ссылке →\u003c/a>\u003c/u>\u003c/p>\u003ch2 id=\"мобильное-приложение\">Мобильное приложение\u003c/h2>\u003cfigure style=\"text-align:center\">\u003cimg src=\"static/img/editor/96d7112def3601f4826a867c780401e69a017c666237c703b436e74704db5a5f.png\" alt=\"Снимок экрана — 2026-09-14 в 15.35.04.png\" style=\"width:100%;max-width:100%;height:auto\">\u003c/figure>\u003cp>\u003cstrong>CloudPayments теперь в вашем телефоне\u003c/strong>\u003c/p>\u003cp>Мы запустили мобильное приложение для \u003cstrong>iOS и Android\u003c/strong>. Следите за бизнесом и управляйте ключевыми операциями из любой точки — даже когда компьютера нет рядом.\u003c/p>\u003cp>В приложении можно:\u003c/p>\u003cul>\u003cli>\u003cp>контролировать платежи, возвраты и заказы;\u003c/p>\u003c/li>\u003cli>\u003cp>просматривать данные по транзакциям;\u003c/p>\u003c/li>\u003cli>\u003cp>получать важные уведомления;\u003c/p>\u003c/li>\u003cli>\u003cp>быстро связываться с поддержкой.\u003c/p>\u003c/li>\u003c/ul>\u003cp>\u003cstrong>Все главное по бизнесу — всегда под рукой.\u003c/strong>\u003c/p>\u003cp>\u003cbr>\u003c/p>\u003cp style=\"text-align:center\">\u003cbr>\u003c/p>\u003c/div>","toc":[{"id":"что-такое-личный-кабинет","title":"Что такое личный кабинет","level":2},{"id":"section-92858179-e1ac-4b16-9013-912ce1db74f7","title":"Что можно делать в Личном кабинете","level":2},{"id":"section-e2e98d35-9d27-40ca-b29c-d2c9c9c95278","title":"Как начать работу в Личном кабинете","level":2},{"id":"section-7ccbb848-c34a-4211-a8a2-a4f977ef7426","title":"Как Личный кабинет помогает вашему бизнесу","level":2},{"id":"section-50bac298-053c-42e0-9ec1-39630e646138","title":"Увеличение продаж","level":3},{"id":"section-5975e931-8be0-4946-b43e-708428237284","title":"Увеличение конверсии","level":3},{"id":"section-0075b696-cc36-42f8-927b-3437d8ea52af","title":"Снижение нагрузки на команду","level":3},{"id":"section-0a0b726b-f318-4ca1-8657-c6f9534eefd6","title":"Роли и управление пользователями","level":2},{"id":"section-2232e862-376f-4b66-b29b-2e139b526458","title":"Зачем нужны роли","level":2},{"id":"section-d180ea8d-af4c-4221-84e6-bcf03301f26a","title":"Доступ по ролям","level":2},{"id":"section-37c0e701-88a0-4700-8247-658f5f1cf441","title":"Двухфакторная аутентификация (2FA) — что это и зачем она нужна","level":2},{"id":"section-bbfec4cd-a983-4fde-8d27-21d7e48c66ad","title":"Как выдать доступ и добавить пользователя в Личном кабинете","level":2},{"id":"мобильное-приложение","title":"Мобильное приложение","level":2}],"type":"page","audience":"business"},"solutions/compare":{"id":"solutions/compare","title":"Сравнение платежных интерфейсов","group":"solutions","html":"\u003cdiv class=\"imported-api\">\u003cp>\u003cbr>\u003c/p>\u003cfigure style=\"text-align:center\">\u003cimg src=\"static/img/editor/ee0dc971133905da245a203ee933414fd7103ece1f969391d506fe979c35987b.png\" alt=\"Снимок экрана — 2026-09-11 в 09.39.10.png\" style=\"width:94%;max-width:100%;height:auto\">\u003c/figure>\u003cdiv class=\"api-table-scroll\" tabindex=\"0\" aria-label=\"Таблица\">\u003ctable style=\"table-layout:fixed;width:1932px;min-width:0\">\u003ccolgroup>\u003ccol style=\"width:201px\">\u003ccol style=\"width:354px\">\u003ccol style=\"width:327px\">\u003ccol style=\"width:227px\">\u003ccol style=\"width:314px\">\u003ccol style=\"width:279px\">\u003ccol style=\"width:230px\">\u003c/colgroup>\u003ctr>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">\u003cbr>\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">Визуал \u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">\u003cstrong>Как работает\u003c/strong>\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">\u003cstrong>Для кого\u003c/strong>\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">\u003cstrong>Назначение\u003c/strong>\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">\u003cstrong>Вид\u003c/strong>\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">\u003cstrong>Встраиваемость  \u003c/strong>\u003c/p>\u003c/th>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">\u003cstrong>Виджет \u003c/strong>\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cfigure style=\"text-align:center\">\u003cimg src=\"static/img/editor/fd00be9784fceac139dd936f87626363cbb6b67c6a11b8384c52f62e6881b80d.png\" alt=\"Снимок экрана — 2026-09-11 в 10.49.50.png\" style=\"width:100%;max-width:100%;height:auto\">\u003c/figure>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">Встраивается на сайт и позволяет оплачивать товары на сайте\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">Для тех, у кого есть собственный сайт\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">Стандартный метод оплаты, который используется на сайтах\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">\u003cstrong>Форма на сайте\u003c/strong>\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">Iframe\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">\u003cstrong>Платежные блоки\u003c/strong>\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cfigure style=\"text-align:center\">\u003cimg src=\"static/img/editor/34fe86325c64eb981a898fc1e852e0acaf11da99171c859f5740e984a1ffddb6.png\" alt=\"Снимок экрана — 2026-09-11 в 10.32.39.png\" style=\"width:100%;max-width:100%;height:auto\">\u003c/figure>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">Встраивается в сайт и позволяет оплачивать товары на сайте\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">Для тех, у кого есть собственный сайт\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">Мерчантам, которым хочется кастомизировать форму оплаты, а так же тем, кто не хочет поднимать отдельную визуальную форму\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">\u003cstrong>Форма на сайте\u003c/strong>\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">Встроенная\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">\u003cstrong>Заказы\u003c/strong>\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cfigure style=\"text-align:center\">\u003cimg src=\"static/img/editor/89b773cad0a3dff755001f0f1a2de47589cb8914995b2f1df333fadcbc8287c1.png\" alt=\"Снимок экрана — 2026-09-11 в 10.50.07.png\" style=\"width:100%;max-width:100%;height:auto\">\u003c/figure>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">Создается отдельная ссылка, в которой указывается номер заказа.\u003c/p>\u003cp style=\"text-align:center\">Ссылка одноразовая\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">Для тех, кто персонально работает с клиентами\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">Используется для оплаты конкретных конечных заказов, когда у клиента нет возможности оплатить через виджет\u003c/p>\u003cp style=\"text-align:center\">Часто как способ оплаты при контакте менеджера с клиентом на звонке\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">Ссылка\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\"> Нет\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">\u003cstrong>Заказы, созданные на основе шаблонов\u003c/strong>\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003cbr>\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003cbr>\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">Для тех, кто персонально работает с клиентами и при этом есть стандартный набор товаров\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003cbr>\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">Ссылка\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">Нет\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">\u003cstrong>Платежные ссылки \u003c/strong>\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cfigure style=\"text-align:center\">\u003cimg src=\"static/img/editor/db41b5a9a53d38906b148e3da91547f9080173af61533194f14623008579784f.png\" alt=\"Снимок экрана — 2026-09-11 в 10.50.37.png\" style=\"width:100%;max-width:100%;height:auto\">\u003c/figure>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">Создается отдельная ссылка для оплаты.\u003c/p>\u003cp style=\"text-align:center\">Ссылка многоразовая\u003c/p>\u003cp style=\"text-align:left\">Имеет несколько видов:\u003c/p>\u003cul>\u003cli>\u003cp style=\"text-align:left\">Для бизнеса\u003c/p>\u003cul>\u003cli>\u003cp style=\"text-align:left\">с редактированием суммы\u003c/p>\u003c/li>\u003cli>\u003cp style=\"text-align:left\">без редактирования суммы\u003c/p>\u003c/li>\u003c/ul>\u003c/li>\u003cli>\u003cp style=\"text-align:left\">Для благотворительности \u003c/p>\u003c/li>\u003c/ul>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">Для тех, кому нужно предоставлять ссылки с конкретными наборами для клиентов\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">Используется для быстрой оплаты без необходимости наличия сайта\u003c/p>\u003cp style=\"text-align:center\">Может быть переиспользована многократно\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">Ссылка\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">Нет\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">\u003cstrong>Инфошоп\u003c/strong>\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cfigure style=\"text-align:center\">\u003cimg src=\"static/img/editor/97d67d3e76d3e032842b0ba5e6a5418707819e7081ebad5760033488fd3aec0d.png\" alt=\"Снимок экрана — 2026-09-11 в 10.33.58.png\" style=\"width:100%;max-width:100%;height:auto\">\u003c/figure>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">Создается отдельная ссылка для оплаты\u003c/p>\u003cp style=\"text-align:center\">Ссылка многоразовая\u003c/p>\u003cp style=\"text-align:center\">Позволяет выбрать один из товаров\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">Для тех, кому нужно давать клиенту выбор товара в момент оформления\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">Может быть переиспользована многократно\u003c/p>\u003cp style=\"text-align:center\">Используется для выбора товара и оплаты\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">Ссылка\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">Нет\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">\u003cstrong>WebSDK\u003c/strong>\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">\u003cbr>\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">Встраивается на вебе и позволяет оплачивать\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">Для тех, кому нужны персонализированные формы оплаты по любому из методов, при этом интеграция происходит на уровне фронта\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">Мерчантам, у которых есть свой UI\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">\u003cstrong>Форма на сайте\u003c/strong>\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">Любая\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">\u003cstrong>MobSDK\u003c/strong>\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cfigure style=\"text-align:center\">\u003cimg src=\"static/img/editor/9e05d8ddb0968c4f7d8e350e92673c155e88c420c08d614a12d486b4f1c77f07.png\" alt=\"Снимок экрана — 2026-09-11 в 10.33.39.png\" style=\"width:100%;max-width:100%;height:auto\">\u003c/figure>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">Встраивается в мобильное приложение и позволяет подгружать формы оплаты\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">Для тех, у кого есть мобильное приложение\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">Мерчантам с приложением\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">\u003cstrong>Форма в приложении\u003c/strong>\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">iframe\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">\u003cstrong>Оплата по криптограмме через API\u003c/strong>\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">\u003cbr>\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">Позволяет оплачивать через наше API при использовании формы мерчанта\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">Для тех, кому нужна персонализированная форма оплаты только по карте\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">Мерчантам, у которых есть свой UI\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">\u003cstrong>Форма на сайте\u003c/strong>\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">Любая\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cp>\u003cbr>\u003c/p>\u003c/div>","toc":[],"type":"page","audience":"business"},"solutions/widget":{"id":"solutions/widget","title":"Виджет","group":"solutions","html":"\u003cdiv class=\"imported-api\">\u003cp>Подходит для приема платежей на сайте без сложной интеграции.\u003c/p>\u003ch3 id=\"section-c4e52da7-edf3-4e26-b1d3-40f42f2660c8\">\u003cstrong>Описание функционала\u003c/strong>\u003c/h3>\u003cfigure style=\"text-align:center\">\u003cimg src=\"static/img/editor/143fcc0541354575510a90a8b9830910b4a757e62d624601bfd5aa2bfe2e8330.png\" alt=\"widgetdark.png\" style=\"width:100%;max-width:100%;height:auto\">\u003c/figure>\u003cp>Всплывающая форма, с помощью которой ваши клиенты могут оплачивать покупки онлайн удобным для себя способом.\u003c/p>\u003cul>\u003cli>\u003cp>Адаптация под все виды устройств: десктоп, планшет, мобильные устройства\u003c/p>\u003c/li>\u003cli>\u003cp>Безредиректный — в момент оплаты не уводит клиента с сайта, а открывается во всплывающем окне iframe\u003c/p>\u003c/li>\u003cli>\u003cp>Поддержка всех способов оплаты: российской банковской картой и иностранной, СБП, T-Pay, SberPay, Mir Pay, Долями, в рассрочку\u003c/p>\u003c/li>\u003cli>\u003cp>Форма автоматически определяет платежную систему и банк-эмитент карты, а также показывает их логотипы\u003c/p>\u003c/li>\u003cli>\u003cp>Поддержка подписок (рекуррентных платежей)\u003c/p>\u003c/li>\u003cli>\u003cp>Интеграция для работы с чеками\u003c/p>\u003c/li>\u003cli>\u003cp>Гибкая настройка интеграции\u003c/p>\u003c/li>\u003cli>\u003cp>Светлая и темная тема интерфейса\u003c/p>\u003c/li>\u003cli>\u003cp>Возможность скрыть определенные методы оплаты\u003c/p>\u003c/li>\u003c/ul>\u003ch3 id=\"section-9785814b-0940-46e1-a225-7825aedf699f\">\u003cstrong>Безопасность\u003c/strong>\u003c/h3>\u003cp>Все платежи проходят безопасно — каждая оплата защищена по стандарту PCI DSS на стороне CloudPayments.\u003c/p>\u003cp>\u003cbr>\u003c/p>\u003cdiv style=\"text-align:center;margin:24px 0\">\u003ca href=\"https://widget.cloudpayments.ru/app/demo\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;background:#326dff;color:#fff;text-decoration:none;border-radius:12px;padding:12px 20px;max-width:100%;width:250px;min-height:56px;font-size:18px;font-weight:600\">Демо-конструктор \u003c/a>\u003c/div>\u003cp>\u003cbr>\u003c/p>\u003c/div>","toc":[{"id":"section-c4e52da7-edf3-4e26-b1d3-40f42f2660c8","title":"Описание функционала","level":3},{"id":"section-9785814b-0940-46e1-a225-7825aedf699f","title":"Безопасность","level":3}],"type":"page","audience":"business"},"solutions/blocks":{"id":"solutions/blocks","title":"Платежные блоки","group":"solutions","html":"\u003cdiv class=\"imported-api\">\u003cp>Подходит для приема платежей на сайте с возможностью кастомизировать форму оплаты без сложной интеграции и прохождения \u003cu>\u003ca href=\"https://developers.cloudpayments.ru/\" target=\"_blank\" rel=\"noopener noreferrer\">ASV-сканирования\u003c/a>\u003c/u>.\u003c/p>\u003cfigure style=\"text-align:center\">\u003cimg src=\"static/img/editor/32132f8446710c64c173d70fd4b26c93807cb3b2c450b8d39991a8071b5e1fe5.png\" alt=\"Снимок экрана — 2026-09-11 в 17.12.20.png\" style=\"width:100%;max-width:100%;height:auto\">\u003c/figure>\u003ch3 id=\"section-d54eedb7-8b1f-439b-8388-4d48ba71516a\">\u003cstrong>Описание функционала\u003c/strong>\u003c/h3>\u003cp>Из блоков конструктора можно собрать собственную платежную форму с гибкой настройкой цвета, текстового наполнения и способов оплаты. Форма встраивается в сайт и выглядит его частью — клиент остается на странице магазина.\u003c/p>\u003cul>\u003cli>\u003cp>Легко интегрировать на сайт без привлечения ИТ-специалистов\u003c/p>\u003c/li>\u003cli>\u003cp>Поддержка всех способов оплаты: российской банковской картой и иностранной, СБП, T-Pay, SberPay, Mir Pay, Долями, в рассрочку\u003c/p>\u003c/li>\u003cli>\u003cp>Возможности кастомизации: изменение надписей, размера шрифта, цвета кнопок, фона и текста, скругления углов формы\u003c/p>\u003c/li>\u003cli>\u003cp>Адаптация под все виды устройств: десктоп, планшет, мобильные устройства\u003c/p>\u003c/li>\u003cli>\u003cp>Форма автоматически определяет платежную систему и банк-эмитент карты, а также показывает их логотипы\u003c/p>\u003c/li>\u003c/ul>\u003ch3 id=\"section-fb586524-831b-42d1-a671-bbe09ca1ea95\">\u003cstrong>Безопасность\u003c/strong>\u003c/h3>\u003cp>Платежные данные клиента шифруются в браузере, каждая оплата защищена по стандарту PCI DSS на стороне CloudPayments — не требуется проводить \u003cu>\u003ca href=\"https://developers.cloudpayments.ru/\" target=\"_blank\" rel=\"noopener noreferrer\">ASV-сканирование\u003c/a>\u003c/u>\u003c/p>\u003c/div>","toc":[{"id":"section-d54eedb7-8b1f-439b-8388-4d48ba71516a","title":"Описание функционала","level":3},{"id":"section-fb586524-831b-42d1-a671-bbe09ca1ea95","title":"Безопасность","level":3}],"type":"page","audience":"business"},"solutions/checkout":{"id":"solutions/checkout","title":"Скрипт check-out","group":"solutions","html":"","toc":[],"type":"page","audience":"business"},"solutions/orders":{"id":"solutions/orders","title":"Одноразовые ссылки","group":"solutions","html":"\u003cdiv class=\"imported-api\">\u003cp>Подходят для приема платежей без сайта. При переходе по ссылке клиенту открывается форма для оплаты.\u003c/p>\u003cfigure style=\"text-align:center\">\u003cimg src=\"static/img/editor/ac81898eb4925fb98c2faaf90a7b429a2f868150d202a6d940cd6678c9bc4bbc.png\" alt=\"Снимок экрана — 2026-09-14 в 16.07.42.png\" style=\"width:100%;max-width:100%;height:auto\">\u003c/figure>\u003ch3 id=\"section-ce583f70-19a4-4e17-a988-0e674180cc40\">\u003cstrong>Описание функционала\u003c/strong>\u003c/h3>\u003cp>Заказы — это прием платежей по одноразовым платежным ссылкам, они предназначены для конкретного клиента (заказа)\u003c/p>\u003cul>\u003cli>\u003cp>Автоматическая отправка ссылки на заказ клиенту по СМС и e-mail\u003c/p>\u003c/li>\u003cli>\u003cp>Использование шаблона, который нужно настроить всего один раз — после этого все формы заполняются автоматически, останется только ввести данные нового плательщика\u003c/p>\u003c/li>\u003cli>\u003cp>Поддержка подписок (рекуррентных платежей)\u003c/p>\u003c/li>\u003cli>\u003cp>Интеграция для работы с чеками\u003c/p>\u003c/li>\u003cli>\u003cp>Ограниченное время действия ссылки на оплату\u003c/p>\u003c/li>\u003cli>\u003cp>Приоритизация и скрытие платежных методов\u003c/p>\u003c/li>\u003cli>\u003cp>Возможность формировать заказы автоматически — через API\u003c/p>\u003c/li>\u003cli>\u003cp>Возможность получать информацию по заказам через API\u003c/p>\u003c/li>\u003c/ul>\u003cp>\u003cbr>\u003c/p>\u003c/div>","toc":[{"id":"section-ce583f70-19a4-4e17-a988-0e674180cc40","title":"Описание функционала","level":3}],"type":"page","audience":"business"},"solutions/links":{"id":"solutions/links","title":"Многоразовые ссылки","group":"solutions","html":"","toc":[],"type":"page","audience":"business"},"solutions/charity":{"id":"solutions/charity","title":"Благотворительность","group":"solutions","html":"","toc":[],"type":"page","audience":"business"},"solutions/infoshop":{"id":"solutions/infoshop","title":"Инфошоп","group":"solutions","html":"\u003cdiv class=\"imported-api\">\u003cp>\u003cbr>\u003c/p>\u003c/div>","toc":[],"type":"page","audience":"business"},"solutions/sdk":{"id":"solutions/sdk","title":"Мобильные SDK","group":"solutions","html":"","toc":[],"type":"page","audience":"business"},"solutions/api":{"id":"solutions/api","title":"API","group":"solutions","html":"","toc":[],"type":"page","audience":"business"},"methods/card":{"id":"methods/card","title":"Банковская карта","group":"methods","html":"\u003cdiv class=\"imported-api\">\u003cp>Банковские карты — один из самых популярных способов онлайн-оплаты. Покупатели могут оплачивать заказы на вашем сайте, в приложении или в социальных сетях картами Мир, Visa, Mastercard, выпущенными в России \u003cu>\u003ca href=\"https://cloudpayments.ru/help/payments/payment-methods#foreigncards\" target=\"_blank\" rel=\"noopener noreferrer\">и других странах\u003c/a>\u003c/u>.\u003c/p>\u003cfigure style=\"text-align:center\">\u003cimg src=\"static/img/editor/19a35218db0c271ece218bb1d6464017ee0bf122ed1361bf30cd273054fba846.png\" alt=\"Снимок экрана — 2026-09-14 в 10.28.28.png\" style=\"width:100%;max-width:100%;height:auto\">\u003c/figure>\u003ch3 id=\"section-72de9a44-3891-451c-b918-af990fae33a8\">\u003cstrong>Как включить оплату банковскими картами\u003c/strong>\u003c/h3>\u003cp>Платежный метод \u003cstrong>подключается по умолчанию\u003c/strong> после того, как вы:\u003c/p>\u003col start=\"1\">\u003cli>\u003cp>Создали (добавили) сайт в Личный кабинет CloudPayments\u003c/p>\u003c/li>\u003cli>\u003cp>Перевели сайт в боевой режим с помощью менеджера — то есть начали принимать реальные платежи\u003c/p>\u003c/li>\u003c/ol>\u003cp>До перевода в боевой режим доступен тестовый режим: можно настроить интеграцию, протестировать оплату и убедиться, что все работает корректно.\u003c/p>\u003ch2 id=\"section-3c7578e0-dea6-4d4f-b61a-64fa8864093c\">\u003cstrong>Варианты интеграции\u003c/strong>\u003c/h2>\u003cp>Оплата банковскими картами поддерживается во всех вариантах интеграции CloudPayments:\u003c/p>\u003cul>\u003cli>\u003cp>Виджет на сайте\u003c/p>\u003c/li>\u003cli>\u003cp>Платежные ссылки и заказы\u003c/p>\u003c/li>\u003cli>\u003cp>Интеграция по API\u003c/p>\u003c/li>\u003cli>\u003cp>Мобильное приложение через SDK для Android или iOS\u003c/p>\u003c/li>\u003cli>\u003cp>Платежные блоки\u003c/p>\u003c/li>\u003cli>\u003cp>CloudИнфошоп\u003c/p>\u003c/li>\u003c/ul>\u003cp>Платежная форма отображает способ оплаты «Банковская карта» по умолчанию — никаких дополнительных настроек не требуется.\u003c/p>\u003c/div>","toc":[{"id":"section-72de9a44-3891-451c-b918-af990fae33a8","title":"Как включить оплату банковскими картами","level":3},{"id":"section-3c7578e0-dea6-4d4f-b61a-64fa8864093c","title":"Варианты интеграции","level":2}],"type":"page","audience":"business"},"methods/tpay":{"id":"methods/tpay","title":"T-Pay","group":"methods","html":"\u003cdiv class=\"imported-api\">\u003cp>Оплата в один клик без ввода данных карты через приложение Т‑Банка.\u003c/p>\u003cfigure style=\"text-align:center\">\u003cimg src=\"static/img/editor/9390bd4f340bb5521e828e0db6942badb490f0c0c21154839f0d2946cea91f0e.png\" alt=\"tpay.png\" style=\"width:100%;max-width:100%;height:auto\">\u003c/figure>\u003ch3 id=\"section-d71aa001-4f80-4ef2-a12d-3a718e51ab24\">\u003cstrong>Как подключить T-Pay в платежной форме\u003c/strong>\u003c/h3>\u003cp>При подключении к CloudPayments настройка T-Pay производится по умолчанию — дополнительные действия не требуются.\u003c/p>\u003ch3 id=\"section-e0dcb9f5-d6b8-4e6c-aab2-e1e8511fd29e\">\u003cstrong>Как включить T-Pay в платежной форме\u003c/strong>\u003c/h3>\u003cp>\u003cu>\u003ca href=\"https://merchant.cloudpayments.ru/\" target=\"_blank\" rel=\"noopener noreferrer\">В Личном кабинете CloudPayments →\u003c/a>\u003c/u> раздел Сайты\u003c/p>\u003ch3 id=\"section-df64500f-69b0-4429-90d3-db3e6062e33d\">\u003cstrong>Варианты интеграции платежной формы\u003c/strong>\u003c/h3>\u003cul>\u003cli>\u003cp>Виджет\u003c/p>\u003c/li>\u003cli>\u003cp>Платежные ссылки и заказы\u003c/p>\u003c/li>\u003cli>\u003cp>По API\u003c/p>\u003c/li>\u003cli>\u003cp>В мобильном приложении через мобильный SDK для Android или iOS\u003c/p>\u003c/li>\u003cli>\u003cp>Платежные блоки\u003c/p>\u003c/li>\u003cli>\u003cp>CloudИнфошоп\u003c/p>\u003c/li>\u003c/ul>\u003cp>\u003cbr>\u003c/p>\u003c/div>","toc":[{"id":"section-d71aa001-4f80-4ef2-a12d-3a718e51ab24","title":"Как подключить T-Pay в платежной форме","level":3},{"id":"section-e0dcb9f5-d6b8-4e6c-aab2-e1e8511fd29e","title":"Как включить T-Pay в платежной форме","level":3},{"id":"section-df64500f-69b0-4429-90d3-db3e6062e33d","title":"Варианты интеграции платежной формы","level":3}],"type":"page","audience":"business"},"methods/sberpay":{"id":"methods/sberpay","title":"СберПэй","group":"methods","html":"\u003cdiv class=\"imported-api\">\u003cp>Оплата в один клик без ввода данных карты через приложение СберБанка.\u003c/p>\u003cfigure style=\"text-align:center\">\u003cimg src=\"static/img/editor/b4a7c45430e3a369c46c6a966f104fa46328ebbe18b335ac60a24a8b18286259.png\" alt=\"sberpay.png\" style=\"width:100%;max-width:100%;height:auto\">\u003c/figure>\u003ch3 id=\"section-3fabb72b-3b1c-413a-8325-f58522a77f48\">\u003cstrong>Как подключить SberPay в платежной форме\u003c/strong>\u003c/h3>\u003cp>При подключении к CloudPayments настройка SberPay производится по запросу в поддержку — для настройки оправьте в чат ИНН своей организации.\u003c/p>\u003ch3 id=\"section-46389b21-5b96-4531-8e56-ac2ac46e71da\">\u003cstrong>Как включить SberPay в платежной форме\u003c/strong>\u003c/h3>\u003cp>\u003cu>\u003ca href=\"https://merchant.cloudpayments.ru/\" target=\"_blank\" rel=\"noopener noreferrer\">В Личном кабинете CloudPayments →\u003c/a>\u003c/u> раздел Сайты\u003c/p>\u003ch3 id=\"section-62b43913-4fdb-429f-8ff1-45e10e351a91\">\u003cstrong>Варианты интеграции платежной формы\u003c/strong>\u003c/h3>\u003cul>\u003cli>\u003cp>Виджет\u003c/p>\u003c/li>\u003cli>\u003cp>Платежные ссылки и заказы\u003c/p>\u003c/li>\u003cli>\u003cp>По API\u003c/p>\u003c/li>\u003cli>\u003cp>В мобильном приложении через мобильный SDK для Android или iOS\u003c/p>\u003c/li>\u003cli>\u003cp>Платежные блоки\u003c/p>\u003c/li>\u003cli>\u003cp>CloudИнфошоп\u003c/p>\u003c/li>\u003c/ul>\u003cp>\u003cbr>\u003c/p>\u003c/div>","toc":[{"id":"section-3fabb72b-3b1c-413a-8325-f58522a77f48","title":"Как подключить SberPay в платежной форме","level":3},{"id":"section-46389b21-5b96-4531-8e56-ac2ac46e71da","title":"Как включить SberPay в платежной форме","level":3},{"id":"section-62b43913-4fdb-429f-8ff1-45e10e351a91","title":"Варианты интеграции платежной формы","level":3}],"type":"page","audience":"business"},"methods/mirpay":{"id":"methods/mirpay","title":"МирПэй","group":"methods","html":"\u003cdiv class=\"imported-api\">\u003cp>Оплата в один клик без ввода данных карты через приложение Mir.\u003c/p>\u003cfigure style=\"text-align:center\">\u003cimg src=\"static/img/editor/4b106281b72b8d9c3f853956b2a247a84eb727045225ad8c606a981829055319.png\" alt=\"mirpay.png\" style=\"width:100%;max-width:100%;height:auto\">\u003c/figure>\u003ch3 id=\"section-d1bd9fcf-6209-4cbb-a7ae-be256d84201d\">\u003cstrong>Как подключить Mir Pay в платежной форме\u003c/strong>\u003c/h3>\u003cp>При подключении к CloudPayments настройка Mir Pay производится по умолчанию — дополнительные действия не требуются.\u003c/p>\u003ch3 id=\"section-91048f1a-b1b7-4bd4-bc9f-dbf3f2c69e74\">\u003cstrong>Как включить Mir Pay в платежной форме\u003c/strong>\u003c/h3>\u003cp>\u003cu>\u003ca href=\"https://merchant.cloudpayments.ru/\" target=\"_blank\" rel=\"noopener noreferrer\">В Личном кабинете CloudPayments →\u003c/a>\u003c/u> раздел Сайты\u003c/p>\u003ch3 id=\"section-892c02a0-4a92-4195-8cda-d65eb9d07bbd\">\u003cstrong>Варианты интеграции платежной формы\u003c/strong>\u003c/h3>\u003cul>\u003cli>\u003cp>Виджет\u003c/p>\u003c/li>\u003cli>\u003cp>Платежные ссылки и заказы\u003c/p>\u003c/li>\u003cli>\u003cp>В мобильном приложении через мобильный SDK для Android или iOS\u003c/p>\u003c/li>\u003cli>\u003cp>Платежные блоки\u003c/p>\u003c/li>\u003cli>\u003cp>CloudИнфошоп\u003c/p>\u003c/li>\u003c/ul>\u003cp>\u003cbr>\u003c/p>\u003c/div>","toc":[{"id":"section-d1bd9fcf-6209-4cbb-a7ae-be256d84201d","title":"Как подключить Mir Pay в платежной форме","level":3},{"id":"section-91048f1a-b1b7-4bd4-bc9f-dbf3f2c69e74","title":"Как включить Mir Pay в платежной форме","level":3},{"id":"section-892c02a0-4a92-4195-8cda-d65eb9d07bbd","title":"Варианты интеграции платежной формы","level":3}],"type":"page","audience":"business"},"methods/sbp":{"id":"methods/sbp","title":"СБП","group":"methods","html":"\u003cdiv class=\"imported-api\">\u003cp>Оплата в один клик без ввода данных карты. Покупатель выбирает банк и подтверждает оплату в мобильном приложении банка. В десктопной версии оплата производится по QR-коду с подтверждением в мобильном банке.\u003c/p>\u003cfigure style=\"text-align:center\">\u003cimg src=\"static/img/editor/5dfbc8d62aed89191399a4f9e66b398cc4d120399f512bb9b9c0d3e34d2b07e4.png\" alt=\"сбп.png\" style=\"width:100%;max-width:100%;height:auto\">\u003c/figure>\u003ch3 id=\"section-ce455053-3d8c-4506-b5e1-9a45ae93375b\">\u003cstrong>Как подключить СБП в платежной форме\u003c/strong>\u003c/h3>\u003cp>При подключении к CloudPayments настройка СБП производится по запросу \u003cu>\u003ca href=\"https://t.me/cloudassistant_bot\" target=\"_blank\" rel=\"noopener noreferrer\">в tg-боте\u003c/a>\u003c/u> — для настройки оправьте в чат ИНН своей организации.\u003c/p>\u003ch3 id=\"section-a66b94ef-377d-4ef4-8b17-295c5ed0e8dc\">\u003cstrong>Как включить СБП в платежной форме\u003c/strong>\u003c/h3>\u003cp>\u003cu>\u003ca href=\"https://merchant.cloudpayments.ru/\" target=\"_blank\" rel=\"noopener noreferrer\">В Личном кабинете CloudPayments →\u003c/a>\u003c/u> раздел Сайты\u003c/p>\u003ch3 id=\"section-a3775574-2852-47e8-8228-754d4d880e76\">\u003cstrong>Варианты интеграции платежной формы\u003c/strong>\u003c/h3>\u003cul>\u003cli>\u003cp>Виджет\u003c/p>\u003c/li>\u003cli>\u003cp>Платежные ссылки и заказы\u003c/p>\u003c/li>\u003cli>\u003cp>По API\u003c/p>\u003c/li>\u003cli>\u003cp>В мобильном приложении через мобильный SDK для Android или iOS\u003c/p>\u003c/li>\u003cli>\u003cp>Платежные блоки\u003c/p>\u003c/li>\u003cli>\u003cp>CloudИнфошоп\u003c/p>\u003c/li>\u003c/ul>\u003cp>\u003cbr>\u003c/p>\u003c/div>","toc":[{"id":"section-ce455053-3d8c-4506-b5e1-9a45ae93375b","title":"Как подключить СБП в платежной форме","level":3},{"id":"section-a66b94ef-377d-4ef4-8b17-295c5ed0e8dc","title":"Как включить СБП в платежной форме","level":3},{"id":"section-a3775574-2852-47e8-8228-754d4d880e76","title":"Варианты интеграции платежной формы","level":3}],"type":"page","audience":"business"},"methods/dolyami":{"id":"methods/dolyami","title":"Долями","group":"methods","html":"\u003cdiv class=\"imported-api\">\u003cp>Сервис для оплаты частями в четыре платежа без процентов и переплат.\u003c/p>\u003cfigure style=\"text-align:center\">\u003cimg src=\"static/img/editor/6af0d25e5374b7120c5d38cf6f927b27821140f74a0bef0e13b7e3c0f4aae2ec.png\" alt=\"dolyami.png\" style=\"width:100%;max-width:100%;height:auto\">\u003c/figure>\u003ch3 id=\"section-5a2475c0-8453-41cf-a2c9-d46b4ed9647a\">\u003cstrong>Как подключить Долями в платежной форме\u003c/strong>\u003c/h3>\u003cp>При подключении к CloudPayments настройка Долями производится по запросу \u003cu>\u003ca href=\"https://t.me/cloudassistant_bot\" target=\"_blank\" rel=\"noopener noreferrer\">в tg-боте\u003c/a>\u003c/u> — для настройки оправьте в чат ИНН своей организации.\u003c/p>\u003ch3 id=\"section-36057da1-562d-4802-8826-c06aa9f6282a\">\u003cstrong>Как включить Долями в платежной форме\u003c/strong>\u003c/h3>\u003cp>\u003cu>\u003ca href=\"https://merchant.cloudpayments.ru/\" target=\"_blank\" rel=\"noopener noreferrer\">В Личном кабинете CloudPayments →\u003c/a>\u003c/u> раздел Сайты\u003c/p>\u003ch3 id=\"section-863da87c-c555-4301-b530-1d810cd091d5\">\u003cstrong>Варианты интеграции платежной формы\u003c/strong>\u003c/h3>\u003cul>\u003cli>\u003cp>Виджет\u003c/p>\u003c/li>\u003cli>\u003cp>Платежные ссылки и заказы\u003c/p>\u003c/li>\u003cli>\u003cp>По API\u003c/p>\u003c/li>\u003cli>\u003cp>Платежные блоки\u003c/p>\u003c/li>\u003cli>\u003cp>CloudИнфошоп\u003c/p>\u003c/li>\u003c/ul>\u003cp>\u003cbr>\u003c/p>\u003c/div>","toc":[{"id":"section-5a2475c0-8453-41cf-a2c9-d46b4ed9647a","title":"Как подключить Долями в платежной форме","level":3},{"id":"section-36057da1-562d-4802-8826-c06aa9f6282a","title":"Как включить Долями в платежной форме","level":3},{"id":"section-863da87c-c555-4301-b530-1d810cd091d5","title":"Варианты интеграции платежной формы","level":3}],"type":"page","audience":"business"},"methods/installments":{"id":"methods/installments","title":"Рассрочка","group":"methods","html":"\u003cdiv class=\"imported-api\">\u003cp>Это возможность получать оплату за товары или услуги частями, при этом бизнес сразу получает всю сумму покупки, а клиент выплачивает ее поэтапно.\u003c/p>\u003cfigure style=\"text-align:center\">\u003cimg src=\"static/img/editor/e7f5de5cf03fb6aa6789c029e73e6dc25bb2151d060b4edf6745eff08eb74aec.png\" alt=\"Снимок экрана — 2026-09-14 в 16.43.35.png\" style=\"width:71%;max-width:100%;height:auto\">\u003c/figure>\u003ch3 id=\"section-853c166d-0c18-4fc3-9d12-9fc7cd2d06f6\">\u003cstrong>Как подключить рассрочку в платежной форме\u003c/strong>\u003c/h3>\u003cp>При подключении к CloudPayments настройка рассрочки производится по запросу \u003cu>\u003ca href=\"https://t.me/cloudassistant_bot\" target=\"_blank\" rel=\"noopener noreferrer\">в tg-боте\u003c/a>\u003c/u> — для настройки оправьте в чат ИНН своей организации.\u003c/p>\u003ch3 id=\"section-de3a8561-9e13-446e-84b1-f5efc943a9db\">\u003cstrong>Как включить рассрочку в платежной форме\u003c/strong>\u003c/h3>\u003cp>\u003cu>\u003ca href=\"https://merchant.cloudpayments.ru/\" target=\"_blank\" rel=\"noopener noreferrer\">В Личном кабинете CloudPayments →\u003c/a>\u003c/u> раздел Сайты\u003c/p>\u003ch3 id=\"section-ddccac6d-0d9b-4082-9a6e-906c630f4d98\">\u003cstrong>Варианты интеграции платежной формы\u003c/strong>\u003c/h3>\u003cul>\u003cli>\u003cp>Виджет\u003c/p>\u003c/li>\u003cli>\u003cp>Платежные ссылки и заказы\u003c/p>\u003c/li>\u003cli>\u003cp>Отдельной кнопкой через WebSDK\u003c/p>\u003c/li>\u003cli>\u003cp>Платежные блоки\u003c/p>\u003c/li>\u003cli>\u003cp>CloudИнфошоп\u003c/p>\u003c/li>\u003c/ul>\u003cp>\u003cbr>\u003c/p>\u003c/div>","toc":[{"id":"section-853c166d-0c18-4fc3-9d12-9fc7cd2d06f6","title":"Как подключить рассрочку в платежной форме","level":3},{"id":"section-de3a8561-9e13-446e-84b1-f5efc943a9db","title":"Как включить рассрочку в платежной форме","level":3},{"id":"section-ddccac6d-0d9b-4082-9a6e-906c630f4d98","title":"Варианты интеграции платежной формы","level":3}],"type":"page","audience":"business"},"methods/foreign":{"id":"methods/foreign","title":"Иностранные карты","group":"methods","html":"\u003cdiv class=\"imported-api\">\u003cp>Прием оплат с зарубежных банковских карт в иностранной валюте\u003c/p>\u003cfigure style=\"text-align:center\">\u003cimg src=\"static/img/editor/238e282355e9b72e4d98d5bf51f67f483c1bc8bd4483f5d3302f87e42cc7ccbe.png\" alt=\"Снимок экрана — 2026-09-14 в 16.54.24.png\" style=\"width:90%;max-width:100%;height:auto\">\u003c/figure>\u003ch3 id=\"section-17b9473f-d5b8-49c1-b87d-b002f86c6e8e\">\u003cstrong>Как подключить прием иностранных карт в платежной форме\u003c/strong>\u003c/h3>\u003cp>При подключении к CloudPayments настройка приема иностранных карт производится по запросу \u003cu>\u003ca href=\"https://t.me/cloudassistant_bot\" target=\"_blank\" rel=\"noopener noreferrer\">в tg-боте\u003c/a>\u003c/u> — для настройки оправьте в чат ИНН своей организации.\u003c/p>\u003ch3 id=\"section-16f54d0e-b73c-47ce-a033-44d1ce3eb821\">\u003cstrong>Как включить прием иностранных карт в платежной форме\u003c/strong>\u003c/h3>\u003cp>После подключения способ оплаты активируется автоматически\u003c/p>\u003ch3 id=\"section-1699ba11-3122-491f-9882-c19b38184cc3\">\u003cstrong>Варианты интеграции платежной формы\u003c/strong>\u003c/h3>\u003cul>\u003cli>\u003cp>Виджет\u003c/p>\u003c/li>\u003cli>\u003cp>Платежные ссылки и заказы\u003c/p>\u003c/li>\u003cli>\u003cp>По API\u003c/p>\u003c/li>\u003cli>\u003cp>В мобильном приложении через мобильный SDK для Android или iOS\u003c/p>\u003c/li>\u003cli>\u003cp>Платежные блоки\u003c/p>\u003c/li>\u003cli>\u003cp>CloudИнфошоп\u003c/p>\u003c/li>\u003c/ul>\u003cp>\u003cbr>\u003c/p>\u003c/div>","toc":[{"id":"section-17b9473f-d5b8-49c1-b87d-b002f86c6e8e","title":"Как подключить прием иностранных карт в платежной форме","level":3},{"id":"section-16f54d0e-b73c-47ce-a033-44d1ce3eb821","title":"Как включить прием иностранных карт в платежной форме","level":3},{"id":"section-1699ba11-3122-491f-9882-c19b38184cc3","title":"Варианты интеграции платежной формы","level":3}],"type":"page","audience":"business"},"methods/digital":{"id":"methods/digital","title":"Цифровой рубль","group":"methods","html":"","toc":[],"type":"page","audience":"business"},"scenarios/recurrent":{"id":"scenarios/recurrent","title":"Рекурренты","group":"scenarios","html":"\u003cdiv class=\"imported-api\">\u003cp>Рекуррентные платежи, также известные как платежи по подписке или «автоплатежи» — возможность выполнять регулярные списания денег с банковской карты покупателя без повторного ввода реквизитов карты и без участия плательщика для инициации очередного платежа.\u003c/p>\u003cp>Рекуррентные платежи всегда начинаются с первого, установочного платежа, для выполнения которого плательщик должен ввести реквизиты своей карты. Для последующих регулярных платежей обязательно нужно ознакомить держателя карты с графиком и получить его согласие на безакцептное списание.\u003c/p>\u003cp>Есть распространенное мнение, что задача рекуррентного биллинга сводится к тому, чтобы установить сумму, которая будет каждый месяц списываться с карты клиента. Выбор системы регулярных платежей при этом основан только на стоимости предоставляемых услуг. В действительности — ситуация более сложная, потому как для качественного сервиса требуется намного больше функций и возможностей. Мы сделали все, чтобы в системе CloudPayments процедура запуска и обработки рекуррентных платежей стала максимально простой и гибкой.\u003c/p>\u003ch2 id=\"zapusk-i-ostanovka-regulyarnyh-platezhey\">\u003cstrong>Запуск и остановка регулярных платежей\u003c/strong>\u003c/h2>\u003cp>Запуск рекуррентных платежей возможен в любое время после выполнения установочного платежа: в тот же момент, через неделю или через месяц. Ограничение только одно - интервал между регулярными платежами, а также между установочным и первым регулярным платежом не может превышать один год.\u003c/p>\u003cp>\u003cem>Пример:\u003c/em> покупатель оплачивает первый месяц предоставления услуг через установочный платеж и дает согласие на ежемесячное списание с его карты начиная со второго месяца.\u003cbr>Запуск регулярных платежей может быть выполнен через \u003ca href=\"https://developers.cloudpayments.ru/#sozdanie-podpiski-na-rekurrentnye-platezhi\" target=\"_blank\" rel=\"noopener noreferrer\">API\u003c/a> или \u003ca href=\"https://developers.cloudpayments.ru/#platezhnyy-vidzhet\" target=\"_blank\" rel=\"noopener noreferrer\">платежный виджет\u003c/a>.\u003c/p>\u003cp>Если покупатель отказывается от дальнейших платежей, вы можете отменить подписку в любой момент:\u003c/p>\u003cul>\u003cli>\u003cp>из \u003ca href=\"https://merchant.cloudpayments.ru/login\" target=\"_blank\" rel=\"noopener noreferrer\">личного кабинета\u003c/a>;\u003c/p>\u003c/li>\u003cli>\u003cp>через \u003ca href=\"https://developers.cloudpayments.ru/#otmena-podpiski-na-rekurrentnye-platezhi\" target=\"_blank\" rel=\"noopener noreferrer\">API\u003c/a>.\u003c/p>\u003c/li>\u003c/ul>\u003cp>Также плательщик может самостоятельно найти и отменить свои регулярные платежи на \u003ca href=\"https://my.cloudpayments.ru/ru/unsubscribe\" target=\"_blank\" rel=\"noopener noreferrer\">сайте системы CloudPayments\u003c/a>.\u003c/p>\u003ch2 id=\"vozmozhnost-nastroyki-grafika-platezhey\">\u003cstrong>Возможность настройки графика платежей\u003c/strong>\u003c/h2>\u003ch3 id=\"vybor-perioda-i-intervala-spisaniya\">\u003cstrong>Выбор периода и интервала списания\u003c/strong>\u003c/h3>\u003cp>Система может выполнять регулярные платежи каждые 2 недели, 1 раз в месяц, каждые 3 месяца и так далее: вы можете указать любой период.\u003c/p>\u003ch3 id=\"vybor-daty-nachala-spisaniy\">\u003cstrong>Выбор даты начала списаний\u003c/strong>\u003c/h3>\u003cp>Рекуррентные платежи могут быть запущены сразу при создании подписки, либо с отсрочкой.\u003c/p>\u003cp>\u003cem>Пример:\u003c/em> покупатель подписывается на вашу услугу в середине месяца, вы создаете план ежемесячных рекуррентных платежей начиная со следующего месяца по 15-м числам.\u003c/p>\u003ch3 id=\"ogranichenie-na-kolichestvo-platezhey\">\u003cstrong>Ограничение на количество платежей\u003c/strong>\u003c/h3>\u003cp>Можно указать максимальное количество платежей в подписке или создать план без ограничений. В первом случае рекуррентные платежи будут автоматически остановлены после исполнения всех платежей в графике.\u003c/p>\u003cp>\u003cem>Пример:\u003c/em> покупатель приобретает товар стоимостью 12 000 рублей в рассрочку на год — оплачивает 1000 рублей установочным платежом и подписывается на план рекуррентных платежей по 1000 рублей ежемесячно, но не более 11 списаний.\u003c/p>\u003ch3 id=\"zamorozka-plana\">\u003cstrong>Заморозка плана\u003c/strong>\u003c/h3>\u003cp>Подписку на регулярные платежи можно приостановить на любой срок из личного кабинета или с помощью \u003ca href=\"https://developers.cloudpayments.ru/#izmenenie-podpiski-na-rekurrentnye-platezhi\" target=\"_blank\" rel=\"noopener noreferrer\">API\u003c/a>.\u003c/p>\u003cp>\u003cem>Пример:\u003c/em> покупатель просит приостановить предоставление услуг на пару месяцев, вы сдвигаете дату следующего платежа на соответствующий срок.\u003c/p>\u003ch2 id=\"vozmozhnost-smeny-summy-platezha\">\u003cstrong>Возможность смены суммы платежа\u003c/strong>\u003c/h2>\u003ch3 id=\"summa-ustanovochnogo-platezha\">\u003cstrong>Сумма установочного платежа\u003c/strong>\u003c/h3>\u003cp>Сумма первого установочного платежа может быть произвольной и отличаться от суммы последующих рекуррентных платежей.\u003c/p>\u003cp>\u003cem>Пример:\u003c/em> покупатель регистрируется в вашем сервисе, вы просите его выполнить установочный платеж на 1 рубль для проверки карты. Далее, с согласия пользователя, запускаете рекуррентные платежи на любую сумму.\u003c/p>\u003ch3 id=\"summa-rekurrentnyh-platezhey\">\u003cstrong>Сумма рекуррентных платежей\u003c/strong>\u003c/h3>\u003cp>Сумму рекуррентных платежей можно изменять в любой момент действия плана из \u003ca href=\"https://merchant.cloudpayments.ru/login\" target=\"_blank\" rel=\"noopener noreferrer\">личного кабинета\u003c/a> или с помощью \u003ca href=\"https://developers.cloudpayments.ru/#izmenenie-podpiski-na-rekurrentnye-platezhi\" target=\"_blank\" rel=\"noopener noreferrer\">API\u003c/a>.\u003c/p>\u003cp>\u003cem>Пример:\u003c/em> вы предоставляете покупателю скидку на первые 2 месяца использования сервиса, далее повышаете сумму подписки.\u003c/p>\u003ch3 id=\"avtomaticheskaya-korrektsiya-oshibok\">\u003cstrong>Автоматическая коррекция ошибок\u003c/strong>\u003c/h3>\u003cp>Ошибки, которые возникают при выполнении рекуррентных платежей, можно разделить на: поправимые и непоправимые.\u003c/p>\u003cp>В первую категорию относятся ошибки, связанные с недостатком средств на карте покупателя, с временными техническими проблемами или недоступностью банка-эмитента карты. Как правило, данные проблемы может исправить держатель карты.\u003c/p>\u003cp>Во вторую категорию попадают ошибки, исправление которых невозможно: истек срок действия карты, карта утеряна, у банка-эмитента отозвана лицензия.\u003c/p>\u003cp>В зависимости от категории система по-разному реагирует и обрабатывает ошибки рекуррентных платежей.\u003c/p>\u003ch3 id=\"vzaimodeystvie-s-derzhatelem-karty\">\u003cstrong>Взаимодействие с держателем карты\u003c/strong>\u003c/h3>\u003cp>В случае отказа по причине недостатка средств на карте, система сообщает держателю, что очередной платеж не прошел, рекомендует пополнить счет карты и информирует, что повторная попытка списания будет произведена на следующий день.\u003c/p>\u003ch3 id=\"povtornye-popytki\">\u003cstrong>Повторные попытки\u003c/strong>\u003c/h3>\u003cp>Система повторяет попытки списаний с карты несколько дней подряд, если очередной платеж не проходит из-за поправимой ошибки.\u003c/p>\u003ch3 id=\"obnovlenie-karty\">\u003cstrong>Обновление карты\u003c/strong>\u003c/h3>\u003cp>Система предлагает через свою форму ввести новые данные карты для продолжения рекуррентных платежей. Если покупатель соглашается, система проводит новый установочный платеж по реквизитам полученной карты, засчитывает платеж в подписку и продолжает выполнять регулярные платежи по обновленной карте.\u003c/p>\u003ch3 id=\"opoveschenie-pokupatelya\">\u003cstrong>Оповещение покупателя\u003c/strong>\u003c/h3>\u003cp>Важная функция рекуррентных платежей — это своевременное информирование держателя карты о наступлении даты очередного платежа. Некоторым покупателям свойственна забывчивость, поэтому предупреждение о предстоящем списании убирает эффект внезапности и существенно снижает вероятность отсутствия денег на карте. Система CloudPayments всегда напоминает плательщикам дату очередного платежа с указанием суммы, назначения и получателя оплаты.\u003c/p>\u003cp>\u003cbr>\u003c/p>\u003c/div>","toc":[{"id":"zapusk-i-ostanovka-regulyarnyh-platezhey","title":"Запуск и остановка регулярных платежей","level":2},{"id":"vozmozhnost-nastroyki-grafika-platezhey","title":"Возможность настройки графика платежей","level":2},{"id":"vybor-perioda-i-intervala-spisaniya","title":"Выбор периода и интервала списания","level":3},{"id":"vybor-daty-nachala-spisaniy","title":"Выбор даты начала списаний","level":3},{"id":"ogranichenie-na-kolichestvo-platezhey","title":"Ограничение на количество платежей","level":3},{"id":"zamorozka-plana","title":"Заморозка плана","level":3},{"id":"vozmozhnost-smeny-summy-platezha","title":"Возможность смены суммы платежа","level":2},{"id":"summa-ustanovochnogo-platezha","title":"Сумма установочного платежа","level":3},{"id":"summa-rekurrentnyh-platezhey","title":"Сумма рекуррентных платежей","level":3},{"id":"avtomaticheskaya-korrektsiya-oshibok","title":"Автоматическая коррекция ошибок","level":3},{"id":"vzaimodeystvie-s-derzhatelem-karty","title":"Взаимодействие с держателем карты","level":3},{"id":"povtornye-popytki","title":"Повторные попытки","level":3},{"id":"obnovlenie-karty","title":"Обновление карты","level":3},{"id":"opoveschenie-pokupatelya","title":"Оповещение покупателя","level":3}],"type":"page","audience":"both"},"scenarios/recurring":{"id":"scenarios/recurring","title":"Рекарринг","group":"scenarios","html":"","toc":[],"type":"page","audience":"both"},"scenarios/escrow":{"id":"scenarios/escrow","title":"Безопасная сделка","group":"scenarios","html":"\u003cdiv class=\"imported-api\">\u003ch2 id=\"opisanie-produkta\">\u003cstrong>Описание продукта\u003c/strong>\u003c/h2>\u003cp>Сервис &quot;Безопасная сделка&quot; позволяет организовать взаиморасчеты между двумя физическими лицами при продаже услуг или товаров. При этом, взаимодействие между физическими лицами происходит не напрямую между собой, а при участии Площадки - юридического лица, которое организует размещение Товара на своей витрине, помогает Продавцу найти покупателя, а также организует арбитраж, в случае такой необходимости. Площадка контролирует ход выполнения сделки, и дает команду CloudPayments на списание с карты в момент покупки, а после успешного выполнение продавцом своих обязанностей (например, после исполнения оговоренных услуг или работ, либо после успешной доставки товара), инициирует выплату на карту продавцу.\u003c/p>\u003ch2 id=\"opredeleniya-i-terminy\">\u003cstrong>Определения и термины:\u003c/strong>\u003c/h2>\u003cp>\u003cstrong>Плательщик\u003c/strong> - физическое лицо, которое отправляет денежные средства.\u003cbr>\u003cstrong>Получатель\u003c/strong> - физическое лицо, которое получает денежные средства.\u003cbr>\u003cstrong>Площадка\u003c/strong> - посредник, который выступает гарантом безопасности сделки, принимает решение о выполнении сторонами своих обязательств. В спорных случаях выступает Арбитром в спорах и несет финансовую ответственность.\u003cbr>\u003cstrong>Сделка\u003c/strong> - процесс приобретения товара/услуги одним физическим лицом у другого.\u003cbr>\u003cstrong>Оплата\u003c/strong> - приобретение товара/услуги у физического лица.\u003cbr>\u003cstrong>Выплата\u003c/strong> - получение вознаграждения физического лица, оказавшего услугу/продавцу товара.\u003cbr>\u003cstrong>Widget\u003c/strong> - всплывающая форма для ввода реквизитов карты и e-mail адреса плательщика.\u003cbr>\u003cstrong>Checkout\u003c/strong> - скрипт, который прописывается на сайте, собирает из указанной формы карточные данные и составляет из них криптограмму для оплаты через API.\u003cbr>\u003cstrong>AccumulationId\u003c/strong> - уникальный идентификатор сделки, присваиваемый во время первой операции. \u003cstrong>TransactionId\u003c/strong> - уникальный идентификатор транзакции.\u003c/p>\u003ch2 id=\"nastroyka-podklyucheniya\">\u003cstrong>Настройка подключения:\u003c/strong>\u003c/h2>\u003cp>Для подключения продукта &quot;Безопасная сделка&quot; необходимо подать заявку своему персональному менеджеру или указать это на этапе подключения выделенному менеджеру.\u003c/p>\u003caside class=\"api-callout warning\" role=\"note\">\u003cstrong class=\"callout-label\">Внимание\u003c/strong>\u003cp>Для работы по БС требуется заведение 2 терминалов, один для оплат, второй для выплат\u003c/p>\u003c/aside>\u003caside class=\"api-callout warning\" role=\"note\">\u003cstrong class=\"callout-label\">Внимание\u003c/strong>\u003cp>Оплаты и выплаты по БС доступны только по карте или по токену, полученному при оплате картой. На других способах оплаты, включая международные платежи по карте, БС не поддерживается.\u003cbr>\u003cbr>Также не все банки эквайеры, подключенные в CloudPayments, работают с БС. За деталями обращайтесь к своему персональному менеджеру.\u003c/p>\u003c/aside>\u003ch2 id=\"chemy-raboty\">\u003cstrong>Cхемы работы\u003c/strong>\u003c/h2>\u003col start=\"1\">\u003cli>\u003cp>Накопление нескольких платежей и проведение единой выплаты (N:1)\u003c/p>\u003c/li>\u003cli>\u003cp>Разделение одного платежа на несколько выплат (1:N)\u003c/p>\u003c/li>\u003c/ol>\u003ch2 id=\"statusnaya-model-sdelki\">\u003cstrong>Статусная модель сделки\u003c/strong>\u003c/h2>\u003cfigure style=\"text-align:center\">\u003cimg src=\"static/img/editor/597fb2c382f5b040efa3867ced8ee968a308085dcfdcbf178546450799d45c84.png\" alt=\"bezopasnaya_sdelka.png\" style=\"width:100%;max-width:100%;height:auto\">\u003c/figure>\u003ch2 id=\"n-1\">\u003cstrong>N:1\u003c/strong>\u003c/h2>\u003ch3 id=\"shema-integratsii-dlya-widget\">\u003cstrong>Схема интеграции для Widget:\u003c/strong>\u003c/h3>\u003cp>Переменная содержащая тип сделки, которая содержится в объекте cp.constant.escrow. Она отвечает за схему проведения сделки:\u003c/p>\u003col start=\"1\">\u003cli>\u003cp>Множество оплат и одна выплата;\u003c/p>\u003c/li>\u003cli>\u003cp>Одна оплата и множество выплат.\u003c/p>\u003c/li>\u003c/ol>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>json\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-1\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-1\" class=\"language-json\">{\n  NToOne: 0,  // для схемы N:1\n  OneToN: 1  // для схемы 1:N\n}\u003c/code>\u003c/pre>\u003c/div>\u003cp>Если данная переменная не передается, система автоматически считает, что сделка производится по протоколу \u003cstrong>N:1\u003c/strong>.\u003c/p>\u003cp>\u003cstrong>Пример использования\u003c/strong>:\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>json\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-2\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-2\" class=\"language-json\">cp.constant.escrow.NToOne // переменная для типа сделки = 0\ncp.constant.escrow.OneToN // переменная для типа сделки = 1\u003c/code>\u003c/pre>\u003c/div>\u003cp>\u003cstrong>Оплата (первичное создание накопления)\u003c/strong>\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>json\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-3\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-3\" class=\"language-json\">var widget = new cp.CloudPayments();\n\n  const intentParams = {\n    publicTerminalId: &quot;test_api_00000000000000000000002&quot;,\n    paymentSchema: &#39;Dual&#39;,\n    description: &quot;Оплата заказа №...&quot;,\n    amount: 100,\n    currency: &quot;RUB&quot;,\n    culture: &quot;ru-RU&quot;,\n    skin: &quot;classic&quot;,\n    externalId: &#39;string&#39;,\n    receiptEmail: &quot;user@email.com&quot;,\n    userInfo: {\n      email: &quot;user@email.com&quot;,\n      phone: &quot;+71234567890&quot;,\n    },\n    metadata: {\n      myProp: &quot;myProp value&quot;,\n    },\n    escrow: {\n      startAccumulation: true,\n      accumulationId: null,\n      escrowType: &quot;NToOne&quot;\n    },\n  };\n\n  widget.oncomplete = (result) =&gt; {\n      console.log(result);\n  }\n\n  widget.start(intentParams).then(function(widgetResult) {\n    console.log(&#39;result&#39;, widgetResult); // действие при успехе\n  }).catch(function(error) {\n    console.log(&#39;error&#39;, error); // действие при ошибке\n  });\u003c/code>\u003c/pre>\u003c/div>\u003cp>В ответ на запрос, в \u003ca href=\"https://developers.cloudpayments.ru/#pay\" target=\"_blank\" rel=\"noopener noreferrer\">Pay\u003c/a> уведомлении будет получен уникальный \u003cstrong>EscrowAccumulationId\u003c/strong>.\u003c/p>\u003cp>Также, при условии успешной транзакции, \u003cstrong>EscrowAccumulationId\u003c/strong> будет содержаться во всех вебхуках, кроме Check вебхука.\u003c/p>\u003cp>\u003cstrong>Оплата (по созданному накоплению)\u003c/strong>\u003c/p>\u003cp>Для последующих запросов (оплат), в рамках созданной безопасной сделки, необходимо добавить поля \u003cstrong>accumulationId\u003c/strong>, \u003cstrong>startAccumulation\u003c/strong>, \u003cstrong>escrowType\u003c/strong> в объект \u003ccode>escrow\u003c/code>.\u003c/p>\u003cp>\u003cstrong>Пример\u003c/strong>:\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>json\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-4\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-4\" class=\"language-json\">Escrow:{\n    startAccumulation: false,\n    escrowType: cp.constant.escrow.NToOne,\n    accumulationId: &quot;4733183a-c6f6-4c1b-8ff1-fb7c43ed1695&quot; // - Оплата по уже созданному накоплению.\n}\u003c/code>\u003c/pre>\u003c/div>\u003ch3 id=\"shema-integratsii-dlya-api-checkout\">\u003cstrong>Схема интеграции для API Checkout:\u003c/strong>\u003c/h3>\u003cp>\u003cstrong>Оплата (первичное создание накопления)\u003c/strong>\u003c/p>\u003cp>Необходимо использовать запрос \u003cstrong>payments/cards/charge\u003c/strong> (либо \u003cstrong>auth\u003c/strong>), где в теле в теле запроса в объекте \u003ccode>escrow\u003c/code> нужно передать \u003ccode>&quot;StartAccumulation&quot;: true\u003c/code> и тип сделки \u003ccode>&quot;EscrowType&quot;:0\u003c/code> или \u003ccode>&quot;EscrowType&quot;: “NToOne&quot;\u003c/code> . То есть для \u003ccode>EscrowType\u003c/code> значения можно передавать как целочисленное значение (0/1), так и строковым представлением (NToOne/OneToN).\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>javascript\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-5\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-5\" class=\"language-javascript\">&quot;Escrow&quot;:{\n    &quot;StartAccumulation&quot;:true,\n    &quot;EscrowType&quot;: &quot;NToOne&quot;\n}\u003c/code>\u003c/pre>\u003c/div>\u003cp>В ответ на запрос будет получен уникальный \u003ccode>EscrowAccumulationId\u003c/code>.\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>json\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-6\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-6\" class=\"language-json\">{\n    &quot;Model&quot;: {\n        &quot;ReasonCode&quot;: 0,\n        &quot;PublicId&quot;: &quot;pk_71efb26a18397ec61b755221123cc&quot;,\n        &quot;TerminalUrl&quot;: &quot;https://example.com&quot;,\n        &quot;TransactionId&quot;: 10649404,\n        &quot;Amount&quot;: 215,\n        &quot;Currency&quot;: &quot;RUB&quot;,\n        &quot;CurrencyCode&quot;: 0,\n        &quot;PaymentAmount&quot;: 215,\n
