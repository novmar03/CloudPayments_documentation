    &lt;input type=&quot;text&quot; data-cp=&quot;expDateYear&quot;&gt;\n    &lt;input type=&quot;text&quot; data-cp=&quot;cvv&quot;&gt;\n    &lt;input type=&quot;text&quot; data-cp=&quot;name&quot;&gt;\n    &lt;button type=&quot;submit&quot;&gt;Pay 100 rubles.&lt;/button&gt;\n&lt;/form&gt;\u003c/code>\u003c/pre>\u003c/div>\u003cp>The input fields for card details must be tagged with the following attributes:\u003c/p>\u003cul>\u003cli>\u003cp>\u003cstrong>data-cp=&quot;cardNumber&quot;\u003c/strong>: card number field\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>data-cp=&quot;expDateMonth&quot;\u003c/strong>: expiration month field\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>data-cp=&quot;expDateYear&quot;\u003c/strong>: expiration year field\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>data-cp=&quot;CVV&quot;\u003c/strong>: CVV field\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>data-cp=&quot;name&quot;\u003c/strong>: field with the cardholder name and surname\u003c/p>\u003c/li>\u003c/ul>\u003col start=\"2\">\u003cli>\u003cp>Initialize the checkout script:\u003c/p>\u003c/li>\u003c/ol>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>javascript\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-5\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-5\" class=\"language-javascript\">const checkout = new cp.Checkout({\n    publicId: &#39;test_api_000000000000000002&#39;,\n    container: document.getElementById(&quot;paymentFormSample&quot;)\n});\u003c/code>\u003c/pre>\u003c/div>\u003col start=\"3\">\u003cli>\u003cp>Call the cryptogram generation method:\u003c/p>\u003c/li>\u003c/ol>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>javascript\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-6\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-6\" class=\"language-javascript\">checkout.createPaymentCryptogram()\n    .then((cryptogram) =&gt; {\n        console.log(cryptogram); // The cryptogram\n    }).catch((errors) =&gt; {\n        console.log(errors)\n    });\u003c/code>\u003c/pre>\u003c/div>\u003ch3 id=\"section-e57f66f3-160a-4135-85d5-070cbc15cd9f\">\u003cstrong>When developing your own form or passing data directly to the script, please note the following\u003c/strong>\u003c/h3>\u003cul>\u003cli>\u003cp>The card number length ranges from 16 digits (15 for AMEX cards) to 19 digits.\u003c/p>\u003c/li>\u003cli>\u003cp>The \u003cstrong>checkout\u003c/strong> script does not operate in outdated, insecure browsers that lack support for TLS encryption protocols version 1.1 or later. For example, Internet Explorer 7.\u003c/p>\u003c/li>\u003cli>\u003cp>The 3DS window can be displayed either in a new window or in a frame that overlays the page. The window dimensions must be at least 500х500 pixels. _Checkout\u003c/p>\u003c/li>\u003c/ul>\u003ch2 id=\"section-6876043c-e268-44a9-9f57-c9bfc178351a\">\u003cstrong>Methods\u003c/strong>\u003c/h2>\u003ch3 id=\"section-8d822b82-dc24-436c-ae58-84eae81cf19c\">\u003cstrong>Asynchronous method used to generate a cryptogram\u003c/strong>\u003c/h3>\u003cp>In this method, if a card details validation error occurs, an error code will be returned instead of a localized message.\u003c/p>\u003cp>\u003ccode>async createPaymentCryptogram(fieldValues: CardData): Promise&lt;string&gt;\u003c/code>\u003c/p>\u003cp>The method returns the \u003ccode>Promise&lt;string&gt;\u003c/code> containing the cryptogram. If the invalid data is passed, the Promise will be rejected with an error containing an object with a list of errors.\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>javascript\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-7\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-7\" class=\"language-javascript\">const checkout = new cp.Checkout({\n    publicId: &#39;test_api_000000000000000002&#39;\n});\n\nconst fieldValues = {\n    cvv: &#39;911&#39;,\n    cardNumber: &#39;4242 4242 4242 4242&#39;,\n    expDateMonth: &#39;12&#39;,\n    expDateYear: &#39;24&#39;,\n}\n\ncheckout.createPaymentCryptogram(fieldValues)\n    .then((cryptogram) =&gt; {\n        console.log(cryptogram);\n    });\u003c/code>\u003c/pre>\u003c/div>\u003ch3 id=\"section-4e47699d-6849-404a-b183-e56d8374c689\">\u003cstrong>CardData object description\u003c/strong>\u003c/h3>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>javascript\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-8\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-8\" class=\"language-javascript\">export interface CardData {\n    cvv?: string; // CVV/CVC code\n    cardNumber?: string; // Card number (spaces are ignored)\n    expDateMonth?: string; // Card expiration month\n    expDateYear?: string; // Card expiration year\n    expDateMonthYear?: string; // Card expiration date (all non-digit characters are ignored)\n\n    // If the string length is 2, 3, or 5 characters, the first digit is parsed as the month, and the rest as the year\n    // If the string length is 4 or 6 characters, the first two digits are parsed as the month, and the rest as the year\n}\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"api-table-scroll\" tabindex=\"0\" aria-label=\"Таблица\">\u003ctable>\u003ctr>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Parameter\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Description\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Type\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Required\u003c/p>\u003c/th>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>cvv\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>CVV/CVC code\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>No *\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>cardNumber\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Card number (spaces are ignored)\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Optional if the field is bound to the form\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>expDateMonth\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Card expiration month\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Optional if the field is bound to the form or the \u003ccode>expDateMonthYear\u003c/code> field is specified\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>expDateYear\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Card expiration year\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Optional if the field is bound to the form or the \u003ccode>expDateMonthr\u003c/code> and \u003ccode>expDateYear\u003c/code> fields are specified\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>expDateMonthYear\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Card expiration date (all non-digit characters are ignored). If the string length is 2, 3, or 5 characters, the first digit is parsed as the month, and the rest as the year. If the string length is 4 or 6 characters, the first two digits are parsed as the month, and the rest as the year\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Optional if the field is bound to the form or the \u003ccode>expDateMonthr\u003c/code> and \u003ccode>expDateYear\u003c/code> fields are specified\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>name\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Name of card owner\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>No\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Warning:\u003c/strong> The \u003ccode>CardData\u003c/code> object itself is optional; you can omit it if you use HTML form binding.  \u003c/p>\u003ch3 id=\"section-087e704c-0086-4dcb-a791-30f21d548f91\">\u003cstrong>Error handling for card validation\u003c/strong>\u003c/h3>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>javascript\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-9\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-9\" class=\"language-javascript\">const fieldValues = {\n    cvv: &#39;91&#39;, // Invalid CVV\n    cardNumber: &#39;4242 4242 4242 424&#39;, // Invalid card number\n    expDateMonth: &#39;12&#39;,\n    expDateYear: &#39;24&#39;,\n}\n\ncheckout.createPaymentCryptogram(fieldValues)\n    .then((cryptogram) =&gt; {\n        console.log(cryptogram);\n    })\n    .catch((errors) =&gt; {\n        console.log(errors);\n\n        /* Will put out:\n        {\n            cardNumber: &quot;CardNumber_Invalid&quot;,\n            cvv: &quot;Cvv_Invalid&quot;\n        }\n        */\n    });\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"api-table-scroll\" tabindex=\"0\" aria-label=\"Таблица\">\u003ctable>\u003ctr>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Error code\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Description\u003c/p>\u003c/th>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>CardNumber_Empty\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Card number is missing\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>CardNumber_Invalid\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Invalid card number\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Cvv_Empty\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>CVV is missing\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Cvv_Invalid\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Invalid CVV\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>ExpDateMonthYear_Empty\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Expiration date is missing\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>ExpDateMonthYear_Invalid\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Invalid expiration date\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>ExpDateMonth_Empty\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Expiration month is missing\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>ExpDateMonth_Invalid\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Invalid expiration month\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>ExpDateYear_Empty\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Expiration year is missing\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>ExpDateYear_Invalid\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Invalid expiration year\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Name_Empty\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Cardholder name is missing *\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Name_Invalid\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Invalid cardholder name *\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Name_TooLong\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Cardholder name is too long *\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Name_TooShort\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Cardholder name is too short *\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Notice:\u003c/strong> The \u003ccode>name\u003c/code> field is optional and is validated only if it is specified in the form or provided in the \u003ccode>CardData\u003c/code> object. \u003c/p>\u003ch3 id=\"section-03f2bcac-7904-4775-a5e3-87ce8f9dc659\">\u003cstrong>Cryptogram generation method\u003c/strong>\u003c/h3>\u003cp>The method returns a cryptogram upon successful generation or an object with a list of errors if card details contain any errors. Unlike the \u003ccode>createPaymentCryptogram\u003c/code> method, this error object contains localized Russian error descriptions instead of error codes.\u003c/p>\u003cp>\u003ccode>createCryptogramPacket(fieldValues: CardData):string of the object\u003c/code> — deprecated.\u003c/p>\u003cp>This method accepts an object with card details and can be used in the legacy HTML form binding implementation. If a form binding is used and the same parameter is found in the \u003ccode>CardData\u003c/code> object, an error will be thrown when attempting to generate the cryptogram.\u003c/p>\u003cp>Script for cryptogram generation:\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>javascript\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-10\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-10\" class=\"language-javascript\">this.createCryptogram = function () {\n    var result = checkout.createCryptogramPacket();\n\n    if (result.success) {\n        // The cryptogram is generated\n        alert(result.packet);\n    }\n    else {\n        // Input data validation failed; the `result.messages` object is formatted as follows:\n        // { name: &quot;The cardholder name contains too many characters&quot;, cardNumber: &quot;Invalid Card Number&quot; }\n        // Where `name` and `cardNumber` correspond to the values of the `&lt;input ... data-cp=&quot;cardNumber&quot;&gt;` attributes\n\n        for (var msgName in result.messages) {\n            alert(result.messages[msgName]);\n        }\n    }\n};\n\n$(function () {\n    /* checkout initialization */\n    checkout = new cp.Checkout(\n        // Public ID from the dashboard\n        &quot;test_api_00000000000000000000001&quot;,\n        // The tag that contains the card details fields\n        document.getElementById(&quot;paymentFormSample&quot;)\n    );\n});\u003c/code>\u003c/pre>\u003c/div>\u003cp>\u003cbr>\u003c/p>\u003c/div>","toc":[{"id":"section-bbe2cdd8-d4a8-42b7-925c-1629b4116654","title":"Demo checkout","level":2},{"id":"section-e6dea309-af39-4e43-ae92-eaee552bc90f","title":"Requirements","level":2},{"id":"section-a55f2427-4fda-4224-8941-e36a3854656a","title":"Form requirements","level":3},{"id":"section-0080a13d-f748-4698-9625-a26d9180ce3d","title":"Cryptogram requirements","level":3},{"id":"section-b065ec9a-01bf-418e-bb6c-9c80b15cdb76","title":"PCI DSS security requirements","level":3},{"id":"section-366a9332-313c-4eaa-b7e0-042bdb18270a","title":"Installation","level":2},{"id":"section-b912e49e-a0d4-4b34-9c4b-52d4340657ea","title":"The option of direct transmission to the script","level":3},{"id":"section-9cb5396e-8aee-41fa-b4a9-1521fa67ad15","title":"The option with the input form","level":3},{"id":"section-e57f66f3-160a-4135-85d5-070cbc15cd9f","title":"When developing your own form or passing data directly to the script, please note the following","level":3},{"id":"section-6876043c-e268-44a9-9f57-c9bfc178351a","title":"Methods","level":2},{"id":"section-8d822b82-dc24-436c-ae58-84eae81cf19c","title":"Asynchronous method used to generate a cryptogram","level":3},{"id":"section-4e47699d-6849-404a-b183-e56d8374c689","title":"CardData object description","level":3},{"id":"section-087e704c-0086-4dcb-a791-30f21d548f91","title":"Error handling for card validation","level":3},{"id":"section-03f2bcac-7904-4775-a5e3-87ce8f9dc659","title":"Cryptogram generation method","level":3}]},"recurrentniye-platezhi":{"id":"recurrentniye-platezhi","title":"Recurring payments","type":"page","audience":"both","group":"root-recurrentniye-platezhi","html":"\u003cdiv class=\"imported-api\">\u003cp>Recurring payments, also known as subscription payments or automated payments, let you charge the customer&#39;s bank card regularly without requiring the payer to re-enter card details or initiate each payment.\u003c/p>\u003cp>Recurring payments always start with the initial payment, for which the payer must enter the details of his card. For subsequent recurring payments, you must familiarize the cardholder with the billing schedule and obtain their consent for direct debiting.\u003c/p>\u003cp>There is a common belief that recurring billing simply boils down to setting an amount to be charged to the customer&#39;s card each month. Consequently, the choice of a recurring payment provider is often based solely on the cost of the services. In reality, the process is more complex, because quality service requires far more features and capabilities. We have done everything to make launching and processing recurring payments in CloudPayments as simple and flexible as possible.  \u003c/p>\u003ch2 id=\"section-9fc1ce0e-2ce2-43f0-9798-1f08a67c83d4\">\u003cstrong>Start and stop recurring payments\u003c/strong>\u003c/h2>\u003cp>Recurring payments can be started at any time after the initial payment: immediately, one week later, or one month later. There is only one restriction: the interval between recurring payments, as well as between the initial payment and the first recurring payment, cannot exceed one year.\u003c/p>\u003cp>\u003cem>Example:\u003c/em> the customer pays for the first month of service through an initial payment and agrees to monthly debiting from their card starting from the second month.\u003c/p>\u003cp>Recurring payments can be started via API or payment widget.\u003c/p>\u003cp>If the customer cancels further payments, you can terminate the subscription at any time:\u003c/p>\u003cul>\u003cli>\u003cp>From the dashboard: \u003ca href=\"https://merchant.cloudpayments.ru/login\" target=\"_blank\" rel=\"noopener noreferrer\">https://merchant.cloudpayments.ru/login\u003c/a>\u003c/p>\u003c/li>\u003cli>\u003cp>Via the API\u003c/p>\u003c/li>\u003c/ul>\u003cp>Additionally, the payer can independently find and cancel their recurring payments on the CloudPayments website:\u003cbr>\u003ca href=\"https://my.cloudpayments.ru/ru/unsubscribe\" target=\"_blank\" rel=\"noopener noreferrer\">https://my.cloudpayments.ru/ru/unsubscribe\u003c/a>  \u003c/p>\u003ch2 id=\"section-3cfb6a2b-6702-47f9-9cfe-3df3f92cec90\">\u003cstrong>Payment schedule customization\u003c/strong>\u003c/h2>\u003ch3 id=\"section-d5557da4-1cbe-4322-a71a-d6183c3d14f5\">\u003cstrong>Select the billing period and interval\u003c/strong>\u003c/h3>\u003cp>The system can make recurring payments every 2 weeks, once a month, every 3 months, and so on: you can specify any billing period.\u003c/p>\u003ch3 id=\"section-18b987f0-a657-4adb-ade7-55ab782847e3\">\u003cstrong>Select the billing start date\u003c/strong>\u003c/h3>\u003cp>Recurring payments can be started immediately when you create a subscription or with a delay.\u003c/p>\u003cp>\u003cem>Example:\u003c/em> a customer subscribes to your service in the middle of the month, you create a monthly recurring payments plan that starts on the 15th of the next month.\u003c/p>\u003ch3 id=\"section-a4162018-f645-4476-b398-fb588cb1eb31\">\u003cstrong>Payment limit restrictions\u003c/strong>\u003c/h3>\u003cp>You can specify the maximum amount of payments for a subscription or create a plan with no restrictions. In the former case, recurring payments will automatically stop once all payments in the billing schedule have been completed.\u003c/p>\u003cp>\u003cem>Example:\u003c/em> a customer purchases a product worth 12,000 rubles under a one-year installment plan, pays 1,000 rubles as the initial payment, and subscribes to a recurring payment plan of 1,000 rubles per month for no more than 11 charges.\u003c/p>\u003ch3 id=\"section-fad9a73a-ece5-4a09-a6fb-f3a46d83c0d6\">\u003cstrong>Plan suspension\u003c/strong>\u003c/h3>\u003cp>A recurring payment subscription can be suspended for any period of time from the dashboard or via API.\u003c/p>\u003cp>\u003cem>Example:\u003c/em> a customer requests to pause the service for a couple of months, so you push back the next payment date by the corresponding period. _Recurrent\u003c/p>\u003ch2 id=\"section-8fa9add1-3df6-4c1e-bf45-eb52660abf0c\">\u003cstrong>Payment amount customization\u003c/strong>\u003c/h2>\u003ch3 id=\"section-377c5c7a-281d-404a-ad4d-bd3f6b2c8b9e\">\u003cstrong>Initial payment amount\u003c/strong>\u003c/h3>\u003cp>The initial payment amount can be flexible and may differ from the amount of subsequent recurring payments.\u003c/p>\u003cp>\u003cem>Example:\u003c/em> when a customer registers for your service, you ask them to make a setup payment of 1 ruble to verify the card. Afterward, with the user&#39;s consent, you can start recurring payments for any amount.\u003c/p>\u003ch3 id=\"section-05b9a84d-179f-4ec8-a267-51ad6bed0c9b\">\u003cstrong>Recurring payment amount\u003c/strong>\u003c/h3>\u003cp>The recurring payment amount can be changed at any point during the subscription plan lifecycle from the dashboard or via the API.\u003c/p>\u003cp>\u003cem>Example:\u003c/em> you provide the customer with a discount for the first 2 months of using the service, and then increase the subscription amount. _Recurrent\u003c/p>\u003ch3 id=\"section-6e7bb57b-2c6e-4f5c-b1e2-201c83ac143a\">\u003cstrong>Automated error resolution\u003c/strong>\u003c/h3>\u003cp>Errors that occur during recurring payment execution can be divided into: recoverable and unrecoverable.\u003c/p>\u003cp>The first category includes errors related to a lack of funds on the customer&#39;s card, temporary technical issues, or unavailability of the card issuer. As a rule, these problems can be resolved by the cardholder.\u003c/p>\u003cp>The second category covers errors that cannot be fixed, such as an expired card, a lost card, or a revoked license of the issuing bank.\u003c/p>\u003cp>Depending on the category, the system responds to and processes recurring payment errors differently.\u003c/p>\u003ch3 id=\"section-76acd83d-49ff-465f-a7bc-10e7950a8cd9\">\u003cstrong>Interaction with the cardholder\u003c/strong>\u003c/h3>\u003cp>If the card is declined due to insufficient funds, the system notifies the cardholder that the scheduled payment failed, recommends topping up the card balance, and informs them that a retry attempt will be made the following day.\u003c/p>\u003ch3 id=\"section-6bc4a390-1c0a-48f8-b3c6-7667c6b8d3eb\">\u003cstrong>Retry attempts\u003c/strong>\u003c/h3>\u003cp>The system retries the card charges for several consecutive days if a scheduled payment fails due to a recoverable error.\u003c/p>\u003ch3 id=\"section-81c982cd-6595-40d9-a1f7-a1c0dd024b62\">\u003cstrong>Card update\u003c/strong>\u003c/h3>\u003cp>The system prompts the user to enter new card details via its interface to resume recurring payments. If the customer agrees, the system executes a new initial payment using the updated card details, credits the payment to the subscription and continues to process recurring payments using the new card.\u003c/p>\u003ch3 id=\"section-04fece3d-87e6-4752-8609-965d5aed0c21\">\u003cstrong>Customer notification\u003c/strong>\u003c/h3>\u003cp>An important function of recurring payments is to timely inform the cardholder about the upcoming scheduled payment date. Some customers can be forgetful, so a warning about an upcoming payment eliminates the element of surprise and significantly reduces the likelihood of insufficient funds on the card. CloudPayments always reminds payers of the date of the next payment, specifying the amount, purpose, and the recipient of the payment.\u003c/p>\u003c/div>","toc":[{"id":"section-9fc1ce0e-2ce2-43f0-9798-1f08a67c83d4","title":"Start and stop recurring payments","level":2},{"id":"section-3cfb6a2b-6702-47f9-9cfe-3df3f92cec90","title":"Payment schedule customization","level":2},{"id":"section-d5557da4-1cbe-4322-a71a-d6183c3d14f5","title":"Select the billing period and interval","level":3},{"id":"section-18b987f0-a657-4adb-ade7-55ab782847e3","title":"Select the billing start date","level":3},{"id":"section-a4162018-f645-4476-b398-fb588cb1eb31","title":"Payment limit restrictions","level":3},{"id":"section-fad9a73a-ece5-4a09-a6fb-f3a46d83c0d6","title":"Plan suspension","level":3},{"id":"section-8fa9add1-3df6-4c1e-bf45-eb52660abf0c","title":"Payment amount customization","level":2},{"id":"section-377c5c7a-281d-404a-ad4d-bd3f6b2c8b9e","title":"Initial payment amount","level":3},{"id":"section-05b9a84d-179f-4ec8-a267-51ad6bed0c9b","title":"Recurring payment amount","level":3},{"id":"section-6e7bb57b-2c6e-4f5c-b1e2-201c83ac143a","title":"Automated error resolution","level":3},{"id":"section-76acd83d-49ff-465f-a7bc-10e7950a8cd9","title":"Interaction with the cardholder","level":3},{"id":"section-6bc4a390-1c0a-48f8-b3c6-7667c6b8d3eb","title":"Retry attempts","level":3},{"id":"section-81c982cd-6595-40d9-a1f7-a1c0dd024b62","title":"Card update","level":3},{"id":"section-04fece3d-87e6-4752-8609-965d5aed0c21","title":"Customer notification","level":3}]},"bezopasnaya-sdelka":{"id":"bezopasnaya-sdelka","title":"Escrow service","type":"page","audience":"both","group":"root-bezopasnaya-sdelka","html":"\u003cdiv class=\"imported-api\">\u003ch2 id=\"section-977b9270-3650-412e-a4da-104afd69b2d9\">\u003cstrong>Product description\u003c/strong>\u003c/h2>\u003cp>The Escrow service enables settlement processing between two individuals for the sale of goods or services. In this case, interaction between individuals does not happen directly, but rather through the Platform, a legal entity that facilitates the listing of the Product on its storefront, helps the Seller find a buyer, and organizes dispute resolution when necessary. The Platform monitors the transaction progress and instructs CloudPayments to charge the buyer&#39;s card at the time of purchase. Once the seller successfully fulfills their obligations (for example, upon completion of the agreed services or works, or successful delivery of the product), the Platform initiates the payout to the seller&#39;s card. \u003c/p>\u003ch2 id=\"section-93e5f7fa-c4a7-43dc-9ed9-7038977b7d59\">\u003cstrong>Definitions and terms\u003c/strong>\u003c/h2>\u003cul>\u003cli>\u003cp>\u003cstrong>Payer\u003c/strong>: an individual who sends money.\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>Recipient\u003c/strong>: an individual who receives money.\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>Platform\u003c/strong>: an intermediary that acts as a guarantor of the security of the transaction and determines whether the parties have fulfilled their obligations. In case of disputes, it acts as an Arbitrator and bears financial liability.\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>Transaction\u003c/strong> is the process of acquiring goods/services from one individual to another.\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>Payment\u003c/strong>: the purchase of goods or services from an individual.\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>Payout\u003c/strong>: the receipt of remuneration by an individual who has provided a service or sold a product.\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>Widget\u003c/strong>: a pop-up form used to enter the payer&#39;s card details and email address.\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>Checkout\u003c/strong>: a script embedded into a website that collects card details from a specified form and uses them to generate a cryptogram for payment processing via the API.\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>AccumulationId\u003c/strong>: a unique transaction ID assigned during the initial transaction.\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>TransactionId\u003c/strong>: a unique transaction ID.  \u003c/p>\u003c/li>\u003c/ul>\u003ch2 id=\"section-7f6f782a-7ba3-4683-a04d-1677403d5160\">\u003cstrong>Connection setup\u003c/strong>\u003c/h2>\u003cp>To enable the Escrow service, you must submit a request to your account manager or specify this during the onboarding phase with your assigned manager.\u003c/p>\u003cp>\u003cstrong>Warning:\u003c/strong> Operating via Escrow requires setting up 2 terminals: one for processing payments and another for processing payouts.\u003c/p>\u003cp>\u003cstrong>Warning:\u003c/strong> Escrow payments and payouts are available exclusively via bank card or a token generated during a card payment. Escrow is not supported for any other payment methods, including international card payments.\u003c/p>\u003cp>Also, please note that not all acquiring banks connected to CloudPayments support the Escrow service. Please contact your account manager for details.  \u003c/p>\u003ch2 id=\"section-d49741bc-be94-4817-863c-b90b17452bb2\">\u003cstrong>Workflows\u003c/strong>\u003c/h2>\u003col start=\"1\">\u003cli>\u003cp>Accumulating several payments and making a single payout (N:1)\u003c/p>\u003c/li>\u003cli>\u003cp>Splitting a single payment into multiple payouts (1:N)\u003c/p>\u003c/li>\u003c/ol>\u003ch2 id=\"section-926d8524-6c34-4c2f-9a83-77f795d805fb\">\u003cstrong>Escrow status model\u003c/strong>\u003c/h2>\u003cfigure style=\"text-align:center\">\u003cimg data-image-id=\"1a7b81f9-3dc5-44ae-94e9-dc3744b0ef58\" src=\"static/img/editor/867d1b163e5edc9b7427ab53290dbfd6486bc5d0eb9ee8d7481607460d6a7f93.png\" alt=\"Изображение ChatGPT 25 сент. 2026 г., 22_35_53.png\" style=\"width:100%;max-width:100%;height:auto\">\u003c/figure>\u003cp>\u003cbr>\u003c/p>\u003ch2 id=\"section-ef590979-134c-472c-a49a-26e7388ac85c\">\u003cstrong>N:1\u003c/strong>\u003c/h2>\u003ch2 id=\"section-a6e371c4-e41a-4b85-9728-4b2b0a067317\">\u003cstrong>Widget integration diagram\u003c/strong>\u003c/h2>\u003cp>The variable specifying the transaction type is located within the \u003ccode>cp.constant.escrow\u003c/code> object. It determines the escrow workflow:\u003c/p>\u003col start=\"1\">\u003cli>\u003cp>Multiple payments to a single payout\u003c/p>\u003c/li>\u003cli>\u003cp>A single payment to multiple payouts\u003c/p>\u003c/li>\u003c/ol>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>javascript\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-1\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-1\" class=\"language-javascript\">{\n  NToOne: 0,  // For N:1 workflow\n  OneToN: 1   // For 1:N workflow\n}\u003c/code>\u003c/pre>\u003c/div>\u003cp>If this variable is omitted, the system automatically defaults to the \u003cstrong>N:1\u003c/strong> transaction protocol.\u003c/p>\u003cp>\u003cstrong>Example:\u003c/strong>\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>javascript\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-2\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-2\" class=\"language-javascript\">cp.constant.escrow.NToOne // Transaction type variable = 0\ncp.constant.escrow.OneToN // Transaction type variable = 1\u003c/code>\u003c/pre>\u003c/div>\u003cp>\u003cbr>\u003c/p>\u003ch3 id=\"section-2cd485bb-4b8e-4559-90f7-a3994ced242c\">\u003cstrong>Payment (initial accumulation)\u003c/strong>\u003c/h3>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>javascript\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-3\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-3\" class=\"language-javascript\">var widget = new cp.CloudPayments();\n\nconst intentParams = {\n  publicTerminalId: &quot;test_api_00000000000000000000002&quot;,\n  paymentSchema: &#39;Dual&#39;,\n  description: Payment for order #...&quot;,\n  amount: 100,\n  currency: &quot;RUB&quot;,\n  culture: &quot;ru-RU&quot;,\n  skin: &quot;classic&quot;,\n  externalId: &#39;string&#39;,\n  receiptEmail: &quot;user@email.com&quot;,\n  userInfo: {\n    email: &quot;user@email.com&quot;,\n    phone: &quot;+71234567890&quot;,\n  },\n  metadata: {\n    myProp: &quot;myProp value&quot;,\n  },\n  escrow: {\n    startAccumulation: true,\n    accumulationId: null,\n    escrowType: &quot;NToOne&quot;\n  },\n};\n\nwidget.oncomplete = (result) =&gt; {\n  console.log(result);\n}\n\nwidget.start(intentParams).then(function(widgetResult) {\n  console.log(&#39;result&#39;, widgetResult); // Success callback\n}).catch(function(error) {\n  console.log(&#39;error&#39;, error); // Error callback\n});\u003c/code>\u003c/pre>\u003c/div>\u003cp>In response to the request, a unique \u003cstrong>EscrowAccumulationId\u003c/strong> ID will be received within the Pay notification.\u003c/p>\u003cp>Also, if the transaction is successful, the \u003cstrong>EscrowAccumulationId\u003c/strong> will be included in all webhooks except for the \u003ccode>Check\u003c/code> webhook.  \u003c/p>\u003ch3 id=\"section-9e417c3f-6749-4148-9ad9-90b57a71d14e\">\u003cstrong>Payment (for an active accumulation)\u003c/strong>\u003c/h3>\u003cp>For subsequent requests (payments) within the created escrow transaction, fields \u003cstrong>accumulationId\u003c/strong>, \u003cstrong>startAccumulation\u003c/strong>, \u003cstrong>escrowType\u003c/strong> must be added to the \u003ccode>escrow\u003c/code> object.\u003c/p>\u003cp>\u003cstrong>Example:\u003c/strong>\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>text\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-4\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-4\" class=\"language-text\">Escrow: {\n    startAccumulation: false,\n    escrowType: cp.constant.escrow.NToOne,\n    accumulationId: &quot;4733183a-c6f6-4c1b-8ff1-fb7c43ed1695&quot; // Payment for accumulation already created\n}\u003c/code>\u003c/pre>\u003c/div>\u003ch2 id=\"section-1fc8a2bb-452b-4155-87fd-9ccc23fefaed\">\u003cstrong>Checkout API integration workflow\u003c/strong>\u003c/h2>\u003ch3 id=\"section-fe0943cc-435c-493d-b52b-fd34d094448d\">Payment (initial accumulation)\u003c/h3>\u003cp>You must send a request to the \u003cstrong>payments/cards/charge\u003c/strong> (or \u003cstrong>auth\u003c/strong>) endpoint. In the request body, within the \u003ccode>escrow\u003c/code> object, you must pass \u003ccode>&quot;StartAccumulation&quot;: true\u003c/code> and the transaction type as \u003ccode>&quot;EscrowType&quot;: 0\u003c/code> or \u003ccode>&quot;EscrowType&quot;: &quot;NToOne&quot;\u003c/code>.\u003c/p>\u003cp>The \u003ccode>EscrowType\u003c/code> value can therefore be passed either as an integer value (\u003ccode>0/1\u003c/code>) or as a string representation (\u003ccode>NToOne/OneToN\u003c/code>).\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>javascript\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-5\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-5\" class=\"language-javascript\">&quot;Escrow&quot;: {\n    &quot;StartAccumulation&quot;: true,\n    &quot;EscrowType&quot;: &quot;NToOne&quot;\n}\u003c/code>\u003c/pre>\u003c/div>\u003cp>The response returns a unique \u003ccode>EscrowAccumulationId\u003c/code> ID. _Escrow\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>javascript\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-6\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-6\" class=\"language-javascript\">{\n    &quot;Model&quot;: {\n        &quot;ReasonCode&quot;: 0,\n        &quot;PublicId&quot;: &quot;pk_71efb26a18397ec61b755221123cc&quot;,\n        &quot;TerminalUrl&quot;: &quot;https://example.com&quot;,\n        &quot;TransactionId&quot;: 10649404,\n        &quot;Amount&quot;: 215,\n        &quot;Currency&quot;: &quot;RUB&quot;,\n        &quot;CurrencyCode&quot;: 0,\n        &quot;PaymentAmount&quot;: 215,\n        &quot;PaymentCurrency&quot;: &quot;RUB&quot;,\n        &quot;PaymentCurrencyCode&quot;: 0,\n        &quot;InvoiceId&quot;: null,\n        &quot;AccountId&quot;: null,\n        &quot;Email&quot;: null,\n        &quot;Description&quot;: null,\n        &quot;JsonData&quot;: &quot;{\\&quot;Phone\\&quot;: \\&quot;+71234567890\\&quot; }&quot;,\n        &quot;CreatedDate&quot;: &quot;/Date(1640787010601)/&quot;,\n        &quot;PayoutDate&quot;: null,\n        &quot;PayoutDateIso&quot;: null,\n        &quot;PayoutAmount&quot;: null,\n        &quot;CreatedDateIso&quot;: &quot;2021-12-29T14:10:10&quot;,\n        &quot;AuthDate&quot;: &quot;/Date(1640787010877)/&quot;,\n        &quot;AuthDateIso&quot;: &quot;2021-12-29T14:10:10&quot;,\n        &quot;ConfirmDate&quot;: null,\n        &quot;ConfirmDateIso&quot;: null,\n        &quot;AuthCode&quot;: &quot;A1B2C3&quot;,\n        &quot;TestMode&quot;: true,\n        &quot;Rrn&quot;: null,\n        &quot;OriginalTransactionId&quot;: null,\n        &quot;FallBackScenarioDeclinedTransactionId&quot;: null,\n        &quot;IpAddress&quot;: &quot;127.0.0.1&quot;,\n        &quot;IpCountry&quot;: &quot;RU&quot;,\n        &quot;IpCity&quot;: &quot;Novosibirsk&quot;,\n        &quot;IpRegion&quot;: &quot;Novo-Siberian region&quot;,\n        &quot;IpDistrict&quot;: &quot;Siberian Federal District&quot;,\n        &quot;IpLatitude&quot;: 1.03923,\n        &quot;IpLongitude&quot;: 1.927818,\n        &quot;CardFirstSix&quot;: &quot;411111&quot;,\n        &quot;CardLastFour&quot;: &quot;1111&quot;,\n        &quot;CardExpDate&quot;: &quot;11/23&quot;,\n        &quot;CardType&quot;: &quot;Visa&quot;,\n        &quot;CardProduct&quot;: &quot;C&quot;,\n        &quot;CardCategory&quot;: &quot;Visa Signature (Signature)&quot;,\n        &quot;EscrowAccumulationId&quot;: &quot;365b6942-94e8-4c5b-aff5-392dc1a51c28&quot;,\n        &quot;IssuerBankCountry&quot;: &quot;RU&quot;,\n        &quot;Issuer&quot;: &quot;CloudPayments&quot;,\n        &quot;CardTypeCode&quot;: 0,\n        &quot;Status&quot;: &quot;Authorized&quot;,\n        &quot;StatusCode&quot;: 2,\n        &quot;CultureName&quot;: &quot;ru&quot;,\n        &quot;Reason&quot;: &quot;Approved&quot;,\n        &quot;CardHolderMessage&quot;: &quot;Payment successfully processed&quot;,\n        &quot;Type&quot;: 0,\n        &quot;Refunded&quot;: false,\n        &quot;Name&quot;: null,\n        &quot;Token&quot;: null,\n        &quot;SubscriptionId&quot;: null,\n        &quot;GatewayName&quot;: &quot;Test&quot;,\n        &quot;AndroidPay&quot;: false,\n        &quot;WalletType&quot;: &quot;&quot;,\n        &quot;TotalFee&quot;: 0\n    },\n    &quot;Success&quot;: true,\n    &quot;Message&quot;: null\n}\u003c/code>\u003c/pre>\u003c/div>\u003cp>In response to the request, a unique \u003ccode>EscrowAccumulationId\u003c/code> ID will be received within the Pay notification.\u003c/p>\u003cp>Also, if the transaction is successful, the \u003ccode>EscrowAccumulationId\u003c/code> will be included in all webhooks except for the \u003ccode>Check\u003c/code> webhook. \u003c/p>\u003ch3 id=\"section-07b63adf-4558-4646-af34-e40c9005bd67\">\u003cstrong>Payment (for an active accumulation)\u003c/strong>\u003c/h3>\u003cp>For subsequent requests (payments), within the created escrow transaction, it is necessary to include the \u003ccode>AccumulationId\u003c/code> ID in the \u003cstrong>Escrow\u003c/strong> object of the \u003ccode>payments/cards/charge\u003c/code> request by specifying \u003ccode>&quot;StartAccumulation&quot;: false\u003c/code> and the transaction type as \u003ccode>&quot;EscrowType&quot;: 0\u003c/code> or \u003ccode>&quot;EscrowType&quot;: &quot;NToOne&quot;\u003c/code>:\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>javascript\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-7\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-7\" class=\"language-javascript\">&quot;Escrow&quot;: {\n    &quot;StartAccumulation&quot;: false,\n    &quot;EscrowType&quot;: &quot;NToOne&quot;,\n    &quot;AccumulationId&quot;: &quot;365b6942-94e8-4c5b-aff5-392dc1a51c28&quot;\n}\u003c/code>\u003c/pre>\u003c/div>\u003cp>The response:\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>javascript\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-8\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-8\" class=\"language-javascript\">{\n    &quot;Model&quot;: {\n        &quot;ReasonCode&quot;: 0,\n        &quot;PublicId&quot;: &quot;pk_71efb26a18397ec61b755221123cc&quot;,\n        &quot;TerminalUrl&quot;: &quot;https://example.com&quot;,\n        &quot;TransactionId&quot;: 10649405,\n        &quot;Amount&quot;: 215,\n        &quot;Currency&quot;: &quot;RUB&quot;,\n        &quot;CurrencyCode&quot;: 0,\n        &quot;PaymentAmount&quot;: 215,\n        &quot;PaymentCurrency&quot;: &quot;RUB&quot;,\n        &quot;PaymentCurrencyCode&quot;: 0,\n        &quot;InvoiceId&quot;: null,\n        &quot;AccountId&quot;: null,\n        &quot;Email&quot;: null,\n        &quot;Description&quot;: null,\n        &quot;JsonData&quot;: &quot;{\\&quot;Phone\\&quot;: \\&quot;+71234567890\\&quot;}&quot;,\n        &quot;CreatedDate&quot;: &quot;/Date(1640787317880)/&quot;,\n        &quot;PayoutDate&quot;: null,\n        &quot;PayoutDateIso&quot;: null,\n        &quot;PayoutAmount&quot;: null,\n        &quot;CreatedDateIso&quot;: &quot;2021-12-29T14:15:17&quot;,\n        &quot;AuthDate&quot;: &quot;/Date(1640787319410)/&quot;,\n        &quot;AuthDateIso&quot;: &quot;2021-12-29T14:15:19&quot;,\n        &quot;ConfirmDate&quot;: null,\n        &quot;ConfirmDateIso&quot;: null,\n        &quot;AuthCode&quot;: &quot;A1B2C3&quot;,\n        &quot;TestMode&quot;: true,\n        &quot;Rrn&quot;: null,\n        &quot;OriginalTransactionId&quot;: null,\n        &quot;FallBackScenarioDeclinedTransactionId&quot;: null,\n        &quot;IpAddress&quot;: &quot;127.0.0.1&quot;,\n        &quot;IpCountry&quot;: &quot;RU&quot;,\n        &quot;IpCity&quot;: &quot;Novosibirsk&quot;,\n        &quot;IpRegion&quot;: &quot;Novo-Siberian region&quot;,\n        &quot;IpDistrict&quot;: &quot;Siberian Federal District&quot;,\n        &quot;IpLatitude&quot;: 1.03923,\n        &quot;IpLongitude&quot;: 1.927818,\n        &quot;CardFirstSix&quot;: &quot;411111&quot;,\n        &quot;CardLastFour&quot;: &quot;1111&quot;,\n        &quot;CardExpDate&quot;: &quot;11/23&quot;,\n        &quot;CardType&quot;: &quot;Visa&quot;,\n        &quot;CardProduct&quot;: &quot;C&quot;,\n        &quot;CardCategory&quot;: &quot;Visa Signature (Signature)&quot;,\n        &quot;EscrowAccumulationId&quot;: &quot;365b6942-94e8-4c5b-aff5-392dc1a51c28&quot;,\n        &quot;IssuerBankCountry&quot;: &quot;RU&quot;,\n        &quot;Issuer&quot;: &quot;CloudPayments&quot;,\n        &quot;CardTypeCode&quot;: 0,\n        &quot;Status&quot;: &quot;Authorized&quot;,\n        &quot;StatusCode&quot;: 2,\n        &quot;CultureName&quot;: &quot;ru&quot;,\n        &quot;Reason&quot;: &quot;Approved&quot;,\n        &quot;CardHolderMessage&quot;: &quot;Payment successfully processed&quot;,\n        &quot;Type&quot;: 0,\n        &quot;Refunded&quot;: false,\n        &quot;Name&quot;: null,\n        &quot;Token&quot;: null,\n        &quot;SubscriptionId&quot;: null,\n        &quot;GatewayName&quot;: &quot;Test&quot;,\n        &quot;AndroidPay&quot;: false,\n        &quot;WalletType&quot;: &quot;&quot;,\n        &quot;TotalFee&quot;: 0\n    },\n    &quot;Success&quot;: true,\n    &quot;Message&quot;: null\n}\u003c/code>\u003c/pre>\u003c/div>\u003cp>\u003cbr>\u003c/p>\u003ch3 id=\"section-7f4a6711-617c-43a1-9f26-81ee6e3e2983\">\u003cstrong>Payout\u003c/strong>\u003c/h3>\u003cp>To complete the transaction, you must send the request to the \u003cstrong>payments/token/topup\u003c/strong> endpoint, specifying the \u003ccode>AccumulationId\u003c/code> ID and the array of transactions to be paid out:\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>text\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-9\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-9\" class=\"language-text\">&quot;Escrow&quot;: {\n  &quot;AccumulationId&quot;: &quot;365b6942-94e8-4c5b-aff5-392dc1a51c28&quot;,\n  &quot;TransactionIds&quot;: [10649405, 10649404],\n  &quot;EscrowType&quot;: &quot;NToOne&quot;\n}\u003c/code>\u003c/pre>\u003c/div>\u003cp>The array of payment transactions for the payout must contain only transactions processed through the payment terminal associated with the current \u003cstrong>AccumulationId\u003c/strong> ID.\u003c/p>\u003cp>Payouts will be made only for the \u003cstrong>TransactionId\u003c/strong> values that have been specified in the \u003cstrong>TransactionIds\u003c/strong> array in the \u003cstrong>payments/token/topup\u003c/strong> request.\u003c/p>\u003cp>It is not possible to process payouts for the omitted transactions, as the transaction will already be closed. Therefore it is impossible to perform either a payment or a payout against a closed escrow transaction.\u003c/p>\u003cp>\u003cstrong>Warning:\u003c/strong> Any payment transactions that were not submitted for escrow closure will be automatically refunded to the payer.  \u003c/p>\u003ch3 id=\"section-efe91ed8-9c76-4667-854a-c1df247f5bc3\">\u003cstrong>Restrictions\u003c/strong>\u003c/h3>\u003cp>The payout amount must be less than or equal to the total payment amount.\u003c/p>\u003cp>None of the transactions specified in the payout array must have any cancellations or full refunds (partial refunds are allowed).\u003c/p>\u003cp>If a payment request is sent with an \u003ccode>AccumulationId\u003c/code> for which a payout has already been processed, the payment will be declined.\u003c/p>\u003cp>All transactions submitted for a payout must:\u003c/p>\u003cul>\u003cli>\u003cp>Share the same \u003ccode>AccumulationId\u003c/code>\u003c/p>\u003c/li>\u003cli>\u003cp>Be unpaid\u003c/p>\u003c/li>\u003cli>\u003cp>Be in the RUB currency\u003c/p>\u003c/li>\u003cli>\u003cp>Be of the \u003cstrong>Payment\u003c/strong> type\u003c/p>\u003c/li>\u003cli>\u003cp>Be in the \u003cstrong>Completed\u003c/strong> status\u003c/p>\u003c/li>\u003c/ul>\u003cp> \u003c/p>\u003ch2 id=\"section-4438d290-a023-46e9-abb5-6c4f7a0b9863\">\u003cstrong>1:N\u003c/strong>\u003c/h2>\u003ch2 id=\"section-8789aa62-ca68-48dd-a3ef-2cf6e288a7b0\">Widget integration diagram\u003c/h2>\u003cp>The variable specifying the transaction type is located within the \u003ccode>cp.constant.escrow\u003c/code> object. It determines the escrow workflow:\u003c/p>\u003col start=\"1\">\u003cli>\u003cp>Multiple payments to a single payout\u003c/p>\u003c/li>\u003cli>\u003cp>A single payment to multiple payouts\u003c/p>\u003c/li>\u003c/ol>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>javascript\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-10\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-10\" class=\"language-javascript\">{\n  NToOne: 0,\n  OneToN: 1\n}\u003c/code>\u003c/pre>\u003c/div>\u003cp>\u003cstrong>Example:\u003c/strong>\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>javascript\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-11\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-11\" class=\"language-javascript\">cp.constant.escrow.NToOne // Transaction type variable = 0\ncp.constant.escrow.OneToN // Transaction type variable = 1\u003c/code>\u003c/pre>\u003c/div>\u003ch3 id=\"section-875094c3-88d8-48ad-97d5-18ba395c02a9\">\u003cstrong>Payment\u003c/strong>\u003c/h3>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>javascript\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-12\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-12\" class=\"language-javascript\">var widget = new cp.CloudPayments();\n\nconst intentParams = {\n  publicTerminalId: &quot;test_api_00000000000000000000002&quot;,\n  paymentSchema: &#39;Dual&#39;,\n  description: Payment for order #...&quot;,\n  amount: 100,\n  currency: &quot;RUB&quot;,\n  culture: &quot;ru-RU&quot;,\n  skin: &quot;classic&quot;,\n  externalId: &#39;string&#39;,\n  receiptEmail: &quot;user@email.com&quot;,\n  userInfo: {\n    email: &quot;user@email.com&quot;,\n    phone: &quot;+71234567890&quot;,\n  },\n  metadata: {\n    myProp: &quot;myProp value&quot;,\n  },\n  escrow: {\n    startAccumulation: true,\n    accumulationId: null,\n    escrowType: &quot;OneToN&quot;\n  },\n};\n\nwidget.oncomplete = (result) =&gt; {\n  console.log(result);\n}\n\nwidget.start(intentParams).then(function(widgetResult) {\n  console.log(&#39;result&#39;, widgetResult); // Success callback\n}).catch(function(error) {\n  console.log(&#39;error&#39;, error); // Error callback\n});\u003c/code>\u003c/pre>\u003c/div>\u003cp>In response to the request, a unique \u003cstrong>EscrowAccumulationId\u003c/strong> ID will be received within the Pay notification.\u003c/p>\u003cp>Also, if the transaction is successful, the \u003ccode>EscrowAccumulationId\u003c/code> will be included in all webhooks except for the \u003ccode>Check\u003c/code> webhook.  \u003c/p>\u003ch2 id=\"section-0b1476dd-3483-49b5-9d3b-aff8cec3b5a0\">\u003cstrong>Checkout API integration workflow\u003c/strong>\u003c/h2>\u003ch3 id=\"section-795568d4-f666-43f5-9b1b-29818d145f73\">\u003cstrong>Payment\u003c/strong>\u003c/h3>\u003cp>You must send a request to the \u003cstrong>payments/cards/charge\u003c/strong> (or \u003cstrong>auth\u003c/strong>) endpoint. In the request body, within the \u003ccode>escrow\u003c/code> object, you must pass \u003ccode>&quot;StartAccumulation&quot;: true\u003c/code> and the transaction type as \u003ccode>&quot;EscrowType&quot;: 1\u003c/code> or \u003ccode>&quot;EscrowType&quot;: &quot;OneToN&quot;\u003c/code>.\u003c/p>\u003cp>The \u003ccode>EscrowType\u003c/code> value can be passed either as an integer value (\u003ccode>0/1\u003c/code>) or as a string representation (\u003ccode>NToOne/OneToN\u003c/code>).\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>javascript\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-13\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-13\" class=\"language-javascript\">&quot;Escrow&quot;: {\n    &quot;StartAccumulation&quot;: true,\n    &quot;EscrowType&quot;: &quot;OneToN&quot;\n}\u003c/code>\u003c/pre>\u003c/div>\u003cp>The response returns a unique \u003ccode>EscrowAccumulationId\u003c/code> ID.  \u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>javascript\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-14\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-14\" class=\"language-javascript\">{\n    &quot;Model&quot;: {\n        &quot;ReasonCode&quot;: 0,\n        &quot;PublicId&quot;: &quot;pk_71efb26a18397ec61b755221123cc&quot;,\n        &quot;TerminalUrl&quot;: &quot;https://example.com&quot;,\n        &quot;TransactionId&quot;: 10649404,\n        &quot;Amount&quot;: 215,\n        &quot;Currency&quot;: &quot;RUB&quot;,\n        &quot;CurrencyCode&quot;: 0,\n        &quot;PaymentAmount&quot;: 215,\n        &quot;PaymentCurrency&quot;: &quot;RUB&quot;,\n        &quot;PaymentCurrencyCode&quot;: 0,\n        &quot;InvoiceId&quot;: null,\n        &quot;AccountId&quot;: null,\n        &quot;Email&quot;: null,\n        &quot;Description&quot;: null,\n        &quot;JsonData&quot;: &quot;{\\&quot;Phone\\&quot;: \\&quot;+71234567890\\&quot;}&quot;,\n        &quot;CreatedDate&quot;: &quot;/Date(1640787010601)/&quot;,\n        &quot;PayoutDate&quot;: null,\n        &quot;PayoutDateIso&quot;: null,\n        &quot;PayoutAmount&quot;: null,\n        &quot;CreatedDateIso&quot;: &quot;2021-12-29T14:10:10&quot;,\n        &quot;AuthDate&quot;: &quot;/Date(1640787010877)/&quot;,\n        &quot;AuthDateIso&quot;: &quot;2021-12-29T14:10:10&quot;,\n        &quot;ConfirmDate&quot;: null,\n        &quot;ConfirmDateIso&quot;: null,\n        &quot;AuthCode&quot;: &quot;A1B2C3&quot;,\n        &quot;TestMode&quot;: true,\n        &quot;Rrn&quot;: null,\n        &quot;OriginalTransactionId&quot;: null,\n        &quot;FallBackScenarioDeclinedTransactionId&quot;: null,\n        &quot;IpAddress&quot;: &quot;127.0.0.1&quot;,\n        &quot;IpCountry&quot;: &quot;RU&quot;,\n        &quot;IpCity&quot;: &quot;Novosibirsk&quot;,\n        &quot;IpRegion&quot;: &quot;Novosibirsk region&quot;,\n        &quot;IpDistrict&quot;: &quot;Siberian Federal District&quot;,\n        &quot;IpLatitude&quot;: 1.03923,\n        &quot;IpLongitude&quot;: 1.927818,\n        &quot;CardFirstSix&quot;: &quot;411111&quot;,\n        &quot;CardLastFour&quot;: &quot;1111&quot;,\n        &quot;CardExpDate&quot;: &quot;11/23&quot;,\n        &quot;CardType&quot;: &quot;Visa&quot;,\n        &quot;CardProduct&quot;: &quot;C&quot;,\n        &quot;CardCategory&quot;: &quot;Visa Signature (Signature)&quot;,\n        &quot;EscrowAccumulationId&quot;: &quot;365b6942-94e8-4c5b-aff5-392dc1a51c28&quot;,\n        &quot;IssuerBankCountry&quot;: &quot;RU&quot;,\n        &quot;Issuer&quot;: &quot;CloudPayments&quot;,\n        &quot;CardTypeCode&quot;: 0,\n        &quot;Status&quot;: &quot;Authorized&quot;,\n        &quot;StatusCode&quot;: 2,\n        &quot;CultureName&quot;: &quot;ru&quot;,\n        &quot;Reason&quot;: &quot;Approved&quot;,\n        &quot;CardHolderMessage&quot;: &quot;Payment successfully processed&quot;,\n        &quot;Type&quot;: 0,\n        &quot;Refunded&quot;: false,\n        &quot;Name&quot;: null,\n        &quot;Token&quot;: null,\n        &quot;SubscriptionId&quot;: null,\n        &quot;GatewayName&quot;: &quot;Test&quot;,\n        &quot;AndroidPay&quot;: false,\n        &quot;WalletType&quot;: &quot;&quot;,\n        &quot;TotalFee&quot;: 0\n    },\n    &quot;Success&quot;: true,\n    &quot;Message&quot;: null\n}\u003c/code>\u003c/pre>\u003c/div>\u003cp>In response to the request, a unique \u003ccode>EscrowAccumulationId\u003c/code> ID will be received within the Pay notification.\u003c/p>\u003cp>Also, if the transaction is successful, the \u003ccode>EscrowAccumulationId\u003c/code> will be included in all webhooks except for the \u003ccode>Check\u003c/code> webhook.  \u003c/p>\u003ch3 id=\"section-4b7e7977-a745-4eed-a65e-abe3518ba250\">\u003cstrong>Payout\u003c/strong>\u003c/h3>\u003cp>To complete the transaction, you must send the request to the \u003cstrong>payments/token/topup\u003c/strong> endpoint, specifying the \u003ccode>AccumulationId\u003c/code> ID and an array of transactions to be paid out. The array should contain only one \u003ccode>TransactionId\u003c/code>, according to the escrow workflow:\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>javascript\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-15\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-15\" class=\"language-javascript\">&quot;Escrow&quot;: {\n  &quot;AccumulationId&quot;: &quot;365b6942-94e8-4c5b-aff5-392dc1a51c28&quot;,\n  &quot;TransactionIds&quot;: [10649404],\n  &quot;EscrowType&quot;: &quot;OneToN&quot;\n}\u003c/code>\u003c/pre>\u003c/div>\u003cp>\u003cstrong>Warning:\u003c/strong> Payouts can be processed until the sum of all payouts equals the total escrow transaction amount.\u003c/p>\u003cp>There are two methods for closing an escrow transaction:\u003c/p>\u003cp>\u003cstrong>1. Pass \u003c/strong>\u003ccode>&quot;FinalPayout&quot;: true\u003c/code>\u003cstrong> within the \u003c/strong>\u003ccode>Escrow\u003c/code>\u003cstrong> object.\u003c/strong>\u003c/p>\u003cp>This closes the escrow transaction even if the total payout amount is less than the original payment amount.\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>javascript\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-16\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-16\" class=\"language-javascript\">&quot;Escrow&quot;: {\n  &quot;AccumulationId&quot;: &quot;365b6942-94e8-4c5b-aff5-392dc1a51c28&quot;,\n  &quot;TransactionIds&quot;: [10649404],\n  &quot;EscrowType&quot;: &quot;OneToN&quot;,\n  &quot;FinalPayout&quot;: true\n}\u003c/code>\u003c/pre>\u003c/div>\u003cp>\u003cstrong>2. When the sum of all payouts equals the original payment amount, the escrow transaction will be closed automatically.\u003c/strong>\u003c/p>\u003cp>Payments will be made only for the \u003ccode>TransactionId\u003c/code> specified in the \u003ccode>TransactionIds\u003c/code> array in the \u003cstrong>payments/token/topup\u003c/strong> request. For the 1:N workflow, this array must contain only a single payment transaction ID.  \u003c/p>\u003ch3 id=\"section-25ed88b0-1b14-4767-ab76-7c76a88b2896\">\u003cstrong>Restrictions\u003c/strong>\u003c/h3>\u003cp>The payout amount must be less than or equal to the total payment amount.\u003c/p>\u003cp>The payment transaction must not have any cancellations or full refunds (partial refunds are allowed).\u003c/p>\u003cp>All transactions submitted for a payout must:\u003c/p>\u003cul>\u003cli>\u003cp>Share the same \u003ccode>AccumulationId\u003c/code>\u003c/p>\u003c/li>\u003cli>\u003cp>Be in the RUB currency\u003c/p>\u003c/li>\u003cli>\u003cp>Be in the \u003cstrong>Completed\u003c/strong> status\u003c/p>\u003c/li>\u003cli>\u003cp>Be processed within a single workflow (\u003ccode>OneToN\u003c/code>)\u003c/p>\u003c/li>\u003cli>\u003cp>Belong to an escrow transaction that has not been closed — \u003ccode>&quot;FinalPayout&quot;: true\u003c/code> must not have been passed, and the total payout amount must be less than the original payment amount\u003c/p>\u003c/li>\u003c/ul>\u003cp> \u003c/p>\u003ch3 id=\"section-65de87be-8c2e-4241-a0e8-894d945f9d2a\">\u003cstrong>Retrieve transaction status by \u003c/strong>\u003ccode>AccumulationId\u003c/code>\u003c/h3>\u003cp>To retrieve information, you must send an HTTP request with the \u003ccode>Basic Auth\u003c/code> authorization type.\u003c/p>\u003cp>Use the terminal&#39;s public key (\u003ccode>PK\u003c/code>) as the username. Both the payment and payout terminals can be used.\u003c/p>\u003cp>The password is the API secret associated with that specific PK.\u003c/p>\u003cp>\u003cstrong>Notice:\u003c/strong> The PK and API secret can be found in the dashboard under the website settings.\u003c/p>\u003cp>\u003cstrong>Warning:\u003c/strong> Information retrieval is only available for the \u003ccode>AccumulationId\u003c/code> values generated within this specific pair of terminals.  \u003c/p>\u003ch2 id=\"section-570771c9-5d56-4a79-a57d-51fdfdc31319\">\u003cstrong>Retrieve Escrow service information for both types of transaction (N:1 and 1:N)\u003c/strong>\u003c/h2>\u003cp>A public method for retrieving information by an array of \u003cstrong>EscrowAccumulationId\u003c/strong> values allows you to obtain:\u003c/p>\u003cul>\u003cli>\u003cp>An array of unpaid payments:\u003c/p>\u003cul>\u003cli>\u003cp>\u003cstrong>Payments\u003c/strong> transaction ID\u003c/p>\u003c/li>\u003cli>\u003cp>Transaction status\u003c/p>\u003c/li>\u003cli>\u003cp>Transaction amount\u003c/p>\u003c/li>\u003c/ul>\u003c/li>\u003cli>\u003cp>An array of paid-out payments:\u003c/p>\u003cul>\u003cli>\u003cp>\u003cstrong>Payments\u003c/strong> transaction ID\u003c/p>\u003c/li>\u003cli>\u003cp>Transaction status\u003c/p>\u003c/li>\u003cli>\u003cp>Transaction amount\u003c/p>\u003c/li>\u003c/ul>\u003c/li>\u003cli>\u003cp>An array of refunds for all transactions:\u003c/p>\u003cul>\u003cli>\u003cp>\u003cstrong>Payments\u003c/strong> transaction ID\u003c/p>\u003c/li>\u003cli>\u003cp>Transaction status\u003c/p>\u003c/li>\u003cli>\u003cp>Transaction amount\u003c/p>\u003c/li>\u003c/ul>\u003c/li>\u003cli>\u003cp>An array of payout transactions for the 1:N workflow:\u003c/p>\u003cul>\u003cli>\u003cp>\u003cstrong>Payout\u003c/strong> transaction ID\u003c/p>\u003c/li>\u003cli>\u003cp>Transaction status\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>Payout\u003c/strong> transaction amount\u003c/p>\u003c/li>\u003cli>\u003cp>The \u003cstrong>IsFinalPayout\u003c/strong> escrow closure flag\u003c/p>\u003c/li>\u003c/ul>\u003c/li>\u003cli>\u003cp>Balance:\u003c/p>\u003cul>\u003cli>\u003cp>\u003ccode>Balance = PaymentsSum - RefundsSum - PayoutsSum\u003c/code>\u003c/p>\u003c/li>\u003c/ul>\u003c/li>\u003c/ul>\u003cp> \u003c/p>\u003ch3 id=\"section-f9576d34-2f4d-4272-8030-b8f956395d79\">\u003cstrong>Endpoint\u003c/strong>\u003c/h3>\u003cp>\u003ca href=\"https://api.cloudpayments.ru/Escrow/GetEscrowInfo\" target=\"_blank\" rel=\"noopener noreferrer\">https://api.cloudpayments.ru/Escrow/GetEscrowInfo\u003c/a>\u003c/p>\u003ch3 id=\"section-4fe309e0-f96a-4d2b-87b1-19ba1b2b1eb5\">Request example\u003c/h3>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>javascript\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-17\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-17\" class=\"language-javascript\">{\n  &quot;EscrowAccumulationIds&quot;: [\n    &quot;7de3281f-4339-4e2e-9df9-06dcfbcdceac&quot;\n  ]\n}\u003c/code>\u003c/pre>\u003c/div>\u003ch3 id=\"section-13482bd0-45b5-4aa6-9aeb-850e5cba8ad9\">Example response\u003c/h3>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>javascript\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-18\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-18\" class=\"language-javascript\">{\n    &quot;Model&quot;: [\n        {\n            &quot;Status&quot;: &quot;Closed&quot;,\n            &quot;PaidoutTransactions&quot;: [\n                {\n                    &quot;Id&quot;: 608632,\n                    &quot;Status&quot;: &quot;Completed&quot;,\n                    &quot;Amount&quot;: 1500.0\n                },\n                {\n                    &quot;Id&quot;: 608631,\n                    &quot;Statu
