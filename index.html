at: 0, //ставка НДС\n                method: 0, // тег-1214 признак способа расчета - признак способа расчета\n                object: 0, // тег-1212 признак предмета расчета - признак предмета товара, работы, услуги, платежа, выплаты, иного предмета расчета\n                measurementUnit: &quot;шт&quot; //единица измерения\n            }, {\n                label: &quot;Наименование товара 2&quot;, //наименование товара\n                price: 200.00, //цена\n                quantity: 2.00, //количество\n                amount: 300.00, //сумма со скидкой 25%\n                vat: 10, //ставка НДС\n                method: 0, // тег-1214 признак способа расчета - признак способа расчета\n                object: 0, // тег-1212 признак предмета расчета - признак предмета товара, работы, услуги, платежа, выплаты, иного предмета расчета\n                measurementUnit: &quot;шт&quot;, //единица измерения\n                excise: 0.01, // тег-1229 сумма акциза\n                countryOriginCode: &quot;156&quot;, // тег-1230 цифровой код страны происхождения товара в соответствии с Общероссийским классификатором стран мира 3 симв. \n                customsDeclarationNumber: &quot;54180656/1345865/3435625/23&quot;, // тег-1231 регистрационный номер таможенной декларации 32 симв. \n                ProductCodeData: //данные маркировки товара\n                {\n                    CodeProductNomenclature: &quot;3031303239303030303033343....a78495a4f6672754744773d3d&quot; //HEX представление штрих/бар кода маркировки целиком (Только для касс Микропэй)\n                }\n            }, {\n                label: &quot;Наименование товара 3&quot;, //наименование товара\n                price: 300.00, //цена\n                quantity: 3.00, //количество\n                amount: 900.00, //сумма\n                vat: 20, //ставка НДС\n                method: 0, // тег-1214 признак способа расчета - признак способа расчета\n                object: 0, // тег-1212 признак предмета расчета - признак предмета товара, работы, услуги, платежа, выплаты, иного предмета расчета\n                measurementUnit: &quot;шт&quot;, //единица измерения\n                AgentSign: 6, //признак агента, тег ОФД 1057, 1222\n                AgentData: { //данные агента, тег офд 1223\n                    AgentOperationName: null, // наименование операции банковского платежного агента или банковского платежного субагента, тег ОФД 1044\n                    PaymentAgentPhone: null, // телефон платежного агента, тег ОФД 1073\n                    PaymentReceiverOperatorPhone: null, // телефон оператора по приему платежей, тег ОФД 1074\n                    TransferOperatorPhone: null, // телефон оператора перевода, тег ОФД 1075\n                    TransferOperatorName: null, // наименование оператора перевода, тег ОФД 1026\n                    TransferOperatorAddress: null, // адрес оператора перевода, тег ОФД 1005\n                    TransferOperatorInn: null // ИНН оператора перевода, тег ОФД 1016\n                },\n                PurveyorData: { //данные поставщика платежного агента,  тег ОФД 1224\n                    Phone: &quot;+71234567890&quot;, // телефон поставщика, тег ОД 1171\n                    Name: &quot;ООО Ромашка&quot;, // наименование поставщика, тег ОФД 1225\n                    Inn: &quot;1234567890&quot; // ИНН поставщика, тег ОФД 1226\n                }\n            }\n        ],\n        calculationPlace: &quot;www.my.ru&quot;, //место осуществления расчёта, по умолчанию берется значение из кассы\n        taxationSystem: 0, //система налогообложения; необязательный, если у вас одна система налогообложения\n        email: &quot;user@example.com&quot;, //e-mail покупателя, если нужно отправить письмо с чеком\n        phone: &quot;&quot;, //телефон покупателя в любом формате, если нужно отправить сообщение со ссылкой на чек\n        customerInfo: &quot;&quot;, // тег-1227 Покупатель - наименование организации или фамилия, имя, отчество (при наличии), серия и номер паспорта покупателя (клиента)\n        customerInn: &quot;7708806063&quot;, // тег-1228 ИНН покупателя \n        isBso: false, //чек является бланком строгой отчётности\n        AgentSign: null, //признак агента, тег ОФД 1057\n        amounts: {\n            electronic: 1300.00, // Сумма оплаты электронными деньгами\n            advancePayment: 0.00, // Сумма из предоплаты (зачетом аванса) (2 знака после точки)\n            credit: 0.00, // Сумма постоплатой(в кредит) (2 знака после точки)\n            provision: 0.00 // Сумма оплаты встречным предоставлением (сертификаты, др. мат.ценности) (2 знака после точки)\n        }\n    },\n    metadata: {\n        referrerId: &quot;some_referrer_123&quot;\n    },\n    successRedirectUrl: &quot;&lt;https://example.com&gt;&quot;,\n    failRedirectUrl: &quot;&lt;https://failexample.com&gt;&quot;,\n    escrow: { \n        startAccumulation: true,\n        accumulationId: null,\n        escrowType: &quot;OneToN&quot;\n    },\n    retryPayment: false,\n    receiptEmail: &quot;user@example.com&quot;,\n    tokenize: true,\n    emailBehavior: &quot;Required&quot;,\n  };\n\n  widget.oncomplete = (result) =&gt; {\n      console.log(result);\n  }\n\n  widget.start(intentParams).then(function(widgetResult) {\n      console.log(&#39;result&#39;, widgetResult);\n  }).catch(function(error) {\n      console.log(&#39;error&#39;, error);\n  });\n}\n\nbtn.addEventListener(&#39;click&#39;, launchWidget)\n\u003c/code>\u003c/pre>\u003c/div>\u003cp>Для тестирования можно использовать как \u003ca href=\"/testirovaniye/\">тестовые карточные данные\u003c/a>, так и реальные. Списания денежных средств не произойдет.\u003c/p>\u003ch2 id=\"parametry\">\u003cstrong>Параметры\u003c/strong>\u003c/h2>\u003cp>По требованию НСПК, для ТСП, предоставляющих телекоммуникационные услуги (MCC 4814 Telecommunication Services), обязательна передача номера телефона плательщика. При отсутствии номера телефона в запросе, банки-эквайеры будут отклонять проводимые операции.\u003cbr>\u003cbr>Номер телефона необходимо передавать в объекте Payer в параметре Phone.\u003cbr>Формат передачи: только цифры, без разделителей “( )“, “-“ .\u003cbr>Пример передачи: “+71234567890“\u003c/p>\u003cdiv class=\"api-table-scroll\" tabindex=\"0\" aria-label=\"Таблица\">\u003ctable>\u003ctr>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Параметр\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Тип\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Описание\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Обязательность\u003c/p>\u003c/th>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>publicTerminalId\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Публичный ID терминала\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязателен\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>amount\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>float\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Cумма платежа. Должно быть &gt; 0\u003cbr>Пример: 2; 2.5; 2.57\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязателен\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>currency\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003cbr>enum\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Валюта платежа (\u003ca href=\"/spravochniki/#spisok-valyut\">см. справочник\u003c/a>)\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязателен\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>culture\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Язык виджета (По умолчанию \u003ccode>ru-RU\u003c/code>) (\u003ca href=\"/spravochniki/#cultures\">см. справочник\u003c/a>)\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязателен\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>description\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Описание назначения оплаты в произвольном формате\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязателен\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>externalId\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Идентификатор заказа в вашей системе.\u003cbr>Приходит в \u003ca href=\"/uvedomleniya/\">уведомлениях\u003c/a>\u003cbr>(ранее \u003ccode>invoiceId\u003c/code>)\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязателен\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>paymentSchema\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003cbr>enum\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Схема обработки транзакций (ранее \u003ccode>charge\u003c/code>/\u003ccode>auth\u003c/code>):\u003cbr>\u003ccode>Single\u003c/code> — одностадийная оплата.\u003cbr>\u003ccode>Dual\u003c/code> — двухстадийная оплата.\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязателен\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>receiptEmail\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Email для отправки квитанции и чека.\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязателен\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>restrictedPaymentMethods\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string[]\u003cbr>enum\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Cписок отключенных для данной оплаты методов\u003cbr>Доступные значения: \u003ccode>Card\u003c/code>, \u003ccode>TcsInstallment\u003c/code>, \u003ccode>Sbp\u003c/code>, \u003ccode>TinkoffPay\u003c/code>, \u003ccode>MirPay\u003c/code>, \u003ccode>Dolyame\u003c/code>, \u003ccode>ForeignCard\u003c/code>, \u003ccode>SberPay\u003c/code>\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязателен\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>tokenize\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>bool\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Сохранение карты для последующего использования.Приходит в \u003ca href=\"/uvedomleniya/\">уведомлениях\u003c/a> и позволяет оплачивать по \u003ca href=\"/api/#oplata-po-tokenu-rekarring\">токену\u003c/a>\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязателен\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>recurrent\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>object\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Настройки для рекуррентных платежей (\u003ca href=\"/platezhniy-widget/#recurrent-widget\">см. справочник\u003c/a>)\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязателен\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>escrow\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>object\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Настройки для безопасной сделки (\u003ca href=\"/platezhniy-widget/#escrow-widget\">см. справочник\u003c/a>)\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязателен\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>items\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>object[]\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Список товаров (\u003ca href=\"/platezhniy-widget/#spisok-tovarov\">см. справочник\u003c/a>)\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязателен\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>receipt\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>object\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Объект чека. Используется при подключении CloudKassir. Для более подробной информации \u003ca href=\"/online-kassa/#format-peredachi-dannyh-dlya-onlayn-cheka\">см. cправочник\u003c/a>\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязателен\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>userInfo\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>object\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Информация о плательщике (\u003ca href=\"/platezhniy-widget/#dannye-o-platelshchike\">см. справочник\u003c/a>)\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязателен\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>metadata\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>object\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Дополнительные метаданные в формате JSON которые будут связаны с транзакцией. (ранее \u003ccode>data\u003c/code>)\u003cbr>Приходит в \u003ca href=\"/uvedomleniya/\">уведомлениях\u003c/a>\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязателен\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>successRedirectUrl\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Адрес страницы для редиректа при успешной оплате\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязателен\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>failRedirectUrl\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Адрес страницы для редиректа при неуспешной оплате\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязателен\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>emailBehavior\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Email пользователя:\u003cbr>\u003ccode>Required\u003c/code>: Обязателен.\u003cbr>\u003ccode>Hidden\u003c/code>: Скрыт.\u003cbr>\u003ccode>Optional\u003c/code>: Необязателен.\u003cbr>Отображается изначально в отключенном состоянии, клиент может включить для получения квитанции (Значение по умолчанию)\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязателен\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>retryPayment\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>bool\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Появление кнопки «Повторить платеж» при неудачном платеже (По умолчанию \u003ccode>true\u003c/code>)\u003cbr>Если передать \u003ccode>false\u003c/code>, то после неудачной попытки оплаты клиенту сразу будет предложено вернуться на сайт, следующую попытку он сможет совершить только в новой оплате\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязателен\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>autoClose\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>int\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Автоматическое закрытие виджета после успешной оплаты через указанное количество секунд. Значение в промежутке от 3 до 10 включительно\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязателен\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>skin\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string[]\u003cbr>enum\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Вид виджета\u003cbr>Доступные значения:\u003cbr>\u003ccode>classic\u003c/code> светлая тема (Значение по умолчанию)\u003cbr>\u003ccode>modern\u003c/code>: темная тема\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003cbr>\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003ch2 id=\"recurrent-widget\">\u003cstrong>Параметры. Рекуррентные платежи\u003c/strong>\u003c/h2>\u003cp>Можно реализовать списания рекуррентных платежей с помощью механизмов CloudPayments: мы сами будем отвечать за периодичность и попытки оплаты. Для этого необходимо дополнительно передавать следующие параметры в рамках объекта \u003ccode>recurrent\u003c/code>:\u003c/p>\u003cdiv class=\"api-table-scroll\" tabindex=\"0\" aria-label=\"Таблица\">\u003ctable>\u003ctr>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Параметр\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Тип\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Описание\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Обязательность\u003c/p>\u003c/th>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>period\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>int\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Частота использования интервала. Должен быть больше 0\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязателен\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>interval\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003cbr>enum\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Интервал. Доступные значения:\u003cbr>\u003ccode>Week\u003c/code> (неделя),\u003cbr>\u003ccode>Month\u003c/code> (месяц),\u003cbr>\u003ccode>Day\u003c/code> (день)\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязателен\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>maxPeriods\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>int\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Максимальное количество платежей в подписке. Если задаете количество, проверьте, чтобы оно было больше 0\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязателен\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>amount\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>decimal\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Сумма регулярного платежа. Для целей когда инитный и регулярный платёж отличаются. Сумма должна содержать не более двух знаков после запятой. Если указываете другую сумму, проверьте, чтобы она была больше 0\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязателен\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>startDate\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>dateTime\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Дата и время первого регулярного платежа. Для целей когда дата первого платежа должна быть не через указанный интервал. Если указываете другую дату, то она должна стоять в будущем времени\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязателен\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>receipt\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Данные для формирования онлайн-чека в регулярных платежах\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязателен\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003ch2 id=\"escrow-widget\">\u003cstrong>Параметры. Настройки безопасной сделки\u003c/strong>\u003c/h2>\u003cp>Для настройки \u003ca href=\"/bezopasnaya-sdelka/\">безопасной сделки\u003c/a> необходимо дополнительно передавать следующие параметры в рамках объекта \u003ccode>escrow\u003c/code>:\u003c/p>\u003cdiv class=\"api-table-scroll\" tabindex=\"0\" aria-label=\"Таблица\">\u003ctable>\u003ctr>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Параметр\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Тип\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Описание\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Обязательность\u003c/p>\u003c/th>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>startAccumulation\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>bool\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Флаг начала накопления\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязателен\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>accumulationId\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>ID накопления на стороне банка\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязателен\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>escrowType\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Тип счета. Доступные значения: \u003ccode>NToOne\u003c/code>, \u003ccode>OneToN\u003c/code>, \u003ccode>NToN\u003c/code>\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязателен\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003ch2 id=\"dannye-o-platelshchike\">\u003cstrong>Параметры. Данные о плательщике\u003c/strong>\u003c/h2>\u003cp>Для передачи информации о плательщике необходимо дополнительно передавать следующие параметры в рамках объекта \u003ccode>userInfo\u003c/code>:\u003c/p>\u003cdiv class=\"api-table-scroll\" tabindex=\"0\" aria-label=\"Таблица\">\u003ctable>\u003ctr>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Параметр\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Тип\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Описание\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Обязательность\u003c/p>\u003c/th>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>firstName\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Имя\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязателен\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>lastName\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Фамилия\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязателен\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>middleName\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Отчество\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязателен\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>fullName\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Полное имя\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязателен\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>birth\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Дата рождения\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязателен\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>address\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Адрес\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязателен\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>street\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Улица\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязателен\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>city\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Город\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязателен\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>country\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Страна\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязателен\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>phone\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Номер телефона. Пример: +7xxxxxxxxxx\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязателен\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>postCode\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Индекс\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязателен\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>accountId\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Внешний идентификатор плательщика в системе мерчанта (Необходим для создания рекуррентого платежа). Должен быть меньше 255 символов\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязателен\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>email\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Email плательщика\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязателен\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>customField\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>object\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Кастомное поле\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязателен\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>customField.name\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Название кастомного поля\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязателен\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>customField.value\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Значение кастомного поля\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязателен\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003ch2 id=\"spisok-tovarov\">\u003cstrong>Параметры. Список товаров\u003c/strong>\u003c/h2>\u003cp>В случае, когда необходимо передавать одни и те же товары в разных процессах (например, при формировании чека) необходимо дополнительно передавать следующие параметры в рамках объекта \u003ccode>items\u003c/code>:\u003c/p>\u003cdiv class=\"api-table-scroll\" tabindex=\"0\" aria-label=\"Таблица\">\u003ctable>\u003ctr>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Параметр\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Тип\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Описание\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Обязательность\u003c/p>\u003c/th>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>id\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>ID товара\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязателен\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>name\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Название товара\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязателен\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>count\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>decimal\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Количество позиций товара\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязателен\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>price\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>decimal\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Цена одной позиции товара\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязателен\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cp>В случае, если список товаров передан, то система будет искать аналогичный товар в списке товаров чека. Поиск осуществляется по значению параметра \u003ccode>id\u003c/code>, поэтому позиция товара в чеке должна иметь аналогичный \u003ccode>id\u003c/code>, как и в списке товаров.\u003c/p>\u003ch2 id=\"callbacks\">\u003cstrong>События (коллбэки)\u003c/strong>\u003c/h2>\u003cp>Коллбэки – события, которые срабатывают при определенных условиях. Условия формирования событий (коллбэков):\u003c/p>\u003cp>\u003cstrong>oncomplete\u003c/strong>\u003c/p>\u003cp>Получение финального статуса по транзакции, так же после возврата к списку методов, если была неуспешная оплата\u003c/p>\u003cp>Формат ответа у данного коллбэка зависит от успеха платежа и совпадает с форматом \u003cstrong>widgetResult\u003c/strong> в случае успешной или неуспешной оплаты соответственно\u003c/p>\u003cp>\u003cstrong>function(widgetResult)\u003c/strong>\u003c/p>\u003cp>Завершение работы виджета. \u003cstrong>widgetResult\u003c/strong> – объект результата\u003c/p>\u003cp>Возможные значения \u003ccode>type\u003c/code>:\u003c/p>\u003cp>– \u003ccode>cancel\u003c/code> — закрытие без оплаты\u003cbr>– \u003ccode>payment\u003c/code> — оплата\u003cbr>– \u003ccode>installment\u003c/code> — рассрочка\u003cbr>– \u003ccode>error\u003c/code> — ошибка при оплате\u003c/p>\u003cp>Возможные значения \u003ccode>status\u003c/code>:\u003c/p>\u003cp>– \u003ccode>success\u003c/code> — успех\u003cbr>– \u003ccode>fail\u003c/code> — неудача при оплате\u003cbr>– \u003ccode>appointment\u003c/code> — авторизация по рассрочке\u003cbr>– \u003ccode>reject\u003c/code> — отклоненная по рассрочке\u003cbr>– \u003ccode>cancel\u003c/code> — отмененная транзакция\u003c/p>\u003cp>\u003cstrong>Пример без оплаты (type = cancel):\u003c/strong>\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>text\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-6\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-6\" class=\"language-text\">{\n    &quot;type&quot;: &quot;cancel&quot;\n}\n\u003c/code>\u003c/pre>\u003c/div>\u003cp>\u003cstrong>Пример для успеха (status = success):\u003c/strong>\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>text\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-7\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-7\" class=\"language-text\">{\n   &quot;type&quot;:&quot;payment&quot;,\n   &quot;data&quot;:{\n      &quot;transactionId&quot;:3059300327\n   },\n   &quot;status&quot;:&quot;success&quot;\n}\n\u003c/code>\u003c/pre>\u003c/div>\u003cp>\u003cstrong>Пример для отклоненной транзакции (status = fail):\u003c/strong>\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>text\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-8\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-8\" class=\"language-text\">{\n   &quot;type&quot;:&quot;error&quot;,\n   &quot;data&quot;:{\n      &quot;transactionId&quot;:3192600857,\n      &quot;ReasonCode&quot;:5206\n   },\n   &quot;message&quot;:&quot;3-D Secure авторизация не пройдена&quot;,\n   &quot;status&quot;:&quot;fail&quot;\n}\u003c/code>\u003c/pre>\u003c/div>\u003cp>\u003cbr>\u003c/p>\u003c/div>","toc":[{"id":"demo-widget","title":"Демо виджета","level":2},{"id":"mobilnyy-vidzhet","title":"Мобильный виджет","level":2},{"id":"ustanovka-vidzheta","title":"Установка виджета","level":2},{"id":"parametry","title":"Параметры","level":2},{"id":"recurrent-widget","title":"Параметры. Рекуррентные платежи","level":2},{"id":"escrow-widget","title":"Параметры. Настройки безопасной сделки","level":2},{"id":"dannye-o-platelshchike","title":"Параметры. Данные о плательщике","level":2},{"id":"spisok-tovarov","title":"Параметры. Список товаров","level":2},{"id":"callbacks","title":"События (коллбэки)","level":2}]},"platezhniy-konstructor":{"id":"platezhniy-konstructor","title":"Платежный конструктор","type":"page","audience":"both","group":"root-platezhniy-konstructor","html":"\u003cdiv class=\"imported-api\">\u003cp>PaymentBlocks — конструктор блоков, из которых можно собрать кастомную платежную форму. Вы можете сделать свой визуал формы\u003c/p>\u003cp>Форма оптимизирована для использования в любых браузерах и мобильных устройствах. Внутри блока открывается iframe, который гарантирует безопасность передачи карточных данных и не требует от ТСП сертификации для использования.\u003c/p>\u003cp>На форме поддерживаются все доступные в CloudPayments способы оплаты\u003c/p>\u003cp>Контроль суммы при оплате необходимо осуществлять самостоятельно. Для проверки суммы можно использовать уведомления: \u003ca href=\"https://developers.cloudpayments.ru/#check\" target=\"_blank\" rel=\"noopener noreferrer\">Check\u003c/a> - для проверки суммы до оплаты, \u003ca href=\"https://developers.cloudpayments.ru/#pay\" target=\"_blank\" rel=\"noopener noreferrer\">Pay\u003c/a> - для проверки суммы после оплаты\u003c/p>\u003cp>\u003cbr>\u003c/p>\u003cfigure style=\"text-align:center\">\u003cimg data-image-id=\"6f63b5d1-a0a7-4e4e-b0e8-61d4f6e0e67c\" src=\"https://developers.cloudpayments.ru/images/payment-blocks-5f56bd91.png\" alt=\"payment-blocks\" style=\"width:100%;max-width:100%;height:auto\">\u003c/figure>\u003ch2 id=\"demo-konstruktora\">\u003cstrong>Демо конструктора\u003c/strong>\u003c/h2>\u003cp>Демонстрация работы Конструктора представлена \u003ca href=\"https://widget.cloudpayments.ru/app/demo\" target=\"_blank\" rel=\"noopener noreferrer\">по ссылке\u003c/a>.\u003c/p>\u003cp>Для тестирования можно использовать как \u003ca href=\"https://developers.cloudpayments.ru/#testirovanie\" target=\"_blank\" rel=\"noopener noreferrer\">тестовые карточные данные\u003c/a>, так и реальные. Списания денежных средств не произойдет.\u003c/p>\u003ch2 id=\"otlichiya-ot-vidzheta\">\u003cstrong>Отличия от виджета\u003c/strong>\u003c/h2>\u003cdiv class=\"api-table-scroll\" tabindex=\"0\" aria-label=\"Таблица\">\u003ctable>\u003ctr>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Ключевые отличия\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Виджет\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Платежный конструктор\u003c/p>\u003c/th>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Способ отображения\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Попап\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Встраиваемый на страницу. Можно встроить прямо на страницу заказа\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Кастомизация\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>2 вида:\u003cbr>modern – темная тема,\u003cbr>classic – светлая тема\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Возможность полноценной кастомизации\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Возможность закрытия клиентом\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Есть\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Нет\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Отображение суммы оплаты и назначения платежа\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Да\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Нет\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Возможность обновлять данные платежа\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Нет\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Есть возможность подстраивать оплату под изменения в корзине\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Возможность принудительного unmount\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Нет\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Есть через blocksApp.unmount()\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003ch2 id=\"ustanovka-platezhnogo-konstruktora\">\u003cstrong>Установка платежного конструктора\u003c/strong>\u003c/h2>\u003cp>Для установки конструктора необходимо прописать на сайте скрипт в раздел \u003cstrong>head\u003c/strong>:\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>text\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-1\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-1\" class=\"language-text\">&lt;script src=&quot;https://widget.cloudpayments.ru/bundles/paymentblocks.js&quot;&gt;&lt;/script&gt;\n\u003c/code>\u003c/pre>\u003c/div>\u003cp>Далее необходимо создать DOM-элемент для маунта\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>text\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-2\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-2\" class=\"language-text\">&lt;div id=&quot;element&quot;&gt;&lt;/div&gt;\n\u003c/code>\u003c/pre>\u003c/div>\u003cp>Объявить платежный конструктор (подробнее параметры описываются ниже)\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>text\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-3\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-3\" class=\"language-text\">var blocksApp = new cp.PaymentBlocks(\n    initializationParams, // параметры инициализации -- обязательны для работы конструктора\n    customizationParams // параметры кастомизации -- необязательны\n);\n\u003c/code>\u003c/pre>\u003c/div>\u003cp>И замаунтить его в созданный DOM-элемент\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>text\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-4\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-4\" class=\"language-text\">blocksApp.mount(document.getElementById(&quot;element&quot;));\n\u003c/code>\u003c/pre>\u003c/div>\u003ch2 id=\"demontazh-iz-dom\">\u003cstrong>Демонтаж из DOM\u003c/strong>\u003c/h2>\u003cp>В любой момент можно демонтировать платежный конструктор из DOM-элемента\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>text\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-5\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-5\" class=\"language-text\">blocksApp.unmount();\n\u003c/code>\u003c/pre>\u003c/div>\u003ch2 id=\"sobytiya-kollbeki\">\u003cstrong>События (коллбэки)\u003c/strong>\u003c/h2>\u003cp>Есть возможность получать уведомления о событиях и обрабатывать их, для этого необходимо добавить обработчики соответствующих событий\u003c/p>\u003cp>Для этого после маунта необходимо добавить следующий блок (или его часть)\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>text\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-6\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-6\" class=\"language-text\">blocksApp.on(&quot;destroy&quot;, () =&gt; { // Подписка на событие ошибки оплаты\n     console.log(&quot;destroy&quot;);\n});\nblocksApp.on(&quot;success&quot;, (result) =&gt; { // Подписка на событие успешного результата оплаты\n     console.log(&quot;success&quot;, result);\n});\nblocksApp.on(&quot;fail&quot;, (result) =&gt; { // Подписка на событие уничтожения платежного конструктора\n     console.log(&quot;fail&quot;, result);\n});\n\u003c/code>\u003c/pre>\u003c/div>\u003ch2 id=\"vidy-kollbekov\">\u003cstrong>Виды коллбэков\u003c/strong>\u003c/h2>\u003cdiv class=\"api-table-scroll\" tabindex=\"0\" aria-label=\"Таблица\">\u003ctable>\u003ctr>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Коллбэк\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Условия для формирования\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Код инициализации коллбэка\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Примеры result\u003c/p>\u003c/th>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>destroy\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Уничтожение платежного блока через unmount()\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003ccode>blocksApp.on(&quot;destroy&quot;, () =&gt; { console.log(&quot;destroy&quot;); });\u003c/code>\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>отсутствует\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>success\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Успешная оплата\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003ccode>blocksApp.on(&quot;success&quot;, (result) =&gt; { console.log(&quot;success&quot;, result); });\u003c/code>\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003ccode>{ &quot;type&quot;: &quot;payment&quot;, &quot;data&quot;: { &quot;transactionId&quot;: 4581868029 }, &quot;status&quot;: &quot;success&quot; }\u003c/code>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>fail\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Неуспешная оплата\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003ccode>blocksApp.on(&quot;fail&quot;, (result) =&gt; { console.log(&quot;fail&quot;, result); });\u003c/code>\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003ccode>{ &quot;type&quot;: &quot;payment&quot;, &quot;data&quot;: { &quot;transactionId&quot;: 4581867878, &quot;ReasonCode&quot;: 5206 }, &quot;message&quot;: &quot;3-D Secure авторизация не пройдена&quot;, &quot;status&quot;: &quot;fail&quot; }\u003c/code>\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003ch2 id=\"otpiska\">\u003cstrong>Отписка\u003c/strong>\u003c/h2>\u003cp>Так же доступна возможность отписки от событий\u003c/p>\u003cdiv class=\"api-code-block\"> ss\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-8\" class=\"language-text\">var blocksApp = new cp.PaymentBlocks(\n{  // initializationParams -- параметры инициализации (обязательны для работы конструктора)\n   &quot;publicTerminalId&quot;:&quot;test_api_00000000000000000000002&quot;,\n   &quot;paymentSchema&quot;:&quot;Dual&quot;,\n   &quot;description&quot;:&quot;Тестовая оплата&quot;,\n   &quot;amount&quot;:100.53,\n   &quot;currency&quot;:&quot;RUB&quot;,\n   &quot;externalId&quot;:&quot;123&quot;,\n   &quot;accountId&quot;:&quot;123&quot;,\n   &quot;receiptEmail&quot;:&quot;&quot;,\n   &quot;emailBehavior&quot;:&quot;Optional&quot;,\n   &quot;language&quot;:&quot;ru-RU&quot;\n},\n{  // customizationParams -- параметры кастомизации (не обязательны)\n   &quot;appearance&quot;:{\n      &quot;colors&quot;:{\n         &quot;primaryButtonColor&quot;:&quot;#1dfa05&quot;,\n         &quot;primaryHoverButtonColor&quot;:&quot;#da1ef7&quot;,\n         &quot;primaryButtonTextColor&quot;:&quot;#da1ef7&quot;,\n         &quot;primaryButtonHoverTextColor&quot;:&quot;#da1ef7&quot;,\n         &quot;activeInputColor&quot;:&quot;#da1ef7&quot;,\n         &quot;inputBackground&quot;:&quot;#da1ef7&quot;,\n         &quot;inputColor&quot;:&quot;#1dfa05&quot;,\n         &quot;inputBorderColor&quot;:&quot;#f20505&quot;,\n         &quot;titleColor&quot;:&quot;#da1ef7&quot;,\n         &quot;textColor&quot;:&quot;#1dfa05&quot;,\n         &quot;errorColor&quot;:&quot;#ee05fa&quot;,\n         &quot;skeletonBackground&quot;:&quot;#ee05fa&quot;\n      },\n      &quot;borders&quot;:{\n         &quot;radius&quot;:&quot;80px&quot;\n      }\n   },\n   &quot;components&quot;:{\n      &quot;pay
