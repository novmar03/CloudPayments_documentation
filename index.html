&quot;: &quot;12345&quot;, // переданный InvoiceId\n        &quot;ProviderQrId&quot;: &quot;BB1S004HCK9PFD0F996RJI3208UE&quot;, // переданный id платежной ссылки или QR-кода\n        &quot;Amount&quot;: 10,\n        &quot;Message&quot;: &quot;Created&quot;,     \n        &quot;IsTest&quot;: false\n    },\n    &quot;Success&quot;: true,\n    &quot;Message&quot;: null\n} \u003c/code>\u003c/pre>\u003c/div>\u003ch2 id=\"spisok-uchastnikov-sbp\">Список участников СБП\u003c/h2>\u003cp>\u003cstrong>Описание\u003c/strong>\u003c/p>\u003cp>Метод возвращает список участников системы быстрых платежей (СБП) с учетом платформы клиента. Источником данных является \u003ca href=\"https://widget.cbrpay.ru/#membersListV2\" target=\"_blank\" rel=\"noopener noreferrer\">API виджета СБП\u003c/a>.\u003c/p>\u003cp>\u003cstrong>Заголовок \u003c/strong>\u003c/p>\u003cp>\u003ca href=\"https://api.cloudpayments.ru/sbp/v2/banks/info\" target=\"_blank\" rel=\"noopener noreferrer\">https://api.cloudpayments.ru/sbp/v2/banks/info\u003c/a>\u003c/p>\u003cp>\u003cstrong>Параметры запрос \u003c/strong>\u003c/p>\u003cdiv class=\"api-table-scroll\" tabindex=\"0\" aria-label=\"Таблица\">\u003ctable style=\"table-layout:fixed;width:860px;min-width:0\">\u003ccolgroup>\u003ccol style=\"width:175px\">\u003ccol style=\"width:99px\">\u003ccol style=\"width:159px\">\u003ccol style=\"width:427px\">\u003c/colgroup>\u003ctr>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Параметр\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Тип\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Обязательность\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Назначение\u003c/p>\u003c/th>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>AccountId\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Нет\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Идентификатор аккаунта пользователя\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>IsRenewSubscription\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>boolean\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Нет\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Флаг обновления подписки\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>JsonData\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Нет\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Дополнительные данные в формате JSON\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Platform\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Нет\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Платформа клиента (desktop, ios, android)\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>PublicTerminalId\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Да\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Публичный идентификатор терминала мерчанта\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>SaveCard\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>boolean\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Нет\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Флаг необходимости сохранения карты\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Token\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Нет\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Токен карты для сохранения\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Пример запроса\u003c/strong>\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>json\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-4\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-4\" class=\"language-json\">{\n  &quot;PublicTerminalId&quot;: &quot;pk_1234567890abcdef&quot;,\n  &quot;Platform&quot;: &quot;ios&quot;\n}\u003c/code>\u003c/pre>\u003c/div>\u003cp>\u003cbr>\u003c/p>\u003cp>\u003cstrong>Параметры ответа\u003c/strong>\u003c/p>\u003cdiv class=\"api-table-scroll\" tabindex=\"0\" aria-label=\"Таблица\">\u003ctable style=\"table-layout:fixed;width:913px;min-width:0\">\u003ccolgroup>\u003ccol style=\"width:201px\">\u003ccol style=\"width:154px\">\u003ccol style=\"width:558px\">\u003c/colgroup>\u003ctr>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Параметр\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Тип\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Назначение\u003c/p>\u003c/th>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Success\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>boolean\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Флаг успешности выполнения запроса\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Message\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Сообщение об ошибке (null при успехе)\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Model\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>List\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Список данных об участниках СБП\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Model.Source\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Источник данных\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Model.Version\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Версия спецификации ответа\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Model.Members\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>List\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Список участников СБП\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Model.Members.Id\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Уникальный идентификатор члена СБП\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Model.Members.Name\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Полное название банка/члена СБП\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Model.Members.Logo\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>URL логотипа банка\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Model.Members.Url\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>URL для перехода в приложение или веб-версию банка\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Пример ответа \u003c/strong>\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>json\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-5\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-5\" class=\"language-json\">{\n  &quot;Success&quot;: true,\n  &quot;Message&quot;: null,\n  &quot;Model&quot;: [\n    {\n      &quot;Source&quot;: &quot;widget&quot;,\n      &quot;Version&quot;: &quot;2.0&quot;,\n      &quot;Members&quot;: [\n        {\n          &quot;id&quot;: &quot;100000000111&quot;,\n          &quot;logo&quot;: &quot;https://qr.nspk.ru/proxyapp/logo/bank100000000111.png&quot;,\n          &quot;name&quot;: &quot;Сбербанк&quot;,\n          &quot;url&quot;: &quot;bank100000000111://qr.nspk.ru/{QRC_ID}{QUERY_STRING}&quot;\n        },\n        {\n          &quot;id&quot;: &quot;100000000004&quot;,\n          &quot;logo&quot;: &quot;https://qr.nspk.ru/proxyapp/logo/bank100000000004.png&quot;,\n          &quot;name&quot;: &quot;Т-Банк&quot;,\n          &quot;url&quot;: &quot;https://www.tinkoff.ru/mybank/payments/qr-pay/{QRC_ID}{QUERY_STRING}&quot;\n        },\n        {\n          &quot;id&quot;: &quot;100000000005&quot;,\n          &quot;logo&quot;: &quot;https://qr.nspk.ru/proxyapp/logo/bank100000000005.png&quot;,\n          &quot;name&quot;: &quot;Банк ВТБ&quot;,\n          &quot;url&quot;: &quot;https://online.vtb.ru/i/paymentSbp/{QRC_ID}{QUERY_STRING}&quot;\n        }\n      ]\n    }\n  ]\n}\u003c/code>\u003c/pre>\u003c/div>\u003ch2 id=\"возврат\">Возврат\u003c/h2>\u003cp>Метод возврата по операциям СБП аналогичен методу возврата ДС по операциям интернет-эквайринга - \u003ca href=\"https://developers.cloudpayments.ru/#vozvrat-deneg\" target=\"_blank\" rel=\"noopener noreferrer\">см. API. Возврат денег\u003c/a>.\u003c/p>\u003cp>Возвраты СБП работают в асинхронном режиме. Финальный статус возврата СБП (“Завершен”/“Отклонен”) можно получить через \u003ca href=\"https://developers.cloudpayments.ru/#refund\" target=\"_blank\" rel=\"noopener noreferrer\">Refund\u003c/a>-уведомление уже после создания транзакции возврата, а не в ответе на сам запрос возврата.\u003c/p>\u003ch2 id=\"уведомления\">Уведомления\u003c/h2>\u003cp>Уведомления по операциям СБП аналогичны уведомлениям по операциям интернет-эквайринга - \u003ca href=\"https://developers.cloudpayments.ru/#uvedomleniya\" target=\"_blank\" rel=\"noopener noreferrer\">см. Уведомления\u003c/a>\u003c/p>\u003cp>Параметр, отвечающий за тип операции в уведомлении – \u003ccode>PaymentMethod\u003c/code> (для СБП указано значение \u003ccode>Sbp\u003c/code>)\u003c/p>\u003cp>Если включены Check-уведомления, то Check будет направляться до формирования QR/ссылки для проверки корректности данных.\u003c/p>\u003ch2 id=\"создание-прямой-ссылки-и-списка-банков\">Создание прямой ссылки и списка банков\u003c/h2>\u003cp>Прямая ссылка существует для того, чтобы перенаправить плательщика при клике на ссылку в конкретное приложение банка.\u003c/p>\u003cp>Список банков можно получить из массива элементов в ответе \u003ca href=\"https://developers.cloudpayments.ru/#spisok-uchastnikov-sbp\" target=\"_blank\" rel=\"noopener noreferrer\">POST: /sbp/v2/banks/info\u003c/a> в параметре \u003ccode>Model.Members\u003c/code>\u003c/p>\u003cp>CloudPayments использует список участников из \u003ca href=\"https://widget.cbrpay.ru/#membersListV2\" target=\"_blank\" rel=\"noopener noreferrer\">API виджета СБП\u003c/a>.\u003c/p>\u003ch3 id=\"trebovaniya-sbp\">\u003cstrong>Требования СБП\u003c/strong>\u003c/h3>\u003cp>\u003cstrong>Нельзя изменять:\u003c/strong>\u003c/p>\u003col start=\"1\">\u003cli>\u003cp>\u003cstrong>Порядок банков\u003c/strong> — сохранение оригинального порядка реализовано на стороне CloudPayments;\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>Названия и логотипы\u003c/strong>;\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>Ссылки для перехода в банковские приложения\u003c/strong>.\u003c/p>\u003c/li>\u003c/ol>\u003cp>\u003cstrong>Обязательно:\u003c/strong>\u003c/p>\u003col start=\"1\">\u003cli>\u003cp>Сохранять функцию поиска по банкам;\u003c/p>\u003c/li>\u003cli>\u003cp>Для кэшированных данных (реализовано на стороне CloudPayments):\u003c/p>\u003cul>\u003cli>\u003cp>Использовать только актуальные данные (≤ 24 часов);\u003c/p>\u003c/li>\u003cli>\u003cp>При ошибке запроса — брать последние рабочие данные.\u003c/p>\u003c/li>\u003c/ul>\u003c/li>\u003c/ol>\u003cp>\u003cstrong>Разрешено:\u003c/strong>\u003c/p>\u003cul>\u003cli>\u003cp>Показывать первыми 3 банка, которые клиент выбирал ранее.\u003c/p>\u003c/li>\u003c/ul>\u003ch3 id=\"trebovaniya-k-otobrazheniyu-spiska-bankov-sbp\">\u003cstrong>Требования к отображению списка банков СБП\u003c/strong>\u003c/h3>\u003cp>\u003cstrong>Порядок элементов списка\u003c/strong>\u003c/p>\u003col start=\"1\">\u003cli>\u003cp>Элементы на странице списка должны быть расположены строго в порядке, полученном в ответе на запрос \u003ca href=\"https://developers.cloudpayments.ru/#spisok-uchastnikov-sbp\" target=\"_blank\" rel=\"noopener noreferrer\">POST /sbp/v2/banks/info\u003c/a>.\u003c/p>\u003c/li>\u003cli>\u003cp>Исключение:\u003c/p>\u003cul>\u003cli>\u003cp>Ранее выбранные банки (не более 3) могут отображаться в начале списка.\u003c/p>\u003c/li>\u003cli>\u003cp>Остальные банки следуют в исходном порядке, за исключением уже добавленных в начало.\u003c/p>\u003c/li>\u003c/ul>\u003c/li>\u003c/ol>\u003cp>\u003cstrong>Логотип\u003c/strong>\u003c/p>\u003cp>Логотип банка должен быть взят из ответа \u003ca href=\"https://developers.cloudpayments.ru/#spisok-uchastnikov-sbp\" target=\"_blank\" rel=\"noopener noreferrer\">POST /sbp/v2/banks/info\u003c/a>, параметр - \u003ccode>Model.Members.logo\u003c/code>\u003c/p>\u003cp>\u003cstrong>Название\u003c/strong>\u003c/p>\u003cp>Название банка должно быть взято из ответа \u003ca href=\"https://developers.cloudpayments.ru/#spisok-uchastnikov-sbp\" target=\"_blank\" rel=\"noopener noreferrer\">POST /sbp/v2/banks/info\u003c/a>, параметр - \u003ccode>Model.Members.Name\u003c/code>\u003c/p>\u003cp>\u003cstrong>Ссылка для перехода в приложение банка\u003c/strong>\u003c/p>\u003cp>Для формирования прямой ссылки на переход в приложение банка необходимо выполнить следующие шаги:\u003c/p>\u003col start=\"1\">\u003cli>\u003cp>Получить ссылку на оплату из ответа \u003ca href=\"https://developers.cloudpayments.ru/#sbp-poluchenie-ssylki-dlya-oplaty\" target=\"_blank\" rel=\"noopener noreferrer\">POST /payments/qr/sbp/link\u003c/a>, параметр - \u003ccode>Model.QrUrl\u003c/code>;\u003c/p>\u003c/li>\u003cli>\u003cp>Получить шаблон ссылки на банк из ответа \u003ca href=\"https://developers.cloudpayments.ru/#spisok-uchastnikov-sbp\" target=\"_blank\" rel=\"noopener noreferrer\">POST /sbp/v2/banks/info\u003c/a>, параметр - \u003ccode>Model.Members.url\u003c/code>;\u003c/p>\u003c/li>\u003cli>\u003cp>Обработать шаблон ссылки:\u003c/p>\u003cul>\u003cli>\u003cp>Удалить из шаблона последний элемент пути: \u003ccode>{QRC_ID}{QUERY_STRING}\u003c/code>;\u003c/p>\u003c/li>\u003c/ul>\u003c/li>\u003cli>\u003cp>Сформировать итоговую ссылку:\u003c/p>\u003cul>\u003cli>\u003cp>К оставшейся части шаблона конкатенировать путь и query-параметры из ссылки на оплату;\u003c/p>\u003c/li>\u003c/ul>\u003c/li>\u003c/ol>\u003cp>\u003cstrong>Пример преобразования:\u003c/strong>\u003c/p>\u003col start=\"1\">\u003cli>\u003cp>Ссылка на оплату: \u003ccode>https://qr.nspk.ru/AD1000XXXXX1000?type=02&amp;bank=100000000004&amp;sum=1299900&amp;cur=RUB&amp;crc=8DA8\u003c/code>\u003c/p>\u003c/li>\u003cli>\u003cp>Шаблон ссылки: \u003ccode>https://online.vtb.ru/i/paymentSbp/{QRC_ID}{QUERY_STRING}\u003c/code>\u003c/p>\u003c/li>\u003cli>\u003cp>Результат: \u003ccode>https://online.vtb.ru/i/paymentSbp/AD1000XXXXX1000?type=02&amp;bank=100000000004&amp;sum=1299900&amp;cur=RUB&amp;crc=8DA8\u003c/code>\u003c/p>\u003c/li>\u003c/ol>\u003cp>\u003cbr>\u003c/p>\u003c/div>","toc":[{"id":"получение-ссылки-для-оплаты","title":"Получение ссылки для оплаты","level":2},{"id":"opisanie","title":"Описание","level":3},{"id":"adres-metoda","title":"Адрес метода","level":3},{"id":"sbp-parametry-zaprosa","title":"Параметры запроса","level":3},{"id":"sbp-primer-zaprosa","title":"Пример запроса","level":3},{"id":"primer-otveta","title":"Пример ответа","level":3},{"id":"получение-qr-кода-для-оплаты","title":"Получение QR-кода для оплаты","level":2},{"id":"spisok-uchastnikov-sbp","title":"Список участников СБП","level":2},{"id":"возврат","title":"Возврат","level":2},{"id":"уведомления","title":"Уведомления","level":2},{"id":"создание-прямой-ссылки-и-списка-банков","title":"Создание прямой ссылки и списка банков","level":2},{"id":"trebovaniya-sbp","title":"Требования СБП","level":3},{"id":"trebovaniya-k-otobrazheniyu-spiska-bankov-sbp","title":"Требования к отображению списка банков СБП","level":3}],"type":"page","audience":"developer"},"tech/methods/digital":{"id":"tech/methods/digital","title":"Цифровой рубль","parentId":"tech/methods","group":"tech","html":"\u003cdiv class=\"imported-api\">\u003cfigure style=\"text-align:center\">\u003cimg src=\"static/img/editor/e61c524d59d7162b27d3557a285330a6bfba63de9309ffccb95c423d7bfb9345.jpg\" alt=\"ЦР.jpg\" style=\"width:100%;max-width:100%;height:auto\">\u003c/figure>\u003ch2 id=\"прием-цифровых-рублей-с-1-сентября-2026-года\">Прием цифровых рублей с 1 сентября 2026 года\u003c/h2>\u003cp>Цифровой рубль — цифровая форма российской национальной валюты, которую выпускает Банк России. Он равен наличному рублю и используется для платежей через платформу Банка России.\u003c/p>\u003ch2 id=\"на-кого-распространяются-требования\">На кого распространяются требования\u003c/h2>\u003cp>С 1 сентября 2026 года принимать цифровые рубли должны будут продавцы и исполнители, которые одновременно:\u003c/p>\u003cul>\u003cli>\u003cp>Получили за предыдущий год выручку более 120 млн рублей\u003c/p>\u003c/li>\u003cli>\u003cp>Работают с банком, признанным значимым на рынке платежных услуг\u003c/p>\u003c/li>\u003cli>\u003cp>Принимают оплату от физических лиц\u003c/p>\u003c/li>\u003c/ul>\u003ch2 id=\"как-будут-расширяться-требования\">Как будут расширяться требования\u003c/h2>\u003cp>С 1 сентября 2027 года требования распространятся на компании с выручкой более 30 млн рублей, а с 1 сентября 2028 года — на остальных продавцов с выручкой от 20 млн рублей.\u003c/p>\u003ch2 id=\"на-кого-требования-не-распространяются\">На кого требования не распространяются\u003c/h2>\u003cp>Компании с совокупной годовой выручкой менее 20 млн рублей не обязаны принимать цифровые рубли.\u003c/p>\u003cp>Требование также не распространяется:\u003c/p>\u003cul>\u003cli>\u003cp>На отдельные торговые точки с выручкой менее 5 млн рублей в год, даже если совокупная выручка всей компании превышает 20 млн рублей\u003c/p>\u003c/li>\u003cli>\u003cp>На точки продаж без доступа к интернету\u003c/p>\u003c/li>\u003c/ul>\u003ch2 id=\"прием-цифровых-рублей-в-cloudpayments\">Прием цифровых рублей в CloudPayments\u003c/h2>\u003cp>CloudPayments планирует запустить прием разовых платежей в цифровых рублях с 1 сентября 2026 года. Операции будут отображаться в Личном кабинете и включаться в реестры и отчетность.\u003c/p>\u003cp>До конца 2026 года комиссия за прием платежей в цифровых рублях составит 0%. Регулярные платежи и сохранение счета для повторных оплат на старте поддерживаться не будут.\u003c/p>\u003ch2 id=\"как-подключить\">Как подключить\u003c/h2>\u003cp>Если вы уже принимаете платежи через CloudPayments, обратитесь к своему менеджеру или напишите в чат поддержки в Личном кабинете.\u003c/p>\u003cp>Если вы еще не работаете с CloudPayments, оставьте \u003ca href=\"https://cloudpayments.ru/#section-request\" target=\"_blank\" rel=\"noopener noreferrer\">заявку на подключение\u003c/a>.\u003c/p>\u003cp>Документацию по интеграции мы предоставим действующим клиентам по запросу, а новым — после подключения.\u003c/p>\u003cp>\u003cbr>\u003c/p>\u003c/div>","toc":[{"id":"прием-цифровых-рублей-с-1-сентября-2026-года","title":"Прием цифровых рублей с 1 сентября 2026 года","level":2},{"id":"на-кого-распространяются-требования","title":"На кого распространяются требования","level":2},{"id":"как-будут-расширяться-требования","title":"Как будут расширяться требования","level":2},{"id":"на-кого-требования-не-распространяются","title":"На кого требования не распространяются","level":2},{"id":"прием-цифровых-рублей-в-cloudpayments","title":"Прием цифровых рублей в CloudPayments","level":2},{"id":"как-подключить","title":"Как подключить","level":2}],"type":"page","audience":"developer"},"tech/methods/sberpay":{"id":"tech/methods/sberpay","title":"СберПэй","parentId":"tech/methods","group":"tech","html":"\u003cdiv class=\"imported-api\">\u003cfigure style=\"text-align:center\">\u003cimg src=\"static/img/editor/b4a7c45430e3a369c46c6a966f104fa46328ebbe18b335ac60a24a8b18286259.png\" alt=\"sberpay.png\" style=\"width:100%;max-width:100%;height:auto\">\u003c/figure>\u003cp>CloudPayments предлагает метод оплаты в один клик через SberPay. Покупатель может выбрать любой счет для списания в приложении Сбера, а также копить баллы «Спасибо» для последующих покупок.\u003c/p>\u003ch2 id=\"получение-ссылки-для-оплаты\">Получение ссылки для оплаты\u003c/h2>\u003ch3 id=\"opisanie\">\u003cstrong>Описание\u003c/strong>\u003c/h3>\u003cp>Метод для проведения оплаты по SberPay.\u003cbr>При оплате с мобильного устройства в ответе вернётся параметр \u003ccode>QrUrl\u003c/code> с URL-адресом для перенаправления клиента. Для проведения платежа клиента надо перенаправить на полученный URL-адрес.\u003cbr>При оплате с десктопа на номер телефона, который указан в параметре запроса \u003ccode>Phone\u003c/code>, будет отправлен push либо SMS-сообщение со ссылкой на оплату.\u003c/p>\u003cp>Авторизация \u003ca href=\"https://en.wikipedia.org/wiki/Basic_access_authentication\" target=\"_blank\" rel=\"noopener noreferrer\">HTTP Basic Auth\u003c/a> для данного метода не требуется. Вместо неё используется параметр идентификатора терминала \u003ccode>PublicId\u003c/code> в теле запроса.\u003c/p>\u003ch3 id=\"adres-metoda\">\u003cstrong>Адрес метода\u003c/strong>\u003c/h3>\u003cp>\u003ca href=\"https://api.cloudpayments.ru/payments/qr/sberpay/link\" target=\"_blank\" rel=\"noopener noreferrer\">https://api.cloudpayments.ru/payments/qr/sberpay/link\u003c/a>\u003c/p>\u003ch3 id=\"sberpay-parametry-zaprosa\">\u003cstrong>Параметры запроса\u003c/strong>\u003c/h3>\u003cdiv class=\"api-table-scroll\" tabindex=\"0\" aria-label=\"Таблица\">\u003ctable style=\"table-layout:fixed;width:849px;min-width:0\">\u003ccolgroup>\u003ccol style=\"width:195px\">\u003ccol style=\"width:101px\">\u003ccol style=\"width:160px\">\u003ccol style=\"width:393px\">\u003c/colgroup>\u003ctr>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Параметр\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Формат\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Применение\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Описание\u003c/p>\u003c/th>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>PublicId\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Идентификатор сайта, который находится в ЛК\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Amount\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Decimal\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Cумма платежа в рублях, разделитель точка. Количество не нулевых знаков после точки – 2\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Currency\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Валюта: RUB (см. \u003ca href=\"https://developers.cloudpayments.ru/#spisok-valyut\" target=\"_blank\" rel=\"noopener noreferrer\">справочник\u003c/a>)\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Description\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Назначение платежа в свободной форме\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>AccountId\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Идентификатор пользователя, используется для создания подписки и получения токена\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Email\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>E-mail плательщика, на который будет отправлена квитанция об оплате\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>JsonData\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Json\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Любые другие данные, которые будут связаны с транзакцией, в том числе \u003ca href=\"https://developers.cloudpayments.ru/#rekurrentnye-platezhi-podpiska\" target=\"_blank\" rel=\"noopener noreferrer\">инструкции\u003c/a> для создания подписки или формирования \u003ca href=\"https://developers.cloudpayments.ru/#format-peredachi-dannyh-dlya-onlayn-cheka\" target=\"_blank\" rel=\"noopener noreferrer\">онлайн-чека\u003c/a> должны обёртываться в объект \u003ccode>cloudpayments\u003c/code>. Мы зарезервировали названия следующих параметров и отображаем их содержимое в реестре операций, выгружаемом в Личном Кабинете: \u003ccode>name\u003c/code>, \u003ccode>firstName\u003c/code>, \u003ccode>middleName\u003c/code>, \u003ccode>lastName\u003c/code>, \u003ccode>nick\u003c/code>, \u003ccode>phone\u003c/code>, \u003ccode>address\u003c/code>, \u003ccode>comment\u003c/code>, \u003ccode>birthDate\u003c/code>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>InvoiceId\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Идентификатор/номер счета.\u003cbr>\u003cbr>Приходит в Check-уведомлении и может использоваться для сверки номера заказа\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Scheme\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Enum String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Схема проведения платежа (см. \u003ca href=\"https://developers.cloudpayments.ru/#vidy-operatsiy\" target=\"_blank\" rel=\"noopener noreferrer\">Виды операций\u003c/a>).\u003cbr>Возможные значения: \u003ccode>charge\u003c/code> - одностадийная оплата; \u003ccode>auth\u003c/code> - двухстадийная оплата\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>SuccessRedirectUrl\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Url для перенаправления клиента после успешной оплаты.\u003cbr>После проведения платежа, клиент будет перенаправлен на указанный адрес из мобильного приложения Банка.\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>IpAddress\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>IP-адрес плательщика\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Os\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Операционная система устройства плательщика.\u003cbr>Пример значения: \u003ccode>Android\u003c/code>, \u003ccode>iOS\u003c/code>, \u003ccode>Windows\u003c/code>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Webview\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Bool\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Признак открытия браузера в режиме webview.\u003cbr>Возможные значения: \u003ccode>true\u003c/code> - для оплат через webview \u003ccode>false\u003c/code> - для оплат без webview\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Device\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Признак устройства плательщика.\u003cbr>Возможные значения:\u003cbr>\u003ccode>MobileApp\u003c/code> - вызов оплаты из мобильного приложения\u003cbr>\u003ccode>DesktopWeb\u003c/code> - вызов оплаты из браузера с десктопа\u003cbr>\u003ccode>Mobile\u003c/code> - вызов из браузера с мобильного устройства\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Phone\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Номер телефона плательщика.\u003cbr>Пример значения: \u003ccode>+79001234567\u003c/code>\u003cbr>Обязательное значение для оплаты из браузера с десктопа\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Browser\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Название браузера клиента на основании userAgent браузера.\u003cbr>Пример значения: \u003ccode>Chrome\u003c/code>, \u003ccode>Firefox\u003c/code>, \u003ccode>MIUI Browser\u003c/code>, \u003ccode>Opera\u003c/code>\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cp>В ответ сервер возвращает JSON с тремя составляющими:\u003c/p>\u003cul>\u003cli>\u003cp>поле \u003cstrong>success\u003c/strong> — результат запроса;\u003c/p>\u003c/li>\u003cli>\u003cp>поле \u003cstrong>message\u003c/strong> — описание ошибки;\u003c/p>\u003c/li>\u003cli>\u003cp>объект \u003cstrong>model\u003c/strong> — расширенная информация.\u003c/p>\u003c/li>\u003c/ul>\u003cp>Возможные варианты ответа:\u003c/p>\u003col start=\"1\">\u003cli>\u003cp>Некорректно сформирован запрос:\u003c/p>\u003cul>\u003cli>\u003cp>\u003cstrong>success\u003c/strong> — false\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>message\u003c/strong> — описание ошибки\u003c/p>\u003c/li>\u003c/ul>\u003c/li>\u003cli>\u003cp>Транзакция отклонена:\u003c/p>\u003cul>\u003cli>\u003cp>\u003cstrong>success\u003c/strong> — false\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>model\u003c/strong> — информация о транзакции и код ошибки\u003c/p>\u003c/li>\u003c/ul>\u003c/li>\u003cli>\u003cp>Транзакция принята:\u003c/p>\u003cul>\u003cli>\u003cp>\u003cstrong>success\u003c/strong> — true\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>model\u003c/strong> — информация о транзакции\u003c/p>\u003c/li>\u003c/ul>\u003c/li>\u003c/ol>\u003caside class=\"api-callout \" role=\"note\">\u003cstrong class=\"callout-label\">Информация\u003c/strong>\u003cp>Результат запроса (поле Success) не отражает статус транзакции, а лишь свидетельствует об успешности/неуспешности запроса API. Статус транзакции отражен в дополнительном поле Status, также его можно узнать в результате получения \u003ca href=\"https://developers.cloudpayments.ru/#uvedomleniya\" target=\"_blank\" rel=\"noopener noreferrer\">уведомлений\u003c/a>. Интерпретацию статусов транзакции смотрите в \u003ca href=\"https://developers.cloudpayments.ru/#statusy-operatsiy\" target=\"_blank\" rel=\"noopener noreferrer\">справочнике\u003c/a>.\u003c/p>\u003c/aside>\u003ch3 id=\"sberpay-primer-zaprosa\">\u003cstrong>Пример запроса\u003c/strong>\u003c/h3>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>json\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-1\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-1\" class=\"language-json\">{\n    &quot;PublicId&quot;: &quot;test_api_00000000000000000000002&quot;,\n    &quot;Os&quot; : &quot;Windows 7 home&quot;,\n    &quot;Webview&quot; : true,\n    &quot;Browser&quot; : &quot;Microsoft Edge 24.101&quot;,\n    &quot;Amount&quot;: 1000,\n    &quot;Currency&quot;: &quot;RUB&quot;,\n    &quot;Description&quot;: &quot;Оплата по SberPay&quot;,\n    &quot;AccountId&quot;: &quot;email@email.com&quot;,\n    &quot;Email&quot;: &quot;email@email.com&quot;,\n    &quot;InvoiceId&quot;: &quot;order_no4009&quot;,\n    &quot;Scheme&quot;: &quot;charge&quot;,\n    &quot;Device&quot;: &quot;DesktopWeb&quot;,\n    &quot;Phone&quot;: &quot;79001234567&quot;,\n    &quot;SuccessRedirectUrl&quot;: &quot;https://cp.ru&quot;,\n}\u003c/code>\u003c/pre>\u003c/div>\u003cp>\u003cbr>\u003c/p>\u003ch3 id=\"primer-otveta\">\u003cstrong>Пример ответа\u003c/strong>\u003c/h3>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>json\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-2\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-2\" class=\"language-json\">{\n    &quot;Model&quot;: {\n        &quot;QrUrl&quot;: &quot;sberpay://invoicing/v2?bankInvoiceId=5628ecb3ef514a48abed24e16f818f03&amp;operationType=Web2App&quot;, // будет содержать url-адрес для редиректа\n        &quot;QrImage&quot;: null,                \n        &quot;TransactionId&quot;: 11122233344, // id транзакции CloudPayments\n        &quot;Amount&quot;: 10\n    },\n    &quot;Success&quot;: true,\n    &quot;Message&quot;: null\n}\u003c/code>\u003c/pre>\u003c/div>\u003cp>\u003cbr>\u003c/p>\u003c/div>","toc":[{"id":"получение-ссылки-для-оплаты","title":"Получение ссылки для оплаты","level":2},{"id":"opisanie","title":"Описание","level":3},{"id":"adres-metoda","title":"Адрес метода","level":3},{"id":"sberpay-parametry-zaprosa","title":"Параметры запроса","level":3},{"id":"sberpay-primer-zaprosa","title":"Пример запроса","level":3},{"id":"primer-otveta","title":"Пример ответа","level":3}],"type":"page","audience":"developer"},"tech/methods/mirpay":{"id":"tech/methods/mirpay","title":"МирПэй","parentId":"tech/methods","group":"tech","html":"\u003cdiv class=\"imported-api\">\u003cfigure style=\"text-align:center\">\u003cimg src=\"static/img/editor/4b106281b72b8d9c3f853956b2a247a84eb727045225ad8c606a981829055319.png\" alt=\"mirpay.png\" style=\"width:100%;max-width:100%;height:auto\">\u003c/figure>\u003cp>MIR Pay позволяет оплачивать покупки в одно касание картами платежной системы «МИР». Кнопка Pay-сервиса отображается на платёжной странице рядом с другими способами оплаты.\u003c/p>\u003ch2 id=\"виды-интеграций\">Виды интеграций\u003c/h2>\u003cp>CloudPayments предлагает подключение MIR Pay по упрощенной схеме на странице оплаты (с помощью платежного виджета) и через мобильный SDK. Дополнительно интегрироваться с сервисом платежной системы «МИР» не нужно.\u003c/p>\u003cp>В ближайшее время MIR Pay будет доступен для других видов интеграций: платежные блоки, заказы и платежные ссылки.\u003c/p>\u003ch2 id=\"подключение-мирпэй\">Подключение MIR Pay\u003c/h2>\u003cp>\u003cstrong>Для включения кнопки MIR Pay в платежном виджете и мобильном SDK необходимо:\u003c/strong>\u003c/p>\u003cp>Переключить «фича-тоггл» MIR Pay в Личном кабинете, в настройках сайта или написать в службу поддержки CloudPayments.\u003c/p>\u003cfigure style=\"text-align:center\">\u003cimg src=\"static/img/editor/eb3ef1c62bb3423e42091288e6d6e16d48d7f98da38a45b706da30a76d7dd345.png\" alt=\"mir_paysetting.png\" style=\"width:100%;max-width:100%;height:auto\">\u003c/figure>\u003ch3 id=\"protsess-oplaty-s-pomoschyu-mir-pay\">\u003cstrong>Процесс оплаты с помощью MIR Pay\u003c/strong>\u003c/h3>\u003cul>\u003cli>\u003cp>Покупатель после нажатия кнопки «Оплатить» переходит на виджет CloudPayments, где может выбрать оплату по MIR Pay без ввода банковских реквизитов. \u003c/p>\u003c/li>\u003cli>\u003cp>После оплаты покупатель видит сообщение об успешном платеже и автоматически возвращается обратно на сайт. Продавцу приходит уведомление о транзакции.\u003c/p>\u003c/li>\u003cli>\u003cp>Продавцу не нужно интегрироваться с сервисом платежной системы «МИР», все необходимое реализовано на стороне CloudPayments.\u003c/p>\u003c/li>\u003c/ul>\u003cp>\u003cbr>\u003c/p>\u003c/div>","toc":[{"id":"виды-интеграций","title":"Виды интеграций","level":2},{"id":"подключение-мирпэй","title":"Подключение MIR Pay","level":2},{"id":"protsess-oplaty-s-pomoschyu-mir-pay","title":"Процесс оплаты с помощью MIR Pay","level":3}],"type":"page","audience":"developer"},"tech/methods/dolyami":{"id":"tech/methods/dolyami","title":"Долями","parentId":"tech/methods","group":"tech","html":"\u003cdiv class=\"imported-api\">\u003cp>CloudPayments предлагает метод оплаты Долями. Пользователь может разделить оплату на четыре части, а магазин получит всю сумму на следующий рабочий день.\u003c/p>\u003cfigure style=\"text-align:center\">\u003cimg src=\"static/img/editor/6af0d25e5374b7120c5d38cf6f927b27821140f74a0bef0e13b7e3c0f4aae2ec.png\" alt=\"dolyami.png\" style=\"width:100%;max-width:100%;height:auto\">\u003c/figure>\u003ch2 id=\"sposoby-integratsiy\">\u003cstrong>Способы интеграций\u003c/strong>\u003c/h2>\u003cul>\u003cli>\u003cp>в платежном \u003ca href=\"https://developers.cloudpayments.ru/#platezhnyy-vidzhet\" target=\"_blank\" rel=\"noopener noreferrer\">виджете\u003c/a> и \u003ca href=\"https://cloudpayments.ru/integration/cms\" target=\"_blank\" rel=\"noopener noreferrer\">CMS\u003c/a>-/\u003ca href=\"https://cloudpayments.ru/integration/crm\" target=\"_blank\" rel=\"noopener noreferrer\">CRM\u003c/a>-модулях\u003c/p>\u003c/li>\u003cli>\u003cp>в \u003ca href=\"https://cloudpayments.ru/infoshop\" target=\"_blank\" rel=\"noopener noreferrer\">CloudИнфошопе\u003c/a> (формирование витрины из Личного кабинета)\u003c/p>\u003c/li>\u003cli>\u003cp>в \u003ca href=\"https://developers.cloudpayments.ru/#sozdanie-scheta-dlya-otpravki-po-pochte\" target=\"_blank\" rel=\"noopener noreferrer\">заказах\u003c/a>\u003c/p>\u003c/li>\u003cli>\u003cp>в платежных ссылках, которые формируются из Личного кабинета\u003c/p>\u003c/li>\u003cli>\u003cp>в API\u003c/p>\u003c/li>\u003c/ul>\u003ch2 id=\"podklyuchenie\">\u003cstrong>Подключение\u003c/strong>\u003c/h2>\u003cp>Для подключения способа оплаты необходимо обратиться к курирующему менеджеру или написать на адрес электронной почты – \u003ca href=\"mailto:assistant@cp.ru\">assistant@cp.ru\u003c/a>\u003c/p>\u003cp>По техническим вопросам обращайтесь в службу поддержки – \u003ca href=\"mailto:support@cp.ru\">support@cp.ru\u003c/a>\u003c/p>\u003ch2 id=\"vstraivaemaya-knopka-oplaty\">\u003cstrong>Встраиваемая кнопка оплаты\u003c/strong>\u003c/h2>\u003cp>Вы можете добавить на свой сайт кнопку оплаты Долями. Данный способ работает через публичный API CloudPayments и позволяет встраивать на вашей форме отдельную кнопку оплаты.\u003c/p>\u003cp>Интерфейс работает по адресу \u003ca href=\"http://api.cloudpayments.ru/\" target=\"_blank\" rel=\"noopener noreferrer\">api.cloudpayments.ru\u003c/a>\u003c/p>\u003ch3 id=\"metod-post-payments-altpay-pay\">\u003cstrong>Метод POST /payments/altpay/pay\u003c/strong>\u003c/h3>\u003cp>Метод предназначен для получения ссылки на оплату через заполнение заявки Долями\u003c/p>\u003cp>Авторизация \u003ca href=\"https://en.wikipedia.org/wiki/Basic_access_authentication\" target=\"_blank\" rel=\"noopener noreferrer\">HTTP Basic Auth\u003c/a> для данного метода отсутствует. Вместо нее используется параметр идентификатора терминала \u003ccode>PublicId\u003c/code> в теле запроса.\u003c/p>\u003cp>\u003cstrong>URL:\u003c/strong> /payments/altpay/pay\u003c/p>\u003cp>\u003cstrong>METHOD:\u003c/strong> POST\u003c/p>\u003cp>\u003cstrong>BODY:\u003c/strong> Запрос обязательно имеет не пустое тело запроса.\u003c/p>\u003cdiv class=\"api-table-scroll\" tabindex=\"0\" aria-label=\"Таблица\">\u003ctable style=\"table-layout:fixed;width:1125px;min-width:0\">\u003ccolgroup>\u003ccol style=\"width:173px\">\u003ccol style=\"width:239px\">\u003ccol style=\"width:164px\">\u003ccol style=\"width:236px\">\u003ccol style=\"width:313px\">\u003c/colgroup>\u003ctr>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Параметр\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Формат\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Применение\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Описание\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Пример\u003c/p>\u003c/th>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>PublicId\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Идентификатор терминала.\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003ccode>pk_0fe1d5c9cb47e8cf8d96102201419\u003c/code>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>AltPayType\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Тип оплаты.\u003cbr>Необходимо передавать значение &quot;TcsBnplDolyame&quot;.\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003ccode>TcsBnplDolyame\u003c/code>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Amount\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Number\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Cумма платежа, разделитель точка. Количество не нулевых знаков после точки – 2.\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003ccode>1000\u003c/code>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Scheme\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>enum\u003cbr>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Схема проведения платежа (см. \u003ca href=\"https://developers.cloudpayments.ru/#vidy-operatsiy\" target=\"_blank\" rel=\"noopener noreferrer\">Виды операций\u003c/a>).\u003cbr>Возможные значения:\u003cbr>\u003ccode>0\u003c/code> - одностадийная оплата;\u003cbr>\u003ccode>1\u003c/code> - двухстадийная оплата\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003ccode>0\u003c/code>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>InvoiceId\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Идентификатор заказа/номер счета.\u003cbr>Приходит в \u003ca href=\"https://developers.cloudpayments.ru/#check\" target=\"_blank\" rel=\"noopener noreferrer\">Check\u003c/a>-уведомлении и может использоваться для сверки номера заказа.\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003ccode>462651419\u003c/code>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Description\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Описание заказа/оплаты в свободной форме\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003ccode>Оплата товаров в https://example.com\u003c/code>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>AccountId\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Идентификатор плательщика\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003ccode>usermail@example.com\u003c/code>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Email\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>E-mail плательщика, на который будет отправлена квитанция об оплате\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003ccode>usermail@example.com\u003c/code>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>SuccessRedirectUrl\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Ссылка для возврата в случае успешной оплаты\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003ccode>https://success-page.ru\u003c/code>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>FailRedirectUrl\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Ссылка для возврата в случае неуспешной оплаты\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003ccode>https://fail-page.ru\u003c/code>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>JsonData\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Json\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Любые другие данные, которые будут связаны с транзакцией в формате объекта \u003ccode>json\u003c/code>.\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003ccode>{\\&quot;Phone\\&quot;: \\&quot;+71234567890\\&quot;}\u003c/code>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>CultureName\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Язык уведомлений и квитанций. Возможные значения: &quot;ru-RU&quot;, &quot;en-US&quot;. (см. \u003ca href=\"https://developers.cloudpayments.ru/#lokalizatsiya\" target=\"_blank\" rel=\"noopener noreferrer\">справочник\u003c/a>).\u003cbr>Если не передан, по умолчанию будет использоваться &quot;ru-RU”.\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003ccode>ru-RU\u003c/code>\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cp>\u003cstrong>RESPONSE:\u003c/strong>\u003c/p>\u003cp>В ответ сервер возвращает JSON с тремя составляющими:\u003c/p>\u003cul>\u003cli>\u003cp>\u003cstrong>поле success\u003c/strong> — результат запроса;\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>поле message\u003c/strong> — описание ошибки;\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>объект model\u003c/strong> — расширенная информация о платеже.\u003c/p>\u003c/li>\u003c/ul>\u003cp>Возможные варианты ответа:\u003c/p>\u003col start=\"1\">\u003cli>\u003cp>Некорректно сформирован запрос:\u003c/p>\u003cul>\u003cli>\u003cp>\u003cstrong>success\u003c/strong> — false\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>message\u003c/strong> — описание ошибки\u003c/p>\u003c/li>\u003c/ul>\u003c/li>\u003cli>\u003cp>Инициализация платежной сессии завершилась неуспешно:\u003c/p>\u003cul>\u003cli>\u003cp>\u003cstrong>success\u003c/strong> — false\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>model\u003c/strong> — информация о транзакции и код ошибки\u003c/p>\u003c/li>\u003c/ul>\u003c/li>\u003cli>\u003cp>Инициализация сессии прошла успешно:\u003c/p>\u003cul>\u003cli>\u003cp>\u003cstrong>success\u003c/strong> — true\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>model\u003c/strong> — информация о транзакции\u003c/p>\u003cul>\u003cli>\u003cp>В поле \u003ccode>Model.ExtensionData.Link\u003c/code> придет ссылка на платежную форму, которую необходимо открыть для последующей оплаты пользователем через оформление заявки на данной платежной форме\u003c/p>\u003c/li>\u003c/ul>\u003c/li>\u003c/ul>\u003c/li>\u003c/ol>\u003cp>\u003cbr>\u003c/p>\u003caside class=\"api-callout \" role=\"note\">\u003cstrong class=\"callout-label\">Информация\u003c/strong>\u003cp>Результат запроса (поле Success) не отражает статус транзакции, а лишь свидетельствует об успешности/неуспешности запроса API. Статус транзакции отражен в дополнительном поле Status, также его можно узнать в результате получения \u003ca href=\"https://developers.cloudpayments.ru/#uvedomleniya\" target=\"_blank\" rel=\"noopener noreferrer\">уведомлений\u003c/a>. Интерпретацию статусов транзакции смотрите в \u003ca href=\"https://developers.cloudpayments.ru/#statusy-operatsiy\" target=\"_blank\" rel=\"noopener noreferrer\">справочнике\u003c/a>.\u003c/p>\u003c/aside>\u003cdiv class=\"api-table-scroll\" tabindex=\"0\" aria-label=\"Таблица\">\u003ctable style=\"table-layout:fixed;width:952px;min-width:0\">\u003ccolgroup>\u003ccol style=\"width:227px\">\u003ccol style=\"width:167px\">\u003ccol style=\"width:162px\">\u003ccol style=\"width:396px\">\u003c/colgroup>\u003ctr>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Параметр\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Формат\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Наличие\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Описание\u003c/p>\u003c/th>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Model\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Object\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Данные созданной транзакции\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Model.TransactionId\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Long\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>ID Транзакции\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Model.Amount\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Number\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Сумма транзакции\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Model.IsTest\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Bool\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Флаг тестового режима оплаты\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>ExtensionData\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Object\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Объект с дополнительными данными платежа\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>ExtensionData.Link\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Ссылка на форму заявки на \u003ca href=\"http://dolyame.ru/\" target=\"_blank\" rel=\"noopener noreferrer\">сайтe\u003c/a>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Success\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Bool\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Успешность запроса\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Message\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Сообщение, описывающее статус запроса\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>ErrorCode\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Number\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Код ошибки (при наличии)\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Пример запроса\u003c/strong>\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>json\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-1\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-1\" class=\"language-json\">{\n  &quot;PublicId&quot;: &quot;pk_0fe1d5c9cb47e8cf8d96102201419&quot;,\n  &quot;AltPayType&quot;: &quot;TcsBnplDolyame&quot;,\n  &quot;Amount&quot;: 1000,\n  &quot;Description&quot;: &quot;Оплата в точке N&quot;,\n  &quot;AccountId&quot;: &quot;email@email.com&quot;,\n  &quot;InvoiceId&quot;: &quot;order_no4009&quot;,\n  &quot;CultureName&quot;: &quot;ru-RU&quot;,\n  &quot;Scheme&quot;: &quot;1&quot;,\n  &quot;SuccessRedirectUrl&quot;: &quot;https://success-page.ru&quot;,\n  &quot;FailRedirectUrl&quot;: &quot;https://fail-page.ru&quot;\n\n}    \u003c/code>\u003c/pre>\u003c/div>\u003cp>\u003cstrong>Пример ответа\u003c/strong>\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>json\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-2\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-2\" class=\"language-json\">{\n  &quot;Model&quot;: {\n          &quot;TransactionId&quot;: 183930901,\n          &quot;Amount&quot;: 1000,\n          &quot;IsTest&quot;: true\n          },\n  &quot;ExtensionData&quot;: {\n                &quot;Link&quot;: &quot;https://dolyame.ru/form/demoPayment-52030933-b65e-4e5a-acdc/example/example&quot;\n                },\n  &quot;Success&quot;: true,\n  &quot;Message&quot;: null,\n  &quot;ErrorCode&quot;: null\n}\u003c/code>\u003c/pre>\u003c/div>\u003cp>\u003cbr>\u003c/p>\u003c/div>","toc":[{"id":"sposoby-integratsiy","title":"Способы интеграций","level":2},{"id":"podklyuchenie","title":"Подключение","level":2},{"id":"vstraivaemaya-knopka-oplaty","title":"Встраиваемая кнопка оплаты","level":2},{"id":"metod-post-payments-altpay-pay","title":"Метод POST /payments/altpay/pay","level":3}],"type":"page","audience":"developer"},"security":{"id":"security","title":"Информационная безопасность","group":"security","html":"\u003cdiv class=\"imported-api\">\u003cp>PCI DSS — стандарт информационной безопасности, принятый в индустрии платежных карт Visa и Mastercard. Соблюдать требования стандарта обязаны все компании, которые принимают карты к оплате. Некоторым компаниям необходимо подтверждать свое соответствие.\u003c/p>\u003ch2 id=\"sootvetstvie-trebovaniyam\">\u003cstrong>Соответствие требованиям\u003c/strong>\u003c/h2>\u003cp>Основное требование стандарта — максимально ограничить доступ к данным платежных карт. Оптимальное решение — вообще не иметь к ним доступа, а вместо этого использовать сертифицированных провайдеров для приема платежей. На практике это означает, что нельзя ни запрашивать, ни передавать номера карт. Если при звонке клиент говорит, что не проходит платеж, и начинает диктовать номер, нужно его прервать и объяснить, почему вы не можете получать данные карты. Если присылает по почте или скайпу — удалять сообщение и сообщать, что передавать данные карты небезопасно.\u003c/p>\u003cp>К охраняемым данным относятся полный номер карты и код CVV2/CVC2 (последние 3 цифры на обратной стороне). Имя владельца, срок действия и маскированный номер карты (первые 6 и последние 4 цифры) в защите по требованиям стандарта не нуждаются, поэтому их можно использовать в разумных пределах.\u003c/p>\u003ch2 id=\"sootvetstvie-pci-dss-vmeste-s-cloudpayments\">\u003cstrong>Соответствие PCI DSS вместе с CloudPayments\u003c/strong>\u003c/h2>\u003cp>CloudPayments — сертифицированный сервис-провайдер с максимальным уровнем соответствия PCI DSS, предоставляющим право хранить данные платежных карт и обрабатывать более 6 миллионов платежей ежегодно. Подтверждение соответствия проходит каждый год в рамках сертификационного аудита.\u003c/p>\u003cp>Все платежные инструменты CloudPayments спроектированы таким образом, что при их использовании вы автоматически соответствуете требованиям по безопасности. Дополнительных мер предпринимать не нужно.\u003c/p>\u003cp>Исключением является прием платежей по технологии \u003ca href=\"https://developers.cloudpayments.ru/#skript-checkout\" target=\"_blank\" rel=\"noopener noreferrer\">Checkout\u003c/a>. Для использования необходимо подтверждать соответствие: заполнить лист самооценки и ежеквартально проверять сайт на уязвимости специальным сканером.\u003c/p>\u003ch2 id=\"tehnologiya-checkout\">\u003cstrong>Технология Checkout\u003c/strong>\u003c/h2>\u003cp>\u003ca href=\"https://developers.cloudpayments.ru/#skript-checkout\" target=\"_blank\" rel=\"noopener noreferrer\">Checkout\u003c/a> — уникальная технология токенизации карт для приема платежей на вашем сайте, в форме без встроенных iframe элементов, что дает максимальный контроль и конверсию прохождения платежей. Данные платежных карт шифруются в браузере покупателя, поэтому ваш сайт не принимает участие в обработке и хранении номеров, что значительно сокращает область применения требований PCI DSS. Тем не менее, сайт влияет на безопасность карточных данных и для его защиты необходимо выполнять сканирование не менее одного раза в квартал для поиска вирусов и уязвимостей. Сканирование должно проводиться аккредитованным вендором (ASV) из списка, представленного на сайте совета PCI.\u003c/p>\u003ch2 id=\"asv-skanirovanie\">\u003cstrong>ASV-сканирование\u003c/strong>\u003c/h2>\u003cp>ASV-сканирование — автоматизированная проверка вашего сайта на наличие уязвимостей. Сканер проверяет наличие вирусов, известных уязвимостей, таких как XSS, SQL Injections и так далее, после чего составляет детальный отчет с инструкцией по устранению проблем, если они были обнаружены.\u003c/p>\u003cp>Использование сканера необходимо для приема платежей по технологии \u003ca href=\"https://developers.cloudpayments.ru/#skript-checkout\" target=\"_blank\" rel=\"noopener noreferrer\">Checkout\u003c/a>, для остальных инструментов — виджет, мобильный SDK, рекарринг и рекуррент — его использование не требуется.\u003c/p>\u003cp>Выбор вендора для сканирования остается на ваше усмотрение, но он должен быть из \u003ca href=\"https://www.pcisecuritystandards.org/assessors_and_solutions/approved_scanning_vendors\" target=\"_blank\" rel=\"noopener noreferrer\">списка на сайте совета PCI\u003c/a>.\u003c/p>\u003cp>\u003cbr>\u003c/p>\u003c/div>","toc":[{"id":"sootvetstvie-trebovaniyam","title":"Соответствие требованиям","level":2},{"id":"sootvetstvie-pci-dss-vmeste-s-cloudpayments","title":"Соответствие PCI DSS вместе с CloudPayments","level":2},{"id":"tehnologiya-checkout","title":"Технология Checkout","level":2},{"id":"asv-skanirovanie","title":"ASV-сканирование","level":2}],"type":"page","audience":"developer"},"reference/testing":{"id":"reference/testing","title":"Тестирование","group":"reference","html":"\u003cdiv class=\"imported-api\">\u003cp>Сразу после создания нового сайта в ЛК он находится в тестовом режиме работы — это значит, что платежи и прочие операции будут проходить в режиме эмуляции. \u003c/p>\u003cp>Для тестирования можно использовать карты:\u003c/p>\u003cdiv class=\"api-table-scroll\" tabindex=\"0\" aria-label=\"Таблица\">\u003ctable style=\"table-layout:fixed;width:979px;min-width:0\">\u003ccolgroup>\u003ccol style=\"width:253px\">\u003ccol style=\"width:211px\">\u003ccol style=\"width:219px\">\u003ccol style=\"width:296px\">\u003c/colgroup>\u003ctr>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">Тип\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Номер карты\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Результат оплаты\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Результат оплаты по токену\u003c/p>\u003c/th>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Карта Visa с 3-D Secure\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>4242 4242 4242 4242\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Успеш е если были получены коды ошибок из группы «Безусловно негативные». Таким образом, последующие регулярные платежи проходить не будут, необходимо повторно провести установочную операцию.\u003cbr>\u003cbr>Безусловно негативные\u003cbr>5005 Do Not Honor\u003cbr>5057 Transaction Not Permitted\u003cbr>5003 Invalid Merchant\u003cbr>5017 Customer Cancellation\u003cbr>5033 Expired Card Pickup\u003cbr>5034 Suspected Fraud\u003cbr>5001 Refer To Card Issuer\u003cbr>5012 Invalid Transaction\u003cbr>\u003cbr>При 2-ух попытках из группы «Условно негативные» и «Временно негативные» будет происходить блокировка проведения оплаты в течение 24-х часов (суток). Таким образом, данное правило необходимо учесть на своей стороне для кодов ошибок ниже.\u003cbr>\u003cbr>Условно негативные\u003cbr>5055 Invalid PIN\u003cbr>5063 Security Violation\u003cbr>5014 Invalid Card Number\u003cbr>5030 Format Error\u003cbr>5013 Amount Error\u003cbr>5054 Expired Card\u003cbr>\u003cbr>Временно негативные\u003cbr>5065 Exceed Withdrawal Frequency\u003cbr>5096 System Error\u003cbr>5051 Insufficient Funds\u003c/p>\u003ch2 id=\"kody-obrabotki-otvetov-na-check-uvedomlenie\">\u003cstrong>Коды обработки ответов на check уведомление\u003c/strong>\u003c/h2>\u003cp>Ниже предоставлены код регистрации ответов вашего сервиса на \u003ca href=\"https://developers.cloudpayments.ru/#check\" target=\"_blank\" rel=\"noopener noreferrer\">check\u003c/a>-уведомление\u003c/p>\u003cp>Код отображается в детализации транзакции, а также в системном журнале в ЛК.\u003c/p>\u003cdiv class=\"api-table-scroll\" tabindex=\"0\" aria-label=\"Таблица\">\u003ctable>\u003ctr>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Код\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Название\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Причина\u003c/p>\u003c/th>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>3001\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>InvalidInvoiceId\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обработчик уведомления вернул \u003ccode>{&quot;code&quot;:10}\u003c/code>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>3002\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>InvalidAccountId\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обработчик уведомления вернул \u003ccode>{&quot;code&quot;:11}\u003c/code>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>3003\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>InvalidAmount\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обработчик уведомления вернул \u003ccode>{&quot;code&quot;:12}\u003c/code>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>3004\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>OutOfDate\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обработчик уведомления вернул \u003ccode>{&quot;code&quot;:20}\u003c/code>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>3005\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>FormatError\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обработчик уведомления вернул код, отличный от \u003ca href=\"https://developers.cloudpayments.ru/#check\" target=\"_blank\" rel=\"noopener noreferrer\">ожидаемого\u003c/a>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>3006\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Unavailable\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Сервис недоступен\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>3007\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>UnableToConnect\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обработчик не отвечает (\u003ccode>404\u003c/code>, \u003ccode>504\u003c/code>, \u003ccode>508\u003c/code> и т.д)\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>3008\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>NotAccepted\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обработчик уведомления вернул \u003ccode>{&quot;code&quot;:13}\u003c/code>\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003ch2 id=\"tipy-operatsiy\">\u003cstrong>Типы операций\u003c/strong>\u003c/h2>\u003cp>В таблице ниже представлены коды типов операций в уведомлениях.\u003c/p>\u003cdiv class=\"api-table-scroll\" tabindex=\"0\" aria-label=\"Таблица\">\u003ctable>\u003ctr>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Код\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Название\u003c/p>\u003c/th>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Payment\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Оплата\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Refund\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Возврат\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>CardPayout\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Выплата на карту\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003ch2 id=\"statusy-operatsiy\">\u003cstrong>Статусы операций\u003c/strong>\u003c/h2>\u003cp>В таблице ниже представлены статусы транзакций, условия применения и возможные действия.\u003c/p>\u003cdiv class=\"api-table-scroll\" tabindex=\"0\" aria-label=\"Таблица\">\u003ctable>\u003ctr>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Статус\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Описание\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Применение\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Возможные действия\u003c/p>\u003c/th>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>AwaitingAuthentication\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Ожидает аутентификации\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>После перехода плательщика на сайт эмитента в ожидании результатов 3-D Secure\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Нет\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Authorized\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Авторизована\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>После получения авторизации\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Подтверждение, Отмена\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Completed\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Завершена\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>После подтверждения операции\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Возврат денег\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Cancelled\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Отменена\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>В случае отмены операции\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Нет\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Declined\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Отклонена\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>В случае невозможности провести операцию (нет денег на счете карты и т.п.)\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Нет\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003ch2 id=\"statusy-podpisok-rekurrent\">\u003cstrong>Статусы подписок (рекуррент)\u003c/strong>\u003c/h2>\u003cp>В таблице ниже представлены статусы подписок, условия применения и возможные действия.\u003c/p>\u003cdiv class=\"api-table-scroll\" tabindex=\"0\" aria-label=\"Таблица\">\u003ctable>\u003ctr>\u003cth colspan=\"1
