/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Операционная система устройства плательщика.\u003cbr>Пример значения: \u003ccode>Android\u003c/code>, \u003ccode>iOS\u003c/code>, \u003ccode>Windows\u003c/code>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Webview\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Bool\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Признак открытия браузера в режиме webview.\u003cbr>Возможные значения: \u003ccode>true\u003c/code> - для оплат через webview \u003ccode>false\u003c/code> - для оплат без webview\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Device\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Признак устройства плательщика.\u003cbr>Возможные значения:\u003cbr>\u003ccode>MobileApp\u003c/code> - вызов оплаты из мобильного приложения\u003cbr>\u003ccode>DesktopWeb\u003c/code> - вызов оплаты из браузера с десктопа\u003cbr>\u003ccode>Mobile\u003c/code> - вызов из браузера с мобильного устройства\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Browser\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Название браузера клиента на основании userAgent браузера.\u003cbr>Пример значения: \u003ccode>Chrome\u003c/code>, \u003ccode>Firefox\u003c/code>, \u003ccode>MIUI Browser\u003c/code>, \u003ccode>Opera\u003c/code>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>TtlMinutes\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Int\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Время, в течение которого будет доступна оплата по QR-коду / ссылке на оплату. Минимальное допустимое значение - &quot;1&quot;. Максимальное допустимое значение - &quot;129 600&quot; (90 дней).\u003cbr>Если параметр не передан, оплату можно будет совершить в течение 72 часов.\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>SaveCard\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Bool\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Флаг необходимости сохранить карту для привязки счета в Национальной Системе Платежных Карт для последующих списаний\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>IsTest\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Bool\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Флаг тестового режима оплаты\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cp>В ответ сервер возвращает JSON с тремя составляющими:\u003c/p>\u003cul>\u003cli>\u003cp>поле \u003cstrong>success\u003c/strong> — результат запроса;\u003c/p>\u003c/li>\u003cli>\u003cp>поле \u003cstrong>message\u003c/strong> — описание ошибки;\u003c/p>\u003c/li>\u003cli>\u003cp>объект \u003cstrong>model\u003c/strong> — расширенная информация.\u003c/p>\u003c/li>\u003c/ul>\u003cp>Возможные варианты ответа:\u003c/p>\u003col start=\"1\">\u003cli>\u003cp>Некорректно сформирован запрос:\u003c/p>\u003cul>\u003cli>\u003cp>\u003cstrong>success\u003c/strong> — false\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>message\u003c/strong> — описание ошибки\u003c/p>\u003c/li>\u003c/ul>\u003c/li>\u003cli>\u003cp>Транзакция отклонена:\u003c/p>\u003cul>\u003cli>\u003cp>\u003cstrong>success\u003c/strong> — false\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>model\u003c/strong> — информация о транзакции и код ошибки\u003c/p>\u003c/li>\u003c/ul>\u003c/li>\u003cli>\u003cp>Транзакция принята:\u003c/p>\u003cul>\u003cli>\u003cp>\u003cstrong>success\u003c/strong> — true\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>model\u003c/strong> — информация о транзакции\u003c/p>\u003c/li>\u003c/ul>\u003c/li>\u003c/ol>\u003cp>Результат запроса (поле Success) не отражает статус транзакции, а лишь свидетельствует об успешности/неуспешности запроса API. Статус транзакции отражен в дополнительном поле Status, также его можно узнать в результате получения \u003ca href=\"https://developers.cloudpayments.ru/#uvedomleniya\" target=\"_blank\" rel=\"noopener noreferrer\">уведомлений\u003c/a>. Интерпретацию статусов транзакции смотрите в \u003ca href=\"https://developers.cloudpayments.ru/#statusy-operatsiy\" target=\"_blank\" rel=\"noopener noreferrer\">справочнике\u003c/a>.\u003c/p>\u003ch3 id=\"sbp-primer-zaprosa\">\u003cstrong>Пример запроса\u003c/strong>\u003c/h3>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>text\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-1\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-1\" class=\"language-text\">{\n    &quot;PublicId&quot;: &quot;test_api_00000000000000000000002&quot;,\n    &quot;Amount&quot;: 1000,\n    &quot;Currency&quot;: &quot;RUB&quot;,\n    &quot;Description&quot;: &quot;Оплата по СБП&quot;,\n    &quot;AccountId&quot;: &quot;email@email.com&quot;,\n    &quot;Email&quot;: &quot;email@email.com&quot;,\n    &quot;InvoiceId&quot;: &quot;order_no4009&quot;,\n    &quot;Scheme&quot;: &quot;charge&quot;,\n    &quot;SuccessRedirectUrl&quot;: &quot;https://cp.ru&quot;,\n    &quot;SaveCard&quot;: false\n}\n\u003c/code>\u003c/pre>\u003c/div>\u003ch3 id=\"primer-otveta\">\u003cstrong>Пример ответа\u003c/strong>\u003c/h3>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>text\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-2\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-2\" class=\"language-text\">{\n    &quot;Model&quot;: {\n        &quot;QrUrl&quot;: &quot;{URL-адрес}&quot;, // будет содержать url-адрес для редиректа\n        &quot;QrImage&quot;: null,                \n        &quot;TransactionId&quot;: 11122233344, // id транзакции CloudPayments\n        &quot;MerchantOrderId&quot;: &quot;12345&quot;, // переданный InvoiceId\n        &quot;ProviderQrId&quot;: &quot;BB1S004HCK9PFD0F996RJI3208UE&quot;, // переданный id платежной ссылки или QR-кода\n        &quot;Amount&quot;: 10,\n        &quot;Message&quot;: &quot;Created&quot;,     \n        &quot;IsTest&quot;: false\n    },\n    &quot;Success&quot;: true,\n    &quot;Message&quot;: null\n}\n\u003c/code>\u003c/pre>\u003c/div>\u003ch2 id=\"sbp-poluchenie-qr-koda-dlya-oplaty\">\u003cstrong>Получение QR-кода для оплаты\u003c/strong>\u003c/h2>\u003ch3 id=\"opisanie-2\">\u003cstrong>Описание\u003c/strong>\u003c/h3>\u003cp>Метод для получения QR-кода для отображения клиенту в браузере. В ответе вернётся параметр \u003ccode>QrImage\u003c/code> с QR-кодом в формате imagePNG для отображения клиенту. Значение строки закодировано в base64.\u003c/p>\u003cp>Для проведения платежа, клиента надо перенаправить на полученный URL-адрес. Клиенты могут оплатить неограниченное число раз по одному QR СБП.\u003c/p>\u003ch3 id=\"adres-metoda-2\">\u003cstrong>Адрес метода\u003c/strong>\u003c/h3>\u003cp>https://api.cloudpayments.ru/payments/qr/sbp/image\u003c/p>\u003ch3 id=\"parametry-zaprosa\">\u003cstrong>Параметры запроса\u003c/strong>\u003c/h3>\u003cp>\u003ca href=\"https://developers.cloudpayments.ru/#sbp-parametry-zaprosa\" target=\"_blank\" rel=\"noopener noreferrer\">см. СБП. Получение ссылки для оплаты\u003c/a>\u003c/p>\u003ch3 id=\"primer-zaprosa\">\u003cstrong>Пример запроса\u003c/strong>\u003c/h3>\u003cp>\u003ca href=\"https://developers.cloudpayments.ru/#sbp-primer-zaprosa\" target=\"_blank\" rel=\"noopener noreferrer\">см. СБП. Получение ссылки для оплаты\u003c/a>\u003c/p>\u003ch3 id=\"primer-otveta-2\">\u003cstrong>Пример ответа\u003c/strong>\u003c/h3>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>text\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-3\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-3\" class=\"language-text\">{\n    &quot;Model&quot;: {\n        &quot;QrUrl&quot;: null, \n        &quot;QrImage&quot;: {string}, // будет содержать png в base64\n        &quot;TransactionId&quot;: 11122233344, // id транзакции CloudPayments\n        &quot;MerchantOrderId&quot;: &quot;12345&quot;, // переданный InvoiceId\n        &quot;ProviderQrId&quot;: &quot;BB1S004HCK9PFD0F996RJI3208UE&quot;, // переданный id платежной ссылки или QR-кода\n        &quot;Amount&quot;: 10,\n        &quot;Message&quot;: &quot;Created&quot;,     \n        &quot;IsTest&quot;: false\n    },\n    &quot;Success&quot;: true,\n    &quot;Message&quot;: null\n}\n\u003c/code>\u003c/pre>\u003c/div>\u003ch2 id=\"spisok-uchastnikov-sbp\">\u003cstrong>Список участников СБП\u003c/strong>\u003c/h2>\u003ch3 id=\"opisanie-3\">\u003cstrong>Описание\u003c/strong>\u003c/h3>\u003cp>Метод возвращает список участников системы быстрых платежей (СБП) с учетом платформы клиента. Источником данных является \u003ca href=\"https://widget.cbrpay.ru/#membersListV2\" target=\"_blank\" rel=\"noopener noreferrer\">API виджета СБП\u003c/a>.\u003c/p>\u003ch3 id=\"adres-metoda-3\">\u003cstrong>Адрес метода\u003c/strong>\u003c/h3>\u003cp>https://api.cloudpayments.ru/sbp/v2/banks/info\u003c/p>\u003ch3 id=\"parametry-zaprosa-2\">\u003cstrong>Параметры запроса\u003c/strong>\u003c/h3>\u003cdiv class=\"api-table-scroll\" tabindex=\"0\" aria-label=\"Таблица\">\u003ctable>\u003ctr>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Параметр\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Тип\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Обязательность\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Назначение\u003c/p>\u003c/th>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>AccountId\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Нет\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Идентификатор аккаунта пользователя\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>IsRenewSubscription\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>boolean\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Нет\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Флаг обновления подписки\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>JsonData\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Нет\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Дополнительные данные в формате JSON\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Platform\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Нет\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Платформа клиента (desktop, ios, android)\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>PublicTerminalId\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Да\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Публичный идентификатор терминала мерчанта\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>SaveCard\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>boolean\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Нет\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Флаг необходимости сохранения карты\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Token\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Нет\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Токен карты для сохранения\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003ch3 id=\"primer-zaprosa-2\">\u003cstrong>Пример запроса\u003c/strong>\u003c/h3>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>text\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-4\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-4\" class=\"language-text\">{\n  &quot;PublicTerminalId&quot;: &quot;pk_1234567890abcdef&quot;,\n  &quot;Platform&quot;: &quot;ios&quot;\n}\n\u003c/code>\u003c/pre>\u003c/div>\u003ch3 id=\"parametry-otveta\">\u003cstrong>Параметры ответа\u003c/strong>\u003c/h3>\u003cdiv class=\"api-table-scroll\" tabindex=\"0\" aria-label=\"Таблица\">\u003ctable>\u003ctr>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Параметр\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Тип\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Назначение\u003c/p>\u003c/th>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Success\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>boolean\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Флаг успешности выполнения запроса\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Message\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Сообщение об ошибке (null при успехе)\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Model\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>List\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Список данных об участниках СБП\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Model.Source\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Источник данных\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Model.Version\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Версия спецификации ответа\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Model.Members\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>List\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Список участников СБП\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Model.Members.Id\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Уникальный идентификатор члена СБП\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Model.Members.Name\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Полное название банка/члена СБП\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Model.Members.Logo\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>URL логотипа банка\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Model.Members.Url\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>URL для перехода в приложение или веб-версию банка\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003ch3 id=\"primer-otveta-3\">\u003cstrong>Пример ответа\u003c/strong>\u003c/h3>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>text\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-5\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-5\" class=\"language-text\">{\n  &quot;Success&quot;: true,\n  &quot;Message&quot;: null,\n  &quot;Model&quot;: [\n    {\n      &quot;Source&quot;: &quot;widget&quot;,\n      &quot;Version&quot;: &quot;2.0&quot;,\n      &quot;Members&quot;: [\n        {\n          &quot;id&quot;: &quot;100000000111&quot;,\n          &quot;logo&quot;: &quot;https://qr.nspk.ru/proxyapp/logo/bank100000000111.png&quot;,\n          &quot;name&quot;: &quot;Сбербанк&quot;,\n          &quot;url&quot;: &quot;bank100000000111://qr.nspk.ru/{QRC_ID}{QUERY_STRING}&quot;\n        },\n        {\n          &quot;id&quot;: &quot;100000000004&quot;,\n          &quot;logo&quot;: &quot;https://qr.nspk.ru/proxyapp/logo/bank100000000004.png&quot;,\n          &quot;name&quot;: &quot;Т-Банк&quot;,\n          &quot;url&quot;: &quot;https://www.tinkoff.ru/mybank/payments/qr-pay/{QRC_ID}{QUERY_STRING}&quot;\n        },\n        {\n          &quot;id&quot;: &quot;100000000005&quot;,\n          &quot;logo&quot;: &quot;https://qr.nspk.ru/proxyapp/logo/bank100000000005.png&quot;,\n          &quot;name&quot;: &quot;Банк ВТБ&quot;,\n          &quot;url&quot;: &quot;https://online.vtb.ru/i/paymentSbp/{QRC_ID}{QUERY_STRING}&quot;\n        }\n      ]\n    }\n  ]\n}\n\u003c/code>\u003c/pre>\u003c/div>\u003ch2 id=\"vozvrat\">\u003cstrong>Возврат\u003c/strong>\u003c/h2>\u003cp>Метод возврата по операциям СБП аналогичен методу возврата ДС по операциям интернет-эквайринга - \u003ca href=\"https://developers.cloudpayments.ru/#vozvrat-deneg\" target=\"_blank\" rel=\"noopener noreferrer\">см. API. Возврат денег\u003c/a>.\u003c/p>\u003cp>Возвраты СБП работают в асинхронном режиме. Финальный статус возврата СБП (“Завершен”/“Отклонен”) можно получить через \u003ca href=\"https://developers.cloudpayments.ru/#refund\" target=\"_blank\" rel=\"noopener noreferrer\">Refund\u003c/a>-уведомление уже после создания транзакции возврата, а не в ответе на сам запрос возврата.\u003c/p>\u003ch2 id=\"uvedomleniya\">\u003cstrong>Уведомления\u003c/strong>\u003c/h2>\u003cp>Уведомления по операциям СБП аналогичны уведомлениям по операциям интернет-эквайринга - \u003ca href=\"https://developers.cloudpayments.ru/#uvedomleniya\" target=\"_blank\" rel=\"noopener noreferrer\">см. Уведомления\u003c/a>\u003c/p>\u003cp>Параметр, отвечающий за тип операции в уведомлении – \u003ccode>PaymentMethod\u003c/code> (для СБП указано значение \u003ccode>Sbp\u003c/code>)\u003c/p>\u003cp>Если включены Check-уведомления, то Check будет направляться до формирования QR/ссылки для проверки корректности данных.\u003c/p>\u003ch2 id=\"sozdanie-pryamoy-ssylki-i-spiska-bankov\">\u003cstrong>Создание прямой ссылки и списка банков\u003c/strong>\u003c/h2>\u003cp>Прямая ссылка существует для того, чтобы перенаправить плательщика при клике на ссылку в конкретное приложение банка.\u003c/p>\u003cp>Список банков можно получить из массива элементов в ответе \u003ca href=\"https://developers.cloudpayments.ru/#spisok-uchastnikov-sbp\" target=\"_blank\" rel=\"noopener noreferrer\">POST: /sbp/v2/banks/info\u003c/a> в параметре \u003ccode>Model.Members\u003c/code>\u003c/p>\u003cp>CloudPayments использует список участников из \u003ca href=\"https://widget.cbrpay.ru/#membersListV2\" target=\"_blank\" rel=\"noopener noreferrer\">API виджета СБП\u003c/a>.\u003c/p>\u003ch3 id=\"trebovaniya-sbp\">\u003cstrong>Требования СБП\u003c/strong>\u003c/h3>\u003cp>\u003cstrong>Нельзя изменять:\u003c/strong>\u003c/p>\u003col start=\"1\">\u003cli>\u003cp>\u003cstrong>Порядок банков\u003c/strong> — сохранение оригинального порядка реализовано на стороне CloudPayments;\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>Названия и логотипы\u003c/strong>;\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>Ссылки для перехода в банковские приложения\u003c/strong>.\u003c/p>\u003c/li>\u003c/ol>\u003cp>\u003cstrong>Обязательно:\u003c/strong>\u003c/p>\u003col start=\"1\">\u003cli>\u003cp>Сохранять функцию поиска по банкам;\u003c/p>\u003c/li>\u003cli>\u003cp>Для кэшированных данных (реализовано на стороне CloudPayments):\u003c/p>\u003cul>\u003cli>\u003cp>Использовать только актуальные данные (≤ 24 часов);\u003c/p>\u003c/li>\u003cli>\u003cp>При ошибке запроса — брать последние рабочие данные.\u003c/p>\u003c/li>\u003c/ul>\u003c/li>\u003c/ol>\u003cp>\u003cstrong>Разрешено:\u003c/strong>\u003c/p>\u003cul>\u003cli>\u003cp>Показывать первыми 3 банка, которые клиент выбирал ранее.\u003c/p>\u003c/li>\u003c/ul>\u003ch3 id=\"trebovaniya-k-otobrazheniyu-spiska-bankov-sbp\">\u003cstrong>Требования к отображению списка банков СБП\u003c/strong>\u003c/h3>\u003cp>\u003cstrong>Порядок элементов списка\u003c/strong>\u003c/p>\u003col start=\"1\">\u003cli>\u003cp>Элементы на странице списка должны быть расположены строго в порядке, полученном в ответе на запрос \u003ca href=\"https://developers.cloudpayments.ru/#spisok-uchastnikov-sbp\" target=\"_blank\" rel=\"noopener noreferrer\">POST /sbp/v2/banks/info\u003c/a>.\u003c/p>\u003c/li>\u003cli>\u003cp>Исключение:\u003c/p>\u003cul>\u003cli>\u003cp>Ранее выбранные банки (не более 3) могут отображаться в начале списка.\u003c/p>\u003c/li>\u003cli>\u003cp>Остальные банки следуют в исходном порядке, за исключением уже добавленных в начало.\u003c/p>\u003c/li>\u003c/ul>\u003c/li>\u003c/ol>\u003cp>\u003cstrong>Логотип\u003c/strong>\u003c/p>\u003cp>Логотип банка должен быть взят из ответа \u003ca href=\"https://developers.cloudpayments.ru/#spisok-uchastnikov-sbp\" target=\"_blank\" rel=\"noopener noreferrer\">POST /sbp/v2/banks/info\u003c/a>, параметр - \u003ccode>Model.Members.logo\u003c/code>\u003c/p>\u003cp>\u003cstrong>Название\u003c/strong>\u003c/p>\u003cp>Название банка должно быть взято из ответа \u003ca href=\"https://developers.cloudpayments.ru/#spisok-uchastnikov-sbp\" target=\"_blank\" rel=\"noopener noreferrer\">POST /sbp/v2/banks/info\u003c/a>, параметр - \u003ccode>Model.Members.Name\u003c/code>\u003c/p>\u003cp>\u003cstrong>Ссылка для перехода в приложение банка\u003c/strong>\u003c/p>\u003cp>Для формирования прямой ссылки на переход в приложение банка необходимо выполнить следующие шаги:\u003c/p>\u003col start=\"1\">\u003cli>\u003cp>Получить ссылку на оплату из ответа \u003ca href=\"https://developers.cloudpayments.ru/#sbp-poluchenie-ssylki-dlya-oplaty\" target=\"_blank\" rel=\"noopener noreferrer\">POST /payments/qr/sbp/link\u003c/a>, параметр - \u003ccode>Model.QrUrl\u003c/code>;\u003c/p>\u003c/li>\u003cli>\u003cp>Получить шаблон ссылки на банк из ответа \u003ca href=\"https://developers.cloudpayments.ru/#spisok-uchastnikov-sbp\" target=\"_blank\" rel=\"noopener noreferrer\">POST /sbp/v2/banks/info\u003c/a>, параметр - \u003ccode>Model.Members.url\u003c/code>;\u003c/p>\u003c/li>\u003cli>\u003cp>Обработать шаблон ссылки:\u003c/p>\u003cul>\u003cli>\u003cp>Удалить из шаблона последний элемент пути: \u003ccode>{QRC_ID}{QUERY_STRING}\u003c/code>;\u003c/p>\u003c/li>\u003c/ul>\u003c/li>\u003cli>\u003cp>Сформировать итоговую ссылку:\u003c/p>\u003cul>\u003cli>\u003cp>К оставшейся части шаблона конкатенировать путь и query-параметры из ссылки на оплату;\u003c/p>\u003c/li>\u003c/ul>\u003c/li>\u003c/ol>\u003cp>\u003cstrong>Пример преобразования:\u003c/strong>\u003c/p>\u003col start=\"1\">\u003cli>\u003cp>Ссылка на оплату: \u003ccode>https://qr.nspk.ru/AD1000XXXXX1000?type=02&amp;bank=100000000004&amp;sum=1299900&amp;cur=RUB&amp;crc=8DA8\u003c/code>\u003c/p>\u003c/li>\u003cli>\u003cp>Шаблон ссылки: \u003ccode>https://online.vtb.ru/i/paymentSbp/{QRC_ID}{QUERY_STRING}\u003c/code>\u003c/p>\u003c/li>\u003cli>\u003cp>Результат: \u003ccode>https://online.vtb.ru/i/paymentSbp/AD1000XXXXX1000?type=02&amp;bank=100000000004&amp;sum=1299900&amp;cur=RUB&amp;crc=8DA8\u003c/code>\u003c/p>\u003c/li>\u003c/ol>\u003cp>\u003cbr>\u003c/p>\u003c/div>","toc":[{"id":"sbp-poluchenie-ssylki-dlya-oplaty","title":"Получение ссылки для оплаты","level":2},{"id":"opisanie","title":"Описание","level":3},{"id":"adres-metoda","title":"Адрес метода","level":3},{"id":"sbp-parametry-zaprosa","title":"Параметры запроса","level":3},{"id":"sbp-primer-zaprosa","title":"Пример запроса","level":3},{"id":"primer-otveta","title":"Пример ответа","level":3},{"id":"sbp-poluchenie-qr-koda-dlya-oplaty","title":"Получение QR-кода для оплаты","level":2},{"id":"opisanie-2","title":"Описание","level":3},{"id":"adres-metoda-2","title":"Адрес метода","level":3},{"id":"parametry-zaprosa","title":"Параметры запроса","level":3},{"id":"primer-zaprosa","title":"Пример запроса","level":3},{"id":"primer-otveta-2","title":"Пример ответа","level":3},{"id":"spisok-uchastnikov-sbp","title":"Список участников СБП","level":2},{"id":"opisanie-3","title":"Описание","level":3},{"id":"adres-metoda-3","title":"Адрес метода","level":3},{"id":"parametry-zaprosa-2","title":"Параметры запроса","level":3},{"id":"primer-zaprosa-2","title":"Пример запроса","level":3},{"id":"parametry-otveta","title":"Параметры ответа","level":3},{"id":"primer-otveta-3","title":"Пример ответа","level":3},{"id":"vozvrat","title":"Возврат","level":2},{"id":"uvedomleniya","title":"Уведомления","level":2},{"id":"sozdanie-pryamoy-ssylki-i-spiska-bankov","title":"Создание прямой ссылки и списка банков","level":2},{"id":"trebovaniya-sbp","title":"Требования СБП","level":3},{"id":"trebovaniya-k-otobrazheniyu-spiska-bankov-sbp","title":"Требования к отображению списка банков СБП","level":3}]},"digital-ruble":{"id":"digital-ruble","title":"Цифровой рубль","type":"page","audience":"both","group":"root-digital-ruble","html":"\u003cdiv class=\"imported-api\">\u003cfigure style=\"text-align:center\">\u003cimg data-image-id=\"917fc603-2152-418e-b35b-40a9e28372e4\" src=\"https://developers.cloudpayments.ru/images/digitalruble-42849866.jpg\" alt=\"digital-ruble\" style=\"width:100%;max-width:100%;height:auto\">\u003c/figure>\u003ch2 id=\"priem-tsifrovyh-rubley-s-1-sentyabrya-2026-goda\">\u003cstrong>Прием цифровых рублей с 1 сентября 2026 года\u003c/strong>\u003c/h2>\u003cp>Цифровой рубль — цифровая форма российской национальной валюты, которую выпускает Банк России. Он равен наличному рублю и используется для платежей через платформу Банка России.\u003c/p>\u003ch2 id=\"na-kogo-rasprostranyayutsya-trebovaniya\">\u003cstrong>На кого распространяются требования\u003c/strong>\u003c/h2>\u003cp>С 1 сентября 2026 года принимать цифровые рубли должны будут продавцы и исполнители, которые одновременно:\u003c/p>\u003cul>\u003cli>\u003cp>Получили за предыдущий год выручку более 120 млн рублей\u003c/p>\u003c/li>\u003cli>\u003cp>Работают с банком, признанным значимым на рынке платежных услуг\u003c/p>\u003c/li>\u003cli>\u003cp>Принимают оплату от физических лиц\u003c/p>\u003c/li>\u003c/ul>\u003ch2 id=\"kak-budut-rasshiryatsya-trebovaniya\">\u003cstrong>Как будут расширяться требования\u003c/strong>\u003c/h2>\u003cp>С 1 сентября 2027 года требования распространятся на компании с выручкой более 30 млн рублей, а с 1 сентября 2028 года — на остальных продавцов с выручкой от 20 млн рублей.\u003c/p>\u003ch2 id=\"na-kogo-trebovaniya-ne-rasprostranyayutsya\">\u003cstrong>На кого требования не распространяются\u003c/strong>\u003c/h2>\u003cp>Компании с совокупной годовой выручкой менее 20 млн рублей не обязаны принимать цифровые рубли.\u003c/p>\u003cp>Требование также не распространяется:\u003c/p>\u003cul>\u003cli>\u003cp>На отдельные торговые точки с выручкой менее 5 млн рублей в год, даже если совокупная выручка всей компании превышает 20 млн рублей\u003c/p>\u003c/li>\u003cli>\u003cp>На точки продаж без доступа к интернету\u003c/p>\u003c/li>\u003c/ul>\u003ch2 id=\"priem-tsifrovyh-rubley-v-cloudpayments\">\u003cstrong>Прием цифровых рублей в CloudPayments\u003c/strong>\u003c/h2>\u003cp>CloudPayments планирует запустить прием разовых платежей в цифровых рублях с 1 сентября 2026 года. Операции будут отображаться в Личном кабинете и включаться в реестры и отчетность.\u003c/p>\u003cp>До конца 2026 года комиссия за прием платежей в цифровых рублях составит 0%. Регулярные платежи и сохранение счета для повторных оплат на старте поддерживаться не будут.\u003c/p>\u003c/div>","toc":[{"id":"priem-tsifrovyh-rubley-s-1-sentyabrya-2026-goda","title":"Прием цифровых рублей с 1 сентября 2026 года","level":2},{"id":"na-kogo-rasprostranyayutsya-trebovaniya","title":"На кого распространяются требования","level":2},{"id":"kak-budut-rasshiryatsya-trebovaniya","title":"Как будут расширяться требования","level":2},{"id":"na-kogo-trebovaniya-ne-rasprostranyayutsya","title":"На кого требования не распространяются","level":2},{"id":"priem-tsifrovyh-rubley-v-cloudpayments","title":"Прием цифровых рублей в CloudPayments","level":2}]},"sberpay":{"id":"sberpay","title":"SberPay","type":"page","audience":"both","group":"root-sberpay","html":"\u003cdiv class=\"imported-api\">\u003cfigure style=\"text-align:center\">\u003cimg data-image-id=\"625856a4-3c77-4d36-9816-1a7f2c3b12be\" src=\"https://developers.cloudpayments.ru/images/sberpay_cloud-fbaf8c5d.png\" alt=\"sberpay_cloud\" style=\"width:100%;max-width:100%;height:auto\">\u003c/figure>\u003cp>CloudPayments предлагает метод оплаты в один клик через SberPay. Покупатель может выбрать любой счет для списания в приложении Сбера, а также копить баллы «Спасибо» для последующих покупок.\u003c/p>\u003ch2 id=\"sberpay-poluchenie-ssylki-dlya-oplaty\">\u003cstrong>Получение ссылки для оплаты\u003c/strong>\u003c/h2>\u003ch3 id=\"opisanie\">\u003cstrong>Описание\u003c/strong>\u003c/h3>\u003cp>Метод для проведения оплаты по SberPay.\u003cbr>При оплате с мобильного устройства в ответе вернётся параметр \u003ccode>QrUrl\u003c/code> с URL-адресом для перенаправления клиента. Для проведения платежа клиента надо перенаправить на полученный URL-адрес.\u003cbr>При оплате с десктопа на номер телефона, который указан в параметре запроса \u003ccode>Phone\u003c/code>, будет отправлен push либо SMS-сообщение со ссылкой на оплату.\u003c/p>\u003cp>Авторизация \u003ca href=\"https://en.wikipedia.org/wiki/Basic_access_authentication\" target=\"_blank\" rel=\"noopener noreferrer\">HTTP Basic Auth\u003c/a> для данного метода не требуется. Вместо неё используется параметр идентификатора терминала \u003ccode>PublicId\u003c/code> в теле запроса.\u003c/p>\u003ch3 id=\"adres-metoda\">\u003cstrong>Адрес метода\u003c/strong>\u003c/h3>\u003cp>\u003ca href=\"https://api.cloudpayments.ru/payments/qr/sberpay/link\" target=\"_blank\" rel=\"noopener noreferrer\">https://api.cloudpayments.ru/payments/qr/sberpay/link\u003c/a>\u003c/p>\u003ch3 id=\"sberpay-parametry-zaprosa\">\u003cstrong>Параметры запроса\u003c/strong>\u003c/h3>\u003cdiv class=\"api-table-scroll\" tabindex=\"0\" aria-label=\"Таблица\">\u003ctable>\u003ctr>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Параметр\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Формат\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Применение\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Описание\u003c/p>\u003c/th>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>PublicId\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Идентификатор сайта, который находится в ЛК\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Amount\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Decimal\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Cумма платежа в рублях, разделитель точка. Количество не нулевых знаков после точки – 2\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Currency\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Валюта: RUB (см. \u003ca href=\"https://developers.cloudpayments.ru/#spisok-valyut\" target=\"_blank\" rel=\"noopener noreferrer\">справочник\u003c/a>)\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Description\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Назначение платежа в свободной форме\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>AccountId\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Идентификатор пользователя, используется для создания подписки и получения токена\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Email\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>E-mail плательщика, на который будет отправлена квитанция об оплате\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>JsonData\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Json\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Любые другие данные, которые будут связаны с транзакцией, в том числе \u003ca href=\"https://developers.cloudpayments.ru/#rekurrentnye-platezhi-podpiska\" target=\"_blank\" rel=\"noopener noreferrer\">инструкции\u003c/a> для создания подписки или формирования \u003ca href=\"https://developers.cloudpayments.ru/#format-peredachi-dannyh-dlya-onlayn-cheka\" target=\"_blank\" rel=\"noopener noreferrer\">онлайн-чека\u003c/a> должны обёртываться в объект \u003ccode>cloudpayments\u003c/code>. Мы зарезервировали названия следующих параметров и отображаем их содержимое в реестре операций, выгружаемом в Личном Кабинете: \u003ccode>name\u003c/code>, \u003ccode>firstName\u003c/code>, \u003ccode>middleName\u003c/code>, \u003ccode>lastName\u003c/code>, \u003ccode>nick\u003c/code>, \u003ccode>phone\u003c/code>, \u003ccode>address\u003c/code>, \u003ccode>comment\u003c/code>, \u003ccode>birthDate\u003c/code>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>InvoiceId\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Идентификатор/номер счета.\u003cbr>\u003cbr>Приходит в Check-уведомлении и может использоваться для сверки номера заказа\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Scheme\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Enum String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Схема проведения платежа (см. \u003ca href=\"https://developers.cloudpayments.ru/#vidy-operatsiy\" target=\"_blank\" rel=\"noopener noreferrer\">Виды операций\u003c/a>).\u003cbr>Возможные значения: \u003ccode>charge\u003c/code> - одностадийная оплата; \u003ccode>auth\u003c/code> - двухстадийная оплата\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>SuccessRedirectUrl\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Url для перенаправления клиента после успешной оплаты.\u003cbr>После проведения платежа, клиент будет перенаправлен на указанный адрес из мобильного приложения Банка.\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>IpAddress\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>IP-адрес плательщика\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Os\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Операционная система устройства плательщика.\u003cbr>Пример значения: \u003ccode>Android\u003c/code>, \u003ccode>iOS\u003c/code>, \u003ccode>Windows\u003c/code>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Webview\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Bool\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Признак открытия браузера в режиме webview.\u003cbr>Возможные значения: \u003ccode>true\u003c/code> - для оплат через webview \u003ccode>false\u003c/code> - для оплат без webview\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Device\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Признак устройства плательщика.\u003cbr>Возможные значения:\u003cbr>\u003ccode>MobileApp\u003c/code> - вызов оплаты из мобильного приложения\u003cbr>\u003ccode>DesktopWeb\u003c/code> - вызов оплаты из браузера с десктопа\u003cbr>\u003ccode>Mobile\u003c/code> - вызов из браузера с мобильного устройства\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Phone\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Номер телефона плательщика.\u003cbr>Пример значения: \u003ccode>+79001234567\u003c/code>\u003cbr>Обязательное значение для оплаты из браузера с десктопа\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Browser\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Название браузера клиента на основании userAgent браузера.\u003cbr>Пример значения: \u003ccode>Chrome\u003c/code>, \u003ccode>Firefox\u003c/code>, \u003ccode>MIUI Browser\u003c/code>, \u003ccode>Opera\u003c/code>\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cp>В ответ сервер возвращает JSON с тремя составляющими:\u003c/p>\u003cul>\u003cli>\u003cp>поле \u003cstrong>success\u003c/strong> — результат запроса;\u003c/p>\u003c/li>\u003cli>\u003cp>поле \u003cstrong>message\u003c/strong> — описание ошибки;\u003c/p>\u003c/li>\u003cli>\u003cp>объект \u003cstrong>model\u003c/strong> — расширенная информация.\u003c/p>\u003c/li>\u003c/ul>\u003cp>Возможные варианты ответа:\u003c/p>\u003col start=\"1\">\u003cli>\u003cp>Некорректно сформирован запрос:\u003c/p>\u003cul>\u003cli>\u003cp>\u003cstrong>success\u003c/strong> — false\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>message\u003c/strong> — описание ошибки\u003c/p>\u003c/li>\u003c/ul>\u003c/li>\u003cli>\u003cp>Транзакция отклонена:\u003c/p>\u003cul>\u003cli>\u003cp>\u003cstrong>success\u003c/strong> — false\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>model\u003c/strong> — информация о транзакции и код ошибки\u003c/p>\u003c/li>\u003c/ul>\u003c/li>\u003cli>\u003cp>Транзакция принята:\u003c/p>\u003cul>\u003cli>\u003cp>\u003cstrong>success\u003c/strong> — true\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>model\u003c/strong> — информация о транзакции\u003c/p>\u003c/li>\u003c/ul>\u003c/li>\u003c/ol>\u003cp>Результат запроса (поле Success) не отражает статус транзакции, а лишь свидетельствует об успешности/неуспешности запроса API. Статус транзакции отражен в дополнительном поле Status, также его можно узнать в результате получения \u003ca href=\"https://developers.cloudpayments.ru/#uvedomleniya\" target=\"_blank\" rel=\"noopener noreferrer\">уведомлений\u003c/a>. Интерпретацию статусов транзакции смотрите в \u003ca href=\"https://developers.cloudpayments.ru/#statusy-operatsiy\" target=\"_blank\" rel=\"noopener noreferrer\">справочнике\u003c/a>.\u003c/p>\u003ch3 id=\"sberpay-primer-zaprosa\">\u003cstrong>Пример запроса\u003c/strong>\u003c/h3>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>text\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-1\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-1\" class=\"language-text\">{\n    &quot;PublicId&quot;: &quot;test_api_00000000000000000000002&quot;,\n    &quot;Os&quot; : &quot;Windows 7 home&quot;,\n    &quot;Webview&quot; : true,\n    &quot;Browser&quot; : &quot;Microsoft Edge 24.101&quot;,\n    &quot;Amount&quot;: 1000,\n    &quot;Currency&quot;: &quot;RUB&quot;,\n    &quot;Description&quot;: &quot;Оплата по SberPay&quot;,\n    &quot;AccountId&quot;: &quot;email@email.com&quot;,\n    &quot;Email&quot;: &quot;email@email.com&quot;,\n    &quot;InvoiceId&quot;: &quot;order_no4009&quot;,\n    &quot;Scheme&quot;: &quot;charge&quot;,\n    &quot;Device&quot;: &quot;DesktopWeb&quot;,\n    &quot;Phone&quot;: &quot;79001234567&quot;,\n    &quot;SuccessRedirectUrl&quot;: &quot;https://cp.ru&quot;,\n}\n\u003c/code>\u003c/pre>\u003c/div>\u003ch3 id=\"primer-otveta\">\u003cstrong>Пример ответа\u003c/strong>\u003c/h3>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>text\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-2\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-2\" class=\"language-text\">{\n    &quot;Model&quot;: {\n        &quot;QrUrl&quot;: &quot;sberpay://invoicing/v2?bankInvoiceId=5628ecb3ef514a48abed24e16f818f03&amp;operationType=Web2App&quot;, // будет содержать url-адрес для редиректа\n        &quot;QrImage&quot;: null,                \n        &quot;TransactionId&quot;: 11122233344, // id транзакции CloudPayments\n        &quot;Amount&quot;: 10\n    },\n    &quot;Success&quot;: true,\n    &quot;Message&quot;: null\n}\n\u003c/code>\u003c/pre>\u003c/div>\u003cp>\u003cbr>\u003c/p>\u003c/div>","toc":[{"id":"sberpay-poluchenie-ssylki-dlya-oplaty","title":"Получение ссылки для оплаты","level":2},{"id":"opisanie","title":"Описание","level":3},{"id":"adres-metoda","title":"Адрес метода","level":3},{"id":"sberpay-parametry-zaprosa","title":"Параметры запроса","level":3},{"id":"sberpay-primer-zaprosa","title":"Пример запроса","level":3},{"id":"primer-otveta","title":"Пример ответа","level":3}]},"mirpay":{"id":"mirpay","title":"MIR Pay","type":"page","audience":"both","group":"root-mirpay","html":"\u003cdiv class=\"imported-api\">\u003cfigure style=\"text-align:center\">\u003cimg data-image-id=\"ddb10111-6c07-4039-893f-5eacd649606c\" src=\"https://developers.cloudpayments.ru/images/mirpay_cloud-0895990b.png\" alt=\"mirpay_cloud\" style=\"width:100%;max-width:100%;height:auto\">\u003c/figure>\u003cp>MIR Pay позволяет оплачивать покупки в одно касание картами платежной системы «МИР». Кнопка Pay-сервиса отображается на платёжной странице рядом с другими способами оплаты.\u003c/p>\u003ch2 id=\"vidy-integratsiy\">\u003cstrong>Виды интеграций\u003c/strong>\u003c/h2>\u003cp>CloudPayments предлагает подключение MIR Pay по упрощенной схеме на странице оплаты (с помощью платежного виджета) и через мобильный SDK. Дополнительно интегрироваться с сервисом платежной системы «МИР» не нужно.\u003c/p>\u003cp>В ближайшее время MIR Pay будет доступен для других видов интеграций: платежные блоки, заказы и платежные ссылки.\u003c/p>\u003ch2 id=\"podklyuchenie-mir-pay\">\u003cstrong>Подключение MIR Pay\u003c/strong>\u003c/h2>\u003cp>\u003cstrong>Для включения кнопки MIR Pay в платежном виджете и мобильном SDK необходимо:\u003c/strong>\u003c/p>\u003cp>Переключить «фича-тоггл» MIR Pay в Личном кабинете, в настройках сайта или написать в службу поддержки CloudPayments.\u003c/p>\u003cfigure style=\"text-align:center\">\u003cimg data-image-id=\"a326a89a-63e7-4836-ab34-5e7c2f53054d\" src=\"https://developers.cloudpayments.ru/images/fichtoggle_mir-3a585243.png\" alt=\"fichtoggle\" style=\"width:100%;max-width:100%;height:auto\">\u003c/figure>\u003ch3 id=\"protsess-oplaty-s-pomoschyu-mir-pay\">\u003cstrong>Процесс оплаты с помощью MIR Pay\u003c/strong>\u003c/h3>\u003cul>\u003cli>\u003cp>Покупатель после нажатия кнопки «Оплатить» переходит на виджет CloudPayments, где может выбрать оплату по MIR Pay без ввода банковских реквизитов. \u003c/p>\u003c/li>\u003cli>\u003cp>После оплаты покупатель видит сообщение об успешном платеже и автоматически возвращается обратно на сайт. Продавцу приходит уведомление о транзакции.\u003c/p>\u003c/li>\u003cli>\u003cp>Продавцу не нужно интегрироваться с сервисом платежной системы «МИР», все необходимое реализовано на стороне CloudPayments.\u003c/p>\u003c/li>\u003c/ul>\u003cp>\u003cbr>\u003c/p>\u003c/div>","toc":[{"id":"vidy-integratsiy","title":"Виды интеграций","level":2},{"id":"podklyuchenie-mir-pay","title":"Подключение MIR Pay","level":2},{"id":"protsess-oplaty-s-pomoschyu-mir-pay","title":"Процесс оплаты с помощью MIR Pay","level":3}]},"dolyami":{"id":"dolyami","title":"Долями","type":"page","audience":"both","group":"root-dolyami","html":"\u003cdiv class=\"imported-api\">\u003cfigure style=\"text-align:center\">\u003cimg data-image-id=\"00d89fad-bf9a-4a58-826a-4d2c13bcfbb4\" src=\"https://developers.cloudpayments.ru/images/dolyame-e3651f3f.png\" alt=\"dolyame\" style=\"width:100%;max-width:100%;height:auto\">\u003c/figure>\u003cp>CloudPayments предлагает метод оплаты Долями. Пользователь может разделить оплату на четыре части, а магазин получит всю сумму на следующий рабочий день.\u003c/p>\u003ch2 id=\"sposoby-integratsiy\">\u003cstrong>Способы интеграций\u003c/strong>\u003c/h2>\u003cul>\u003cli>\u003cp>в платежном \u003ca href=\"https://developers.cloudpayments.ru/#platezhnyy-vidzhet\" target=\"_blank\" rel=\"noopener noreferrer\">виджете\u003c/a> и \u003ca href=\"https://cloudpayments.ru/integration/cms\" target=\"_blank\" rel=\"noopener noreferrer\">CMS\u003c/a>-/\u003ca href=\"https://cloudpayments.ru/integration/crm\" target=\"_blank\" rel=\"noopener noreferrer\">CRM\u003c/a>-модулях\u003c/p>\u003c/li>\u003cli>\u003cp>в \u003ca href=\"https://cloudpayments.ru/infoshop\" target=\"_blank\" rel=\"noopener noreferrer\">CloudИнфошопе\u003c/a> (формирование витрины из Личного кабинета)\u003c/p>\u003c/li>\u003cli>\u003cp>в \u003ca href=\"https://developers.cloudpayments.ru/#sozdanie-scheta-dlya-otpravki-po-pochte\" target=\"_blank\" rel=\"noopener noreferrer\">заказах\u003c/a>\u003c/p>\u003c/li>\u003cli>\u003cp>в платежных ссылках, которые формируются из Личного кабинета\u003c/p>\u003c/li>\u003cli>\u003cp>в API\u003c/p>\u003c/li>\u003c/ul>\u003ch2 id=\"podklyuchenie\">\u003cstrong>Подключение\u003c/strong>\u003c/h2>\u003cp>Для подключения способа оплаты необходимо обратиться к курирующему менеджеру или написать на адрес электронной почты – \u003ca href=\"mailto:assistant@cp.ru\">assistant@cp.ru\u003c/a>\u003c/p>\u003cp>По техническим вопросам обращайтесь в службу поддержки – \u003ca href=\"mailto:support@cp.ru\">support@cp.ru\u003c/a>\u003c/p>\u003ch2 id=\"vstraivaemaya-knopka-oplaty\">\u003cstrong>Встраиваемая кнопка оплаты\u003c/strong>\u003c/h2>\u003cp>Вы можете добавить на свой сайт кнопку оплаты Долями. Данный способ работает через публичный API CloudPayments и позволяет встраивать на вашей форме отдельную кнопку оплаты.\u003c/p>\u003cp>Интерфейс работает по адресу \u003ca href=\"https://api.cloudpayments.ru/\" target=\"_blank\" rel=\"noopener noreferrer\">api.cloudpayments.ru\u003c/a>\u003c/p>\u003ch3 id=\"metod-post-payments-altpay-pay\">\u003cstrong>Метод POST /payments/altpay/pay\u003c/strong>\u003c/h3>\u003cp>Метод предназначен для получения ссылки на оплату через заполнение заявки Долями\u003c/p>\u003cp>Авторизация \u003ca href=\"https://en.wikipedia.org/wiki/Basic_access_authentication\" target=\"_blank\" rel=\"noopener noreferrer\">HTTP Basic Auth\u003c/a> для данного метода отсутствует. Вместо нее используется параметр идентификатора терминала \u003ccode>PublicId\u003c/code> в теле запроса.\u003c/p>\u003cp>\u003cstrong>URL:\u003c/strong> /payments/altpay/pay\u003c/p>\u003cp>\u003cstrong>METHOD:\u003c/strong> POST\u003c/p>\u003cp>\u003cstrong>BODY:\u003c/strong> Запрос обязательно имеет не пустое тело запроса.\u003c/p>\u003cdiv class=\"api-table-scroll\" tabindex=\"0\" aria-label=\"Таблица\">\u003ctable>\u003ctr>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Параметр\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Формат\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Применение\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Описание\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Пример\u003c/p>\u003c/th>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>PublicId\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Идентификатор терминала.\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003ccode>pk_0fe1d5c9cb47e8cf8d96102201419\u003c/code>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>AltPayType\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Тип оплаты.\u003cbr>Необходимо передавать значение &quot;TcsBnplDolyame&quot;.\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003ccode>TcsBnplDolyame\u003c/code>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Amount\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Number\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Cумма платежа, разделитель точка. Количество не нулевых знаков после точки – 2.\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003ccode>1000\u003c/code>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Scheme\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>enum\u003cbr>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Схема проведения платежа (см. \u003ca href=\"https://developers.cloudpayments.ru/#vidy-operatsiy\" target=\"_blank\" rel=\"noopener noreferrer\">Виды операций\u003c/a>).\u003cbr>Возможные значения:\u003cbr>\u003ccode>0\u003c/code> - одностадийная оплата;\u003cbr>\u003ccode>1\u003c/code> - двухстадийная оплата\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003ccode>0\u003c/code>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>InvoiceId\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Идентификатор заказа/номер счета.\u003cbr>Приходит в \u003ca href=\"https://developers.cloudpayments.ru/#check\" target=\"_blank\" rel=\"noopener noreferrer\">Check\u003c/a>-уведомлении и может использоваться для сверки номера заказа.\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003ccode>462651419\u003c/code>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Description\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Описание заказа/оплаты в свободной форме\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003ccode>Оплата товаров в https://example.com\u003c/code>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>AccountId\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Идентификатор плательщика\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003ccode>usermail@example.com\u003c/code>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Email\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>E-mail плательщика, на который будет отправлена квитанция об оплате\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003ccode>usermail@example.com\u003c/code>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>SuccessRedirectUrl\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Ссылка для возврата в случае успешной оплаты\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003ccode>https://success-page.ru\u003c/code>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>FailRedirectUrl\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Ссылка для возврата в случае неуспешной оплаты\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003ccode>https://fail-page.ru\u003c/code>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>JsonData\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Json\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Любые другие данные, которые будут связаны с транзакцией в формате объекта \u003ccode>json\u003c/code>.\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003ccode>{\\&quot;Phone\\&quot;: \\&quot;+71234567890\\&quot;}\u003c/code>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>CultureName\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Язык уведомлений и квитанций. Возможные значения: &quot;ru-RU&quot;, &quot;en-US&quot;. (см. \u003ca href=\"https://developers.cloudpayments.ru/#lokalizatsiya\" target=\"_blank\" rel=\"noopener noreferrer\">справочник\u003c/a>).\u003cbr>Если не передан, по умолчанию будет использоваться &quot;ru-RU”.\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003ccode>ru-RU\u003c/code>\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cp>\u003cstrong>RESPONSE:\u003c/strong>\u003c/p>\u003cp>В ответ сервер возвращает JSON с тремя составляющими:\u003c/p>\u003cul>\u003cli>\u003cp>\u003cstrong>поле success\u003c/strong> — результат запроса;\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>поле message\u003c/strong> — описание ошибки;\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>объект model\u003c/strong> — расширенная информация о платеже.\u003c/p>\u003c/li>\u003c/ul>\u003cp>Возможные варианты ответа:\u003c/p>\u003col start=\"1\">\u003cli>\u003cp>Некорректно сформирован запрос:\u003c/p>\u003cul>\u003cli>\u003cp>\u003cstrong>success\u003c/strong> — false\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>message\u003c/strong> — описание ошибки\u003c/p>\u003c/li>\u003c/ul>\u003c/li>\u003cli>\u003cp>Инициализация платежной сессии завершилась неуспешно:\u003c/p>\u003cul>\u003cli>\u003cp>\u003cstrong>success\u003c/strong> — false\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>model\u003c/strong> — информация о транзакции и код ошибки\u003c/p>\u003c/li>\u003c/ul>\u003c/li>\u003cli>\u003cp>Инициализация сессии прошла успешно:\u003c/p>\u003cul>\u003cli>\u003cp>\u003cstrong>success\u003c/strong> — true\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>model\u003c/strong> — информация о транзакции\u003c/p>\u003cul>\u003cli>\u003cp>В поле \u003ccode>Model.ExtensionData.Link\u003c/code> придет ссылка на платежную форму, которую необходимо открыть для последующей оплаты пользователем через оформление заявки на данной платежной форме\u003c/p>\u003c/li>\u003c/ul>\u003c/li>\u003c/ul>\u003c/li>\u003c/ol>\u003cp>Результат запроса (поле Success) не отражает статус транзакции, а лишь свидетельствует об успешности/неуспешности запроса API. Статус транзакции отражен в дополнительном поле Status, также его можно узнать в результате получения \u003ca href=\"https://developers.cloudpayments.ru/#uvedomleniya\" target=\"_blank\" rel=\"noopener noreferrer\">уведомлений\u003c/a>. Интерпретацию статусов транзакции смотрите в \u003ca href=\"https://developers.cloudpayments.ru/#statusy-operatsiy\" target=\"_blank\" rel=\"noopener noreferrer\">справочнике\u003c/a>.\u003c/p>\u003cdiv class=\"api-table-scroll\" tabindex=\"0\" aria-label=\"Таблица\">\u003ctable>\u003ctr>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Параметр\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Формат\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Наличие\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Описание\u003c/p>\u003c/th>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Model\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Object\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Данные созданной транзакции\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Model.TransactionId\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Long\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>ID Транзакции\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Model.Amount\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Number\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Сумма транзакции\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Model.IsTest\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Bool\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Флаг тестового режима оплаты\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>ExtensionData\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Object\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Объект с дополнительными данными платежа\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>ExtensionData.Link\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Ссылка на форму заявки на \u003ca href=\"http://dolyame.ru/\" target=\"_blank\" rel=\"noopener noreferrer\">сайтe\u003c/a>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Success\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Bool\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Успешность запроса\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Message\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Сообщение, описывающее статус запроса\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>ErrorCode\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Number\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Код ошибки (при наличии)\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Пример запроса\u003c/strong>\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>text\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-1\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-1\" class=\"language-text\">{\n  &quot;PublicId&quot;: &quot;pk_0fe1d5c9cb47e8cf8d96102201419&quot;,\n  &quot;AltPayType&quot;: &quot;TcsBnplDolyame&quot;,\n  &quot;Amount&quot;: 1000,\n  &quot;Description&quot;: &quot;Оплата в точке N&quot;,\n  &quot;AccountId&quot;: &quot;email@email.com&quot;,\n  &quot;InvoiceId&quot;: &quot;order_no4009&quot;,\n  &quot;CultureName&quot;: &quot;ru-RU&quot;,\n  &quot;Scheme&quot;: &quot;1&quot;,\n  &quot;SuccessRedirectUrl&quot;: &quot;https://success-page.ru&quot;,\n  &quot;FailRedirectUrl&quot;: &quot;https://fail-page.ru&quot;\n\n}       \n\u003c/code>\u003c/pre>\u003c/div>\u003cp>\u003cstrong>Пример ответа\u003c/strong>\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>text\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-2\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-2\" class=\"language-text\">{\n  &quot;Model&quot;: {\n          &quot;TransactionId&quot;: 183930901,\n          &quot;Amount&quot;: 1000,\n          &quot;IsTest&quot;: true\n          },\n  &quot;ExtensionData&quot;: {\n                &quot;Link&quot;: &quot;https://dolyame.ru/form/demoPayment-52030933-b65e-4e5a-acdc/example/example&quot;\n                },\n  &quot;Success&quot;: true,\n  &quot;Message&quot;: null,\n  &quot;ErrorCode&quot;: null\n}\u003c/code>\u003c/pre>\u003c/div>\u003cp>\u003cbr>\u003c/p>\u003c/div>","toc":[{"id":"sposoby-integratsiy","title":"Способы интеграций","level":2},{"id":"podklyuchenie","title":"Подключение","level":2},{"id":"vstraivaemaya-knopka-oplaty","title":"Встраиваемая кнопка оплаты","level":2},{"id":"metod-post-payments-altpay-pay","title":"Метод POST /payments/altpay/pay","level":3}]},"scenarii-integracii":{"id":"scenarii-integracii","title":"Сценарии интеграции","type":"page","audience":"both","group":"root-scenarii-integracii","html":"\u003cdiv class=\"imported-api\">\u003cp>Система предлагает различные варианты интеграции от очень простого до бесконечно функционального в зависимости от требований.\u003c/p>\u003cp>Интеграция без проверки платежей не рекомендуется.\u003cbr>Обязательно сверять сумму, номер заказа и идентификатор аккаунта плательщика.\u003c/p>\u003ch2 id=\"platezhnaya-forma\">\u003cstrong>Платежная форма\u003c/strong>\u003c/h2>\u003cp>Если вам не требуется проверять платежи перед оплатой и фиксировать факт после оплаты:\u003c/p>\u003cul>\u003cli>\u003cp>пропишите на свой сайт \u003ca href=\"https://developers.cloudpayments.ru/#ustanovka-vidzheta\" target=\"_blank\" rel=\"noopener noreferrer\">скрипт установки виджета\u003c/a>;\u003c/p>\u003c/li>\u003cli>\u003cp>настройте в \u003ca href=\"https://merchant.cloudpayments.ru/\" target=\"_blank\" rel=\"noopener noreferrer\">личном кабинете\u003c/a> e-mail адрес для уведомлений о платежах.\u003c/p>\u003c/li>\u003c/ul>\u003ch2 id=\"registratsiya-platezhey\">\u003cstrong>Регистрация платежей\u003c/strong>\u003c/h2>\u003cp>Если вам необходимо регистрировать платежи в своей системе, но нет необходимости проверять перед оплатой, то ваши действия следующие:\u003c/p>\u003cul>\u003cli>\u003cp>пропишите на свой сайт \u003ca href=\"https://developers.cloudpayments.ru/#ustanovka-vidzheta\" target=\"_blank\" rel=\"noopener noreferrer\">скрипт виджета\u003c/a>;\u003c/p>\u003c/li>\u003cli>\u003cp>настройте регистрацию платежей:\u003c/p>\u003cul>\u003cli>\u003cp>создайте скрипт обработки \u003ca href=\"https://developers.cloudpayments.ru/#pay\" target=\"_blank\" rel=\"noopener noreferrer\">Pay уведомления\u003c/a>, например, \u003cstrong>\u003ca href=\"https://site.ru/webhooks/cloudpayments/pay\" target=\"_blank\" rel=\"noopener noreferrer\">https://site.ru/webhooks/cloudpayments/pay\u003c/a>\u003c/strong>;\u003c/p>\u003c/li>\u003cli>\u003cp>пропишите в обработчике логику регистрации платежей и ответ в JSON-формате;\u003c/p>\u003c/li>\u003cli>\u003cp>включите в \u003ca href=\"https://merchant.cloudpayments.ru/\" target=\"_blank\" rel=\"noopener noreferrer\">личном кабинете\u003c/a> отправку Pay-уведомлений.\u003c/p>\u003c/li>\u003c/ul>\u003c/li>\u003c/ul>\u003ch2 id=\"proverka-i-registratsiya-platezhey\">\u003cstrong>Проверка и регистрация платежей\u003c/strong>\u003c/h2>\u003cp>Если вам необходимо проверять и регистрировать платежи в своей системе, ваши действия следующие:\u003c/p>\u003cul>\u003cli>\u003cp>пропишите на свой сайт скрипт установки виджета;\u003c/p>\u003c/li>\u003cli>\u003cp>настройте проверку платежей:\u003c/p>\u003cul>\u003cli>\u003cp>создайте скрипт обработки \u003ca href=\"https://developers.cloudpayments.ru/#check\" target=\"_blank\" rel=\"noopener noreferrer\">Check уведомления\u003c/a>, например, \u003cstrong>\u003ca href=\"https://site.ru/webhooks/cloudpayments/check\" target=\"_blank\" rel=\"noopener noreferrer\">https://site.ru/webhooks/cloudpayments/check\u003c/a>\u003c/strong>;\u003c/p>\u003c/li>\u003cli>\u003cp>пропишите в обработчике логику проверки платежей и ответ в JSON-формате;\u003c/p>\u003c/li>\u003c/ul>\u003c/li>\u003cli>\u003cp>настройте регистрацию платежей:\u003c/p>\u003cul>\u003cli>\u003cp>создайте скрипт обработки \u003ca href=\"https://developers.cloudpayments.ru/#pay\" target=\"_blank\" rel=\"noopener noreferrer\">Pay уведомления\u003c/a>, например, \u003cstrong>\u003ca href=\"https://site.ru/webhooks/cloudpayments/pay\" target=\"_blank\" rel=\"noopener noreferrer\">https://site.ru/webhooks/cloudpayments/pay\u003c/a>\u003c/strong>;\u003c/p>\u003c/li>\u003cli>\u003cp>пропишите в обработчике логику регистрации платежей и ответ в JSON-формате;\u003c/p>\u003c/li>\u003c/ul>\u003c/li>\u003cli>\u003cp>включите в личном кабинете отправку Check и Pay-уведомлений.\u003c/p>\u003c/li>\u003c/ul>\u003ch2 id=\"avtoplatezhi-dlya-internet-provayderov\">\u003cstrong>Автоплатежи для интернет-провайдеров\u003c/strong>\u003c/h2>\u003cp>Платежное решение подходит для интернет-провайдеров, операторов связи и телекомов. Уведомления на проверку и регистрацию платежей могут быть настроены как в формате CloudPayments, так и в формате QIWI (ОСМП).\u003c/p>\u003cp>\u003cbr>\u003c/p>\u003cfigure style=\"text-align:center\">\u003cimg data-image-id=\"a4832400-e7e4-477d-be88-7ec3d51f42a0\" src=\"https://developers.cloudpayments.ru/images/provider_bill-cb76a5ac.png\" alt=\"provider_bill\" style=\"width:100%;max-width:100%;height:auto\">\u003c/figure>\u003cp>\u003cstrong>Код формы:\u003c/strong>\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>text\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-1\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-1\" class=\"language-text\">    this.paySample3 = function () {\n    var widget = new cp.CloudPayments();\n\n    var userInfo = {};\n    var auto = $(&#39;#recurrent-sample-3&#39;).is(&#39;:checked&#39;); //проверка\n\n    if (auto) { //включаем подписку\n\n        var accountId = $(&#39;#account-sample-3&#39;).val();\n        var date = new Date(); //текущая дата\n        date.setMonth(date.getMonth() + 1); //следующий месяц\n        date.setDate(date.getDate() - 1); //минус один день\n\n        var recurrent = { interval: &#39;Month&#39;, period: 1, startDate: date }; //один раз в месяц начиная со следующего месяца за минусом одного дня\n\n        userInfo.accountId = &quot;accountId&quot; //идентификатор плательщика (обязательно для создания подписки)\n    }\n\n    var amount = parseFloat($(&#39;#amount-sample-3&#39;).val());\n\n    widget.start({ \n        publicTerminalId: &#39;test_api_00000000000000000000002&#39;, //id из личного кабинета\n        description: &#39;Пополнение счета абонента &#39; + accountId, //назначение\n        paymentSchema: &quot;Single&quot; // Одностадийная оплата\n        amount: amount, //сумма\n        currency: &#39;RUB&#39;, //валюта\n        recurrent: recurrent\n        userInfo: userInfo\n    },\n    function (options) { // success\n        //действие при успешной оплате\n    },\n    function (reason, options) { // fail\n        //действие при неуспешной оплате\n    });\n};\n\n$(&#39;#checkout-sample-3&#39;).click(paySample3);\n\n\u003c/code>\u003c/pre>\u003c/div>\u003cp>В примере используется библиотека jquery.\u003c/p>\u003ch2 id=\"avtoplatezhi-dlya-blagotvoritelnyh-fondov\">\u003cstrong>Автоплатежи для благотворительных фондов\u003c/strong>\u003c/h2>\u003cp>Платежное решение подходит для благотворительных фондов. Имя, фамилия, телефон, e-mail и любые другие данные с формы будут сохранены в виджете и переданы на ваш сервер через \u003ca href=\"https://developers.cloudpayments.ru/#pay\" target=\"_blank\" rel=\"noopener noreferrer\">Pay-уведомление\u003c/a>.\u003c/p>\u003cp>\u003cbr>\u003c/p>\u003cfigure style=\"text-align:center\">\u003cimg data-image-id=\"f98a52ad-61db-4399-ad20-8e44ab94a4a2\" src=\"https://developers.cloudpayments.ru/images/fond_donation-5890303d.png\" alt=\"fond_donation\" style=\"width:100%;max-width:100%;height:auto\">\u003c/figure>\u003cp>\u003cstrong>Код формы:\u003c/strong>\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>text\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-2\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-2\" class=\"language-text\">    this.paySample4 = function () {\n    var widget = new cp.CloudPayments();\n\n    var userInfo = { //данные дарителя\n        name: $(&#39;#name-sample-4&#39;).val(),\n        lastName: $(&#39;#lastName-sample-4&#39;).val(),\n        phone: $(&#39;#phone-sample-4&#39;).val(),\n        accountId = $(&#39;#email-sample-4&#39;).val(); //идентификатор плательщика (обязательно для создания подписки)\n    };\n\n    var recurrent = {};\n    var auto = $(&#39;#recurrent-sample-4&#39;).is(&#39;:checked&#39;); //проверка\n\n    if (auto) { //включаем подписку\n        recurrent = { interval: &#39;Month&#39;, period: 1 } //один раз в месяц начиная со следующего месяца\n    }\n    var amount = parseFloat($(&#39;#amount-sample-4&#39;).val());\n\n    widget.start({ \n        publicTerminalId: &#39;test_api_00000000000000000000002&#39;, //id из личного кабинета\n        description: &#39;Пожертвование в фонд ...&#39;, //назначение\n        amount: amount, //сумма\n        currency: &#39;RUB&#39;, //валюта\n        email: userInfo.account
