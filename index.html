раметры (или их часть), которые использовались для инициализации платежного конструктора.\u003c/p>\u003cp>Обновляются только переданные параметры. При обновлении обязательных параметров нет, все параметры необязательные\u003c/p>\u003cp>Со списком параметров можно \u003ca href=\"https://developers.cloudpayments.ru/#parametry\" target=\"_blank\" rel=\"noopener noreferrer\">ознакомиться тут\u003c/a>\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>text\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-10\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-10\" class=\"language-text\">blocksApp.update(initializationParams);\u003c/code>\u003c/pre>\u003c/div>\u003cp>\u003cbr>\u003c/p>\u003c/div>","toc":[{"id":"demo-konstruktora","title":"Демо конструктора","level":2},{"id":"otlichiya-ot-vidzheta","title":"Отличия от виджета","level":2},{"id":"ustanovka-platezhnogo-konstruktora","title":"Установка платежного конструктора","level":2},{"id":"demontazh-iz-dom","title":"Демонтаж из DOM","level":2},{"id":"sobytiya-kollbeki","title":"События (коллбэки)","level":2},{"id":"vidy-kollbekov","title":"Виды коллбэков","level":2},{"id":"otpiska","title":"Отписка","level":2},{"id":"primer-vyzova-paymentblocks","title":"Пример вызова PaymentBlocks","level":2},{"id":"parametry-initsializatsii","title":"Параметры инициализации","level":2},{"id":"kastomizatsiya-platezhnogo-konstruktora","title":"Кастомизация платежного конструктора","level":2},{"id":"parametry-kastomizatsii","title":"Параметры кастомизации","level":2},{"id":"obnovlenie-platezhnogo-konstruktora","title":"Обновление платежного конструктора","level":2}]},"script-checkout":{"id":"script-checkout","title":"Скрипт checkout","type":"page","audience":"both","group":"root-script-checkout","html":"\u003cdiv class=\"imported-api\">\u003cp>Checkout — скрипт, который прописывается на вашем сайте, собирает из указанной формы карточные данные и составляет из них криптограмму для оплаты через наш API.\u003c/p>\u003cp>Криптограмма формируется алгоритмом RSA с длиной ключа в 2048 бит и удовлетворяет стандарту по защите карточных данных. При соблюдении описанных ниже требований карточные данные к вам не попадают, но ваш сервер всё равно влияет на их безопасность.\u003c/p>\u003ch2 id=\"demo-checkout\">\u003cstrong>Demo checkout\u003c/strong>\u003c/h2>\u003cp>Демонстрация работы скрипта \u003ca href=\"https://developers.cloudpayments.ru/#skript-checkout\" target=\"_blank\" rel=\"noopener noreferrer\">Checkout\u003c/a> представлена в нашем \u003ca href=\"https://show.cloudpayments.ru/checkout/\" target=\"_blank\" rel=\"noopener noreferrer\">демо-магазине\u003c/a>.\u003cbr>Для тестирования можно использовать как \u003ca href=\"https://developers.cloudpayments.ru/#testirovanie\" target=\"_blank\" rel=\"noopener noreferrer\">тестовые карточные данные\u003c/a>, так и реальные. Списания денежных средств не произойдет.\u003c/p>\u003ch2 id=\"trebovaniya\">\u003cstrong>Требования\u003c/strong>\u003c/h2>\u003ch3 id=\"trebovaniya-k-forme\">\u003cstrong>Требования к форме:\u003c/strong>\u003c/h3>\u003cul>\u003cli>\u003cp>Должна работать по HTTPS-соединению с валидным SSL-сертификатом.\u003c/p>\u003c/li>\u003cli>\u003cp>На полях не должно быть атрибута &quot;name&quot; — это предотвращает попадание карточных данных на сервер при отправке формы.\u003c/p>\u003c/li>\u003cli>\u003cp>Поле для ввода номера карты должно поддерживать ввод от 16 до 19 цифр.\u003c/p>\u003c/li>\u003c/ul>\u003ch3 id=\"trebovaniya-k-kriptogramme\">\u003cstrong>Требования к криптограмме:\u003c/strong>\u003c/h3>\u003cul>\u003cli>\u003cp>Должна формироваться только оригинальным скриптом checkout, загруженным с адресов системы.\u003c/p>\u003c/li>\u003cli>\u003cp>Криптограмму нельзя хранить после оплаты и использовать повторно.\u003c/p>\u003c/li>\u003c/ul>\u003ch3 id=\"trebovaniya-k-bezopasnosti-po-pci-dss\">\u003cstrong>Требования к безопасности по PCI DSS:\u003c/strong>\u003c/h3>\u003cp>С точки зрения PCI DSS, подобный способ подключения классифицируется как &quot;E-commerce merchants who outsource all payment processing to PCI DSS validated third parties, and who have a website(s) that doesn’t directly receive cardholder data but that can impact the security of the payment transaction. No electronic storage, processing, or transmission of any cardholder data on the merchant’s systems or premises.&quot;, то есть обработка платежных данных выполняется третьей стороной, но сайт влияет на безопасность карточных данных.\u003c/p>\u003cp>Для соблюдения требований стандарта, необходимо заполнять лист самооценки \u003ca href=\"https://www.pcisecuritystandards.org/documents/SAQ_A-EP_v3.docx\" target=\"_blank\" rel=\"noopener noreferrer\">SAQ-EP\u003c/a> и ежеквартально проходить ASV-тестирование.\u003c/p>\u003cp>Подробнее про соответствие требованиям PCI читайте в разделе \u003ca href=\"https://developers.cloudpayments.ru/#pci-dss\" target=\"_blank\" rel=\"noopener noreferrer\">PCI DSS\u003c/a>.\u003c/p>\u003ch2 id=\"ustanovka\">\u003cstrong>Установка\u003c/strong>\u003c/h2>\u003cp>Для создания криптограммы необходимо прописать на странице с платежной формой скрипт \u003cstrong>checkout\u003c/strong>:\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>text\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-1\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-1\" class=\"language-text\">&lt;script src=&quot;https://checkout.cloudpayments.ru/checkout.js&quot;&gt;&lt;/script&gt;\n\u003c/code>\u003c/pre>\u003c/div>\u003cp>Используйте checkout.js, чтобы оставаться совместимым с PCI, гарантируя, что платежные реквизиты отправляются напрямую в CloudPayments, не затрагивая ваш сервер. Всегда загружайте checkout.js с \u003ca href=\"https://checkout.cloudpayments.ru/\" target=\"_blank\" rel=\"noopener noreferrer\">https://checkout.cloudpayments.ru\u003c/a>, чтобы соответствовать требованиям. Не включайте скрипт в пакет и не размещайте его самостоятельно.\u003c/p>\u003cp>Выбрать удобный для вас вариант передачи карточных данных:\u003c/p>\u003cul>\u003cli>\u003cp>Передача в скрипт\u003c/p>\u003c/li>\u003cli>\u003cp>Форма для ввода\u003c/p>\u003c/li>\u003c/ul>\u003cp>Далее созданную криптограмму карты необходимо отправить на сервер и вызывать метод оплаты через \u003ca href=\"https://developers.cloudpayments.ru/#api\" target=\"_blank\" rel=\"noopener noreferrer\">API\u003c/a>.\u003c/p>\u003ch3 id=\"variant-s-peredachey-kartochnyh-dannyh-napryamuyu-v-skript\">\u003cstrong>Вариант с передачей карточных данных напрямую в скрипт\u003c/strong>\u003c/h3>\u003cp>1) Инициализировать скрипт checkout\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>text\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-2\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-2\" class=\"language-text\">const checkout = new cp.Checkout({\n    publicId: &#39;test_api_000000000000000002&#39;,\n});\n\u003c/code>\u003c/pre>\u003c/div>\u003cp>2) Вызвать метод генерации криптограммы, передав в него карточные данные\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>text\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-3\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-3\" class=\"language-text\">const fieldValues = {\n    cvv: &#39;911&#39;,\n    cardNumber: &#39;4242 4242 4242 4242&#39;,\n    expDateMonth: &#39;12&#39;,\n    expDateYear: &#39;24&#39;,\n}\n\ncheckout.createPaymentCryptogram(fieldValues)\n    .then((cryptogram) =&gt; {\n        console.log(cryptogram);\n    }).catch((errors) =&gt; {\n        console.log(errors)\n    });\n\u003c/code>\u003c/pre>\u003c/div>\u003ch3 id=\"variant-s-ispolzovaniem-formy\">\u003cstrong>Вариант с использованием формы:\u003c/strong>\u003c/h3>\u003cp>1) Создать форму для ввода карточных данных:\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>text\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-4\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-4\" class=\"language-text\">&lt;form id=&quot;paymentFormSample&quot; autocomplete=&quot;off&quot;&gt;\n    &lt;input type=&quot;text&quot; data-cp=&quot;cardNumber&quot;&gt;\n    &lt;input type=&quot;text&quot; data-cp=&quot;expDateMonth&quot;&gt;\n    &lt;input type=&quot;text&quot; data-cp=&quot;expDateYear&quot;&gt;\n    &lt;input type=&quot;text&quot; data-cp=&quot;cvv&quot;&gt;\n    &lt;input type=&quot;text&quot; data-cp=&quot;name&quot;&gt;\n    &lt;button type=&quot;submit&quot;&gt;Оплатить 100 р.&lt;/button&gt;\n&lt;/form&gt;\n\u003c/code>\u003c/pre>\u003c/div>\u003cp>Поля ввода карточных данных должны быть помечены атрибутами:\u003c/p>\u003cul>\u003cli>\u003cp>\u003cstrong>data-cp=&quot;cardNumber&quot;\u003c/strong> — поле с номером карты;\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>data-cp=&quot;expDateMonth&quot;\u003c/strong> — поле с месяцем срока действия;\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>data-cp=&quot;expDateYear&quot;\u003c/strong> — поле с годом срока действия;\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>data-cp=&quot;cvv&quot;\u003c/strong> — поле с кодом CVV;\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>data-cp=&quot;name&quot;\u003c/strong> — поле с именем и фамилией держателя карты.\u003c/p>\u003c/li>\u003c/ul>\u003cp>2) Инициализировать скрипт checkout\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>text\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-5\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-5\" class=\"language-text\">const checkout = new cp.Checkout({\n    publicId: &#39;test_api_000000000000000002&#39;,\n    container: document.getElementById(&quot;paymentFormSample&quot;)\n});\n\u003c/code>\u003c/pre>\u003c/div>\u003cp>3) Вызвать метод генерации криптограммы\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>text\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-6\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-6\" class=\"language-text\">checkout.createPaymentCryptogram()\n    .then((cryptogram) =&gt; {\n        console.log(cryptogram); // криптограмма\n    }).catch((errors) =&gt; {\n        console.log(errors)\n    });\n\u003c/code>\u003c/pre>\u003c/div>\u003ch3 id=\"pri-razrabotke-sobstvennoy-formy-ili-peredachi-dannyh-v-skript-obratite-vnimanie-na-sleduyuschie-momenty\">\u003cstrong>При разработке собственной формы или передачи данных в скрипт обратите внимание на следующие моменты:\u003c/strong>\u003c/h3>\u003cul>\u003cli>\u003cp>длина номера карты составляет от 16 (15 для карт AMEX) до 19 цифр. Подробнее \u003ca href=\"https://en.wikipedia.org/wiki/Payment_card_number\" target=\"_blank\" rel=\"noopener noreferrer\">тут\u003c/a>;\u003c/p>\u003c/li>\u003cli>\u003cp>скрипт checkout не работает в устаревших, небезопасных браузерах, которые не поддерживают протоколы шифрования TLS версии 1.1 или выше. Например, в Internet Explorer 7;\u003c/p>\u003c/li>\u003cli>\u003cp>окно 3DS можно показывать как в новом окне, так и во фрейме поверх страницы. Размер окна должен быть не менее 500х500 пикселей.\u003c/p>\u003c/li>\u003c/ul>\u003ch2 id=\"metody\">\u003cstrong>Методы\u003c/strong>\u003c/h2>\u003ch3 id=\"asinhronnyy-metod-dlya-generatsii-kriptogrammy\">\u003cstrong>Асинхронный метод для генерации криптограммы.\u003c/strong>\u003c/h3>\u003cp>В данном методе при ошибке валидации карточных данных - вместо локализованного сообщения будет выдан код ошибки пример см. ниже.\u003c/p>\u003cp>\u003ccode>async createPaymentCryptogram(fieldValues: CardData): Promise&lt;string&gt;\u003c/code>\u003c/p>\u003cp>Метод возвращает Promise содержащий криптограмму. В случае если переданы некорректные данные Promise будет отклонен с ошибкой содержащей объект со \u003ca href=\"https://developers.cloudpayments.ru/#\" target=\"_blank\" rel=\"noopener noreferrer\">списком ошибок\u003c/a>.\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>text\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-7\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-7\" class=\"language-text\">const checkout = new cp.Checkout({\n    publicId: &#39;test_api_000000000000000002&#39;\n});\n\nconst fieldValues = {\n    cvv: &#39;911&#39;,\n    cardNumber: &#39;4242 4242 4242 4242&#39;,\n    expDateMonth: &#39;12&#39;,\n    expDateYear: &#39;24&#39;,\n}\n\ncheckout.createPaymentCryptogram(fieldValues)\n    .then((cryptogram) =&gt; {\n        console.log(cryptogram);\n    });\n\u003c/code>\u003c/pre>\u003c/div>\u003ch3 id=\"opisanie-ob-ekta-carddata\">\u003cstrong>Описание объекта CardData:\u003c/strong>\u003c/h3>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>text\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-8\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-8\" class=\"language-text\">export interface CardData {\n    cvv?:  string; // CVV/CVC код\n    cardNumber?: string; // Номер карты, наличие пробелов не имеет значения\n    expDateMonth?: string; // Срок действия карты - месяц\n    expDateYear?: string; // Срок дейcтвия карты - год\n    expDateMonthYear?: string; // Срок действия карты, все символы за исключением цифр игнорируются, \n    //Если длина строки 2,3 или 5 символов то первая цифра воспринимается как месяц, оставшиеся как год. \n    //Если длина строки 4 или 6 символов то первые два трактуются как месяц, а оставшиеся как год.\n}\n\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"api-table-scroll\" tabindex=\"0\" aria-label=\"Таблица\">\u003ctable>\u003ctr>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Параметр\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Описание\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Тип\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный *\u003c/p>\u003c/th>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>cvv\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>CVV/CVC код\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Нет *\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>cardNumber\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Номер карты, наличие пробелов не имеет значения\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Не обязательный, если поле привязано в форме\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>expDateMonth\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Срок действия карты - месяц\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Не обязательный, если поле привязано в форме или передано поле \u003ccode>expDateMonthYear\u003c/code>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>expDateYear\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Срок дейcтвия карты - год\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Не обязательный, если поле привязано в форме или переданы поля \u003ccode>expDateMonth\u003c/code> и \u003ccode>expDateYear\u003c/code>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>expDateMonthYear\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Срок действия карты, все символы за исключением цифр игнорируются. Если длина строки 2, 3 или 5 символов то первая цифра воспринимается как месяц, оставшиеся как год. Если длина строки 4 или 6 символов то первые два трактуются как месяц, а оставшиеся как год.\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Не обязательный, если поле привязано в форме или переданы поля \u003ccode>expDateMonth\u003c/code> и \u003ccode>expDateYear\u003c/code>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>name\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Имя владельца карты\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Нет\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cp>Сам объект CardData обязательным не является, вы можете не передавать его если используете привязку к HTML-форме.\u003c/p>\u003ch3 id=\"obrabotka-oshibok-validatsii-kartochnyh-dannyh\">\u003cstrong>Обработка ошибок валидации карточных данных:\u003c/strong>\u003c/h3>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>text\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-9\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-9\" class=\"language-text\">const fieldValues = {\n    cvv: &#39;91&#39;, // Невалидный CVV\n    cardNumber: &#39;4242 4242 4242 424&#39;, // Невалидный номер карты\n    expDateMonth: &#39;12&#39;,\n    expDateYear: &#39;24&#39;,\n}\n\ncheckout.createPaymentCryptogram(fieldValues)\n    .then((cryptogram) =&gt; {\n        console.log(cryptogram);\n    })\n        .catch((errors) =&gt; {\n                console.log(errors);\n             /* Выведет\n                {\n            cardNumber: &quot;CardNumber_Invalid&quot;,\n            cvv: &quot;Cvv_Invalid&quot;\n                }\n                */\n});\n\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"api-table-scroll\" tabindex=\"0\" aria-label=\"Таблица\">\u003ctable>\u003ctr>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Код ошибки\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Описание\u003c/p>\u003c/th>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>CardNumber_Empty\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Пустой номер карты\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>CardNumber_Invalid\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Некорректный номер карты\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Cvv_Empty\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Пустой CVV\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Cvv_Invalid\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Некорректный CVV\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>ExpDateMonthYear_Empty\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Пустой год и месяц\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>ExpDateMonthYear_Invalid\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Некорректный год и месяц\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>ExpDateMonth_Empty\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Пустой месяц\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>ExpDateMonth_Invalid\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Некорректный месяц\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>ExpDateYear_Empty\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Пустой год\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>ExpDateYear_Invalid\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Некорректный год\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Name_Empty\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Пустое имя *\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Name_Invalid\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Некорректное имя *\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Name_TooLong\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Слишком длинное имя *\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Name_TooShort\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Слишком короткое имя *\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cp>* Поле name не является обязательным и валидируется только если указано в форме или передано в объекте CardData.\u003c/p>\u003ch3 id=\"metod-dlya-generatsii-kriptogrammy\">\u003cstrong>Метод для генерации криптограммы\u003c/strong>\u003c/h3>\u003cp>Метод возвращает криптограмму в случае успешной генерации и объект со списком ошибок в случае наличия ошибок в карточных данных - в отличие от метода createPaymentCryptogram, объект со списком ошибок содержит не коды ошибок, а локализованные на русский язык описания ошибок.\u003c/p>\u003cp>\u003ccode>createCryptogramPacket(fieldValues: CardData):string|object\u003c/code> - устаревший.\u003c/p>\u003cp>Метод может принимать на вход объект с карточными данными и может использоваться в устаревшей схеме с привязкой к HTML-форме. В случае если используется и привязка формы и этот же параметр найден в объекте CardData при попытке сформировать криптограмму будет выброшена ошибка.\u003c/p>\u003cp>Cкрипт для создания криптограммы:\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>text\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-10\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-10\" class=\"language-text\">this.createCryptogram = function () {\n    var result = checkout.createCryptogramPacket();\n\n    if (result.success) {\n        // сформирована криптограмма\n        alert(result.packet);\n    }\n    else {\n        // найдены ошибки в введённых данных, объект `result.messages` формата: \n        // { name: &quot;В имени держателя карты слишком много символов&quot;, cardNumber: &quot;Неправильный номер карты&quot; }\n        // где `name`, `cardNumber` соответствуют значениям атрибутов `&lt;input ... data-cp=&quot;cardNumber&quot;&gt;`\n       for (var msgName in result.messages) {\n           alert(result.messages[msgName]);\n       }\n    }\n};\n\n$(function () {\n    /* Создание checkout */\n    checkout = new cp.Checkout(\n    // public id из личного кабинета\n    &quot;test_api_00000000000000000000001&quot;,\n    // тег, содержащий поля данных карты\n    document.getElementById(&quot;paymentFormSample&quot;));\n});\n\u003c/code>\u003c/pre>\u003c/div>\u003cp>\u003cbr>\u003c/p>\u003c/div>","toc":[{"id":"demo-checkout","title":"Demo checkout","level":2},{"id":"trebovaniya","title":"Требования","level":2},{"id":"trebovaniya-k-forme","title":"Требования к форме:","level":3},{"id":"trebovaniya-k-kriptogramme","title":"Требования к криптограмме:","level":3},{"id":"trebovaniya-k-bezopasnosti-po-pci-dss","title":"Требования к безопасности по PCI DSS:","level":3},{"id":"ustanovka","title":"Установка","level":2},{"id":"variant-s-peredachey-kartochnyh-dannyh-napryamuyu-v-skript","title":"Вариант с передачей карточных данных напрямую в скрипт","level":3},{"id":"variant-s-ispolzovaniem-formy","title":"Вариант с использованием формы:","level":3},{"id":"pri-razrabotke-sobstvennoy-formy-ili-peredachi-dannyh-v-skript-obratite-vnimanie-na-sleduyuschie-momenty","title":"При разработке собственной формы или передачи данных в скрипт обратите внимание на следующие моменты:","level":3},{"id":"metody","title":"Методы","level":2},{"id":"asinhronnyy-metod-dlya-generatsii-kriptogrammy","title":"Асинхронный метод для генерации криптограммы.","level":3},{"id":"opisanie-ob-ekta-carddata","title":"Описание объекта CardData:","level":3},{"id":"obrabotka-oshibok-validatsii-kartochnyh-dannyh","title":"Обработка ошибок валидации карточных данных:","level":3},{"id":"metod-dlya-generatsii-kriptogrammy","title":"Метод для генерации криптограммы","level":3}]},"recurrentniye-platezhi":{"id":"recurrentniye-platezhi","title":"Рекуррентные платежи","type":"page","audience":"both","group":"root-recurrentniye-platezhi","html":"\u003cdiv class=\"imported-api\">\u003cp>Рекуррентные платежи, также известные как платежи по подписке или «автоплатежи» — возможность выполнять регулярные списания денег с банковской карты покупателя без повторного ввода реквизитов карты и без участия плательщика для инициации очередного платежа.\u003c/p>\u003cp>Рекуррентные платежи всегда начинаются с первого, установочного платежа, для выполнения которого плательщик должен ввести реквизиты своей карты. Для последующих регулярных платежей обязательно нужно ознакомить держателя карты с графиком и получить его согласие на безакцептное списание.\u003c/p>\u003cp>Есть распространенное мнение, что задача рекуррентного биллинга сводится к тому, чтобы установить сумму, которая будет каждый месяц списываться с карты клиента. Выбор системы регулярных платежей при этом основан только на стоимости предоставляемых услуг. В действительности — ситуация более сложная, потому как для качественного сервиса требуется намного больше функций и возможностей. Мы сделали все, чтобы в системе CloudPayments процедура запуска и обработки рекуррентных платежей стала максимально простой и гибкой.\u003c/p>\u003ch2 id=\"zapusk-i-ostanovka-regulyarnyh-platezhey\">\u003cstrong>Запуск и остановка регулярных платежей\u003c/strong>\u003c/h2>\u003cp>Запуск рекуррентных платежей возможен в любое время после выполнения установочного платежа: в тот же момент, через неделю или через месяц. Ограничение только одно - интервал между регулярными платежами, а также между установочным и первым регулярным платежом не может превышать один год.\u003c/p>\u003cp>\u003cem>Пример:\u003c/em> покупатель оплачивает первый месяц предоставления услуг через установочный платеж и дает согласие на ежемесячное списание с его карты начиная со второго месяца.\u003cbr>Запуск регулярных платежей может быть выполнен через \u003ca href=\"https://developers.cloudpayments.ru/#sozdanie-podpiski-na-rekurrentnye-platezhi\" target=\"_blank\" rel=\"noopener noreferrer\">API\u003c/a> или \u003ca href=\"https://developers.cloudpayments.ru/#platezhnyy-vidzhet\" target=\"_blank\" rel=\"noopener noreferrer\">платежный виджет\u003c/a>.\u003c/p>\u003cp>Если покупатель отказывается от дальнейших платежей, вы можете отменить подписку в любой момент:\u003c/p>\u003cul>\u003cli>\u003cp>из \u003ca href=\"https://merchant.cloudpayments.ru/login\" target=\"_blank\" rel=\"noopener noreferrer\">личного кабинета\u003c/a>;\u003c/p>\u003c/li>\u003cli>\u003cp>через \u003ca href=\"https://developers.cloudpayments.ru/#otmena-podpiski-na-rekurrentnye-platezhi\" target=\"_blank\" rel=\"noopener noreferrer\">API\u003c/a>.\u003c/p>\u003c/li>\u003c/ul>\u003cp>Также плательщик может самостоятельно найти и отменить свои регулярные платежи на \u003ca href=\"https://my.cloudpayments.ru/ru/unsubscribe\" target=\"_blank\" rel=\"noopener noreferrer\">сайте системы CloudPayments\u003c/a>.\u003c/p>\u003ch2 id=\"vozmozhnost-nastroyki-grafika-platezhey\">\u003cstrong>Возможность настройки графика платежей\u003c/strong>\u003c/h2>\u003ch3 id=\"vybor-perioda-i-intervala-spisaniya\">\u003cstrong>Выбор периода и интервала списания\u003c/strong>\u003c/h3>\u003cp>Система может выполнять регулярные платежи каждые 2 недели, 1 раз в месяц, каждые 3 месяца и так далее: вы можете указать любой период.\u003c/p>\u003ch3 id=\"vybor-daty-nachala-spisaniy\">\u003cstrong>Выбор даты начала списаний\u003c/strong>\u003c/h3>\u003cp>Рекуррентные платежи могут быть запущены сразу при создании подписки, либо с отсрочкой.\u003c/p>\u003cp>\u003cem>Пример:\u003c/em> покупатель подписывается на вашу услугу в середине месяца, вы создаете план ежемесячных рекуррентных платежей начиная со следующего месяца по 15-м числам.\u003c/p>\u003ch3 id=\"ogranichenie-na-kolichestvo-platezhey\">\u003cstrong>Ограничение на количество платежей\u003c/strong>\u003c/h3>\u003cp>Можно указать максимальное количество платежей в подписке или создать план без ограничений. В первом случае рекуррентные платежи будут автоматически остановлены после исполнения всех платежей в графике.\u003c/p>\u003cp>\u003cem>Пример:\u003c/em> покупатель приобретает товар стоимостью 12 000 рублей в рассрочку на год — оплачивает 1000 рублей установочным платежом и подписывается на план рекуррентных платежей по 1000 рублей ежемесячно, но не более 11 списаний.\u003c/p>\u003ch3 id=\"zamorozka-plana\">\u003cstrong>Заморозка плана\u003c/strong>\u003c/h3>\u003cp>Подписку на регулярные платежи можно приостановить на любой срок из личного кабинета или с помощью \u003ca href=\"https://developers.cloudpayments.ru/#izmenenie-podpiski-na-rekurrentnye-platezhi\" target=\"_blank\" rel=\"noopener noreferrer\">API\u003c/a>.\u003c/p>\u003cp>\u003cem>Пример:\u003c/em> покупатель просит приостановить предоставление услуг на пару месяцев, вы сдвигаете дату следующего платежа на соответствующий срок.\u003c/p>\u003ch2 id=\"vozmozhnost-smeny-summy-platezha\">\u003cstrong>Возможность смены суммы платежа\u003c/strong>\u003c/h2>\u003ch3 id=\"summa-ustanovochnogo-platezha\">\u003cstrong>Сумма установочного платежа\u003c/strong>\u003c/h3>\u003cp>Сумма первого установочного платежа может быть произвольной и отличаться от суммы последующих рекуррентных платежей.\u003c/p>\u003cp>\u003cem>Пример:\u003c/em> покупатель регистрируется в вашем сервисе, вы просите его выполнить установочный платеж на 1 рубль для проверки карты. Далее, с согласия пользователя, запускаете рекуррентные платежи на любую сумму.\u003c/p>\u003ch3 id=\"summa-rekurrentnyh-platezhey\">\u003cstrong>Сумма рекуррентных платежей\u003c/strong>\u003c/h3>\u003cp>Сумму рекуррентных платежей можно изменять в любой момент действия плана из \u003ca href=\"https://merchant.cloudpayments.ru/login\" target=\"_blank\" rel=\"noopener noreferrer\">личного кабинета\u003c/a> или с помощью \u003ca href=\"https://developers.cloudpayments.ru/#izmenenie-podpiski-na-rekurrentnye-platezhi\" target=\"_blank\" rel=\"noopener noreferrer\">API\u003c/a>.\u003c/p>\u003cp>\u003cem>Пример:\u003c/em> вы предоставляете покупателю скидку на первые 2 месяца использования сервиса, далее повышаете сумму подписки.\u003c/p>\u003ch3 id=\"avtomaticheskaya-korrektsiya-oshibok\">\u003cstrong>Автоматическая коррекция ошибок\u003c/strong>\u003c/h3>\u003cp>Ошибки, которые возникают при выполнении рекуррентных платежей, можно разделить на: поправимые и непоправимые.\u003c/p>\u003cp>В первую категорию относятся ошибки, связанные с недостатком средств на карте покупателя, с временными техническими проблемами или недоступностью банка-эмитента карты. Как правило, данные проблемы может исправить держатель карты.\u003c/p>\u003cp>Во вторую категорию попадают ошибки, исправление которых невозможно: истек срок действия карты, карта утеряна, у банка-эмитента отозвана лицензия.\u003c/p>\u003cp>В зависимости от категории система по-разному реагирует и обрабатывает ошибки рекуррентных платежей.\u003c/p>\u003ch3 id=\"vzaimodeystvie-s-derzhatelem-karty\">\u003cstrong>Взаимодействие с держателем карты\u003c/strong>\u003c/h3>\u003cp>В случае отказа по причине недостатка средств на карте, система сообщает держателю, что очередной платеж не прошел, рекомендует пополнить счет карты и информирует, что повторная попытка списания будет произведена на следующий день.\u003c/p>\u003ch3 id=\"povtornye-popytki\">\u003cstrong>Повторные попытки\u003c/strong>\u003c/h3>\u003cp>Система повторяет попытки списаний с карты несколько дней подряд, если очередной платеж не проходит из-за поправимой ошибки.\u003c/p>\u003ch3 id=\"obnovlenie-karty\">\u003cstrong>Обновление карты\u003c/strong>\u003c/h3>\u003cp>Система предлагает через свою форму ввести новые данные карты для продолжения рекуррентных платежей. Если покупатель соглашается, система проводит новый установочный платеж по реквизитам полученной карты, засчитывает платеж в подписку и продолжает выполнять регулярные платежи по обновленной карте.\u003c/p>\u003ch3 id=\"opoveschenie-pokupatelya\">\u003cstrong>Оповещение покупателя\u003c/strong>\u003c/h3>\u003cp>Важная функция рекуррентных платежей — это своевременное информирование держателя карты о наступлении даты очередного платежа. Некоторым покупателям свойственна забывчивость, поэтому предупреждение о предстоящем списании убирает эффект внезапности и существенно снижает вероятность отсутствия денег на карте. Система CloudPayments всегда напоминает плательщикам дату очередного платежа с указанием суммы, назначения и получателя оплаты.\u003c/p>\u003c/div>","toc":[{"id":"zapusk-i-ostanovka-regulyarnyh-platezhey","title":"Запуск и остановка регулярных платежей","level":2},{"id":"vozmozhnost-nastroyki-grafika-platezhey","title":"Возможность настройки графика платежей","level":2},{"id":"vybor-perioda-i-intervala-spisaniya","title":"Выбор периода и интервала списания","level":3},{"id":"vybor-daty-nachala-spisaniy","title":"Выбор даты начала списаний","level":3},{"id":"ogranichenie-na-kolichestvo-platezhey","title":"Ограничение на количество платежей","level":3},{"id":"zamorozka-plana","title":"Заморозка плана","level":3},{"id":"vozmozhnost-smeny-summy-platezha","title":"Возможность смены суммы платежа","level":2},{"id":"summa-ustanovochnogo-platezha","title":"Сумма установочного платежа","level":3},{"id":"summa-rekurrentnyh-platezhey","title":"Сумма рекуррентных платежей","level":3},{"id":"avtomaticheskaya-korrektsiya-oshibok","title":"Автоматическая коррекция ошибок","level":3},{"id":"vzaimodeystvie-s-derzhatelem-karty","title":"Взаимодействие с держателем карты","level":3},{"id":"povtornye-popytki","title":"Повторные попытки","level":3},{"id":"obnovlenie-karty","title":"Обновление карты","level":3},{"id":"opoveschenie-pokupatelya","title":"Оповещение покупателя","level":3}]},"bezopasnaya-sdelka":{"id":"bezopasnaya-sdelka","title":"Безопасная сделка","type":"page","audience":"both","group":"root-bezopasnaya-sdelka","html":"\u003cdiv class=\"imported-api\">\u003ch2 id=\"opisanie-produkta\">\u003cstrong>Описание продукта\u003c/strong>\u003c/h2>\u003cp>Сервис &quot;Безопасная сделка&quot; позволяет организовать взаиморасчеты между двумя физическими лицами при продаже услуг или товаров. При этом, взаимодействие между физическими лицами происходит не напрямую между собой, а при участии Площадки - юридического лица, которое организует размещение Товара на своей витрине, помогает Продавцу найти покупателя, а также организует арбитраж, в случае такой необходимости. Площадка контролирует ход выполнения сделки, и дает команду CloudPayments на списание с карты в момент покупки, а после успешного выполнение продавцом своих обязанностей (например, после исполнения оговоренных услуг или работ, либо после успешной доставки товара), инициирует выплату на карту продавцу.\u003c/p>\u003ch2 id=\"opredeleniya-i-terminy\">\u003cstrong>Определения и термины:\u003c/strong>\u003c/h2>\u003cp>\u003cstrong>Плательщик\u003c/strong> - физическое лицо, которое отправляет денежные средства.\u003cbr>\u003cstrong>Получатель\u003c/strong> - физическое лицо, которое получает денежные средства.\u003cbr>\u003cstrong>Площадка\u003c/strong> - посредник, который выступает гарантом безопасности сделки, принимает решение о выполнении сторонами своих обязательств. В спорных случаях выступает Арбитром в спорах и несет финансовую ответственность.\u003cbr>\u003cstrong>Сделка\u003c/strong> - процесс приобретения товара/услуги одним физическим лицом у другого.\u003cbr>\u003cstrong>Оплата\u003c/strong> - приобретение товара/услуги у физического лица.\u003cbr>\u003cstrong>Выплата\u003c/strong> - получение вознаграждения физического лица, оказавшего услугу/продавцу товара.\u003cbr>\u003cstrong>Widget\u003c/strong> - всплывающая форма для ввода реквизитов карты и e-mail адреса плательщика.\u003cbr>\u003cstrong>Checkout\u003c/strong> - скрипт, который прописывается на сайте, собирает из указанной формы карточные данные и составляет из них криптограмму для оплаты через API.\u003cbr>\u003cstrong>AccumulationId\u003c/strong> - уникальный идентификатор сделки, присваиваемый во время первой операции. \u003cstrong>TransactionId\u003c/strong> - уникальный идентификатор транзакции.\u003c/p>\u003ch2 id=\"nastroyka-podklyucheniya\">\u003cstrong>Настройка подключения:\u003c/strong>\u003c/h2>\u003cp>Для подключения продукта &quot;Безопасная сделка&quot; необходимо подать заявку своему персональному менеджеру или указать это на этапе подключения выделенному менеджеру.\u003c/p>\u003cp>Для работы по БС требуется заведение 2 терминалов, один для оплат, второй для выплат\u003c/p>\u003cp>Оплаты и выплаты по БС доступны только по карте или по токену, полученному при оплате картой. На других способах оплаты, включая международные платежи по карте, БС не поддерживается.\u003cbr>\u003cbr>Также не все банки эквайеры, подключенные в CloudPayments, работают с БС. За деталями обращайтесь к своему персональному менеджеру.\u003c/p>\u003ch2 id=\"chemy-raboty\">\u003cstrong>Cхемы работы\u003c/strong>\u003c/h2>\u003col start=\"1\">\u003cli>\u003cp>Накопление нескольких платежей и проведение единой выплаты (N:1)\u003c/p>\u003c/li>\u003cli>\u003cp>Разделение одного платежа на несколько выплат (1:N)\u003c/p>\u003c/li>\u003c/ol>\u003ch2 id=\"statusnaya-model-sdelki\">\u003cstrong>Статусная модель сделки\u003c/strong>\u003c/h2>\u003cp>\u003cbr>\u003c/p>\u003cfigure style=\"text-align:center\">\u003cimg data-image-id=\"f4072233-064b-46dc-bca4-cfa166871470\" src=\"https://developers.cloudpayments.ru/images/escrow-scheme-7a61013a.png\" alt=\"escrow-scheme\" style=\"width:100%;max-width:100%;height:auto\">\u003c/figure>\u003ch2 id=\"n-1\">\u003cstrong>N:1\u003c/strong>\u003c/h2>\u003ch3 id=\"shema-integratsii-dlya-widget\">\u003cstrong>Схема интеграции для Widget:\u003c/strong>\u003c/h3>\u003cp>Переменная содержащая тип сделки, которая содержится в объекте cp.constant.escrow. Она отвечает за схему проведения сделки:\u003c/p>\u003col start=\"1\">\u003cli>\u003cp>Множество оплат и одна выплата;\u003c/p>\u003c/li>\u003cli>\u003cp>Одна оплата и множество выплат.\u003c/p>\u003c/li>\u003c/ol>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>text\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-1\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-1\" class=\"language-text\">{\n  NToOne: 0,  // для схемы N:1\n  OneToN: 1  // для схемы 1:N\n}\n\u003c/code>\u003c/pre>\u003c/div>\u003cp>Если данная переменная не передается, система автоматически считает, что сделка производится по протоколу \u003cstrong>N:1\u003c/strong>.\u003c/p>\u003cp>\u003cstrong>Пример использования\u003c/strong>:\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>text\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-2\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-2\" class=\"language-text\">cp.constant.escrow.NToOne // переменная для типа сделки = 0\ncp.constant.escrow.OneToN // переменная для типа сделки = 1\n\u003c/code>\u003c/pre>\u003c/div>\u003cp>\u003cstrong>Оплата (первичное создание накопления)\u003c/strong>\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>text\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-3\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-3\" class=\"language-text\">var widget = new cp.CloudPayments();\n\n  const intentParams = {\n    publicTerminalId: &quot;test_api_00000000000000000000002&quot;,\n    paymentSchema: &#39;Dual&#39;,\n    description: &quot;Оплата заказа №...&quot;,\n    amount: 100,\n    currency: &quot;RUB&quot;,\n    culture: &quot;ru-RU&quot;,\n    skin: &quot;classic&quot;,\n    externalId: &#39;string&#39;,\n    receiptEmail: &quot;user@email.com&quot;,\n    userInfo: {\n      email: &quot;user@email.com&quot;,\n      phone: &quot;+71234567890&quot;,\n    },\n    metadata: {\n      myProp: &quot;myProp value&quot;,\n    },\n    escrow: {\n      startAccumulation: true,\n      accumulationId: null,\n      escrowType: &quot;NToOne&quot;\n    },\n  };\n\n  widget.oncomplete = (result) =&gt; {\n      console.log(result);\n  }\n\n  widget.start(intentParams).then(function(widgetResult) {\n    console.log(&#39;result&#39;, widgetResult); // действие при успехе\n  }).catch(function(error) {\n    console.log(&#39;error&#39;, error); // действие при ошибке\n  });\n\u003c/code>\u003c/pre>\u003c/div>\u003cp>В ответ на запрос, в \u003ca href=\"https://developers.cloudpayments.ru/#pay\" target=\"_blank\" rel=\"noopener noreferrer\">Pay\u003c/a> уведомлении будет получен уникальный \u003cstrong>EscrowAccumulationId\u003c/strong>.\u003c/p>\u003cp>Также, при условии успешной транзакции, \u003cstrong>EscrowAccumulationId\u003c/strong> будет содержаться во всех вебхуках, кроме Check вебхука.\u003c/p>\u003cp>\u003cstrong>Оплата (по созданному накоплению)\u003c/strong>\u003c/p>\u003cp>Для последующих запросов (оплат), в рамках созданной безопасной сделки, необходимо добавить поля \u003cstrong>accumulationId\u003c/strong>, \u003cstrong>startAccumulation\u003c/strong>, \u003cstrong>escrowType\u003c/strong> в объект \u003ccode>escrow\u003c/code>.\u003c/p>\u003cp>\u003cstrong>Пример\u003c/strong>:\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>text\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-4\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-4\" class=\"language-text\">Escrow:{\n    startAccumulation: false,\n    escrowType: cp.constant.escrow.NToOne,\n    accumulationId: &quot;4733183a-c6f6-4c1b-8ff1-fb7c43ed1695&quot; // - Оплата по уже созданному накоплению.\n}\n\u003c/code>\u003c/pre>\u003c/div>\u003ch3 id=\"shema-integratsii-dlya-api-checkout\">\u003cstrong>Схема интеграции для API Checkout:\u003c/strong>\u003c/h3>\u003cp>\u003cstrong>Оплата (первичное создание накопления)\u003c/strong>\u003c/p>\u003cp>Необходимо использовать запрос \u003cstrong>payments/cards/charge\u003c/strong> (либо \u003cstrong>auth\u003c/strong>), где в теле в теле запроса в объекте \u003ccode>escrow\u003c/code> нужно передать \u003ccode>&quot;StartAccumulation&quot;: true\u003c/code> и тип сделки \u003ccode>&quot;EscrowType&quot;:0\u003c/code> или \u003ccode>&quot;EscrowType&quot;: “NToOne&quot;\u003c/code> . То есть для \u003ccode>EscrowType\u003c/code> значения можно передавать как целочисленное значение (0/1), так и строковым представлением (NToOne/OneToN).\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>text\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-5\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-5\" class=\"language-text\">&quot;Escrow&quot;:{\n    &quot;StartAccumulation&quot;:true,\n    &quot;EscrowType&quot;: &quot;NToOne&quot;\n}\n\u003c/code>\u003c/pre>\u003c/div>\u003cp>В ответ на запрос будет получен уникальный \u003ccode>EscrowAccumulationId\u003c/code>.\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>text\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-6\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-6\" class=\"language-text\">{\n    &quot;Model&quot;
