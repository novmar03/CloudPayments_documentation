<script id="editor-carousel-runtime">/** Install independent, manually controlled carousels in a document or rendered fragment.
 * @param {Document | HTMLElement | null} root
 */
function installCarouselRuntime(root = document) {
  if (!root) return () => {};
  const doc = root.ownerDocument || root;
  const style = doc.createElement('style');
  style.textContent = `
    [data-editor-carousel]{display:block;border:1px solid #dce3ee;border-radius:12px;padding:16px;margin:24px 0;max-width:100%;box-sizing:border-box}
    [data-editor-carousel] [data-carousel-slide]{margin:0}
    [data-editor-carousel] [data-carousel-slide][hidden]{display:none!important}
    [data-editor-carousel] .editor-carousel-frame{height:clamp(220px,45vw,480px);width:100%;background:#f5f7fb;touch-action:pan-y;overflow:hidden}
    [data-editor-carousel] .editor-carousel-frame img{display:block;width:100%!important;height:100%!important;max-width:100%;max-height:100%;margin:0;object-fit:contain;object-position:center;user-select:none}
    [data-editor-carousel] figcaption{min-height:1.5em;margin:10px 0;white-space:pre-wrap;overflow-wrap:anywhere;color:#65758b;text-align:center;font-size:14px}
    [data-editor-carousel] .editor-carousel-controls{display:flex;gap:16px;align-items:center;justify-content:center}
    [data-editor-carousel] button{min-width:44px;min-height:44px;border:1px solid #ccd6e4;border-radius:8px;background:white;color:#183b6c;cursor:pointer;font-size:20px}
    [data-editor-carousel] button:disabled{opacity:.4;cursor:default}
    [data-editor-carousel] button:focus-visible,[data-editor-carousel]:focus-visible{outline:2px solid #326dff;outline-offset:3px}
  `;
  doc.head.append(style);
  const attached = new Map();
  function scan() {
    for (const [element, cleanup] of attached) if (!root.contains(element)) { cleanup(); attached.delete(element); }
    root.querySelectorAll('[data-editor-carousel]').forEach(element => {
      if (attached.has(element)) return;
      const slides = Array.from(element.querySelectorAll('[data-carousel-slide]'));
      if (!slides.length) return;
      const counter = element.querySelector('[data-carousel-counter]');
      let index = 0, touch = null;
      const show = value => {
        index = ((value % slides.length) + slides.length) % slides.length;
        slides.forEach((slide, i) => { slide.hidden = i !== index; });
        if (counter) counter.textContent = (index + 1) + ' / ' + slides.length;
      };
      const click = event => {
        const button = event.target.closest('[data-carousel-step]');
        if (!button || button.closest('[data-editor-carousel]') !== element || button.disabled) return;
        show(index + Number(button.getAttribute('data-carousel-step')));
      };
      const keydown = event => {
        if (event.target.closest('input,textarea,select,button,[contenteditable=true]')) return;
        if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') { event.preventDefault(); show(index + (event.key === 'ArrowRight' ? 1 : -1)); }
      };
      const start = event => { touch = event.touches.length === 1 ? {x:event.touches[0].clientX,y:event.touches[0].clientY} : null; };
      const end = event => {
        if (!touch || !event.changedTouches.length) return;
        const dx = event.changedTouches[0].clientX - touch.x, dy = event.changedTouches[0].clientY - touch.y; touch = null;
        if (Math.abs(dx) >= 40 && Math.abs(dx) > Math.abs(dy) * 1.2) show(index + (dx < 0 ? 1 : -1));
      };
      const cancel = () => { touch = null; };
      element.addEventListener('click', click);
      element.addEventListener('keydown', keydown);
      element.addEventListener('touchstart', start, {passive:true});
      element.addEventListener('touchend', end, {passive:true});
      element.addEventListener('touchcancel', cancel);
      show(0);
      attached.set(element, () => {
        element.removeEventListener('click', click); element.removeEventListener('keydown', keydown);
        element.removeEventListener('touchstart', start); element.removeEventListener('touchend', end); element.removeEventListener('touchcancel', cancel);
      });
    });
  }
  const observer = new MutationObserver(scan);
  observer.observe(root, {childList:true,subtree:true}); scan();
  return () => { observer.disconnect(); for (const cleanup of attached.values()) cleanup(); attached.clear(); style.remove(); };
}

installCarouselRuntime(document);</script>
<script>// Shared by the editor preview, exported HTML and the documentation site.
/** @param {Document | HTMLElement} root */
function installInteractions(root = document) {
  const carousels = new Map();
  const style = document.createElement('style');
  style.textContent = '.doc-carousel{border:1px solid #dbe3ef;border-radius:12px;padding:12px;margin:20px 0}.doc-carousel [data-slide][hidden]{display:none!important}.doc-carousel img{display:block;max-width:100%;max-height:480px;object-fit:contain;margin:auto}.doc-carousel nav{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:12px}.doc-carousel button{border:1px solid #ccd6e4;border-radius:6px;padding:6px 12px;background:white;color:#183b6c;cursor:pointer}.doc-carousel button[aria-current=true]{background:#326dff;color:white}.doc-anchor{scroll-margin-top:100px}';
  document.head.append(style);
  function scan() {
    for (const [el, stop] of carousels) if (!root.contains(el)) { stop(); carousels.delete(el); }
    root.querySelectorAll('[data-doc-carousel]').forEach(el => {
      if (carousels.has(el)) return;
      const slides = [...el.querySelectorAll('[data-slide]')];
      const buttons = [...el.querySelectorAll('[data-slide-to]')];
      let index = 0, paused = false, hover = false;
      const show = value => {
        index = (value + slides.length) % slides.length;
        slides.forEach((slide, i) => { slide.hidden = i !== index; });
        buttons.forEach((b, i) => b.setAttribute('aria-current', String(i === index)));
      };
      const click = e => {
        const b = e.target.closest('button'); if (!b || !el.contains(b)) return;
        if (b.hasAttribute('data-slide-to')) show(Number(b.dataset.slideTo));
        if (b.hasAttribute('data-slide-step')) show(index + Number(b.dataset.slideStep));
        if (b.hasAttribute('data-slide-pause')) { paused = !paused; b.textContent = paused ? 'Продолжить' : 'Пауза'; b.setAttribute('aria-pressed', String(paused)); }
      };
      const enter = () => { hover = true; }, leave = () => { hover = false; };
      el.addEventListener('click', click); el.addEventListener('mouseenter', enter); el.addEventListener('mouseleave', leave);
      const timer = setInterval(() => { if (slides.length > 1 && !paused && !hover && !document.hidden && !el.contains(document.activeElement)) show(index + 1); }, 3000);
      if (slides.length) show(0);
      carousels.set(el, () => { clearInterval(timer); el.removeEventListener('click', click); el.removeEventListener('mouseenter', enter); el.removeEventListener('mouseleave', leave); });
    });
  }
  // The offline site uses #/page@anchor; native documentation uses #anchor.
  function anchorClick(e) {
    const link = e.target.closest('a[href^="#"]'); if (!link || !root.contains(link)) return;
    const href = link.getAttribute('href'); if (!href || href === '#' || href.startsWith('#/')) return;
    let id; try { id = decodeURIComponent(href.slice(1)); } catch { return; }
    const target = [...root.querySelectorAll('[id]')].find(el => el.id === id); if (!target) return;
    e.preventDefault(); target.scrollIntoView({behavior:'smooth',block:'start'});
    if (location.hash.startsWith('#/')) history.replaceState(null, '', location.hash.split('@')[0] + '@' + encodeURIComponent(id));
    else if (!root.closest?.('.document-preview')) history.replaceState(null, '', '#' + encodeURIComponent(id));
  }
  root.addEventListener('click', anchorClick);
  const observer = new MutationObserver(scan); observer.observe(root, {childList:true,subtree:true}); scan();
  return () => { observer.disconnect(); root.removeEventListener('click', anchorClick); for (const stop of carousels.values()) stop(); style.remove(); };
}

installInteractions(document);</script></body></html>
