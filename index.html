Code&quot;: 0,\n        &quot;Status&quot;: &quot;Authorized&quot;,\n        &quot;StatusCode&quot;: 2,\n        &quot;CultureName&quot;: &quot;ru&quot;,\n        &quot;Reason&quot;: &quot;Approved&quot;,\n        &quot;CardHolderMessage&quot;: &quot;Оплата успешно проведена&quot;,\n        &quot;Type&quot;: 0,\n        &quot;Refunded&quot;: false,\n        &quot;Name&quot;: null,\n        &quot;Token&quot;: null,\n        &quot;SubscriptionId&quot;: null,\n        &quot;GatewayName&quot;: &quot;Test&quot;,\n        &quot;AndroidPay&quot;: false,\n        &quot;WalletType&quot;: &quot;&quot;,\n        &quot;TotalFee&quot;: 0\n    },\n    &quot;Success&quot;: true,\n    &quot;Message&quot;: null\n}\u003c/code>\u003c/pre>\u003c/div>\u003cp>В ответ на запрос, в \u003ca href=\"https://developers.cloudpayments.ru/#pay\" target=\"_blank\" rel=\"noopener noreferrer\">Pay\u003c/a> уведомлении будет получен уникальный EscrowAccumulationId.\u003c/p>\u003cp>Также, при условии успешной транзакции, \u003ccode>EscrowAccumulationId\u003c/code> будет содержаться во всех вебхуках, кроме Check вебхука.\u003c/p>\u003cp>\u003cstrong>Оплата (по созданному накоплению)\u003c/strong>\u003c/p>\u003cp>Для последующих запросов (оплат), в рамках созданной безопасной сделки, необходимо добавить в запрос \u003cstrong>payments/cards/charge AccumulationId\u003c/strong> в объект \u003ccode>Escrow\u003c/code> с указанием \u003ccode>&quot;StartAccumulation&quot;: false\u003c/code> и тип сделки \u003ccode>&quot;EscrowType&quot;:0\u003c/code> или \u003ccode>&quot;EscrowType&quot;: “NToOne&quot;\u003c/code>:\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>json\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-7\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-7\" class=\"language-json\">&quot;Escrow&quot;:{\n    &quot;StartAccumulation&quot;:false,\n    &quot;EscrowType&quot;: &quot;NToOne&quot;, \n    &quot;AccumulationId&quot;: &quot;365b6942-94e8-4c5b-aff5-392dc1a51c28&quot;,\n}\u003c/code>\u003c/pre>\u003c/div>\u003cp>Ответ:\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>json\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-8\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-8\" class=\"language-json\">{\n    &quot;Model&quot;: {\n        &quot;ReasonCode&quot;: 0,\n        &quot;PublicId&quot;: &quot;pk_71efb26a18397ec61b755221123cc&quot;,\n        &quot;TerminalUrl&quot;: &quot;https://example.com&quot;,\n        &quot;TransactionId&quot;: 10649405,\n        &quot;Amount&quot;: 215,\n        &quot;Currency&quot;: &quot;RUB&quot;,\n        &quot;CurrencyCode&quot;: 0,\n        &quot;PaymentAmount&quot;: 215,\n        &quot;PaymentCurrency&quot;: &quot;RUB&quot;,\n        &quot;PaymentCurrencyCode&quot;: 0,\n        &quot;InvoiceId&quot;: null,\n        &quot;AccountId&quot;: null,\n        &quot;Email&quot;: null,\n        &quot;Description&quot;: null,\n        &quot;JsonData&quot;: &quot;{\\&quot;Phone\\&quot;: \\&quot;+71234567890\\&quot;}&quot;,\n        &quot;CreatedDate&quot;: &quot;/Date(1640787317880)/&quot;,\n        &quot;PayoutDate&quot;: null,\n        &quot;PayoutDateIso&quot;: null,\n        &quot;PayoutAmount&quot;: null,\n        &quot;CreatedDateIso&quot;: &quot;2021-12-29T14:15:17&quot;,\n        &quot;AuthDate&quot;: &quot;/Date(1640787319410)/&quot;,\n        &quot;AuthDateIso&quot;: &quot;2021-12-29T14:15:19&quot;,\n        &quot;ConfirmDate&quot;: null,\n        &quot;ConfirmDateIso&quot;: null,\n        &quot;AuthCode&quot;: &quot;A1B2C3&quot;,\n        &quot;TestMode&quot;: true,\n        &quot;Rrn&quot;: null,\n        &quot;OriginalTransactionId&quot;: null,\n        &quot;FallBackScenarioDeclinedTransactionId&quot;: null,\n        &quot;IpAddress&quot;: &quot;127.0.0.1&quot;,\n        &quot;IpCountry&quot;: &quot;RU&quot;,\n        &quot;IpCity&quot;: &quot;Новосибирск&quot;,\n        &quot;IpRegion&quot;: &quot;Новосибирская область&quot;,\n        &quot;IpDistrict&quot;: &quot;Сибирский федеральный округ&quot;,\n        &quot;IpLatitude&quot;: 1.03923,\n        &quot;IpLongitude&quot;: 1.927818,\n        &quot;CardFirstSix&quot;: &quot;411111&quot;,\n        &quot;CardLastFour&quot;: &quot;1111&quot;,\n        &quot;CardExpDate&quot;: &quot;11/23&quot;,\n        &quot;CardType&quot;: &quot;Visa&quot;,\n        &quot;CardProduct&quot;: &quot;C&quot;,\n        &quot;CardCategory&quot;: &quot;Visa Signature (Signature)&quot;,\n        &quot;EscrowAccumulationId&quot;: &quot;365b6942-94e8-4c5b-aff5-392dc1a51c28&quot;,\n        &quot;IssuerBankCountry&quot;: &quot;RU&quot;,\n        &quot;Issuer&quot;: &quot;CloudPayments&quot;,\n        &quot;CardTypeCode&quot;: 0,\n        &quot;Status&quot;: &quot;Authorized&quot;,\n        &quot;StatusCode&quot;: 2,\n        &quot;CultureName&quot;: &quot;ru&quot;,\n        &quot;Reason&quot;: &quot;Approved&quot;,\n        &quot;CardHolderMessage&quot;: &quot;Оплата успешно проведена&quot;,\n        &quot;Type&quot;: 0,\n        &quot;Refunded&quot;: false,\n        &quot;Name&quot;: null,\n        &quot;Token&quot;: null,\n        &quot;SubscriptionId&quot;: null,\n        &quot;GatewayName&quot;: &quot;Test&quot;,\n        &quot;AndroidPay&quot;: false,\n        &quot;WalletType&quot;: &quot;&quot;,\n        &quot;TotalFee&quot;: 0\n    },\n    &quot;Success&quot;: true,\n    &quot;Message&quot;: null\n}\n\u003c/code>\u003c/pre>\u003c/div>\u003cp>\u003cstrong>Выплата\u003c/strong>\u003c/p>\u003cp>Для завершения сделки необходимо отправить запрос \u003cstrong>payments/token/topup\u003c/strong> с указанием \u003ccode>AccumulationId\u003c/code> и массива транзакций к выплате:\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>json\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-9\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-9\" class=\"language-json\">&quot;Escrow&quot;: {\n  &quot;AccumulationId&quot;: &quot;365b6942-94e8-4c5b-aff5-392dc1a51c28&quot;, \n  &quot;TransactionIds&quot;: [10649405, 10649404],\n  &quot;EscrowType&quot;: &quot;NToOne&quot;\n}\u003c/code>\u003c/pre>\u003c/div>\u003cp>Массив транзакций оплаты для выплаты должен должен содержать только транзакции, которые проводились по терминалу оплаты с текущим \u003cstrong>AccumulationId\u003c/strong>. Выплата будет осуществлена только по тем \u003cstrong>TransactionId\u003c/strong>, которые были указаны в \u003cstrong>TransactionIds\u003c/strong> в запросе \u003cstrong>payments/token/topup\u003c/strong>. По неуказанным транзакциям, провести выплату не возможно, т.к. сделка будет уже закрытой. Т.е. по закрытой сделке невозможно сделать как оплату, так и выплату.\u003c/p>\u003caside class=\"api-callout warning\" role=\"note\">\u003cstrong class=\"callout-label\">Внимание\u003c/strong>\u003cp>По транзакциям оплаты, которые не были переданы для закрытия сделки будет осуществлен возврат денежных средств плательщику.\u003c/p>\u003c/aside>\u003ch3 id=\"ogranicheniya\">\u003cstrong>Ограничения\u003c/strong>\u003c/h3>\u003cp>Сумма выплат должна быть меньше, либо равна сумме оплат.\u003c/p>\u003cp>Ни по одной из транзакций, указанных в массиве транзакций для выплаты не должно быть отмен/полных возвратов (частичные возвраты производить можно).\u003c/p>\u003cp>Если запрос на оплату приходит с \u003ccode>AccumulationId\u003c/code>, а по нему уже есть выплата - оплата будет отклонена.\u003c/p>\u003cp>Все транзакции для выплаты должны быть:\u003c/p>\u003cul>\u003cli>\u003cp>с одинаковым AccumulationId\u003c/p>\u003c/li>\u003cli>\u003cp>не выплачены\u003c/p>\u003c/li>\u003cli>\u003cp>в валюте &quot;рубль&quot;\u003c/p>\u003c/li>\u003cli>\u003cp>типа \u003cstrong>Payment\u003c/strong>\u003c/p>\u003c/li>\u003cli>\u003cp>в статусе \u003cstrong>Completed\u003c/strong>\u003c/p>\u003c/li>\u003c/ul>\u003ch2 id=\"1-n\">\u003cstrong>1:N\u003c/strong>\u003c/h2>\u003ch3 id=\"shema-integratsii-dlya-widget-2\">\u003cstrong>Схема интеграции для Widget:\u003c/strong>\u003c/h3>\u003cp>Переменная содержащая тип сделки, которая содержится в объекте cp.constant.escrow. Она отвечает за схему проведения сделки:\u003c/p>\u003cp>1. Множество оплат и одна выплата;\u003c/p>\u003cp>2. Одна оплата и множество выплат.\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>json\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-10\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-10\" class=\"language-json\">{\n  NToOne: 0,\n  OneToN: 1\n}\u003c/code>\u003c/pre>\u003c/div>\u003cp>\u003cstrong>Пример использования\u003c/strong>:\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>json\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-11\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-11\" class=\"language-json\">cp.constant.escrow.NToOne // переменная для типа сделки = 0\ncp.constant.escrow.OneToN // переменная для типа сделки = 1\u003c/code>\u003c/pre>\u003c/div>\u003cp>Оплата\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>json\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-12\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-12\" class=\"language-json\">var widget = new cp.CloudPayments();\n\n  const intentParams = {\n    publicTerminalId: &quot;test_api_00000000000000000000002&quot;,\n    paymentSchema: &#39;Dual&#39;,\n    description: &quot;Оплата заказа №...&quot;,\n    amount: 100,\n    currency: &quot;RUB&quot;,\n    culture: &quot;ru-RU&quot;,\n    skin: &quot;classic&quot;,\n    externalId: &#39;string&#39;,\n    receiptEmail: &quot;user@email.com&quot;,\n    userInfo: {\n      email: &quot;user@email.com&quot;,\n      phone: &quot;+71234567890&quot;,\n    },\n    metadata: {\n      myProp: &quot;myProp value&quot;,\n    },\n    escrow: {\n      startAccumulation: true,\n      accumulationId: null,\n      escrowType: &quot;OneToN&quot;\n    },\n  };\n\n  widget.oncomplete = (result) =&gt; {\n      console.log(result);\n  }\n\n  widget.start(intentParams).then(function(widgetResult) {\n    console.log(&#39;result&#39;, widgetResult); // действие при успехе\n  }).catch(function(error) {\n    console.log(&#39;error&#39;, error); // действие при ошибке\n  });\u003c/code>\u003c/pre>\u003c/div>\u003cp>В ответ на запрос, в \u003ca href=\"https://developers.cloudpayments.ru/#pay\" target=\"_blank\" rel=\"noopener noreferrer\">Pay\u003c/a> уведомлении будет получен уникальный \u003cstrong>EscrowAccumulationId\u003c/strong>.\u003c/p>\u003cp>Также, при условии успешной транзакции, EscrowAccumulationId будет содержаться во всех вебхуках, кроме Check вебхука.\u003c/p>\u003ch3 id=\"shema-integratsii-dlya-api-checkout-2\">\u003cstrong>Схема интеграции для API Checkout:\u003c/strong>\u003c/h3>\u003cp>\u003cstrong>Оплата\u003c/strong>\u003c/p>\u003cp>Необходимо использовать запрос \u003cstrong>payments/cards/charge\u003c/strong> (либо \u003cstrong>auth\u003c/strong>), где в теле в теле запроса в объекте \u003ccode>escrow\u003c/code> нужно передать \u003ccode>&quot;StartAccumulation&quot;: true\u003c/code> и тип сделки \u003ccode>&quot;EscrowType&quot;:1\u003c/code> или \u003ccode>&quot;EscrowType&quot;: &quot;OneToN&quot;\u003c/code> . То есть для \u003ccode>EscrowType\u003c/code> значения можно передавать как целочисленное значение (0/1), так и строковым представлением (NToOne/OneToN).\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>json\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-13\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-13\" class=\"language-json\">&quot;Escrow&quot;:{\n    &quot;StartAccumulation&quot;:true,\n    &quot;EscrowType&quot;: &quot;OneToN&quot;\n}\u003c/code>\u003c/pre>\u003c/div>\u003cp>В ответ на запрос будет получен уникальный \u003ccode>EscrowAccumulationId\u003c/code>.\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>json\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-14\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-14\" class=\"language-json\">{\n    &quot;Model&quot;: {\n        &quot;ReasonCode&quot;: 0,\n        &quot;PublicId&quot;: &quot;pk_71efb26a18397ec61b755221123cc&quot;,\n        &quot;TerminalUrl&quot;: &quot;https://example.com&quot;,\n        &quot;TransactionId&quot;: 10649404,\n        &quot;Amount&quot;: 215,\n        &quot;Currency&quot;: &quot;RUB&quot;,\n        &quot;CurrencyCode&quot;: 0,\n        &quot;PaymentAmount&quot;: 215,\n        &quot;PaymentCurrency&quot;: &quot;RUB&quot;,\n        &quot;PaymentCurrencyCode&quot;: 0,\n        &quot;InvoiceId&quot;: null,\n        &quot;AccountId&quot;: null,\n        &quot;Email&quot;: null,\n        &quot;Description&quot;: null,\n        &quot;JsonData&quot;: &quot;{\\&quot;Phone\\&quot;: \\&quot;+71234567890\\&quot;}&quot;,\n        &quot;CreatedDate&quot;: &quot;/Date(1640787010601)/&quot;,\n        &quot;PayoutDate&quot;: null,\n        &quot;PayoutDateIso&quot;: null,\n        &quot;PayoutAmount&quot;: null,\n        &quot;CreatedDateIso&quot;: &quot;2021-12-29T14:10:10&quot;,\n        &quot;AuthDate&quot;: &quot;/Date(1640787010877)/&quot;,\n        &quot;AuthDateIso&quot;: &quot;2021-12-29T14:10:10&quot;,\n        &quot;ConfirmDate&quot;: null,\n        &quot;ConfirmDateIso&quot;: null,\n        &quot;AuthCode&quot;: &quot;A1B2C3&quot;,\n        &quot;TestMode&quot;: true,\n        &quot;Rrn&quot;: null,\n        &quot;OriginalTransactionId&quot;: null,\n        &quot;FallBackScenarioDeclinedTransactionId&quot;: null,\n        &quot;IpAddress&quot;: &quot;127.0.0.1&quot;,\n        &quot;IpCountry&quot;: &quot;RU&quot;,\n        &quot;IpCity&quot;: &quot;Новосибирск&quot;,\n        &quot;IpRegion&quot;: &quot;Новосибирская область&quot;,\n        &quot;IpDistrict&quot;: &quot;Сибирский федеральный округ&quot;,\n        &quot;IpLatitude&quot;: 1.03923,\n        &quot;IpLongitude&quot;: 1.927818,\n        &quot;CardFirstSix&quot;: &quot;411111&quot;,\n        &quot;CardLastFour&quot;: &quot;1111&quot;,\n        &quot;CardExpDate&quot;: &quot;11/23&quot;,\n        &quot;CardType&quot;: &quot;Visa&quot;,\n        &quot;CardProduct&quot;: &quot;C&quot;,\n        &quot;CardCategory&quot;: &quot;Visa Signature (Signature)&quot;,\n        &quot;EscrowAccumulationId&quot;: &quot;365b6942-94e8-4c5b-aff5-392dc1a51c28&quot;,\n        &quot;IssuerBankCountry&quot;: &quot;RU&quot;,\n        &quot;Issuer&quot;: &quot;CloudPayments&quot;,\n        &quot;CardTypeCode&quot;: 0,\n        &quot;Status&quot;: &quot;Authorized&quot;,\n        &quot;StatusCode&quot;: 2,\n        &quot;CultureName&quot;: &quot;ru&quot;,\n        &quot;Reason&quot;: &quot;Approved&quot;,\n        &quot;CardHolderMessage&quot;: &quot;Оплата успешно проведена&quot;,\n        &quot;Type&quot;: 0,\n        &quot;Refunded&quot;: false,\n        &quot;Name&quot;: null,\n        &quot;Token&quot;: null,\n        &quot;SubscriptionId&quot;: null,\n        &quot;GatewayName&quot;: &quot;Test&quot;,\n        &quot;AndroidPay&quot;: false,\n        &quot;WalletType&quot;: &quot;&quot;,\n        &quot;TotalFee&quot;: 0\n    },\n    &quot;Success&quot;: true,\n    &quot;Message&quot;: null\n}\u003c/code>\u003c/pre>\u003c/div>\u003cp>В ответ на запрос, в \u003ca href=\"https://developers.cloudpayments.ru/#pay\" target=\"_blank\" rel=\"noopener noreferrer\">Pay\u003c/a> уведомлении будет получен уникальный \u003ccode>EscrowAccumulationId\u003c/code>.\u003c/p>\u003cp>Также, при условии успешной транзакции, \u003ccode>EscrowAccumulationId\u003c/code> будет содержаться во всех вебхуках, кроме Check вебхука.\u003c/p>\u003cp>\u003cstrong>Выплата\u003c/strong>\u003c/p>\u003cp>Для завершения сделки необходимо отправить запрос \u003cstrong>payments/token/topup\u003c/strong> с указанием \u003ccode>AccumulationId\u003c/code> и массива транзакций к выплате (в массиве должен содержаться только один \u003ccode>transactionId\u003c/code>, согласно схеме сделки):\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>json\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-15\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-15\" class=\"language-json\">&quot;Escrow&quot;: {\n  &quot;AccumulationId&quot;: &quot;365b6942-94e8-4c5b-aff5-392dc1a51c28&quot;, \n  &quot;TransactionIds&quot;: [10649404],\n  &quot;EscrowType&quot;: &quot;OneToN&quot;\n}\u003c/code>\u003c/pre>\u003c/div>\u003caside class=\"api-callout warning\" role=\"note\">\u003cstrong class=\"callout-label\">Внимание\u003c/strong>\u003cp>Выплаты можно производить до тех пор, пока сумма всех выплат не будет равна сумме операции оплаты.\u003c/p>\u003c/aside>\u003cp>Для закрытия сделки существует 2 способа:\u003c/p>\u003col start=\"1\">\u003cli>\u003cp>Передать параметр в объект Escrow &quot;FinalPayout&quot;: true (сделка закроется, даже если сумма выплат меньше суммы оплаты);\u003c/p>\u003c/li>\u003c/ol>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>json\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-16\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-16\" class=\"language-json\">&quot;Escrow&quot;: {\n  &quot;AccumulationId&quot;: &quot;365b6942-94e8-4c5b-aff5-392dc1a51c28&quot;, \n  &quot;TransactionIds&quot;: [10649404],\n  &quot;EscrowType&quot;: &quot;OneToN&quot;,\n  &quot;FinalPayout&quot;: true\n}\u003c/code>\u003c/pre>\u003c/div>\u003col start=\"2\">\u003cli>\u003cp>Когда сумма выплат будет равна сумме операции оплаты, сделка будет автоматически закрыта.\u003c/p>\u003c/li>\u003c/ol>\u003cp>Выплаты будут осуществляться только по тому \u003ccode>TransactionId\u003c/code>, который был указан в массиве \u003ccode>TransactionIds\u003c/code> (для 1:N только один ID операции оплаты) в запросе \u003cstrong>payments/token/topup\u003c/strong>.\u003c/p>\u003ch3 id=\"ogranicheniya-2\">\u003cstrong>Ограничения\u003c/strong>\u003c/h3>\u003cp>Сумма выплат должна быть меньше, либо равна сумме оплат.\u003c/p>\u003cp>По транзакции оплаты не должно быть отмены/полного возврата (частичные возвраты производить можно).\u003c/p>\u003cp>Все транзакции выплат должны быть:\u003c/p>\u003cul>\u003cli>\u003cp>с одинаковым \u003ccode>AccumulationId\u003c/code>;\u003c/p>\u003c/li>\u003cli>\u003cp>в валюте &quot;рубль&quot;;\u003c/p>\u003c/li>\u003cli>\u003cp>в статусе \u003cstrong>Completed\u003c/strong>;\u003c/p>\u003c/li>\u003cli>\u003cp>все транзакции выплат производятся в одной схеме (OneToN);\u003c/p>\u003c/li>\u003cli>\u003cp>Сделка не должна быть закрыта (не был передан finalPayout: true, сумма выплат меньше суммы операции оплаты)\u003c/p>\u003c/li>\u003c/ul>\u003ch2 id=\"poluchenie-po-accumulationid-statusa-operatsiy\">\u003cstrong>Получение по AccumulationId статуса операций\u003c/strong>\u003c/h2>\u003cp>Для получения информации требуется отправить http-запрос с типом авторизации “Basic Auth”. Логин - public key (pk) терминала. Подойдет как терминал оплаты, так и терминал выплаты. Пароль - api secret от данного Pk.\u003c/p>\u003caside class=\"api-callout \" role=\"note\">\u003cstrong class=\"callout-label\">Информация\u003c/strong>\u003cp>pk и api secret можно посмотреть в Личном кабинете в настройках сайта.\u003c/p>\u003c/aside>\u003caside class=\"api-callout warning\" role=\"note\">\u003cstrong class=\"callout-label\">Внимание\u003c/strong>\u003cp>Получение информация доступно только по тем accumaltionIDs, которые были сформированы в рамках этой связки терминалов.\u003c/p>\u003c/aside>\u003ch2 id=\"metod-dlya-polucheniya-informatsii-po-bs-dlya-oboih-tipov-sdelki-n-1-i-1-n\">\u003cstrong>Метод для получения информации по БС для обоих типов сделки (N:1 и 1:N)\u003c/strong>\u003c/h2>\u003cp>Публичный метод для получения информации по массиву \u003cstrong>EscrowAccumulationId\u003c/strong>, который позволяет получить:\u003c/p>\u003cul>\u003cli>\u003cp>Массив оплат, по которым не была сделана выплата\u003cbr>\u003c/p>\u003cul>\u003cli>\u003cp>id транзакции \u003cstrong>оплаты\u003c/strong>\u003c/p>\u003c/li>\u003cli>\u003cp>статус транзакции (текстовое значение)\u003c/p>\u003c/li>\u003cli>\u003cp>сумма транзакции\u003c/p>\u003c/li>\u003c/ul>\u003c/li>\u003cli>\u003cp>Массив оплат, по которым была сделана выплата (которые вошли в выплату)\u003cbr>\u003c/p>\u003cul>\u003cli>\u003cp>id транзакции \u003cstrong>оплаты\u003c/strong>\u003c/p>\u003c/li>\u003cli>\u003cp>статус транзакции (текстовое значение)\u003c/p>\u003c/li>\u003cli>\u003cp>сумма транзакции\u003c/p>\u003c/li>\u003c/ul>\u003c/li>\u003cli>\u003cp>Массив возвратов по всем транзакциям\u003cbr>\u003c/p>\u003cul>\u003cli>\u003cp>id транзакции \u003cstrong>оплаты\u003c/strong>\u003c/p>\u003c/li>\u003cli>\u003cp>статус транзакции (текстовое значение)\u003c/p>\u003c/li>\u003cli>\u003cp>сумма транзакции\u003c/p>\u003c/li>\u003c/ul>\u003c/li>\u003cli>\u003cp>Массив транзакций выплат (для 1:N)\u003cbr>\u003c/p>\u003cul>\u003cli>\u003cp>id транзакции \u003cstrong>выплаты\u003c/strong>\u003c/p>\u003c/li>\u003cli>\u003cp>статус транзакции (текстовое значение)\u003c/p>\u003c/li>\u003cli>\u003cp>сумма транзакции \u003cstrong>выплаты\u003c/strong>\u003c/p>\u003c/li>\u003cli>\u003cp>признак закрытия сделки \u003cstrong>IsFinalPayout\u003c/strong>\u003c/p>\u003c/li>\u003c/ul>\u003c/li>\u003cli>\u003cp>Сальдо (Balance)\u003cbr>\u003c/p>\u003cul>\u003cli>\u003cp>Balance = PaymentsSum - RefundsSum - PayoutsSum\u003c/p>\u003c/li>\u003c/ul>\u003c/li>\u003c/ul>\u003cp>\u003cstrong>Адрес метода:\u003c/strong>\u003c/p>\u003cp>\u003ca href=\"https://api.cloudpayments.ru/Escrow/GetEscrowInfo\" target=\"_blank\" rel=\"noopener noreferrer\">https://api.cloudpayments.ru/Escrow/GetEscrowInfo\u003c/a>\u003c/p>\u003cp>\u003cstrong>Пример запроса:\u003c/strong>\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>json\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-17\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-17\" class=\"language-json\">{\n  &quot;EscrowAccumulationIds&quot; : [&quot;7de3281f-4339-4e2e-9df9-06dcfbcdceac&quot;]\n}\u003c/code>\u003c/pre>\u003c/div>\u003cp>\u003cstrong>Пример ответа:\u003c/strong>\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>json\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-18\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-18\" class=\"language-json\">{\n    &quot;Model&quot;: [\n        {\n            &quot;Status&quot;: &quot;Closed&quot;,\n            &quot;PaidoutTransactions&quot;: [\n                {\n                    &quot;Id&quot;: 608632,\n                    &quot;Status&quot;: &quot;Completed&quot;,\n                    &quot;Amount&quot;: 1500.0\n                },\n                {\n                    &quot;Id&quot;: 608631,\n                    &quot;Status&quot;: &quot;Completed&quot;,\n                    &quot;Amount&quot;: 901.0\n                }\n            ],\n            &quot;NotPaidoutTransactions&quot;: [\n                {\n                    &quot;Id&quot;: 608632,\n                    &quot;Status&quot;: &quot;Completed&quot;,\n                    &quot;Amount&quot;: 1500.0\n                },\n                {\n                    &quot;Id&quot;: 608634,\n                    &quot;Status&quot;: &quot;Completed&quot;,\n                    &quot;Amount&quot;: 901.0\n                }\n            ],\n            &quot;PayoutTransactions&quot;: [\n                {\n                    &quot;Id&quot;: 608635,\n                    &quot;Status&quot;: &quot;Completed&quot;,\n                    &quot;Amount&quot;: 1500.0, \n                    &quot;IsFinalPayout&quot;: true\n                },\n                {\n                    &quot;Id&quot;: 608636,\n                    &quot;Status&quot;: &quot;Completed&quot;,\n                    &quot;Amount&quot;: 901.0, \n                    &quot;IsFinalPayout&quot;: false\n                }\n            ],\n            &quot;RefundedTransactions&quot;: null,\n            &quot;EscrowAccumulationId&quot;: &quot;2533b003-da5d-463f-af85-fe6621354cd6&quot;,\n            &quot;Balance&quot;: 0.0\n        }\n    ],\n    &quot;Success&quot;: true,\n    &quot;Message&quot;: null\n}\u003c/code>\u003c/pre>\u003c/div>\u003ch3 id=\"znachenie-polya-status-dlya-sdelki\">\u003cstrong>Значение поля \u003c/strong>\u003ccode>Status\u003c/code>\u003cstrong> для сделки:\u003c/strong>\u003c/h3>\u003cul>\u003cli>\u003cp>Open\u003c/p>\u003c/li>\u003cli>\u003cp>Closed\u003c/p>\u003c/li>\u003c/ul>\u003cp>\u003cbr>\u003c/p>\u003c/div>","toc":[{"id":"opisanie-produkta","title":"Описание продукта","level":2},{"id":"opredeleniya-i-terminy","title":"Определения и термины:","level":2},{"id":"nastroyka-podklyucheniya","title":"Настройка подключения:","level":2},{"id":"chemy-raboty","title":"Cхемы работы","level":2},{"id":"statusnaya-model-sdelki","title":"Статусная модель сделки","level":2},{"id":"n-1","title":"N:1","level":2},{"id":"shema-integratsii-dlya-widget","title":"Схема интеграции для Widget:","level":3},{"id":"shema-integratsii-dlya-api-checkout","title":"Схема интеграции для API Checkout:","level":3},{"id":"ogranicheniya","title":"Ограничения","level":3},{"id":"1-n","title":"1:N","level":2},{"id":"shema-integratsii-dlya-widget-2","title":"Схема интеграции для Widget:","level":3},{"id":"shema-integratsii-dlya-api-checkout-2","title":"Схема интеграции для API Checkout:","level":3},{"id":"ogranicheniya-2","title":"Ограничения","level":3},{"id":"poluchenie-po-accumulationid-statusa-operatsiy","title":"Получение по AccumulationId статуса операций","level":2},{"id":"metod-dlya-polucheniya-informatsii-po-bs-dlya-oboih-tipov-sdelki-n-1-i-1-n","title":"Метод для получения информации по БС для обоих типов сделки (N:1 и 1:N)","level":2},{"id":"znachenie-polya-status-dlya-sdelki","title":"Значение поля Status для сделки:","level":3}],"type":"page","audience":"both"},"scenarios/customization":{"id":"scenarios/customization","title":"Кастомизация платежных интерфейсов","group":"scenarios","html":"","toc":[],"type":"page","audience":"both"},"tech/widget":{"id":"tech/widget","title":"Виджет","group":"tech","html":"\u003cdiv class=\"imported-api\">\u003ch2 id=\"начало-работы-с-виджетом\">Начало работы с виджетом\u003c/h2>\u003cp>\u003cbr>Платежный виджет — всплывающая форма для ввода реквизитов карты и e-mail адреса плательщика. Виджет автоматически определяет тип платежной системы: Visa, MasterCard, Maestro или &quot;МИР&quot;, а также банк-эмитент карты и показывает соответствующие логотипы. Форма оптимизирована для использования в любых браузерах и мобильных устройствах. Внутри виджета открывается iframe, который гарантирует безопасность передачи карточных данных и не требует от ТСП сертификации для использования.\u003c/p>\u003cp>Подробная \u003ca href=\"https://widget.cloudpayments.ru/docs/widget.html\" target=\"_blank\" rel=\"noopener noreferrer\">документация\u003c/a> для разработчиков.\u003c/p>\u003cp>Демо \u003ca href=\"https://widget.cloudpayments.ru/app/demo\" target=\"_blank\" rel=\"noopener noreferrer\">платежного конструктора\u003c/a>.\u003c/p>\u003caside class=\"api-callout warning\" role=\"note\">\u003cstrong class=\"callout-label\">Внимание\u003c/strong>\u003cp>Контроль суммы при оплате необходимо осуществлять самостоятельно. Для проверки суммы можно использовать уведомления: \u003ca href=\"https://developers.cloudpayments.ru/#check\" target=\"_blank\" rel=\"noopener noreferrer\">Check\u003c/a> - для проверки суммы до оплаты, \u003ca href=\"https://developers.cloudpayments.ru/#pay\" target=\"_blank\" rel=\"noopener noreferrer\">Pay\u003c/a> - для проверки суммы после оплаты\u003c/p>\u003c/aside>\u003ch2 id=\"section-1807c054-4763-49bf-bfca-7be4e7f41234\">Демо-конструктор\u003c/h2>\u003cp>Демонстрация работы виджета \u003ca href=\"https://developers.cloudpayments.ru/#platezhnyy-vidzhet\" target=\"_blank\" rel=\"noopener noreferrer\">Widget\u003c/a> представлена в нашем \u003ca href=\"https://show.cloudpayments.ru/widget/\" target=\"_blank\" rel=\"noopener noreferrer\">демо-магазине\u003c/a>.\u003cbr>Для тестирования можно использовать как \u003ca href=\"https://developers.cloudpayments.ru/#testirovanie\" target=\"_blank\" rel=\"noopener noreferrer\">тестовые карточные данные\u003c/a>, так и реальные. Списания денежных средств не произойдет.\u003c/p>\u003cfigure style=\"text-align:center\">\u003cimg src=\"static/img/editor/143fcc0541354575510a90a8b9830910b4a757e62d624601bfd5aa2bfe2e8330.png\" alt=\"widgetdark.png\" style=\"width:100%;max-width:100%;height:auto\">\u003c/figure>\u003ch2 id=\"mobilnyy-vidzhet\">\u003cstrong>Мобильный виджет\u003c/strong>\u003c/h2>\u003cp>Скрипт автоматически определяет устройство пользователя и запускает наиболее подходящий вариант виджета: обычный либо оптимизированный для мобильных устройств. Для удобства покупателей мобильная версия виджета занимает весь экран и предлагает провести оплату либо картой, либо одним из альтернативных методов оплаты.\u003c/p>\u003cfigure style=\"text-align:center\">\u003cimg src=\"static/img/editor/62b6bf754cfa639d97f1474a771d8691a1e5071cdaa03bcd5a283225dffc5eaf.png\" alt=\"mobile-widget-ios-f01ce97c.png\" style=\"width:100%;max-width:100%;height:auto\">\u003c/figure>\u003ch2 id=\"ustanovka-vidzheta\">\u003cstrong>Установка виджета\u003c/strong>\u003c/h2>\u003cp>Для установки виджета необходимо прописать на сайте скрипт в раздел \u003cstrong>head\u003c/strong>:\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>javascript\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-1\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-1\" class=\"language-javascript\">&lt;script src=&quot;https://widget.cloudpayments.ru/bundles/cloudpayments.js&quot;&gt;&lt;/script&gt;\u003c/code>\u003c/pre>\u003c/div>\u003caside class=\"api-callout warning\" role=\"note\">\u003cstrong class=\"callout-label\">Внимание\u003c/strong>\u003cp>Используйте cloudpayments.js, чтобы оставаться совместимым с PCI, гарантируя, что платежные реквизиты отправляются напрямую в CloudPayments, не затрагивая ваш сервер. Всегда загружайте cloudpayments.js с \u003ca href=\"https://widget.cloudpayments.ru/\" target=\"_blank\" rel=\"noopener noreferrer\">https://widget.cloudpayments.ru\u003c/a>, чтобы соответствовать требованиям. Не включайте скрипт в пакет и не размещайте его самостоятельно.\u003c/p>\u003c/aside>\u003cp>Для появления платежной формы необходимо зарегистрировать функцию для вызова метода \u003cstrong>start\u003c/strong>:\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>javascript\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-2\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-2\" class=\"language-javascript\">public start(intentParams: CreateIntentCommand): Promise&lt;WidgetResult&gt;\u003c/code>\u003c/pre>\u003c/div>\u003cp>И прописать вызов функции на событие, например, нажатие кнопки «Оплатить»:\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>javascript\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-3\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-3\" class=\"language-javascript\">$(&#39;#checkout&#39;).click(start);\u003c/code>\u003c/pre>\u003c/div>\u003caside class=\"api-callout \" role=\"note\">\u003cstrong class=\"callout-label\">Информация\u003c/strong>\u003cp>В примере используется библиотека jquery.\u003c/p>\u003c/aside>\u003cp>Демонстрация работы виджета представлена в нашем \u003ca href=\"https://show.cloudpayments.ru/\" target=\"_blank\" rel=\"noopener noreferrer\">демо-магазине\u003c/a>.\u003c/p>\u003cp>Пример реализации запуска виджета без библиотеки jquery:\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>javascript\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-4\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-4\" class=\"language-javascript\">document.querySelector(&#39;#checkout&#39;).onclick = start\u003c/code>\u003c/pre>\u003c/div>\u003ch3 id=\"section-25653198-9a24-4e85-a086-6d86c4c0f141\">Минимальный скрипт\u003c/h3>\u003cp>Минимальный скрипт, достаточный для запуска виджета \u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>json\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-5\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-5\" class=\"language-json\">{\n  &quot;publicTerminalId&quot;: &quot;test_api_00000000000000000000002&quot;, // идентификатор терминала\n  &quot;paymentSchema&quot;: &quot;Single&quot;, // Двухстадийная или одностадийная схема оплаты\n  &quot;description&quot;: &quot;Тестовая оплата&quot;, // описание списания\n  &quot;amount&quot;: 10000, // сумма\n  &quot;currency&quot;: &quot;RUB&quot; // валюта\n}\u003c/code>\u003c/pre>\u003c/div>\u003ch2 id=\"section-1a3f12ec-0b5c-4767-82ea-12636d40e947\">\u003cstrong>Полный скрипт и параметры\u003c/strong>\u003c/h2>\u003ch3 id=\"section-a1e811f3-7fb1-4b48-8e8b-c2f0842ec60a\">\u003cstrong>Скрипт\u003c/strong>\u003c/h3>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>json\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-6\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-6\" class=\"language-json\">const btn = document.getElementById(&quot;payButton&quot;)\n\nconst widget = new cp.CloudPayments();\n\nconst launchWidget = () =&gt; {\n  const intentParams = {\n    publicTerminalId: &quot;test_api_00000000000000000000002&quot;, // идентификатор терминала\n    description: &quot;Basket of oranges&quot;, // описание списания\n    paymentSchema: &#39;Dual&#39;, // схема\n    currency: &quot;RUB&quot;, // валюта\n    culture: &quot;ru-RU&quot;,\n    amount: 1001, // сумма\n    skin: &quot;modern&quot;, //дизайн виджета (необязательно)\n    autoClose: 3, //время в секундах до авто-закрытия виджета (необязательный)\n    cryptogramMode: false, // признак режима работы виджета. Если указано true - вместо проведения оплаты будет сформирована криптограмма карточных данных\n    externalId: &quot;your_system_payment_identifier&quot;, // идентификатор платежа в вашей системе\n    restrictedPaymentMethods: [ // список отключенных для данной оплаты методов\n        &#39;Sbp&#39;\n    ],\n    userInfo: {\n        accountId: &quot;your_system_user_id&quot;,\n        firstName: &quot;Test&quot;,\n        lastName: &quot;Test&quot;,\n        middleName: &quot;Test&quot;,\n        fullName: &quot;Test Test Test&quot;,\n        birth: &quot;2000-30-03&quot;,\n        address: &quot;д. 7&quot;,\n        street: &quot;ул. Тестовая&quot;,\n        city: &quot;г. Москва&quot;,\n        country: &quot;Россия&quot;,\n        phone: &quot;+71234567890&quot;,\n        postCode: &quot;119518&quot;,\n        email: &quot;user@email.com&quot;,\n        customField: {\n          name: &quot;your_field_name&quot;,\n          value: &quot;your_field_value&quot;\n        }\n    },\n    payerServiceFee: 50, // комиссия, оплачиваемая пользователем\n    recurrent: {\n        period: 1, // частота списания\n        interval: &#39;Day&#39;, // интервал списания\n        amount: 500, // сумма\n        startDate: &quot;2030-04-15T00:00:00.0000000Z&quot;, // дата начала\n        maxPeriods: 50, // количество списаний после которых рекуррент будет остановлен\n        receipt: { // чек для рекуррента\n            items: [ //товарные позиции\n                {\n                    label: &#39;Наименование товара 3&#39;, //наименование товара\n                    price: 300.00, //цена\n                    quantity: 3.00, //количество\n                    amount: 900.00, //сумма\n                    vat: 20, //ставка НДС\n                    method: 0, // тег-1214 признак способа расчета - признак способа расчета\n                    object: 0, // тег-1212 признак предмета расчета - признак предмета товара, работы, услуги, платежа, выплаты, иного предмета расчета\n                }\n            ],\n            taxationSystem: 0, //система налогообложения; необязательный, если у вас одна система налогообложения\n            email: &#39;user@example.com&#39;, //e-mail покупателя, если нужно отправить письмо с чеком\n            phone: &#39;&#39;, //телефон покупателя в любом формате, если нужно отправить сообщение со ссылкой на чек\n            isBso: false, //чек является бланком строгой отчетности\n            amounts: {\n                electronic: 900.00, // Сумма оплаты электронными деньгами\n                advancePayment: 0.00, // Сумма из предоплаты (зачетом аванса) (2 знака после точки)\n                credit: 0.00, // Сумма постоплатой(в кредит) (2 знака после точки)\n                provision: 0.00 // Сумма оплаты встречным предоставлением (сертификаты, др. мат.ценности) (2 знака после точки)\n            }\n        }\n    },\n    items: [{\n            id: &quot;your_system_item_unique_identifier_1&quot;, // уникальный идентификатор товара в вашей системе (или для данной оплаты)\n            name: &quot;Basket&quot;, // наименование товара\n            count: 1.0, // количество\n            price: 100, // стоимость\n            // label?: string | null;\n            // quantity?: number | null;\n        },\n        {\n            id: &quot;your_system_item_unique_identifier_2&quot;,\n            name: &quot;Orange&quot;,\n            count: 9.0,\n            price: 100,\n        }\n    ],\n    receipt: {\n        items: [ //товарные позиции\n            {\n                label: &quot;Наименование товара 1&quot;, //наименование товара\n                price: 100.00, //цена\n                quantity: 1.00, //количество\n                amount: 100.00, //сумма\n                vat: 0, //ставка НДС\n                method: 0, // тег-1214 признак способа расчета - признак способа расчета\n                object: 0, // тег-1212 признак предмета расчета - признак предмета товара, работы, услуги, платежа, выплаты, иного предмета расчета\n                measurementUnit: &quot;шт&quot; //единица измерения\n            }, {\n                label: &quot;Наименование товара 2&quot;, //наименование товара\n                price: 200.00, //цена\n                quantity: 2.00, //количество\n                amount: 300.00, //сумма со скидкой 25%\n                vat: 10, //ставка НДС\n                method: 0, // тег-1214 признак способа расчета - признак способа расчета\n                object: 0, // тег-1212 признак предмета расчета - признак предмета товара, работы, услуги, платежа, выплаты, иного предмета расчета\n                measurementUnit: &quot;шт&quot;, //единица измерения\n                excise: 0.01, // тег-1229 сумма акциза\n                countryOriginCode: &quot;156&quot;, // тег-1230 цифровой код страны происхождения товара в соответствии с Общероссийским классификатором стран мира 3 симв. \n                customsDeclarationNumber: &quot;54180656/1345865/3435625/23&quot;, // тег-1231 регистрационный номер таможенной декларации 32 симв. \n                ProductCodeData: //данные маркировки товара\n                {\n                    CodeProductNomenclature: &quot;3031303239303030303033343....a78495a4f6672754744773d3d&quot; //HEX представление штрих/бар кода маркировки целиком (Только для касс Микропэй)\n                }\n            }, {\n                label: &quot;Наименование товара 3&quot;, //наименование товара\n                price: 300.00, //цена\n                quantity: 3.00, //количество\n                amount: 900.00, //сумма\n                vat: 20, //ставка НДС\n                method: 0, // тег-1214 признак способа расчета - признак способа расчета\n                object: 0, // тег-1212 признак предмета расчета - признак предмета товара, работы, услуги, платежа, выплаты, иного предмета расчета\n                measurementUnit: &quot;шт&quot;, //единица измерения\n                AgentSign: 6, //признак агента, тег ОФД 1057, 1222\n                AgentData: { //данные агента, тег офд 1223\n                    AgentOperationName: null, // наименование операции банковского платежного агента или банковского платежного субагента, тег ОФД 1044\n                    PaymentAgentPhone: null, // телефон платежного агента, тег ОФД 1073\n                    PaymentReceiverOperatorPhone: null, // телефон оператора по приему платежей, тег ОФД 1074\n                    TransferOperatorPhone: null, // телефон оператора перевода, тег ОФД 1075\n                    TransferOperatorName: null, // наименование оператора перевода, тег ОФД 1026\n                    TransferOperatorAddress: null, // адрес оператора перевода, тег ОФД 1005\n                    TransferOperatorInn: null // ИНН оператора перевода, тег ОФД 1016\n                },\n                PurveyorData: { //данные поставщика платежного агента,  тег ОФД 1224\n                    Phone: &quot;+71234567890&quot;, // телефон поставщика, тег ОД 1171\n                    Name: &quot;ООО Ромашка&quot;, // наименование поставщика, тег ОФД 1225\n                    Inn: &quot;1234567890&quot; // ИНН поставщика, тег ОФД 1226\n                }\n            }\n        ],\n        calculationPlace: &quot;www.my.ru&quot;, //место осуществления расчёта, по умолчанию берется значение из кассы\n        taxationSystem: 0, //система налогообложения; необязательный, если у вас одна система налогообложения\n        email: &quot;user@example.com&quot;, //e-mail покупателя, если нужно отправить письмо с чеком\n        phone: &quot;&quot;, //телефон покупателя в любом формате, если нужно отправить сообщение со ссылкой на чек\n        customerInfo: &quot;&quot;, // тег-1227 Покупатель - наименование организации или фамилия, имя, отчество (при наличии), серия и номер паспорта покупателя (клиента)\n        customerInn: &quot;7708806063&quot;, // тег-1228 ИНН покупателя \n        isBso: false, //чек является бланком строгой отчётности\n        AgentSign: null, //признак агента, тег ОФД 1057\n        amounts: {\n            electronic: 1300.00, // Сумма оплаты электронными деньгами\n            advancePayment: 0.00, // Сумма из предоплаты (зачетом аванса) (2 знака после точки)\n            credit: 0.00, // Сумма постоплатой(в кредит) (2 знака после точки)\n            provision: 0.00 // Сумма оплаты встречным предоставлением (сертификаты, др. мат.ценности) (2 знака после точки)\n        }\n    },\n    metadata: {\n        referrerId: &quot;some_referrer_123&quot;\n    },\n    successRedirectUrl: &quot;&lt;https://example.com&gt;&quot;,\n    failRedirectUrl: &quot;&lt;https://failexample.com&gt;&quot;,\n    escrow: { \n        startAccumulation: true,\n        accumulationId: null,\n        escrowType: &quot;OneToN&quot;\n    },\n    retryPayment: false,\n    receiptEmail: &quot;user@example.com&quot;,\n    tokenize: true,\n    emailBehavior: &quot;Required&quot;,\n  };\n\n  widget.oncomplete = (result) =&gt; {\n      console.log(result);\n  }\n\n  widget.start(intentParams).then(function(widgetResult) {\n      console.log(&#39;result&#39;, widgetResult);\n  }).catch(function(error) {\n      console.log(&#39;error&#39;, error);\n  });\n}\n\nbtn.addEventListener(&#39;click&#39;, launchWidget)\u003c/code>\u003c/pre>\u003c/div>\u003cp>Для тестирования можно использовать как \u003ca href=\"https://developers.cloudpayments.ru/#testirovanie\" target=\"_blank\" rel=\"noopener noreferrer\">тестовые карточные данные\u003c/a>, так и реальные. Списания денежных средств не произойдет.\u003c/p>\u003ch3 id=\"parametry\">\u003cstrong>Параметры\u003c/strong>\u003c/h3>\u003caside class=\"api-callout \" role=\"note\">\u003cstrong class=\"callout-label\">Информация\u003c/strong>\u003cp>По требованию НСПК, для ТСП, предоставляющих телекоммуникационные услуги (MCC 4814 Telecommunication Services), обязательна передача номера телефона плательщика. При отсутствии номера телефона в запросе, банки-эквайеры будут отклонять проводимые операции.\u003cbr>\u003cbr>Номер телефона необходимо передавать в объекте Payer в параметре Phone.\u003cbr>Формат передачи: только цифры, без разделителей “( )“, “-“ .\u003cbr>Пример передачи: “+71234567890“\u003c/p>\u003c/aside>\u003cdiv class=\"api-table-scroll\" tabindex=\"0\" aria-label=\"Таблица\">\u003ctable style=\"table-layout:fixed;width:1201px;min-width:0\">\u003ccolgroup>\u003ccol style=\"width:240px\">\u003ccol style=\"width:87px\">\u003ccol style=\"width:496px\">\u003ccol style=\"width:148px\">\u003ccol style=\"width:230px\">\u003c/colgroup>\u003ctr>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Параметр\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Тип\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Описание\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Обязательность\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp style=\"text-align:center\">Значение по \u003cbr>умолчанию\u003c/p>\u003c/th>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>publicTerminalId\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Публичный ID терминала\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязателен\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003cbr>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>amount\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>float\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Cумма платежа. Должно быть &gt; 0\u003cbr>Пример: 2; 2.5; 2.57\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязателен\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003cbr>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>currency\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003cbr>enum\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Валюта платежа (\u003ca href=\"https://developers.cloudpayments.ru/#spisok-valyut\" target=\"_blank\" rel=\"noopener noreferrer\">см. справочник\u003c/a>)\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязателен\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003cbr>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>culture\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Язык виджета (По умолчанию \u003ccode>ru-RU\u003c/code>) (\u003ca href=\"https://developers.cloudpayments.ru/#cultures\" target=\"_blank\" rel=\"noopener noreferrer\">см. справочник\u003c/a>)\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязателен\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>&quot;ru-RU&quot;\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>description\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Описание назначения оплаты в произвольном формате\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязателен\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003cbr>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>externalId\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Идентификатор заказа в вашей системе.\u003cbr>Приходит в \u003ca href=\"https://developers.cloudpayments.ru/#uvedomleniya\" target=\"_blank\" rel=\"noopener noreferrer\">уведомлениях\u003c/a>\u003cbr>(ранее \u003ccode>invoiceId\u003c/code>)\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязателен\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003cbr>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>paymentSchema\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003cbr>enum\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Схема обработки транзакций (ранее \u003ccode>charge\u003c/code>/\u003ccode>auth\u003c/code>):\u003cbr>\u003ccode>Single\u003c/code> — одностадийная оплата.\u003cbr>\u003ccode>Dual\u003c/code> — двухстадийная оплата.\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязателен\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003cbr>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>receiptEmail\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Email для отправки квитанции и чека.\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязателен\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003cbr>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>restrictedPaymentMethods\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string[]\u003cbr>enum\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Cписок отключенных для данной оплаты методов\u003cbr>Доступные значения: \u003ccode>Card\u003c/code>, \u003ccode>TcsInstallment\u003c/code>, \u003ccode>Sbp\u003c/code>, \u003ccode>TinkoffPay\u003c/code>, \u003ccode>MirPay\u003c/code>, \u003ccode>Dolyame\u003c/code>, \u003ccode>ForeignCard\u003c/code>, \u003ccode>SberPay\u003c/code>\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязателен\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003cbr>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>tokenize\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>bool\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Сохранение карты для последующего использования.Приходит в \u003ca href=\"https://developers.cloudpayments.ru/#uvedomleniya\" target=\"_blank\" rel=\"noopener noreferrer\">уведомлениях\u003c/a> и позволяет оплачивать по \u003ca href=\"https://developers.cloudpayments.ru/#oplata-po-tokenu-rekarring\" target=\"_blank\" rel=\"noopener noreferrer\">токену\u003c/a>\u003c/p>\u003cp style=\"text-align:left\">Значение параметра будет учитываться только тогда, когда в настройках сайта установлено значение &quot;Спрашивать пользователя&quot; . \u003c/p>\u003cfigure style=\"text-align:center\">\u003cimg src=\"static/img/editor/f97ab1f56fec06c14e0cadfd702901d3f22cff4049c55eeda79880d6f4e2dcfb.png\" alt=\"сохранение карты.png\" style=\"width:100%;max-width:100%;height:auto\">\u003c/figure>\u003cp>Для сохранения карты, необходимо передать &quot;accountId&quot; в &quot;userInfo&quot; \u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязателен\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>По умолчанию false. Для корректной работы параметра, необходимо также  выставить настройки в разделе разделе &quot;Сайты&quot; в личном кабинете мерчанта \u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>recurrent\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>object\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Настройки для рекуррентных платежей (\u003ca href=\"https://developers.cloudpayments.ru/#recurrent-widget\" target=\"_blank\" rel=\"noopener noreferrer\">см. справочник\u003c/a>)\u003c/p>\u003cp>Для создания рекуррентных платежей, необходимо передать &quot;accountId&quot; в &quot;userInfo&quot; \u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязателен\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003cbr>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>escrow\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>object\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Настройки для безопасной сделки (\u003ca href=\"https://developers.cloudpayments.ru/#escrow-widget\" target=\"_blank\" rel=\"noopener noreferrer\">см. справочник\u003c/a>)\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязателен\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003cbr>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>items\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>object[]\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Список товаров (\u003ca href=\"https://developers.cloudpayments.ru/#spisok-tovarov\" target=\"_blank\" rel=\"noopener noreferrer\">см. справочник\u003c/a>)\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязателен\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003cbr>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>receipt\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>object\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Объект чека. Используется при подключении CloudKassir. Для более подробной информации \u003ca href=\"https://developers.cloudpayments.ru/#format-peredachi-dannyh-dlya-onlayn-cheka\" target=\"_blank\" rel=\"noopener noreferrer\">см. cправочник\u003c/a>\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязателен\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003cbr>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>userInfo\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>object\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Информация о плательщике (\u003ca href=\"https://developers.cloudpayments.ru/#dannye-o-platelshchike\" target=\"_blank\" rel=\"noopener noreferrer\">см. справочник\u003c/a>)\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязателен\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003cbr>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>metadata\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>object\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Дополнительные метаданные в формате JSON которые будут связаны с транзакцией. (ранее \u003ccode>data\u003c/code>)\u003cbr>Приходит в \u003ca href=\"https://developers.cloudpayments.ru/#uvedomleniya\" target=\"_blank\" rel=\"noopener noreferrer\">уведомлениях\u003c/a>\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязателен\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003cbr>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>successRedirectUrl\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Адрес страницы для редиректа при успешной оплате\u003c/p>\u003cp>Если параметр не задан, при нажатии на кнопку &quot;вернуться в магазин&quot; после успешной оплаты, закрывается iframe и пользователь остается на странице, на которой был \u003cstrong>поднят\u003c/strong> виджет\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязателен\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003cbr>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>failRedirectUrl\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Адрес страницы для редиректа при неуспешной оплате\u003c/p>\u003cp>Если параметр не задан, при нажатии на кнопку &quot;вернуться в магазин&quot; после неуспешной оплаты, закрывается iframe и пользователь остается на странице, на которой был \u003cstrong>поднят\u003c/strong> виджет. Параметр связан с &quot;retryPayment&quot; на виджете отображается ИЛИ кнопка повторной оплаты или кнопка редиректа. \u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязателен\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003cbr>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>emailBehavior\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Email пользователя:\u003cbr>\u003ccode>Required\u003c/code>: Обязателен.\u003cbr>\u003ccode>Hidden\u003c/code>: Скрыт.\u003cbr>\u003ccode>Optional\u003c/code>: Необязателен.\u003cbr>Отображается изначально в отключенном состоянии, клиент может включить для получения квитанции (Значение по умолчанию)\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязателен\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp> &quot;Optional&quot; \u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>retryPayment\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>bool\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Появление кнопки «Повторить платеж» при неудачном платеже (По умолчанию \u003ccode>true\u003c/code>)\u003cbr>Если передать \u003ccode>false\u003c/code>, то после неудачной попытки оплаты клиенту сразу будет предложено вернуться на сайт, следующую попытку он сможет совершить только в новой оплате\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязателен\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>true\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>autoClose\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>int\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Автоматическое закрытие виджета после успешной оплаты через указанное количество секунд. Значение в промежутке от 3 до 10 включительно\u003c/p>\u003cp>Если параметр не передан, виджет скрывается по действиям пользователя.\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязателен\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003cbr>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>skin\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string[]\u003cbr>enum\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Вид виджета\u003cbr>Доступные значения:\u003cbr>\u003ccode>classic\u003c/code> светлая тема (Значение по умолчанию)\u003c/p>\u003cfigure style=\"text-align:center\">\u003cimg src=\"static/img/editor/ffa34b058886f46ba902abaf29e74f635b7c4e5ff8d5a56b5078ccca76522742.png\" alt=\"светлая_тема.png\" style=\"width:64%;max-width:100%;height:auto\">\u003c/figure>\u003cp>\u003cbr>\u003ccode>modern\u003c/code>: темная тема\u003c/p>\u003cfigure style=\"text-align:center\">\u003cimg src=\"static/img/editor/70a65e98b29e8eded6037968517e6c38c816e2d5bebcf8726caaa4d89a28f470.png\" alt=\"темная_тема.png\" style=\"width:67%;max-width:100%;height:auto\">\u003c/figure>\u003cp>\u003cstrong>Логика работы Темы и Кастомизации отдельных элементов виджета\u003c/strong>\u003c/p>\u003cp style=\"text-align:left\">Кастомизация отдельных элементов работает поверх темы. Если никакая тема не указана, используется по умолчанию \u003cu>светлая \u003c/u>\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003cbr>\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>&quot;classic&quot;\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>components\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>object\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Параметры цветовой кастомизации компонентов ( текстов, инпутов) \u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003cbr>\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003cbr>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>appearance\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>object\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Параметры цветовой кастомизации элементов \u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003cbr>\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003cbr>\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003ch2 id=\"рекуррентные-платежи\">Рекуррентные платежи\u003c/h2>\u003cp>Можно реализовать списания рекуррентных платежей с помощью механизмов CloudPayments: мы сами будем отвечать за периодичность и попытки оплаты. Для этого необходимо дополнительно передавать следующие параметры в рамках объекта \u003ccode>recurrent\u003c/code>:\u003c/p>\u003cdiv class=\"api-table-scroll\" tabindex=\"0\" aria-label=\"Таблица\">\u003ctable>\u003ctr>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Параметр\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Тип\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Описание\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Обязательность\u003c/p>\u003c/th>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>period\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>int\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Частота использования интервала. Должен быть больше 0\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязателен\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>interval\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003cbr>enum\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Интервал. Доступные значения:\u003cbr>\u003ccode>Week\u003c/code> (неделя),\u003cbr>\u003ccode>Month\u003c/code> (месяц),\u003cbr>\u003ccode>Day\u003c/code> (день)\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязателен\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>maxPeriods\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>int\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Максимальное количество платежей в подписке. Если задаете количество, проверьте, чтобы оно было больше 0\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязателен\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>amount\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>decimal\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Сумма регулярного платежа. Для целей когда инитный и регулярный платёж отличаются. Сумма должна содержать не более двух знаков после запятой. Если указываете другую сумму, проверьте, чтобы она была больше 0\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязателен\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>startDate\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>dateTime\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Дата и время первого регулярного платежа. Для целей когда дата первого платежа должна быть не через указанный интервал. Если указываете другую дату, то она должна стоять в будущем времени\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязателен\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>receipt\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Данные для формирования онлайн-чека в регулярных платежах\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязателен\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003ch2 id=\"параметры-кастомизации\">Параметры кастомизации\u003c/h2>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>json\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-7\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-stat
