yments&quot;,\n        &quot;CardTypeCode&quot;: 0,\n        &quot;Status&quot;: &quot;Authorized&quot;,\n        &quot;StatusCode&quot;: 2,\n        &quot;CultureName&quot;: &quot;ru&quot;,\n        &quot;Reason&quot;: &quot;Approved&quot;,\n        &quot;CardHolderMessage&quot;: &quot;Оплата успешно проведена&quot;,\n        &quot;Type&quot;: 0,\n        &quot;Refunded&quot;: false,\n        &quot;Name&quot;: &quot;CARDHOLDER NAME&quot;,\n        &quot;Token&quot;: &quot;0a0afb77-8f41-4de2-9524-1057f9695303&quot;,\n        &quot;SubscriptionId&quot;: null,\n        &quot;GatewayName&quot;: &quot;Test&quot;,\n        &quot;AndroidPay&quot;: false,\n        &quot;WalletType&quot;: &quot;&quot;,\n        &quot;TotalFee&quot;: 0,\n        &quot;VatAboveTotalFee&quot;: 0, //Расчетная сумма по НДС, начисленного на комиссию Системы. Значение заполняется для одностадийных платежей. Параметр передается с 29.04.2026\n        &quot;ProcessorAndPartnerFee&quot;: null, //Сумма вознаграждения Агента ТСП. Параметр передается с 29.04.2026\n        &quot;VatWithinProcessorFee&quot;: null //Расчетная сумма НДС с вознаграждения платёжного агента. Параметр передается с 29.04.2026\n    },\n    &quot;Success&quot;: true,\n    &quot;Message&quot;: null\n}\n\u003c/code>\u003c/pre>\u003c/div>\u003ch3 id=\"обработка-3-d-secure\">Обработка 3-D Secure\u003c/h3>\u003cp>Для проведения \u003ca href=\"https://developers.cloudpayments.ru/#3-d-secure\" target=\"_blank\" rel=\"noopener noreferrer\">3-D Secure аутентификации\u003c/a> нужно отправить плательщика на адрес, указанный в параметре \u003cstrong>AcsUrl\u003c/strong> \u003ca href=\"#/tech/api@sample-3ds-required\">ответа сервера\u003c/a> с передачей следующих параметров:\u003c/p>\u003cul>\u003cli>\u003cp>\u003cstrong>MD\u003c/strong> — параметр TransactionId из ответа сервера;\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>PaReq\u003c/strong> — одноименный параметр из ответа сервера;\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>TermUrl\u003c/strong> — адрес на вашем сайте для возврата плательщика после аутентификации.\u003c/p>\u003c/li>\u003c/ul>\u003caside class=\"api-callout \" role=\"note\">\u003cstrong class=\"callout-label\">Информация\u003c/strong>\u003cp>Регистр букв в названии параметров имеет значение.\u003c/p>\u003c/aside>\u003ch4 id=\"primer-formy\">Пример формы:\u003c/h4>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>markup\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-8\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-8\" class=\"language-markup\">&lt;form name=&quot;downloadForm&quot; action=&quot;AcsUrl&quot; method=&quot;POST&quot;&gt;\n    &lt;input type=&quot;hidden&quot; name=&quot;PaReq&quot; value=&quot;eJxVUdtugkAQ/RXDe9mLgo0Z1nhpU9PQasWmPhLYAKksuEChfn13uVR9mGTO7MzZM2dg3qSn0Q+X\\nRZIJxyAmNkZcBFmYiMgxDt7zw6MxZ+DFkvP1ngeV5AxcXhR+xEdJ6BhpEZnEYLBdfPAzg56JKSKT\\nAhqgGpFB7IuSgR+cl5s3NqFTG2NAPYSUy82aETqeWPYUUAdB+ClnwSmrwtz/TbkoC0BtDYKsEqX8\\nZfZkDGgAUMkTi8synyFU17V5N2nKCpBuAHRVs610VijCJgmZu17UXTxhFWP34l7evYPlegsHkO6A\\n0C85o5hMsI3piNIZHc+IBaitg59qJYzgdrUOQK7/WNy+3FZAeSqV5cMqAwLe5JlQwpny8T8HdFW8\\netFuBqUyahV+Hjf27vWCaSx22fe+KY6kXKZfJLK1x22TZkyUS8QiHaUGgDQN6s+H+tOq7O7kf8hd\\nt30=&quot;&gt;\n    &lt;input type=&quot;hidden&quot; name=&quot;MD&quot; value=&quot;504&quot;&gt;\n    &lt;input type=&quot;hidden&quot; name=&quot;TermUrl&quot; value=&quot;https://example.com/post3ds?order=1234567&quot;&gt;&lt;/form&gt;&lt;script&gt;\n    window.onload = submitForm;\n    function submitForm() { downloadForm.submit(); }&lt;/script&gt;\u003c/code>\u003c/pre>\u003c/div>\u003caside class=\"api-callout \" role=\"note\">\u003cstrong class=\"callout-label\">Информация\u003c/strong>\u003cp>После аутентификации плательщик будет возвращен на TermUrl с параметрами MD и PaRes, переданными методом POST.\u003c/p>\u003c/aside>\u003cp>\u003cbr>\u003c/p>\u003cp>Для завершения оплаты выполните следующий метод Post3ds.\u003c/p>\u003cp>\u003cstrong>Адрес метода:\u003c/strong>\u003cbr>https://api.cloudpayments.ru/payments/cards/post3ds\u003c/p>\u003cp>\u003cstrong>Параметры запроса:\u003c/strong>\u003c/p>\u003cdiv class=\"api-table-scroll\" tabindex=\"0\" aria-label=\"Таблица\">\u003ctable>\u003ctr>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Параметр\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Формат\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Применение\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Описание\u003c/p>\u003c/th>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>TransactionId\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Long\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Значение параметра MD\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>PaRes\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Значение одноименного параметра\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cp>В ответ на корректно сформированный запрос сервер вернет либо информацию об \u003ca href=\"#/tech/api@sample-approved\">успешной транзакции\u003c/a>, либо — \u003ca href=\"#/tech/api@sample-declined\">об отклоненной\u003c/a>.\u003c/p>\u003ch3 id=\"рекарринг\">Рекарринг\u003c/h3>\u003caside class=\"api-callout \" role=\"note\">\u003cstrong class=\"callout-label\">Информация\u003c/strong>\u003cp>По требованию НСПК, для ТСП, предоставляющих телекоммуникационные услуги (MCC 4814 Telecommunication Services), обязательна передача номера телефона плательщика. При отсутствии номера телефона в запросе, банки-эквайеры будут отклонять проводимые операции. \u003cbr>\u003cbr>Номер телефона необходимо передавать в объекте Payer в параметре Phone. \u003cbr>Формат передачи: только цифры, без разделителей “( )“, “-“ . \u003cbr>Пример передачи: “+71234567890“\u003c/p>\u003c/aside>\u003cp>Метод для оплаты по токену, полученному при \u003ca href=\"#/tech/api@оплата-по-криптограмме\">оплате по криптограмме\u003c/a>, либо через \u003ca href=\"https://developers.cloudpayments.ru/#pay\" target=\"_blank\" rel=\"noopener noreferrer\">Pay\u003c/a>-уведомление.\u003c/p>\u003caside class=\"api-callout \" role=\"note\">\u003cstrong class=\"callout-label\">Информация\u003c/strong>\u003cp>Оплата по токену проходит только на том терминале (\u003ccode>publicId\u003c/code>), на котором был получен токен. Если необходимо использовать токены на других терминалах, обратитесь в свободной форме на почту \u003ca href=\"mailto:assistant@cp.ru\">assistant@cp.ru\u003c/a>\u003c/p>\u003c/aside>\u003caside class=\"api-callout \" role=\"note\">\u003cstrong class=\"callout-label\">Информация\u003c/strong>\u003cp>Финальный статус оплаты по токену СБП (“Завершена”/“Отклонена”) можно получить через \u003ca href=\"https://developers.cloudpayments.ru/#pay\" target=\"_blank\" rel=\"noopener noreferrer\">Pay\u003c/a> и \u003ca href=\"https://developers.cloudpayments.ru/#fail\" target=\"_blank\" rel=\"noopener noreferrer\">Fail\u003c/a>-уведомления уже после создания транзакции, а не в ответе на сам запрос оплаты по токену.\u003c/p>\u003c/aside>\u003cp>\u003cstrong>Адреса метода\u003c/strong>:\u003cbr>https://api.cloudpayments.ru/payments/tokens/charge — для \u003ca href=\"https://developers.cloudpayments.ru/#shemy-provedeniya-platezha\" target=\"_blank\" rel=\"noopener noreferrer\">одностадийного платежа\u003c/a>\u003cbr>https://api.cloudpayments.ru/payments/tokens/auth — для \u003ca href=\"https://developers.cloudpayments.ru/#shemy-provedeniya-platezha\" target=\"_blank\" rel=\"noopener noreferrer\">двухстадийного\u003c/a>\u003c/p>\u003cp>\u003cstrong>Параметры запроса:\u003c/strong>\u003c/p>\u003cdiv class=\"api-table-scroll\" tabindex=\"0\" aria-label=\"Таблица\">\u003ctable>\u003ctr>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Параметр\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Формат\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Применение\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Описание\u003c/p>\u003c/th>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Amount\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Number\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Cумма платежа в валюте, разделитель точка. Количество не нулевых знаков после точки – 2\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Currency\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Валюта: RUB/USD/EUR/GBP (см. \u003ca href=\"https://developers.cloudpayments.ru/#spisok-valyut\" target=\"_blank\" rel=\"noopener noreferrer\">справочник\u003c/a>). Если параметр не передан, то по умолчанию принимает значение RUB\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>AccountId\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Идентификатор пользователя\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>TrInitiatorCode\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Int\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Признак инициатора списания денежных средств.\u003cbr>Возможные значения:\u003cbr>0 - транзакция инициирована ТСП на основе ранее сохраненных учетных данных;\u003cbr>1 - транзакция инициирована держателем карты (клиентом) на основе ранее сохраненных учетных данных.\u003cbr>\u003cstrong>ВАЖНО!\u003c/strong> В случае, если транзакция инициирована ТСП, необходимо дополнительно в запросе указать параметр PaymentScheduled с корректным значением.\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>PaymentScheduled\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Int\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Признак оплаты по расписанию на основе ранее сохраненных учетных данных.\u003cbr>Возможные значения:\u003cbr>0 - без расписания;\u003cbr>1 - по расписанию.\u003cbr>\u003cstrong>ВАЖНО!\u003c/strong> В случае, если при запросе данный параметр не указан, по умолчанию будет использоваться значение 0.\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Token\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Токен\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>InvoiceId\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Номер счета или заказа\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Description\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Назначение платежа в свободной форме\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>IpAddress\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>IP-адрес плательщика\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Email\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>E-mail плательщика, на который будет отправлена квитанция об оплате\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Payer\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Object\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Доп. поле, куда передается информация о плательщике. Используйте следующие параметры: \u003ccode>FirstName\u003c/code>, \u003ccode>LastName\u003c/code>, \u003ccode>MiddleName\u003c/code>, \u003ccode>Birth\u003c/code>, \u003ccode>Street\u003c/code>, \u003ccode>Address\u003c/code>, \u003ccode>City\u003c/code>, \u003ccode>Country\u003c/code>, \u003ccode>Phone\u003c/code>, \u003ccode>Postcode\u003c/code>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>JsonData\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Json\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Любые другие данные, которые будут связаны с транзакцией, в том числе инструкции для \u003ca href=\"https://developers.cloudpayments.ru/#rekurrentnye-platezhi-podpiska\" target=\"_blank\" rel=\"noopener noreferrer\">создания подписки\u003c/a> или формирования \u003ca href=\"https://developers.cloudpayments.ru/#format-peredachi-dannyh-dlya-onlayn-cheka\" target=\"_blank\" rel=\"noopener noreferrer\">онлайн-чека\u003c/a> должны обёртываться в объект \u003ccode>cloudpayments\u003c/code>. Мы зарезервировали названия следующих параметров и отображаем их содержимое в реестре операций, выгружаемом в Личном Кабинете: \u003ccode>name\u003c/code>, \u003ccode>firstName\u003c/code>, \u003ccode>middleName\u003c/code>, \u003ccode>lastName\u003c/code>, \u003ccode>nick\u003c/code>, \u003ccode>phone\u003c/code>, \u003ccode>address\u003c/code>, \u003ccode>comment\u003c/code>, \u003ccode>birthDate\u003c/code>.\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cp>В ответ сервер возвращает JSON с тремя составляющими: поле \u003cstrong>success\u003c/strong> — результат запроса, поле \u003cstrong>message\u003c/strong> — описание ошибки, объект \u003cstrong>model\u003c/strong> — расширенная информация.\u003c/p>\u003ch4 id=\"vozmozhnye-varianty\">Возможные варианты\u003c/h4>\u003cul>\u003cli>\u003cp>Некорректно сформирован запрос:\u003cbr>\u003cstrong>success\u003c/strong> — false\u003cbr>\u003cstrong>message\u003c/strong> — описание ошибки\u003c/p>\u003c/li>\u003cli>\u003cp>Транзакции отклонена:\u003cbr>\u003cstrong>success\u003c/strong> — false\u003cbr>\u003cstrong>model\u003c/strong> — информация о транзакции и код ошибки\u003c/p>\u003c/li>\u003cli>\u003cp>Транзакции принята:\u003cbr>\u003cstrong>success\u003c/strong> — true\u003cbr>\u003cstrong>model\u003c/strong> — информация о транзакции\u003cbr>\u003c/p>\u003c/li>\u003c/ul>\u003caside class=\"api-callout \" role=\"note\">\u003cstrong class=\"callout-label\">Информация\u003c/strong>\u003cp>Результат запроса (поле Success) не отражает статус транзакции, а лишь свидетельствует об успешности/неуспешности запроса API. Статус транзакции отражен в дополнительном поле Status, также его можно узнать в результате получения \u003ca href=\"https://developers.cloudpayments.ru/#uvedomleniya\" target=\"_blank\" rel=\"noopener noreferrer\">уведомлений\u003c/a>. Интерпретацию статусов транзакции смотрите в \u003ca href=\"https://developers.cloudpayments.ru/#statusy-operatsiy\" target=\"_blank\" rel=\"noopener noreferrer\">справочнике\u003c/a>.\u003c/p>\u003c/aside>\u003cp>\u003cstrong>Пример запроса на оплату по токену\u003c/strong>:\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>json\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-9\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-9\" class=\"language-json\">{\n    &quot;Amount&quot;:59,\n    &quot;Currency&quot;:&quot;RUB&quot;,\n    &quot;InvoiceId&quot;:&quot;1234567&quot;,\n    &quot;Description&quot;:&quot;Оплата товаров в example.com&quot;,\n    &quot;AccountId&quot;:&quot;user_x&quot;,\n    &quot;TrInitiatorCode&quot;: 0,\n    &quot;PaymentScheduled&quot;: 1,\n    &quot;Token&quot;:&quot;success_1111a3e0-2428-48fb-a530-12815d90d0e8&quot;,\n    &quot;Payer&quot;:\n      { \n        &quot;FirstName&quot;:&quot;Тест&quot;,\n        &quot;LastName&quot;:&quot;Тестов&quot;,\n        &quot;MiddleName&quot;:&quot;Тестович&quot;,\n        &quot;Birth&quot;:&quot;1955-02-24&quot;,\n        &quot;Address&quot;:&quot;тестовый проезд дом тест&quot;,\n        &quot;Street&quot;:&quot;Lenina&quot;,\n        &quot;City&quot;:&quot;MO&quot;,\n        &quot;Country&quot;:&quot;RU&quot;,\n        &quot;Phone&quot;:&quot;+71234567890&quot;,\n        &quot;Postcode&quot;:&quot;345&quot;\n    }}\u003c/code>\u003c/pre>\u003c/div>\u003cp>\u003cstrong>Пример ответа:\u003c/strong> \u003cem>некорректный запрос\u003c/em>\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>json\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-10\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-10\" class=\"language-json\">{&quot;Success&quot;:false,&quot;Message&quot;:&quot;Amount is required&quot;}\u003c/code>\u003c/pre>\u003c/div>\u003cp>\u003cstrong>Пример ответа:\u003c/strong> \u003cem>транзакция отклонена\u003c/em>. В поле ReasonCode код ошибки (см. \u003ca href=\"https://developers.cloudpayments.ru/#kody-oshibok\" target=\"_blank\" rel=\"noopener noreferrer\">справочник\u003c/a>)\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>text\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-11\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-11\" class=\"language-text\">{\n    &quot;Model&quot;: {\n        &quot;ReasonCode&quot;: 5051,\n        &quot;PublicId&quot;: &quot;pk_**********************************&quot;,\n        &quot;TerminalUrl&quot;: &quot;http://test.test&quot;,\n        &quot;TransactionId&quot;: 891583633,\n        &quot;Amount&quot;: 100,\n        &quot;Currency&quot;: &quot;RUB&quot;,\n        &quot;CurrencyCode&quot;: 0,\n        &quot;PaymentAmount&quot;: 100,\n        &quot;PaymentCurrency&quot;: &quot;RUB&quot;,\n        &quot;PaymentCurrencyCode&quot;: 0,\n        &quot;InvoiceId&quot;: &quot;1234567&quot;,\n        &quot;AccountId&quot;: &quot;user_x&quot;,\n        &quot;TrInitiatorCode&quot;: 0,\n        &quot;Email&quot;: null,\n        &quot;Desc 03c/p>\u003c/aside>\u003ch4 id=\"выплата-по-криптограмме\">Выплата по криптограмме\u003c/h4>\u003cp>Выплату по криптограмме можно осуществить через вызов метода API.\u003c/p>\u003cp>\u003cstrong>Адрес метода:\u003c/strong>\u003cbr>https://api.cloudpayments.ru/payments/cards/topup\u003c/p>\u003cp>\u003cstrong>Параметры запроса:\u003c/strong>\u003c/p>\u003cdiv class=\"api-table-scroll\" tabindex=\"0\" aria-label=\"Таблица\">\u003ctable>\u003ctr>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Параметр\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Формат\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Применение\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Описание\u003c/p>\u003c/th>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>CardCryptogramPacket\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Криптограмма платежных данных\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Amount\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Number\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Cумма платежа в валюте, разделитель точка. Количество не нулевых знаков после точки – 2\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Currency\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Валюта: RUB\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Name\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Имя держателя карты латиницей\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>AccountId\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Идентификатор пользователя\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Email\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>E-mail плательщика, на который будет отправлена квитанция об оплате\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>JsonData\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Json\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Любые другие данные, которые будут связаны с транзакцией. Мы зарезервировали названия следующих параметров и отображаем их содержимое в реестре операций, выгружаемом в Личном Кабинете: \u003ccode>name\u003c/code>, \u003ccode>firstName\u003c/code>, \u003ccode>middleName\u003c/code>, \u003ccode>lastName\u003c/code>, \u003ccode>nick\u003c/code>, \u003ccode>phone\u003c/code>, \u003ccode>address\u003c/code>, \u003ccode>comment\u003c/code>, \u003ccode>birthDate\u003c/code>.\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>InvoiceId\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Номер заказа в вашей системе\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Description\u003c/p>\u003c/td>\ e\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-20\" class=\"language-json\">{\n    &quot;Model&quot;: {\n        &quot;ReasonCode&quot;: 0,\n        &quot;PublicId&quot;: &quot;pk_*******************************&quot;,\n        &quot;TerminalUrl&quot;: &quot;http://test.test&quot;,\n        &quot;TransactionId&quot;: 897739551,\n        &quot;Amount&quot;: 399,\n        &quot;Currency&quot;: &quot;RUB&quot;,\n        &quot;CurrencyCode&quot;: 0,\n        &quot;PaymentAmount&quot;: 399,\n        &quot;PaymentCurrency&quot;: &quot;RUB&quot;,\n        &quot;PaymentCurrencyCode&quot;: 0,\n        &quot;InvoiceId&quot;: null,\n        &quot;AccountId&quot;: &quot;user@example.com&quot;,\n        &quot;Email&quot;: null,\n        &quot;Description&quot;: null,\n        &quot;JsonData&quot;: null,\n        &quot;CreatedDate&quot;: &quot;/Date(1635564719715)/&quot;,\n        &quot;PayoutDate&quot;: null,\n        &quot;PayoutDateIso&quot;: null,\n        &quot;PayoutAmount&quot;: null,\n        &quot;CreatedDateIso&quot;: &quot;2021-10-30T03:31:59&quot;,\n        &quot;AuthDate&quot;: &quot;/Date(1635564719858)/&quot;,\n        &quot;AuthDateIso&quot;: &quot;2021-10-30T03:31:59&quot;,\n        &quot;ConfirmDate&quot;: &quot;/Date(1635564719858)/&quot;,\n        &quot;ConfirmDateIso&quot;: &quot;2021-10-30T03:31:59&quot;,\n        &quot;AuthCode&quot;: &quot;A1B2C3&quot;,\n        &quot;TestMode&quot;: true,\n        &quot;Rrn&quot;: null,\n        &quot;OriginalTransactionId&quot;: null,\n        &quot;FallBackScenarioDeclinedTransactionId&quot;: null,\n        &quot;IpAddress&quot;: &quot;172.18.200.124&quot;,\n        &quot;IpCountry&quot;: &quot;&quot;,\n        &quot;IpCity&quot;: null,\n        &quot;IpRegion&quot;: null,\n        &quot;IpDistrict&quot;: null,\n        &quot;IpLatitude&quot;: null,\n        &quot;IpLongitude&quot;: null,\n        &quot;CardFirstSix&quot;: &quot;424242&quot;,\n        &quot;CardLastFour&quot;: &quot;4242&quot;,\n        &quot;CardExpDate&quot;: &quot;12/25&quot;,\n        &quot;CardType&quot;: &quot;Visa&quot;,\n        &quot;CardProduct&quot;: &quot;I&quot;,\n        &quot;CardCategory&quot;: &quot;Visa Infinite (Infinite)&quot;,\n        &quot;EscrowAccumulationId&quot;: null,\n        &quot;IssuerBankCountry&quot;: &quot;RU&quot;,\n        &quot;Issuer&quot;: &quot;CloudPayments&quot;,\n        &quot;CardTypeCode&quot;: 0,\n        &quot;Status&quot;: &quot;Completed&quot;,\n        &quot;StatusCode&quot;: 3,\n        &quot;CultureName&quot;: &quot;ru&quot;,\n        &quot;Reason&quot;: &quot;Approved&quot;,\n        &quot;CardHolderMessage&quot;: &quot;Оплата успешно проведена&quot;,\n        &quot;Type&quot;: 2,\n        &quot;TransactionIsInProcess&quot;: false,\n        &quot;Refunded&quot;: false,\n        &quot;Name&quot;: &quot;CARDHOLDER NAME&quot;,\n        &quot;Token&quot;: null,\n        &quot;SubscriptionId&quot;: null,\n        &quot;GatewayName&quot;: &quot;Test&quot;,\n        &quot;AndroidPay&quot;: false,\n        &quot;WalletType&quot;: &quot;&quot;,\n        &quot;TotalFee&quot;: 0\n    },\n    &quot;Success&quot;: true,\n    &quot;Message&quot;: null}\u003c/code>\u003c/pre>\u003c/div>\u003caside class=\"api-callout \" role=\"note\">\u003cstrong class=\"callout-label\">Информация\u003c/strong>\u003cp>Можно воспользоваться механизмом надежной аутентификации запроса на выплату. Для этого передайте в нашу поддержку сертификат с публичной частью ключа. Далее сгенерируйте подпись на основе тела запроса и разместите ее в заголовке X-Signature в base64 формате. CloudPayments проверит вашу подпись, используя CryptoService. Если подпись валидна, то обработка запроса продолжится, если нет — обработка прекратится.\u003c/p>\u003c/aside>\u003cp>\u003cstrong>В ответе метода выплаты по криптограмме POST /payments/cards/topup возвращаются следующие статусы:\u003c/strong>\u003c/p>\u003cdiv class=\"api-table-scroll\" tabindex=\"0\" aria-label=\"Таблица\">\u003ctable>\u003ctr>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Статус\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Описание\u003c/p>\u003c/th>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Completed\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Выплата выполнена успешно\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Created\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Выплата в промежуточном статусе\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Failed\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Выплата не выполнена\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cp>В случае перехода транзакции в промежуточный статус \u003cstrong>срабатывает сценарий асинхронной обработки выплаты\u003c/strong>, в результате выполнения которого параметр Model.Status принимает значение “Created”, а флаг Model.TransactionIsInProcess становится равен true.\u003c/p>\u003cp>При завершении обработки выплаты статус транзакции будет изменен на терминальный и отправлено \u003cstrong>webhook-уведомление\u003c/strong> с финальным статусом:\u003c/p>\u003cdiv class=\"api-table-scroll\" tabindex=\"0\" aria-label=\"Таблица\">\u003ctable>\u003ctr>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Статус\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Тип уведомления\u003c/p>\u003c/th>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Completed\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>PAY, \u003ca href=\"https://developers.cloudpayments.ru/#pay\" target=\"_blank\" rel=\"noopener noreferrer\">Документация CloudPayments\u003c/a>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Failed\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>FAIL, \u003ca href=\"https://developers.cloudpayments.ru/#fail\" target=\"_blank\" rel=\"noopener noreferrer\">Документация CloudPayments\u003c/a>\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003caside class=\"api-callout \" role=\"note\">\u003cstrong class=\"callout-label\">Информация\u003c/strong>\u003cp>В редких случаях процесс обработки запроса на выплату может занимать до 60 минут\u003c/p>\u003c/aside>\u003ch4 id=\"выплата-по-токену\">Выплата по токену\u003c/h4>\u003cp>Выплату по токену можно осуществить через вызов метода API.\u003c/p>\u003cp>Выплаты по токену можно сделать только по токену, который получили при оплате по карте.\u003c/p>\u003cp>Токены TPay, Sbp и другие токены, полученные на иных способах оплаты, не подходят для выплат по токену.\u003c/p>\u003cp>\u003cstrong>Адрес метода:\u003c/strong>\u003cbr>https://api.cloudpayments.ru/payments/token/topup\u003c/p>\u003cp>\u003cstrong>Параметры запроса:\u003c/strong>\u003c/p>\u003cdiv class=\"api-table-scroll\" tabindex=\"0\" aria-label=\"Таблица\">\u003ctable>\u003ctr>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Параметр\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Формат\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Применение\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Описание\u003c/p>\u003c/th>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Token\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Токен карты, выданный системой после первого платежа\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Amount\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Number\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Cумма платежа в валюте, разделитель точка. Количество не нулевых знаков после точки – 2\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>AccountId\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Идентификатор пользователя\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Currency\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Валюта: RUB\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>InvoiceId\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Номер заказа в вашей системе\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Payer\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Object\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Доп. поле, куда передается информация о плательщике\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Receiver\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Object\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Доп. поле, куда передается информация о получателе\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003caside class=\"api-callout \" role=\"note\">\u003cstrong class=\"callout-label\">Информация\u003c/strong>\u003cp>Для выплат на иностранные карты понадобится параметр Payer или Receiver в зависимости от терминала.\u003c/p>\u003c/aside>\u003cp>\u003cstrong>Пример запроса:\u003c/strong>\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>text\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-21\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-21\" class=\"language-text\">{\n    &quot;Token&quot;:&quot;0a0afb77-8f41-4de2-9524-1057f9695303&quot;,\n    &quot;Amount&quot;:59,\n    &quot;AccountId&quot;:&quot;user_x&quot;,\n    &quot;Currency&quot;:&quot;RUB&quot;,\n    &quot;Payer&quot;:\n    //Набор полей аналогичен и для параметра Receiver\n      { \n        &quot;FirstName&quot;:&quot;Тест&quot;,\n        &quot;LastName&quot;:&quot;Тестов&quot;,\n        &quot;MiddleName&quot;:&quot;Тестович&quot;,\n        &quot;Address&quot;:&quot;тестовый проезд дом тест&quot;,\n        &quot;Birth&quot;:&quot;1955-02-24&quot;,\n        &quot;City&quot;:&quot;MO&quot uot;,\n        &quot;SubscriptionId&quot;: null,\n        &quot;GatewayName&quot;: &quot;Test&quot;,\n        &quot;AndroidPay&quot;: false,\n        &quot;WalletType&quot;: &quot;&quot;,\n        &quot;TotalFee&quot;: 0\n    },\n    &quot;Success&quot;: true,\n    &quot;Message&quot;: null}\u003c/code>\u003c/pre>\u003c/div>\u003caside class=\"api-callout \" role=\"note\">\u003cstrong class=\"callout-label\">Информация\u003c/strong>\u003cp>Можно воспользоваться механизмом надежной аутентификации запроса на выплату. Для этого передайте в нашу поддержку сертификат с публичной частью ключа. Далее сгенерируйте подпись на основе тела запроса и разместите ее в заголовке X-Signature в base64 формате. CloudPayments проверит вашу подпись, используя CryptoService. Если подпись валидна, то обработка запроса продолжится, если нет — обработка прекратится.\u003c/p>\u003c/aside>\u003ch4 id=\"выплата-по-сбп\">Выплата по СБП\u003c/h4>\u003cp>Выплату по СБП можно осуществить через вызов метода API.\u003c/p>\u003cp>\u003cstrong>Адрес метода:\u003c/strong>\u003cbr>https://api.cloudpayments.ru/payments/alt/topup\u003c/p>\u003cp>\u003cstrong>Параметры запроса:\u003c/strong>\u003c/p>\u003cdiv class=\"api-table-scroll\" tabindex=\"0\" aria-label=\"Таблица\">\u003ctable>\u003ctr>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Параметр\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Формат\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Применение\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Описание\u003c/p>\u003c/th>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>MemberId\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Идентификатор банка получателя НПСК для СБП\u003cbr>Если в запросе поле \u003ccode>Receiver.Phone\u003c/code> заполнено, то \u003ccode>MemberId\u003c/code> обязательное\u003cbr>Допустимые значения для \u003ccode>MemberId\u003c/code> можно найти по \u003ca href=\"https://qr.nspk.ru/proxyapp/c2bmembers.json\" target=\"_blank\" rel=\"noopener noreferrer\">ссылке\u003c/a>. Значение из поля \u003ccode>schema\u003c/code> в поле \u003ccode>MemberId\u003c/code> надо передать только цифровое значение из поля \u003ccode>schema\u003c/code>\u003cbr>Например, для \u003ccode>schema:bank100000000111\u003c/code> передать \u003ccode>MemberId:100000000111\u003c/code>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Amount\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Number\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Cумма платежа в валюте, разделитель точка. Количество не нулевых знаков после точки – 2\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Currency\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Валюта: RUB\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>AccountId\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Идентификатор пользователя\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Email\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>E-mail плательщика, на который будет отправлена квитанция об оплате\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>CultureName\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Язык уведомлений. Возможные значения: &quot;ru-RU&quot;, &quot;en-US&quot;. (\u003ca href=\"#/tech/api@локализация\">см. справочник\u003c/a>)\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>InvoiceId\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Номер заказа в вашей системе\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Description\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Описание оплаты в свободной форме\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Payer\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Object\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Доп. поле, куда передается информация о плательщике. Используйте следующие параметры: \u003ccode>FirstName\u003c/code>, \u003ccode>LastName\u003c/code>, \u003ccode>MiddleName\u003c/code>, \u003ccode>Birth\u003c/code>, \u003ccode>Street\u003c/code>, \u003ccode>Address\u003c/code>, \u003ccode>City\u003c/code>, \u003ccode>Country\u003c/code>, \u003ccode>Phone\u003c/code>, \u003ccode>Postcode\u003c/code>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Receiver\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Object\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Доп. поле, куда передается информация о получателе\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Receiver.Phone\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Для выплаты по СБП необходимо указать номер получателя средств\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Пример запроса:\u003c/strong>\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>json\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-23\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-23\" class=\"language-json\">{\n    &quot;Amount&quot;:1,\n    &quot;AccountId&quot;:&quot;user@example.com&quot;,\n    &quot;MemberId&quot;:&quot;12456&quot;,\n    &quot;Currency&quot;:&quot;RUB&quot;,\n    &quot;InvoiceId&quot;:&quot;1234567&quot;,\n    &quot;Receiver&quot;:\n      { \n        &quot;Phone&quot;:&quot;+71234567890&quot;\n    }}\u003c/code>\u003c/pre>\u003c/div>\u003cp>\u003cstrong>Пример ответа:\u003c/strong>\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code  &quot;MasterPass&quot;: false,\n        &quot;InfoShopData&quot;: null,\n        &quot;Receiver&quot;:{ \n          &quot;FirstName&quot;:&quot;Тест&quot;,\n          &quot;LastName&quot;:&quot;Тестов&quot;,\n          &quot;MiddleName&quot;:&quot;Тестович&quot;,\n          &quot;Address&quot;:&quot;тестовый проезд дом тест&quot;,\n          &quot;Birth&quot;:&quot;1955-02-24&quot;,\n          &quot;City&quot;:&quot;MO&quot;,\n          &quot;Street&quot;:&quot;Ленина&quot;,\n          &quot;Country&quot;:&quot;RU&quot;,\n          &quot;Phone&quot;:&quot;+71234567890&quot;,\n          &quot;Postcode&quot;:&quot;345&quot;\n         }\n    },\n    &quot;Success&quot;: true,\n    &quot;Message&quot;: null,\n    &quot;ErrorCode&quot;: null}\u003c/code>\u003c/pre>\u003c/div>\u003ch4 id=\"выгрузка-списка-претензий-за-произвольный-период\">Выгрузка списка претензий за произвольный период\u003c/h4>\u003cp>Метод выгрузки списка претензий за произвольный период, но не более чем за 1 год. Для выгрузки требуется отправить http-запрос с типом авторизации “Basic Auth”. Логин - public key (pk) терминала.\u003c/p>\u003cp>В выгрузку претензий попадают все претензий, зарегистрированные за указанный период. Результат сортируется по Date, от старых к новым с лимитом - 100 на одну страницу.\u003c/p>\u003cp>\u003cstrong>Адрес метода:\u003c/strong>\u003cbr>https://api.cloudpayments.ru/chargebacks/list\u003c/p>\u003cp>\u003cstrong>Параметры запроса:\u003c/strong>\u003c/p>\u003cdiv class=\"api-table-scroll\" tabindex=\"0\" aria-label=\"Таблица\">\u003ctable>\u003ctr>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Параметр\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Формат\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Применение\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Описание\u003c/p>\u003c/th>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>CreatedDateGte\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp> "1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Номер заказа\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cp>Если платеж по указанному номеру заказа был найден, система отобразит либо информацию об \u003ca href=\"#/tech/api@sample-approved\">успешной транзакции\u003c/a>, либо — \u003ca href=\"#/tech/api@sample-declined\">об отклоненной\u003c/a>. Если будет найдено несколько платежей с указанным номером заказа, то система вернет информацию только о последней операции. Отличие нового метода в том, что он ищет по всем платежам, включая возвраты и выплаты на карту.\u003c/p>\u003cp>\u003cstrong>Пример запроса:\u003c/strong>\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>json\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-29\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-29\" class=\"language-json\">{&quot;InvoiceId&quot;:&quot;123456789&quot;}\u003c/code>\u003c/pre>\u003c/div>\u003cp>\u003cstrong>Пример ответа:\u003c/strong>\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>json\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-30\" data-copy-state=\"ready\" aria-label ng\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Дата создания операций\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>TimeZone\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Код временной зоны, по умолчанию — UTC\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cp>В выгрузку транзакций попадают все операции, зарегистрированные за указанный день. Для удобства учета вы можете указать код временной зоны (\u003ca href=\"https://developers.cloudpayments.ru/#kody-vremennyh-zon\" target=\"_blank\" rel=\"noopener noreferrer\">см. справочник\u003c/a>).\u003c/p>\u003cp>\u003cstrong>Пример запроса:\u003c/strong>\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>json\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-31\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-31\" class=\"language-json\">{&quot;Date&quot;:&quot;2014-08-09&quot;, &quot;TimeZone&quot;: &quot;MSK&quot;}\u003c/code>\u003c/pre>\u оздания операций\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>PageNumber\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Number\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>порядковый номер страницы, должно быть больше или равно 1\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>TimeZone\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Код временной зоны, по умолчанию — UTC\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Statuses\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String Array\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Статус операция. Может иметь значения [ &quot;Authorized&quot;, &quot;Completed&quot;, &quot;Cancelled&quot;, &quot;Declined&quot; ]. По умолчанию выбраны все\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cp>В выгрузку транзакций попадают все операции, зарегистрированные за указанный день. Результат сортируется по CreatedDate, от старых к новым с лимитом - 100 на одну страницу. Для удобства учета вы можете указать код временной зоны (\u003ca href=\"https://developers.cloudpayments.ru/#kody-vremennyh-zon\" target=\"_blank\" rel=\"noopener noreferrer\">см. справочник\u003c/a>).\u003c/p>\u003cp>\u003cstrong>Пример запроса:\u003c/strong>\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>json\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-33\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\ oolbar\">\u003cspan>json\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-36\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-36\" class=\"language-json\">{\n    &quot;Model&quot;: [\n        {\n            &quot;Token&quot;: &quot;tk_020a924486aa4df254331afa33f2a&quot;,\n            &quot;AccountId&quot;: &quot;user_x&quot;,\n            &quot;CardMask&quot;: &quot;4242 42****** 4242&quot;,\n            &quot;ExpirationDateMonth&quot;: 12,\n            &quot;ExpirationDateYear&quot;: 2020\n        },\n        {\n            &quot;Token&quot;: &quot;tk_1a9f2f10253a30a7c5692a3fc4c17&quot;,\n            &quot;AccountId&quot;: &quot;user_x&quot;,\n            &quot;CardMask&quot;: &quot;5555 55****** 4444&quot;,\n            &quot;ExpirationDateMonth&quot;: 12,\n            &quot;ExpirationDateYear&quot;: 2021\n        },\n        {\n            &quot;Token&quot;: &quot;tk_b91062f0f2875909233ab66d0fc7b&quot;,\n            &quot;AccountId&quot;: &quot;user_x&quot;,\n            &quot;CardMask&quot;: &quot;4012 88****** 1881&quot;,\n            &quot;ExpirationDateMonth&quot;: 12,\n            &quot;ExpirationDateYear&quot;: 2022\n        }\n    ],\n    &quot;Success&quot;: true,\n    &quot;Message&quot;: null}\u003c/code>\u003c/pre>\u003c/div>\u003ch3 id=\"подписки\">Подписки\u003c/h3>\u003ch4 id=\"создание-подписки-на-рекуррентные-платежи\">Создание подписки на рекуррентные платежи\u003c/h4>\u003cp>Метод создания подписки на рекуррентные платежи.\u003c/p>\u003caside class=\"api-callout \" role=\"note\">\u003cstrong class=\"callout-label\">Информация\u003c/strong>\u003cp>Оплата по токену проходит только на том терминале (\u003ccode>publicId\u003c/code>), на котором был получен токен. Если необходимо использовать токены на других терминалах, обратитесь в свободной форме на почту \u003ca href=\"mailto:assistant@cp.ru\">assistant@cp.ru\u003c/a>\u003c/p>\u003c/aside>\u003cp>\u003cstrong>Адрес метода:\u003c/strong>\u003cbr>https://api.cloudpayments.ru/subscriptions/create\u003c/p>\u003cp>\u003cstrong>Параметры запроса:\u003c/strong>\u003c/p>\u003cdiv class=\"api-table-scroll\" tabindex=\"0\" aria-label=\"Таблица\">\u003ctable style=\"table-layout:fixed;width:753px;min-width:0\">\u003ccolgroup>\u003ccol style=\"width:213px\">\u003ccol style=\"width:180px\">\u003ccol style=\"width:180px\">\u003ccol style=\"width:180px\">\u003c/colgroup>\u003ctr>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Параметр\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Формат\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Применение\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Описание\u003c/p>\u003c/th>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Token\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Токен карты, выданный системой после первого платежа\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>AccountId\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Идентификатор пользователя\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Description\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Назначение платежа в свободной форме\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Email\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>E-mail плательщика\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Amount\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Number\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Cумма платежа в валюте, разделитель точка. Количество не нулевых знаков после точки – 2\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Currency\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Валюта: RUB/USD/EUR/GBP (см. \u003ca href=\"https://developers.cloudpayments.ru/#spisok-valyut\" target=\"_blank\" rel=\"noopener noreferrer\">справочник\u003c/a>)\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>RequireConfirmation\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Bool\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Если значение true — платежи будут выполняться по двухстадийной схеме\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>StartDate\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>DateTime\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Дата и время первого платежа по плану во временной зоне UTC. Значение должно быть в будущем\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Interval\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Интервал. Возможные значения: Day, Week, Month\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Period\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Int\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Период. В комбинации с интервалом, 1 Month значит раз в месяц, а 2 Week — раз в две недели. Должен быть больше 0\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>MaxPeriods\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Int\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Максимальное количество платежей в подписке. Если указан, должен быть больше 0\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>CustomerReceipt\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>json\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Для изменения состава \u003ca href=\"https://developers.cloudpayments.ru/#format-peredachi-dannyh-dlya-onlayn-cheka\" target=\"_blank\" rel=\"noopener noreferrer\">онлайн-чека\u003c/a>\u003c/p> : 2,\n            &quot;Interval&quot;: &quot;Day&quot;,\n            &quot;Period&quot;: 5,\n            &quot;MaxPeriods&quot;: null,\n            &quot;CultureName&quot;: &quot;ru-RU&quot;,\n            &quot;StatusCode&quot;: 0,\n            &quot;Status&quot;: &quot;Active&quot;,\n            &quot;SuccessfulTransactionsNumber&quot;: 0,\n            &quot;FailedTransactionsNumber&quot;: 0,\n            &quot;LastTransactionDate&quot;: null,\n            &quot;LastTransactionDateIso&quot;: null,\n            &quot;NextTransactionDate&quot;: &quot;/Date(1635973200000)/&quot;,\n            &quot;NextTransactionDateIso&quot;: &quot;2021-11-03T21:00:00&quot;,\n            &quot;Receipt&quot;: null,\n            &quot;FailoverSchemeId&quot;: null\n        }\n    ],\n    &quot;Success&quot;: true,\n    &quot;Message&quot;: null}\u003c/code>\u003c/pre>\u003c/div>\u003ch4 id=\"изменение-подписки-на-рекуррентные-платежи\">Изменение подписки на рекуррентные платежи\u003c/h4>\u003cp>Метод изменения ранее созданной подписки.\u003c/p>\u003cp>\u003cstrong>Адрес метода:\u003c/strong>\u003cbr>https://api.cloudpayments.ru/subscriptions/update\u003c/p>\u003cp>\u003cstrong>Параметры запроса:\u003c/strong>\u003c/p>\u003cdiv class=\"api-table-scroll\" tabindex=\"0\" aria-label=\"Таблица\">\u003ctable>\u003ctr>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Параметр\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Формат\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Применение\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Описание\u003c/p>\u003c/th>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Id\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Идентификатор подписки\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Description\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Для изменения назначения платежа\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Amount\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Number\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Для изменения суммы платежа в валюте, разделитель точка. Количество не нулевых знаков после точки – 2.\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Currency\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Для изменения валюты: RUB/USD/EUR/GBP (\u003ca href=\"https://developers.cloudpayments.ru/#spisok-valyut\" target=\"_blank\" rel=\"noopener noreferrer\">см. справочник\u003c/a>)\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>RequireConfirmation\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Bool\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Для изменения схемы проведения платежей\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>StartDate\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>DateTime\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Для изменения даты и времени первого или следующего платежа во временной зоне UTC\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Interval\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Для изменения интервала. Возможные значения: Day, Week, Month\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Period\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Int\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Для изменения периода. В комбинации с интервалом, 1 Month значит раз в месяц, а 2 Week — раз в две недели\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>MaxPeriods\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Int\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Для изменения максимального количества платежей в подписке\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>CustomerReceipt\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>json\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Для изменения состава \u003ca href=\"https://developers.cloudpayments.ru/#format-peredachi-dannyh-dlya-onlayn-cheka\" target=\"_blank\" rel=\"noopener noreferrer\">онлайн-чека\u003c/a>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>CultureName\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Язык уведомлений. Возможные значения: &quot;ru-RU&quot;, &quot;en-US&quot;. (\u003ca href=\"#/tech/api@локализация\">см. справочник\u003c/a>)\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003caside class=\"api-callout \" role=\"note\">\u003cstrong class=\"callout-label\">Информация\u003c/strong>\u003cp>В случае завершения подписки или её отмены Плательщиком или Партнёром, при изменении любого атрибута подписки через API, подписка вновь активируется! В случае, если у подписки был задан MaxPeriods, то у вновь активированной подписки максимальное количество платежей в подписке будет равно MaxPeriods - количество платежей, которое уже было списано до момента отмены/завершения подписки.\u003c/p>\u003c/aside>\u003cp>В ответ на корректно сформированный запрос система возвращает сообщение об успешно выполненной операции и параметры подписки.\u003c/p>\u003cp>\u003cstrong>Пример запроса:\u003c/strong>\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>json\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-43\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-43\" class=\"language-json\">{  \n   &quot;Id&quot;:&quot;sc_3ffc96c001e152b341817341b075a&quot;,\n   &quot;description&quot;:&quot;изменение рекуррента&quot;,\n   &quot;amount&quot;:499,\n   &quot;currency&quot;:&quot;RUB&quot;}\u003c/code>\u003c/pre>\u003c/div>\u003cp>\u003cstrong>Пример ответа:\u003c/strong>\u003c/p>\u003cdiv class=\"api-code
