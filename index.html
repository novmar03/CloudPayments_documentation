crowAccumulationId&quot;: &quot;365b6942-94e8-4c5b-aff5-392dc1a51c28&quot;,\n        &quot;IssuerBankCountry&quot;: &quot;RU&quot;,\n        &quot;Issuer&quot;: &quot;CloudPayments&quot;,\n        &quot;CardTypeCode&quot;: 0,\n        &quot;Status&quot;: &quot;Authorized&quot;,\n        &quot;StatusCode&quot;: 2,\n        &quot;CultureName&quot;: &quot;ru&quot;,\n        &quot;Reason&quot;: &quot;Approved&quot;,\n        &quot;CardHolderMessage&quot;: &quot;Оплата успешно проведена&quot;,\n        &quot;Type&quot;: 0,\n        &quot;Refunded&quot;: false,\n        &quot;Name&quot;: null,\n        &quot;Token&quot;: null,\n        &quot;SubscriptionId&quot;: null,\n        &quot;GatewayName&quot;: &quot;Test&quot;,\n        &quot;AndroidPay&quot;: false,\n        &quot;WalletType&quot;: &quot;&quot;,\n        &quot;TotalFee&quot;: 0\n    },\n    &quot;Success&quot;: true,\n    &quot;Message&quot;: null\n}\n\u003c/code>\u003c/pre>\u003c/div>\u003cp>В ответ на запрос, в \u003ca href=\"https://developers.cloudpayments.ru/#pay\" target=\"_blank\" rel=\"noopener noreferrer\">Pay\u003c/a> уведомлении будет получен уникальный \u003ccode>EscrowAccumulationId\u003c/code>.\u003c/p>\u003cp>Также, при условии успешной транзакции, \u003ccode>EscrowAccumulationId\u003c/code> будет содержаться во всех вебхуках, кроме Check вебхука.\u003c/p>\u003cp>\u003cstrong>Выплата\u003c/strong>\u003c/p>\u003cp>Для завершения сделки необходимо отправить запрос \u003cstrong>payments/token/topup\u003c/strong> с указанием \u003ccode>AccumulationId\u003c/code> и массива транзакций к выплате (в массиве должен содержаться только один \u003ccode>transactionId\u003c/code>, согласно схеме сделки):\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>text\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-15\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-15\" class=\"language-text\">&quot;Escrow&quot;: {\n  &quot;AccumulationId&quot;: &quot;365b6942-94e8-4c5b-aff5-392dc1a51c28&quot;, \n  &quot;TransactionIds&quot;: [10649404],\n  &quot;EscrowType&quot;: &quot;OneToN&quot;\n}\n\u003c/code>\u003c/pre>\u003c/div>\u003cp>Выплаты можно производить до тех пор, пока сумма всех выплат не будет равна сумме операции оплаты.\u003c/p>\u003cp>Для закрытия сделки существует 2 способа:\u003c/p>\u003col start=\"1\">\u003cli>\u003cp>Передать параметр в объект Escrow &quot;FinalPayout&quot;: true (сделка закроется, даже если сумма выплат меньше суммы оплаты);\u003c/p>\u003c/li>\u003c/ol>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>text\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-16\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-16\" class=\"language-text\">&quot;Escrow&quot;: {\n  &quot;AccumulationId&quot;: &quot;365b6942-94e8-4c5b-aff5-392dc1a51c28&quot;, \n  &quot;TransactionIds&quot;: [10649404],\n  &quot;EscrowType&quot;: &quot;OneToN&quot;,\n  &quot;FinalPayout&quot;: true\n}\n\u003c/code>\u003c/pre>\u003c/div>\u003col start=\"1\">\u003cli>\u003cp>Когда сумма выплат будет равна сумме операции оплаты, сделка будет автоматически закрыта.\u003c/p>\u003c/li>\u003c/ol>\u003cp>Выплаты будут осуществляться только по тому \u003ccode>TransactionId\u003c/code>, который был указан в массиве \u003ccode>TransactionIds\u003c/code> (для 1:N только один ID операции оплаты) в запросе \u003cstrong>payments/token/topup\u003c/strong>.\u003c/p>\u003ch3 id=\"ogranicheniya-2\">\u003cstrong>Ограничения\u003c/strong>\u003c/h3>\u003cp>Сумма выплат должна быть меньше, либо равна сумме оплат.\u003c/p>\u003cp>По транзакции оплаты не должно быть отмены/полного возврата (частичные возвраты производить можно).\u003c/p>\u003cp>Все транзакции выплат должны быть:\u003c/p>\u003cul>\u003cli>\u003cp>с одинаковым \u003ccode>AccumulationId\u003c/code>;\u003c/p>\u003c/li>\u003cli>\u003cp>в валюте &quot;рубль&quot;;\u003c/p>\u003c/li>\u003cli>\u003cp>в статусе \u003cstrong>Completed\u003c/strong>;\u003c/p>\u003c/li>\u003cli>\u003cp>все транзакции выплат производятся в одной схеме (OneToN);\u003c/p>\u003c/li>\u003cli>\u003cp>Сделка не должна быть закрыта (не был передан finalPayout: true, сумма выплат меньше суммы операции оплаты)\u003c/p>\u003c/li>\u003c/ul>\u003ch2 id=\"poluchenie-po-accumulationid-statusa-operatsiy\">\u003cstrong>Получение по AccumulationId статуса операций\u003c/strong>\u003c/h2>\u003cp>Для получения информации требуется отправить http-запрос с типом авторизации “Basic Auth”. Логин - public key (pk) терминала. Подойдет как терминал оплаты, так и терминал выплаты. Пароль - api secret от данного Pk.\u003c/p>\u003cp>pk и api secret можно посмотреть в Личном кабинете в настройках сайта.\u003c/p>\u003cp>Получение информация доступно только по тем accumaltionIDs, которые были сформированы в рамках этой связки терминалов.\u003c/p>\u003ch2 id=\"metod-dlya-polucheniya-informatsii-po-bs-dlya-oboih-tipov-sdelki-n-1-i-1-n\">\u003cstrong>Метод для получения информации по БС для обоих типов сделки (N:1 и 1:N)\u003c/strong>\u003c/h2>\u003cp>Публичный метод для получения информации по массиву \u003cstrong>EscrowAccumulationId\u003c/strong>, который позволяет получить:\u003c/p>\u003cul>\u003cli>\u003cp>Массив оплат, по которым не была сделана выплата\u003cbr>\u003c/p>\u003cul>\u003cli>\u003cp>id транзакции \u003cstrong>оплаты\u003c/strong>\u003c/p>\u003c/li>\u003cli>\u003cp>статус транзакции (текстовое значение)\u003c/p>\u003c/li>\u003cli>\u003cp>сумма транзакции\u003c/p>\u003c/li>\u003c/ul>\u003c/li>\u003cli>\u003cp>Массив оплат, по которым была сделана выплата (которые вошли в выплату)\u003cbr>\u003c/p>\u003cul>\u003cli>\u003cp>id транзакции \u003cstrong>оплаты\u003c/strong>\u003c/p>\u003c/li>\u003cli>\u003cp>статус транзакции (текстовое значение)\u003c/p>\u003c/li>\u003cli>\u003cp>сумма транзакции\u003c/p>\u003c/li>\u003c/ul>\u003c/li>\u003cli>\u003cp>Массив возвратов по всем транзакциям\u003cbr>\u003c/p>\u003cul>\u003cli>\u003cp>id транзакции \u003cstrong>оплаты\u003c/strong>\u003c/p>\u003c/li>\u003cli>\u003cp>статус транзакции (текстовое значение)\u003c/p>\u003c/li>\u003cli>\u003cp>сумма транзакции\u003c/p>\u003c/li>\u003c/ul>\u003c/li>\u003cli>\u003cp>Массив транзакций выплат (для 1:N)\u003cbr>\u003c/p>\u003cul>\u003cli>\u003cp>id транзакции \u003cstrong>выплаты\u003c/strong>\u003c/p>\u003c/li>\u003cli>\u003cp>статус транзакции (текстовое значение)\u003c/p>\u003c/li>\u003cli>\u003cp>сумма транзакции \u003cstrong>выплаты\u003c/strong>\u003c/p>\u003c/li>\u003cli>\u003cp>признак закрытия сделки \u003cstrong>IsFinalPayout\u003c/strong>\u003c/p>\u003c/li>\u003c/ul>\u003c/li>\u003cli>\u003cp>Сальдо (Balance)\u003cbr>\u003c/p>\u003cul>\u003cli>\u003cp>Balance = PaymentsSum - RefundsSum - PayoutsSum\u003c/p>\u003c/li>\u003c/ul>\u003c/li>\u003c/ul>\u003cp>\u003cstrong>Адрес метода:\u003c/strong>\u003c/p>\u003cp>\u003ca href=\"https://api.cloudpayments.ru/Escrow/GetEscrowInfo\" target=\"_blank\" rel=\"noopener noreferrer\">https://api.cloudpayments.ru/Escrow/GetEscrowInfo\u003c/a>\u003c/p>\u003cp>\u003cstrong>Пример запроса:\u003c/strong>\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>text\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-17\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-17\" class=\"language-text\">{\n  &quot;EscrowAccumulationIds&quot; : [&quot;7de3281f-4339-4e2e-9df9-06dcfbcdceac&quot;]\n}\n\u003c/code>\u003c/pre>\u003c/div>\u003cp>\u003cstrong>Пример ответа:\u003c/strong>\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>text\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-18\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-18\" class=\"language-text\">{\n    &quot;Model&quot;: [\n        {\n            &quot;Status&quot;: &quot;Closed&quot;,\n            &quot;PaidoutTransactions&quot;: [\n                {\n                    &quot;Id&quot;: 608632,\n                    &quot;Status&quot;: &quot;Completed&quot;,\n                    &quot;Amount&quot;: 1500.0\n                },\n                {\n                    &quot;Id&quot;: 608631,\n                    &quot;Status&quot;: &quot;Completed&quot;,\n                    &quot;Amount&quot;: 901.0\n                }\n            ],\n            &quot;NotPaidoutTransactions&quot;: [\n                {\n                    &quot;Id&quot;: 608632,\n                    &quot;Status&quot;: &quot;Completed&quot;,\n                    &quot;Amount&quot;: 1500.0\n                },\n                {\n                    &quot;Id&quot;: 608634,\n                    &quot;Status&quot;: &quot;Completed&quot;,\n                    &quot;Amount&quot;: 901.0\n                }\n            ],\n            &quot;PayoutTransactions&quot;: [\n                {\n                    &quot;Id&quot;: 608635,\n                    &quot;Status&quot;: &quot;Completed&quot;,\n                    &quot;Amount&quot;: 1500.0, \n                    &quot;IsFinalPayout&quot;: true\n                },\n                {\n                    &quot;Id&quot;: 608636,\n                    &quot;Status&quot;: &quot;Completed&quot;,\n                    &quot;Amount&quot;: 901.0, \n                    &quot;IsFinalPayout&quot;: false\n                }\n            ],\n            &quot;RefundedTransactions&quot;: null,\n            &quot;EscrowAccumulationId&quot;: &quot;2533b003-da5d-463f-af85-fe6621354cd6&quot;,\n            &quot;Balance&quot;: 0.0\n        }\n    ],\n    &quot;Success&quot;: true,\n    &quot;Message&quot;: null\n}\n\u003c/code>\u003c/pre>\u003c/div>\u003ch3 id=\"znachenie-polya-status-dlya-sdelki\">\u003cstrong>Значение поля \u003c/strong>\u003ccode>Status\u003c/code>\u003cstrong> для сделки:\u003c/strong>\u003c/h3>\u003cul>\u003cli>\u003cp>Open\u003c/p>\u003c/li>\u003cli>\u003cp>Closed\u003c/p>\u003c/li>\u003c/ul>\u003cp>\u003cbr>\u003c/p>\u003c/div>","toc":[{"id":"opisanie-produkta","title":"Описание продукта","level":2},{"id":"opredeleniya-i-terminy","title":"Определения и термины:","level":2},{"id":"nastroyka-podklyucheniya","title":"Настройка подключения:","level":2},{"id":"chemy-raboty","title":"Cхемы работы","level":2},{"id":"statusnaya-model-sdelki","title":"Статусная модель сделки","level":2},{"id":"n-1","title":"N:1","level":2},{"id":"shema-integratsii-dlya-widget","title":"Схема интеграции для Widget:","level":3},{"id":"shema-integratsii-dlya-api-checkout","title":"Схема интеграции для API Checkout:","level":3},{"id":"ogranicheniya","title":"Ограничения","level":3},{"id":"1-n","title":"1:N","level":2},{"id":"shema-integratsii-dlya-widget-2","title":"Схема интеграции для Widget:","level":3},{"id":"shema-integratsii-dlya-api-checkout-2","title":"Схема интеграции для API Checkout:","level":3},{"id":"ogranicheniya-2","title":"Ограничения","level":3},{"id":"poluchenie-po-accumulationid-statusa-operatsiy","title":"Получение по AccumulationId статуса операций","level":2},{"id":"metod-dlya-polucheniya-informatsii-po-bs-dlya-oboih-tipov-sdelki-n-1-i-1-n","title":"Метод для получения информации по БС для обоих типов сделки (N:1 и 1:N)","level":2},{"id":"znachenie-polya-status-dlya-sdelki","title":"Значение поля Status для сделки:","level":3}],"group":"root-bezopasnaya-sdelka","type":"page","audience":"both"},"SDK-dlya-iOS":{"id":"SDK-dlya-iOS","title":"SDK для iOS","html":"\u003cdiv class=\"imported-api\">\u003cp>SDK позволяет интегрировать прием платежей в мобильные приложение для платформы iOS.\u003cbr>Основная версия находится на \u003ca href=\"https://gitpub.cloudpayments.ru/integrations/sdk/cloudpayments-ios\" target=\"_blank\" rel=\"noopener noreferrer\">GitHub\u003c/a>.\u003c/p>\u003cp>Из приложения вы узнаете как получить карточные данные, сформировать криптограмму, провести \u003ca href=\"https://developers.cloudpayments.ru/#3-d-secure\" target=\"_blank\" rel=\"noopener noreferrer\">3-D Secure авторизацию\u003c/a> и выполнить платеж на iPhone или iPad.\u003c/p>\u003cp>\u003cstrong>Условия использования\u003c/strong>:\u003c/p>\u003cul>\u003cli>\u003cp>Если вам необходимо будет пересылать данные через ваш сервер, то для него не потребуется сертификация PCI DSS, так как карточные данные на него приходят в зашифрованном виде, а ключи для расшифровки есть только в платежном шлюзе CloudPayments, в приложении и библиотеке их также нет;\u003c/p>\u003c/li>\u003cli>\u003cp>Данные карты можно вводить с клавиатуры или сканировать камерой например, через \u003ca href=\"http://card.io/\" target=\"_blank\" rel=\"noopener noreferrer\">card.io\u003c/a>. Полный номер карты и CVV нельзя сохранять или записывать в лог;\u003c/p>\u003c/li>\u003cli>\u003cp>Мобильный SDK нельзя использовать для мобильных терминалов (mPos). Единственное применение — в приложениях, которые будут установлены на телефонах и планшетах ваших покупателей;\u003c/p>\u003c/li>\u003cli>\u003cp>По правилам \u003ca href=\"https://developer.apple.com/app-store/review/guidelines/#purchasing-currencies\" target=\"_blank\" rel=\"noopener noreferrer\">AppStore\u003c/a> разработчик мобильного приложения имеет право принимать платежи с использованием сторонних платежных систем только для продажи нецифровых товаров или цифровых товаров, которые можно использовать вне приложения.\u003c/p>\u003c/li>\u003c/ul>\u003cp>\u003cbr>\u003c/p>\u003c/div>","toc":[],"group":"root-SDK-dlya-iOS","type":"page","audience":"both"},"SDK-dlya-Android":{"id":"SDK-dlya-Android","title":"SDK для Android","html":"\u003cdiv class=\"imported-api\">\u003cp>SDK позволяет интегрировать прием платежей в мобильные приложение для платформы Android.\u003cbr>Основная версия находится на \u003ca href=\"https://gitpub.cloudpayments.ru/integrations/sdk/cloudpayments-android\" target=\"_blank\" rel=\"noopener noreferrer\">Github\u003c/a>.\u003c/p>\u003cp>Из приложения вы узнаете, как получить карточные данные, сформировать криптограмму, провести \u003ca href=\"https://developers.cloudpayments.ru/#3-d-secure\" target=\"_blank\" rel=\"noopener noreferrer\">3-D Secure авторизацию\u003c/a> и выполнить платеж на Android.\u003c/p>\u003cp>\u003cstrong>Условия использования\u003c/strong>:\u003c/p>\u003cul>\u003cli>\u003cp>Если вам необходимо будет пересылать данные через ваш сервер, то для него не потребуется сертификация PCI DSS, так как карточные данные на него приходят в зашифрованном виде, а ключи для расшифровки есть только в платежном шлюзе CloudPayments, в приложении и библиотеке их также нет;\u003c/p>\u003c/li>\u003cli>\u003cp>Данные карты можно вводить с клавиатуры или сканировать камерой например, через \u003ca href=\"http://card.io/\" target=\"_blank\" rel=\"noopener noreferrer\">card.io\u003c/a>. Полный номер карты и CVV нельзя сохранять или записывать в лог;\u003c/p>\u003c/li>\u003cli>\u003cp>Мобильный SDK нельзя использовать для мобильных терминалов (mPos). Единственное применение — в приложениях, которые будут установлены на телефонах и планшетах ваших покупателей;\u003c/p>\u003c/li>\u003cli>\u003cp>По правилам \u003ca href=\"https://play.google.com/about/monetization-ads/\" target=\"_blank\" rel=\"noopener noreferrer\">Google Play\u003c/a> разработчик мобильного приложения имеет право принимать платежи с использованием сторонних платежных систем только для продажи нецифровых товаров или цифровых товаров, которые можно использовать вне приложения.\u003c/p>\u003c/li>\u003c/ul>\u003cp>\u003cbr>\u003c/p>\u003c/div>","toc":[],"group":"root-SDK-dlya-Android","type":"page","audience":"both"},"api":{"id":"api","title":"API","html":"\u003cdiv class=\"imported-api\">\u003cp>\u003cstrong>API\u003c/strong> — программный интерфейс системы для взаимодействия с системами ТСП.\u003c/p>\u003cp>Интерфейс работает по адресу \u003ca href=\"https://api.cloudpayments.ru/\" target=\"_blank\" rel=\"noopener noreferrer\">api.cloudpayments.ru\u003c/a> и поддерживает функции для выполнения платежа, отмены оплаты, возврата денег, завершения платежей, выполненных по двухстадийной схеме, создания и отмены подписок на рекуррентные платежи, а также отправки счетов по почте.\u003c/p>\u003ch2 id=\"printsip-raboty\">\u003cstrong>Принцип работы\u003c/strong>\u003c/h2>\u003cul>\u003cli>\u003cp>Параметры передаются методом POST в теле запроса в формате «ключ=значение» либо в JSON.\u003c/p>\u003c/li>\u003cli>\u003cp>API может принимать не больше 150 000 полей в одном запросе. Тайм-аут на получение ответа от API — 5 минут.\u003c/p>\u003c/li>\u003cli>\u003cp>Во всех запросах к API если передать число с дробной частью в целочисленное поле, то ошибки не будет, зато произойдёт математическое округление.\u003c/p>\u003c/li>\u003cli>\u003cp>API ограничивает максимальное количество одновременных запросов для тестовых терминалов до 5, для боевых до 30. Если количество обрабатываемых в данный момент запросов к сайту больше ограничения - API будет возвращать ответ с HTTP кодом 429 (Too many Requests) до момента пока не будет завершена обработка хотя бы одного запроса. При необходимости пересмотра ограничений - обратитесь к персональному менеджеру.\u003c/p>\u003c/li>\u003c/ul>\u003cp>Выбор формата передачи параметров определяется на стороне клиента и управляется через заголовок запроса \u003ca href=\"https://www.w3.org/Protocols/rfc2616/rfc2616-sec14.html#sec14.17\" target=\"_blank\" rel=\"noopener noreferrer\">Content-Type\u003c/a>.\u003c/p>\u003cul>\u003cli>\u003cp>Для параметров \u003cstrong>«ключ=значение»\u003c/strong> Content-Type: \u003cem>application/x-www-form-urlencoded\u003c/em>;\u003c/p>\u003c/li>\u003cli>\u003cp>Для параметров \u003cstrong>JSON Content-Type\u003c/strong>: \u003cem>application/json\u003c/em>;\u003c/p>\u003c/li>\u003c/ul>\u003cp>Ответ система выдает в JSON-формате, который как минимум включает в себя два параметра: \u003cstrong>Success\u003c/strong> и \u003cstrong>Message\u003c/strong>:\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>text\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-1\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-1\" class=\"language-text\">{ &quot;Success&quot;: false, &quot;Message&quot;: &quot;Invalid Amount value&quot; }\n\u003c/code>\u003c/pre>\u003c/div>\u003ch2 id=\"autentifikatsiya-zaprosov\">\u003cstrong>Аутентификация запросов\u003c/strong>\u003c/h2>\u003cp>Для аутентификации запроса используется \u003ca href=\"https://en.wikipedia.org/wiki/Basic_access_authentication\" target=\"_blank\" rel=\"noopener noreferrer\">HTTP Basic Auth\u003c/a> — отправка логина и пароля в заголовке HTTP-запроса. В качестве логина используется \u003cstrong>Public ID\u003c/strong>, в качестве пароля — \u003cstrong>API Secret\u003c/strong>. Оба этих значения можно получить в личном кабинете.\u003c/p>\u003cp>Если в запросе не передан заголовок с данными аутентификации или переданы неверные данные, система вернет HTTP-статус 401 – Unauthorized.\u003c/p>\u003cp>API secret используется для обеспечения безопасности. Он должен храниться в защищенном месте.\u003c/p>\u003ch2 id=\"idempotentnost-api\">\u003cstrong>Идемпотентность API\u003c/strong>\u003c/h2>\u003cp>\u003cstrong>Идемпотентность\u003c/strong> — свойство API при повторном запросе выдавать тот же результат, что на первичный запрос без повторной обработки. Это значит, что вы можете отправить несколько запросов к системе с одинаковым идентификатором, при этом обработан будет только один успешный запрос, а все ответы будут идентичными. Таким образом реализуется защита от сетевых ошибок, которые приводят к созданию дублированных записей и действий.\u003cbr>Для включения идемпотентности необходимо в запросе к API передавать заголовок с ключом \u003cstrong>X-Request-ID\u003c/strong>, содержащий уникальный идентификатор. Формирование идентификатора запроса остается на вашей стороне — это может быть guid, комбинация из номера заказа, даты и суммы или любое другое значение на ваше усмотрение.\u003cbr>Каждый новый запрос, который необходимо обработать, должен включать новое значение \u003cstrong>X-Request-ID\u003c/strong>. Обработанный результат хранится в системе в течение 1 часа.\u003c/p>\u003ch2 id=\"testovyy-metod\">\u003cstrong>Тестовый метод\u003c/strong>\u003c/h2>\u003cp>Для проверки взаимодействия с API можно вызвать тестовый метод.\u003c/p>\u003cp>\u003cstrong>Адрес метода:\u003c/strong>\u003cbr>https://api.cloudpayments.ru/test\u003c/p>\u003cp>\u003cstrong>Параметры запроса:\u003c/strong>\u003cbr>Отсутствуют.\u003c/p>\u003cp>\u003cstrong>Пример ответа:\u003c/strong>\u003cbr>В ответ метод возвращает статус запроса.\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>text\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-2\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-2\" class=\"language-text\">{&quot;Success&quot;:true,&quot;Message&quot;:&quot;bd6353c3-0ed6-4a65-946f-083664bf8dbd&quot;}\n\u003c/code>\u003c/pre>\u003c/div>\u003ch2 id=\"oplata-po-kriptogramme\">\u003cstrong>Оплата по криптограмме\u003c/strong>\u003c/h2>\u003cp>По требованию НСПК, для ТСП, предоставляющих телекоммуникационные услуги (MCC 4814 Telecommunication Services), обязательна передача номера телефона плательщика. При отсутствии номера телефона в запросе, банки-эквайеры будут отклонять проводимые операции.\u003cbr>\u003cbr>Номер телефона необходимо передавать в объекте Payer в параметре Phone.\u003cbr>Формат передачи: только цифры, без разделителей “( )“, “-“ .\u003cbr>Пример передачи: “+71234567890“\u003c/p>\u003cp>Метод для оплаты по криптограмме платежных данных результат алгоритма шифрования. Для формирования криптограммы воспользуйтесь скриптом \u003ca href=\"https://developers.cloudpayments.ru/#skript-checkout\" target=\"_blank\" rel=\"noopener noreferrer\">Checkout\u003c/a>.\u003c/p>\u003cp>\u003cstrong>Адреса метода\u003c/strong>:\u003cbr>https://api.cloudpayments.ru/payments/cards/charge — для \u003ca href=\"https://developers.cloudpayments.ru/#shemy-provedeniya-platezha\" target=\"_blank\" rel=\"noopener noreferrer\">одностадийного платежа\u003c/a>\u003cbr>https://api.cloudpayments.ru/payments/cards/auth — для \u003ca href=\"https://developers.cloudpayments.ru/#shemy-provedeniya-platezha\" target=\"_blank\" rel=\"noopener noreferrer\">двухстадийного\u003c/a>\u003c/p>\u003cp>\u003cstrong>Параметры запроса:\u003c/strong>\u003c/p>\u003cdiv class=\"api-table-scroll\" tabindex=\"0\" aria-label=\"Таблица\">\u003ctable>\u003ctr>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Параметр\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Формат\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Применение\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Описание\u003c/p>\u003c/th>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Amount\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Number\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Cумма платежа в валюте, разделитель точка. Количество не нулевых знаков после точки – 2\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Currency\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Валюта: RUB/USD/EUR/GBP (\u003ca href=\"https://developers.cloudpayments.ru/#spisok-valyut\" target=\"_blank\" rel=\"noopener noreferrer\">см. справочник\u003c/a>). Если параметр не передан, то по умолчанию принимает значение RUB\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>IpAddress\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>IP-адрес плательщика\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>CardCryptogramPacket\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003ca href=\"https://developers.cloudpayments.ru/#skript-checkout\" target=\"_blank\" rel=\"noopener noreferrer\">Криптограмма платежных данных\u003c/a>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Name\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Имя держателя карты латиницей\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>PaymentUrl\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Адрес сайта, с которого совершается вызов скрипта checkout\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>InvoiceId\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Номер счета или заказа\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Description\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Описание оплаты в свободной форме\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>CultureName\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Язык уведомлений. Возможные значения: &quot;ru-RU&quot;, &quot;en-US&quot;. (\u003ca href=\"https://developers.cloudpayments.ru/#lokalizatsiya\" target=\"_blank\" rel=\"noopener noreferrer\">см. справочник\u003c/a>)\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>AccountId\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный идентификатор пользователя для создания подписки и получения токена\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Email\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>E-mail плательщика, на который будет отправлена квитанция об оплате\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Payer\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Object\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Доп. поле, куда передается информация о плательщике. Используйте следующие параметры: \u003ccode>FirstName\u003c/code>, \u003ccode>LastName\u003c/code>, \u003ccode>MiddleName\u003c/code>, \u003ccode>Birth\u003c/code>, \u003ccode>Street\u003c/code>, \u003ccode>Address\u003c/code>, \u003ccode>City\u003c/code>, \u003ccode>Country\u003c/code>, \u003ccode>Phone\u003c/code>, \u003ccode>Postcode\u003c/code>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>JsonData\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Json\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Любые другие данные, которые будут связаны с транзакцией, в том числе инструкции для \u003ca href=\"https://developers.cloudpayments.ru/#rekurrentnye-platezhi-podpiska\" target=\"_blank\" rel=\"noopener noreferrer\">создания подписки\u003c/a> или формирования \u003ca href=\"https://developers.cloudpayments.ru/#format-peredachi-dannyh-dlya-onlayn-cheka\" target=\"_blank\" rel=\"noopener noreferrer\">онлайн-чека\u003c/a> должны обёртываться в объект \u003ccode>cloudpayments\u003c/code>. Мы зарезервировали названия следующих параметров и отображаем их содержимое в реестре операций, выгружаемом в Личном Кабинете: \u003ccode>name\u003c/code>, \u003ccode>firstName\u003c/code>, \u003ccode>middleName\u003c/code>, \u003ccode>lastName\u003c/code>, \u003ccode>nick\u003c/code>, \u003ccode>phone\u003c/code>, \u003ccode>address\u003c/code>, \u003ccode>comment\u003c/code>, \u003ccode>birthDate\u003c/code>.\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>SaveCard\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>bool\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Признак сохранения карточного токена для проведения оплаты по сохранённой карте (см. \u003ca href=\"https://developers.cloudpayments.ru/#oplata-po-tokenu-rekarring\" target=\"_blank\" rel=\"noopener noreferrer\">Оплата по токену (рекарринг)\u003c/a>).\u003cbr>Возможные значения: \u003ccode>true\u003c/code> - после успешной оплаты будет возвращён карточный токен, \u003ccode>false\u003c/code> - токен не будет возвращаться (по-умолчанию)\u003cbr>Параметр SaveCard обрабатывается только при включении настройки &quot;Сохранение токена карты&quot; в Личном Кабинете. При включении настройки &quot;Сохранять принудительно&quot;, параметр SaveCard будет игнорироваться.\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cp>Параметр amount не принимает сумму транзакции меньше 0.01.\u003c/p>\u003cp>\u003cem>В ответ сервер возвращает JSON с тремя составляющими\u003c/em>:\u003c/p>\u003cul>\u003cli>\u003cp>\u003cstrong>поле success\u003c/strong> — результат запроса;\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>поле message\u003c/strong> — описание ошибки;\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>объект model\u003c/strong> — расширенная информация.\u003c/p>\u003c/li>\u003c/ul>\u003cp>\u003cem>Возможные варианты ответа\u003c/em>:\u003c/p>\u003cul>\u003cli>\u003cp>Некорректно сформирован запрос:\u003cbr>\u003cstrong>success\u003c/strong> — false\u003cbr>\u003cstrong>message\u003c/strong> — описание ошибки\u003c/p>\u003c/li>\u003cli>\u003cp>Требуется 3-D Secure аутентификация:\u003cbr>\u003cstrong>success\u003c/strong> — false\u003cbr>\u003cstrong>model\u003c/strong> — информация для проведения аутентификации\u003c/p>\u003c/li>\u003cli>\u003cp>Транзакция отклонена:\u003cbr>\u003cstrong>success\u003c/strong> — false\u003cbr>\u003cstrong>model\u003c/strong> — информация о транзакции и код ошибки\u003c/p>\u003c/li>\u003cli>\u003cp>Транзакция принята:\u003cbr>\u003cstrong>success\u003c/strong> — true\u003cbr>\u003cstrong>model\u003c/strong> — информация о транзакции\u003c/p>\u003c/li>\u003c/ul>\u003cp>Результат запроса (поле Success) не отражает статус транзакции, а лишь свидетельствует об успешности/неуспешности запроса API. Статус транзакции отражен в дополнительном поле Status, также его можно узнать в результате получения \u003ca href=\"https://developers.cloudpayments.ru/#uvedomleniya\" target=\"_blank\" rel=\"noopener noreferrer\">уведомлений\u003c/a>. Интерпретацию статусов транзакции смотрите в \u003ca href=\"https://developers.cloudpayments.ru/#statusy-operatsiy\" target=\"_blank\" rel=\"noopener noreferrer\">справочнике\u003c/a>.\u003c/p>\u003cp>\u003cstrong>Пример запроса на оплату по криптограмме:\u003c/strong>\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>text\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-3\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-3\" class=\"language-text\">{\n    &quot;Amount&quot;:10,\n    &quot;Currency&quot;:&quot;RUB&quot;,\n    &quot;InvoiceId&quot;:&quot;1234567&quot;,\n    &quot;IpAddress&quot;: &quot;123.123.123.123&quot;,\n    &quot;Description&quot;:&quot;Оплата товаров в example.com&quot;,\n    &quot;AccountId&quot;:&quot;user_x&quot;,\n    &quot;Name&quot;:&quot;CARDHOLDER NAME&quot;, // CardCryptogramPacket Обязательный параметр\n    &quot;CardCryptogramPacket&quot;:&quot;01492500008719030128SMfLeYdKp5dSQVIiO5l6ZCJiPdel4uDjdFTTz1UnXY+3QaZcNOW8lmXg0H670MclS4lI+qLkujKF4pR5Ri+T/E04Ufq3t5ntMUVLuZ998DLm+OVHV7FxIGR7snckpg47A73v7/y88Q5dxxvVZtDVi0qCcJAiZrgKLyLCqypnMfhjsgCEPF6d4OMzkgNQiynZvKysI2q+xc9cL0+CMmQTUPytnxX 3cstrong>PaReq\u003c/strong> — одноименный параметр из ответа сервера;\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>TermUrl\u003c/strong> — адрес на вашем сайте для возврата плательщика после аутентификации.\u003c/p>\u003c/li>\u003c/ul>\u003cp>Регистр букв в названии параметров имеет значение.\u003c/p>\u003ch3 id=\"primer-formy\">\u003cstrong>Пример формы:\u003c/strong>\u003c/h3>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>text\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-8\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-8\" class=\"language-text\">&lt;form name=&quot;downloadForm&quot; action=&quot;AcsUrl&quot; method=&quot;POST&quot;&gt;\n    &lt;input type=&quot;hidden&quot; name=&quot;PaReq&quot; value=&quot;eJxVUdtugkAQ/RXDe9mLgo0Z1nhpU9PQasWmPhLYAKksuEChfn13uVR9mGTO7MzZM2dg3qSn0Q+X\\nRZIJxyAmNkZcBFmYiMgxDt7zw6MxZ+DFkvP1ngeV5AxcXhR+xEdJ6BhpEZnEYLBdfPAzg56JKSKT\\nAhqgGpFB7IuSgR+cl5s3NqFTG2NAPYSUy82aETqeWPYUUAdB+ClnwSmrwtz/TbkoC0BtDYKsEqX8\\nZfZkDGgAUMkTi8synyFU17V5N2nKCpBuAHRVs610VijCJgmZu17UXTxhFWP34l7evYPlegsHkO6A\\n0C85o5hMsI3piNIZHc+IBaitg59qJYzgdrUOQK7/WNy+3FZAeSqV5cMqAwLe5JlQwpny8T8HdFW8\\netFuBqUyahV+Hjf27vWCaSx22fe+KY6kXKZfJLK1x22TZkyUS8QiHaUGgDQN6s+H+tOq7O7kf8hd\\nt30=&quot;&gt;\n    &lt;input type=&quot;hidden&quot; name=&quot;MD&quot; value=&quot;504&quot;&gt;\n    &lt;input type=&quot;hidden&quot; name=&quot;TermUrl&quot; value=&quot;https://example.com/post3ds?order=1234567&quot;&gt;\n&lt;/form&gt;\n&lt;script&gt;\n    window.onload = submitForm;\n    function submitForm() { downloadForm.submit(); }\n&lt;/script&gt;\n\u003c/code>\u003c/pre>\u003c/div>\u003cp>После аутентификации плательщик будет возвращен на TermUrl с параметрами MD и PaRes, переданными методом POST.\u003c/p>\u003cp>\u003cbr>\u003c/p>\u003cp>Для завершения оплаты выполните следующий метод Post3ds.\u003c/p>\u003cp>\u003cstrong>Адрес метода:\u003c/strong>\u003cbr>https://api.cloudpayments.ru/payments/cards/post3ds\u003c/p>\u003cp>\u003cstrong>Параметры запроса:\u003c/strong>\u003c/p>\u003cdiv class=\"api-table-scroll\" tabindex=\"0\" aria-label=\"Таблица\">\u003ctable>\u003ctr>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Параметр\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Формат\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Применение\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Описание\u003c/p>\u003c/th>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>TransactionId\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Long\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Значение параметра MD\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>PaRes\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Значение одноименного параметра\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cp>В ответ на корректно сформированный запрос сервер вернет либо информацию об \u003ca href=\"https://developers.cloudpayments.ru/#sample-approved\" target=\"_blank\" rel=\"noopener noreferrer\">успешной транзакции\u003c/a>, либо — \u003ca href=\"https://developers.cloudpayments.ru/#sample-declined\" target=\"_blank\" rel=\"noopener noreferrer\">об отклоненной\u003c/a>.\u003c/p>\u003ch2 id=\"oplata-po-tokenu-rekarring\">\u003cstrong>Оплата по токену (рекарринг)\u003c/strong>\u003c/h2>\u003cp>По требованию НСПК, для ТСП, предоставляющих телекоммуникационные услуги (MCC 4814 Telecommunication Services), обязательна передача номера телефона плательщика. При отсутствии номера телефона в запросе, банки-эквайеры будут отклонять проводимые операции.\u003cbr>\u003cbr>Номер телефона необходимо передавать в объекте Payer в параметре Phone.\u003cbr>Формат передачи: только цифры, без разделителей “( )“, “-“ .\u003cbr>Пример передачи: “+71234567890“\u003c/p>\u003cp>Метод для оплаты по токену, полученному при \u003ca href=\"https://developers.cloudpayments.ru/#oplata-po-kriptogramme\" target=\"_blank\" rel=\"noopener noreferrer\">оплате по криптограмме\u003c/a>, либо через \u003ca href=\"https://developers.cloudpayments.ru/#pay\" target=\"_blank\" rel=\"noopener noreferrer\">Pay\u003c/a>-уведомление.\u003c/p>\u003cp>Оплата по токену проходит только на том терминале (\u003ccode>publicId\u003c/code>), на котором был получен токен. Если необходимо использовать токены на других терминалах, обратитесь в свободной форме на почту \u003ca href=\"mailto:assistant@cp.ru\">assistant@cp.ru\u003c/a>\u003c/p>\u003cp>Финальный статус оплаты по токену СБП (“Завершена”/“Отклонена”) можно получить через \u003ca href=\"https://developers.cloudpayments.ru/#pay\" target=\"_blank\" rel=\"noopener noreferrer\">Pay\u003c/a> и \u003ca href=\"https://developers.cloudpayments.ru/#fail\" target=\"_blank\" rel=\"noopener noreferrer\">Fail\u003c/a>-уведомления уже после создания транзакции, а не в ответе на сам запрос оплаты по токену.\u003c/p>\u003cp>\u003cstrong>Адреса метода\u003c/strong>:\u003cbr>https://api.cloudpayments.ru/payments/tokens/charge — для \u003ca href=\"https://developers.cloudpayments.ru/#shemy-provedeniya-platezha\" target=\"_blank\" rel=\"noopener noreferrer\">одностадийного платежа\u003c/a>\u003cbr>https://api.cloudpayments.ru/payments/tokens/auth — для \u003ca href=\"https://developers.cloudpayments.ru/#shemy-provedeniya-platezha\" target=\"_blank\" rel=\"noopener noreferrer\">двухстадийного\u003c/a>\u003c/p>\u003cp>\u003cstrong>Параметры запроса:\u003c/strong>\u003c/p>\u003cdiv class=\"api-table-scroll\" tabindex=\"0\" aria-label=\"Таблица\">\u003ctable>\u003ctr>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Параметр\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Формат\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Применение\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Описание\u003c/p>\u003c/th>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Amount\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Number\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Cумма платежа в валюте, разделитель точка. Количество не нулевых знаков после точки – 2\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Currency\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Валюта: RUB/USD/EUR/GBP (см. \u003ca href=\"https://developers.cloudpayments.ru/#spisok-valyut\" target=\"_blank\" rel=\"noopener noreferrer\">справочник\u003c/a>). Если параметр не передан, то по умолчанию принимает значение RUB\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>AccountId\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Идентификатор пользователя\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>TrInitiatorCode\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Int\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Признак инициатора списания денежных средств.\u003cbr>Возможные значения:\u003cbr>0 - транзакция инициирована ТСП на основе ранее сохраненных учетных данных;\u003cbr>1 - транзакция инициирована держателем карты (клиентом) на основе ранее сохраненных учетных данных.\u003cbr>\u003cstrong>ВАЖНО!\u003c/strong> В случае, если транзакция инициирована ТСП, необходимо дополнительно в запросе указать параметр PaymentScheduled с корректным значением.\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>PaymentScheduled\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Int\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Признак оплаты по расписанию на основе ранее сохраненных учетных данных.\u003cbr>Возможные значения:\u003cbr>0 - без расписания;\u003cbr>1 - по расписанию.\u003cbr>\u003cstrong>ВАЖНО!\u003c/strong> В случае, если при запросе данный параметр не указан, по умолчанию будет использоваться значение 0.\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Token\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Токен\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>InvoiceId\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Номер счета или заказа\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Description\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Назначение платежа в свободной форме\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>IpAddress\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>IP-адрес плательщика\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Email\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>E-mail плательщика, на который будет отправлена квитанция об оплате\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Payer\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Object\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Доп. поле, куда передается информация о плательщике. Используйте следующие параметры: \u003ccode>FirstName\u003c/code>, \u003ccode>LastName\u003c/code>, \u003ccode>MiddleName\u003c/code>, \u003ccode>Birth\u003c/code>, \u003ccode>Street\u003c/code>, \u003ccode>Address\u003c/code>, \u003ccode>City\u003c/code>, \u003ccode>Country\u003c/code>, \u003ccode>Phone\u003c/code>, \u003ccode>Postcode\u003c/code>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>JsonData\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Json\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Любые другие данные, которые будут связаны с транзакцией, в том числе инструкции для \u003ca href=\"https://developers.cloudpayments.ru/#rekurrentnye-platezhi-podpiska\" target=\"_blank\" rel=\"noopener noreferrer\">создания подписки\u003c/a> или формирования \u003ca href=\"https://developers.cloudpayments.ru/#format-peredachi-dannyh-dlya-onlayn-cheka\" target=\"_blank\" rel=\"noopener noreferrer\">онлайн-чека\u003c/a> должны обёртываться в объект \u003ccode>cloudpayments\u003c/code>. Мы зарезервировали названия следующих параметров и отображаем их содержимое в реестре операций, выгружаемом в Личном Кабинете: \u003ccode>name\u003c/code>, \u003ccode>firstName\u003c/code>, \u003ccode>middleName\u003c/code>, \u003ccode>lastName\u003c/code>, \u003ccode>nick\u003c/code>, \u003ccode>phone\u003c/code>, \u003ccode>address\u003c/code>, \u003ccode>comment\u003c/code>, \u003ccode>birthDate\u003c/code>.\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cp>В ответ сервер возвращает JSON с тремя составляющими: поле \u003cstrong>success\u003c/strong> — результат запроса, поле \u003cstrong>message\u003c/strong> — описание ошибки, объект \u003cstrong>model\u003c/strong> — расширенная информация.\u003c/p>\u003ch3 id=\"vozmozhnye-varianty\">\u003cstrong>Возможные варианты\u003c/strong>\u003c/h3>\u003cul>\u003cli>\u003cp>Некорректно сформирован запрос:\u003cbr>\u003cstrong>success\u003c/strong> — false\u003cbr>\u003cstrong>message\u003c/strong> — описание ошибки\u003c/p>\u003c/li>\u003cli>\u003cp>Транзакции отклонена:\u003cbr>\u003cstrong>success\u003c/strong> — false\u003cbr>\u003cstrong>model\u003c/strong> — информация о транзакции и код ошибки\u003c/p>\u003c/li>\u003cli>\u003cp>Транзакции принята:\u003cbr>\u003cstrong>success\u003c/strong> — true\u003cbr>\u003cstrong>model\u003c/strong> — информация о транзакции\u003c/p>\u003c/li>\u003c/ul>\u003cp>Результат запроса (поле Success) не отражает статус транзакции, а лишь свидетельствует об успешности/неуспешности запроса API. Статус транзакции отражен в дополнительном поле Status, также его можно узнать в результате получения \u003ca href=\"https://developers.cloudpayments.ru/#uvedomleniya\" target=\"_blank\" rel=\"noopener noreferrer\">уведомлений\u003c/a>. Интерпретацию статусов транзакции смотрите в \u003ca href=\"https://developers.cloudpayments.ru/#statusy-operatsiy\" target=\"_blank\" rel=\"noopener noreferrer\">справочнике\u003c/a>.\u003c/p>\u003cp>\u003cstrong>Пример запроса на оплату по токену\u003c/strong>:\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>text\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-9\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-9\" class=\"language-text\">{\n    &quot;Amount&quot;:59,\n    &quot;Currency&quot;:&quot;RUB&quot;,\n    &quot;InvoiceId&quot;:&quot;1234567&quot;,\n    &quot;Description&quot;:&quot;Оплата товаров в example.com&quot;,\n    &quot;AccountId&quot;:&quot;user_x&quot;,\n    &quot;TrInitiatorCode&quot;: 0,\n    &quot;PaymentScheduled&quot;: 1,\n    &quot;Token&quot;:&quot;success_1111a3e0-2428-48fb-a530-12815d90d0e8&quot;,\n    &quot;Payer 3ctd colspan=\"1\" rowspan=\"1\">\u003cp>Идентификатор пользователя\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Email\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>E-mail плательщика, на который будет отправлена квитанция об оплате\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>JsonData\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Json\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Любые другие данные, которые будут связаны с транзакцией. Мы зарезервировали названия следующих параметров и отображаем их содержимое в реестре операций, выгружаемом в Личном Кабинете: \u003ccode>name\u003c/code>, \u003ccode>firstName\u003c/code>, \u003ccode>middleName\u003c/code>, \u003ccode>lastName\u003c/code>, \u003ccode>nick\u003c/code>, \u003ccode>phone\u003c/code>, \u003ccode>address\u003c/code>, \u003ccode>comment\u003c/code>, \u003ccode>birthDate\u003c/code>.\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>InvoiceId\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Номер заказа в вашей системе\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Description\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Описание оплаты в свободной форме\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Payer\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Object\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Доп. поле, куда передается информация о плательщике\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Receiver\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Object\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Доп. поле, куда передается информация о получателе\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cp>Для выплат на иностранные карты понадобится параметр Payer или Receiver в зависимости от терминала.\u003c/p>\u003cp>\u003cstrong>Пример запроса:\u003c/strong>\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>text\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-19\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-19\" class=\"language-text\">{\n    &quot;Name&quot;:&quot;CARDHOLDER NAME&quot;,\n    &quot;CardCryptogramPacket&quot;:&quot;01492500008719030128SMfLeYdKp5dSQVIiO5l6ZCJiPdel4uDjdFTTz1UnXY+3QaZcNOW8lmXg0H670MclS4lI+qLkujKF4pR5Ri+T/E04Ufq3t5nt /button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-20\" class=\"language-text\">{\n    &quot;Model&quot;: {\n        &quot;ReasonCode&quot;: 0,\n        &quot;PublicId&quot;: &quot;pk_*******************************&quot;,\n        &quot;TerminalUrl&quot;: &quot;http://test.test&quot;,\n        &quot;TransactionId&quot;: 897739551,\n        &quot;Amount&quot;: 399,\n        &quot;Currency&quot;: &quot;RUB&quot;,\n        &quot;CurrencyCode&quot;: 0,\n        &quot;PaymentAmount&quot;: 399,\n        &quot;PaymentCurrency&quot;: &quot;RUB&quot;,\n        &quot;PaymentCurrencyCode&quot;: 0,\n        &quot;InvoiceId&quot;: null,\n        &quot;AccountId&quot;: &quot;user@example.com&quot;,\n        &quot;Email&quot;: null,\n        &quot;Description&quot;: null,\n        &quot;JsonData&quot;: null,\n        &quot;CreatedDate&quot;: &quot;/Date(1635564719715)/&quot;,\n        &quot;PayoutDate&quot;: null,\n        &quot;PayoutDateIso&quot;: null,\n        &quot;PayoutAmount&quot;: null,\n        &quot;CreatedDateIso&quot;: &quot;2021-10-30T03:31:59&quot;,\n        &quot;AuthDate&quot;: &quot;/Date(1635564719858)/&quot;,\n        &quot;AuthDateIso&quot;: &quot;2021-10-30T03:31:59&quot;,\n        &quot;ConfirmDate&quot;: &quot;/Date(1635564719858)/&quot;,\n        &quot;ConfirmDateIso&quot;: &quot;2021-10-30T03:31:59&quot;,\n        &quot;AuthCode&quot;: &quot;A1B2C3&quot;,\n        &quot;TestMode&quot;: true,\n        &quot;Rrn&quot;: null,\n        &quot;OriginalTransactionId&quot;: null,\n        &quot;FallBackScenarioDeclinedTransactionId&quot;: null,\n        &quot;IpAddress&quot;: &quot;172.18.200.124&quot;,\n        &quot;IpCountry&quot;: &quot;&quot;,\n        &quot;IpCity&quot;: null,\n        &quot;IpRegion&quot;: null,\n        &quot;IpDistrict&quot;: null,\n        &quot;IpLatitude&quot;: null,\n        &quot;IpLongitude&quot;: null,\n        &quot;CardFirstSix&quot;: &quot;424242&quot;,\n        &quot;CardLastFour&quot;: &quot;4242&quot;,\n        &quot;CardExpDate&quot;: &quot;12/25&quot;,\n        &quot;CardType&quot;: &quot;Visa&quot;,\n        &quot;CardProduct&quot;: &quot;I&quot;,\n        &quot;CardCategory&quot;: &quot;Visa Infinite (Infinite)&quot;,\n        &quot;EscrowAccumulationId&quot;: null,\n        &quot;IssuerBankCountry&quot;: &quot;RU&quot;,\n        &quot;Issuer&quot;: &quot;CloudPayments&quot;,\n        &quot;CardTypeCode&quot;: 0,\n        &quot;Status&quot;: &quot;Completed&quot;,\n        &quot;StatusCode&quot;: 3,\n        &quot;CultureName&quot;: &quot;ru&quot;,\n        &quot;Reason&quot;: &quot;Approved&quot;,\n        &quot;CardHolderMessage&quot;: &quot;Оплата успешно проведена&quot;,\n        &quot;Type&quot;: 2,\n        &quot;TransactionIsInProcess&quot;: false,\n        &quot;Refunded&quot;: false,\n        &quot;Name&quot;: &quot;CARDHOLDER NAME&quot;,\n        &quot;Token&quot;: null,\n        &quot;SubscriptionId&quot;: null,\n        &quot;GatewayName&quot;: &quot;Test&quot;,\n        &quot;AndroidPay&quot;: false,\n        &quot;WalletType&quot;: &quot;&quot;,\n        &quot;TotalFee&quot;: 0\n    },\n    &quot;Success&quot;: true,\n    &quot;Message&quot;: null\n}\n\u003c/code>\u003c/pre>\u003c/div>\u003cp>Можно воспользоваться механизмом надежной аутентификации запроса на выплату. Для этого передайте в нашу поддержку сертификат с публичной частью ключа. Далее сгенерируйте подпись на основе тела запроса и разместите ее в заголовке X-Signature в base64 формате. CloudPayments проверит вашу подпись, используя CryptoService. Если подпись валидна, то обработка запроса продолжится, если нет — обработка прекратится.\u003c/p>\u003cp>\u003cstrong>В ответе метода выплаты по криптограмме POST /payments/cards/topup возвращаются следующие статусы:\u003c/strong>\u003c/p>\u003cdiv class=\"api-table-scroll\" tabindex=\"0\" aria-label=\"Таблица\">\u003ctable>\u003ctr>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Статус\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Описание\u003c/p>\u003c/th>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Completed\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Выплата выполнена успешно\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Created\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Выплата в промежуточном статусе\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Failed\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Выплата не выполнена\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cp>В случае перехода транзакции в промежуточный статус \u003cstrong>срабатывает сценарий асинхронной обработки выплаты\u003c/strong>, в результате выполнения которого параметр Model.Status принимает значение “Created”, а флаг Model.TransactionIsInProcess становится равен true.\u003c/p>\u003cp>При завершении обработки выплаты статус транзакции будет изменен на терминальный и отправлено \u003cstrong>webhook-уведомление\u003c/strong> с финальным статусом:\u003c/p>\u003cdiv class=\"api-table-scroll\" tabindex=\"0\" aria-label=\"Таблица\">\u003ctable>\u003ctr>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Статус\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Тип уведомления\u003c/p>\u003c/th>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Completed\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>PAY, \u003ca href=\"https://developers.cloudpayments.ru/#pay\" target=\"_blank\" rel=\"noopener noreferrer\">Документация CloudPayments\u003c/a>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Failed\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>FAIL, \u003ca href=\"https://developers.cloudpayments.ru/#fail\" target=\"_blank\" rel=\"noopener noreferrer\">Документация CloudPayments\u003c/a>\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cp>В редких случаях процесс обработки запроса на выплату может занимать до 60 минут\u003c/p>\u003ch2 id=\"vyplata-po-tokenu\">\u003cstrong>Выплата по токену\u003c/strong>\u003c/h2>\u003cp>Выплату по токену можно осуществить через вызов метода API.\u003c/p>\u003cp>Выплаты по токену можно сделать только по токену, который получили при оплате по карте.\u003c/p>\u003cp>Токены TPay, Sbp и другие токены, полученные на иных способах оплаты, не подходят для выплат по токену.\u003c/p>\u003cp>\u003cstrong>Адрес метода:\u003c/strong>\u003cbr>https://api.cloudpayments.ru/payments/token/topup\u003c/p>\u003cp>\u003cstrong>Параметры запроса:\u003c/strong>\u003c/p>\u003cdiv class=\"api-table-scroll\" tabindex=\"0\" aria-label=\"Таблица\">\u003ctable>\u003ctr>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Параметр\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Формат\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Применение\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Описание\u003c/p>\u003c/th>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Token\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Токен карты, выданный системой после первого платежа\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Amount\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Number\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Cумма платежа в валюте, разделитель точка. Количество не нулевых знаков после точки – 2\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>AccountId\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Идентификатор пользователя\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Currency\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Валюта: RUB\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>InvoiceId\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Номер заказа в вашей системе\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Payer\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Object\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Доп. поле, куда передается информация о плательщике\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Receiver\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Object\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Доп. поле, куда передается информация о получателе\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cp>Для выплат на иностранные карты понадобится параметр Payer или Receiver в зависимости от терминала.\u003c/p>\u003cp>\u003cstrong>Пример запроса:\u003c/strong>\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>text\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-21\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-21\" class=\"language-text\">{\n    &quot;Token&quot;:&quot;0a0afb77-8f41-4de2-9524-1057f9695303&quot;,\n    &quot;Amount&quot;:59,\n    &quot;AccountId&quot;:&quot;user_x&quot;,\n    &quot;Currency&quot;:&quot;RUB&quot;,\n    &quot;Payer&quot;:\n    //Набор полей аналогичен и для параметра Receiver\n      { \n        &quot;FirstName&quot;:&quot;Тест&quot;,\n        &quot;LastName&quot;:&quot;Тестов&quot;,\n        &quot;MiddleName&quot;:&quot;Тестович&quot;,\n        &quot;Address&quot;:&quot;тестовый проезд дом тест&quot;,\n        &quot;Birth&quot;:&quot;1955-02-24&quot;,\n        &quot;City&quot;:&quot;MO&quot;,\n        &quot;Country&quot;:&quot;RU&quot;,\n        &quot;Phone&quot;:&quot;+71234567890&quot;,\n        &quot;Postcode&quot;:&quot;345&quot;\n    }\n}\n\u003c/code>\u003c/pre>\u003c/div>\u003cp>\u003cstrong>Пример ответа:\u003c/strong>\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>text\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-22\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-22\" class=\"language-text\"> {\n    &quot;Model&quot;: {\n        &quot;ReasonCode&quot;: 0,\n        &quot;PublicId&quot;: &quot;pk_******************************&quot;,\n        &quot;TerminalUrl&quot;: &quot;http://test.test&quot;,\n        &quot;TransactionId&quot;: 897747761,\n        &quot;Amount&quot;: 59,\n        &quot;Currency&quot;: &quot;RUB&quot;,\n        &quot;CurrencyCode&quot;: 0,\n        &quot;PaymentAmount&quot;: 59,\n        &quot;PaymentCurrency&quot;: &quot;RUB&quot;,\n        &quot;PaymentCurrencyCode&quot;: 0,\n        &quot;InvoiceId&quot;: null,\n        &quot;AccountId&quot;: &quot;user_x&quot;,\n        &quot;Email&quot;: null,\n        &quot;Description&quot;: null,\n        &quot;JsonData&quot;: null,\n        &quot;CreatedDate&quot;: &quot;/Date(1635566071122)/&quot;,\n        &quot;PayoutDate&quot;: null,\n        &quot;PayoutDateIso&quot;: null,\n        &quot;PayoutAmount&quot;: null,\n        &quot;CreatedDateIso&quot;: &quot;2021-10-30T03:54:31&quot;,\n        &quot;AuthDate&quot;: &quot;/Date(1635566071232)/&quot;,\n        &quot;AuthDateIso&quot;: &quot;2021-10-30T03:54:31&quot;,\n        &quot;ConfirmDate&quot;: &quot;/Date(1635566071232)/&quot;,\n        &quot;ConfirmDateIso&quot;: &quot;2021-10-30T03:54:31&quot;,\n        &quot;AuthCode&quot;: &quot;A1B2C3&quot;,\n        &quot;TestMode&quot;: true,\n        &quot;Rrn&quot;: null,\n        &quot;OriginalTransactionId&quot;: null,\n        &quot;FallBackScenarioDeclinedTransactionId&quot;: null,\n        &quot;IpAddress&quot;: &quot;172.18.200.124&quot;,\n        &quot;IpCountry&quot;: &quot;&quot;,\n        &quot;IpCity&quot;: null,\n        &quot;IpRegion&quot;: null,\n        &quot;IpDistrict&quot;: null,\n        &quot;IpLatitude&quot;: null,\n        &quot;IpLongitude&quot;: null,\n        &quot;CardFirstSix&quot;: &quot;411111&quot;,\n        &quot;CardLastFour&quot;: &quot;1111&quot;,\n        &quot;CardExpDate&quot;: &quot;11/25&quot;,\n        &quot;CardType&quot;: &quot;Visa&quot;,\n        &quot;CardProduct&quot;: &quot;C&quot;,\n        &quot;CardCategory&quot;: &quot;Visa Signature Signature&quot;,\n        &quot;EscrowAccumulationId&quot;: null,\n        &quot;IssuerBankCountry&quot;: &quot;RU&quot;,\n        &quot;Issuer&quot;: &quot;CloudPayments&quot;,\n        &quot;CardTypeCode&quot;: 0,\n        &quot;Status&quot;: &quot;Completed&quot;,\n        &quot;StatusCode&quot;: 3,\n        &quot;CultureName&quot;: &quot;ru&quot;,\n        &quot;Reason&quot;: &quot;Approved&quot;,\n        &quot;CardHolderMessage&quot;: &quot;Оплата успешно проведена&quot;,\n        &quot;Type&quot;: 2,\n        &quot;Refunded&quot;: false,\n        &quot;Name&quot;: &quot;CARDHOLDER NAME&quot;,\n        &quot;Token&quot;: &quot;0a0afb77-8f41-4de2-9524-1057f9695303&quot;,\n        &quot;SubscriptionId&quot;: null,\n        &quot;GatewayName&quot;: &quot;Test&quot;,\n        &quot;AndroidPay&quot;: false,\n        &quot;WalletType&quot;: &quot;&quot;,\n        &quot;TotalFee&quot;: 0\n    },\n    &quot;Success&quot;: true,\n    &quot;Message&quot;: null\n}\n\u003c/code>\u003c/pre>\u003c/div>\u003cp>Можно воспользоваться механизмом надежной аутентификации запроса на выплату. Для этого передайте в нашу поддержку сертификат с публичной частью ключа. Далее сгенерируйте подпись на основе тела запроса и разместите ее в заголовке X-Signature в base64 формате. CloudPayments проверит вашу подпись, используя CryptoService. Если подпись валидна, то обработка запроса продолжится, если нет — обработка прекратится.\u003c/p>\u003ch2 id=\"vyplata-po-sbp\">\u003cstrong>Выплата по СБП\u003c/strong>\u003c/h2>\u003cp>Выплату по СБП можно осуществить через вызов метода API.\u003c/p>\u003cp>\u003cstrong>Адрес метода:\u003c/strong>\u003cbr>https://api.cloudpayments.ru/payments/alt/topup\u003c/p>\u003cp>\u003cstrong>Параметры запроса:\u003c/strong>\u003c/p>\u003cdiv class=\"api-table-scroll\" tabindex=\"0\" aria-label=\"Таблица\">\u003ctable>\u003ctr>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Параметр\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Формат\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Применение\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Описание\u003c/p>\u003c/th>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>MemberId\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Идентификатор банка получателя НПСК для СБП\u003cbr>Если в запросе поле \u003ccode>Receiver.Phone\u003c/code> заполнено, то \u003ccode>MemberId\u003c/code> обязательное\u003cbr>Допустимые значения для \u003ccode>MemberId\u003c/code> можно найти по \u003ca href=\"https://qr.nspk.ru/proxyapp/c2bmembers.json\" target=\"_blank\" rel=\"noopener noreferrer\">ссылке\u003c/a>. Значение из поля \u003ccode>schema\u003c/code> в поле \u003ccode>MemberId\u003c/code> надо передать только цифровое значение из поля \u003ccode>schema\u003c/code>\u003cbr>Например, для \u003ccode>schema:bank100000000111\u003c/code> передать \u003ccode>MemberId:100000000111\u003c/code>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Amount\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Number\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Cумма платежа в валюте, разделитель точка. Количество не нулевых знаков после точки – 2\u003c/p>\ u003cp>InvoiceId\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Номер заказа\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cp>Если платеж по указанному номеру заказа был найден, система отобразит либо информацию об \u003ca href=\"https://developers.cloudpayments.ru/#sample-approved\" target=\"_blank\" rel=\"noopener noreferrer\">успешной транзакции\u003c/a>, либо — \u003ca href=\"https://developers.cloudpayments.ru/#sample-declined\" target=\"_blank\" rel=\"noopener noreferrer\">об отклоненной\u003c/a>. Если будет найдено несколько платежей с указанным номером заказа, то система вернет информацию только о последней операции. Отличие нового метода в том, что он ищет по всем платежам, включая возвраты и выплаты на карту.\u003c/p>\u003cp>\u003cstrong>Пример запроса:\u003c/strong>\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>text\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-27\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-27\" class=\"language-text\">{&quot;InvoiceId&quot;:&quot;123456789&quot;}\n\u003c/code>\u003c/pre>\u003c/div>\u003cp>\u003cstrong>Пример ответа:\u003c/strong>\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>text\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-28\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-28\" class=\"language-text\">{&quot;Success&quot;:false,&quot;Message&quot;:&quot;Not found&quot;}\n\u003c/code>\u003c/pre>\u003c/div>\u003cp>Проверка статуса платежа является избыточной и имеет смысл только в случае, если при проведении оплаты возник сбой, который привел к потере информации.\u003c/p>\u003ch2 id=\"vygruzka-spiska-tranzaktsiy\">\u003cstrong>Выгрузка списка транзакций\u003c/strong>\u003c/h2>\u003cp>Метод выгрузки списка транзакций за день.\u003c/p>\u003cp>\u003cstrong>Адрес метода:\u003c/strong>\u003cbr>https://api.cloudpayments.ru/payments/list\u003c/p>\u003cp>\u003cstrong>Параметры запроса:\u003c/strong>\u003c/p>\u003cdiv class=\"api-table-scroll\" tabindex=\"0\" aria-label=\"Таблица\">\u003ctable>\u003ctr>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Параметр\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Формат\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Применение\u003c/p>\u003c/th>\u003cth colspan=\
