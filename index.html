 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-4\" class=\"language-json\">{\n  &quot;PublicTerminalId&quot;: &quot;pk_1234567890abcdef&quot;,\n  &quot;Platform&quot;: &quot;ios&quot;\n}\u003c/code>\u003c/pre>\u003c/div>\u003cp>\u003cbr>\u003c/p>\u003cp>\u003cstrong>Параметры ответа\u003c/strong>\u003c/p>\u003cdiv class=\"api-table-scroll\" tabindex=\"0\" aria-label=\"Таблица\">\u003ctable style=\"table-layout:fixed;width:913px;min-width:0\">\u003ccolgroup>\u003ccol style=\"width:201px\">\u003ccol style=\"width:154px\">\u003ccol style=\"width:558px\">\u003c/colgroup>\u003ctr>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Параметр\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Тип\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Назначение\u003c/p>\u003c/th>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Success\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>boolean\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Флаг успешности выполнения запроса\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Message\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Сообщение об ошибке (null при успехе)\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Model\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>List\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Список данных об участниках СБП\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Model.Source\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Источник данных\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Model.Version\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Версия спецификации ответа\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Model.Members\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>List\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Список участников СБП\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Model.Members.Id\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Уникальный идентификатор члена СБП\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Model.Members.Name\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Полное название банка/члена СБП\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Model.Members.Logo\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>URL логотипа банка\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Model.Members.Url\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>URL для перехода в приложение или веб-версию банка\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Пример ответа \u003c/strong>\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>json\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-5\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-5\" class=\"language-json\">{\n  &quot;Success&quot;: true,\n  &quot;Message&quot;: null,\n  &quot;Model&quot;: [\n    {\n      &quot;Source&quot;: &quot;widget&quot;,\n      &quot;Version&quot;: &quot;2.0&quot;,\n      &quot;Members&quot;: [\n        {\n          &quot;id&quot;: &quot;100000000111&quot;,\n          &quot;logo&quot;: &quot;https://qr.nspk.ru/proxyapp/logo/bank100000000111.png&quot;,\n          &quot;name&quot;: &quot;Сбербанк&quot;,\n          &quot;url&quot;: &quot;bank100000000111://qr.nspk.ru/{QRC_ID}{QUERY_STRING}&quot;\n        },\n        {\n          &quot;id&quot;: &quot;100000000004&quot;,\n          &quot;logo&quot;: &quot;https://qr.nspk.ru/proxyapp/logo/bank100000000004.png&quot;,\n          &quot;name&quot;: &quot;Т-Банк&quot;,\n          &quot;url&quot;: &quot;https://www.tinkoff.ru/mybank/payments/qr-pay/{QRC_ID}{QUERY_STRING}&quot;\n        },\n        {\n          &quot;id&quot;: &quot;100000000005&quot;,\n          &quot;logo&quot;: &quot;https://qr.nspk.ru/proxyapp/logo/bank100000000005.png&quot;,\n          &quot;name&quot;: &quot;Банк ВТБ&quot;,\n          &quot;url&quot;: &quot;https://online.vtb.ru/i/paymentSbp/{QRC_ID}{QUERY_STRING}&quot;\n        }\n      ]\n    }\n  ]\n}\u003c/code>\u003c/pre>\u003c/div>\u003ch2 id=\"возврат\">Возврат\u003c/h2>\u003cp>Метод возврата по операциям СБП аналогичен методу возврата ДС по операциям интернет-эквайринга - \u003ca href=\"https://developers.cloudpayments.ru/#vozvrat-deneg\" target=\"_blank\" rel=\"noopener noreferrer\">см. API. Возврат денег\u003c/a>.\u003c/p>\u003cp>Возвраты СБП работают в асинхронном режиме. Финальный статус возврата СБП (“Завершен”/“Отклонен”) можно получить через \u003ca href=\"https://developers.cloudpayments.ru/#refund\" target=\"_blank\" rel=\"noopener noreferrer\">Refund\u003c/a>-уведомление уже после создания транзакции возврата, а не в ответе на сам запрос возврата.\u003c/p>\u003ch2 id=\"уведомления\">Уведомления\u003c/h2>\u003cp>Уведомления по операциям СБП аналогичны уведомлениям по операциям интернет-эквайринга - \u003ca href=\"https://developers.cloudpayments.ru/#uvedomleniya\" target=\"_blank\" rel=\"noopener noreferrer\">см. Уведомления\u003c/a>\u003c/p>\u003cp>Параметр, отвечающий за тип операции в уведомлении – \u003ccode>PaymentMethod\u003c/code> (для СБП указано значение \u003ccode>Sbp\u003c/code>)\u003c/p>\u003cp>Если включены Check-уведомления, то Check будет направляться до формирования QR/ссылки для проверки корректности данных.\u003c/p>\u003ch2 id=\"создание-прямой-ссылки-и-списка-банков\">Создание прямой ссылки и списка банков\u003c/h2>\u003cp>Прямая ссылка существует для того, чтобы перенаправить плательщика при клике на ссылку в конкретное приложение банка.\u003c/p>\u003cp>Список банков можно получить из массива элементов в ответе \u003ca href=\"https://developers.cloudpayments.ru/#spisok-uchastnikov-sbp\" target=\"_blank\" rel=\"noopener noreferrer\">POST: /sbp/v2/banks/info\u003c/a> в параметре \u003ccode>Model.Members\u003c/code>\u003c/p>\u003cp>CloudPayments использует список участников из \u003ca href=\"https://widget.cbrpay.ru/#membersListV2\" target=\"_blank\" rel=\"noopener noreferrer\">API виджета СБП\u003c/a>.\u003c/p>\u003ch3 id=\"trebovaniya-sbp\">\u003cstrong>Требования СБП\u003c/strong>\u003c/h3>\u003cp>\u003cstrong>Нельзя изменять:\u003c/strong>\u003c/p>\u003col start=\"1\">\u003cli>\u003cp>\u003cstrong>Порядок банков\u003c/strong> — сохранение оригинального порядка реализовано на стороне CloudPayments;\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>Названия и логотипы\u003c/strong>;\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>Ссылки для перехода в банковские приложения\u003c/strong>.\u003c/p>\u003c/li>\u003c/ol>\u003cp>\u003cstrong>Обязательно:\u003c/strong>\u003c/p>\u003col start=\"1\">\u003cli>\u003cp>Сохранять функцию поиска по банкам;\u003c/p>\u003c/li>\u003cli>\u003cp>Для кэшированных данных (реализовано на стороне CloudPayments):\u003c/p>\u003cul>\u003cli>\u003cp>Использовать только актуальные данные (≤ 24 часов);\u003c/p>\u003c/li>\u003cli>\u003cp>При ошибке запроса — брать последние рабочие данные.\u003c/p>\u003c/li>\u003c/ul>\u003c/li>\u003c/ol>\u003cp>\u003cstrong>Разрешено:\u003c/strong>\u003c/p>\u003cul>\u003cli>\u003cp>Показывать первыми 3 банка, которые клиент выбирал ранее.\u003c/p>\u003c/li>\u003c/ul>\u003ch3 id=\"trebovaniya-k-otobrazheniyu-spiska-bankov-sbp\">\u003cstrong>Требования к отображению списка банков СБП\u003c/strong>\u003c/h3>\u003cp>\u003cstrong>Порядок элементов списка\u003c/strong>\u003c/p>\u003col start=\"1\">\u003cli>\u003cp>Элементы на странице списка должны быть расположены строго в порядке, полученном в ответе на запрос \u003ca href=\"https://developers.cloudpayments.ru/#spisok-uchastnikov-sbp\" target=\"_blank\" rel=\"noopener noreferrer\">POST /sbp/v2/banks/info\u003c/a>.\u003c/p>\u003c/li>\u003cli>\u003cp>Исключение:\u003c/p>\u003cul>\u003cli>\u003cp>Ранее выбранные банки (не более 3) могут отображаться в начале списка.\u003c/p>\u003c/li>\u003cli>\u003cp>Остальные банки следуют в исходном порядке, за исключением уже добавленных в начало.\u003c/p>\u003c/li>\u003c/ul>\u003c/li>\u003c/ol>\u003cp>\u003cstrong>Логотип\u003c/strong>\u003c/p>\u003cp>Логотип банка должен быть взят из ответа \u003ca href=\"https://developers.cloudpayments.ru/#spisok-uchastnikov-sbp\" target=\"_blank\" rel=\"noopener noreferrer\">POST /sbp/v2/banks/info\u003c/a>, параметр - \u003ccode>Model.Members.logo\u003c/code>\u003c/p>\u003cp>\u003cstrong>Название\u003c/strong>\u003c/p>\u003cp>Название банка должно быть взято из ответа \u003ca href=\"https://developers.cloudpayments.ru/#spisok-uchastnikov-sbp\" target=\"_blank\" rel=\"noopener noreferrer\">POST /sbp/v2/banks/info\u003c/a>, параметр - \u003ccode>Model.Members.Name\u003c/code>\u003c/p>\u003cp>\u003cstrong>Ссылка для перехода в приложение банка\u003c/strong>\u003c/p>\u003cp>Для формирования прямой ссылки на переход в приложение банка необходимо выполнить следующие шаги:\u003c/p>\u003col start=\"1\">\u003cli>\u003cp>Получить ссылку на оплату из ответа \u003ca href=\"https://developers.cloudpayments.ru/#sbp-poluchenie-ssylki-dlya-oplaty\" target=\"_blank\" rel=\"noopener noreferrer\">POST /payments/qr/sbp/link\u003c/a>, параметр - \u003ccode>Model.QrUrl\u003c/code>;\u003c/p>\u003c/li>\u003cli>\u003cp>Получить шаблон ссылки на банк из ответа \u003ca href=\"https://developers.cloudpayments.ru/#spisok-uchastnikov-sbp\" target=\"_blank\" rel=\"noopener noreferrer\">POST /sbp/v2/banks/info\u003c/a>, параметр - \u003ccode>Model.Members.url\u003c/code>;\u003c/p>\u003c/li>\u003cli>\u003cp>Обработать шаблон ссылки:\u003c/p>\u003cul>\u003cli>\u003cp>Удалить из шаблона последний элемент пути: \u003ccode>{QRC_ID}{QUERY_STRING}\u003c/code>;\u003c/p>\u003c/li>\u003c/ul>\u003c/li>\u003cli>\u003cp>Сформировать итоговую ссылку:\u003c/p>\u003cul>\u003cli>\u003cp>К оставшейся части шаблона конкатенировать путь и query-параметры из ссылки на оплату;\u003c/p>\u003c/li>\u003c/ul>\u003c/li>\u003c/ol>\u003cp>\u003cstrong>Пример преобразования:\u003c/strong>\u003c/p>\u003col start=\"1\">\u003cli>\u003cp>Ссылка на оплату: \u003ccode>https://qr.nspk.ru/AD1000XXXXX1000?type=02&amp;bank=100000000004&amp;sum=1299900&amp;cur=RUB&amp;crc=8DA8\u003c/code>\u003c/p>\u003c/li>\u003cli>\u003cp>Шаблон ссылки: \u003ccode>https://online.vtb.ru/i/paymentSbp/{QRC_ID}{QUERY_STRING}\u003c/code>\u003c/p>\u003c/li>\u003cli>\u003cp>Результат: \u003ccode>https://online.vtb.ru/i/paymentSbp/AD1000XXXXX1000?type=02&amp;bank=100000000004&amp;sum=1299900&amp;cur=RUB&amp;crc=8DA8\u003c/code>\u003c/p>\u003c/li>\u003c/ol>\u003cp>\u003cbr>\u003c/p>\u003c/div>","toc":[{"id":"получение-ссылки-для-оплаты","title":"Получение ссылки для оплаты","level":2},{"id":"opisanie","title":"Описание","level":3},{"id":"adres-metoda","title":"Адрес метода","level":3},{"id":"sbp-parametry-zaprosa","title":"Параметры запроса","level":3},{"id":"sbp-primer-zaprosa","title":"Пример запроса","level":3},{"id":"primer-otveta","title":"Пример ответа","level":3},{"id":"получение-qr-кода-для-оплаты","title":"Получение QR-кода для оплаты","level":2},{"id":"spisok-uchastnikov-sbp","title":"Список участников СБП","level":2},{"id":"возврат","title":"Возврат","level":2},{"id":"уведомления","title":"Уведомления","level":2},{"id":"создание-прямой-ссылки-и-списка-банков","title":"Создание прямой ссылки и списка банков","level":2},{"id":"trebovaniya-sbp","title":"Требования СБП","level":3},{"id":"trebovaniya-k-otobrazheniyu-spiska-bankov-sbp","title":"Требования к отображению списка банков СБП","level":3}]},"tech/methods/digital":{"id":"tech/methods/digital","title":"Цифровой рубль","group":"tech","html":"\u003cdiv class=\"imported-api\">\u003cfigure style=\"text-align:center\">\u003cimg src=\"static/img/editor/e61c524d59d7162b27d3557a285330a6bfba63de9309ffccb95c423d7bfb9345.jpg\" alt=\"ЦР.jpg\" style=\"width:100%;max-width:100%;height:auto\">\u003c/figure>\u003ch2 id=\"прием-цифровых-рублей-с-1-сентября-2026-года\">Прием цифровых рублей с 1 сентября 2026 года\u003c/h2>\u003cp>Цифровой рубль — цифровая форма российской национальной валюты, которую выпускает Банк России. Он равен наличному рублю и используется для платежей через платформу Банка России.\u003c/p>\u003ch2 id=\"на-кого-распространяются-требования\">На кого распространяются требования\u003c/h2>\u003cp>С 1 сентября 2026 года принимать цифровые рубли должны будут продавцы и исполнители, которые одновременно:\u003c/p>\u003cul>\u003cli>\u003cp>Получили за предыдущий год выручку более 120 млн рублей\u003c/p>\u003c/li>\u003cli>\u003cp>Работают с банком, признанным значимым на рынке платежных услуг\u003c/p>\u003c/li>\u003cli>\u003cp>Принимают оплату от физических лиц\u003c/p>\u003c/li>\u003c/ul>\u003ch2 id=\"как-будут-расширяться-требования\">Как будут расширяться требования\u003c/h2>\u003cp>С 1 сентября 2027 года требования распространятся на компании с выручкой более 30 млн рублей, а с 1 сентября 2028 года — на остальных продавцов с выручкой от 20 млн рублей.\u003c/p>\u003ch2 id=\"на-кого-требования-не-распространяются\">На кого требования не распространяются\u003c/h2>\u003cp>Компании с совокупной годовой выручкой менее 20 млн рублей не обязаны принимать цифровые рубли.\u003c/p>\u003cp>Требование также не распространяется:\u003c/p>\u003cul>\u003cli>\u003cp>На отдельные торговые точки с выручкой менее 5 млн рублей в год, даже если совокупная выручка всей компании превышает 20 млн рублей\u003c/p>\u003c/li>\u003cli>\u003cp>На точки продаж без доступа к интернету\u003c/p>\u003c/li>\u003c/ul>\u003ch2 id=\"прием-цифровых-рублей-в-cloudpayments\">Прием цифровых рублей в CloudPayments\u003c/h2>\u003cp>CloudPayments планирует запустить прием разовых платежей в цифровых рублях с 1 сентября 2026 года. Операции будут отображаться в Личном кабинете и включаться в реестры и отчетность.\u003c/p>\u003cp>До конца 2026 года комиссия за прием платежей в цифровых рублях составит 0%. Регулярные платежи и сохранение счета для повторных оплат на старте поддерживаться не будут.\u003c/p>\u003ch2 id=\"как-подключить\">Как подключить\u003c/h2>\u003cp>Если вы уже принимаете платежи через CloudPayments, обратитесь к своему менеджеру или напишите в чат поддержки в Личном кабинете.\u003c/p>\u003cp>Если вы еще не работаете с CloudPayments, оставьте \u003ca href=\"https://cloudpayments.ru/#section-request\" target=\"_blank\" rel=\"noopener noreferrer\">заявку на подключение\u003c/a>.\u003c/p>\u003cp>Документацию по интеграции мы предоставим действующим клиентам по запросу, а новым — после подключения.\u003c/p>\u003cp>\u003cbr>\u003c/p>\u003c/div>","toc":[{"id":"прием-цифровых-рублей-с-1-сентября-2026-года","title":"Прием цифровых рублей с 1 сентября 2026 года","level":2},{"id":"на-кого-распространяются-требования","title":"На кого распространяются требования","level":2},{"id":"как-будут-расширяться-требования","title":"Как будут расширяться требования","level":2},{"id":"на-кого-требования-не-распространяются","title":"На кого требования не распространяются","level":2},{"id":"прием-цифровых-рублей-в-cloudpayments","title":"Прием цифровых рублей в CloudPayments","level":2},{"id":"как-подключить","title":"Как подключить","level":2}]},"tech/methods/sberpay":{"id":"tech/methods/sberpay","title":"СберПэй","group":"tech","html":"\u003cdiv class=\"imported-api\">\u003cfigure style=\"text-align:center\">\u003cimg src=\"static/img/editor/b4a7c45430e3a369c46c6a966f104fa46328ebbe18b335ac60a24a8b18286259.png\" alt=\"sberpay.png\" style=\"width:100%;max-width:100%;height:auto\">\u003c/figure>\u003cp>CloudPayments предлагает метод оплаты в один клик через SberPay. Покупатель может выбрать любой счет для списания в приложении Сбера, а также копить баллы «Спасибо» для последующих покупок.\u003c/p>\u003ch2 id=\"получение-ссылки-для-оплаты\">Получение ссылки для оплаты\u003c/h2>\u003ch3 id=\"opisanie\">\u003cstrong>Описание\u003c/strong>\u003c/h3>\u003cp>Метод для проведения оплаты по SberPay.\u003cbr>При оплате с мобильного устройства в ответе вернётся параметр \u003ccode>QrUrl\u003c/code> с URL-адресом для перенаправления клиента. Для проведения платежа клиента надо перенаправить на полученный URL-адрес.\u003cbr>При оплате с десктопа на номер телефона, который указан в параметре запроса \u003ccode>Phone\u003c/code>, будет отправлен push либо SMS-сообщение со ссылкой на оплату.\u003c/p>\u003cp>Авторизация \u003ca href=\"https://en.wikipedia.org/wiki/Basic_access_authentication\" target=\"_blank\" rel=\"noopener noreferrer\">HTTP Basic Auth\u003c/a> для данного метода не требуется. Вместо неё используется параметр идентификатора терминала \u003ccode>PublicId\u003c/code> в теле запроса.\u003c/p>\u003ch3 id=\"adres-metoda\">\u003cstrong>Адрес метода\u003c/strong>\u003c/h3>\u003cp>\u003ca href=\"https://api.cloudpayments.ru/payments/qr/sberpay/link\" target=\"_blank\" rel=\"noopener noreferrer\">https://api.cloudpayments.ru/payments/qr/sberpay/link\u003c/a>\u003c/p>\u003ch3 id=\"sberpay-parametry-zaprosa\">\u003cstrong>Параметры запроса\u003c/strong>\u003c/h3>\u003cdiv class=\"api-table-scroll\" tabindex=\"0\" aria-label=\"Таблица\">\u003ctable style=\"table-layout:fixed;width:849px;min-width:0\">\u003ccolgroup>\u003ccol style=\"width:195px\">\u003ccol style=\"width:101px\">\u003ccol style=\"width:160px\">\u003ccol style=\"width:393px\">\u003c/colgroup>\u003ctr>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Параметр\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Формат\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Применение\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Описание\u003c/p>\u003c/th>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>PublicId\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Идентификатор сайта, который находится в ЛК\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Amount\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Decimal\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Cумма платежа в рублях, разделитель точка. Количество не нулевых знаков после точки – 2\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Currency\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Валюта: RUB (см. \u003ca href=\"https://developers.cloudpayments.ru/#spisok-valyut\" target=\"_blank\" rel=\"noopener noreferrer\">справочник\u003c/a>)\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Description\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Назначение платежа в свободной форме\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>AccountId\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Идентификатор пользователя, используется для создания подписки и получения токена\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Email\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>E-mail плательщика, на который будет отправлена квитанция об оплате\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>JsonData\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Json\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Любые другие данные, которые будут связаны с транзакцией, в том числе \u003ca href=\"https://developers.cloudpayments.ru/#rekurrentnye-platezhi-podpiska\" target=\"_blank\" rel=\"noopener noreferrer\">инструкции\u003c/a> для создания подписки или формирования \u003ca href=\"https://developers.cloudpayments.ru/#format-peredachi-dannyh-dlya-onlayn-cheka\" target=\"_blank\" rel=\"noopener noreferrer\">онлайн-чека\u003c/a> должны обёртываться в объект \u003ccode>cloudpayments\u003c/code>. Мы зарезервировали названия следующих параметров и отображаем их содержимое в реестре операций, выгружаемом в Личном Кабинете: \u003ccode>name\u003c/code>, \u003ccode>firstName\u003c/code>, \u003ccode>middleName\u003c/code>, \u003ccode>lastName\u003c/code>, \u003ccode>nick\u003c/code>, \u003ccode>phone\u003c/code>, \u003ccode>address\u003c/code>, \u003ccode>comment\u003c/code>, \u003ccode>birthDate\u003c/code>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>InvoiceId\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Идентификатор/номер счета.\u003cbr>\u003cbr>Приходит в Check-уведомлении и может использоваться для сверки номера заказа\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Scheme\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Enum String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Схема проведения платежа (см. \u003ca href=\"https://developers.cloudpayments.ru/#vidy-operatsiy\" target=\"_blank\" rel=\"noopener noreferrer\">Виды операций\u003c/a>).\u003cbr>Возможные значения: \u003ccode>charge\u003c/code> - одностадийная оплата; \u003ccode>auth\u003c/code> - двухстадийная оплата\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>SuccessRedirectUrl\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Url для перенаправления клиента после успешной оплаты.\u003cbr>После проведения платежа, клиент будет перенаправлен на указанный адрес из мобильного приложения Банка.\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>IpAddress\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>IP-адрес плательщика\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Os\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Операционная система устройства плательщика.\u003cbr>Пример значения: \u003ccode>Android\u003c/code>, \u003ccode>iOS\u003c/code>, \u003ccode>Windows\u003c/code>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Webview\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Bool\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Признак открытия браузера в режиме webview.\u003cbr>Возможные значения: \u003ccode>true\u003c/code> - для оплат через webview \u003ccode>false\u003c/code> - для оплат без webview\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Device\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Признак устройства плательщика.\u003cbr>Возможные значения:\u003cbr>\u003ccode>MobileApp\u003c/code> - вызов оплаты из мобильного приложения\u003cbr>\u003ccode>DesktopWeb\u003c/code> - вызов оплаты из браузера с десктопа\u003cbr>\u003ccode>Mobile\u003c/code> - вызов из браузера с мобильного устройства\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Phone\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Номер телефона плательщика.\u003cbr>Пример значения: \u003ccode>+79001234567\u003c/code>\u003cbr>Обязательное значение для оплаты из браузера с десктопа\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Browser\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Название браузера клиента на основании userAgent браузера.\u003cbr>Пример значения: \u003ccode>Chrome\u003c/code>, \u003ccode>Firefox\u003c/code>, \u003ccode>MIUI Browser\u003c/code>, \u003ccode>Opera\u003c/code>\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cp>В ответ сервер возвращает JSON с тремя составляющими:\u003c/p>\u003cul>\u003cli>\u003cp>поле \u003cstrong>success\u003c/strong> — результат запроса;\u003c/p>\u003c/li>\u003cli>\u003cp>поле \u003cstrong>message\u003c/strong> — описание ошибки;\u003c/p>\u003c/li>\u003cli>\u003cp>объект \u003cstrong>model\u003c/strong> — расширенная информация.\u003c/p>\u003c/li>\u003c/ul>\u003cp>Возможные варианты ответа:\u003c/p>\u003col start=\"1\">\u003cli>\u003cp>Некорректно сформирован запрос:\u003c/p>\u003cul>\u003cli>\u003cp>\u003cstrong>success\u003c/strong> — false\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>message\u003c/strong> — описание ошибки\u003c/p>\u003c/li>\u003c/ul>\u003c/li>\u003cli>\u003cp>Транзакция отклонена:\u003c/p>\u003cul>\u003cli>\u003cp>\u003cstrong>success\u003c/strong> — false\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>model\u003c/strong> — информация о транзакции и код ошибки\u003c/p>\u003c/li>\u003c/ul>\u003c/li>\u003cli>\u003cp>Транзакция принята:\u003c/p>\u003cul>\u003cli>\u003cp>\u003cstrong>success\u003c/strong> — true\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>model\u003c/strong> — информация о транзакции\u003c/p>\u003c/li>\u003c/ul>\u003c/li>\u003c/ol>\u003caside class=\"api-callout \" role=\"note\">\u003cstrong class=\"callout-label\">Информация\u003c/strong>\u003cp>Результат запроса (поле Success) не отражает статус транзакции, а лишь свидетельствует об успешности/неуспешности запроса API. Статус транзакции отражен в дополнительном поле Status, также его можно узнать в результате получения \u003ca href=\"https://developers.cloudpayments.ru/#uvedomleniya\" target=\"_blank\" rel=\"noopener noreferrer\">уведомлений\u003c/a>. Интерпретацию статусов транзакции смотрите в \u003ca href=\"https://developers.cloudpayments.ru/#statusy-operatsiy\" target=\"_blank\" rel=\"noopener noreferrer\">справочнике\u003c/a>.\u003c/p>\u003c/aside>\u003ch3 id=\"sberpay-primer-zaprosa\">\u003cstrong>Пример запроса\u003c/strong>\u003c/h3>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>json\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-1\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-1\" class=\"language-json\">{\n    &quot;PublicId&quot;: &quot;test_api_00000000000000000000002&quot;,\n    &quot;Os&quot; : &quot;Windows 7 home&quot;,\n    &quot;Webview&quot; : true,\n    &quot;Browser&quot; : &quot;Microsoft Edge 24.101&quot;,\n    &quot;Amount&quot;: 1000,\n    &quot;Currency&quot;: &quot;RUB&quot;,\n    &quot;Description&quot;: &quot;Оплата по SberPay&quot;,\n    &quot;AccountId&quot;: &quot;email@email.com&quot;,\n    &quot;Email&quot;: &quot;email@email.com&quot;,\n    &quot;InvoiceId&quot;: &quot;order_no4009&quot;,\n    &quot;Scheme&quot;: &quot;charge&quot;,\n    &quot;Device&quot;: &quot;DesktopWeb&quot;,\n    &quot;Phone&quot;: &quot;79001234567&quot;,\n    &quot;SuccessRedirectUrl&quot;: &quot;https://cp.ru&quot;,\n}\u003c/code>\u003c/pre>\u003c/div>\u003cp>\u003cbr>\u003c/p>\u003ch3 id=\"primer-otveta\">\u003cstrong>Пример ответа\u003c/strong>\u003c/h3>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>json\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-2\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-2\" class=\"language-json\">{\n    &quot;Model&quot;: {\n        &quot;QrUrl&quot;: &quot;sberpay://invoicing/v2?bankInvoiceId=5628ecb3ef514a48abed24e16f818f03&amp;operationType=Web2App&quot;, // будет содержать url-адрес для редиректа\n        &quot;QrImage&quot;: null,                \n        &quot;TransactionId&quot;: 11122233344, // id транзакции CloudPayments\n        &quot;Amount&quot;: 10\n    },\n    &quot;Success&quot;: true,\n    &quot;Message&quot;: null\n}\u003c/code>\u003c/pre>\u003c/div>\u003cp>\u003cbr>\u003c/p>\u003c/div>","toc":[{"id":"получение-ссылки-для-оплаты","title":"Получение ссылки для оплаты","level":2},{"id":"opisanie","title":"Описание","level":3},{"id":"adres-metoda","title":"Адрес метода","level":3},{"id":"sberpay-parametry-zaprosa","title":"Параметры запроса","level":3},{"id":"sberpay-primer-zaprosa","title":"Пример запроса","level":3},{"id":"primer-otveta","title":"Пример ответа","level":3}]},"tech/methods/mirpay":{"id":"tech/methods/mirpay","title":"МирПэй","group":"tech","html":"\u003ch2 id=\"виды-интеграций\">Виды интеграций\u003c/h2>\u003ch2 id=\"подключение-мирпэй\">Подключение МирПэй\u003c/h2>","toc":[{"level":2,"title":"Виды интеграций","id":"виды-интеграций"},{"level":2,"title":"Подключение МирПэй","id":"подключение-мирпэй"}]},"tech/methods/dolyami":{"id":"tech/methods/dolyami","title":"Долями","group":"tech","html":"\u003cdiv class=\"imported-api\">\u003cp>CloudPayments предлагает метод оплаты Долями. Пользователь может разделить оплату на четыре части, а магазин получит всю сумму на следующий рабочий день.\u003c/p>\u003ch2 id=\"sposoby-integratsiy\">\u003cstrong>Способы интеграций\u003c/strong>\u003c/h2>\u003cul>\u003cli>\u003cp>в платежном \u003ca href=\"https://developers.cloudpayments.ru/#platezhnyy-vidzhet\" target=\"_blank\" rel=\"noopener noreferrer\">виджете\u003c/a> и \u003ca href=\"https://cloudpayments.ru/integration/cms\" target=\"_blank\" rel=\"noopener noreferrer\">CMS\u003c/a>-/\u003ca href=\"https://cloudpayments.ru/integration/crm\" target=\"_blank\" rel=\"noopener noreferrer\">CRM\u003c/a>-модулях\u003c/p>\u003c/li>\u003cli>\u003cp>в \u003ca href=\"https://cloudpayments.ru/infoshop\" target=\"_blank\" rel=\"noopener noreferrer\">CloudИнфошопе\u003c/a> (формирование витрины из Личного кабинета)\u003c/p>\u003c/li>\u003cli>\u003cp>в \u003ca href=\"https://developers.cloudpayments.ru/#sozdanie-scheta-dlya-otpravki-po-pochte\" target=\"_blank\" rel=\"noopener noreferrer\">заказах\u003c/a>\u003c/p>\u003c/li>\u003cli>\u003cp>в платежных ссылках, которые формируются из Личного кабинета\u003c/p>\u003c/li>\u003cli>\u003cp>в API\u003c/p>\u003c/li>\u003c/ul>\u003ch2 id=\"podklyuchenie\">\u003cstrong>Подключение\u003c/strong>\u003c/h2>\u003cp>Для подключения способа оплаты необходимо обратиться к курирующему менеджеру или написать на адрес электронной почты – \u003ca href=\"mailto:assistant@cp.ru\">assistant@cp.ru\u003c/a>\u003c/p>\u003cp>По техническим вопросам обращайтесь в службу поддержки – \u003ca href=\"mailto:support@cp.ru\">support@cp.ru\u003c/a>\u003c/p>\u003ch2 id=\"vstraivaemaya-knopka-oplaty\">\u003cstrong>Встраиваемая кнопка оплаты\u003c/strong>\u003c/h2>\u003cp>Вы можете добавить на свой сайт кнопку оплаты Долями. Данный способ работает через публичный API CloudPayments и позволяет встраивать на вашей форме отдельную кнопку оплаты.\u003c/p>\u003cp>Интерфейс работает по адресу \u003ca href=\"http://api.cloudpayments.ru/\" target=\"_blank\" rel=\"noopener noreferrer\">api.cloudpayments.ru\u003c/a>\u003c/p>\u003ch3 id=\"metod-post-payments-altpay-pay\">\u003cstrong>Метод POST /payments/altpay/pay\u003c/strong>\u003c/h3>\u003cp>Метод предназначен для получения ссылки на оплату через заполнение заявки Долями\u003c/p>\u003cp>Авторизация \u003ca href=\"https://en.wikipedia.org/wiki/Basic_access_authentication\" target=\"_blank\" rel=\"noopener noreferrer\">HTTP Basic Auth\u003c/a> для данного метода отсутствует. Вместо нее используется параметр идентификатора терминала \u003ccode>PublicId\u003c/code> в теле запроса.\u003c/p>\u003cp>\u003cstrong>URL:\u003c/strong> /payments/altpay/pay\u003c/p>\u003cp>\u003cstrong>METHOD:\u003c/strong> POST\u003c/p>\u003cp>\u003cstrong>BODY:\u003c/strong> Запрос обязательно имеет не пустое тело запроса.\u003c/p>\u003cdiv class=\"api-table-scroll\" tabindex=\"0\" aria-label=\"Таблица\">\u003ctable style=\"table-layout:fixed;width:1125px;min-width:0\">\u003ccolgroup>\u003ccol style=\"width:173px\">\u003ccol style=\"width:239px\">\u003ccol style=\"width:164px\">\u003ccol style=\"width:236px\">\u003ccol style=\"width:313px\">\u003c/colgroup>\u003ctr>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Параметр\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Формат\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Применение\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Описание\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Пример\u003c/p>\u003c/th>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>PublicId\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Идентификатор терминала.\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003ccode>pk_0fe1d5c9cb47e8cf8d96102201419\u003c/code>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>AltPayType\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Тип оплаты.\u003cbr>Необходимо передавать значение &quot;TcsBnplDolyame&quot;.\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003ccode>TcsBnplDolyame\u003c/code>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Amount\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Number\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Cумма платежа, разделитель точка. Количество не нулевых знаков после точки – 2.\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003ccode>1000\u003c/code>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Scheme\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>enum\u003cbr>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Схема проведения платежа (см. \u003ca href=\"https://developers.cloudpayments.ru/#vidy-operatsiy\" target=\"_blank\" rel=\"noopener noreferrer\">Виды операций\u003c/a>).\u003cbr>Возможные значения:\u003cbr>\u003ccode>0\u003c/code> - одностадийная оплата;\u003cbr>\u003ccode>1\u003c/code> - двухстадийная оплата\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003ccode>0\u003c/code>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>InvoiceId\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Идентификатор заказа/номер счета.\u003cbr>Приходит в \u003ca href=\"https://developers.cloudpayments.ru/#check\" target=\"_blank\" rel=\"noopener noreferrer\">Check\u003c/a>-уведомлении и может использоваться для сверки номера заказа.\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003ccode>462651419\u003c/code>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Description\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Описание заказа/оплаты в свободной форме\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003ccode>Оплата товаров в https://example.com\u003c/code>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>AccountId\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Идентификатор плательщика\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003ccode>usermail@example.com\u003c/code>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Email\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>E-mail плательщика, на который будет отправлена квитанция об оплате\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003ccode>usermail@example.com\u003c/code>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>SuccessRedirectUrl\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Ссылка для возврата в случае успешной оплаты\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003ccode>https://success-page.ru\u003c/code>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>FailRedirectUrl\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Ссылка для возврата в случае неуспешной оплаты\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003ccode>https://fail-page.ru\u003c/code>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>JsonData\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Json\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Любые другие данные, которые будут связаны с транзакцией в формате объекта \u003ccode>json\u003c/code>.\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003ccode>{\\&quot;Phone\\&quot;: \\&quot;+71234567890\\&quot;}\u003c/code>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>CultureName\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Язык уведомлений и квитанций. Возможные значения: &quot;ru-RU&quot;, &quot;en-US&quot;. (см. \u003ca href=\"https://developers.cloudpayments.ru/#lokalizatsiya\" target=\"_blank\" rel=\"noopener noreferrer\">справочник\u003c/a>).\u003cbr>Если не передан, по умолчанию будет использоваться &quot;ru-RU”.\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003ccode>ru-RU\u003c/code>\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cp>\u003cstrong>RESPONSE:\u003c/strong>\u003c/p>\u003cp>В ответ сервер возвращает JSON с тремя составляющими:\u003c/p>\u003cul>\u003cli>\u003cp>\u003cstrong>поле success\u003c/strong> — результат запроса;\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>поле message\u003c/strong> — описание ошибки;\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>объект model\u003c/strong> — расширенная информация о платеже.\u003c/p>\u003c/li>\u003c/ul>\u003cp>Возможные варианты ответа:\u003c/p>\u003col start=\"1\">\u003cli>\u003cp>Некорректно сформирован запрос:\u003c/p>\u003cul>\u003cli>\u003cp>\u003cstrong>success\u003c/strong> — false\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>message\u003c/strong> — описание ошибки\u003c/p>\u003c/li>\u003c/ul>\u003c/li>\u003cli>\u003cp>Инициализация платежной сессии завершилась неуспешно:\u003c/p>\u003cul>\u003cli>\u003cp>\u003cstrong>success\u003c/strong> — false\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>model\u003c/strong> — информация о транзакции и код ошибки\u003c/p>\u003c/li>\u003c/ul>\u003c/li>\u003cli>\u003cp>Инициализация сессии прошла успешно:\u003c/p>\u003cul>\u003cli>\u003cp>\u003cstrong>success\u003c/strong> — true\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>model\u003c/strong> — информация о транзакции\u003c/p>\u003cul>\u003cli>\u003cp>В поле \u003ccode>Model.ExtensionData.Link\u003c/code> придет ссылка на платежную форму, которую необходимо открыть для последующей оплаты пользователем через оформление заявки на данной платежной форме\u003c/p>\u003c/li>\u003c/ul>\u003c/li>\u003c/ul>\u003c/li>\u003c/ol>\u003cp>\u003cbr>\u003c/p>\u003caside class=\"api-callout \" role=\"note\">\u003cstrong class=\"callout-label\">Информация\u003c/strong>\u003cp>Результат запроса (поле Success) не отражает статус транзакции, а лишь свидетельствует об успешности/неуспешности запроса API. Статус транзакции отражен в дополнительном поле Status, также его можно узнать в результате получения \u003ca href=\"https://developers.cloudpayments.ru/#uvedomleniya\" target=\"_blank\" rel=\"noopener noreferrer\">уведомлений\u003c/a>. Интерпретацию статусов транзакции смотрите в \u003ca href=\"https://developers.cloudpayments.ru/#statusy-operatsiy\" target=\"_blank\" rel=\"noopener noreferrer\">справочнике\u003c/a>.\u003c/p>\u003c/aside>\u003cdiv class=\"api-table-scroll\" tabindex=\"0\" aria-label=\"Таблица\">\u003ctable style=\"table-layout:fixed;width:952px;min-width:0\">\u003ccolgroup>\u003ccol style=\"width:227px\">\u003ccol style=\"width:167px\">\u003ccol style=\"width:162px\">\u003ccol style=\"width:396px\">\u003c/colgroup>\u003ctr>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Параметр\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Формат\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Наличие\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Описание\u003c/p>\u003c/th>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Model\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Object\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Данные созданной транзакции\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Model.TransactionId\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Long\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>ID Транзакции\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Model.Amount\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Number\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Сумма транзакции\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Model.IsTest\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Bool\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Флаг тестового режима оплаты\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>ExtensionData\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Object\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u <script>
'use strict';
async function copyCodeText(text) {
  if (typeof navigator !== 'undefined' && navigator.clipboard?.writeText) {
    try {await navigator.clipboard.writeText(text);return;} catch {}
  }
  const previous = document.activeElement;
  const field = document.createElement('textarea');
  field.value = text;
  field.setAttribute('readonly', '');
  field.style.cssText = 'position:fixed;left:-9999px;top:0';
  document.body.appendChild(field);
  field.select();
  const copied = document.execCommand('copy');
  field.remove();
  previous?.focus({preventScroll: true});
  if (!copied) throw new Error('Clipboard unavailable');
}

const copyFeedbackTimers = new WeakMap();

async function handleCodeCopy(event) {
  const button = event.target.closest('[data-copy-code]');
  if (!button) return;
  const code = document.getElementById(button.dataset.copyCode);
  if (!code) return;
  clearTimeout(copyFeedbackTimers.get(button));
  const feedback = (state, label) => {
    button.dataset.copyState = state;
    button.setAttribute('aria-label', label);
    button.setAttribute('title', label);
    button.querySelector('[data-copy-status]').textContent = state === 'ready' ? '' : label;
  };
  try {
    await copyCodeText(code.textContent);
    feedback('copied', 'Код скопирован');
  } catch {
    feedback('error', 'Не удалось скопировать. Выделите код для копирования.');
  }
  copyFeedbackTimers.set(button, setTimeout(() => {
    feedback('ready', 'Копировать код');
    copyFeedbackTimers.delete(button);
  }, 2000));
}

if (typeof module !== 'undefined') module.exports = {copyCodeText, handleCodeCopy};

      return {...entry, score, order};

    const input = root.querySelector('input'), panel = root.querySelector('.doc-search-panel'), list = root.querySelector('.doc-search-results'), status = root.querySelector('.doc-search-status'), clear = root.querySelector('.doc-search-clear');
    let indexPromise, timer, serial=0, selected=-1, links=[], disposed=false;

      links.forEach((link,i)=>link.setAttribute('aria-selected',String(i===value)));
      if (links[value]) {input.setAttribute('aria-activedescendant',links[value].id);links[value].scrollIntoView({block:'nearest'});}
      else input.removeAttribute('aria-activedescendant');
    }
    async function update() {
      const turn=++serial, query=input.value.trim();
      clear.hidden=!input.value; panel.hidden=false; input.setAttribute('aria-expanded','true'); selected=-1; links=[]; list.innerHTML='';input.removeAttribute('aria-activedescendant');
      if (!query) {status.textContent='Введите слово, название метода или параметр API';return;}
      status.textContent='Ищем по всей документации…';
      try {
        const results=find(await index(),query);
        if (disposed || turn!==serial) return;
        status.textContent=results.length ? 'Найдено: '+results.length+(results.length>20?' · Показаны первые 20':'') : 'Ничего не найдено. Попробуйте другое слово.';
        list.innerHTML=results.slice(0,20).map((entry,i)=>'<a class="doc-search-result" id="'+uid+'-'+i+'" role="option" aria-selected="false" href="'+escape(routeUrl(entry.pageId,entry.anchor))+'"><span class="doc-search-group">'+escape(entry.group)+' · '+highlight(entry.pageTitle,query)+'</span><strong>'+highlight(entry.heading || entry.pageTitle,query)+'</strong>'+(entry.text?'<span class="doc-search-excerpt">'+excerpt(entry,query)+'</span>':'')+'</a>').join('');
        links=[...list.querySelectorAll('a')];
      } catch {if(turn===serial && !disposed) status.textContent='Не удалось загрузить поиск. Повторите ввод или обновите страницу.';}
    }
    listen(input,'input',()=>{++serial;clearTimeout(timer);timer=setTimeout(update,100);});
    listen(input,'focus',update);
    listen(input,'keydown',event=>{
      if(event.key==='Escape'){event.preventDefault();close();}
      if(event.key==='ArrowDown' || event.key==='ArrowUp'){event.preventDefault();if(panel.hidden){void update();return;}if(links.length) select(selected<0?(event.key==='ArrowDown'?0:links.length-1):(selected+(event.key==='ArrowDown'?1:-1)+links.length)%links.length);}
      if(event.key==='Enter'){event.preventDefault();if(!panel.hidden && links.length) links[Math.max(0,selected)].click();}
    });
    listen(clear,'click',()=>{input.value='';input.focus();void update();});
    listen(list,'click',event=>{const link=event.target.closest('a');if(link){close();input.blur();onNavigate(link);}});
    listen(doc,'pointerdown',event=>{if(!root.contains(event.target))close();});
    listen(root,'focusout',event=>{if(!root.contains(event.relatedTarget))close();});
    listen(doc,'keydown',event=>{if(event.key==='/' && !event.ctrlKey && !event.metaKey && !event.altKey && !event.target.closest('input,textarea,select,[contenteditable="true"]')){event.preventDefault();input.focus();}});
    return ()=>{disposed=true;close();listeners.forEach(remove=>remove());root.innerHTML='';};
  }
  return {normalize, tokens, buildIndex, find, highlight, excerpt, mount};
});

const data=JSON.parse(document.getElementById('document-data').textContent), groups=data.groups,pages=data.pages;
const main=document.getElementById('main'),sidebar=document.getElementById('sidebar'),menuButton=document.getElementById('menu-button');
let audience='all',lastRoute=null;
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const routeUrl=(id,anchor='')=>'#/'+id+(anchor?'@'+encodeURIComponent(anchor):'');
const visibleGroups=()=>groups.filter(g=>audience==='all'||g.audience===audience||g.audience==='both');
const symbols=['01','02','03','↔','</>','✓','Aa'];
function badge(g){return (g.audience!=='developer'?'<span class="badge">Для бизнеса</span>':'')+(g.audience!=='business'?'<span class="badge developer">Для разработчиков</span>':'')}
function closeMenu(){sidebar.classList.remove('open');menuButton.setAttribute('aria-expanded','false')}
function outlineHtml(headings, id, minLevel){
  const result=[];let i=0;
  while(i<headings.length){
    const heading=headings[i];
    if(heading.level<minLevel){i++;continue}
    if(heading.level>minLevel){i++;continue}
    let end=i+1;while(end<headings.length&&headings[end].level>heading.level)end++;
    const children=headings.slice(i+1,end);
    const link='<a data-page-anchor="'+escapeHtml(heading.id)+'" class="level-'+heading.level+'" href="'+routeUrl(id,heading.id)+'">'+escapeHtml(heading.title)+'</a>';
    if(children.length){result.push('<details class="nested-outline"><summary><a data-page-anchor="'+escapeHtml(heading.id)+'" class="level-'+heading.level+'" href="'+routeUrl(id,heading.id)+'">'+escapeHtml(heading.title)+'</a></summary><nav class="nested-anchors">'+outlineHtml(children,id,minLevel+1)+'</nav></details>')}
    else result.push(link);
    i=end;
  }
  return result.join('');
}
function sidebarPage(p,id){
  const active=id===p.id;
  const link='<a '+(active?'aria-current="page"':'')+' class="'+(active?'active':'')+'" href="'+routeUrl(p.id)+'">'+(p.id.includes('tech/methods/')?'Настройка: ':'')+escapeHtml(p.title)+'</a>';
  if(p.id!=='tech/api')return link;
  const headings=pages[p.id].toc;
  return '<details class="page-outline" '+(active?'open':'')+'><summary>'+link+'</summary><nav class="page-anchors" aria-label="Подглавы API">'+outlineHtml(headings,id,2)+'</nav></details>';
}
function sidebarHtml(id){return '<a class="home-link '+(!id?'active':'')+'" href="#/">Об этом документе</a>'+groups.map(g=>'<details '+(g.items.some(p=>p.id===id)?'open':'')+'><summary>'+escapeHtml(g.title)+'</summary><div class="children">'+g.items.map(p=>sidebarPage(p,id)).join('')+'</div></details>').join('')}
function selectSidebarAnchor(anchor){sidebar.querySelectorAll('[data-page-anchor]').forEach(link=>{const active=link.dataset.pageAnchor===anchor;link.classList.toggle('active',active);if(active)link.setAttribute('aria-current','location');else link.removeAttribute('aria-current')})}
function overview(){const shown=visibleGroups();return '<div class="content-grid"><div><div class="eyebrow">ДОКУМЕНТАЦИЯ / ОБЗОР</div><h1>Об этом документе</h1><p class="lead">От выбора платежного решения до технического подключения.<br>Выберите, какие разделы вам нужны.</p><div class="filters" role="group" aria-label="Для кого документация">'+[['all','Все разделы'],['business','Для бизнеса'],['developer','Для разработчиков']].map(([v,label])=>'<button data-audience="'+v+'" aria-pressed="'+(v===audience)+'">'+(v!=='all'?'<span aria-hidden="true" class="marker '+v+'"></span>':'')+label+'</button>').join('')+'</div><div class="count" aria-live="polite">Разделов: '+shown.length+' · Страниц: '+shown.reduce((n,g)=>n+g.items.length,0)+'</div><div class="cards">'+shown.map(g=>'<section class="card '+g.audience+'" id="section-'+g.id+'"><div class="card-top"><span class="symbol">'+escapeHtml(symbols[groups.indexOf(g)])+'</span><span class="number">'+String(groups.indexOf(g)+1).padStart(2,'0')+'</span></div><h2>'+escapeHtml(g.title)+'</h2><p>'+escapeHtml(g.description)+'</p><div class="badges">'+badge(g)+'</div><ul>'+g.items.map(p=>'<li><a href="'+routeUrl(p.id)+'"><span>'+(p.id.includes('tech/methods/')?'Настройка: ':'')+escapeHtml(p.title)+'</span><span class="chevron">›</span></a></li>').join('')+'</ul></section>').join('')+'</div><div class="sources"><span>Источники</span><a target="_blank" rel="noopener noreferrer" href="https://developers.cloudpayments.ru/">Документация CloudPayments ↗</a><a target="_blank" rel="noopener noreferrer" href="https://cloudpayments.ru/help/payments">База знаний ↗</a></div></div><aside class="toc"><strong>На этой странице</strong>'+shown.map(g=>'<a href="'+routeUrl('','section-'+g.id)+'">'+escapeHtml(g.title)+'</a>').join('')+'</aside></div>'}
function article(p){const g=groups.find(g=>g.id===p.group),items=groups.flatMap(g=>g.items),index=items.findIndex(x=>x.id===p.id);return '<div class="content-grid"><article class="article"><div class="breadcrumb"><a href="#/">Об этом документе</a> / '+escapeHtml(g.title)+'</div><h1>'+escapeHtml(p.title)+'</h1><div class="badges">'+badge(g)+'</div>'+p.html+'<nav class="page-nav" aria-label="Соседние страницы">'+(index>0?'<a href="'+routeUrl(items[index-1].id)+'"><small>← Предыдущая страница</small>'+escapeHtml(items[index-1].title)+'</a>':'')+(index<items.length-1?'<a href="'+routeUrl(items[index+1].id)+'"><small>Следующая страница →</small>'+escapeHtml(items[index+1].title)+'</a>':'')+'</nav></article><aside class="toc"><strong>На этой странице</strong>'+p.toc.map(t=>'<a class="level-'+t.level+'" href="'+routeUrl(p.id,t.id)+'">'+escapeHtml(t.title)+'</a>').join('')+'</aside></div>'}
function render(){if(location.hash==='#main'){main.focus();return}const hash=location.hash.replace(/^#\/?/,''),at=hash.indexOf('@'),id=at<0?hash:hash.slice(0,at);let anchor='';try{anchor=at<0?'':decodeURIComponent(hash.slice(at+1))}catch{}const changed=id!==lastRoute;if(changed){sidebar.innerHTML=sidebarHtml(id);main.innerHTML=id?(pages[id]?article(pages[id]):'<h1>Страница не найдена</h1><a href="#/">Вернуться к оглавлению</a>'):overview();document.title=(pages[id]?.title||'Об этом документе')+' · CloudPayments';lastRoute=id;closeMenu()}selectSidebarAnchor(id==='tech/api'?anchor:'');if(anchor){requestAnimationFrame(()=>document.getElementById(anchor)?.scrollIntoView({block:'start'}))}else if(changed){window.scrollTo(0,0);main.focus({preventScroll:true})}}
main.addEventListener('click',e=>{if(e.target.closest('[data-copy-code]')){handleCodeCopy(e);return}const button=e.target.closest('[data-audience]');if(button){audience=button.dataset.audience;main.innerHTML=overview();main.querySelector('[data-audience="'+audience+'"]').focus();if(location.hash.includes('@'))history.replaceState(null,'','#/')}});
sidebar.addEventListener('click',e=>{const link=e.target.closest('a');if(!link)return;const summary=link.closest('summary');if(summary){const details=summary.parentElement;details.open=!details.open}else{closeMenu()}});menuButton.addEventListener('click',()=>{const open=sidebar.classList.toggle('open');menuButton.setAttribute('aria-expanded',String(open))});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu()});window.addEventListener('hashchange',render);render();
const searchHost=document.getElementById('documentation-search');
if(searchHost)CPDocumentationSearch.mount(searchHost,{getData:()=>data,routeUrl,onNavigate:()=>closeMenu()});
</script></body></html>
