"id":"vozmozhnye-varianty","title":"Возможные варианты","level":4},{"id":"двухстадийная-оплата","title":"Двухстадийная оплата","level":3},{"id":"подтверждение-оплаты","title":"Подтверждение оплаты","level":4},{"id":"отмена-оплаты","title":"Отмена оплаты","level":4},{"id":"возврат-денег","title":"Возврат денег","level":3},{"id":"выплата-по-криптограмме","title":"Выплата по криптограмме","level":4},{"id":"выплата-по-токену","title":"Выплата по токену","level":4},{"id":"выплата-по-сбп","title":"Выплата по СБП","level":4},{"id":"выгрузка-списка-претензий-за-произвольный-период","title":"Выгрузка списка претензий за произвольный период","level":4},{"id":"работа-с-транзакциями","title":"Работа с транзакциями","level":3},{"id":"просмотр-транзакции","title":"Просмотр транзакции","level":4},{"id":"проверка-статуса-платежа","title":"Проверка статуса платежа","level":4},{"id":"выгрузка-списка-транзакций","title":"Выгрузка списка транзакций","level":4},{"id":"выгрузка-списка-транзакций-за-произвольный-период","title":"Выгрузка списка транзакций за произвольный период","level":4},{"id":"выгрузка-токенов","title":"Выгрузка токенов","level":4},{"id":"подписки","title":"Подписки","level":3},{"id":"создание-подписки-на-рекуррентные-платежи","title":"Создание подписки на рекуррентные платежи","level":4},{"id":"запрос-информации-о-подписке","title":"Запрос информации о подписке","level":4},{"id":"поиск-подписок","title":"Поиск подписок ","level":4},{"id":"изменение-подписки-на-рекуррентные-платежи","title":"Изменение подписки на рекуррентные платежи","level":4},{"id":"отмена-подписки-на-рекуррентные-платежи","title":"Отмена подписки на рекуррентные платежи","level":4},{"id":"локализация","title":"Локализация","level":3},{"id":"длинная-запись","title":"Длинная запись","level":3}]},"tech/notifications":{"id":"tech/notifications","title":"Уведомления","group":"tech","html":"\u003cdiv class=\"imported-api\">\u003cp>Уведомление — HTTP-запрос от системы к вашему сайту. Подобные запросы также называют \u003cstrong>callback\u003c/strong> или \u003cstrong>webhook\u003c/strong>. В системе предусмотрено несколько видов уведомлений: для проверки возможности выполнить оплату, для информирования об успешных и неуспешных платежах, для оповещения об изменении подписок на рекуррентные платежи, а также для информирования о выданных кассовых чеках.\u003c/p>\u003caside class=\"api-callout warning\" role=\"note\">\u003cstrong class=\"callout-label\">Внимание\u003c/strong>\u003cp>Включение и отключение уведомлений, а также настройка адресов и форматов уведомлений выполняется в ЛК.\u003c/p>\u003c/aside>\u003caside class=\"api-callout \" role=\"note\">\u003cstrong class=\"callout-label\">Информация\u003c/strong>\u003cp>Если вы используете уведомления для проверки и изменения статусов заказов в вашей системе, мы рекомендуем сверять сумму, номер заказа и идентификатор аккаунта плательщика.\u003c/p>\u003c/aside>\u003caside class=\"api-callout \" role=\"note\">\u003cstrong class=\"callout-label\">Информация\u003c/strong>\u003cp>Для уведомлений (Pay, Fail, Recurrent, Cancel, Confirm, Refund) действует следующие правило: если система не сможет соединиться с сервером ТСП или получит некорректный ответ, либо ответ с кодом, отличным от нуля, то будет совершено 100 попыток доставить сообщение с интервалом между повторами в минутах: 1, 2, 5, 10, 30. Тайм-аут ожидания ответа - 30 секунд. Менее чем в 1% случаев задержка доставки может достигать 2 минуты. В остальных случаях — меньше 1 секунды.\u003c/p>\u003c/aside>\u003ch2 id=\"check\">Check\u003c/h2>\u003cp>Выполняется после того, как держатель заполнил платежную форму и нажал кнопку «Оплатить».\u003c/p>\u003cp>Служит для контроля прохождения платежа: система отправляет запрос на адрес сайта ТСП с информацией об оплате, а сайт должен подтвердить или отклонить возможность принять платеж.\u003c/p>\u003cp>Параметры передаются в теле запроса, список представлен в следующей таблице:\u003c/p>\u003cdiv class=\"api-table-scroll\" tabindex=\"0\" aria-label=\"Таблица\">\u003ctable style=\"table-layout:fixed;width:851px;min-width:0\">\u003ccolgroup>\u003ccol style=\"width:151px\">\u003ccol style=\"width:171px\">\u003ccol style=\"width:244px\">\u003ccol style=\"width:285px\">\u003c/colgroup>\u003ctr>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Параметр\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Формат\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Применение\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Описание\u003c/p>\u003c/th>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>TransactionId\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Long\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Номер транзакции в системе\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Amount\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Number, точка в качестве разделителя, две цифры после точки\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Сумма оплаты из параметров платежа\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Currency\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Валюта: RUB/USD/EUR/GBP из параметров платежа (см. \u003ca href=\"https://developers.cloudpayments.ru/#spisok-valyut\" target=\"_blank\" rel=\"noopener noreferrer\">справочник\u003c/a>)\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>PaymentAmount\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003 roll\" tabindex=\"0\" aria-label=\"Таблица\">\u003ctable style=\"table-layout:fixed;width:899px;min-width:0\">\u003ccolgroup>\u003ccol style=\"width:94px\">\u003ccol style=\"width:284px\">\u003ccol style=\"width:521px\">\u003c/colgroup>\u003ctr>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Код\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Значение\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Результат\u003c/p>\u003c/th>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>0\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Платеж может быть проведен\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Система выполнит авторизацию платежа\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>10\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Неверный номер заказа\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Платеж будет отклонен\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>11\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Некорректный AccountId\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Платеж будет отклонен\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>12\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Неверная сумма\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Платеж будет отклонен\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>13\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Платеж не может быть принят\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Платеж будет отклонен\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>20\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Платеж просрочен\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Платеж будет отклонен, плательщик получит соответствующее уведомление\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003caside class=\"api-callout \" role=\"note\">\u003cstrong class=\"callout-label\">Информация\u003c/strong>\u003cp>Если система не сможет соединиться с сервером ТСП или получит некорректный ответ, платеж будет отклонен.\u003c/p>\u003c/aside>\u003ch2 id=\"pay\">Pay\u003c/h2>\u003cp>Выполняется после того, как оплата была успешно проведена и получена авторизация эмитента.\u003c/p>\u003cp>Служит для информирования о проведенном платеже: система отправляет запрос на адрес ТСП с информацией об оплате, а сайт должен зафиксировать факт платежа.\u003c/p>\u003cp>Параметры передаются в теле запроса, список представлен в следующей таблице:\u003c/p>\u003cdiv class=\"api-table-scroll\" tabindex=\"0\" aria-label=\"Таблица\">\u003ctable style=\"table-layout:fixed;width:897px;min-width:0\">\u003ccolgroup>\u003ccol style=\"width:181px\">\u003ccol style=\"width:203px\">\u003ccol style=\"width:160px\">\u003ccol style=\"width:353px\">\u003c/colgroup>\u003ctr>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Параметр\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Формат\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Применение\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Описание\u003c/p>\u003c/th>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>TransactionId\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Long\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Номер транзакции в системе\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Amount\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Number, точка в качестве разделителя, две цифры после точки\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Сумма опла мления об отклоненном платеже и может принимать единственное значение:\u003c/p>\u003cdiv class=\"api-table-scroll\" tabindex=\"0\" aria-label=\"Таблица\">\u003ctable style=\"table-layout:fixed;width:883px;min-width:0\">\u003ccolgroup>\u003ccol style=\"width:171px\">\u003ccol style=\"width:712px\">\u003c/colgroup>\u003ctr>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Код\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Значение\u003c/p>\u003c/th>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>0\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Платеж зарегистрирован \u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003ch2 id=\"recurrent\">Recurrent\u003c/h2>\u003cp>Выполняется в случае, если статус подписки на рекуррентный платеж был изменен.\u003c/p>\u003caside class=\"api-callout \" role=\"note\">\u003cstrong class=\"callout-label\">Информация\u003c/strong>\u003cp>При выполнении \u003ca href=\"https://developers.cloudpayments.ru/#izmenenie-podpiski-na-rekurrentnye-platezhi\" target=\"_blank\" rel=\"noopener noreferrer\">запроса\u003c/a> “Изменение подписки на рекуррентные платежи”, Recurrent-уведомление не направляется.\u003c/p>\u003c/aside>\u003cp>Параметры передаются в теле запроса, список представлен в следующей таблице:\u003c/p>\u003cdiv class=\"api-table-scroll\" tabindex=\"0\" aria-label=\"Таблица\">\u003ctable style=\"table-layout:fixed;width:916px;min-width:0\">\u003ccolgroup>\u003ccol style=\"width:241px\">\u003ccol style=\"width:180px\">\u003ccol style=\"width:205px\">\u003ccol style=\"width:290px\">\u003c/colgroup>\u003ctr>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Параметр\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Формат\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Применение\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Описание\u003c/p>\u003c/th>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Id\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Идентификатор подписки\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>AccountId\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Идентификатор пользователя\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Description\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Назначение платежа в свободной форме\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Email\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>E-mail плательщика\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Amount\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Number\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Сумма платежа\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Currency\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Валюта: RUB/USD/EUR/GBP из параметров платежа (см. \u003ca href=\"https://developers.cloudpayments.ru/#spisok-valyut\" target=\"_blank\" rel=\"noopener noreferrer\">справочник\u003c/a>)\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>RequireConfirmation\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Bool\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Если значение \u003ccode>true\u003c/code> — платеж будет выполнен по \u003ca href=\"https://developers.cloudpayments.ru/#shemy-provedeniya-platezha\" target=\"_blank\" rel=\"noopener noreferrer\">двухстадийной схеме\u003c/a>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>StartDate\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>DateTime\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Дата и время первого платежа по плану во временной зоне UTC\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Interval\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Интервал. Возможные значения: Week, Month\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Period\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Int\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Период. В комбинации с интервалом 1 Month значит раз в месяц, а 2 Week — раз в две недели\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Status\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003ca href=\"https://developers.cloudpayments.ru/#statusy-podpisok-rekurrent\" target=\"_blank\" rel=\"noopener noreferrer\">Статусы подписок\u003c/a>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>SuccessfulTransactionsNumber\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Int\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Количество успешных платежей\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>FailedTransactionsNumber\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Int\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Количество неуспешных платежей (обнуляется после каждого успешного)\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>MaxPeriods\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Int\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Максимальное количество платежей в подписке\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>LastTransactionDate\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>yyyy-MM-dd HH:mm:ss\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Дата и время последнего успешного платежа во временной зоне UTC\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>NextTransactionDate\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>yyyy-MM-dd HH:mm:ss\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Дата и время следующего платежа во временной зоне UTC\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cp>В ответ на запрос система ожидает получить ответ в JSON-формате с обязательным параметром code:\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>json\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-6\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-6\" class=\"language-json\">{&quot;code&quot;:0}\u003c/code>\u003c/pre>\u003c/div>\u003cp>Код определяет результат обработки сервером ТСП уведомления об отклоненном платеже и может принимать единственное значение:\u003c/p>\u003cdiv class=\"api-table-scroll\" tabindex=\"0\" aria-label=\"Таблица\">\u003ctable style=\"table-layout:fixed;width:883px;min-width:0\">\u003ccolgroup>\u003ccol style=\"width:171px\">\u003ccol style=\"width:712px\">\u003c/colgroup>\u003ctr>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Код\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Значение\u003c/p>\u003c/th>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>0\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Платеж зарегистрирован \u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003ch2 id=\"cancel\">Cancel\u003c/h2>\u003cp>Выполняется в случае, если платеж был отменен по вашей инициативе через \u003ca href=\"https://developers.cloudpayments.ru/#api\" target=\"_blank\" rel=\"noopener noreferrer\">API\u003c/a> или личный кабинет.\u003c/p>\u003cp>Параметры передаются в теле запроса, список представлен в следующей таблице:\u003c/p>\u003cdiv class=\"api-table-scroll\" tabindex=\"0\" aria-label=\"Таблица\">\u003ctable style=\"table-layout:fixed;width:880px;min-width:0\">\u003ccolgroup>\u003ccol style=\"width:216px\">\u003ccol style=\"width:228px\">\u003ccol style=\"width:221px\">\u003ccol style=\"width:215px\">\u003c/colgroup>\u003ctr>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Параметр\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Формат\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Применение\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Описание\u003c/p>\u003c/th>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>TransactionId\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Long\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Номер отмененной транзакции в системе\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Amount\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Number, точка в качестве разделителя, две цифры после точки\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Сумма отмененной транзакции в валюте платежа\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>DateTime\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>yyyy-MM-dd HH:mm:ss\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Дата/время отмены по временной зоне UTC\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>InvoiceId\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Номер заказа отмененной операции\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>AccountId\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Идентификатор пользователя отмененной операции\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Email\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>E-mail адрес плательщика\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Data\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Json\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Произвольный набор параметров, переданных в транзакцию\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Rrn\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Уникальный номер банковской транзакции, который назначается обслуживающим банком\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cp>В ответ на запрос система ожидает получить ответ в JSON-формате с обязательным параметром code:\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>json\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-7\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-7\" class=\"language-json\">{&quot;code&quot;:0}\u003c/code>\u003c/pre>\u003c/div>\u003cp>Код определяет результат обработки сервером ТСП уведомления об отклоненном платеже и может принимать единственное значение:\u003c/p>\u003cdiv class=\"api-table-scroll\" tabindex=\"0\" aria-label=\"Таблица\">\u003ctable style=\"table-layout:fixed;width:883px;min-width:0\">\u003ccolgroup>\u003ccol style=\"width:171px\">\u003ccol style=\"width:712px\">\u003c/colgroup>\u003ctr>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Код\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Значение\u003c/p>\u003c/th>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>0\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Платеж зарегистрирован \u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003ch2 id=\"проверка-уведомлений\">Проверка уведомлений\u003c/h2>\u003cp>Все виды уведомлений — \u003ca href=\"https://developers.cloudpayments.ru/#check\" target=\"_blank\" rel=\"noopener noreferrer\">check\u003c/a>, \u003ca href=\"https://developers.cloudpayments.ru/#pay\" target=\"_blank\" rel=\"noopener noreferrer\">pay\u003c/a>, \u003ca href=\"https://developers.cloudpayments.ru/#fail\" target=\"_blank\" rel=\"noopener noreferrer\">fail\u003c/a>, \u003ca href=\"https://developers.cloudpayments.ru/#confirm\" target=\"_blank\" rel=\"noopener noreferrer\">confirm\u003c/a>, \u003ca href=\"https://developers.cloudpayments.ru/#cancel\" target=\"_blank\" rel=\"noopener noreferrer\">cancel\u003c/a>, \u003ca href=\"https://developers.cloudpayments.ru/#refund\" target=\"_blank\" rel=\"noopener noreferrer\">refund\u003c/a> и \u003ca href=\"https://developers.cloudpayments.ru/#recurrent\" target=\"_blank\" rel=\"noopener noreferrer\">recurrent\u003c/a> содержат 2 HTTP-заголовка \u003cstrong>X-Content-HMAC\u003c/strong> и \u003cstrong>Content-HMAC\u003c/strong>, в которых находится проверочное значение запроса, вычисленное с помощью алгоритма \u003ca href=\"https://ru.wikipedia.org/wiki/HMAC\" target=\"_blank\" rel=\"noopener noreferrer\">HMAC\u003c/a>. Отличие между ними только в том, что первый генерируется из URL decoded (или не encoded) параметров, а второй генерируется из URL encoded параметров, что может вызывать проблемы. Если вам необходимо проверять подлинность и целостность уведомлений, вы можете вычислить проверочное значение на своей стороне и сравнить с тем, что пришло в запросе. Совпадение подтверждает, что уведомление было отправлено от нас и пришло к вам в оригинальном виде.\u003c/p>\u003cp>При реализации проверки сообщения, обратите внимание на следующие моменты:\u003c/p>\u003cul>\u003cli>\u003cp>Для уведомлений, отправленных методом \u003cstrong>POST\u003c/strong>, сообщением является тело запроса. Для \u003cstrong>GET\u003c/strong> — строка параметров;\u003c/p>\u003c/li>\u003cli>\u003cp>При вычислении HMAC следует использовать кодировку \u003cstrong>UTF8\u003c/strong>;\u003c/p>\u003c/li>\u003cli>\u003cp>Хэш вычисляется функцией \u003cstrong>SHA256\u003c/strong>;\u003c/p>\u003c/li>\u003cli>\u003cp>В качестве ключа используется API Secret, который можно получить в личном кабинете;\u003c/p>\u003c/li>\u003cli>\u003cp>Вычисленное значение передается в кодировке \u003cstrong>base64\u003c/strong>.\u003c/p>\u003c/li>\u003c/ul>\u003cp>\u003ca href=\"https://www.jokecamp.com/blog/examples-of-creating-base64-hashes-using-hmac-sha256-in-different-languages/\" target=\"_blank\" rel=\"noopener noreferrer\">Примеры вычисления HMAC\u003c/a> на разных языках программирования.\u003c/p>\u003cp>Адреса, с которых система отправляет уведомления — \u003cstrong>185.98.81.0/28\u003c/strong>, \u003cstrong>87.251.91.160/27\u003c/strong>, \u003cstrong>46.46.175.96/27\u003c/strong>, \u003cstrong>46.46.168.160/27\u003c/strong>, \u003cstrong>162.55.174.97/32\u003c/strong> и \u003cstrong>91.216.178.243/32\u003c/strong>.\u003c/p>\u003caside class=\"api-callout warning\" role=\"note\">\u003cstrong class=\"callout-label\">Внимание\u003c/strong>\u003cp>В связи с мировыми трендами и выявленными уязвимостями вынуждены отказаться от поддержки протокола SSL3. Поддержка закончилась 8 июня 2020 г.\u003c/p>\u003c/aside>\u003cp>Для вас это означает, что:\u003c/p>\u003cul>\u003cli>\u003cp>Если вы не используете Pay/Check/Fail/Confirm/Refund/Recurrent/Cancel уведомления, то делать ничего не нужно;\u003c/p>\u003c/li>\u003cli>\u003cp>Если вы используете хотя бы одно из этих уведомлений, то нужно проверить какие протоколы шифрования https поддерживает ваш сервер. Если ваш сервер поддерживает только SSL3, то нужно обновить его минимум до TLS 1.1. Ещё лучше будет если обновить до TLS 1.3. В крайнем случае вы можете перевести уведомления на http-протокол.\u003c/p>\u003c/li>\u003c/ul>\u003cp>Более подробно \u003ca href=\"https://www.ssl.com/ru/%D1%80%D1%83%D0%BA%D0%BE%D0%B2%D0%BE%D0%B4%D1%81%D1%82%D0%B2%D0%BE/%D0%BE%D1%82%D0%BA%D0%BB%D1%8E%D1%87%D0%B8%D1%82%D1%8C-tls-1-0-%D0%B8-1-1-apache-nginx/\" target=\"_blank\" rel=\"noopener noreferrer\">как отказаться от SSL3\u003c/a>. После 8 июня https-уведомления на сервера, поддерживающие только SSL3, могут не доставляться.\u003c/p>\u003ch2 id=\"просмотр-настроек-уведомлений\">Просмотр настроек уведомлений\u003c/h2>\u003cp>Метод просмотра настроек уведомлений с указанием типа уведомления.\u003c/p>\u003cp>\u003cstrong>Адрес метода:\u003c/strong>\u003cbr>https://api.cloudpayments.ru/site/notifications/{Type}/get\u003c/p>\u003cp>\u003cstrong>Параметры запроса:\u003c/strong>\u003c/p>\u003cdiv class=\"api-table-scroll\" tabindex=\"0\" aria-label=\"Таблица\">\u003ctable>\u003ctr>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Параметр\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Формат\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Применение\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Описание\u003c/p>\u003c/th>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Type\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Тип уведомления: Check/Pay/Fail и т.д. (см. \u003ca href=\"https://developers.cloudpayments.ru/#tipy-operatsiy\" target=\"_blank\" rel=\"noopener noreferrer\">справочник\u003c/a>)\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Пример ответа\u003c/strong> на запрос для \u003ca href=\"https://developers.cloudpayments.ru/#pay\" target=\"_blank\" rel=\"noopener noreferrer\">Pay\u003c/a>-уведомления на адрес:\u003cbr>https://api.cloudpayments.ru/site/notifications/pay/get\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>json\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-8\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-8\" class=\"language-json\">{\n    &quot;Model&quot;: {\n        &quot;IsEnabled&quot;: true,\n        &quot;Address&quot;: &quot;http://example.com&quot;,\n        &quot;HttpMethod&quot;: &quot;POST&quot;,\n        &quot;Encoding&quot;: &quot;UTF8&quot;,\n        &quot;Format&quot;: &quot;CloudPayments&quot;\n    },\n    &quot;Success&quot;: true,\n    &quot;Message&quot;: null}\u003c/code>\u003c/pre>\u003c/div>\u003ch2 id=\"изменение-настроек-уведомлений\">Изменение настроек уведомлений\u003c/h2>\u003cp>Метод изменения настроек уведомлений.\u003c/p>\u003cp>\u003cstrong>Адрес метода:\u003c/strong>\u003cbr>https://api.cloudpayments.ru/site/notifications/{Type}/update\u003c/p>\u003cp>\u003cstrong>Параметры запроса:\u003c/strong>\u003c/p>\u003cdiv class=\"api-table-scroll\" tabindex=\"0\" aria-label=\"Таблица\">\u003ctable>\u003ctr>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Параметр\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Формат\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Применение\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Описание\u003c/p>\u003c/th>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Type\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Тип уведомления: Pay/Fail и т.д., кроме Check-уведомления (см. \u003ca href=\"https://developers.cloudpayments.ru/#tipy-operatsiy\" target=\"_blank\" rel=\"noopener noreferrer\">справочник\u003c/a>)\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>IsEnabled\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Bool\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Если значение true — то уведомление включено. Значение по умолчанию — false\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Address\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный, если \u003ccode>IsEnabled=false\u003c/code>, в противном случае обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Адрес для отправки уведомлений (для HTTPS-схемы необходим валидный SSL-сертификат)\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>HttpMethod\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>HTTP-метод для отправки уведомлений. Возможные значения: GET, POST. Значение по умолчанию — GET\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Encoding\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Кодировка уведомлений. Возможные значения: UTF8, Windows1251. Значение по умолчанию — UTF8\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Format\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Формат уведомлений. Возможные значения: CloudPayments, QIWI, RT. Значение по умолчанию — CloudPayments\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Пример запроса\u003c/strong> для \u003ca href=\"https://developers.cloudpayments.ru/#pay\" target=\"_blank\" rel=\"noopener noreferrer\">Pay\u003c/a>-уведомления на адрес:\u003cbr>https://api.cloudpayments.ru/site/notifications/pay/update:\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>json\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-9\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-9\" class=\"language-json\">{\n    &quot;IsEnabled&quot;: true,\n    &quot;Address&quot;: &quot;http://example.com&quot;,\n    &quot;HttpMethod&quot;: &quot;GET&quot;,\n    &quot;Encoding&quot;: &quot;UTF8&quot;,\n    &quot;Format&quot;: &quot;CloudPayments&quot;}\u003c/code>\u003c/pre>\u003c/div>\u003cp>\u003cstrong>Пример ответа:\u003c/strong>\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>json\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-10\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-10\" class=\"language-json\">{&quot;Success&quot;:true,&quot;Message&quot;:null}\u003c/code>\u003c/pre>\u003c/div>\u003cp>\u003cbr>\u003c/p>\u003c/div>","toc":[{"id":"check","title":"Check","level":2},{"id":"pay","title":"Pay","level":2},{"id":"fail","title":"Fail","level":2},{"id":"confirm","title":"Confirm","level":2},{"id":"refund","title":"Refund","level":2},{"id":"recurrent","title":"Recurrent","level":2},{"id":"cancel","title":"Cancel","level":2},{"id":"проверка-уведомлений","title":"Проверка уведомлений","level":2},{"id":"просмотр-настроек-уведомлений","title":"Просмотр настроек уведомлений","level":2},{"id":"изменение-настроек-уведомлений","title":"Изменение настроек уведомлений","level":2}]},"tech/methods/tpay":{"id":"tech/methods/tpay","title":"T-Pay","group":"tech","html":"\u003cdiv class=\"imported-api\">\u003cp>\u003cbr>\u003c/p>\u003cfigure style=\"text-align:center\">\u003cimg src=\"static/img/editor/9390bd4f340bb5521e828e0db6942badb490f0c0c21154839f0d2946cea91f0e.png\" alt=\"tpay.png\" style=\"width:100%;max-width:100%;height:auto\">\u003c/figure>\u003cp>CloudPayments предлагает метод оплаты в один клик T-Pay. Покупатель может выбрать любой счет для списания в приложении «Т-Банк», а также копить кэшбэк Т-Банк для последующих покупок.\u003c/p>\u003cp>Оплаты по T-Pay можно принимать через SDK. Доступна реализация как через платёжную форму CloudPayments, так и отдельной кнопкой.\u003c/p>\u003cp>Подробнее см. в разделе документации:\u003c/p>\u003cul>\u003cli>\u003cp>SDK для \u003ca href=\"https://developers.cloudpayments.ru/#sdk-dlya-ios\" target=\"_blank\" rel=\"noopener noreferrer\">iOS\u003c/a>\u003c/p>\u003c/li>\u003cli>\u003cp>SDK для \u003ca href=\"https://developers.cloudpayments.ru/#sdk-dlya-android\" target=\"_blank\" rel=\"noopener noreferrer\">Android\u003c/a>\u003c/p>\u003c/li>\u003c/ul>\u003ch2 id=\"получение-ссылки-на-оплату\">Получение ссылки на оплату\u003c/h2>\u003ch3 id=\"opisanie\">\u003cstrong>Описание\u003c/strong>\u003c/h3>\u003cp>Метод для получения платёжной ссылки для перенаправления клиента в мобильное приложение банка. В ответе вернётся параметр QrUrl с URL-адресом для перенаправления клиента.\u003c/p>\u003cp>Для проведения платежа, клиента надо перенаправить на полученный URL-адрес.\u003c/p>\u003ch3 id=\"adres-metoda\">\u003cstrong>Адрес метода\u003c/strong>\u003c/h3>\u003cp>\u003ca href=\"https://api.cloudpayments.ru/payments/qr/tinkoffpay/link\" target=\"_blank\" rel=\"noopener noreferrer\">https://api.cloudpayments.ru/payments/qr/tinkoffpay/link\u003c/a>\u003c/p>\u003cp>\u003cbr>\u003c/p>\u003ch3 id=\"parametry-zaprosa\">\u003cstrong>Параметры запроса\u003c/strong>\u003c/h3>\u003cp>\u003cbr>\u003c/p>\u003cdiv class=\"api-table-scroll\" tabindex=\"0\" aria-label=\"Таблица\">\u003ctable style=\"table-layout:fixed;width:825px;min-width:0\">\u003ccolgroup>\u003ccol style=\"width:180px\">\u003ccol style=\"width:180px\">\u003ccol style=\"width:180px\">\u003ccol style=\"width:285px\">\u003c/colgroup>\u003ctr>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Параметр\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Формат\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Применение\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Описание\u003c/p>\u003c/th>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>publicId\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Идентификатор сайта, который находится в ЛК\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Amount\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>decimal\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Cумма платежа в валюте, разделитель точка. Количество не нулевых знаков после точки – 2\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Currency\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Валюта: RUB (см. \u003ca href=\"https://developers.cloudpayments.ru/#spisok-valyut\" target=\"_blank\" rel=\"noopener noreferrer\">справочник\u003c/a>)\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Scheme\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>enum string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Схема проведения платежа (см. \u003ca href=\"https://developers.cloudpayments.ru/#vidy-operatsiy\" target=\"_blank\" rel=\"noopener noreferrer\">Виды операций\u003c/a>).\u003cbr>Возможные значения: \u003ccode>0\u003c/code> - одностадийная оплата \u003ccode>1\u003c/code> - двухстадийная оплата\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Browser\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Название браузера клиента на основании userAgent браузера.\u003cbr>Пример значения: \u003ccode>Chrome\u003c/code>, \u003ccode>Firefox\u003c/code>, \u003ccode>MIUI Browser\u003c/code>, \u003ccode>Opera\u003c/code>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Os\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Операционная система устройства плательщика.\u003cbr>Пример значения: \u003ccode>Android\u003c/code>, \u003ccode>iOS\u003c/code>, \u003ccode>Windows\u003c/code>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Webview\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>bool\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Признак открытия браузера в режиме webview.\u003cbr>Возможные значения: \u003ccode>true\u003c/code> - для оплат через webview \u003ccode>false\u003c/code> - для оплат без webview\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Device\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>enum string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Признак устройства плательщика.\u003cbr>Возможные значения:\u003cbr>\u003ccode>MobileApp\u003c/code> - вызов оплаты из мобильного приложения\u003cbr>\u003ccode>DesktopWeb\u003c/code> - вызов оплаты из браузера с десктопа\u003cbr>\u003ccode>Mobile\u003c/code> - вызов из браузера с мобильного устройства\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>SuccessRedirectUrl\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Url для перенаправления клиента после успешной оплаты.\u003cbr>После проведения платежа, клиент будет перенаправлен на указанный адрес из мобильного приложения Банка.\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>FailRedirectUrl\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Url для перенаправления клиента после неуспешной оплаты.\u003cbr>После проведения платежа, клиент будет перенаправлен на указанный адрес из мобильного приложения Банка.\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>IpAddress\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>IP-адрес плательщика\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>AccountId\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Идентификатор пользователя\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Email\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>E-mail плательщика\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>InvoiceId\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Номер счёта или заказа\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Description\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Назначение платежа в свободной форме\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>JsonData\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>json\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Любые другие данные, которые будут связаны с транзакцией, в том числе \u003ca href=\"https://developers.cloudpayments.ru/#rekurrentnye-platezhi-podpiska\" target=\"_blank\" rel=\"noopener noreferrer\">инструкции\u003c/a> для создания подписки или формирования \u003ca href=\"https://developers.cloudpayments.ru/#format-peredachi-dannyh-dlya-onlayn-cheka\" target=\"_blank\" rel=\"noopener noreferrer\">онлайн-чека\u003c/a> должны обёртываться в объект \u003ccode>cloudpayments\u003c/code>. Мы зарезервировали названия следующих параметров и отображаем их содержимое в реестре операций, выгружаемом в Личном Кабинете: \u003ccode>name\u003c/code>, \u003ccode>firstName\u003c/code>, \u003ccode>middleName\u003c/code>, \u003ccode>lastName\u003c/code>, \u003ccode>nick\u003c/code>, \u003ccode>phone\u003c/code>, \u003ccode>address\u003c/code>, \u003ccode>comment\u003c/code>, \u003ccode>birthDate\u003c/code>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>TtlMinutes\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>int\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Время в течение которого будет доступна оплата по QR-коду / ссылке на оплату.\u003cbr>Если параметр не передан, оплату можно будет совершить в течение 24 часов.\u003cbr>\u003cstrong>Важно:\u003c/strong>\u003cbr>- Значение 0 считается \u003cstrong>некорректным\u003c/strong> и может привести к ошибке обработки запроса.\u003cbr>- Если временное ограничение не требуется, параметр следует \u003cstrong>не передавать\u003c/strong> или явно указать как \u003ccode>null\u003c/code>.\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>SaveCard\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>bool\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Признак сохранения карточного токена для проведения оплаты по сохранённой карте (см. \u003ca href=\"https://developers.cloudpayments.ru/#oplata-po-tokenu-rekarring\" target=\"_blank\" rel=\"noopener noreferrer\">Оплата по токену (рекарринг)\u003c/a>).\u003cbr>Возможные значения: \u003ccode>true\u003c/code> - после успешной оплаты будет возвращён карточный токен, \u003ccode>false\u003c/code> - токен не будет возвращаться (по-умолчанию)\u003cbr>Параметр SaveCard обрабатывается только при включении настройки &quot;Сохранение токена карты&quot; в Личном Кабинете. При включении настройки &quot;Сохранять принудительно&quot;, параметр SaveCard будет игнорироваться.\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cp>В ответ сервер возвращает JSON с тремя составляющими:\u003c/p>\u003cul>\u003cli>\u003cp>поле \u003cstrong>success\u003c/strong> — результат запроса;\u003c/p>\u003c/li>\u003cli>\u003cp>поле \u003cstrong>message\u003c/strong> — описание ошибки;\u003c/p>\u003c/li>\u003cli>\u003cp>объект \u003cstrong>model\u003c/strong> — расширенная информация.\u003c/p>\u003c/li>\u003c/ul>\u003cp>\u003cbr>\u003c/p>\u003cp>Возможные варианты ответа:\u003c/p>\u003col start=\"1\">\u003cli>\u003cp>Некорректно сформирован запрос:\u003c/p>\u003cul>\u003cli>\u003cp>\u003cstrong>success\u003c/strong> — false\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>message\u003c/strong> — описание ошибки\u003c/p>\u003c/li>\u003c/ul>\u003c/li>\u003cli>\u003cp>Транзакция отклонена:\u003c/p>\u003cul>\u003cli>\u003cp>\u003cstrong>success\u003c/strong> — false\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>model\u003c/strong> — информация о транзакции и код ошибки\u003c/p>\u003c/li>\u003c/ul>\u003c/li>\u003cli>\u003cp>Транзакция принята:\u003c/p>\u003cul>\u003cli>\u003cp>\u003cstrong>success\u003c/strong> — true\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>model\u003c/strong> — информация о транзакции\u003c/p>\u003c/li>\u003c/ul>\u003c/li>\u003c/ol>\u003caside class=\"api-callout \" role=\"note\">\u003cstrong class=\"callout-label\">Информация\u003c/strong>\u003cp>Результат запроса (поле Success) не отражает статус транзакции, а лишь свидетельствует об успешности/неуспешности запроса API. Статус транзакции отражен в дополнительном поле Status, также его можно узнать в результате получения \u003ca href=\"https://developers.cloudpayments.ru/#uvedomleniya\" target=\"_blank\" rel=\"noopener noreferrer\">уведомлений\u003c/a>. Интерпретацию статусов транзакции смотрите в \u003ca href=\"https://developers.cloudpayments.ru/#statusy-operatsiy\" target=\"_blank\" rel=\"noopener noreferrer\">справочнике\u003c/a>.\u003c/p>\u003c/aside>\u003cp>\u003cbr>\u003c/p>\u003ch3 id=\"primer-zaprosa\">\u003cstrong>Пример запроса\u003c/strong>\u003c/h3>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>json\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-1\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-1\" class=\"language-json\">{\n    &quot;Amount&quot; : &quot;10&quot;,\n    &quot;AccountId&quot;: &quot;someId&quot;,\n    &quot;InvoiceId&quot;: 12345,\n    &quot;Browser&quot; : &quot;Chrome&quot;,\n    &quot;Currency&quot; : &quot;RUB&quot;,\n    &quot;Device&quot; : &quot;Mobile&quot;,\n    &quot;Description&quot; : &quot;Оплата по T-Pay&quot;,\n    &quot;Email&quot; : &quot;email@email.com&quot;,\n    &quot;IpAddress&quot;: &quot;123.123.123.123&quot;,\n    &quot;Os&quot; : &quot;Android&quot;,\n    &quot;Scheme&quot; : 1,\n    &quot;TtlMinutes&quot; : 30,\n    &quot;SuccessRedirectUrl&quot; : &quot;https://cp.ru&quot;,\n    &quot;FailRedirectUrl&quot; : &quot;https://cp.ru&quot;,\n    &quot;Webview&quot; : false\n}\u003c/code>\u003c/pre>\u003c/div>\u003cp>\u003cbr>\u003c/p>\u003ch3 id=\"primer-otveta\">\u003cstrong>Пример ответа\u003c/strong>\u003c/h3>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>json\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-2\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-2\" class=\"language-json\">{\n    &quot;Model&quot;: {\n        &quot;QrUrl&quot;: &quot;{URL-адрес}&quot;,         // будет содержать url-адрес для редиректа\n        &quot;QrImage&quot;: null,                \n        &quot;TransactionId&quot;: 11122233344,   // id транзакции CloudPayments\n        &quot;MerchantOrderId&quot;: &quot;12345&quot;,     // переданный InvoiceId\n        &quot;ProviderQrId&quot;: &quot;&quot;,\n        &quot;Amount&quot;: 10,\n        &quot;Message&quot;: &quot;Created&quot;,     \n        &quot;IsTest&quot;: false\n    },\n    &quot;Success&quot;: true,\n    &quot;Message&quot;: null\n}\u003c/code>\u003c/pre>\u003c/div>\u003cp>\u003cbr>\u003c/p>\u003c/div>","toc":[{"id":"получение-ссылки-на-оплату","title":"Получение ссылки на оплату","level":2},{"id":"opisanie","title":"Описание","level":3},{"id":"adres-metoda","title":"Адрес метода","level":3},{"id":"parametry-zaprosa","title":"Параметры запроса","level":3},{"id":"primer-zaprosa","title":"Пример запроса","level":3},{"id":"primer-otveta","title":"Пример ответа","level":3}]},"tech/methods/sbp":{"id":"tech/methods/sbp","title":"СБП","group":"tech","html":"\u003cdiv class=\"imported-api\">\u003cfigure style=\"text-align:center\">\u003cimg src=\"static/img/editor/5dfbc8d62aed89191399a4f9e66b398cc4d120399f512bb9b9c0d3e34d2b07e4.png\" alt=\"сбп.png\" style=\"width:100%;max-width:100%;height:auto\">\u003c/figure>\u003cp>CloudPayments предлагает метод оплаты в один клик через СБП. Покупатель может выбрать любой банк для списания через Систему Быстрых Платежей.\u003c/p>\u003ch2 id=\"получение-ссылки-для-оплаты\">Получение ссылки для оплаты\u003c/h2>\u003ch3 id=\"opisanie\">\u003cstrong>Описание\u003c/strong>\u003c/h3>\u003cp>Метод для получения платёжной ссылки для перенаправления клиента в мобильное приложение банка. В ответе вернётся параметр \u003ccode>QrUrl\u003c/code> с URL-адресом для перенаправления клиента.\u003c/p>\u003cp>Для проведения платежа, клиента надо перенаправить на полученный URL-адрес.\u003c/p>\u003ch3 id=\"adres-metoda\">\u003cstrong>Адрес метода\u003c/strong>\u003c/h3>\u003cp>\u003ca href=\"https://api.cloudpayments.ru/payments/qr/sbp/link\" target=\"_blank\" rel=\"noopener noreferrer\">https://api.cloudpayments.ru/payments/qr/sbp/link\u003c/a>\u003c/p>\u003ch3 id=\"sbp-parametry-zaprosa\">\u003cstrong>Параметры запроса\u003c/strong>\u003c/h3>\u003cdiv class=\"api-table-scroll\" tabindex=\"0\" aria-label=\"Таблица\">\u003ctable style=\"table-layout:fixed;width:928px;min-width:0\">\u003ccolgroup>\u003ccol style=\"width:168px\">\u003ccol style=\"width:107px\">\u003ccol style=\"width:178px\">\u003ccol style=\"width:475px\">\u003c/colgroup>\u003ctr>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Параметр\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Формат\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Применение\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Описание\u003c/p>\u003c/th>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>PublicId\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Идентификатор сайта, который находится в ЛК\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Amount\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Decimal\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Cумма платежа в рублях, разделитель точка. Количество не нулевых знаков после точки – 2\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Currency\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Валюта: RUB (см. \u003ca href=\"https://developers.cloudpayments.ru/#spisok-valyut\" target=\"_blank\" rel=\"noopener noreferrer\">справочник\u003c/a>)\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Description\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Назначение платежа в свободной форме\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>AccountId\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Идентификатор пользователя, используется для создания подписки и получения токена\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Email\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>E-mail плательщика, на который будет отправлена квитанция об оплате\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>JsonData\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Json\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Любые другие данные, которые будут связаны с транзакцией, в том числе \u003ca href=\"https://developers.cloudpayments.ru/#rekurrentnye-platezhi-podpiska\" target=\"_blank\" rel=\"noopener noreferrer\">инструкции\u003c/a> для создания подписки или формирования \u003ca href=\"https://developers.cloudpayments.ru/#format-peredachi-dannyh-dlya-onlayn-cheka\" target=\"_blank\" rel=\"noopener noreferrer\">онлайн-чека\u003c/a> должны обёртываться в объект \u003ccode>cloudpayments\u003c/code>. Мы зарезервировали названия следующих параметров и отображаем их содержимое в реестре операций, выгружаемом в Личном Кабинете: \u003ccode>name\u003c/code>, \u003ccode>firstName\u003c/code>, \u003ccode>middleName\u003c/code>, \u003ccode>lastName\u003c/code>, \u003ccode>nick\u003c/code>, \u003ccode>phone\u003c/code>, \u003ccode>address\u003c/code>, \u003ccode>comment\u003c/code>, \u003ccode>birthDate\u003c/code>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>InvoiceId\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Идентификатор/номер счета.\u003cbr>\u003cbr>Приходит в Check-уведомлении и может использоваться для сверки номера заказа\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Scheme\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Enum String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Схема проведения платежа (см. \u003ca href=\"https://developers.cloudpayments.ru/#vidy-operatsiy\" target=\"_blank\" rel=\"noopener noreferrer\">Виды операций\u003c/a>).\u003cbr>Возможные значения: \u003ccode>charge\u003c/code> - одностадийная оплата\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>SuccessRedirectUrl\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Url для перенаправления клиента после успешной оплаты. После проведения платежа, клиент будет перенаправлен на указанный адрес из мобильного приложения Банка.\u003cbr>Значение должно содержать не более 1024 символов, быть в кодировке ASCII и соответствовать формату спецификации RFC-3986.\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>IpAddress\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>IP-адрес плательщика\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Os\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Операционная система устройства плательщика.\u003cbr>Пример значения: \u003ccode>Android\u003c/code>, \u003ccode>iOS\u003c/code>, \u003ccode>Windows\u003c/code>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Webview\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Bool\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Признак открытия браузера в режиме webview.\u003cbr>Возможные значения: \u003ccode>true\u003c/code> - для оплат через webview \u003ccode>false\u003c/code> - для оплат без webview\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Device\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Признак устройства плательщика.\u003cbr>Возможные значения:\u003cbr>\u003ccode>MobileApp\u003c/code> - вызов оплаты из мобильного приложения\u003cbr>\u003ccode>DesktopWeb\u003c/code> - вызов оплаты из браузера с десктопа\u003cbr>\u003ccode>Mobile\u003c/code> - вызов из браузера с мобильного устройства\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Browser\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Название браузера клиента на основании userAgent браузера.\u003cbr>Пример значения: \u003ccode>Chrome\u003c/code>, \u003ccode>Firefox\u003c/code>, \u003ccode>MIUI Browser\u003c/code>, \u003ccode>Opera\u003c/code>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>TtlMinutes\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Int\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Время, в течение которого будет доступна оплата по QR-коду / ссылке на оплату. Минимальное допустимое значение - &quot;1&quot;. Максимальное допустимое значение - &quot;129 600&quot; (90 дней).\u003cbr>Если параметр не передан, оплату можно будет совершить в течение 72 часов.\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>SaveCard\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Bool\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Флаг необходимости сохранить карту для привязки счета в Национальной Системе Платежных Карт для последующих списаний\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>IsTest\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Bool\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязательный\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Флаг тестового режима оплаты\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cp>В ответ сервер возвращает JSON с тремя составляющими:\u003c/p>\u003cul>\u003cli>\u003cp>поле \u003cstrong>success\u003c/strong> — результат запроса;\u003c/p>\u003c/li>\u003cli>\u003cp>поле \u003cstrong>message\u003c/strong> — описание ошибки;\u003c/p>\u003c/li>\u003cli>\u003cp>объект \u003cstrong>model\u003c/strong> — расширенная информация.\u003c/p>\u003c/li>\u003c/ul>\u003cp>Возможные варианты ответа:\u003c/p>\u003col start=\"1\">\u003cli>\u003cp>Некорректно сформирован запрос:\u003c/p>\u003cul>\u003cli>\u003cp>\u003cstrong>success\u003c/strong> — false\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>message\u003c/strong> — описание ошибки\u003c/p>\u003c/li>\u003c/ul>\u003c/li>\u003cli>\u003cp>Транзакция отклонена:\u003c/p>\u003cul>\u003cli>\u003cp>\u003cstrong>success\u003c/strong> — false\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>model\u003c/strong> — информация о транзакции и код ошибки\u003c/p>\u003c/li>\u003c/ul>\u003c/li>\u003cli>\u003cp>Транзакция принята:\u003c/p>\u003cul>\u003cli>\u003cp>\u003cstrong>success\u003c/strong> — true\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>model\u003c/strong> — информация о транзакции\u003c/p>\u003c/li>\u003c/ul>\u003c/li>\u003c/ol>\u003cp>\u003cbr>\u003c/p>\u003caside class=\"api-callout \" role=\"note\">\u003cstrong class=\"callout-label\">Информация\u003c/strong>\u003cp>Результат запроса (поле Success) не отражает статус транзакции, а лишь свидетельствует об успешности/неуспешности запроса API. Статус транзакции отражен в дополнительном поле Status, также его можно узнать в результате получения \u003ca href=\"https://developers.cloudpayments.ru/#uvedomleniya\" target=\"_blank\" rel=\"noopener noreferrer\">уведомлений\u003c/a>. Интерпретацию статусов транзакции смотрите в \u003ca href=\"https://developers.cloudpayments.ru/#statusy-operatsiy\" target=\"_blank\" rel=\"noopener noreferrer\">справочнике\u003c/a>.\u003c/p>\u003c/aside>\u003ch3 id=\"sbp-primer-zaprosa\">\u003cstrong>Пример запроса\u003c/strong>\u003c/h3>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>json\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-1\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-1\" class=\"language-json\">{\n    &quot;PublicId&quot;: &quot;test_api_00000000000000000000002&quot;,\n    &quot;Amount&quot;: 1000,\n    &quot;Currency&quot;: &quot;RUB&quot;,\n    &quot;Description&quot;: &quot;Оплата по СБП&quot;,\n    &quot;AccountId&quot;: &quot;email@email.com&quot;,\n    &quot;Email&quot;: &quot;email@email.com&quot;,\n    &quot;InvoiceId&quot;: &quot;order_no4009&quot;,\n    &quot;Scheme&quot;: &quot;charge&quot;,\n    &quot;SuccessRedirectUrl&quot;: &quot;https://cp.ru&quot;,\n    &quot;SaveCard&quot;: false\n}\u003c/code>\u003c/pre>\u003c/div>\u003ch3 id=\"primer-otveta\">\u003cstrong>Пример ответа\u003c/strong>\u003c/h3>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>json\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-2\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-2\" class=\"language-json\">{\n    &quot;Model&quot;: {\n        &quot;QrUrl&quot;: &quot;{URL-адрес}&quot;, // будет содержать url-адрес для редиректа\n        &quot;QrImage&quot;: null,                \n        &quot;TransactionId&quot;: 11122233344, // id транзакции CloudPayments\n        &quot;MerchantOrderId&quot;: &quot;12345&quot;, // переданный InvoiceId\n        &quot;ProviderQrId&quot;: &quot;BB1S004HCK9PFD0F996RJI3208UE&quot;, // переданный id платежной ссылки или QR-кода\n        &quot;Amount&quot;: 10,\n        &quot;Message&quot;: &quot;Created&quot;,     \n        &quot;IsTest&quot;: false\n    },\n    &quot;Success&quot;: true,\n    &quot;Message&quot;: null\n}\u003c/code>\u003c/pre>\u003c/div>\u003cp>\u003cbr>\u003c/p>\u003ch2 id=\"получение-qr-кода-для-оплаты\">Получение QR-кода для оплаты\u003c/h2>\u003cp>\u003cstrong>Описание\u003c/strong>\u003c/p>\u003cp>Метод для получения QR-кода для отображения клиенту в браузере. В ответе вернётся параметр \u003ccode>QrImage\u003c/code> с QR-кодом в формате imagePNG для отображения клиенту. Значение строки закодировано в base64.\u003c/p>\u003cp>Для проведения платежа, клиента надо перенаправить на полученный URL-адрес. Клиенты могут оплатить неограниченное число раз по одному QR СБП.\u003c/p>\u003cp>\u003cstrong>Адрес метода\u003c/strong>\u003c/p>\u003cp>\u003ca href=\"https://api.cloudpayments.ru/payments/qr/sbp/image\" target=\"_blank\" rel=\"noopener noreferrer\">https://api.cloudpayments.ru/payments/qr/sbp/image\u003c/a>\u003c/p>\u003cp>\u003cstrong>Параметры запроса\u003c/strong>\u003c/p>\u003cp>\u003ca href=\"https://developers.cloudpayments.ru/#sbp-parametry-zaprosa\" target=\"_blank\" rel=\"noopener noreferrer\">см. СБП. Получение ссылки для оплаты\u003c/a>\u003c/p>\u003cp>\u003cstrong>Пример запроса\u003c/strong>\u003c/p>\u003cp>\u003ca href=\"https://developers.cloudpayments.ru/#sbp-primer-zaprosa\" target=\"_blank\" rel=\"noopener noreferrer\">см. СБП. Получение ссылки для оплаты\u003c/a>\u003c/p>\u003cp>\u003cstrong>Пример ответа\u003c/strong>\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>json\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-3\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-3\" class=\"language-json\">{\n    &quot;Model&quot;: {\n        &quot;QrUrl&quot;: null, \n        &quot;QrImage&quot;: {string}, // будет содержать png в base64\n        &quot;TransactionId&quot;: 11122233344, // id транзакции CloudPayments\n        &quot;MerchantOrderId&quot;: &quot;12345&quot;, // переданный InvoiceId\n        &quot;ProviderQrId&quot;: &quot;BB1S004HCK9PFD0F996RJI3208UE&quot;, // переданный id платежной ссылки или QR-кода\n        &quot;Amount&quot;: 10,\n        &quot;Message&quot;: &quot;Created&quot;,     \n        &quot;IsTest&quot;: false\n    },\n    &quot;Success&quot;: true,\n    &quot;Message&quot;: null\n} \u003c/code>\u003c/pre>\u003c/div>\u003ch2 id=\"spisok-uchastnikov-sbp\">Список участников СБП\u003c/h2>\u003cp>\u003cstrong>Описание\u003c/strong>\u003c/p>\u003cp>Метод возвращает список участников системы быстрых платежей (СБП) с учетом платформы клиента. Источником данных является \u003ca href=\"https://widget.cbrpay.ru/#membersListV2\" target=\"_blank\" rel=\"noopener noreferrer\">API виджета СБП\u003c/a>.\u003c/p>\u003cp>\u003cstrong>Заголовок \u003c/strong>\u003c/p>\u003cp>\u003ca href=\"https://api.cloudpayments.ru/sbp/v2/banks/info\" target=\"_blank\" rel=\"noopener noreferrer\">https://api.cloudpayments.ru/sbp/v2/banks/info\u003c/a>\u003c/p>\u003cp>\u003cstrong>Параметры запрос \u003c/strong>\u003c/p>\u003cdiv class=\"api-table-scroll\" tabindex=\"0\" aria-label=\"Таблица\">\u003ctable style=\"table-layout:fixed;width:860px;min-width:0\">\u003ccolgroup>\u003ccol style=\"width:175px\">\u003ccol style=\"width:99px\">\u003ccol style=\"width:159px\">\u003ccol style=\"width:427px\">\u003c/colgroup>\u003ctr>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Параметр\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Тип\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Обязательность\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Назначение\u003c/p>\u003c/th>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>AccountId\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Нет\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Идентификатор аккаунта пользователя\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>IsRenewSubscription\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>boolean\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Нет\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Флаг обновления подписки\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>JsonData\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Нет\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Дополнительные данные в формате JSON\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Platform\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Нет\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Платформа клиента (desktop, ios, android)\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>PublicTerminalId\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Да\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Публичный идентификатор терминала мерчанта\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>SaveCard\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>boolean\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Нет\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Флаг необходимости сохранения карты\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Token\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Нет\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Токен карты для сохранения\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Пример запроса\u003c/strong>\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>json\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-4\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24
