ect\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Кастомное поле\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязателен\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>customField.name\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Название кастомного поля\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязателен\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>customField.value\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Значение кастомного поля\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязателен\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003ch2 id=\"список-товаров\">Список товаров\u003c/h2>\u003cp>В случае, когда необходимо передавать одни и те же товары в разных процессах (например, при формировании чека) необходимо дополнительно передавать следующие параметры в рамках объекта \u003ccode>items\u003c/code>:\u003c/p>\u003cdiv class=\"api-table-scroll\" tabindex=\"0\" aria-label=\"Таблица\">\u003ctable style=\"table-layout:fixed;width:853px;min-width:0\">\u003ccolgroup>\u003ccol style=\"width:208px\">\u003ccol style=\"width:222px\">\u003ccol style=\"width:252px\">\u003ccol style=\"width:171px\">\u003c/colgroup>\u003ctr>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Параметр\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Тип\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Описание\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Обязательность\u003c/p>\u003c/th>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>id\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>ID товара\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязателен\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>name\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Название товара\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязателен\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>count\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>decimal\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Количество позиций товара\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязателен\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>price\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>decimal\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Цена одной позиции товара\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Обязателен\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cp>В случае, если список товаров передан, то система будет искать аналогичный товар в списке товаров чека. Поиск осуществляется по значению параметра \u003ccode>id\u003c/code>, поэтому позиция товара в чеке должна иметь аналогичный \u003ccode>id\u003c/code>, как и в списке товаров.\u003c/p>\u003ch2 id=\"section-41501fca-c2d1-4e54-ba8b-45412e525a0a\">\u003cstrong>Настройка безопасной сделки \u003c/strong>\u003c/h2>\u003cp>Для настройки \u003ca href=\"https://developers.cloudpayments.ru/#bezopasnaya-sdelka\" target=\"_blank\" rel=\"noopener noreferrer\">безопасной сделки\u003c/a> необходимо дополнительно передавать следующие параметры в рамках объекта \u003ccode>escrow\u003c/code>:\u003c/p>\u003cdiv class=\"api-table-scroll\" tabindex=\"0\" aria-label=\"Таблица\">\u003ctable>\u003ctr>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Параметр\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Тип\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Описание\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Обязательность\u003c/p>\u003c/th>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>startAccumulation\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>bool\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Флаг начала накопления\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязателен\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>accumulationId\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>string\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>ID накопления на стороне банка\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязателен\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>escrowType\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>String\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Тип счета. Доступные значения: \u003ccode>NToOne\u003c/code>, \u003ccode>OneToN\u003c/code>, \u003ccode>NToN\u003c/code>\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Необязателен\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003ch2 id=\"callbacks\">\u003cstrong>События (коллбэки)\u003c/strong>\u003c/h2>\u003cp>Коллбэки – события, которые срабатывают при определенных условиях. Условия формирования событий (коллбэков):\u003c/p>\u003cp>\u003cstrong>oncomplete\u003c/strong>\u003c/p>\u003cp>Получение финального статуса по транзакции, так же после возврата к списку методов, если была неуспешная оплата\u003c/p>\u003cp>Формат ответа у данного коллбэка зависит от успеха платежа и совпадает с форматом \u003cstrong>widgetResult\u003c/strong> в случае успешной или неуспешной оплаты соответственно\u003c/p>\u003cp>\u003cstrong>function(widgetResult)\u003c/strong>\u003c/p>\u003cp>Завершение работы виджета. \u003cstrong>widgetResult\u003c/strong> – объект результата\u003c/p>\u003cp>Возможные значения \u003ccode>type\u003c/code>:\u003c/p>\u003cp>– \u003ccode>cancel\u003c/code> — закрытие без оплаты\u003cbr>– \u003ccode>payment\u003c/code> — оплата\u003cbr>– \u003ccode>installment\u003c/code> — рассрочка\u003cbr>– \u003ccode>error\u003c/code> — ошибка при оплате\u003c/p>\u003cp>Возможные значения \u003ccode>status\u003c/code>:\u003c/p>\u003cp>– \u003ccode>success\u003c/code> — успех\u003cbr>– \u003ccode>fail\u003c/code> — неудача при оплате\u003cbr>– \u003ccode>appointment\u003c/code> — авторизация по рассрочке\u003cbr>– \u003ccode>reject\u003c/code> — отклоненная по рассрочке\u003cbr>– \u003ccode>cancel\u003c/code> — отмененная транзакция\u003c/p>\u003cp>\u003cstrong>Пример без оплаты (type = cancel)\u003c/strong>\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>json\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-8\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-8\" class=\"language-json\">{\n    &quot;type&quot;: &quot;cancel&quot;\n}\u003c/code>\u003c/pre>\u003c/div>\u003cp>\u003cstrong>Пример для успеха (status = success):\u003c/strong>\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>json\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-9\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-9\" class=\"language-json\">{\n   &quot;type&quot;:&quot;payment&quot;,\n   &quot;data&quot;:{\n      &quot;transactionId&quot;:3059300327\n   },\n   &quot;status&quot;:&quot;success&quot;\n}\u003c/code>\u003c/pre>\u003c/div>\u003cp>\u003cstrong>Пример для отклоненной транзакции (status = fail):\u003c/strong>\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>json\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-10\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-10\" class=\"language-json\">{\n   &quot;type&quot;:&quot;error&quot;,\n   &quot;data&quot;:{\n      &quot;transactionId&quot;:3192600857,\n      &quot;ReasonCode&quot;:5206\n   },\n   &quot;message&quot;:&quot;3-D Secure авторизация не пройдена&quot;,\n   &quot;status&quot;:&quot;fail&quot;\n}\u003c/code>\u003c/pre>\u003c/div>\u003cp>\u003cbr>\u003c/p>\u003c/div>","toc":[{"id":"начало-работы-с-виджетом","title":"Начало работы с виджетом","level":2},{"id":"section-1807c054-4763-49bf-bfca-7be4e7f41234","title":"Демо-конструктор","level":2},{"id":"mobilnyy-vidzhet","title":"Мобильный виджет","level":2},{"id":"ustanovka-vidzheta","title":"Установка виджета","level":2},{"id":"section-25653198-9a24-4e85-a086-6d86c4c0f141","title":"Минимальный скрипт","level":3},{"id":"section-1a3f12ec-0b5c-4767-82ea-12636d40e947","title":"Полный скрипт и параметры","level":2},{"id":"section-a1e811f3-7fb1-4b48-8e8b-c2f0842ec60a","title":"Скрипт","level":3},{"id":"parametry","title":"Параметры","level":3},{"id":"рекуррентные-платежи","title":"Рекуррентные платежи","level":2},{"id":"параметры-кастомизации","title":"Параметры кастомизации","level":2},{"id":"данные-о-плательщике","title":"Данные о плательщике","level":2},{"id":"список-товаров","title":"Список товаров","level":2},{"id":"section-41501fca-c2d1-4e54-ba8b-45412e525a0a","title":"Настройка безопасной сделки ","level":2},{"id":"callbacks","title":"События (коллбэки)","level":2}],"type":"page","audience":"developer"},"tech/blocks":{"id":"tech/blocks","title":"Платежные блоки","group":"tech","html":"\u003cdiv class=\"imported-api\">\u003cp>PaymentBlocks — конструктор блоков, из которых можно собрать кастомную платежную форму. Вы можете сделать свой визуал формы\u003c/p>\u003cp>Форма оптимизирована для использования в любых браузерах и мобильных устройствах. Внутри блока открывается iframe, который гарантирует безопасность передачи карточных данных и не требует от ТСП сертификации для использования.\u003c/p>\u003cp>На форме поддерживаются все доступные в CloudPayments способы оплаты\u003c/p>\u003caside class=\"api-callout warning\" role=\"note\">\u003cstrong class=\"callout-label\">Внимание\u003c/strong>\u003cp>Контроль суммы при оплате необходимо осуществлять самостоятельно. Для проверки суммы можно использовать уведомления: \u003ca href=\"https://developers.cloudpayments.ru/#check\" target=\"_blank\" rel=\"noopener noreferrer\">Check\u003c/a> - для проверки суммы до оплаты, \u003ca href=\"https://developers.cloudpayments.ru/#pay\" target=\"_blank\" rel=\"noopener noreferrer\">Pay\u003c/a> - для проверки суммы после оплаты\u003c/p>\u003c/aside>\u003cfigure style=\"text-align:center\">\u003cimg src=\"https://developers.cloudpayments.ru/images/payment-blocks-5f56bd91.png\" alt=\"payment-blocks\" style=\"width:100%;max-width:100%;height:auto\">\u003c/figure>\u003ch2 id=\"demo-konstruktora\">\u003cstrong>Демо платежных блоков\u003c/strong>\u003c/h2>\u003cp>Демонстрация работы платежных блоков представлена \u003ca href=\"https://widget.cloudpayments.ru/app/demo\" target=\"_blank\" rel=\"noopener noreferrer\">по ссылке\u003c/a>.\u003c/p>\u003cp>Для тестирования можно использовать как \u003ca href=\"https://developers.cloudpayments.ru/#testirovanie\" target=\"_blank\" rel=\"noopener noreferrer\">тестовые карточные данные\u003c/a>, так и реальные. Списания денежных средств не произойдет.\u003c/p>\u003ch2 id=\"otlichiya-ot-vidzheta\">\u003cstrong>Отличия от виджета\u003c/strong>\u003c/h2>\u003cdiv class=\"api-table-scroll\" tabindex=\"0\" aria-label=\"Таблица\">\u003ctable style=\"table-layout:fixed;width:857px;min-width:0\">\u003ccolgroup>\u003ccol style=\"width:297px\">\u003ccol style=\"width:274px\">\u003ccol style=\"width:286px\">\u003c/colgroup>\u003ctr>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Ключевые отличия\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Виджет\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Платежные блоки\u003c/p>\u003c/th>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Способ отображения\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Попап\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Встраиваемый на страницу. Можно встроить прямо на страницу заказа\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Кастомизация\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Возможность полной кастомизации\u003cbr>Так же 2 предустановленных темы:\u003c/p>\u003cul>\u003cli>\u003cp>modern – темная\u003c/p>\u003c/li>\u003cli>\u003cp>classic – светлая (используется по умолчанию)\u003c/p>\u003c/li>\u003c/ul>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Возможность полноценной кастомизации\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Возможность закрытия клиентом\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Есть\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Нет\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Отображение суммы оплаты и назначения платежа\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Да\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Нет\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Возможность обновлять данные платежа\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Нет\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Есть возможность подстраивать оплату под изменения в корзине\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Возможность принудительного unmount\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Нет\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Есть через blocksApp.unmount()\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003ch2 id=\"ustanovka-platezhnogo-konstruktora\">\u003cstrong>Установка платежного конструктора\u003c/strong>\u003c/h2>\u003cp>Для установки платежных блоков необходимо прописать на сайте скрипт в раздел \u003cstrong>head\u003c/strong>:\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>text\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-1\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-1\" class=\"language-text\">&lt;script src=&quot;https://widget.cloudpayments.ru/bundles/paymentblocks.js&quot;&gt;&lt;/script&gt;\n\u003c/code>\u003c/pre>\u003c/div>\u003cp>Далее необходимо создать DOM-элемент для маунта\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>text\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-2\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-2\" class=\"language-text\">&lt;div id=&quot;element&quot;&gt;&lt;/div&gt;\n\u003c/code>\u003c/pre>\u003c/div>\u003cp>Объявить платежнык блоки (подробнее параметры описываются ниже)\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>text\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-3\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-3\" class=\"language-text\">var blocksApp = new cp.PaymentBlocks(\n    initializationParams, // параметры инициализации -- обязательны для работы конструктора\n    customizationParams // параметры кастомизации -- необязательны\n);\n\u003c/code>\u003c/pre>\u003c/div>\u003cp>И замаунтить его в созданный DOM-элемент\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>text\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-4\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-4\" class=\"language-text\">blocksApp.mount(document.getElementById(&quot;element&quot;));\n\u003c/code>\u003c/pre>\u003c/div>\u003ch2 id=\"demontazh-iz-dom\">\u003cstrong>Демонтаж из DOM\u003c/strong>\u003c/h2>\u003cp>В любой момент можно демонтировать платежные блоки из DOM-элемента\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>text\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-5\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-5\" class=\"language-text\">blocksApp.unmount();\n\u003c/code>\u003c/pre>\u003c/div>\u003ch2 id=\"sobytiya-kollbeki\">\u003cstrong>События (коллбэки)\u003c/strong>\u003c/h2>\u003cp>Есть возможность получать уведомления о событиях и обрабатывать их, для этого необходимо добавить обработчики соответствующих событий\u003c/p>\u003cp>Для этого после маунта необходимо добавить следующий блок (или его часть)\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>text\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-6\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-6\" class=\"language-text\">blocksApp.on(&quot;destroy&quot;, () =&gt; { // Подписка на событие ошибки оплаты\n     console.log(&quot;destroy&quot;);\n});\nblocksApp.on(&quot;success&quot;, (result) =&gt; { // Подписка на событие успешного результата оплаты\n     console.log(&quot;success&quot;, result);\n});\nblocksApp.on(&quot;fail&quot;, (result) =&gt; { // Подписка на событие уничтожения платежного конструктора\n     console.log(&quot;fail&quot;, result);\n});\n\u003c/code>\u003c/pre>\u003c/div>\u003ch2 id=\"vidy-kollbekov\">\u003cstrong>Виды коллбэков\u003c/strong>\u003c/h2>\u003cdiv class=\"api-table-scroll\" tabindex=\"0\" aria-label=\"Таблица\">\u003ctable style=\"table-layout:fixed;width:1067px;min-width:0\">\u003ccolgroup>\u003ccol style=\"width:252px\">\u003ccol style=\"width:239px\">\u003ccol style=\"width:268px\">\u003ccol style=\"width:308px\">\u003c/colgroup>\u003ctr>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Коллбэк\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Условия для формирования\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Код инициализации коллбэка\u003c/p>\u003c/th>\u003cth colspan=\"1\" rowspan=\"1\">\u003cp>Примеры result\u003c/p>\u003c/th>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>destroy\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Уничтожение платежного блока через unmount()\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003ccode>blocksApp.on(&quot;destroy&quot;, () =&gt; { console.log(&quot;destroy&quot;); });\u003c/code>\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>отсутствует\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>success\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Успешная оплата\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003ccode>blocksApp.on(&quot;success&quot;, (result) =&gt; { console.log(&quot;success&quot;, result); });\u003c/code>\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003ccode>{ &quot;type&quot;: &quot;payment&quot;, &quot;data&quot;: { &quot;transactionId&quot;: 4581868029 }, &quot;status&quot;: &quot;success&quot; }\u003c/code>\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>fail\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>Неуспешная оплата\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003ccode>blocksApp.on(&quot;fail&quot;, (result) =&gt; { console.log(&quot;fail&quot;, result); });\u003c/code>\u003c/p>\u003c/td>\u003ctd colspan=\"1\" rowspan=\"1\">\u003cp>\u003ccode>{ &quot;type&quot;: &quot;payment&quot;, &quot;data&quot;: { &quot;transactionId&quot;: 4581867878, &quot;ReasonCode&quot;: 5206 }, &quot;message&quot;: &quot;3-D Secure авторизация не пройдена&quot;, &quot;status&quot;: &quot;fail&quot; }\u003c/code>\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003ch2 id=\"otpiska\">\u003cstrong>Отписка\u003c/strong>\u003c/h2>\u003cp>Так же доступна возможность отписки от событий\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>text\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-7\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-7\" class=\"language-text\">// Отписка от событий успешного результата оплаты\nblocksApp.off(&quot;success&quot;);\n\n// Отписка от событий ошибки оплаты\nblocksApp.off(&quot;fail&quot;);\n\n// Отписка от события уничтожения платежного конструктора\nblocksApp.off(&quot;destroy&quot;);\n\u003c/code>\u003c/pre>\u003c/div>\u003ch2 id=\"primer-vyzova-paymentblocks\">\u003cstrong>Пример вызова PaymentBlocks\u003c/strong>\u003c/h2>\u003cp>Пример вызова функции PaymentBlocks со всеми параметрами\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>text\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-8\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-8\" class=\"language-text\">var blocksApp = new cp.PaymentBlocks(\n{  // initializationParams -- параметры инициализации (обязательны для работы конструктора)\n   &quot;publicTerminalId&quot;:&quot;test_api_00000000000000000000002&quot;,\n   &quot;paymentSchema&quot;:&quot;Dual&quot;,\n   &quot;description&quot;:&quot;Тестовая оплата&quot;,\n   &quot;amount&quot;:100.53,\n   &quot;currency&quot;:&quot;RUB&quot;,\n   &quot;externalId&quot;:&quot;123&quot;,\n   &quot;accountId&quot;:&quot;123&quot;,\n   &quot;receiptEmail&quot;:&quot;&quot;,\n   &quot;emailBehavior&quot;:&quot;Optional&quot;,\n   &quot;language&quot;:&quot;ru-RU&quot;\n},\n{  // customizationParams -- параметры кастомизации (не обязательны)\n   &quot;appearance&quot;:{\n      &quot;colors&quot;:{\n         &quot;primaryButtonColor&quot;:&quot;#1dfa05&quot;,\n         &quot;primaryHoverButtonColor&quot;:&quot;#da1ef7&quot;,\n         &quot;primaryButtonTextColor&quot;:&quot;#da1ef7&quot;,\n         &quot;primaryButtonHoverTextColor&quot;:&quot;#da1ef7&quot;,\n         &quot;activeInputColor&quot;:&quot;#da1ef7&quot;,\n         &quot;inputBackground&quot;:&quot;#da1ef7&quot;,\n         &quot;inputColor&quot;:&quot;#1dfa05&quot;,\n         &quot;inputBorderColor&quot;:&quot;#f20505&quot;,\n         &quot;titleColor&quot;:&quot;#da1ef7&quot;,\n         &quot;textColor&quot;:&quot;#1dfa05&quot;,\n         &quot;errorColor&quot;:&quot;#ee05fa&quot;,\n         &quot;skeletonBackground&quot;:&quot;#ee05fa&quot;\n      },\n      &quot;borders&quot;:{\n         &quot;radius&quot;:&quot;80px&quot;\n      }\n   },\n   &quot;components&quot;:{\n      &quot;paymentButton&quot;:{\n         &quot;text&quot;:&quot;Свое название кнопки&quot;,\n         &quot;fontSize&quot;:&quot;40px&quot;\n      },\n      &quot;paymentForm&quot;:{\n         &quot;labelFontSize&quot;:&quot;5px&quot;,\n         &quot;activeLabelFontSize&quot;:&quot;50px&quot;,\n         &quot;fontSize&quot;:&quot;90px&quot;\n      }\n   }\n});\n\u003c/code>\u003c/pre>\u003c/div>\u003cp>Параметры инициализации \u003cstrong>обязательны\u003c/strong> для работы конструктора. Параметры кастомизации \u003cstrong>необязательны\u003c/strong> для работы конструктора\u003c/p>\u003ch2 id=\"parametry-initsializatsii\">\u003cstrong>Параметры инициализации\u003c/strong>\u003c/h2>\u003cp>Параметры инициализации такие же, как для \u003ca href=\"https://developers.cloudpayments.ru/#parametry\" target=\"_blank\" rel=\"noopener noreferrer\">виджета\u003c/a>. \u003cstrong>Обязательны\u003c/strong> для работы конструктора\u003c/p>\u003ch2 id=\"obnovlenie-platezhnogo-konstruktora\">\u003cstrong>Обновление платежного конструктора\u003c/strong>\u003c/h2>\u003cp>Можно обновить все или часть параметров конструктора\u003c/p>\u003cp>Для этого нужно вызвать метод update, передав туда те же параметры (или их часть), которые использовались для инициализации платежного конструктора.\u003c/p>\u003cp>Обновляются только переданные параметры. При обновлении обязательных параметров нет, все параметры необязательные\u003c/p>\u003cp>Со списком параметров можно \u003ca href=\"https://developers.cloudpayments.ru/#parametry\" target=\"_blank\" rel=\"noopener noreferrer\">ознакомиться тут\u003c/a>\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>json\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-9\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1\"/>\u003c/svg>\u003csvg class=\"api-copy-success\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/svg>\u003cspan class=\"api-copy-status\" data-copy-status role=\"status\" aria-live=\"polite\">\u003c/span>\u003c/button>\u003c/div>\u003cpre class=\"api-code\">\u003ccode id=\"editor-code-9\" class=\"language-json\">blocksApp.update(initializationParams);\u003c/code>\u003c/pre>\u003c/div>\u003ch2 id=\"kastomizatsiya-platezhnogo-konstruktora\">\u003cstrong>Кастомизация платежного конструктора\u003c/strong>\u003c/h2>\u003cp>Кастомизация осуществляется с помощью передачи следующего набора параметров. Необходимо передать этот объект вторым аргументом в функцию инициализации конструктора\u003c/p>\u003cp>Параметры \u003cstrong>необязательны\u003c/strong> для работы конструктора\u003c/p>\u003cdiv class=\"api-code-block\">\u003cdiv class=\"api-code-toolbar\">\u003cspan>text\u003c/span>\u003cbutton type=\"button\" data-copy-code=\"editor-code-10\" data-copy-state=\"ready\" aria-label=\"Копировать код\" title=\"Копировать код\">\u003csvg class=\"api-copy-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\">\u003crect x=\"9\" y=\"9\" width=\"11\" hei
