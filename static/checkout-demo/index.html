<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout sandbox</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f9fc;color:#182c48;font:14px/1.5 system-ui,sans-serif;padding:24px}h2{font-size:21px;margin:0 0 6px;letter-spacing:-.03em}p{color:#6c7d93;margin:0 0 22px}.layout{display:grid;grid-template-columns:1fr 1fr;gap:24px}.panel{background:white;border:1px solid #e1e8f1;border-radius:16px;padding:24px}label{display:block;font-size:13px;font-weight:600;margin:16px 0 6px}input,textarea{font:inherit;width:100%;border:1px solid #ced8e5;border-radius:9px;padding:12px;color:#182c48;background:white}input:focus,textarea:focus{outline:3px solid #d2e7ff;border-color:#2879df}.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}button{font:600 14px system-ui;cursor:pointer;border:0;border-radius:9px;padding:13px 18px;background:#176be5;color:white}button:disabled{cursor:wait;opacity:.6}#c_generate{width:100%;margin-top:22px}.pill{display:inline-block;background:#eaf3ff;color:#2864a8;border-radius:20px;padding:4px 9px;font-size:11px;letter-spacing:.06em;font-weight:700;margin-bottom:14px}textarea{resize:vertical;min-height:200px;font:12px/1.6 ui-monospace,monospace;background:#f8fafd;margin:12px 0}#status{margin:14px 0 0;min-height:21px;overflow-wrap:anywhere}body[data-state=error] #status{color:#b3263c}body[data-state=success] #status{color:#147452}#copy{background:#eaf2ff;color:#175cbc}#result-placeholder{padding:50px 0;color:#8795a8;text-align:center;border:1px dashed #d9e2ed;border-radius:10px}small{display:block;color:#7b889b;margin-top:16px} [hidden]{display:none!important}@media(max-width:620px){body{padding:14px}.layout{grid-template-columns:1fr;gap:14px}.panel{padding:20px}textarea{min-height:140px}}
</style></head><body data-state="default">
<div class="layout"><section class="panel"><span class="pill">CHECKOUT · TEST MODE</span><h2 data-en="Test card" data-ru="Тестовая карта">Test card</h2><p data-en="Generate a cryptogram. No payment will be made." data-ru="Создайте криптограмму. Оплата не выполняется.">Generate a cryptogram. No payment will be made.</p>
<form id="checkoutForm" autocomplete="off"><label for="c_cardnumber" data-en="Card number" data-ru="Номер карты">Card number</label><input id="c_cardnumber" value="4242 4242 4242 4242" inputmode="numeric" maxlength="23" required>
<div class="row"><div><label for="c_expire" data-en="Expiry · MM/YY" data-ru="Срок · ММ/ГГ">Expiry · MM/YY</label><input id="c_expire" inputmode="numeric" maxlength="5" required></div><div><label for="c_secret">CVV</label><input id="c_secret" type="password" inputmode="numeric" value="777" maxlength="4" required></div></div>
<button id="c_generate" type="submit" data-en="Generate cryptogram" data-ru="Создать криптограмму">Generate cryptogram</button><div id="status" role="status" aria-live="polite"></div><small data-en="Use test card details only. Card details stay inside this frame." data-ru="Используйте тестовые данные карты. Поля карты остаются внутри этой формы.">Use test card details only. Card details stay inside this frame.</small></form></section>
<section class="panel"><span class="pill">RESULT</span><h2 data-en="Payment cryptogram" data-ru="Криптограмма">Payment cryptogram</h2><p data-en="The encrypted result will appear here." data-ru="Здесь появится результат шифрования.">The encrypted result will appear here.</p><div id="result-placeholder" data-en="Ready when you are" data-ru="Готово к тестированию">Ready when you are</div><div id="result" hidden><label for="c_crypto" data-en="Generated cryptogram" data-ru="Созданная криптограмма">Generated cryptogram</label><textarea id="c_crypto" readonly spellcheck="false"></textarea><button id="copy" type="button" data-en="Copy cryptogram" data-ru="Скопировать криптограмму">Copy cryptogram</button></div></section></div>
<script src="form.js"></script></body></html>
